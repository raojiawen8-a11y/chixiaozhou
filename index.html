100}},{"名":"揭其收气","文":"他当众开口，说内场收气违了御供的本意。人群骚动，内场有人出来打圆场，最后分了三成气给外场。外场的人感激他，他从此进不得任何内场。","果":{"声望":8,"灵石":120,"因果":-2,"道心":2}}]},{"id":"zhongzhou_042","题":"天牢旧师","类":"人情","重":2,"域":["zhongzhou"],"境界":[1,8],"段":["{地点}在宫城西南，牢里关的多是修士。{人物}花钱买通了牢头，只为见一个人：二十年前教过他吐纳的老先生，如今罪名是私通外域，判的是秋后。","老人在牢里盘腿坐着，指尖还在地上画着什么。见了他先笑，说：你是来问那卷{功法}的下落吧。他不承认，老人也不追，只把地上画的圈抹了一半。","牢外传来换班的梆子。老人说，秋后那日，牢里会有人来接他，接他的人穿的是{宗门}的衣服，来的是要他的口，不是要他的命。他抬起头，眼睛里一点也不像要死的人。"],"择":[{"名":"劫牢救人","文":"他当夜劫了牢，背着老人从水门出城。追兵跟了三十里，老人半途跳下去，把追兵引进山谷，自己没再上来。他活着出了{地名}，也再没找到那卷功法的下落。","果":{"修为":140,"因果":-2,"寿元":-10,"道心":3,"声望":-6}},{"名":"受其托付","文":"老人把那卷功法的存放处说了，只托他办一件事：把牢里那半页纸烧了。他照办，纸灰飘起来的时候，他觉得自己的路忽然清晰了。他出城后修行一日千里。","果":{"悟性":4,"修为":200,"因果":-1,"灵石":-100}},{"名":"报官领赏","文":"他把老人的话报给了镇抚司，得了三百灵石和一份差事。秋后老人果然没死，被接去了别处。他从此不敢再向任何人提这位先生，只每年往牢里送一壶酒。","果":{"灵石":300,"魔念":2,"因果":3,"道心":-3}}]},{"id":"zhongzhou_043","题":"九门虎符","类":"争斗","重":3,"域":["zhongzhou"],"境界":[2,9],"段":["九门虎符一分为九，一符管一门，合九符方能调京营。{人物}在{地点}当差十年，得了一支残符，符上缺了一角，是当年兵乱时崩掉的。他一直以为那只是块废铁。","这一日，一位自称替{宗门}办事的{人物}找上门，愿以重金收那支残符。他说不卖，那人便笑了，说这符是三十年前从{地点}的死人堆里捡的，本就该还。","夜里他被人围在巷里，来的一共七人，个个用刀，巷上的{天象}正压着瓦脊。他摸出残符，符身竟自发烫，把巷墙照得明亮。远处九门的方向传来三声钟响，比平日早了整整两个时辰。"],"择":[{"名":"持符调兵","文":"他举符去了最近的城门，守将看了符，竟真的点了三十人随他。那七人被围在巷中，为首的自尽。事后兵部查了半月，符是真的，只是不在册上。他保住了符，也被人盯上了。","果":{"声望":12,"修为":100,"因果":3,"气血":-50}},{"名":"卖符脱身","文":"他把残符丢给那人，趁乱翻墙走了。那符换来的钱够他修行到筑基圆满，也够他把这一夜完全忘掉。只有钟声每夜都响，早了两个时辰。","果":{"灵石":600,"道心":-2,"因果":1}},{"名":"碎符投河","文":"他把残符扔进了{地点}的水里。七人扑上来，他挨了三刀，倒在地上装死。符沉了，兵乱的事再没人追。他活了，只是每逢大雨，身上那三道疤都会先疼。","果":{"气血":-90,"寿元":9,"因果":-2,"道心":2}}]},{"id":"zhongzhou_044","题":"龙脉归土","类":"秘境","重":2,"域":["zhongzhou"],"境界":[4,13],"段":["{地名}的龙脉走到第九道便要结穴，穴在{地点}地底三百丈，龙气厚重得能把人压成肉泥。{人物}花了十二年才摸到穴口，凭的是一卷{功法}和一身的耐心。","穴里的土是{灵材}，颜色赤中带金，抓一把能听见细响。他知道这一捧土能抵十年修为，也知道取土一寸，地上的城便要裂一尺。头顶传来城中的钟鼓声，声里有{天象}。","他把{器物}按回袖里，同行的人却已经伸手了，指尖触土，整条手臂当场干瘪。他退半步，看见穴壁上刻着一行极旧的题字：取者代守。这四个字下面并列着二十七个名字，最后一个是空的。"],"择":[{"名":"留名代守","文":"他咬破指头把名字补了上去，从此留在穴中守脉。三年后出洞，一身修为深得看不出底，头上却已经白了一半。城里的人说他成了地仙，只有他知道那是坐出来的。","果":{"修为":400,"寿元":-25,"悟性":3,"因果":-3,"声望":10}},{"名":"取土即走","文":"他抓了一把土便走，身后山壁崩塌，整座城震了三条街。土炼进丹田，修为连跨两境，只是此后他再听不见钟声：所有钟鼓在他耳里都是空的。","果":{"修为":500,"灵石":200,"因果":4,"魔念":2,"气血":-60}},{"名":"封穴退守","文":"他把穴口重新封死，用残余的机缘换来城中十年安稳。回去时他什么也没得，只多了一个念头：这条脉总得有人守着。此后他四处游走，凡见地脉有漏便补一补。","果":{"道心":3,"因果":-4,"悟性":2,"声望":6}}]},{"id":"zhongzhou_045","题":"运朝法门","类":"修行","重":2,"域":["zhongzhou"],"境界":[2,10],"段":["{功法}不炼己身，只炼一方气运，修到深处，一人之气可与一州相连。{人物}得了一卷残篇，卷首有一句话：此法非臣非主者不可修。他既不是臣，也离主远得很。","他试着修了一夜，第二日出门，巷口的{人物}对他格外客气，连摊上买菜都不收钱。第三日他明白过来：这一夜他借来的，是整条巷子的运。巷子里的狗先死了。","残篇的最后一段被人裁去。他去找裁书的人，寻到{地点}的一处书铺，铺主只留了一句话：修到三层，气运便认人不认己。铺外的{天象}正浓，他已经停不下来了。"],"择":[{"名":"续修至三","文":"他不管不顾，一口气修到了第三层。此后他所到之处风调雨顺，家中却接连出事，亲族一个一个地凋零。三年后他成了京中人人敬重的活神仙，也成了孤家寡人。","果":{"修为":400,"声望":15,"寿元":-15,"因果":4,"道心":-2}},{"名":"散运归邻","文":"他把自己借来的气运一处一处还回去，还给那条巷子的每一户。还到最后一家，他已是个普通人。巷子里的孩子后来记得，那年冬天有个瘦子天天来帮着挑水。","果":{"道心":4,"因果":-4,"修为":-80,"声望":6,"寿元":6}},{"名":"献法与人","文":"他把残篇献给{宗门}，换了一处清静的洞府。此法入宗之后，十年间养出七个不得善终的天才。他在洞府里闭门不出，听着外面的动静，一日也没敢说自己不知情。","果":{"灵石":300,"因果":3,"悟性":2,"道心":-1}}]},{"id":"zhongzhou_046","题":"太虚闭关","类":"修行","重":3,"域":["zhongzhou"],"境界":[1,9],"段":["{地名}后山有九处闭关洞，洞门一闭便与外界断绝。{人物}得了三年之期，进洞之前，执事收走了他的{器物}，只留一枚木牌和半袋御供灵米。","第一年他坐得踏实，第二年心魔来了，来的不是妖物，是{人物}的脸——那个当年替他顶罪的老实人，在洞里一遍遍问他：你凭什么还活着。第三年他几乎见到了{天象}。","洞门开的那日，他已经分不清哪一刻是真。那位{人物}站在门口，问他这三日过得如何。三日的说法让他猛然清醒：外头只过了三天，而洞里已经过了三年。"],"择":[{"名":"如实陈心","文":"他把三年里所见一一说了，一句不瞒。执事听完点了点头，说此关算是过了。他的修为不见长，心境却稳得像一块石头，从此再难被外物动摇。","果":{"道心":4,"悟性":2,"修为":100}},{"名":"隐瞒魔念","文":"他说一切顺遂。执事看了他很久，放他下山。他此后修为涨得极快，快得不像自己挣来的。三年后那老实人的坟头长出一株不该长的白花。","果":{"修为":300,"魔念":2,"因果":2,"道心":-2}},{"名":"重返洞中","文":"他请求再闭一次，把没看清的东西看完。执事不许，他就在洞外坐了三个月。第三个月月末，他在雪里忽然笑了，起身便走，从此再没提过那三年。","果":{"悟性":3,"寿元":-6,"道心":2,"灵石":-40}}]},{"id":"zhongzhou_047","题":"白衣巷夜","类":"市井","重":4,"域":["zhongzhou"],"境界":[0,4],"段":["{地点}夜里最热闹。这条巷子里卖的东西见不得光：改过的路引、闻着像真的假丹、还有替人写讼状的老秀才。{人物}来买一味{灵材}，卖家约在三更，说手里有货。","三更过后，巷口的灯笼一盏一盏地灭。他等到第四盏灭时，一个{人物}来了，怀里抱着个包裹，包裹上的血迹还没干透。那人把包往他手里一塞，说你既来了，就替我走一趟。","巷尾已经有人在等。他低头看手里的包，布角露出一枚{器物}的边，那东西他认得，是三日前{地点}丢的那一件。灯笼全灭了，只剩巷口一点月光。"],"择":[{"名":"替他走一趟","文":"他把包裹揣好，绕了三条小巷从水门出城。交货的人给了他六十灵石，还替他修了一次经脉。他从此常做这种活，道上的人叫他一声老成。","果":{"灵石":120,"修为":80,"因果":2,"声望":2}},{"名":"弃包就走","文":"他把包丢在地上，转身踏进旁边的米铺。第二日巷子里死了一个人，就是他方才见的那位。他什么也没说，也再没去过白衣巷的夜。","果":{"道心":-1,"寿元":5,"因果":1}},{"名":"将包送官","文":"他把包送到镇抚司，得了一笔赏。那一夜白衣巷被封了半月，二十几个摊子散了。他在城里的名声不坏，只是从此没人再肯把货卖给他。","果":{"灵石":180,"声望":6,"因果":-2,"魔念":1}}]},{"id":"zhongzhou_048","题":"诸子论道","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[0,8],"段":["{宗门}里存着九州最全的旧书，从星象到农桑，从雷法到蛊术，都有人读。今日论道的题目是：仙凡之间，该不该有一条界限。{人物}坐在角落里，是替先生们添茶的那个。","论到午时，{地点}外的更鼓刚过一遍，一位老博士拍案而起，说：界限若没有了，凡人拿什么活。对面一位年轻学子冷冷答道：界限本来就有，只是挡着的从来不是这门里的人，是门外的人。满堂一时无话。","{天象}从天井落下来，落在那堆旧书上。他添茶添到最后一席，听见有人低声说：这些话只能在这里说，出了这道门，便都是错话。话音落了，所有的眼睛看向门外的{地点}。"],"择":[{"名":"开口附议","文":"他把茶壶放下，说了自己的话：界限是人定的，人也有被换掉的一天。堂上一静，随后老博士抚掌大笑，破格让他进了外舍。他从此要按日缴话，话都要写成文章。","果":{"悟性":3,"声望":6,"灵石":-60}},{"名":"默然添茶","文":"他一声不出，添完了茶便退下。那夜他回到自己屋里，把堂上听来的话一句一句默写下来。十年后他开了自己的学塾，讲的就是这一夜听来的东西。","果":{"悟性":2,"道心":2,"灵石":80}},{"名":"录文售外","文":"他把众人论道的原话整理成册，卖给了一家书坊。书卖得很好，三家宗门的批文也都下来了。他在京中得了一处宅子，也从此与这些人再无往来。","果":{"灵石":400,"魔念":2,"声望":-5,"因果":2}}]},{"id":"zhongzhou_049","题":"御街灯会","类":"人情","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["上元这夜，{地点}两侧挂起三千盏纸灯，灯面上画的都是自家的亡人与未生人，据说照一夜，来年便少一场丧事。{人物}提着一盏自己糊的灯，挤在人堆里，看灯上看灯，看的其实是那些画在灯上的脸。","灯会走到一半，街上忽然静了。前面一队人抬着九盏无画的素灯过来，灯下各挂一枚{器物}，走在前头的是一位{人物}，看服色是宫里出来的。卖糖的老翁低声说：那是招魂灯，一年只点一次，为的是把不该留在城里的东西引出去。","队伍走到他跟前，最末那盏素灯忽然转向他，灯芯亮了一瞬。抬灯的{人物}回头看了他一眼，什么也没说。四下的纸灯次第暗下去，只剩这九盏还亮着，而{天象}正好从城头压过来。"],"择":[{"名":"尾随素灯","文":"他提着灯跟了上去，一路跟到玄武门下。九盏灯在城门外绕了三圈，随即一齐熄灭，队伍里少了一个人。他回家数了数自己的灯，灯上不知何时多了一张不属于他的脸。","果":{"悟性":3,"因果":2,"气血":-20,"寿元":-4}},{"名":"熄灯避让","文":"他把自己手里的灯吹灭了，退到墙根。九盏素灯过去之后，街上重新热闹起来，纸灯一盏盏亮回去，好像什么都没发生。却是他不肯低了头。他记着那份闭灯的规矩，此后每年上元都不点灯。","果":{"道心":2,"寿元":6,"灵石":40}},{"名":"上前问话","文":"他伸手拦住抬灯的队伍，问这一盏为何朝他转。那位{人物}看了他半晌，说：灯不问人，人问灯，便要走一趟。他被带进宫里一处偏殿站到天亮，出来时什么也不记得，只多了一身的冷。","果":{"声望":4,"悟性":2,"气血":-40,"因果":1}}]},{"id":"zhongzhou_050","题":"封城三日","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[0,7],"段":["{天象}连了三日，钦天监的告示贴出「封城」。九门闭了八门，只剩宣阳门一道缝，门外的人进不来，门里的人出不去。{地点}的米价一个时辰涨一回，粮铺门前排的队伍拐了三个弯。","第四日清晨，{人物}奉命去城门下设棚分粥。粥棚刚支起来，便围上来几百人，其中一个抱着孩子的{人物}挤到最前，说她家里还有人在{宗门}当差，今日若不进去，那人便要被当逃兵处置。","守门的校尉按着刀，说无令不开，{地点}的鼓楼上却又敲了三下，人群往前涌了半步又停住。他手里那只勺还悬在锅上，粥在锅里咕嘟响，队尾有人在喊他，队首也有人跪下来。"],"择":[{"名":"开侧门放行","文":"他撬开侧门的闩，放了三十几个人进去。当夜镇抚司查下来，他挨了二十杖，削了差事。那抱着孩子的女人后来托人送了一双布鞋，鞋底纳得极密，他留了半生。","果":{"声望":8,"气血":-50,"因果":-2,"魔念":0}},{"名":"守令不发","文":"他站在原地，一勺一勺地把粥分完。当天夜里那女人的男人死在城外的乱军里。封城解了之后，他把那口粥锅卖了，从此不再接这种差事。","果":{"道心":-2,"灵石":60,"因果":2}},{"名":"另开东渠","文":"他记得东渠有条水道能容一人侧身而过，便把人群引去那里。三十几人过去了，水道上却留下一条湿痕，被人顺藤摸到了他头上。他挨了罚，也被上头记下了一个名字。","果":{"悟性":2,"声望":6,"因果":1,"灵石":-40}}]},{"id":"zhongzhou_051","题":"盗运之市","类":"市井","重":3,"域":["zhongzhou"],"境界":[1,7],"段":["{地点}的旧货摊上忽然多了一种新货：一只巴掌大的陶罐，罐口封着黄蜡，据说罐里装的是一州的气运。开价不高，买的人不少。{人物}买了三只，回家开了一只，罐里只有一缕凉气，散了。","第二日他去问摊主，摊子换了人。新摊主说这买卖做不得，前三日那摊子是位{人物}托的，罐子是从{宗门}的旧库流出来的，一共三百只。他这才明白：气运不假，只是每只罐里装的都是别人的运气。","第三日他夜里出门，见{地点}的井沿上摆着十只同样的陶罐，罐口的蜡都封着，罐身各贴一张名字。最末一只名字正是他自己。{天象}压着屋脊，井里传来极轻的水声。"],"择":[{"名":"尽数砸碎","文":"他把十只罐子一只一只砸了，砸到第九只时手上全是血。最后一只他留着没动，回家秤了秤气运，竟然一斤也没少。此后再有人卖这种货，他见一个砸一个。","果":{"声望":6,"因果":-3,"气血":-30,"道心":2}},{"名":"收罐转卖","文":"他把十只罐子搬回家，转手卖给了一个赌场老板，赚了五百灵石。那赌场此后三月赢遍全城，第四月一夜之间输光，连牌桌都被人抬走了。","果":{"灵石":500,"魔念":2,"因果":3,"声望":-4}},{"名":"顺罐查源","文":"他挑了贴着别人名字的那只带走，顺着罐底的记号查到旧库的一个老吏。老吏告诉他，三百只罐里装的是这一城三百户人家的运，谁买走，谁赎走。他把这话记下了。","果":{"悟性":4,"因果":1,"灵石":-60,"声望":4}}]},{"id":"zhongzhou_052","题":"午门问斩","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[1,8],"段":["秋后处决的名单贴在{地点}的墙上，一共十一个名字。{人物}挤在人群里看，看到第九个忽然不动了：那是个曾在{宗门}做过执事的老者，三十年前收留过他家一家老小。","行刑前的两个时辰，牢里准许见一面。老者见了他只笑，说自己不是冤的，只是当年签了一份账，账上有三个人名，如今那三个人都还活着。他把一枚旧{器物}塞过来，说：拿去换酒，别问。","午门外的鼓已经敲了第一通。他攥着那枚东西，指缝里都是汗。法场上跪着十一个人，围观的百姓挤到街尾。{天象}底下，监斩官抬了手，而这个时辰，还有一条无人看守的巷子通到法场后头。"],"择":[{"名":"劫刑救人","文":"他从后巷冲进法场，砍断老者的绳索。两人跑出三条街，老者却站住了，说你救的是我一条命，丢的是你一家。老者转身回去，第三通鼓时人头落地，他从此不敢再走午门。","果":{"修为":120,"因果":-2,"寿元":-12,"道心":3,"声望":-8}},{"名":"打听那账","文":"他没有动，只在散场后去了一趟{宗门}的旧档房，翻了三天，翻出那份账。账上三个名字如今都是大人物。他把账抄了一份收着，再没跟任何人提起老者。","果":{"悟性":3,"因果":2,"灵石":100,"道心":1}},{"名":"换酒收物","文":"他照着老者的话把东西换了酒，一个人喝到天亮。那枚东西转手卖了二百灵石，他用这笔钱进了京营。此后他每回经过午门，都要停下来站一会儿。","果":{"灵石":200,"道心":-1,"修为":60,"因果":1}}]},{"id":"zhongzhou_053","题":"紫金雷印","类":"机缘","重":2,"域":["zhongzhou"],"境界":[2,10],"段":["雷印是太虚道宗下山执罚的信物，一枚印便是一道雷罚之权，从不外借。{人物}在{地点}的旧货摊上看见一枚，印身紫金，缺了一角，摊主说是家中老人留下的镇纸，开价五十灵石。","他认得这东西，手指一触，印上的雷纹便轻轻一跳，把指尖烫出一层白。摊主脸色一变，把摊子收了要走。他知道这不是假的，也知道世上只有两位雷堂执事能补印，而这两位如今都在{宗门}。","当夜他揣着印出门，{天象}压着瓦檐。巷口已经有人等着，来的是一个穿灰衣的{人物}，一开口就问：这印是从哪里来的。他答不出，因为摊位已经空了，而那人袖口的纹，与印背的纹一样。"],"择":[{"名":"交还雷堂","文":"他把印送进了太虚山雷堂。执事验过印，沉默了很久，说这枚印是三十年前失的那一枚。他得了三百灵石与一块记名玉牌，也在宗中的名册上添了一笔，从此被看着。","果":{"灵石":300,"声望":8,"因果":-2,"悟性":1}},{"名":"留下自用","文":"他把印藏进枕下，夜里照着印上的纹路慢慢摸索。三年后他也能放出一点雷，只是每次出手之后，雷总要往人的心口走，不像道宗的雷那样干净。镇上开始有人说他半个身子已经入了魔障。","果":{"修为":320,"魔念":3,"因果":3,"声望":-8}},{"名":"当街售还","文":"他放出话来，谁肯出价便卖给谁。第二日灰衣人带了六百灵石来取，只留一句：这印不认人，认血。他收了钱，也从此在京城里被人当成一个能牵线的人，麻烦一件接一件。","果":{"灵石":600,"因果":2,"魔念":1,"声望":2}}]},{"id":"zhongzhou_054","题":"京营换防","类":"争斗","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["京营三年一换防，换防那夜九门皆闭，兵在城墙上走，甲叶碰甲叶。{人物}这一营本该守{地点}，临时却接到调令，要他们与另一营对调。传令的{人物}不说缘由，只说上头的令。","换防换到一半，两营的兵在城垛上撞上了，各说各接到的是真令，各持一枚{器物}。火光下两枚勘合对不上，一枚的刻痕深了半分。有人骂了一句，刀便出了鞘，城墙上顿时乱成一片。","{天象}把整段城墙照得惨白。他按住自己的刀，看见己方校尉正与对方低声说话，两人腰间都挂着同一家的牌子。他忽然明白：这不是换防，是有人趁夜把这一门换一个主人。"],"择":[{"名":"喝令归位","文":"他跳上城垛，把两边的旗都抢过来插在一处，喊了一声：对不上勘合便都别动。乱局慢慢止住，天亮后兵部来人查勘，两营主将各贬一级。他被提为副尉，也从此被两方都防着。","果":{"声望":10,"修为":80,"因果":-1,"气血":-30}},{"名":"随校尉行","文":"他没有出声，跟着自己的校尉走完了换防。第二日这门的兵换成了另一家的亲信。他升了一级，赏了五十灵石，只是从此不敢在城墙上多看一眼。","果":{"灵石":80,"声望":4,"因果":2,"道心":-2}},{"名":"夜报镇抚","文":"他趁乱下城，奔去镇抚司报讯。镇抚司来得极快，两营主将当场被锁。他立了功，也被人记恨，此后三年他每逢换防之期都要告病。","果":{"声望":8,"灵石":120,"因果":1,"气血":-40}}]},{"id":"zhongzhou_055","题":"皇商之争","类":"市井","重":3,"域":["zhongzhou"],"境界":[0,6],"段":["皇商的名额三年一批，批下来的可以直入宫市，一年做的生意抵别家十年。今年{地名}一带的皇商只批两家，报名的却有十七家。{人物}替其中一家跑腿，天天在{地点}外等消息。","第七日他在{地点}外等到了信：那家落选了，理由写得很客气，说「验资不足」。可他清楚这家铺子的库房，货堆得比谁都满。掌柜的把一本账推到他面前，说：你去查查，另一家凭什么入选。","查了三日，他查出另一家的担保人是一位{人物}，而这位大人的名下还挂着一间与{宗门}合股的货栈。{天象}从街上漫过来，他手里那本账压得手心生疼，因为这一查下去，两家的路都要断。"],"择":[{"名":"据账告发","文":"他把账送到了御史台。皇商之名重议，那位大人被罚了半年俸，落选的那家补了进来。他得了赏，也从此在商界里没人敢用，只落了个不怕事的名声。","果":{"声望":8,"灵石":200,"因果":1,"魔念":0}},{"名":"拿账换钱","文":"他把账送去给那位大人看。三日后他家掌柜的自动弃了名额，他得了一笔重谢，钱多得够他在城外置一座宅子。他搬进宅子那天，掌柜的在街对面看了他很久。","果":{"灵石":600,"魔念":2,"因果":2,"声望":-4}},{"名":"烧账不问","文":"他把账本烧了，回去说查不出什么。掌柜的长叹一声，第二日就把铺子收了。他失了差事，却在三年之后发现那位大人倒了，而当初收了铺子的人接了他的生意，还请他做了管事。","果":{"道心":2,"灵石":-50,"悟性":2,"寿元":4}}]},{"id":"zhongzhou_056","题":"观星雪夜","类":"修行","重":2,"域":["zhongzhou"],"境界":[2,11],"段":["下雪的夜里没人上{地点}，因为雪片落在星晷的碗里要一勺一勺地舀出来。{人物}今夜自愿值守，为的是借这一夜无人打扰，把{功法}里一直参不透的那一段读通。","读到三更，{天象}压在云后，碗里的水面忽然不动了，九枚银片齐齐偏向东南。他抬头看天，雪云如盖，一颗星也看不见。银片却在动，动得极慢，像有人在水底用手指推它们。","四更时分，{天象}的旧谚忽然在他脑子里响起来：云盖而晷动者，非天象，人象也。他放下书，看见台下的石阶上有两行新踏的脚印，一直通到墙根，又凭空断了。"],"择":[{"名":"循迹下台","文":"他举着灯沿脚印走下去，走到墙根时灯忽然灭了。黑暗里有人递给他一卷纸，纸上是同他读的同一段功法，只是注解多了一行。他回台点灯看时，那行注解已经淡得看不清。","果":{"悟性":4,"修为":160,"因果":1,"气血":-30}},{"名":"守台不动","文":"他没有下台，只把银片的位置一一记进册子。天亮时册子上多出一页，不是他写的。此后再有人问起那一夜，他只把册子推过去，一个字不说。","果":{"悟性":3,"道心":2,"灵石":80}},{"名":"留书示警","文":"他在台上留下一封短书，写清银片偏向东南的时辰与方位，然后下楼去了。三日后钦天监按他的方位查出一处私埋的阵基，他把赏钱分了一半给守台的更夫，此后那更夫替他留了三年的灯。","果":{"声望":6,"灵石":100,"因果":-1,"悟性":2}},{"名":"毁晷停测","文":"他伸手把九枚银片全捞了出来，碗里的水浑了。此后星晷三日不能测，钦天监查下来，他被罚去看守旧档三年。那三年的旧档里，他倒是把很多事看明白了。","果":{"寿元":-6,"悟性":3,"声望":-6,"因果":-2}}]},{"id":"zhongzhou_057","题":"祭天大典","类":"天象","重":2,"域":["zhongzhou"],"境界":[2,12],"段":["三年一祭，祭台设在{地点}城外的旧坛，皇帝亲至，百官列班，太虚道宗遣一位长老陪祭。{人物}混在执事的队伍里，捧着香盒走在最后，脚下这条路他踩过上百次，今日却压得脚沉。","祭到第三献，天边起了{天象}，云层裂开一道口子，紫气自那道口子里落下来，直直落在祭台正中。百官伏地，唯有那位长老没有跪，抬头看着紫气，脸色很难看。","紫气落在坛上并不散，反而顺着坛面的纹路往一处流。他捧着香盒站在那儿，看见那道气正在冲坛底的一处封记。封记是三百年前立的，一旦破开，{地名}的龙脉便要在祭台上开口。而皇帝还在念祝文。"],"择":[{"名":"扑坛压封","文":"他把香盒一丢，扑到坛心用身子压住封记。紫气撞过来，他被撞得吐了满口血，封记却稳住了。祭典草草收场，皇帝赏了他一个散职，那位长老朝他一揖，说他替道宗挡了一次灾。","果":{"声望":12,"气血":-110,"因果":-3,"修为":120}},{"名":"退至坛下","文":"他抱着香盒退到坛下，看着紫气把封记冲开一道细缝。那年冬天城里的地气就乱了，水井泛腥，粮仓生虫。他没有被追究，也一辈子记着自己在那一刻退了一步。","果":{"道心":-2,"寿元":8,"因果":3}},{"名":"诵读旧咒","文":"他记起香盒底刻着一段旧咒，便照着念了出来。紫气在坛上转了九圈，慢慢收回云缝。念完之后他嗓子哑了半月，那位长老却记住了他，说要收他入门。","果":{"悟性":3,"声望":8,"修为":160,"因果":-1}}]},{"id":"zhongzhou_058","题":"万宝赊账","类":"市井","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["万宝阁的赊账簿子极厚，厚到能当凳子坐。{人物}在上面添了一笔，为的是替人赎一枚{器物}。这笔账的利息算法很怪：不是加钱，是加事——每过一月，阁里便派一件差事给他，差事办完，利息清一笔。","第一月的差事是替阁里押一趟货，第二月是去{地点}讨一笔旧债，第三月是给一位不认识的{人物}送一句话。他做着做着，发觉这些差事都往一个方向走：{宗门}的旧库。","第五月，掌事的把他叫进内堂，说账可以一次清了，只要有一样东西。他问是什么，掌事的不答，只把账本翻到最后一页，那一页上写的不是钱，是一个人的名字，名字后面空着。{天象}正好从窗缝里挤进来。"],"择":[{"名":"填上那名","文":"他在那一页上填了名字，账当场两清，还多得一枚玉牌。此后他过得很宽裕，只是不敢再想那个名字的主人如今怎样了。三年后他在街上遇见那人，那人已不认得他。","果":{"灵石":400,"魔念":2,"因果":3,"悟性":1}},{"名":"按月还事","文":"他把账本推回去，说宁可一月一件差事，也不填那个名字。掌事的看了他很久，笑了，说阁里三十年来头一个这样的人。此后他的差事越派越轻，第六年账清时，他已成了阁里的半个自己人。","果":{"声望":8,"灵石":150,"道心":3,"因果":-2}},{"名":"夜盗账本","文":"他趁夜摸进内堂，把账本第一页撕下来烧了。第二页上的名字全糊成一片。他逃出万宝城，从此在九州各地换着住处过活，每到一处都要先看清有没有万宝阁的分号。","果":{"灵石":200,"因果":3,"魔念":2,"寿元":-10}}]},{"id":"zhongzhou_059","题":"丹凤下书","类":"人情","重":3,"域":["zhongzhou"],"境界":[0,6],"段":["{地点}的门房收信只在辰时，过了时辰便一概不收。{人物}替人送一封书，赶到的时辰正好差一刻。门房是个精瘦的{人物}，接过书只扫了一眼封皮，便往匣子里一丢，说排队。","匣子里的书已经堆了半尺厚，送来的都是各省的举荐与自陈。他知道这一封若不今日递进去，那家的小姐便要错过今年的选试。而排队排在前面的一位{人物}，正回头看着他手里的另一样东西。","门房的眼珠转过来，说：想快也容易，递一样能看的东西。他把手伸进袖里，摸到那枚{器物}，那是他替人跑腿半年的酬劳。{天象}正从宫墙上压下来，辰时还有半刻。"],"择":[{"名":"递上酬劳","文":"他把那枚东西放上门房的托盘。书当天递了进去，那家小姐如期应试，中了三等。他失了半年的酬劳，也从此有了一个能通路子的门房，往后办事快了许多。","果":{"因果":1,"声望":3,"灵石":-180,"悟性":2}},{"名":"候到次日","文":"他把书收回袖里，在门外坐到次日辰时。书递进去时已经误了期，那小姐未能应试。她家中后来没说什么，只是再没人来找他送信。他不后悔，也从此接活前先问一句急不急。","果":{"道心":2,"声望":-2,"灵石":40}},{"名":"另寻他路","文":"他绕到宫城西角，找了一个管水道的旧识，把书从水口递了进去。书到了，人也到了，只是这一路递进去的东西从此都沾了一股水腥。三年后这桩旧事被人翻出来，他只得离了京。","果":{"悟性":3,"因果":2,"声望":5,"灵石":-60}}]},{"id":"zhongzhou_060","题":"九门钟碎","类":"灾祸","重":1,"域":["zhongzhou"],"境界":[3,13],"段":["封城之音起了三次，每一次都只有大事。这一年冬至，{地点}的铜钟在没有人的时候自己裂了，裂纹从钟口一直通到钟顶，钟身上铸的九条龙纹断了七条。值守的{人物}跪在钟下不敢起身。","龙脉司的人赶到时，整座钟楼都在发烫，钟面上的裂口里渗出细细的{灵材}。老匠人摸了摸裂纹，说这不是裂，是被什么从里头撞的。他抬头看城外的方向，脸白得像纸。","{天象}压在城头，九门的钟鼓一齐闷住，敲不响。钦天监的传令已经出了宫，说要在三个时辰之内定下一个说法：是钟自己裂的，还是有人撞的。这两个说法背后，是两批人的脑袋。"],"择":[{"名":"据实称撞","文":"他在卷上写了「有物自外撞钟」。钦天监连夜派出三路人马查城北的脉眼，查出一口被人开了的旧井。井封之后钟声复鸣。他得了一场重赏，也从此被卷进了最深的那些事。","果":{"声望":10,"灵石":300,"因果":3,"悟性":2}},{"名":"报称自裂","文":"他按上面的意思写了「年久自裂」。钟补了，案子结了，一批人被贬出京。他升了半级，也从此明白这城里的说法不是写出来的，是定出来的。","果":{"灵石":200,"声望":4,"因果":2,"道心":-2}},{"名":"留钟不补","文":"他顶着令不补钟，只把裂口封住，每日去钟下坐一个时辰。十七日后，钟自己响了，一声，只一声。此后这城里的钟鼓多了一条规矩：裂缝不补，只封。","果":{"道心":4,"悟性":3,"修为":200,"寿元":-8}}]},{"id":"zhongzhou_061","题":"万修丹会","类":"宗门","重":3,"域":["zhongzhou"],"境界":[1,9],"段":["丹会三年一度，开在{地点}外的丹霞坞，九州送来参评的丹有七百余炉。{人物}这一炉是替人代炼的，炉底刻着主家的名，丹成之后那颗丹要归主家，名声归他。炉子在第七排，前后都是大宗门的丹房，烟气熏得人睁不开眼。","第三日验丹，一位{宗门}的丹师走过他炉前停了停，说这炉的火候差了一线。他认得那人袖口的纹，与三年前夺了他师门丹方的那一家相同。当晚他的炉子被人动过，炉盖上的封记松了半分，{灵材}的香气散得不对。","第五日开炉。他揭开炉盖，丹在炉心转了三圈没有散，颜色却偏了，是本该成的紫金丹变成了青的。台下议论声起，那位丹师正站在评审席上看着他。{天象}从坞外的山脊漫过来，他手里还捏着那枚半松的封记。"],"择":[{"名":"当众验封","文":"他把那枚封记举起来，请评审当场验看松动的痕。三家丹师围上来验了半个时辰，验出封记上有一道被撬的细纹。那一家的丹被夺了名次，他的青丹虽未成紫，却被记为「火候无失」。","果":{"声望":10,"悟性":3,"灵石":120,"因果":-2}},{"名":"认下差池","文":"他把封记收进袖里，说火候不济是自己无能。丹会散后他去寻那丹师，那人反倒请他一席酒，说识时务者当有前程。他得了丹会的末等赏，也从此进了那家的丹房，替人炼了十年丹。","果":{"灵石":200,"声望":-4,"因果":2,"道心":-1}},{"名":"弃丹重炼","文":"他当场把青丹砸碎，向评审请了三日重炼之期。三日三夜不眠，第二炉丹成，色泽极正，只是他自己少了一成的根基。评审收了他的丹，也收了他这个人，此后丹会年年请他坐席。","果":{"修为":-60,"声望":14,"悟性":4,"气血":-50}}]},{"id":"zhongzhou_062","题":"龙气入丹","类":"秘境","重":2,"域":["zhongzhou"],"境界":[3,12],"段":["丹要成上品，须借一点地气。{地名}的丹师都知道，最烈的地气在{地点}底下三十丈，那里的土色赤金，摸一把手上要留三天热。{人物}带了九枚{器物}下去，要取一炉丹的引。","地穴里没有风，{器物}的光照着四壁，火把烧得极稳。他按图走到第三处穴眼，看见地上摆着一只空炉，炉底还有余温，炉边刻着一行字：后来者止步。字是新的，而这里三十年无人下来过。","他把手按在穴眼的土上，土里传来极缓的震动，像是有什么在深处翻身。{天象}进不来，穴里却亮了一层。那九枚器物在他怀里一齐发烫，仿佛下面有东西认得它们，正在往上应。"],"择":[{"名":"取土即走","文":"他抓了三把土，封进玉匣便往上爬。爬到半途穴道一处一处塌下来，他舍了一只鞋才出来。那三把土炼出的丹确实上品，只是此后他再进任何地穴，腿都会先软。","果":{"灵石":300,"修为":200,"气血":-60,"因果":2}},{"名":"补字留炉","文":"他把那行字补全：后来者止步，止步者活。又替那空炉续了一把火，把九枚器物一一摆在炉边。出穴时穴道没塌，土里那点震动也停了。他空手而归，此后炼丹的成丹率却高得反常。","果":{"道心":3,"悟性":3,"因果":-3,"修为":80}},{"名":"唤人同取","文":"他出去叫了七个人下来，各分一段土。八个人取走了一炉半的引，穴眼就此废了。那一年城里的丹价翻了一倍，八个人里三个死在自家丹房，死时炉都是热的。","果":{"灵石":500,"魔念":2,"因果":4,"声望":-5}}]},{"id":"zhongzhou_063","题":"御史风闻","类":"人情","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["御史台的门前有一面鼓，鼓面蒙的是牛皮，据说三百年没换过。{人物}在{地点}做抄书匠，某夜有人把一卷风闻投进他窗里，纸上写的是九条罪状，条条有名有姓，最末一条写着{宗门}的名字。","按{地点}的老规矩，风闻可入奏，只要誊抄无误、投鼓有名。可这九条一旦入了奏，京城里至少要死三十个人。他把纸压在水盆底，第二日纸上的墨竟自己洇开了，字往四下走，像有东西不肯就范。","第三日清晨，两名{人物}站在他铺子门口，说是来收旧纸的。他把那卷东西藏在{器物}的夹层里，抬头看见檐下的{天象}，忽然想起昨夜有人在他门外站了很久。这个时辰，鼓还敲得响。"],"择":[{"名":"击鼓入奏","文":"他抱着卷子去击鼓，鼓声传出三条街。九条罪状查了半年，死了十一个人，也活着十九个人。他从此成了御史台的常客，也成了许多人夜里睡不着时想起来的那张脸。","果":{"声望":14,"因果":3,"灵石":150,"魔念":0}},{"名":"焚卷守己","文":"他把卷子烧了，连灰都埋进花盆。两名来收旧纸的人搜了半日，什么也没搜到，走时留了一句：聪明人。他此后在这条街上过得安稳，只是不再收夜里投进窗来的东西。","果":{"道心":-1,"寿元":6,"灵石":60}},{"名":"还与本主","文":"他顺着纸上的一处记号，把卷子送回了写它的人手里。那人是一位被贬的老御史，见了他只说一句：你没看。他点头，其实看了三遍。老御史此后每年寄一卷来，他每年都原样退回。","果":{"道心":2,"悟性":2,"因果":-2,"声望":3}},{"名":"卖与人手","文":"他把九条罪状抄了三份，分卖给三家。三家各取所需，谁也没全动。他赚了一笔不小的钱，也从此被三家人同时握着，此后再不敢自己写一张纸。","果":{"灵石":500,"魔念":3,"因果":3,"声望":-6}}]},{"id":"zhongzhou_064","题":"黑眚夜行","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[1,8],"段":["{地点}的旧宅空了三进院，夜里常有黑气在窗外盘。{人物}替人看守这宅子，第一夜便看见那团{妖异}贴着窗纸往里头看，窗纸被压出一个圆印，像一张没有五官的脸。","第二夜它撞了窗。第三夜它没来，宅子后头的老槐树下多了一堆新土。他扒开土，埋着的是一只木匣，匣里盛着一撮指甲与一束头发，头发用红绳扎了九道，红绳上还系着半枚{器物}。","第四夜黑气不只在窗外，堂屋里也有了。{天象}照着空院，他听见有人在极近的地方唤他的乳名。那是有人要借他做替，扎绳的人已经死了三十年，如今这城里的后生谁也不知道这桩旧事，除了那一位{人物}。"],"择":[{"名":"掘绳烧匣","文":"他把九道红绳一并烧了，火里窜出一股极冲的焦味。黑气在院中转了半夜，天亮时散了。宅子被主家收回，他被赶出门，可此后夜里再没听过有人叫他乳名。","果":{"因果":-3,"气血":-40,"道心":2,"灵石":80}},{"名":"依绳查人","文":"他把匣子收着，顺着红绳上的结法查到了城南一家旧扎纸铺。铺主一看便跪下，说这是替人续命的老法。他报了官，案子牵出一位{人物}，他得了一场赏，也从此不敢再替人守宅。","果":{"声望":8,"灵石":200,"悟性":2,"因果":1}},{"名":"以身入替","文":"他照着旧法把自己的名字写在匣底，替那三十年的死人接了这桩替。黑气当夜散去，他却在三日内瘦了一圈，眉目间隐隐像另一个人。此后再有人问起他姓什么，他总要愣一下。","果":{"修为":200,"寿元":-18,"魔念":2,"因果":2}}]},{"id":"zhongzhou_065","题":"天机售运","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[2,10],"段":["天机阁有一桩不写在门上的买卖：卖运。不是卖别人的运，是把自己往后十年的运提前兑现，换一样眼前的东西。{人物}是在{地点}听一位常客说的，那人说他换过三次，换来的东西都成了真。","阁中开价极冷：三年运换一柄{器物}，五年运换一段{功法}，十年运换一句话。录史把一枚{器物}推到他面前，说：把手放上去，它自己会量。他放了，铜盘上的水纹立刻乱成一团。","录史沉默了很久，说：你的运，量不出来。这不是好事。他抬头看那瞎了的老人，老人又说：量不出来的东西，多半已经许给别人了。窗外{地点}的钟正敲到第九下，他想起幼年时家中曾替他与某人结过一门未成的亲。"],"择":[{"名":"三年换器","文":"他把手按回铜盘，换了三年运，得一柄旧剑。剑极好，用起来顺手得像长在手上。三年之内他处处顺遂，第四年起诸事阻滞，连喝水都容易呛，像运气被人提前支走了。","果":{"器物":1,"修为":200,"寿元":-10,"因果":2}},{"名":"十年换话","文":"他要了那一句话。录史说的是一个地名，他去了那里，在一间旧屋里见到自己母亲未嫁时的画像。他花了十年才把那句话想明白，想起来的时候，人已经在别处了。","果":{"悟性":5,"寿元":-12,"道心":2,"因果":-2}},{"名":"不换而归","文":"他把铜盘推回去，说运这东西不该被称。录史笑了，说你是第三十个这样说的，前二十九个后来都回来了。他走出天机阁，站在御街上抬头看天，忽然觉得脚下的路是自己的。","果":{"道心":4,"悟性":2,"寿元":8,"灵石":-50}}]},{"id":"zhongzhou_066","题":"皇朝征辟","类":"宗门","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["皇朝每三年下一次征辟令，凡筑基以上者，可入册为官，亦可入京营。{人物}在{地点}的榜上看见自己的名字，旁边还有一个朱笔的圈——圈住的名字不征，是另有任用。他不知道该庆幸还是发愁。","来传令的{人物}很客气，说上头看中的是他这一手堪舆的本事，要他去查{地名}北边的一处地脉。活儿不难，难在这处地脉压在一座{宗门}的祖坟底下，动一分，便是与那一家结死仇。","他把征辟的文书摊在桌上。文书背面还有一行小楷，是钦天监的批注：地脉若不动，北边十八州明年春上无水。{天象}正压在窗外，那一行字被人用指甲划过，划痕极深。"],"择":[{"名":"受辟查脉","文":"他受了征辟，带着十二个匠人去了北边。脉动了一寸，那一家当场翻脸，京城里却多了十八州的活水。他升了官，也从此出门必带两名护卫，因为那一家的余党盯了他十年。","果":{"声望":12,"灵石":300,"因果":3,"气血":-40}},{"名":"辞辟归山","文":"他把文书退了回去，说自己手段不足。那位传令的也不恼，只留了一句：明年春上记得多备些水。第二年北边果然旱了，他站在自家井边，一桶一桶地替邻居打水，一打就是半年。","果":{"道心":3,"声望":-4,"寿元":6,"因果":2}},{"名":"密告其宗","文":"他先一步把批注的影抄送给了那一家，换来一大笔谢礼与一句承诺。然后他才受辟上山，把脉改走另一条路，绕开了祖坟。两方都说他好，只有那十八州的井，第二年还是干了。","果":{"灵石":600,"魔念":2,"因果":3,"声望":6}}]}]},"qinglan":{"词汇":{"人物":["山门执事","采茶杂役","外门弟子","内门师兄","落魄散修","游方道人","竹海药农","黑水潭尸倌","落雁谷牙人","巡山剑侍","卖符老妪","赌坊掌柜","接引真人","赎身炉奴","抄经书生","断刀客","云游丹师","茶商把头","守潭哑仆","叛宗弃徒","赤脚郎中","赶尸匠","谷中谍子","号房监考长老"],"地点":["青云山十二峰","落雁峡","黑水潭","竹海深处","青岚灵茶园","乱葬岗","断魂崖","洗剑溪","迎仙牌坊","试心石阶","藏经阁三层","丹房后灶","潭底锁尸窟","峡中布阵台","石桥酒肆","老茶棚","尸坑","山阴乱石坡","雁回渡","云脚驿"],"天象":["竹涛夜雨","山雨初歇虹霓横峰","春雾锁谷三日不散","秋霜压茶树","血月照潭","雷打竹林","白虹贯日","阴云不散如盖","夜半山岚如潮","星落如雨","冷雨夹雪","日晕三重","潭上浮起青磷火","大雾吞山门","落霞烧尽半边天","风卷残茶满坡"],"妖异":["青竹蛇妖","尸傀抬轿","白毛山魈","食茶青虫","潭底水猴子","三足蟾","缢死女鬼","纸人抬棺","黑水鲶精","竹节人偶","无面采茶女","血衣童子","铁背苍狼","千年老鳖","挂树吊尸","雾中灯笼鬼"],"器物":["残破青铜茶碾","缺角青云令","落雁谷信阵盘","黑铁养尸铃","半截断魂钉","竹纹符笔","三足药炉","青瓷茶盏","泛黄卖身契","破旧斗笠","云纹小剑","血浸的玉牌","铁锁串","老山水罗盘","褪色谷旗","黑水陶瓮","玉髓算盘","半片残镜"],"灵材":["三百年紫芝","青岚春茶尖","溪底寒铁","竹心露","五年陈茶饼","潭底尸莲","老竹黄精","落雁谷阵砂","血纹石","雨前嫩芽","山阴石乳","阴沉竹","洗剑溪砂金","断魂崖乌头","尸油膏","青云峰云母"],"功法":["《青云十三式》","《洗剑诀》","《落雁九连环》","《血河养元功》","《炼尸真解》","《竹影身法》","《青岚吐纳篇》","《雨雾藏形术》","《断魂钉法》","《茶烟剑意》","《引尸铃咒》","《观澜阵图》","《石阶问心诀》","《敛息竹叶符》"],"际遇":["于乱葬岗拾得半卷残经","在茶园避雨时撞见内门密谈","替老茶农挑水换得一盏陈茶","于试心石阶上摔落反悟身法","在断魂崖下挖出一具未腐之尸","替落雁谷牙人跑了一趟腿","于竹海迷路三日误入阵眼","在洗剑溪捡到一柄无主断剑","被巡山剑侍错认作内门弟子","于老茶棚听来一段宗门旧账","在潭边目睹尸傀被人放走","替黑水堂尸倌收敛了一具尸","于藏经阁三层抄漏了一页符法","在雁回渡救起一个落水女修","于山阴石坡撞见两只妖物相斗","替卖符老妪代写了一夜符","在赌坊以一枚铜钱赢了半块灵石","于试心石阶前替人挡了一记雷"],"祸患":["被同门诬陷盗取丹方","被黑水堂的尸傀夜半叩门","被巡山剑侍当作窥山贼擒下","被落雁谷记入欠账名录","被竹海里的雾引进乱葬岗","被谷中谍子卖了一回行踪","被山门考核刷下三次","被赌坊追债追到断魂崖","被妖物咬穿肩头","被逐出宗门收回法器","被老茶农认作仇家之子","被尸毒侵入三焦","被血月引得心魔翻涌","被雨雾困在阵中七日","被人换走了采来的灵茶","被黑水堂悬了赏格"],"宗门":["青云宗","落雁谷","黑水堂","天涯阁","天机楼","丹霞观","赤霄剑宗","青岚散修盟","洗剑溪剑庐","东荒茶帮"],"地名":["青岚域","青云山","落雁峡","黑水潭","竹海","断魂崖","洗剑溪","雁回渡","乱葬岗","云脚驿"]},"图鉴":[{"类":"地理","名":"迎仙牌坊","卷":2,"文":"迎仙牌坊是青云山门的第一道关口，四柱三间，青石雕成，正中一方匾额，字是三百年前开山祖师亲题的。坊上悬九枚铜铃，风起则响，据说铃响的数目与当年录取的人数相应，一响一个，从不多也不少。牌坊下铺着一条三丈宽的石板路，路面被人踩得极光，光得能映出人影。凡来考山门的，都要在这条路上走完最后三十步；凡被逐出宗门的，也要从这条路上走出去。老修士说，牌坊不难过，难的是走回头路——出坊之后，再想进来，得把当年的三百六十级石阶重新走一遍，一级也不能少。","引":"《山门旧闻》：「牌坊不问来路，只问去向。」"},{"类":"地理","名":"试心石阶","卷":2,"文":"试心石阶共三百六十级，自迎仙牌坊起，直上云中，阶面刻着极细的符文，肉眼几乎看不见。人一踏上去，符文便勾出他心里最怕的那一样东西，有时是死人，有时是一句话，有时是半碗没吃完的面。撑过去的人说石阶不长，撑不过去的人说石阶没有尽头。石阶两侧原本插着编号竹签，后来又添了两条铁索，供人扶着。每年九月之后，石阶上总会留下些东西：一只鞋、半枚铜钱、一截断簪、一小片干了的血。宗门的杂役扫得极勤，扫过之后第二日总有新的。","引":"《石阶问心诀》：「阶不试人根骨，只试人怕什么。」"},{"类":"秘闻","名":"洗剑池","卷":3,"文":"洗剑池在洗剑峰顶，池方十丈，深不过三尺，却终年不涸。宗门弟子铸了新剑，必先来此池浸四十九日，说是去火气、养剑性。池水极冷，冷得能把剑上的血气都逼出来。近百年池水一年比一年浅，到了天倾纪末年，池底已能看见青石。有人说池底铺着的不是石，是一柄一柄剑的剑身，横着嵌在石头里，剑柄朝外，一圈一圈。也有人说，十二峰夜钟响过之后，池底会多出几柄新的断剑，数目与当年宗门里病故的人数一样。这话没人敢在山上说。","引":"《洗剑录》残页：「池不洗剑，剑自洗人。」"},{"类":"风俗","名":"云脚驿送客","卷":3,"文":"云脚驿有一个旧俗：往东去的人，临走那夜，驿丞会给他一碗清水，碗底压一片竹叶。水是给他路上喝的，竹叶是给山里看的——见了竹叶，竹海里的东西便知道这是有去有回的人，不会在路上拦他。若是把竹叶吃了，就等于告诉山林自己不打算回来，此后一路顺风，却再难回头。老驿丞从不劝人吃或不吃，只把碗端上来，站在一边看。据驿中旧账，三十年来碗底压竹叶的，十之六七都没回来；把竹叶吃了的，倒有一半回来了，只是回来的人话都少了，问什么都只答还行。","引":"《东荒驿程》：「一碗水，一片竹叶，一条路。」"},{"类":"地理","名":"青云山十二峰","卷":1,"文":"青云山自东荒拔起，主峰九千丈，余脉散为十二峰，峰峰有名，名字多取意于剑与符：洗剑、藏锋、听雨、问心、拂云、抱朴、落星、煮茶、养元、镇岳、悬符、朝阳。山道以青石铺就，宽三尺，一级一级向上，据说是青云宗开山祖师亲手所砌，凡人在上头走三日也走不到一半。十二峰之间有铁索相连，索上挂着镇风符，风起时符纸翻飞如白蝶。宗门规矩，外门弟子只许在洗剑、问心、煮茶三峰行走，余者越界者笞杖二十。峰顶终年有云，云落即雨，雨过则虹霓横贯两峰之间，山民称之为「仙人搭桥」。","引":"《东荒山志》：「十二峰如剑立，一峰一剑，剑剑不肯低头。」"},{"类":"地理","名":"落雁峡","卷":1,"文":"落雁峡在青云山西南九十里，两壁夹峙如刀劈，谷底终年不见正午的日头。据说古时有雁群南飞，到此必落，故名。谷中雾气极重，湿气入骨，初来者往往要咳上三五日。落雁谷的山门便筑在峡中最窄处，只有一条石梁可通，石梁下埋着七十二道阵基，凡人踏上去便如踩棉花，脚下发软，走三步就要回头。峡里有一处布阵台，青石铺开三丈方圆，台上阵纹密密麻麻，谷中弟子在此赌阵、试阵、卖阵，输了的人要替赢家做三个月的差事。峡外之人传言，落雁谷的阵不是为了挡敌，是为了让来客自己走回头路。","引":"东荒俗语：「进了落雁峡，抬头不见天，低头不见钱。」"},{"类":"地理","名":"黑水潭","卷":1,"文":"黑水潭在青岚域北境，方圆十余里，水色如墨，不映天光，捧起来却是清的。潭边芦苇不生，鱼虾绝迹，只有一种拇指大的黑螺附在石上，肉不可食，壳能碾药。潭底据说有锁尸窟，是上古留下的镇尸之地，铁锁自岩壁横出，锁扣上锈成一个大疙瘩。黑水堂占了此地，在潭东筑起土堡，堡门终年闭着，只留一道小缝，缝里递东西出来。域中老人说，黑水潭的水不能喝，喝一口梦里就有手指头在舌根上摸。又说潭里有鲶精，身长丈许，胡须如缆，专等在月夜里把涉水的人拖下去。","引":"《青岚风土记》：「墨潭之下，锁着不该起来的东西。」"},{"类":"地理","名":"竹海","卷":2,"文":"青岚域的竹，是东荒一绝。自云脚驿往东，绵延三百余里尽是竹林，老竹合抱，新竹如戟，竹节上生着灰白粉霜，风过时整片竹海一起低头，涛声连成一片，夜半听起来像有人在极远处诵经。竹海深处无路，只有猎户与药农踩出的窄径，走岔了便要在里头转上几日。林中湿气重，竹叶积了一层又一层，踩下去无声，最宜藏人，也最宜埋人。黑水堂的尸倌常在此地取竹心露，说竹心露是三年以上的老竹自竹节里渗出的清液，一夜只一滴，接了要趁天未亮封进瓷瓶，见日则散。","引":"《竹谱补遗》：「竹海不语，然其声夜夜如诵。」"},{"类":"地理","名":"洗剑溪","卷":1,"文":"洗剑溪自青云山洗剑峰下来，水极冷，三伏天伸手进去，半炷香就要麻。青云宗弟子铸了新剑，必先到此溪中浸够七七四十九日，说是去火气、养剑性。溪底有寒铁，色青黑，敲之有声如磬，是青岚域三大特产之一，只是藏在水底砂石之间，要赤脚下去摸。长年有人在溪里摸铁，摸到好的卖给宗门，摸到坏的自己留着打农具。溪边有一片乱石滩，滩上搭着几家剑庐，替人磨剑、补剑、认剑，工钱不高，规矩却大：剑庐不问剑从何来，只问剑要往何处去。","引":"《洗剑录》：「剑过此溪，火气尽去，杀气犹存。」"},{"类":"地理","名":"断魂崖","卷":1,"文":"断魂崖在青岚域西界，崖高七百丈，崖下终年积雾，雾里生着一种乌头，根黑如炭，毒性极烈，一钱入汤可取人性命，也是许多丹方里不可少的一味引子。采乌头的人要在雾起之前下崖，用绳索吊着，一手攀岩一手拔根，稍有闪失便是尸骨无存。崖上有散修搭的石屋三五间，屋主换了一茬又一茬，崖壁上刻的姓名也一层盖一层。域中相争不下的人，最后常约在此处了断，赢了的人下山，输的人留在雾里。也有人说崖底不是死人，是被人有意藏起来的人。","引":"《青岚异闻》：「断魂崖不算高，只是没人从底下上来过。」"},{"类":"地理","名":"乱葬岗","卷":2,"文":"乱葬岗在青云山北麓的一片缓坡上，无碑无坟，只有一堆一堆隆起的土包，土包上插着竹签，签上写着名字，多半已经褪得看不清。埋在这里的多是外门弟子、散修、赶路死在半道的行商。青云宗每年清明派人洒一遍石灰，算是尽了宗门的情分。此地阴气重，夜里常见青磷火，一团一团贴着地面滚，滚到人脚边便散了。也有传闻说，黑水堂的人夜里来此翻土，挑那些死得不久、筋骨未僵的尸首运走，一具给三十块下品灵石，比活人值钱。","引":"《东荒杂记》：「乱葬岗上没有碑，因为没人知道自己会不会也睡在那儿。」"},{"类":"地理","名":"雁回渡","卷":1,"文":"雁回渡是青岚域最大的水陆码头，横在一条名唤回水的江上。渡口只有三条渡船，船夫都是世代做这行的凡人，撑一竿收一枚铜钱，从不与人计较。每年秋末，南飞的雁群必在此处落脚歇息，落满整片沙洲，故名。渡口边上有一排货栈，茶帮、盐帮、药帮在此交割，牙人穿梭其间，一开口便是三五个价。回水水急，夏汛时翻船是常事，救人的人得了赏，不救的人得了货，所以域中有句话：雁回渡的水，不认恩，只认秤。","引":"《回水渡志》：「渡口的秤，比人的心公正些。」"},{"类":"地理","名":"云脚驿","卷":2,"文":"云脚驿是青岚域东边最后一个驿站，再往东便是无人烟的老林。驿站是土墙茅顶，屋后有一口井，井水冬温夏凉，过路的人都要喝一碗。驿里只有一个老驿丞与一个哑巴杂役，二十年来不换人，也不见老。来往的散修在此歇脚，说书人在这里说书，赌坊在这里设摊，卖符的老妪在这里支一张矮桌。凡是要往东荒深处去的人，最后一夜都睡在云脚驿，第二天天不亮就走，走得头也不回。驿丞说，他这一辈子送出去的人，十个里有六个没回来。","引":"《东荒驿程》：「云脚驿往东，再无驿。」"},{"类":"宗门","名":"青云宗","卷":1,"文":"青云宗为东荒第一大宗，山门十二峰，弟子三万，剑、符并重，宗规森严。宗门最重根骨与出身，却也是散修唯一能凭战功叩开的大宗门：每年九月山门考核，凡筑基以下者皆可报名，取前三百入外门，外门三年再考，取前三十入内门。宗内分执事、内门、外门、杂役四等，等级之间界限极严，杂役见了外门弟子要低头让路，内门弟子出行有剑侍随行。宗门有号房、丹房、戒律堂、藏经阁三层。近百年宗门渐重出身，内门名额多被几家世族把持，散修出身的弟子再拼命，也常在最后一关被一句「根骨驳杂」打回原籍。","引":"《青云宗规》第一条：「入我山门者，先学低头。」"},{"类":"宗门","名":"落雁谷","卷":1,"文":"落雁谷以阵法和消息起家，势力不及青云宗，却是东荒最不能得罪的一门。谷中弟子人人会布阵、人人会做买卖，据说东荒没有落雁谷不知道的事。谷中分「阵房」与「信房」两脉，阵房布阵卖阵，信房买消息卖消息，两脉互不干涉，账目却记在一本册子上。谷主从不出峡，只在布阵台上接客，客人上台阶时踩下的每一步，谷中都记着。谷中有一条不成文的规矩：消息可以卖，但不能卖给两家；阵可以破，但不能白破。破了这条规矩的弟子，会被自己的阵困死在峡里。","引":"《落雁谷约》：「我不问你为何要买，我只问你出得起几成。」"},{"类":"宗门","名":"黑水堂","卷":1,"文":"黑水堂盘踞黑水潭，是东荒有名的魔道小宗，以血养功、以尸炼傀，宗门上下皆被正道通缉，却总也剿不干净。堂中不设长老，只设「尸倌」与「血奴」两职：尸倌管尸，血奴供血，堂主之下再无第三等。堂中弟子入门要饮一碗黑水潭的水，饮过之后，命便算交了出去。炼尸之法传自上古，据说能令死者听令、行如生人，只是尸傀畏日光，白日里要收在陶瓮中，瓮口以血封。青云宗百年间剿了黑水堂七次，每次烧了土堡，过三年又在原处立起一座新的，堡门的朝向一次也没变过。","引":"《正道通缉录》：「黑水堂不灭，非不能灭，是不肯付那个价。」"},{"类":"宗门","名":"洗剑溪剑庐","卷":2,"文":"剑庐不是宗门，是洗剑溪边几间棚屋凑起来的行当。庐中多是断了道途的老剑修，替人磨剑、补剑、认剑，一柄剑收三块灵石，认剑收十块。剑庐有一条铁规：不问剑从何来。这一条规矩救过不少人，也养肥了不少人。青云宗曾有内门弟子失剑，追到剑庐，庐主只说了一句「剑在溪里，你自己去捞」，那弟子捞了三日，捞出一柄锈成铁坨的旧剑，抱回去复命。剑庐的人不修剑道，只修剑，说剑比人老实，磨一磨就亮，人磨一辈子也未必。","引":"剑庐门楣刻字：「剑无姓，匠无门。」"},{"类":"宗门","名":"东荒茶帮","卷":2,"文":"茶帮是青岚域真正的财主，比青云宗有钱，比落雁谷会做人。帮中不收修士，只收茶农、脚夫、船户与牙人，一季茶下来，流水能顶半个宗门的岁入。茶帮有两个规矩：一是春茶头采必先供青云宗，名为「敬山」；二是每年霜降在云脚驿办一场斗茶，各家茶农拿出最好的茶来比，赢家得「茶魁」木牌一块，此后三年茶价翻倍。帮中把头姓什么没人记得，只叫「老秤」，因为他称茶从不用秤，手一掂便知轻重，从没错过。","引":"《茶帮账簿》：「山上是仙，山下是秤，秤比仙管用。」"},{"类":"人物","名":"接引长老","卷":2,"文":"青云宗每年山门考核，由一位接引长老立在迎仙牌坊下点名。此职看似清闲，实则是宗门最难坐的位子：他要在一炷香内看三百个孩子的根骨，凭的是一双在宗门熬了六十年的眼。接引长老手中常执一卷名册、一支朱笔，点到名字便抬眼一看，看得顺眼的画个圈，看不顺眼的画个叉，一叉下去，一个人一辈子的路就窄了。老修士们说，接引长老最忌讳两件事：一是考生抬头直视他，二是考生袖子里藏着东西。这些年他画叉画得越来越少，画圈也画得越来越少，多半只画一道横，横着的人要再考一次。","引":"《山门旧闻》：「一支朱笔，写活了三百人，也写死了三千人。」"},{"类":"人物","名":"尸倌","卷":2,"文":"尸倌是黑水堂里最不起眼也最要紧的角色，管着一堂的尸傀：喂血、擦身、上油、收瓮，白日里把瓮搬到阴处，夜里再搬出来透气。做尸倌的人多半是赎身的凡人或被掳来的散修，做满十年可换一颗凝气散，做满二十年可离堂，只是没人见过做了二十年还活着走出去的。尸倌身上常年一股甜腥气，洗不掉，走在路上连野狗都绕着走。他们说话极少，因为堂中有规：尸倌不得与人交谈，怕把堂里的事说漏。有人说尸倌夜里会跟瓮里的尸傀说话，说得很轻，像哄孩子。","引":"《黑水堂杂录》：「堂中最静的是尸倌，最吵的是瓮。」"},{"类":"人物","名":"谷中牙人","卷":2,"文":"落雁谷的牙人不布阵，只跑腿。他们游走于青云宗、茶帮、散修之间，替人传话、递信、牵线、作保，抽三成佣，从不讲价。牙人腰间挂一枚小阵盘，盘上刻着九道纹，纹亮一道代表一桩买卖成了，纹全亮便升作「信房执事」。牙人最讲究一个「准」字：话要传到，价要说到，人要不认得。谷中有训：牙人可以骗人，但不能骗错人。这些年牙人做的最大一桩买卖，是把青云宗一位内门弟子的行踪卖了三家，三家各自出手，最后谁也没得手，牙人却收了三份钱，从此再没在峡里出现过。","引":"《信房手札》：「我卖的不是消息，是别人的犹豫。」"},{"类":"法宝","名":"缺角青云令","卷":2,"文":"青云令是青云宗外门弟子的腰牌，青玉所制，正面刻「青云」二字，背面刻峰名与编号。令牌本该完好，可外门弟子十年一换，换下来的旧令多被打磨重刻，磨到边角便缺了，于是有了「缺角青云令」这种东西。持缺角令者，多半是被逐出宗门或自行脱籍的旧人，令牌不敢丢，丢了便再无法证明自己曾在青云山站过；也不敢亮，亮了便是自投罗网。市面上缺角令值五十块灵石，买的人图的是它能过山门头一道关卡——守关的剑侍只认令，不认人。","引":"《东荒器物志》：「一块缺角的玉，比一条完整的命值钱。」"},{"类":"法宝","名":"信阵盘","卷":2,"文":"落雁谷的信阵盘巴掌大小，铜胎木面，面上刻九道同心纹，每道纹上有一枚可拨动的细针。两盘同刻一图者，拨动一针，另一盘上对应的针便自行跳起，隔千里亦能传讯，只是每传一次要耗一枚灵石，且只能传九字以内。谷中弟子人手一盘，盘不离身，睡觉也压在枕下。信阵盘的忌讳是不能浸水、不能近血，沾了血，针会乱跳，跳到第九次盘就裂了。谷中还有一种「死盘」，纹路刻反，专用来放假消息，据说青云宗曾截获三枚死盘，照着上面的消息设伏，扑了三天空。","引":"《阵房器录》：「九字之内，可断一国。」"},{"类":"法宝","名":"养尸铃","卷":3,"文":"养尸铃是黑水堂的根本法器，黑铁铸成，拳头大，铃身铸满蝌蚪似的血纹，铃舌是一截人指骨。摇铃三下，尸傀起；摇铃七下，尸傀行；摇铃九下，尸傀扑。铃不可多摇，一日过四十九下，铃身便要吸主人的血补纹，摇铃的人会一天比一天瘦。堂中尸倌各持一铃，铃上刻着所管尸傀的编号，铃毁则尸乱。据说最老的一枚养尸铃传了七代，铃身上的血纹已经凸起如脉，摇起来声音极闷，像有人隔着土在敲。","引":"《炼尸真解》残页：「铃不认主，认血。」"},{"类":"功法","名":"青云十三式","卷":1,"文":"《青云十三式》是青云宗外门必修的剑法，十三式分别名为：起手、拂云、听雨、洗剑、藏锋、问心、抱朴、落星、煮茶、养元、镇岳、悬符、归鞘。招式本身不难，难在「归鞘」一式：前十二式使尽，气已泄尽，仍要收剑入鞘，收得慢半拍便是破绽。宗门教习说，这一式练的不是剑，是忍。外门弟子三年考一次，考的往往就是这最后一式。据说真正把这十三式练透的人，剑不必出鞘，对方已先怯了三分，本域散修中流传一句话：青云弟子不可怕，可怕的是他收剑的时候。","引":"《青云剑谱》：「十三式皆虚，唯归鞘为实。」"},{"类":"功法","名":"血河养元功","卷":3,"文":"《血河养元功》是黑水堂的立堂之本，以人血为引、以尸气为薪，炼出一缕血色真元，进境快得惊人。堂中弟子修此功，三年可抵他人十年，代价是气血日渐枯败，须以他人之血不断填补。功成七分者，面白如纸而力大无穷；功成十分者，血河倒灌，自身化作血傀，从此不认亲疏。黑水堂从不讳言此功的凶险，反而以此为饵：肯饮血的人，堂中自有位置；不肯饮的，去当尸倌。正道宗门将此功列为禁法，得之焚之，只是焚了一百年，黑水潭里仍有血味。","引":"《正道禁法录》：「以血换力，此债终须以血还。」"},{"类":"功法","名":"落雁九连环","卷":2,"文":"《落雁九连环》是落雁谷的看家阵图，九阵相扣，一阵破则八阵移，破阵者永远只差一步。此阵不杀人，只困人，困到对方自己愿意坐下来谈，落雁谷的生意便是这么做成的。阵图分九层：一曰迷踪、二曰回风、三曰断桥、四曰移形、五曰锁息、六曰借势、七曰反照、八曰留客、九曰归雁。九层皆通者，谷中百年只出过三人。谷中弟子学阵自第三层起，前两层只讲一件事——让人以为自己在往前走。","引":"《观澜阵图》：「阵不在杀，在让人自己停下。」"},{"类":"丹药","名":"青岚灵茶","卷":1,"文":"青岚灵茶是青岚域三大特产之首，生于青云山向阳坡，树龄逾百年的老茶树才有灵性，芽头在清明前七日采，一日只采一捧，炒制时要用手掌贴锅，锅温高了茶便死，低了便生青气。灵茶不入丹方，只作饮，一盏下肚，神识清明如洗，打坐时杂念少三分。域中散修多以灵茶代丹，穷的喝碎茶，富的喝头采。老茶农说，灵茶最忌贪心：一棵树一年只采一季，采了两季，第二年树就枯了，茶水变苦，喝下去像嚼土。","引":"《茶经补》：「一盏清心，二盏忘忧，三盏便不肯再走。」"},{"类":"丹药","名":"凝气散","卷":1,"文":"凝气散是青岚域最寻常的丹药，炼气修士续命、筑基修士充饥，都靠它。方子简单：紫芝粉三分、竹心露一分、蜂蜜少许，以文火熬成膏，搓作梧桐子大。药效不算好，胜在便宜，一块灵石能买十粒。域中丹房多在后灶熬此散，熬的时候满院子甜香，隔三条街都闻得到。凝气散最大的毛病是「赖药」：吃惯了的人一日不服便觉气短，久了自身吐纳便懒了。老丹师常说一句刻薄话：凝气散不治病，只教人忘了自己在病。","引":"《丹房手记》：「最便宜的丹药，最贵的代价。」"},{"类":"丹药","名":"尸油膏","卷":3,"文":"尸油膏出自黑水堂，以尸傀身上渗出的油膏掺乌头粉熬成，色如冻蜡，气味甜腥。此物不入活人之口，只用来养尸：抹在关节处可保尸身不僵，抹在面上可保五官不腐。也有人说，尸油膏涂在活人伤口上，能让伤处三年不长肉也不烂，是一种极邪的止血法。正道视之为秽物，见之必焚；可断魂崖下的散修在别无选择时，也会捏着鼻子用一点。卖此物的尸倌从不多话，只收灵石，收完便走，一句话也不留。","引":"《秽物考》：「能止痛的东西，未必是好东西。」"},{"类":"异兽","名":"青竹蛇妖","卷":2,"文":"青竹蛇妖多见于竹海深处，通体青碧，与竹节同色，长不过三尺，盘在竹枝上一动不动，远看便是一截新竹。此妖不吐信，先吐一缕极细的青气，气入人鼻，脚下便生根，一步也挪不开。它不急，慢慢游下来，缠上人的脚踝，一寸一寸收紧。猎户入竹海必带两样东西：一壶雄黄酒，一把砍竹刀。酒洒在竹根上，蛇妖便退；刀砍断跟前的竹节，它便知道来人不好惹。老药农说，蛇妖十年长一寸，长到五尺者已能化人形，见之莫要喊它名字。","引":"《竹海见闻》：「宁可撞见老虎，别撞见一截会动的竹子。」"},{"类":"异兽","名":"潭底水猴子","卷":3,"文":"黑水潭的水猴子，形如猿而小，浑身湿毛贴背，指间有蹼，力大过牛。此物不出水面，只在潭边浅滩伏着，见人涉水便从水下抱住小腿往下拖，拖到深处便松手，看着人沉下去，自己蹲在潭底石上啃指头。潭边芦苇不生，据说就是被它连根拔了。守潭的哑仆说，水猴子怕铁，身上带一串铁器便可保平安；又说此物记仇，伤过它一次的人，此后三年下水必被寻上。黑水堂曾捕过一只，用铁链锁在潭边示众，第二夜铁链断成三截，守夜的两个人只剩两双鞋。","引":"《潭志》：「潭水黑，看不清底下有几只手。」"},{"类":"秘闻","名":"十二峰夜钟","卷":3,"文":"青云山十二峰上没有钟，可每年总有那么一夜，山上会响起钟声，一声，极沉，传遍整个青岚域，连山下村子的狗都不敢叫。老辈人说这是「夜钟」，钟响的那一夜，宗门必有人死，死的是谁不知道，第二天也查不出来。宗门从不解释，只在钟响后封山三日，对外只说「山中有事」。近百年夜钟响了七次，三次之后青云宗换了掌门，两次之后黑水潭被剿，还有两次，什么也没发生，只是那一年山门考核，一个录取的都没有。","引":"《青岚秘录》：「钟响一次，山门便关三日。」"},{"类":"风俗","名":"山门考核","卷":1,"文":"青云宗每年九月初一开山门考核，迎仙牌坊下摆三张长案，考生列队自牌坊下走过，过一道名唤「试心」的石阶，阶上刻着问心符文，走上去的人会看见自己最怕的东西。撑过去不掉头者，入第二场；第二场考吐纳，一炷香内引气入体者，入第三场；第三场考剑，用宗门发的木剑对打，取前三百。考核不收报名费，却要交三块灵石作「问心香火钱」，交不起的可以在山门外做三个月杂役抵。每年报考者三千余，录取三百，三年后再考内门，取三十。有人在石阶上坐了十年，年年考，年年不过。","引":"《山门旧闻》：「试心阶不问根骨，只问你怕什么。」"},{"类":"风俗","名":"茶帮斗茶","卷":2,"文":"霜降那日，云脚驿的晒谷场上摆开二十张矮桌，东荒茶帮的斗茶便在这里办。规矩有三：一是茶须自采自炒，二是水须用驿后那口井的水，三是斗茶时不说话，只以茶碗推让。评判由三位老茶农与一位青云宗执事共任，看汤色、闻香气、品回甘，三碗定输赢。赢家得「茶魁」木牌，牌上刻年份，可挂三年，三年内茶价翻倍。输的人不服，第二年再来。有一年斗茶，一位散修端上一碗浑如泥浆的茶，众人皆笑，老茶农尝了一口，沉默半晌，把茶魁牌推了过去，说：「这茶苦得诚实。」","引":"《斗茶旧例》：「茶不语，苦自知。」"}],"事件":[{"id":"qinglan_001","题":"竹海问茶","类":"机缘","重":3,"域":["qinglan"],"境界":[0,3],"段":["雨丝斜斜地压在{地点}的竹叶上，你循着一缕甜香走了半里，见一处草棚，棚下坐着一个{人物}，正用{器物}慢慢碾茶。棚角堆着半筐{灵材}，叶尖还带着水汽。老人抬头看你一眼，把茶碾推过来，说：“外乡人，坐。”柴火噼啪，铁壶里的水将开未开，{天象}，整片竹海都在响，唯独这块棚下静得出奇。","你捧起茶碗只饮一口，便觉一股清气自天灵直落丹田，经脉里滞了半月的那点浊气竟被冲散。这不是寻常茶。老人的手停在半空，声音压得极低：“这是今春头采的一等{灵材}，本该送进{宗门}的山门做供奉。可昨夜有人上山，把茶换了——筐里是陈茶染色，罐中多了一枚{器物}。”他盯着你，“我一个种茶的，说了没人信。”","{天象}，棚外的竹影摇成一片乱麻。老人从怀里摸出一张字据，纸角已经浸软，上面按着血指印：“这筐茶，你替我送上去，我这条老命就算还了；你要是不送，”他把茶碾往你面前一推，“这碾子是老竹根雕的，值三十块灵石，你拿走，只当没进过这棚子。”雨声盖住了他后半句话，你只看见他抬眼瞥了瞥竹林深处。"],"择":[{"名":"送茶上山","文":"你把茶筐背上，沿石阶一级级往上走。山门的剑侍拦你问牌子，你只说送供奉的。查验的是个{人物}，他捏了捏茶尖，脸色变了一变，什么也没说，收了茶，塞给你三块灵石与一枚竹牌，让你三日后还来。你下山时雨已停，草棚空着，灶里的火还温，铁壶中的水烧干了一半。","果":{"灵石":30,"声望":6,"因果":1,"道心":2}},{"名":"换碾子走","文":"你把碾子揣进怀里，转身走进雨里。走出半里，你听见身后竹枝断裂的声音，一下，又一下，像是在送你。三日后你在云脚驿把碾子卖了四十块灵石，买主是个{人物}，他掂了掂，说东西好，只是沾了点不该沾的。当夜你梦见一片竹林，林中有个老人蹲在火边，一直问：茶送了吗。你在梦里答不出话。","果":{"灵石":40,"器物":1,"道心":-3,"因果":2}},{"名":"卖与落雁谷","文":"你走进{地点}，把茶筐放在布阵台边。牙人验过茶笑了，说这筐茶值一百二十块灵石，谷中出这个价，只需你告诉他茶农姓什么、住哪一棚草棚。你说了。三日之后你听说竹海深处烧了一间草棚，烧得只剩灶。手里那一百二十块灵石沉得像石头，你数了三遍，一遍比一遍冷。","果":{"灵石":120,"因果":3,"道心":-4,"声望":-5}},{"名":"追那换茶人","文":"你顺着竹林深处追去，追到{地点}，见一个{人物}正把茶包往怀里塞。他反手掷出一团黑雾，你肩头挨了一记，倒也不重。你只抢回半包茶，回身时草棚里已无人，灶上火未灭。你把那半包茶放进锅里，一个人煮了一整夜，喝到天亮，觉得自己好像明白了点什么，又说不出是什么。","果":{"修为":60,"气血":-12,"悟性":2,"灵石":-10}}]},{"id":"qinglan_002","题":"试心石阶","类":"宗门","重":4,"域":["qinglan"],"境界":[0,2],"段":["九月初一，{地点}下人头攒动，三千余人在{宗门}的迎仙牌坊前列成长队。石阶三百六十级，自牌坊直上云中，阶面被踩得发亮，两侧插着编号竹签。执事在牌坊下敲了一声铜磬，队伍便动起来。你前头一个瘦少年刚踏上第三级就僵住了，眼睛瞪得极大，喉咙里发出咯咯的声音，被两个杂役架下来。轮到你了。","第一级不过寻常石阶，第二级尚好，到第七级时，脚下的石头忽然变得极软，你分明看见阶上坐着一个人——那是十年前死在山里的旧识，手里还捧着半碗没吃完的面。他抬头，笑着叫你的小名。你脚下生根，心跳如鼓，鼻尖闻到一股熟悉的{灵材}气味，和那年山里一样的味道。身后的队伍在等，有人在低声骂。","那影子伸手过来，指甲缝里全是泥。你忽然想起山门执事说过的一句话：石阶上照见的，从来不是死人是活人。{天象}，云压得极低，石阶在雾中只剩十步可见。你听见接引的{人物}在牌坊下喊：“还有百级，撑不住的就下来，明年再来！”他的声音很远，远得像在另一个山头。"],"择":[{"名":"闭目直上","文":"你闭上眼，不看那张脸，只凭脚下石棱的触感一级一级往上踩。那声音在耳边叫了十几遍，越来越远，最后变成一阵风。走到第三百六十级时你跪下吐了一口血，吐完抬头，牌坊已在脚下。接引的{人物}在你名册上画了一个圈，说：根骨中平，心倒是硬的。","果":{"修为":80,"气血":-20,"悟性":2,"声望":8}},{"名":"开口应答","文":"你终究答了那个小名。石阶上的影子笑了，笑得很轻，说你终于肯认他。你一句话也说不出来，只觉得胸口被人掏走了一块。等回过神来，队伍已经越过你，牌坊下的铜磬敲了第二遍。你在石阶上坐到天黑，最后一级也没上去，倒是那半碗面的味道，从此再没忘掉。","果":{"修为":20,"道心":3,"因果":2,"声望":-4}},{"名":"伸手摸他","文":"你伸手去摸那张脸，指尖穿过去了，像摸进一潭冷水。影子散了，你掌心里多了一粒冰凉的东西，是半枚旧钱。你握着它一路走到顶，接引长老看了你一眼，什么也没问，只在你名字后头写了个“存”。后来你才知道，那一档叫“待察”，三年之内不授功法，须替宗门做满两百件杂役。","果":{"灵石":-30,"修为":40,"因果":1,"器物":1}},{"名":"转身下山","文":"你转身往回走，一路走得很稳，没有人拦你。到了牌坊下，你回头看了一眼那道雾中的石阶，忽然觉得它并不高。执事在你名册上画了叉，动作很快，一笔到底。你走出山门时，听见后面有人哭，也听见有人笑。下山的路比上山短得多，可你走了很久。","果":{"道心":4,"悟性":3,"声望":-6,"寿元":2}}]},{"id":"qinglan_003","题":"尸傀叩门","类":"灾祸","重":3,"域":["qinglan"],"境界":[0,4],"段":["子时三刻，{天象}。你借宿的{地点}外忽然响起三声闷响，不急不缓，像有人用肩膀撞门。屋主是个{人物}，他脸色一下白了，抓起桌上的{器物}便把灯吹熄，压低声音说：“别应，别应，是黑水堂的东西。”门板又撞了一下，木屑簌簌落下来，落在你手背上。","门缝里透进一线青白的光，光里有个影子，笔直站着，不弯腰，也不喘气。它抬手在门上敲第四下时，你的头皮一阵发麻——那只手的指节上缠着一圈红线，是入殓时才缠的东西。屋主抖着从柜底摸出一小包{灵材}，说是给“过路的”备的，塞进门缝底下。影子静了片刻，弯腰去捡，动作极慢，颈骨发出细响。","{天象}，它没有走。捡了东西之后，它仍旧站在门外，一动不动，像是在等什么。屋主把额头贴在门板上，牙关打颤：“它不收东西，它是来找人的。”话音未落，门外的影子忽然转过头来，脸贴着门缝，你看见它的眼睛是睁着的，眼里映着一点灯火，那点灯火不是这屋里的。"],"择":[{"名":"开门自认","文":"你拉开门。它没有扑上来，只是抬起手，指了指你腰间那一点血痕——那是前几日在乱葬岗被竹签划的。它的手指在你手腕上停了一息，冷得像铁，然后转身进雾里去了。你关上门，靠着门板坐了一整夜，天亮时才发现袖口被它捏碎了一角。","果":{"气血":-25,"因果":2,"悟性":2,"道心":2}},{"名":"撒血闭门","文":"你咬破指尖，在门板上按了一个血印，又抓起{器物}在门槛上划了一道。门外的东西忽然尖啸起来，撞门、抓挠、用额头一下一下磕，磕到天快亮才静。次日你在门槛外看见一滩黑水与三枚指甲。屋主跪下来给你磕头，你却没敢告诉他：那血印是你从一本禁书上看来得。","果":{"气血":-15,"修为":50,"魔念":2,"因果":1}},{"名":"翻窗出逃","文":"你从后窗翻出去，赤脚跑过一片泥地。身后传来门板被撞开的巨响，接着是屋主一声短促的叫，随即断了。你没回头，一口气跑出十里，跑到{地点}才敢停下。天亮了，你在溪边洗手，洗了很久，水里倒影的眼睛一直是红的。","果":{"寿元":-3,"道心":-3,"因果":3,"修为":30}},{"名":"留符驱之","文":"你摸出随身那张{器物}，贴在门正中，咬破舌尖喷了一口血。符纸自己燃起来，烧出一股青烟，门外的影子被烟一冲，退了三步，僵在原地。你趁这空隙推门而出，用{灵材}在它脚边撒了一圈，它便再也迈不出那道圈。天亮后你在圈里捡到一枚黑水堂的陶钮，钮上刻着一个数字。","果":{"灵石":20,"修为":70,"魔念":1,"因果":1}}]},{"id":"qinglan_004","题":"灵茶遭劫","类":"市井","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}的春茶开秤那日，整条街都是新叶的青气。你替一个{人物}押一车{灵材}去{地点}交割，车上有二十七筐，筐上盖着旧麻布。走到半道，路旁林子里钻出七八个人，为首的提着{器物}，不喊不骂，只把车轴一别，说这车茶他们买了，价是原价的一成。","茶帮把头脸色铁青，低声告诉你：这帮人是邻县的地痞，背后靠着{宗门}里一个管茶税的外门执事，往年只抽两成，今年要抽九成。他掀开一筐茶让你看，叶尖已经开始发暗——茶在筐里闷久了会坏，坏了就一文不值。“再耗半个时辰，这车茶就废了。”他说话时手在抖，“可要是硬冲，人就没了。”","{天象}，日头偏西，风把麻布吹得鼓起来，露出一角青碧。对面那群人开始不耐烦，有人踢翻了一筐，新叶撒了一地，被人踩出绿汁。你看见为首的从怀里摸出一张纸，纸上盖着茶帮的印——那一瞬间你明白了，来抢茶的不是外人，是茶帮里有人点了头。"],"择":[{"名":"硬闯过去","文":"你把车一横，抽出{器物}抵住为首那人的咽喉。对方没料到你敢动手，退了半步，茶帮把头趁机赶车冲过去，二十七筐茶保住了二十三筐。到了{地点}，把头把卖茶的钱数了一半推给你，说这钱你得拿着。你接过时，手背上一道口子还在渗血。","果":{"灵石":90,"气血":-18,"声望":6,"因果":1}},{"名":"认栽交茶","文":"你按住把头的肩，摇头。茶被拉走九成，剩两筐烂叶，把头蹲在路边抽了一下午旱烟。回程时他忽然说，这行当做了三十年，头一回见人不争。你答他：争了茶，人就得死；人死了，茶明年还能长。他愣了愣，把烟锅在车辕上磕了三下，算是应了你。","果":{"灵石":-20,"道心":3,"悟性":2,"声望":-3}},{"名":"报官借势","文":"你让把头守着车，自己绕去{地点}，找到落雁谷的牙人，说愿出三十块灵石换一条消息：那个管茶税的执事，把柄在谁手里。牙人看了你一眼，只说夜里再来。当晚，抢茶的那群人自己散了——第二日上路，你听说那位执事被宗门戒律堂带走，罪名是私吞供奉。","果":{"灵石":-30,"声望":5,"因果":2,"修为":20}},{"名":"换掉茶叶","文":"你把车赶到{地点}的溪边，连夜用陈茶换了筐底的货，把新茶分装进四只{器物}埋进竹根下。那群人拉走车时笑得很大声，三日后买家开箱验货，找上门来索赔。你早走了，只有茶帮把头还留在原地挨骂。你带走的新茶在云脚驿卖了个好价，也带走了一桩说不清的事。","果":{"灵石":140,"因果":3,"道心":-3,"声望":-4}}]},{"id":"qinglan_005","题":"断魂崖尸","类":"奇闻","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}下的雾散得比往年早，几个采乌头的散修跌跌撞撞跑回来，说崖下有一具尸，死了少说半月，却不腐，脸上还有血色。你随他们下去时，{天象}，绳索在崖壁上蹭出刺耳的声音。到得崖底，那尸果然端端正正坐在一块青石上，衣袍齐整，双手交叠，指间夹着一枚{器物}。","尸身周围的石头上画着一圈圈斜纹，纹路里积着黑泥。一个{人物}蹲下去看，看完抬头，脸色极难看：“这是{功法}里的养尸纹，画的是收魂，不是镇魂。”他伸手去探尸首的眉心，指尖刚碰到，尸身忽然睁开了眼——眼睛里没有瞳，全是白的，白得发亮。","众人齐齐后退。那“东西”没有动，只是把交叠的手松开，掌心滚出一粒黑色的珠子，落在青石上叮的一声。你听见{地点}方向有人在远远地吹哨，哨声三长两短。{人物}一把抓住你的手臂：“黑水堂的人来了，这尸是他们养的，收魂纹还没走完。走不走，你说。”"],"择":[{"名":"拾珠即走","文":"你一把捞起那粒黑珠，塞进袖里，跟着众人往崖上去。绳索扯到一半时，你回头看了一眼，那具尸重新坐回了青石，只是手没有交叠，而是垂在膝上。珠子在你袖中一直在跳，像一颗极小的心。到崖上你才知道，同行的七个人，只上来五个。","果":{"器物":1,"修为":60,"因果":2,"气血":-10}},{"名":"毁尸断纹","文":"你抢过{器物}，把青石上的斜纹凿断，又用乌头根汁泼在尸身上。尸首迅速塌下去，皮肉在几个呼吸间化成一摊灰水。哨声近了，你们从另一侧崖壁上硬爬上去，手掌磨得见骨。后来你听说，那日黑水堂丢了三十年才养出的一具“坐尸”，赏格从此挂在潭边。","果":{"气血":-22,"魔念":1,"因果":3,"灵石":50}},{"名":"等他们来","文":"你按住同行的{人物}，让人都躲进石缝，等那哨声近了，看看到底是几个人。来的是三个尸倌，抬着一只{器物}，走近时才发现石上无人，愣在原地。你们趁乱跳出，两下交手，伤了他们一个。等你回头，那具坐尸已经不知去向，青石上只剩一圈水痕。","果":{"修为":90,"气血":-30,"魔念":2,"声望":4}},{"名":"先记下纹","文":"你蹲在青石前，把养尸纹一笔一笔记在心里，甚至用手指在腿上默写了两遍。等哨声到了崖底，你已经把图形记全了。众人走后三日，你在{地点}的灯下把纹路画出来，看着看着，忽然觉得那纹路画的不是尸，是一个跪着的人。你吹熄了灯。","果":{"悟性":3,"魔念":2,"修为":40,"道心":-1}}]},{"id":"qinglan_006","题":"谷中谍影","类":"人情","重":2,"域":["qinglan"],"境界":[0,3],"段":["{地点}的老茶棚里，你对面的{人物}把一枚{器物}推到你面前，说这是落雁谷的信阵盘，只用过一次，还能用八次。“你替我做一件事，”他压低声音，指节敲了敲桌面，“去{地点}，看一个叫白七的尸倌，每日几时倒水。只看倒水，不问别的。”他给的价是十五块灵石。","你去了。白七住在{地点}一间土屋，屋后有一口石缸，每日申时倒水一次，水是暗红的，倒进潭里连涟漪都不起。你看的第三日，忽然发现石缸边多了一只陶瓮，瓮口封着朱砂。那天晚上你没走成——白七拦在你身前，手里拎着一串铁锁，说他早知道有人在看，也早知道是谁让他看的。","他没动手，反倒坐下来说：“我替你算一笔账。他给你十五块，我给他一条你的命，你说他出多少？三十。”白七把铁锁在手里掂了掂，“可我不想要你的命，我只想知道，他为什么忽然关心起一个倒水的。你去替我问他一句，我给你二十块灵石，再送你出潭。”{天象}，潭面上浮起一层水雾。"],"择":[{"名":"做双面人","文":"你答应下来，回去向牙人复命时说白七每日倒水两次，时间改在卯时。牙人皱了皱眉，把灵石数少了五块，却也没多问。半个月后你听说落雁谷在卯时设伏，扑了个空。白七托人给你送来的二十块灵石，藏在{器物}里，一粒也不少。你两头都拿了钱，只是从此不敢走同一条路。","果":{"灵石":55,"因果":3,"道心":-3,"悟性":1}},{"名":"如实回报","文":"你把陶瓮的事一五一十说了。牙人听完，眼睛亮了一瞬，随即给了你二十五块灵石，多出十块。当晚潭边起了火光，第二日土屋空了，石缸被砸成两半。你在云脚驿遇见一个没了左手的尸倌，他看了你很久，什么也没说，只朝地上吐了一口。","果":{"灵石":25,"因果":2,"道心":-2,"魔念":1}},{"名":"当夜出走","文":"你把信阵盘放在桌上，起身出屋，白七没拦。你连夜走出{地点}，走到天亮，走出三十里，才敢回头。潭在身后变成小小一块黑。第二年春你听说白七失踪，土屋里只剩一口空瓮，瓮底刻着三个字：别回头。你再没回过青岚域北境。","果":{"道心":3,"寿元":3,"修为":20,"灵石":-10}},{"名":"拆开陶瓮","文":"你趁白七取水的空当，揭开瓮口的朱砂。瓮里没有尸，只有半瓮茶叶，青碧如新，是上好的{灵材}。白七回过头，看见你手里的叶子，忽然笑了，说你要是敢吃一口，他就告诉你这潭里到底养的是什么。你没吃，他也没说。那半瓮茶后来被你埋在了潭边的柳树下。","果":{"悟性":3,"因果":1,"声望":3,"灵石":30}}]},{"id":"qinglan_007","题":"洗剑溪断剑","类":"机缘","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}的水冷得像刀子，你赤脚在溪底摸了一上午，摸到三块寒铁，都是碎的，卖不上价。正要上岸时，脚趾踢到一件硬物。你潜下去，从砂里拔出一柄断剑——刃口只剩半尺，剑格上缠着早已朽烂的布，剑身刻着两个字，被水磨得只剩笔画。","岸边剑庐里走出一个{人物}，看了一眼就变了脸色：“这剑是从{地点}的方向漂下来的。”他把断剑接过去，在溪水里一涮，剑身竟透出一线青光。老匠人用拇指试锋，指尖立刻见血。他说这剑不是凡铁，是溪底寒铁打了三年才成的一柄旧物，主人多半已经死在崖下了。","{天象}，溪水忽然漫涨，水色由清转浊，浮起一层竹叶。老匠人把断剑递还给你，说：“剑有主，主死了剑也不认新主。你若拿它去接，剑会咬你；你若把它熔了重铸，倒是能出两把好剑。”他顿了顿，又添一句，“只是熔剑那日，你多半会梦见它原来的主人。”"],"择":[{"名":"滴血认主","文":"你把掌心按在断口上。剑身一颤，青光暴涨，溪水被逼退三尺。你感到一股极冷的杀意直冲眉心，随即又退去，仿佛它只是试了你一试。当夜你在剑庐里发热，梦见一个背影在雾里走了很久。醒来时掌心多了一道疤，形状像半个“洗”字。","果":{"修为":100,"气血":-18,"器物":1,"因果":1}},{"名":"熔剑重铸","文":"你把断剑交给老匠人。炉火起了三夜，第二夜你果然梦见一个人坐在崖边，手里握着半截剑，久久不肯松手。第三日成剑两柄，一长一短，寒光内敛。老匠人只收了一柄作工钱，说这行当就是这个规矩：拆了别人的剑，就得替他留一半。","果":{"灵石":60,"器物":1,"道心":-1,"修为":40}},{"名":"送回崖下","文":"你背着剑走了两日，到{地点}崖边，把断剑埋在一块背风的石下，压了三块石头。埋完你在崖上坐到日落，风从崖底刮上来，卷着乌头的苦气。你说了一句不相干的话，转身下山。此后你的剑道进境反而快了，像是有人在前头替你探路。","果":{"悟性":3,"道心":3,"修为":50,"因果":1}},{"名":"卖给剑庐","文":"你以八十块灵石把断剑留在剑庐，老匠人没还价。走出溪滩时你回头看了一眼，他正把剑放进一只旧木匣，匣内垫着干竹叶。半年后你在云脚驿听说，那柄断剑被卖去了{宗门}，据说是一位新晋内门弟子的佩剑。买剑的人姓什么，剑庐从不说。","果":{"灵石":80,"因果":1,"道心":-2,"声望":-2}}]},{"id":"qinglan_008","题":"血月照潭","类":"天象","重":2,"域":["qinglan"],"境界":[1,5],"段":["那年秋分，{天象}。整个青岚域的竹海都静了，连虫声也停了。你正在{地点}的土屋里打坐，忽然听见潭面上传来一下极轻的水响，像有人把一只手掌按进了水里。推门出去，黑水潭的表面浮着一层薄薄的红，红得不刺眼，倒像陈年茶汤。","潭心有一处漩涡，转得很慢。漩涡中心浮着一件东西，是{器物}，半沉半浮，被水一圈一圈推着转。你正犹豫，屋后传来窸窸窣窣的声响——三个黑影从芦苇那边过来，步子齐得像一个人。走在最前面的是个{人物}，眼睛在月下泛着青，一声不吭地朝潭心走去。","他们走得很稳，一步一步进了水，水没过腰、没过胸、没过颈，没有一个人停。第三个下水的在最后回了一下头，你看清他的脸——那是白日里给你指过路的人。他张了张嘴，像是要说什么，嘴里涌出的却是黑色的水。潭心的{器物}忽然沉了下去，漩涡停了一瞬。"],"择":[{"名":"下水拉人","文":"你跳进潭里，水冷如刀割，一把拽住那人的衣领往回拖。他挣了一下，力气大得不像活人，可他终究被你拖上了滩。他趴在石上呕了半夜黑水，天亮时抬起眼，说你救错了人。三日后你听说，被血月引下潭的有九人，只有他一个上岸。","果":{"气血":-30,"因果":3,"道心":2,"寿元":-2}},{"名":"捞那器物","文":"你潜到漩涡边，把{器物}抄在手里。器物入手的一瞬，潭水静了，那三个黑影齐齐停住，转身看你。你上岸时后背湿透，回头看去，他们已经不见了。那器物很轻，像是空的，摇起来却听见里头有水声，一晃就是一片。你知道它不是给你用的。","果":{"器物":1,"魔念":3,"修为":60,"因果":2}},{"名":"退后观变","文":"你退回屋里，把门闩上，从窗缝里看到天亮。水退之后，滩上多了三双脚印，脚印一直延伸到潭心便断了。第二日沉潭的事传开，潭边的守潭哑仆在你门口放了一碗清水，碗底压着一片竹叶，是青岚域送客的意思。你把碗端回去，什么也没说。","果":{"悟性":2,"道心":1,"寿元":2,"声望":-2}},{"名":"摇铃乱之","文":"你摸出{器物}，照着潭面猛摇七下。铃声在雾里炸开，三个黑影齐齐一顿，像被无形的手扯住。其中一个转过头来，脸上没有五官，只有一层湿皮。你一直摇到手酸，等天亮，潭面平了，那三个人却再没浮上来。铃声招来的东西不止一类。","果":{"修为":80,"魔念":2,"因果":2,"气血":-15}}]},{"id":"qinglan_009","题":"落雁阵台","类":"秘境","重":2,"域":["qinglan"],"境界":[2,6],"段":["{地点}的布阵台围了一圈人。台上铺着青石，石面刻满阵纹，纹路里灌了银砂，日光下像一层水在流动。今日是落雁谷三年一次的“开台”，谁能在一炷香内破去台上三重小阵，便可带走一册《{功法}》的抄本，也能在谷中记一功。台上已经躺了两个，脸色发青，是被阵气反噬的。","轮到你了。第一重是迷踪，脚下一晃便无路可走，你闭眼凭气机走了九步，破。第二重是回风，阵中风刃贴面而来，你以{器物}挡了三下，肩头还是被割开一道口子。第三重还没起，台上忽然多了一个人——一个{人物}，笑着向台下拱手，说这一重他来陪你走一走。台下有人低声骂了一句。","那人一抬手，阵纹便自他脚下亮起，银砂流转，整座阵台被他接了过去。他不是来破阵的，他是阵房派来“验台”的人——验台的意思是，这一台的功劳，要归阵房。台下的人不敢出声。{天象}，石台边缘的银砂开始一粒粒往下掉，你忽然发现阵纹在他脚下有一道极细的裂。"],"择":[{"名":"从裂处破","文":"你不管他，径直踏向那道裂缝。银砂崩开一线，第三重的风刃自缺口倒卷，反噬向那个验台的人。他闷哼一声退下台去，袖口烧出个洞。台下静了一瞬，随即爆出叫好。谷中执事当众把抄本递给你，眼睛却一直看着阵房那边。","果":{"修为":160,"声望":12,"悟性":2,"因果":2}},{"名":"退下让功","文":"你抱拳退下台去，说今日气力不济。那人愣了一下，随即笑得极畅，替你把第三重走完了，功劳记在他头上。台下有人替你可惜，你不答。半月后台下有人悄悄塞给你一册手抄的{功法}，纸很旧，边角有火燎的痕，说是阵房一个被赶出去的老弟子留下的。","果":{"灵石":40,"器物":1,"道心":2,"声望":-3}},{"名":"邀他赌阵","文":"你说既来之，不如赌一局：两人各布一阵，同时入阵，先出者胜，输的人把这一台的赏让出来。台下哄然。他答应了。你布的是最寻常的三才阵，只把生门挪了三寸。他出阵比你早半息，却在台边一脚踏空，跌进了自己的阵里。谷中人从此记住了你的名字。","果":{"声望":15,"修为":120,"灵石":50,"因果":1}},{"名":"暗记阵图","文":"你退到台边，把台上九重阵纹的走向一一记下。那人验完台，赏归阵房，众人散去。你回去后用了六夜把阵图默画出来，画到第七夜忽然停笔——图上少了“归雁”一重，是那人有意留的。你想了很久，明白了一件事：阵房给人看的阵，永远少一重。","果":{"悟性":4,"修为":60,"魔念":1,"灵石":-20}}]},{"id":"qinglan_010","题":"内门丹方","类":"争斗","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的丹房后灶终年不熄火，你替一个{人物}看火三年，只为换每月十粒凝气散。这日灶上的三足药炉炸了一角，你收拾碎瓷时，从炉底夹层里摸出一张油纸，摊开一看，是一张丹方，字极工整，末尾画着一味药引——{灵材}。这不是外门能用的方子。","你把油纸藏进怀里，第二日便被叫去问话。问话的是个{人物}，很和气，只问你昨夜在丹房看见什么。你说只看见炉炸了。他笑着点头，临走时说了一句：“这丹方是给内门师兄试药的，方子丢了，火房的人要挨罚；方子要是外传了，火房的人要没命。”他走后，你摸了摸怀里的油纸，觉得它烫。","第三日，一个{人物}亲自来了火房，说要查炉。他蹲在碎瓷边看了很久，忽然抬头看你：“你手上的伤，是炉炸的时候烫的？”你点头。他站起身，把碎瓷一片片拾进袖袋，最后说：“这方子是我祖上传的，被人偷抄了一份，抄的人怕露，就把方子塞进了炉子里。你替我看着——那个人这几日一定还会来取。”"],"择":[{"名":"交还师兄","文":"你把油纸取出，双手递过去。师兄接过，看了很久，忽然苦笑，说这方子里的药引早绝了三十年，抄它的人大概也不知道。他临走时留下一瓶凝气散与一句话：“火房不用你看火了，明日去问心峰领差事。”你在丹房待了三年，头一回觉得灶上的火是暖的。","果":{"灵石":60,"声望":8,"修为":40,"因果":1}},{"名":"抄一份留底","文":"你连夜把丹方抄了一份，原件照旧塞回炉底。三日后果然有人来取，取走时神色慌张。半年后那位师兄因“私授丹方”被戒律堂带走，你手里的抄本成了唯一能证明他清白的东西——可你一直没拿出来。你把它锁在一只{器物}里，偶尔拿出来看，看一次心沉一次。","果":{"悟性":3,"因果":3,"道心":-3,"灵石":40}},{"名":"当面质问","文":"你问师兄：若这方子真是你家祖传，为何藏在宗门丹房的炉底。他沉默很久，说这方子是他父亲死前塞给他的，而父亲死于丹房的一炉炸膛。你们一起把碎瓷拼了三夜，拼出一枚不属于药炉的铜扣。师兄把铜扣收进袖里，什么也没再说。","果":{"修为":70,"因果":2,"道心":2,"气血":-8}},{"名":"卖与落雁谷","文":"你把丹方抄本送到{地点}。牙人只看了两眼，就开价一百五十块灵石，说这方子是青云宗封了三十年的旧物，值这个价。你拿了钱，第二日火房的差事便丢了。三个月后你在雁回渡遇见那位师兄，他瘦了一圈，看见你，什么也没问，只递来一碗茶。你喝了一口，苦得厉害。","果":{"灵石":150,"因果":3,"道心":-4,"声望":-6}}]},{"id":"qinglan_011","题":"茶棚旧账","类":"人情","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}的老茶棚只有四张桌，煮茶的{人物}守了它四十年。你常来，一碗粗茶两枚铜钱，加一碟炒豆。这日棚里来了个生客，一身洗白的青布袍，腰间挂着一枚{器物}，坐下便要最好的茶。老人端茶时手一抖，茶碗磕在桌上，泼了半碗。","生客没恼，反倒笑了：“四十年了，你还是这样。”老人的脸一下褪成灰白。你这才看清，那枚{器物}上刻着一个“云”字。棚里其他客人都不说话，只有炉上的水在响。老人慢慢坐回灶边的小凳上，说：“那年的事，我认。你要多少，我赔。”","{天象}，棚外竹影在地上摇。生客摇头，说他不是来要钱，是来要一句话：当年那批运往{地点}的茶里，掺了什么东西。老人垂着头，很久才开口：“掺了药，是给山门里那位治病的，治好了，也没人认。治死了，就要有人顶。”生客的手按在桌上，指节一点点发白。"],"择":[{"名":"替老人出头","文":"你把茶碗往桌上一顿，说这棚子你护了三年，谁要在这动手，先问过你。生客看了你半晌，忽然撤回手，笑了，说他只是要一句话，没想动手。他临走前留了十块灵石在桌上，说是茶钱。老人望着那枚灵石，忽然伏在灶台上哭了。","果":{"声望":6,"灵石":10,"因果":1,"道心":2}},{"名":"起身让位","文":"你放下茶钱起身走了。走到棚外，听见里面传来一声闷响，接着是碗碟碎裂的声音。你没有回头，走了很远，才发现自己一直把那碗没喝完的粗茶端在手里。茶早凉了。此后十年，你再没进过那间茶棚，路过时总是绕到竹林的另一侧。","果":{"道心":-2,"因果":2,"寿元":1,"悟性":1}},{"名":"问那药名","文":"你插了一句：那药叫什么名字。生客与老人同时转过头看你。老人嘴唇动了动：“叫断肠。”棚里静得只剩水声。你把这个名字记下了。后来你在断魂崖下的乌头根上找见了同样的味道，也终于明白，青云宗的山门考核里为什么有一项从不外传的嗅试。","果":{"悟性":4,"因果":2,"修为":30,"魔念":1}},{"名":"掀开旧账","文":"你逼着老人把整件事说完。他说那年死了七个外门弟子，宗门把账记在了茶帮头上，茶帮又记在他一个煮茶的头上，他赔了三年茶钱，赔到老婆跑了、儿子掉进回水。生客听完站起来，把腰间的{器物}解下放在桌上，说这东西是死的那个人的，如今该还给活着的人。","果":{"器物":1,"因果":3,"声望":4,"灵石":-20}}]},{"id":"qinglan_012","题":"黑水赏格","类":"灾祸","重":2,"域":["qinglan"],"境界":[1,5],"段":["赏格是贴在{地点}石桥边的一张黄纸，四角用血钉钉着，纸上只写了三行字：姓名、相貌、价。三日之内，全青岚域的散修都在传这张纸——因为被悬赏的人，是个连筑基都没到的无名之辈。赏格最后一行写着：活捉三十块灵石，死的不收。","你围着看了半晌，忽然发现纸上画的眉眼有些眼熟。再细看，那不是别人，正是你自己。旁边一个{人物}凑过来，笑嘻嘻地念了一遍纸上的名字，扭头看见你，笑容僵在脸上，又慢慢收了回去，什么也没说，转身走了。石桥上的风忽然很冷。","{天象}，桥下流水浑浊。你摸出随身的{器物}，犹豫要不要即刻出域。此时过来一个挎刀的人，步子不快，停在赏格前看了一会儿，回过头对你说：“这纸上的价开得低了些。”他把手搭在刀柄上，“我出五十块灵石买你一夜的时间，跟我走一趟{地点}，你若不去，我就当没见过你。”"],"择":[{"名":"跟他去","文":"你跟他走到{地点}，一路上他没问你的名字。到了地方才知道，他是在找一个人——三年前被黑水堂掳走的妹妹，赏格上那个“三十块灵石”是他压出来的价，为的是让人把消息递到黑水堂耳朵里。你陪他在潭边蹲了一夜，什么也没等到。天亮时他给了你五十块灵石，说这钱你拿着，别再回来了。","果":{"灵石":50,"因果":2,"道心":2,"气血":-8}},{"名":"撕了赏格","文":"你伸手把黄纸扯下来，血钉划破了掌心。挎刀的人愣了一下，随即大笑，说你这脾气迟早要死在青岚域。他把刀收回鞘里，转身走了。你攥着那张纸走了三十里，在一处溪边把它烧了，灰烬顺水漂走。掌心的伤口三个月才收口，疤是四个点的形状。","果":{"气血":-18,"声望":5,"因果":2,"道心":2}},{"名":"反查悬赏人","文":"你找到{地点}的牙人，用二十块灵石买一条消息：这张赏格是谁出的钱。牙人查了两日，回你三个字：落雁谷。再问，便怎么也不肯说了。你忽然明白，价开得低不是看不起你，是有人要别人觉得你不值钱。这份人情，比赏格更重。","果":{"灵石":-20,"悟性":3,"因果":1,"声望":3}},{"名":"连夜出域","文":"你把赏格撕下一角塞进袖里，当夜便走。走出青岚域地界时，天刚蒙蒙亮，身后没有追兵。你在云脚驿外回头看了一眼，那片竹海在雾里绿得发暗。半年后你听说那张赏格一直挂着，从三十块灵石涨到两百块，挂赏的人始终没露过面。","果":{"寿元":2,"修为":30,"道心":-1,"因果":1}}]},{"id":"qinglan_013","题":"藏经阁漏页","类":"宗门","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的差事最是清苦：抄经，一日抄满三百字，抄错一字整页重来。你替一个{人物}打了半年下手，抄到第七十七卷时，翻页的手停住了——这一卷讲的是{功法}，中间却缺了一页，缺口齐整，是被人割下来的。你抬头看了看阁中，只有窗外的{天象}。","你把那一卷悄悄带了回去，用了三夜把上下文重新拼读。缺的那页讲的是{功法}里“符剑相济”的一段，前后都是总纲，独独中间这一页是法门。你断定：割页的人怕人看出法门，索性连引子一起割了。第四日你回阁还书，发现书架上那一卷已经换了一册新的，封面还带着墨香。","管阁的{人物}拦住你，问你那一卷去了何处。你说抄漏了，回去补。老人盯了你很久，忽然从袖中抽出一张薄纸：“你找的是这个？”纸上正是缺的那一页，字迹苍劲，边角有一处焦痕。他把纸往灯焰上方送了送，说：“抄经的人抄到手酸，就爱撕一页去换酒钱。可这一页，撕裂了三十年，没人敢补。”"],"择":[{"名":"讨要那页","文":"你说你想补。老人看了你半晌，把纸递过来，只提了一个条件：补好之后，这一卷仍旧归架，谁也不能带走。你用了整整一夜，把那一页的墨色调到与前后一致，补进去时连纸的厚薄都算准了。老人翻看过后什么也没说，第二日给你换了个差事：不再抄经，改做补书。","果":{"悟性":4,"声望":5,"修为":40,"灵石":20}},{"名":"默记于心","文":"你把那页纸上的字看了一遍，一遍就记住了。老人收回纸时，你眼睛都没眨。此后三年，你练剑时总觉得那页上的法门在经脉里走，走得不通，却一直在走。你始终没敢把它写下来，因为你隐约觉得，那页纸不该只有一个人看过，也不该只有一个人记得。","果":{"修为":120,"悟性":3,"气血":-10,"因果":1}},{"名":"告发老人","文":"你转身去了戒律堂。三日之后，管阁的老人被革了职，藏经阁三层封了一月。你得了二十块灵石的赏，还被提去做了外门弟子的书役。只是从此以后，阁中的老书役见你都不说话。半年后你听说那老人在山下的破庙里病死了，死前手里攥着半张烧焦的纸。","果":{"灵石":20,"声望":6,"道心":-4,"因果":2}},{"名":"撕下自己的页","文":"你回到住处，把抄了一半的那一册翻开，在缺页的地方，自己另写了一页补上——写的不是法门，是一段劝人勿贪的闲话。第二日你把书交回去，管阁老人翻到那一页时，愣了很久，忽然笑出声来，说三十年了，头一回见人这么补书。他把那一页留着，没换。","果":{"道心":3,"悟性":2,"声望":3,"灵石":-10}}]},{"id":"qinglan_014","题":"雁回渡救溺","类":"人情","重":3,"域":["qinglan"],"境界":[0,3],"段":["夏汛的{地点}水势汹汹，回水涨了半丈，江面漂着断木与草筏。你正在渡口的茶摊上避{天象}，忽然听见有人喊：“翻船了！”抬头一看，江心一条渡船已经侧翻，船底朝天，几个黑点在水里起伏。船夫在岸上跺脚，说今日水太急，下水的都是送死。","落水的有一个女子，抱着一只{器物}，那是落雁谷的信阵盘。她一手抱着盘，一手划水，怎么也不肯松手，人却越漂越远。岸边看热闹的围了三十几个，没有一个动。一个{人物}扯着你的袖子小声说：“那是落雁谷的人，救了她，谷里未必认；救不起来，谷里一定记。”","{天象}，水声盖住了所有别的动静。你看见那女子呛了一口水，手的姿势变了，像是要松。江面上漂过来一只空木桶，转了两圈就沉了。船夫在你身后低声数着浪头：“第三浪一过，人就没了。”你脚边的石头上有一道旧绳印，是往年救人系绳留下的。"],"择":[{"名":"下水救人","文":"你把外袍一脱，抓了根断绳系在腰上，让船夫在岸上扯着，一头扎进回水。浪把你拍了三次，第三次你抓住了她的袖口。上岸时两人都吐了满地的水，她怀里的信阵盘裂了一道纹，却还在。她抬头看了你一眼，说了三个字：我记下了。然后走了。","果":{"气血":-25,"声望":8,"因果":1,"灵石":30}},{"名":"救人先夺盘","文":"你下水之后先伸手去够那只信阵盘。她死也不放，两人在水里撕扯了两息，你终于把盘夺过来，她才腾出手划水，勉强靠岸。她坐在滩上看了你很久，什么也没说，接过盘就走了。半月后你在{地点}遇上落雁谷的牙人，对方说：谷里有人托我问你一句，那天你到底先看的哪个。","果":{"器物":1,"因果":3,"道心":-3,"灵石":20}},{"名":"喊人添赏","文":"你没下水，站在石头上喊：谁把人捞上来，我出三十块灵石。喊了三遍，有个断了刀的散修跳了下去，把人拖了回来。你的钱花了一半，人也没死。散修上岸后拍拍你的肩，说你这法子比下水聪明。你说不出话，看着那女子被扶走，手里那点剩下的灵石凉得像铁。","果":{"灵石":-20,"声望":4,"道心":1,"因果":1}},{"名":"转身走开","文":"你转身离开渡口，走进雨里。走出十几步，听见身后一片惊呼，接着归于安静。你没有回头。三日后你在{地点}听人说，那天淹死了两个，一个是船夫的儿子，一个是抱盘的女子，盘沉在江底，谷里的人捞了两天没捞着。你把碗里的酒倒了半碗在地上。","果":{"道心":-4,"因果":3,"寿元":1,"悟性":1}}]},{"id":"qinglan_015","题":"赌坊铜钱","类":"市井","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}后巷的赌坊只有一间半屋，门帘是旧麻袋缝的，里头点三盏油灯，烟熏得人睁不开眼。庄家是个缺了两指的{人物}，骰子在他手里转得比眼快。你身上只剩一枚铜钱，是替人跑了三天腿挣的，本想换成半块灵石，结果被拉上了桌。","赌的是“猜单双”，最笨的一种。你押单，开双；押双，开单。连输七把，铜钱还没出手，因为庄家说铜钱不能上桌，只能押物。他把一只{器物}推到你面前，说这物件抵半块灵石，你要是赢了他，东西归你。你看了看那只器物，忽然发现它的底座上有落雁谷的阵纹。","第八把，你押单，开的是单。庄家愣了一瞬，笑说手滑了，重开。第九把，你又押单，又开单。他脸上笑意淡了，把袖子往上一撸，露出小臂上一道血纹。赌坊里其他人都停了手。{天象}，门帘被风掀开一角，外头有人在等。"],"择":[{"名":"见好就收","文":"你把器物拿在手里，站起身说今日到此为止。庄家没有拦，只在你走出门帘时说了一句：“你运气好，不是手气好。”你没有追问这句话的意思。三日后你把器物拿去{地点}，牙人一看就变了脸色，说这是黑水堂的东西，问你在哪里捡的。你说赌来的，他就不肯再问。","果":{"器物":1,"灵石":20,"因果":2,"悟性":1}},{"名":"再赌一把","文":"你把器物押回去，说全押单。庄家转了转脖子，骰盅落下，开的是双。他笑了，把器物收进袖里，还拍了拍你的肩。你走出赌坊时，身上一枚钱也没有，天已经亮了。后来你在{地点}见到那只器物，摆在落雁谷的布阵台上，被当成了阵眼。","果":{"灵石":-30,"道心":2,"因果":1,"修为":20}},{"名":"掀他袖子","文":"你伸手一把掀开他的袖子，那血纹看得清清楚楚——是黑水堂的养尸纹。赌坊里一下静了。庄家脸色变了三变，终于收回手，把器物推给你，又摸出一小袋灵石扔在桌上，说走，从此别来。你拿着东西出门，听见身后有人在低声收拾骰盅，声音很急。","果":{"器物":1,"灵石":40,"因果":3,"魔念":1}},{"名":"问他血纹","文":"你不赌了，只问了一句：那血纹是画的，还是长的。庄家的手停在半空，很久才低声说：“长的。我这只手，三年前还是齐的。”他把骰盅盖住，说今夜不开了，让人都散。临走时他塞给你半张纸，纸上写着一个人名，是{地点}的一个尸倌。","果":{"悟性":3,"因果":2,"灵石":-10,"道心":2}}]},{"id":"qinglan_016","题":"竹节人偶","类":"奇闻","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}深处有一片老竹，竹身合抱，节上生霜。你路过时听见有人在里头说话，声音细而快，像是几个孩子在争一件事。你拨开竹叶进去，只见林中空地上摆着七个竹节人偶，每个巴掌长短，用竹枝扎成，穿的是旧布片，摆成一个围坐的圈，中间放着一只{器物}。","人偶的位置很讲究，是一个小阵。你蹲下去看，忽然发现每个偶的胸口都刻着名字，刻得极浅，须对着光才看得见。七个名字里有三个你认得：是近三年在竹海里失踪的采药人。{天象}，竹梢上落下一滴水，正落在最中间那只偶的头顶。","你伸手要拿那只{器物}，身后忽然有人开口：“别碰。”转头一看，是个白发的老{人物}，手里拄着一根竹杖。她说这是“招魂阵”，摆阵的人想找回失踪的人，摆到第七个偶时不敢再摆，因为名字一对不上，找回来的就未必是人。“你来得巧，”她盯着你，“第八个名字，刻谁？”"],"择":[{"名":"添上自己","文":"你取了把小刀，在自己掌心划了一下，把血涂在第八只偶的胸口，写下自己的名字。老人没拦。当夜你梦见竹海深处有人唤你，声音像母亲，也像陌生人。醒来时第七只偶不见了，你手里攥着一片竹叶，叶上有一道新鲜的刻痕。","果":{"因果":4,"悟性":3,"气血":-15,"魔念":2}},{"名":"拆了此阵","文":"你一脚把围坐的偶踢散，竹枝滚了一地。老人叹了口气，说拆了就拆了，找不回的人也找不回了。她蹲下去把偶一支一支拾起来，拾到最后一只时忽然停住，说这只不对，不是她扎的。你拿过来看，偶的背面写着三个字：别找了。","果":{"因果":2,"道心":2,"修为":30,"声望":3}},{"名":"去寻前人","文":"你问老人这只{器物}是从哪来的。她说是三年前一个散修留下的，那人说只要摆满九个偶，就能把人从竹海里领回来。那散修后来竹海深处再没出来。你循着老人指的方向走了半日，在一棵老竹下找到一具盘坐的骸骨，怀里抱着八只竹偶。","果":{"修为":60,"因果":2,"悟性":2,"道心":1}},{"名":"原样退出","文":"你把手收回来，拜了一拜，原路退出竹林。走出十几步再回头，空地上已经什么都没有了，只有一圈被压弯的草。老人的声音从竹涛里传出来，说你还算知道分寸。此后你在竹海里再没迷过路，哪怕雾再重，也总能找到一条走出去的道。","果":{"道心":3,"寿元":2,"悟性":2,"修为":20}}]},{"id":"qinglan_017","题":"云脚驿夜雨","类":"修行","重":3,"域":["qinglan"],"境界":[0,3],"段":["{天象}，{地点}的茅顶漏了三处，雨水顺着梁往下滴，滴在青石地上的水洼里，一声，又一声。驿站里挤了十几个过路的人，有挑担的、有赶尸的、有一个背着书箱的{人物}。老驿丞在灶上煨了一锅热汤，说今夜谁也走不了，雨要下一整夜。","你盘腿坐在墙角，听着那雨声，忽然觉得每一滴落下的间隔都是一样的。你数了数，三十六滴之后，节奏变了一次。再看那水洼，涟漪散开的形状也有了规矩：一圈大、两圈小、三圈散。你心里一动，想起曾听人提过{功法}里有一门以雨声为引的吐纳法。","{天象}，漏下来的水连成了线。屋里的人在打鼾、在磨牙、在低声说话，只有你盯着那根水线。你试着把呼吸对上去，第一次对不上，第二次胸口发闷，第三次时，那股窒闷忽然散开，一线凉意自尾闾直上，直冲到眉心，又被什么挡住了。窗外雷声一响，屋里所有人都醒了。"],"择":[{"名":"再试一夜","文":"你不管屋里的人，闭上眼睛把呼吸重新对上去。天快亮时，那线凉意终于冲破了眉心的关，你听见自己骨节里传来一声轻响，像琴弦绷断又接上。第二天你走出驿站，雨停了，屋檐还在滴水。老驿丞说你的脸色比昨日好看，你只是笑了笑。","果":{"修为":90,"悟性":3,"气血":-8,"寿元":1}},{"名":"推敲雷声","文":"你不再管雨，转去听雷。雷在不同的云层间滚过来，声音有先有后，有厚有薄。你把每一记雷的间隔都记下，到天亮时已记了一百二十七记。这一夜你没长修为，却把雨的节奏与雷的节奏对了起来，隐隐摸到了一点“势”。老驿丞看你望着天发呆，说你像他年轻时候。","果":{"悟性":5,"修为":40,"道心":2,"灵石":-5}},{"名":"替人挡雨","文":"你把墙角的干草推到漏得最狠的那处，又把自己的斗笠挂上去，替打鼾的赶尸匠与读书的书生挡了一夜雨。天亮时你浑身湿透，反倒觉得气脉通畅——一夜没睡，却没困。书生起身向你一揖，说他记下了。三年后你在{地点}再遇见他，他已是青云宗的外门书役。","果":{"道心":3,"声望":4,"修为":40,"气血":-6}},{"名":"偷学吐纳","文":"你注意到背书的那个{人物}也在对雨听声，气息与你一模一样。你不动声色地照着学。学到第三遍时，他忽然睁眼，看着你笑了一下，说：“这法子我师父不让外传，你学就学了，别说是从我这学的。”他给了你半卷薄册，转身睡去，第二天走得比谁都早。","果":{"修为":70,"悟性":2,"因果":1,"器物":1}}]},{"id":"qinglan_018","题":"卖符老妪","类":"人情","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}的墙根下支着一张矮桌，桌上摆着黄纸、朱砂、一支秃笔。卖符的{人物}在那里坐了二十年，符有三种：镇宅、驱虫、安神，一张两枚铜钱。她不喊价，也不招揽，有人来就画，没人来就打瞌睡。这日她忽然拉住你的衣角，说：“后生，替我画一夜符，我手抖了。”","你应下了。黄纸裁好，朱砂调匀，笔落下去才知道难——那支{器物}的第三笔要一口气走完，中间断了便废。你画废了七张，老妪不说话，只在你画坏的地方用指头点了点，让你看。第九张时你终于一气画完，符纸自己轻轻一颤，那是符成了。天亮前你们画出四十张，她一张也没验收。","{天象}，街上有早起的脚步声。老妪把四十张符收进一只旧布囊，忽然说：“这些符不是卖的。明日{地点}要来人收地，这一街的人今晚都要走，我给他们一人一张，路上能壮胆。”她看了看你，又说，“你替我画了符，我本钱没给你，给你个别的——我教你看符的死活，学不学？”"],"择":[{"名":"拜师学符","文":"你在矮桌前跪下。老妪教了你三日，只教了一件事：什么叫“符活”。她说符活不在笔画，在落笔时心里有没有想着要护的人。第四日她把秃笔给了你，说这街上的人走了七成，剩下的三成买不起符。你在墙根下又坐了三年，符价一直是一张两枚铜钱。","果":{"悟性":4,"修为":50,"声望":6,"灵石":-20}},{"名":"送街坊出域","文":"你没学符，先帮着把整条街的人送出了{地点}。四十张符不够分，你就把符裁成两半，一家半张。走到云脚驿时天已经黑了，有人回头看了一眼那片竹林，说这辈子不回来了。老妪走在最后，提着她的矮桌，走得很慢，没让你扶。","果":{"声望":10,"因果":2,"道心":3,"灵石":-30}},{"名":"夜里偷看符本","文":"你趁老妪打盹，把矮桌下的木匣抽出来看。匣里不是符本，是一册旧账，记着二十年里每一张符的买主：买镇宅的是谁家死了人，买驱虫的是谁的田里出了妖物，买安神的是谁夜里睡不着。你合上匣子时，老妪睁着眼看你，说看完了？那就记住，别乱讲。","果":{"悟性":3,"因果":2,"道心":-1,"灵石":20}},{"名":"替她守摊","文":"你说学符可以，但要她把真话说全——那些符真的只是镇宅驱虫？老妪笑了，说后生眼毒。她摊开一张符，指着角的暗纹说，这一笔是给落雁谷留的记号，谁买过符、买了几张、何时买，谷里都记着。她说这不是坏事，是这街上的人能活到今天的缘故。你替她守了三个月摊，学会了怎么不让人看第二眼。","果":{"悟性":3,"因果":1,"灵石":40,"声望":2}}]},{"id":"qinglan_019","题":"潭底锁尸窟","类":"秘境","重":2,"域":["qinglan"],"境界":[2,6],"段":["黑水潭的水比想象中浅，往下沉了三十丈才见底。潭底不是泥，是一整片青石，石上凿着孔，孔里穿出铁链，粗如儿臂，一路向深处延伸。你顺着铁链游过去，链子尽头是一道石门，门上刻着无数蝌蚪纹，纹里嵌着{灵材}的碎屑，泛出暗红。{天象}，水面上透下来的光只剩一线。","你用{器物}撬开门缝，门后不是水，是气——一股腥甜的气从里面涌出来，把水都推开了。门里是一间石室，四壁上锁着七具尸，都还是坐着的姿态，衣袍未烂。正中的石台上摆着一只黑水陶瓮，瓮口封着朱砂，瓮身用铁箍箍了三道，箍上刻着年月，最近的一道是三十七年前。","你游近陶瓮，忽然发现瓮在自己动，极轻，一下一下，像是里头有人在呼吸。石门外传来水声，有人下来了。你回头看，水里浮着两点青光，那不是鱼的。一柄{器物}从青光的方向伸过来，指着你的背。你听见有人在水中传音，字字清楚：“这瓮压了三代，你要开它，先说说你打得过谁。”"],"择":[{"名":"与来人谈","文":"你转身，慢慢把手摊开，示意不抢。来的是个老尸倌，脸泡得发白。他看了你的手势，收了几分杀意，传音说这瓮里封的是堂中老祖的半身，三代人没敢开。他让你帮忙抬一件东西上去，做为封口。你抬的是一只沉甸甸的铁匣，出水时你才发现匣底刻着青云宗的山门纹。","果":{"修为":140,"因果":2,"魔念":2,"气血":-20}},{"名":"劈开铁箍","文":"你一{器物}劈在最上面那道铁箍上，箍应声而断。陶瓮里的呼吸骤然急促，整间石室的七具坐尸齐齐抬头。老尸倌惨叫一声，转身就游。你没走成——一股巨大的吸力把你按在石台上，直到你咬破舌尖把血喷在瓮口，那股力才退了。出水时，你左臂上多了一圈铁链形的青痕。","果":{"魔念":4,"修为":200,"气血":-35,"因果":3}},{"名":"记下位置","文":"你没有碰瓮，只是把石室的方位、铁链的走向、七具尸的姿态都记在心里，然后随老尸倌一同出水。上岸后你在{地点}的石板上画了半夜，画到最后一笔时忽然停住——按你记下的图，这间石室根本不在潭底，而在潭水之下更深的另一处。你画错了，或者它本来就会动。","果":{"悟性":4,"修为":60,"因果":1,"道心":2}},{"名":"带走灵材","文":"你不去碰瓮，只把石门蝌蚪纹里嵌的{灵材}碎屑一粒粒抠下来，抠了小半袋才出水。那些碎屑在日光下一晒，颜色由暗红转成灰白，腥甜味散了，只剩一点铁锈气。你拿到{地点}去卖，牙人捏在手里看了很久，说这东西不是灵材，是尸牙磨成的粉，一粒值一块灵石。","果":{"灵石":60,"灵材":1,"因果":1,"魔念":1}}]},{"id":"qinglan_020","题":"三十七次落榜","类":"宗门","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}下有个老考生，四十来岁，鬓角全白了，背着个旧布包，年年九月都来。你听他旁边的{人物}说，此人从十五岁考到今年，已经三十七次了，每次都在试心石阶上过不去。他不说话，只把手里的{器物}翻来覆去地摸，摸得木头都亮了。","今年他排在很前面。铜磬一响，他抬脚就上，走得极稳。你在后面看着，数到第一百二十级时，他忽然停了，站在阶上不动，肩膀剧烈地抖。后面的人开始骂，一个{人物}在牌坊下敲磬催。他不下，也不上，就那么站着，站到日头偏西，汗把衣服浸透又晒干。","{天象}，石阶上的雾气一层层压下来。他忽然回过头，朝队伍里喊了一声：“谁带了水？”声音哑得几乎听不见。没有人应。他笑了一下，转回去，抬脚往上走。走到第一百三十级，他整个人往前一扑，趴在石阶上，很久没有动。执事抬起了手。"],"择":[{"名":"送水上去","文":"你挤出队伍，捧着一只{器物}跑上石阶。阶上的幻境对你不管用——你眼里只有一个趴着的人。你把水灌进他嘴里，他呛了两口，睁开眼，说了一句：“我看见了。”你问他看见什么。他说：“我看见我娘在山下等我。她等了三十七年。”他站起来，一级一级走完了剩下的路。","果":{"声望":10,"因果":2,"道心":3,"修为":30}},{"名":"替他求情","文":"你跑到牌坊下，对那个{人物}说此人考了三十七年，可否容他再歇一炷香。执事看了你一眼，说山门规矩不为一人的。可他到底还是把那炷香点上了，插在石缝里。香燃到一半，石阶上的人自己站了起来，走完了。他过了。执事在名册上画圈时，笔尖顿了很久。","果":{"因果":2,"声望":6,"灵石":-10,"悟性":1}},{"名":"趁乱上山","文":"众人都在看那个人，你趁机混进前头的队伍，一口气走到了石阶顶。接引长老点到你的名字时，你答得很响亮。三年后你成了外门弟子，而那个人据说当年还是没过。你偶尔在洗剑峰下看见他，他背着旧布包，还在等九月。你们从没说过话。","果":{"修为":60,"声望":4,"道心":-2,"因果":1}},{"名":"问他旧事","文":"散场后你在山门外截住他，问他这三十七年到底为了什么。他解开布包，里面是三十七片竹签，每年的名册上都有一片，签上写着一个名字——不是他的名字，是他妹妹的名字。他说当年两人一起考，妹妹在石阶上没撑住，掉下去了，他想替她再考一次，看能不能过。","果":{"悟性":3,"因果":3,"道心":2,"灵石":-20}}]},{"id":"qinglan_021","题":"焦竹阴沉","类":"机缘","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的老竹，十棵里有九棵是活的，只有一棵在去年雷火里死了，焦黑直立，竹皮剥落。药农说死竹不值钱，可你听一位{人物}讲过，雷火劈过又活不成的老竹，埋在土里的那截会转成阴沉竹，色如墨玉，是制符笔的上材。你带了把锯子进林，找到了那棵焦竹。","锯到一半，锯条卡住。你蹲下去看，发现竹节里塞着东西——一小卷油布，裹着一枚{器物}和几张符纸。符纸上的笔迹极熟，你认出来是{地点}那位卖符老妪的手笔。油布之外还缠着一根红绳，绳结是打给死人的。{天象}，林子里静得能听见自己的心跳。","{天象}，你拆开油布，符纸里夹着一行小字：“此竹不卖，此物不取，取者代我守三年。”落款处没有名，只有一个指印。你抬头看了看这棵焦竹，它的位置很怪——竹海中所有的竹都朝东边倒，只有它是正的。风吹过来，别的竹都在响，它不响。"],"择":[{"名":"守竹三年","文":"你把油布原样包好，塞回竹节，在这片林子里搭了间草棚。三年里你伐过柴、采过药、替人看过山，也见过三拨人来锯这棵竹，都被你挡了回去。第三年冬至，焦竹上抽出一枝新芽，绿得刺眼。你在竹前站了一夜，天亮时明白，那句“守三年”守的不是竹。","果":{"修为":130,"道心":4,"寿元":3,"灵石":40}},{"名":"取物留字","文":"你把{器物}取走，在符纸背面写下自己的名字与住处，塞回原处。三年里没人来找你。第四年你把器物拿到{地点}请人看，那人只看了半眼就把东西推回来，说这是镇尸的，你带着它睡了三年，胆子够大。你笑了笑，回去把东西埋在了那棵竹下。","果":{"器物":1,"魔念":2,"修为":60,"因果":2}},{"名":"锯下沉阴竹","文":"你不管那些符纸，把焦竹齐根锯断，取了三尺阴沉竹，扛出林子。制笔的老匠人见了爱不释手，出价一百二十块灵石。你卖了一半，留了一半。半年后你在{地点}听说，竹海里那片林子全枯了，一夜之间，连根都黑了。","果":{"灵石":120,"灵材":1,"因果":3,"道心":-2}},{"名":"问卖符老妪","文":"你把油布带去{地点}。老妪正在打盹，见了东西没睁眼，只说了三个字：“我儿子的。”她告诉你，她儿子十二年前进了竹海，再没出来，这棵竹是他最后一处落脚的地方。她让你把东西送回去，说她不缺钱，缺一个肯把东西送回去的人。你送回去了。","果":{"道心":3,"因果":2,"声望":5,"悟性":2}}]},{"id":"qinglan_022","题":"石缝尸莲","类":"灾祸","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}岸边生着一丛莲，不在水里，长在石缝间，花是白的，蕊却泛着肉红。守潭的哑仆用手比划着告诉你：这莲不能碰。你不懂他的意思，蹲下去细看，莲茎上爬满了细丝，丝连着石缝底下，深处黑得看不见底。{天象}，潭面上浮起一层薄雾。","你伸手折了一枝{灵材}，茎断的地方渗出一线暗红的汁，气味甜得发腻。当夜你便觉不对：胸口发闷，吸气时总觉得有另一口气在肺里跟着。子时你睁眼，看见床前站着一个白影子，很矮，只有三尺高，穿着莲花瓣似的衣裳，一动不动地看着你。你想起那丛石缝里的土，是黑的，是尸土。","第二天你回到潭边，那丛莲已经被踩平了一片，石缝里的土被人翻过。哑仆拄着铁锹站在旁边，脸色很难看。他指了指潭东的土堡，又指了指你，比了个“三”的手势。你正看不懂，{人物}从芦苇后转出来，手里提着一只{器物}，说是来收“活引”的。"],"择":[{"名":"随他去解毒","文":"你跟他进了土堡。他让你躺在一张石床上，用针在胸口扎了七下，放开黑血半碗。血里果然有一丝像根须一样的东西在动。他说：“尸莲以尸为土，以活人作引，一时三刻便可入肺。”他救了你，也让你替他做一件事：把潭西那片莲拔干净。你拔了三天，拔到指尖全是黑。","果":{"气血":-25,"修为":80,"因果":2,"魔念":1}},{"名":"自己逼毒","文":"你回屋里盘腿坐了三日，以{功法}的吐纳一点点把那口气逼到右臂，再以{灵材}敷住，割开手腕放血。血是黑的，放了半碗。毒解了，右臂却从那年冬天起常常发凉。此后你见了白骨、腐肉、枯花，鼻子都会先于眼睛替你做判断。","果":{"气血":-18,"悟性":3,"修为":70,"道心":2}},{"名":"拔尽石缝","文":"你不等谁来收引，当夜就把那一丛莲连根拔尽，石缝里的土全扒出来埋到别处。拔到最后一枝时，缝底下露出一枚黑陶钱和半截指骨。哑仆看着你做完，忽然向你抱了一拳，这是他这几年第一次对人行礼。土堡那边次日一早就亮了灯，没人出来。","果":{"声望":6,"因果":3,"修为":50,"气血":-12}},{"名":"以莲制人","文":"你采了七枝尸莲，晒干收进{器物}里。后来你用其中一枝换了一百块灵石，买主是{地点}的一个散修，说要拿去毒一个负心人。你收了钱，没有多问。那个散修半个月后死在赌坊门口，七窍流黑水，莲的毒比你想的烈。你把剩下的六枝烧了，烧时手一直在抖。","果":{"灵石":100,"魔念":3,"因果":3,"道心":-3}}]},{"id":"qinglan_023","题":"缺角青云令","类":"宗门","重":2,"域":["qinglan"],"境界":[2,5],"段":["那枚{器物}是在{地点}的石缝里捡到的，青玉，正面“青云”二字，背面刻着峰名与编号，缺了一角。拿在手里，玉是温的。你把它带在身上三日，第四日就有人在{地点}截住了你，是个面色阴沉的{人物}，说这令牌是他失散的兄长的，请你归还。","你揣着那枚{器物}，没有立刻给。他见你迟疑，从袖中取出一封信，信上的字迹与令牌背面刻的编号对得上。他说他兄长七年前入山门，三年后“病亡”，家中连尸骨都没见着。令牌是唯一的凭据，他要拿着它去问戒律堂一句话：一个外门弟子，怎么会“病”在藏经阁。","夜里你翻来覆去，把令牌对着灯看。玉里有一道极细的裂，顺着裂往里看，能隐约看见一线金粉——这是宗门的“留影”手法，把一件事封在玉中，非本门手法不可解。{天象}，窗外竹影摇得厉害。你忽然意识到，这枚令牌不只值钱，它还值命。"],"择":[{"名":"还他信物","文":"你把令牌还了。那人接过去时手在抖，说了三声谢谢。你提醒他玉里有裂，可能在留影。他愣了很久，忽然跪下去朝你磕了个头，说不管里头是什么，他都要看。三日后戒律堂抓了两个人，一个是藏书阁的老书役，一个是当年的执事。你把这件事忘了很久。","果":{"声望":8,"因果":2,"道心":3,"灵石":-10}},{"名":"开玉取影","文":"你找了{地点}的一位老匠人，花了六十块灵石，把玉里的留影解了出来。留影很短：一间黑屋子，七个穿内门服色的人在分一炉丹药，其中一个回头看了一眼——那一张脸，你在山门考核时见过，正是如今戒律堂的副执事。老匠人看完把玉石磨了，说这东西不能留。","果":{"灵石":-60,"悟性":4,"因果":3,"声望":-2}},{"名":"留着换价","文":"你把令牌收进{器物}里，什么也不说。那人跟了你三天，第四天不见了。半月后有人在云脚驿出三百块灵石收这种令牌，你去卖了。买主是个笑得很和气的中年人，收了令牌只说一句：“你运气好，没把它带进山里。”你走出十里，背后一阵发凉。","果":{"灵石":300,"因果":3,"魔念":2,"道心":-3}},{"名":"代他持令问山","文":"你带着令牌上了青云山，在戒律堂外站了三个时辰，最后把令牌递进去，只说了一句：我想问问七年前那位外门弟子死在何处。堂中静了很久，出来一个老执事，收了令牌，让你回去等。等到的不是答案，是一封推脱的回文与二十块灵石的车马钱。你把回文烧了。","果":{"声望":4,"因果":3,"修为":40,"道心":2}}]},{"id":"qinglan_024","题":"雾中灯笼鬼","类":"奇闻","重":2,"域":["qinglan"],"境界":[0,3],"段":["{天象}，你从{地点}往回走，走到半路，雾里亮起一盏灯笼，红的，不高不低地悬着，一动不动。青岚域的夜路人有一句老话：雾里见灯，千万别跟。你不打算跟，可那灯忽然晃了一下，往你这边移了三尺。你退一步，它进一尺。","你摸出{器物}握在手里，慢慢往路边的竹林退。灯笼不紧不慢地跟着，光落在竹叶上，是冷的。走到一处岔口，岔口立着一块旧碑，碑上刻着地名，字被磨得只剩半边。灯笼停在碑前，晃了两下，忽然灭了。雾里传来一个女人的声音，很轻：“替我看一眼碑上写的什么。”","你走近去看。碑上的字确实是“{地点}”，只是下头还有一行小字，深深刻进石里：万历七年，路断。你念了出来。雾里的声音静了很久，忽然说：“断了好。”灯笼重新亮起来，这次的光是暖的，照着一个穿青布衫的影子，正一步一步往岔路那头走，走得极慢。"],"择":[{"名":"送她一程","文":"你提起灯笼，跟在她身后走。走了不知多久，雾散了，天边泛白，脚下是{地点}的青石路，灯笼已经不在你手里。你低头看，手里攥着一截烧尽的灯芯。此后你在夜路上再没见过红灯，倒是常遇见过路的散修说，青岚域的雾夜里，总有人替人提灯。","果":{"因果":2,"道心":3,"寿元":2,"修为":40}},{"名":"问她要什么","文":"你站着不动，问她要什么。她说她想回家，可路断了，她记不得该怎么走。你说路断了可以重走。她笑了一声，说她已经走了三百年。灯笼灭时，雾里落下一枚铜钱，是极旧的那种，边缘磨得圆了。你把铜钱收好，后来它在你落魄的时候，换过三顿饭。","果":{"灵石":20,"因果":1,"悟性":2,"道心":1}},{"名":"断碑离开","文":"你不理会，绕开碑往另一条路走。走出百步，身后传来一声很轻的叹，接着是灯灭。你回到{地点}已是下半夜，倒头便睡。第二日听说昨夜雾里有三个人没走出竹海，其中一个就地坐在碑边，天亮时人已经僵了，脸上还带着笑。你摸了摸口袋里的铜钱，把它扔进了井里。","果":{"道心":-2,"因果":2,"寿元":1,"气血":-8}},{"名":"记下碑文","文":"你把碑上的两行字记在心里，又数了数碑的尺寸、朝向、石质。回去后你把“万历七年，路断”六个字写在一张符纸上，压在枕下。当夜你梦见一条极窄的路，路上站满了提灯的人，都在等一个能念出碑文的人。你念了，他们便一个一个散了。","果":{"悟性":3,"因果":2,"修为":50,"道心":1}}]},{"id":"qinglan_025","题":"茶帮斗茶","类":"市井","重":2,"域":["qinglan"],"境界":[0,2],"段":["霜降那日，{地点}的晒谷场上摆开二十张矮桌，{宗门}的执事坐在上首，三位老茶农分坐两侧。斗茶只看三碗：汤色、香气、回甘。各家捧出的都是今年压箱底的货，桌上一片青气。你替一个{人物}看摊，摊上只有一小罐自家的{灵材}，罐子还是补过的。","{天象}，轮到你们时，前面已经斗过十四家，茶魁十有八九落在东边那几户手里。把头犹豫了半天，最后把罐子推给你：“我嗓子哑了，你替我端。”你端着茶碗走上场，执事的眼皮都没抬。三位老茶农各尝一口，第一位皱起眉，第二位放下碗不说话，第三位忽然问：“这茶是阳坡的还是阴坡的？”","你答不上来。把头在你身后低声说：“阴坡。”你正要开口，那位老茶农却摇了摇头：“阴坡的茶叶厚，回甘短。这碗茶回甘长得很，倒像是背阴处被人砍过的老树，第二年新发的枝。”场上一静。{天象}，风把桌上的茶末吹起来一层。把头的手在袖里攥成了拳。"],"择":[{"名":"如实说树","文":"你说这茶出在竹海北边一棵被雷劈过的老树，去年枯了一半，今年新发的芽只够炒这一小罐。三位老茶农对视一眼，最年长的那位把茶魁木牌推过来，说了一句：“树比人诚实。”把头当场跪下去磕头，你在旁边站着，忽然觉得手里那只补过的罐子很沉。","果":{"灵石":80,"声望":10,"因果":1,"悟性":2}},{"名":"承认是阴坡","文":"你按把头的话说了阴坡。老茶农们点点头，没再多问，把茶魁给了东边那户。散场后把头蹲在桌边抽旱烟，抽完把烟锅一磕，说：“我撒了半辈子谎，头一回撒得这么难受。”他把那罐剩下的茶全倒进了晒谷场的土里，说这茶不能再卖了。","果":{"灵石":-20,"道心":2,"声望":-2,"悟性":1}},{"名":"请他去看树","文":"你说茶好不好，嘴上说不清，请三位移步去看那棵树。这话说得无礼，场上有人笑出声。可最年长的那位老茶农竟真的站了起来。一行人走到竹海北边，看见那棵劈剩半边的老树，新枝上还挂着几片没摘净的嫩芽。老人摸了一把树皮，回头对执事说：这茶魁，该给它。","果":{"声望":12,"修为":40,"灵石":60,"因果":1}},{"名":"换别家的茶","文":"你趁人不注意，把罐里的茶换成了邻摊一家的陈茶——那家昨日说过，输赢都认，只求别垫底。结果茶魁落在那家，把头回去的路上一直不说话。到了岔口，他忽然停下，说：“明日你另找东家吧。”你走的时候，他没有回头，也没有骂你。","果":{"灵石":-10,"因果":3,"道心":-3,"声望":-4}}]},{"id":"qinglan_026","题":"落霞烧天","类":"天象","重":2,"域":["qinglan"],"境界":[1,4],"段":["申时三刻，{天象}。青岚域西边的半边天红得像被泼了一盆血，连竹叶尖上都映着红。{地点}的人都跑出来看，有人跪下去磕头，有人说是西边落霞山脉的火烧过来了。你站在人群里，看见红光的正中有一道极细的白线，从天上垂下来，垂到看不见的地方。","老驿丞说这是“落霞烧天”，三十年一回，头一回见的人多半要坏事。他话音刚落，地上的影子忽然全变了个方向——本该朝东的影子，齐齐转向了西。你背后一阵发凉。人群里有个{人物}已经开始发抖，说这是“日头倒着走”，兆头极凶。","红光最盛的时候，你听见远处传来一声极长的鸣，像是铁器相击，又像是有人在很远的地方唱一句拖长的调子。那声音一响，你体内的气机不由自主地跟着走了一圈，走成了平时不敢走的路子。{天象}之下，众人都在仰头，没人注意到你的手在抖。"],"择":[{"名":"顺气走一周","文":"你闭上眼，顺着那一声鸣把气机走了一圈。走完时天已全黑，红光退了，你浑身汗透，说不出哪里不同，只知道经脉宽了一线。此后每逢申时，你总有些坐不住，非要把那一圈再走一遍。老驿丞后来告诉你，那一声鸣，是西边山里的剑在应天。","果":{"修为":120,"悟性":3,"气血":-12,"道心":1}},{"名":"护住旁人","文":"你把身边发抖的那个{人物}按到地上，让他贴着头，自己挡在外侧。红光最盛时，晒谷场上有三个人晕了过去，都是仰头看天的。你把人一个个拖进屋。事后有人问你怕不怕，你说怕。那人便不再问，只把自家的一坛酒送了你。","果":{"声望":8,"道心":2,"气血":-8,"修为":30}},{"名":"追那白线","文":"你朝白线垂落的方向走了半夜。走到竹海西缘时，红光已散，白线也不见了，地上留着一道浅浅的焦痕，焦痕的尽头是一把插在土里的剑，剑身全白。你伸手去拔，剑纹丝不动。第二天你再去，剑和焦痕都没了，只剩一圈新长的草。","果":{"修为":60,"悟性":2,"因果":1,"灵石":20}},{"名":"躲进屋里","文":"你退回屋里，把门窗都关上，从缝隙里看那片红。红退得很快，前后不到一炷香的光景，天就黑了。夜里你做了个梦，梦见自己站在一片赤色的山里，山上有个人在磨剑，磨得很慢。第二天你照常上路，什么也没发生，只是从那以后，你的剑招里多了一点说不清的狠。","果":{"修为":40,"悟性":2,"道心":1,"寿元":-1}}]},{"id":"qinglan_027","题":"江心老鳖","类":"奇闻","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的江心有一块礁石，形如龟背，老辈人叫它老鳖。传说这石头会动，一年挪三尺，挪到江心正中的那年，回水便要发大水。今年春上，撑船的{人物}指着那块石头给你看，说已经挪到正中了。他说话时手在抖，船篙点了三下才点稳。","第二天你亲眼见了怪事：江面上浮起一个黑黢黢的东西，比渡船还大，背甲上一圈一圈的年轮似的纹，纹里长着青苔。它浮了半炷香，忽然朝{地点}那边转了个身，整个江面都跟着晃。对岸有人喊了一声，声音都变了调。{天象}，江上起了一层白雾。","船夫把船靠岸。{天象}，他压着嗓子说：这不是鳖，这是江底压着的东西，老鳖石是它的背。他祖上传下来一句话——石头挪到正中那年，若有人肯跪在渡口说一句“渡我”，水就退；若没人跪，水就涨。他看了你一眼：“我跪了三十年，从没灵过。你跪不跪？”"],"择":[{"名":"跪在渡口","文":"你在渡口的石阶上跪下，说了一句：渡我。江面上的黑东西停住了，慢慢沉了下去，白雾一层层散开。船夫站在你身后，一句话也没说。当天夜里回水退了三尺，老鳖石又挪回了原位。此后渡口的人见了你都让路，说这后生跪过。","果":{"声望":12,"因果":2,"道心":3,"寿元":2}},{"名":"问他为何不灵","文":"你问他跪了三十年，为什么不说出实情。他苦笑，说这话传了七代，谁都知道该跪，可谁都不肯先跪——先跪的人第二天就成了笑话。你说笑话比水灾可怕？他没答，把船篙一撑，把船撑回了江心。那天夜里水涨了半尺，没成灾，却淹了渡口三家货栈。","果":{"悟性":3,"因果":2,"道心":1,"灵石":-20}},{"名":"下水探它","文":"你脱了衣下水，朝那团黑影游去。水极冷，游到一半时，你看见那东西的背甲上坐着一个人，背对着你，白发披散。你还没看清，一股水浪把你掀回岸边。船夫在岸上早就跪下了。你在滩上趴了很久，吐出的水里有一层细细的青苔。","果":{"气血":-25,"修为":80,"因果":2,"悟性":2}},{"名":"撑船离开","文":"你什么也没跪，撑了船就走。船到江心时，水底传来一下极闷的响，船身晃了晃。船夫死死抓着船舷，嘴里念着什么。你们到对岸时，他的脸已经白了。三日后你听说回水涨了丈许，淹了下游两个村子，死了十几口人。你把手里的船钱又数了一遍。","果":{"灵石":-10,"因果":3,"道心":-3,"寿元":-2}}]},{"id":"qinglan_028","题":"叛宗弃徒","类":"人情","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的破庙里躲着一个人，脸被火燎过，左边的耳朵烧没了，正就着一堆小火烤一只山薯。他见你进来，手立刻按在腰间的{器物}上，看清你身上没有青云暗纹，才松了一点。他说自己在躲人，躲{宗门}的巡山剑侍。","在{地点}的破庙里，你不用问也知道他是什么人——袍子底下露出半截内门的青边，腰带上的铜扣缺了一半。他撕开山薯分你一半，说：“我不是叛宗。我是不肯替人背罪名。”去年丹房少了一炉上品丹，管事的说是他偷的，戒律堂给他三日自陈，他跑了。跑到今天，已经四个月。","{天象}，破庙外的小路上忽然传来脚步声，不快，像是随便走走。他一下把火踩灭，手按在刀上，声音压得极低：“三个，是剑侍。”他抬眼盯着你，“后生，你从这里出去，往西走，说没看见人，他们不会为难你。你要是不走——”他没把话说完，门外的人已经在推门了。"],"择":[{"名":"替他遮掩","文":"你推门出去，对那三个剑侍说这庙里只有一堆冷灰，前头往北去了个带伤的。三人看了看你腰间的木牌，走了。他等你回来，什么也没说，只是把那只切开的山薯全推给你。天亮前他走了，在庙墙上留下一行炭字：他日若有人还你一份公道，就是我还的。","果":{"因果":3,"道心":3,"声望":-3,"修为":40}},{"名":"与他一并动手","文":"你没走，反而站到他身侧。门开的一瞬，他扑上去，你抄起扁担砸向第二个。三个剑侍来得急，退得更快。收拾完时他身上多了一道口子，你也崩断了中指。他把缺了一半的铜扣塞给你：“这扣子能开{地点}的后门，你要进城，用得上。”","果":{"气血":-30,"修为":90,"器物":1,"因果":2}},{"名":"出去告发","文":"你走出庙门，往东边小路走，走了半里，撞见了三个剑侍。你说了庙里有人。等他们回来时，庙已空了，只剩一堆灰与半只山薯。你得了十块灵石与一句“识相”。回程路上，你几次想把那十块灵石扔掉，最后没有，因为下一个驿站还要花钱。","果":{"灵石":10,"声望":4,"道心":-4,"因果":2}},{"名":"劝他去申辩","文":"你劝他别再跑了，说躲得过今日躲不过一生。他听着，忽然笑起来，笑得呛了气。他说他跑之前就去过戒律堂，站在门口三个时辰，没人开门。他说完把山薯皮扔进火里，说后生你是好人，可你不懂青云宗的规矩——那规矩从来不写在心里，写在门楣上。","果":{"悟性":3,"道心":2,"寿元":-1,"修为":20}}]},{"id":"qinglan_029","题":"尸铃催行","类":"争斗","重":2,"域":["qinglan"],"境界":[2,6],"段":["{地点}的夜里有铃声，一响一停，停三息再响，响得不急。你在竹海里遇上三个散修，都是筑基以上的好手，此刻却靠在一处岩下，脸上全是冷汗。其中一个认出那铃声，说这是{功法}里的催行咒，铃一停，尸傀就要扑。他手里的刀在抖。","{天象}，铃声忽然断了。黑暗里涌出一股甜腥气，紧接着是铁链拖在石上的声音。那东西一步一步走近，走到月光里，你才看清它身上穿的是青云宗外门弟子的旧袍，领口还留着半截符线。三个散修里有个年轻的低叫了一声——那袍子的袖口上绣着三片竹叶，是他同乡的记号。","操控的人在更远的雾里，你看不见，但能听见他呼吸的节拍。他也听见你了。铃声第三次响起，尸傀忽然转向，直冲你来。你手里的{器物}握得很紧。那一刻你忽然明白：铃响三下，尸傀行；铃响七下，尸傀扑。现在才第三下，它走的还是行，不是扑。"],"择":[{"名":"趁行便发难","文":"你不等铃响七下，先一步扑上去，以{器物}硬砸它的肩。骨节碎了，它却不停，反手抓住你的胳膊。你咬牙把它的手卸下来，扔进竹丛。铃声急了两下，随即停了——操控的人走了。三个散修里那个年轻的跪下去，把旧袍小心地收了。","果":{"气血":-30,"修为":150,"声望":6,"因果":1}},{"名":"循声找控者","文":"你不管尸傀，循着铃声钻进雾里。控铃的是个瘦小的尸倌，正背靠一根竹子，铃在手里发颤。你一掌拍在他后颈，铃落地滚进水沟。尸傀在同一瞬僵住了，像被抽去了骨头。三个散修围上来，那尸倌慌忙求饶，说他也是被逼的。你看着他的脸，忽然不想杀他。","果":{"修为":120,"因果":2,"魔念":1,"灵石":40}},{"名":"带人先撤","文":"你拉了三个散修往竹林深处退，退到一处石缝才停。铃声在身后跟了半里，终于换了方向。天亮时那年轻散修发抖着说，那尸傀是他同乡，三年前考进外门，今年春天说是病亡。你没有接话，只觉得这林子比昨夜又冷了几分。","果":{"声望":8,"道心":2,"气血":-15,"修为":60}},{"名":"摇自己的铃","文":"你摸出那枚{器物}，照着它的节拍反摇。两铃声撞在一起，尸傀原地转了半圈，忽然跪下。雾里的尸倌惊叫一声，铃声乱了。你趁这三息的空隙连摇九下，尸傀彻底不动。等你走近看时，它已经化成了一摊黑水，水里泡着一枚青云宗的铜扣。","果":{"魔念":3,"修为":180,"因果":3,"道心":-2}}]},{"id":"qinglan_030","题":"无面采茶女","类":"奇闻","重":2,"域":["qinglan"],"境界":[0,4],"段":["清明前七日，{地点}的茶园要赶头采。天不亮就上工，一苗一芽，掐断时听得见响。你替一个{人物}做短工，蹲在坡上采了两个时辰，忽然发现右手边的第三垄有个女子也在采，一张脸素白，眉眼全无，只有皮肤。她不抬头，手指动得比谁都快。","{天象}，坡上的采茶人都低着头，没人往那边看。你忍不住咳嗽一声，那女子停下了，转过脸来。那张脸上不是没有五官，是五官长得极浅，像被人用手抹平了一半。她把手里的茶芽全放进你的筐里，用没有嘴的地方发出声音，很轻：“替我采完这一垄。”","{天象}，你不敢不采。采到垄头时，筐里已经满了一半，那女子的身影在雾里淡下去。收工的钟敲了，茶帮把头来点筐，看见你这一筐茶，忽然怔住：“这是老树头采。”他抬头看你，脸色很复杂，“第三垄的老树三年前砍了，怎么会有茶？”"],"择":[{"名":"交出那筐茶","文":"你什么也没说，把筐推过去。把头捏了一撮在手里，闻了很久，忽然让人拿秤来，按一等价收了你这一筐，钱是当场给的。你走的时候，回头看了一眼第三垄，坡上只剩几个浅浅的坑。把头再没提起这件事，也没再雇过你。","果":{"灵石":70,"因果":2,"道心":1,"悟性":1}},{"名":"说清来由","文":"你把那女子的事一五一十说了。把头听完，半晌没作声，最后蹲下去抓了一把土，说：“三年前那垄树砍的时候，死了个采茶的丫头，掉进坡下的沟里，第二天才找着。”他让人把土填回去，又给那垄地立了块木牌。那年的头采，他这个把头一粒也没敢收。","果":{"因果":3,"道心":3,"声望":5,"灵石":-10}},{"名":"自己去卖","文":"你抱着这筐茶没走茶帮的路，自己挑到{地点}，卖给了一家收私茶的铺子。掌柜的开价一百五十块灵石，眼睛都不眨。你拿了钱往回走，走出二里，觉得筐里有什么东西在动。回头看，筐底躺着三片没摘的嫩芽，摆成一个“谢”字。","果":{"灵石":150,"因果":2,"魔念":1,"道心":-1}},{"名":"回垄跪一跪","文":"你没等把头再问，转回第三垄，跪在坡上把采下的老树茶芽原样放回土里。跪了半炷香，雾里传来那女子很轻的一声应答，像是点了头。你起身时，坡上从那几个浅坑里长出三棵新芽，青得发亮。此后你每逢清明都会回这片坡，采三芽，放三芽。","果":{"道心":4,"悟性":3,"寿元":2,"修为":30}}]},{"id":"qinglan_031","题":"竹心夜露","类":"修行","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}有一样东西，叫竹心露：三年以上的老竹，逢着{天象}，竹节里会渗出清液，一夜只一滴，接的时候要站在下风处，用瓷瓶接着，瓶口贴紧竹节，接着了要立刻封。见日则散，沾手则废。一个{人物}教你怎么接，他自己接了三十年，攒了半瓶真正的竹心露。","你在{地点}接了七夜，七夜各得一滴。第八夜起风，竹节里的液不往下走，反倒往上蒸。老人说这是竹在“换气”，三十天里总有这么一夜。你守着竹等到天快亮，忽然看见竹海更深处有光，不是雾里的白光，是那种青莹莹的、像有人提着灯站在竹下的光。","那个{人物}按住你的肩，说别过去。他说那片林子里有一棵千年老竹，竹心露一夜能出三滴，可那棵竹旁边常有人守着——守着的人不是人。他松开手，从怀里摸出一只空瓷瓶，塞给你：“我这辈子就攒了半瓶，你要是想再去接，就别接那三滴。接一滴顶三十滴，可你要是贪那多出来的两滴，就得留在林子里替它守着。”"],"择":[{"名":"去接那一滴","文":"你摸黑进了那片林子，果然看见那棵老竹，粗如车轮，节上凝着一层霜。青光是从竹下一块石头上透出来的。你只接了一滴，封紧，转身就走。走出十几步，听见身后有人在数数，数到七就停了。你把瓷瓶贴身藏着，后来用这一滴换了一部{功法}。","果":{"修为":130,"灵材":1,"因果":2,"气血":-10}},{"名":"只接七夜","文":"你没去那片林子。七夜之后你把手上的七滴露兑了水，一日一滴，坐满七七四十九天。第四十九天时眉心有一线凉意闪了一下，你没抓住，它就散了。老人说这是根基不足，怨不得露。你把空瓷瓶洗净还他，他说留着吧，接露的人，一辈子只用一个瓶子。","果":{"修为":70,"悟性":3,"道心":2,"灵石":-20}},{"名":"贪那三滴","文":"你等了三夜，终于等到了三滴同出的那一夜。你把三滴都接了。第三滴滴进瓶口时，竹身忽然发出一声闷响，四周的竹一齐倒下来，围成一个圈。你在圈里蹲了一夜，天亮时走出林子，人已经三十七岁的样子。老人见了你，只叹了口气，说十年的修为换两滴露，值不值，你自己知道。","果":{"修为":260,"寿元":-10,"魔念":2,"悟性":2}},{"名":"不接去问树","文":"你什么也没接，走到那棵千年老竹前，鞠了一躬，问它这片林子到底在守什么。风过竹梢，哗哗地响成一片，你听不懂。可回程路上，你忽然发现自己的呼吸自然就合上了竹涛的节拍，一呼一吸，长短相谐。老人听你说完，沉默很久，说这叫“得气不得露”，比露难得。","果":{"悟性":5,"修为":100,"道心":3,"寿元":2}}]},{"id":"qinglan_032","题":"山阴石乳","类":"机缘","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的乱石坡背阴处有一道石缝，缝里滴水，滴了一千年，缝下的石台上结了一层乳白的东西，就是山阴石乳。采石乳的人要在缝下铺一层荷叶，等它慢慢滴落，集满一层刮下来，一层要等三个月。你是在躲{天象}的时候，无意中撞进这道石缝的。","{天象}，缝里比外头冷得多。你抱着膝盖坐了半个时辰，忽然发现石台上的荷叶是新的，边角还压着一枚铜钱。有人比你先来，而且来得不久。你往缝深处看，看见里面还有一道更窄的缝，缝里透出一点微光，像是有东西在里头。","铜钱底下压着一张字条，旁边还搁着一枚{器物}。字很潦草：“此乳按月取其半，留半与山。”落款处画了一个符。你正看着，外头的雨声里忽然夹进了脚步声。不是一个人，是三四个，脚步很重。你没处可躲，只能往那道窄缝里退。窄缝里很挤，退到一半时，你的手指碰到了凉的东西。"],"择":[{"名":"取半留半","文":"你把石乳刮了一半，装进随身的{器物}，留下一半。出来时撞见那几个采石乳的人，为首的是个{人物}，看见你手里的东西，脸色缓了缓，说：“懂规矩的就一起采。”你们轮流守了三个月，各分一份。那三个月的日子很苦，你却在缝里把一部{功法}读通了。","果":{"灵材":2,"灵石":60,"修为":60,"因果":1}},{"名":"全刮带走","文":"你把石台刮得干干净净，连缝里的陈年积乳都抠了下来，装了满满一袋。走出石缝时那几个人刚好到，看见石台，其中一个骂了一句。你没停步，一路走到{地点}把石乳卖了二百块灵石。此后那道石缝再没结过乳，第二年路过时，缝口塌了一半。","果":{"灵石":200,"因果":3,"道心":-2,"魔念":1}},{"名":"退进窄缝","文":"你侧身挤进那道窄缝，一直退到深处。手指碰到的东西是一口小陶罐，罐里装着三枚旧钱与一小卷纸。纸上是那个画符的人留下的字，说石乳之下有一脉阴泉，久饮能洗髓，也会把人洗空。你在缝里蹲了一整夜，等外面的人走了才出来。陶罐你没拿。","果":{"悟性":4,"修为":50,"因果":1,"道心":2}},{"名":"问那人来历","文":"你出来，把铜钱与字条放在石台上，问那几个人认不认得画符的人。为首的老修士看了很久，说画这符的是三十年前一个散修，在这缝里住了十年，最后一天早上人就不见了，荷叶上的石乳一滴没动。老修士说完，往缝深处拜了一拜，那几个人跟着拜了。","果":{"悟性":3,"因果":2,"声望":5,"灵石":-20}}]},{"id":"qinglan_033","题":"谍子换名","类":"宗门","重":2,"域":["qinglan"],"境界":[2,5],"段":["{地点}的布阵台后头有一间不挂牌的小屋，屋里只摆一张案、一盏灯、一本册。册上记着这些年进出青岚域的所有人名——用的是秘写，三行一换法。牙人把册子推给你，说：“从今日起，你叫周隐，落雁谷信房的三等牙人，住峡东第七户，认得两个尸倌，一个茶商。”","你翻着册子，发现自己原先的名字也在上头，后头注着四个字：可用，未验。你抬起头，牙人已经把你的旧物收进一只木匣，推回来：“这些留着，但不能带在身上。”{天象}，屋外有人在低声说话。牙人忽然压低声音：“三日之内，你要去{地点}，见一个人，他姓什么你不必问，你只需记住他的鞋。”","你问为什么记鞋。牙人拿起案上的{器物}笑了：“因为脸可以换，鞋不能。他若穿新鞋来，说明他背后的人换了；他若穿旧鞋来，说明还是原来那一伙。”说到这儿，他的笑收住了，把案上的灯拨暗，“只是这一次，我不确定他会来。他已经三个月没露面了。你要是见不着人，就把册子烧了，从后门走，别回来。”"],"择":[{"名":"接名赴约","文":"你带着新名字去了{地点}，在一间茶棚里坐了两个时辰。来的人穿了双新鞋，鞋底一点泥都没有。他坐下只说了一句话：从前的事都作废。然后就走了。你回去禀报，牙人听完，把册子合上，说这三等牙人你算是做到了。当夜你把旧物从匣里取出来，摸了一遍，又放了回去。","果":{"灵石":80,"修为":60,"因果":2,"悟性":1}},{"名":"不肯换名","文":"你把册子推回去，说我这名字用了二十年，换不得。牙人没有生气，只把册子收了，说可惜。你走出小屋时，布阵台上有人在看阵，没人理你。此后你仍旧做你的散修，只是每回路过峡东第七户，都看见门口晒着一双新鞋。","果":{"道心":3,"声望":-2,"灵石":-20,"寿元":1}},{"名":"查出旧名","文":"你没有接名，反而问了一句：册上“未验”二字，是谁写的。牙人的手停了一停，说这是信房的规矩，每个新名字底下都要有人画一笔。你要他翻到写这两个字的那一页，他翻了三遍，最后指着自己的名字。屋里静了很久，他把灯拨亮了一点。","果":{"悟性":4,"因果":3,"声望":4,"灵石":40}},{"名":"烧了那册","文":"你趁他把灯拨暗的空当，一把抓过册子扔进灯里。纸烧得极快，火苗窜起来舔到梁上。牙人扑过去抢，抢出半本焦册。你从后门走了。三个月后你听说落雁谷信房换了个执事，峡东第七户空了出来，屋里只剩一张案、一盏灯。","果":{"因果":4,"道心":-1,"寿元":-1,"修为":30}}]},{"id":"qinglan_034","题":"半截断魂钉","类":"争斗","重":2,"域":["qinglan"],"境界":[2,6],"段":["半截{器物}钉在{地点}的一棵老树上，锈成黑红，钉尾缠着一小截发黑的布。你拔了三次没拔动。旁边一个{人物}走过来，说别拔，这钉子是{功法}里的镇魂钉，钉下去是为了压住点什么，你拔出来，被压的东西就会顺着钉子往上爬。","他话音刚落，树后传来一声闷响，像{妖异}落进深水。你绕过去看，树后是一个塌了半边的旧洞，洞口结满蛛网，网里挂着三条布条，布条上各有血点。老修士脸色变了，说这洞是二十年前埋人的地方，黑水堂在这儿埋过一个不肯供血的女修，钉是她自己钉的。","你们退开三步，那半截钉忽然自己抖了一下。树上的锈屑簌簌落下来，钉身上的黑红褪成一层灰。老修士把手按在他腰间的{器物}上，说：“她要出来了。钉子是她的，也是锁她的，你要是拔，她就出来了；你要是不拔，她还得再等二十年。”{天象}，洞口的风忽然转了个向。"],"择":[{"名":"拔钉放她","文":"你两手握住钉尾，一声闷喝，钉出了一半。树身裂开一线，洞里涌出一股极阴的冷气。老修士在身后也没拦。钉全出的时候，你听见一声很轻的叹息，随即洞口的蛛网齐齐断了。你在洞口站了一刻，什么也没看见，回家后却发现那半截钉已经在你手里，冷得像冰。","果":{"器物":1,"因果":3,"魔念":2,"修为":120}},{"名":"钉牢加深","文":"你不拔，反而找了块石头，把钉头一下一下往里敲，敲到只剩半寸在外。敲到第七下时，洞里传出一声极轻的哭声。老修士别过脸去。你们封了洞口，压了三块大石。此后你每逢雨夜都觉得心口压着什么，压到第三年，那感觉才消。","果":{"道心":-2,"因果":2,"修为":40,"寿元":1}},{"名":"问那女修名","文":"你问老修士那女修叫什么。他想了很久，说不记得了，只记得她手上有七个指环，是黑水堂给血奴的记数，一圈代表一年。你能想象她在这洞里等了多少年。你把手按在钉子上，说了一句：“我记住了。”钉身上的锈色褪去了一小片，露出一行没被磨平的小字。","果":{"悟性":4,"因果":3,"道心":3,"修为":60}},{"名":"取钉去卖","文":"你把钉拔了，顺手收进袋里，第二天就送去{地点}。买主是个眼里没光的{人物}，出价一百八十块灵石，说这种镇魂钉是炼器的好引子。你拿了钱，走出巷口时听见身后有人在砸门，回头一看，那买主的铺子已经起了火，火光里有个白影站着。","果":{"灵石":180,"因果":4,"魔念":2,"道心":-3}}]},{"id":"qinglan_035","题":"溪底寒铁","类":"机缘","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的水浅，夏天的午后能看见溪底的砂石。你脱了鞋下去摸寒铁，摸了半个时辰摸到一块，巴掌大，沉得反常，色青黑，敲之有声如磬。剑庐的{人物}说这块是好料，能打一柄短剑，工钱三十块灵石，铁你自己出。你没钱，他让你替剑庐拉三天风箱抵账。","{天象}，你在炉边拉风箱，看见地上堆着十几块寒铁，有的成色比你的好。你问他这些铁都是谁送来的，他说是溪底摸出来的，不过有一批不是——那批铁里头混了别人的东西，烧的时候火是绿的，怎么烧都不软。他指了指墙角一堆碎铁块，说那批料废了，谁摸出来的谁倒赔。","你蹲下去翻那堆碎铁，忽然在其中一块的断面上看见一线极细的纹路，纹里有字，是古字，被压得很深。你把那一块翻过来对着光，看清了一个字——“沉”。那个{人物}在后头咳嗽了一声，说：“这种东西，剑庐不认。你若要，拿三块灵石走，别在这儿开。”他说话时眼睛没看你。"],"择":[{"名":"买下残铁","文":"你摸出三块灵石，把残铁包好带走。回去之后你用了七夜把那块铁磨开，里面的古字一共十一个，讲的是一处“沉铁”的地方——在洗剑溪最深处，水急得站不住人的地方。后来你去了那一处，果然摸到一块极重的铁，重得几乎抱不动。","果":{"灵石":-20,"器物":1,"悟性":3,"修为":60}},{"名":"替他打剑","文":"你没买那块铁，说愿意替剑庐打三个月短工。老匠人愣了愣，笑出声来，说这小子算得比我还精。三个月里你拉风箱、打下手、看火候，最后他替你把那块寒铁打成一柄短剑，只收了料钱。剑给你时，他说：这剑没名字，你自己起。","果":{"器物":1,"修为":90,"灵石":-30,"悟性":2}},{"名":"偷走碎铁","文":"你趁老匠人转身添水，把那块带字的碎铁揣进袖里，出门时又顺了一块好铁。三日后剑庐丢了料的事传开，老匠人没有报官，只在门口立了块木板，写着“失铁七块，来者自知”。你搬了住处，从此路过{地点}都绕道走。","果":{"器物":2,"因果":3,"道心":-3,"声望":-4}},{"名":"问他来历","文":"你问这批绿火铁是从谁手里收的。老匠人沉默了半晌，说是个自称姓周的散修，一年送一次，从不议价。他已经三个月没来了。你把那块碎铁还给他，说了句“留着吧”。他接过去时手有点抖，最后塞给你一枚铜钱，说是那姓周的每次来都要在台面上转三圈的东西。","果":{"悟性":3,"因果":2,"灵石":20,"道心":2}}]},{"id":"qinglan_036","题":"乱葬岗残经","类":"机缘","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}的土是松的，一场大雨冲开了几个土包，露出里头裹尸的草席。你本来是去给一个{人物}送东西，路过时看见泥水里泡着一角纸，黄的，上面有墨。你拣起来，是一页经，字迹已被水浸得发糊，只能辨出半行：气行三寸，勿乱其序。","你蹲在泥里翻了半个时辰，从三具草席底下翻出十一页，被雨水粘成一叠。翻到最后一页时，你看见席子底下那只手是攥着的，指缝里卡着半枚铜钱。雨又下起来了，{天象}，岗上的水顺着土沟往下淌，把一页纸冲走，漂在水面上打了个转。","你把十一页经摊在破庙的供桌上一页页分开，用灶火烘干。经不全，开头结尾都缺，中间讲的是吐纳的路子，与{宗门}传出去的那一套不一样——它让人从脚底起气，一路走奇经，走到腰上时故意绕了半圈。你知道这半圈是错的，可它写得极笃定，一笔一画像是亲手验过的。"],"择":[{"名":"照着走一遍","文":"你按残经的法子走了一遍，气到腰间绕那半圈时，一阵剧痛从脊柱窜上来，你吐了一口血。你没有停，硬走到底。走完之后半个身子麻了一夜，第二天早上那条经脉居然通了，比平常宽出一线。你这才明白那半圈不是错的——是别人不敢走。","果":{"修为":110,"气血":-30,"悟性":2,"道心":1}},{"名":"拿去请人看","文":"你把残经抱到{地点}，请一位老修士过目。老人只看了一眼就把它扣在桌上，说这经不能留，是早年从宗门流出的。他给你三十块灵石要买。你没卖，抱着经走了。老人追出来在后面喊：“你要留着就得记住，看到最后别念出声！”你没听懂，回头时他已经关上了门。","果":{"灵石":-10,"悟性":3,"因果":2,"修为":40}},{"名":"还给死人","文":"你把十一页经原样裹好，重新塞回草席底下，又把露出来的土包一一填平，填到大雨都下透了才走。那只攥着的拳头你没有去掰。半年后你再来，那一带孩子都说夜里安生，没人再听见草席响。你的气机却没长进，只是总觉得身体里有什么在慢慢铺开。","果":{"道心":4,"因果":2,"寿元":3,"修为":40}},{"名":"卖与黑水堂","文":"你把残经晒干，带去了{地点}。收经的尸倌翻看两页就抬头看你，问你从哪儿得的。你说了。他笑了，说这是堂里三十年前丢的一部东西，赏你五十块灵石。你数钱的时候，他还在翻看，翻到最后一页忽然停住，脸色变了，此后就再没跟你说过一句话。","果":{"灵石":50,"因果":3,"魔念":2,"道心":-2}}]},{"id":"qinglan_037","题":"血河养元","类":"修行","重":2,"域":["qinglan"],"境界":[3,7],"段":["金丹之后，你才真正明白{功法}里那句“以血为薪”是什么意思。血不是别人的，是你自己的——每一次催动，丹田里那点金气就要吞掉三成精血。第一次用是在{地点}，你被两个黑水堂的尸倌围住，逼得没法，催了一遍。尸倌退了，你吐了三天的血。","第二次是在{地点}的雨夜里。你已经算过了：这三成精血换来的，是一个时辰的杀伐之力。用完之后你会虚弱三日。可三日之后，那种力量还在经脉里留着印子，你发现只要再吞哪怕一成的血，就能把它重新引出来。这个念头一起，手心就开始发热。","{天象}，你在灯下摊开那半卷残页，残页上的字被人用指甲划过，划得最深的是四个字：慎勿贪多。你把残页合上，又打开。窗外有人走过，脚步很轻。你忽然想到一个问题——写这卷东西的人，最后是死在别人手上，还是死在自己手上。"],"择":[{"名":"弃功养身","文":"你把残页烧了，把灰埋进{地点}的土里。此后三个月你没敢再动真气，靠采药换灵石，换来的钱全买了补血的药。第四个月，你在一次寻常的吐纳里忽然觉得丹田空得清爽，那不是虚弱，是干净。你知道自己少了一条路，也保住了一条命。","果":{"道心":4,"寿元":5,"修为":-80,"气血":20}},{"名":"再催一次","文":"你又催了一次，这一次是在{地点}的乱石坡上，对着一块三人高的石头。石头碎了，你的经脉里多了一道暗红的纹。那道纹不痛，反倒暖暖的，像有人在里头替你烧着一点火。只是从那以后，你每次照镜子，都觉得自己的脸色比前一日白一点。","果":{"修为":260,"气血":-40,"魔念":3,"寿元":-5}},{"名":"以药代血","文":"你想了个折中的法子：不用精血，改用{灵材}熬的膏，以自身真元作引。药力只及血力三成，却不用伤本。你在{地点}试了整整一个月，熬废了十一炉药。第十二炉成膏时，火候正好，你尝了一勺，味道像烧焦的竹子，可经脉里的红纹淡了一层。","果":{"灵石":-120,"修为":120,"灵材":2,"悟性":3}},{"名":"问写经人","文":"你带着残页去了{地点}的旧书摊，让一位老书商看笔迹。老人看了半天，说这字是女人写的，而且是左手。他翻出另一册旧账给你比，果然一致。那本账记的是黑水堂三十年里买过的活人，最后一页的末尾，写着一行小字：血河无岸。","果":{"悟性":4,"因果":3,"道心":2,"灵石":-30}}]},{"id":"qinglan_038","题":"崖壁雁阵","类":"秘境","重":2,"域":["qinglan"],"境界":[2,6],"段":["{地点}的崖壁上有一幅图，刻得极浅，远看只是一片乱纹，近看才辨出是雁阵——一百多只雁，排成人字，领头那只的位置上凿着一个孔，孔里塞着一枚{器物}。这是落雁谷的旧物，谷中弟子管它叫“雁阵图”，据说是前辈布下的一处未成之阵。","你在崖下守了三日，看出那阵不是用来困人的：每一只雁的位置都与{地点}的某处山势对应，人字的两撇分别指向洗剑溪与黑水潭。领头那只的孔，正对着两处之间的一个点。你顺着那个点望过去，看见竹海上空有一片云，三年来始终没散。","{天象}，崖上起了风，那一百多只雁的刻纹里积的尘被吹起来，露出一层淡淡的青。你忽然想到：这阵不是布给外人的，是布给青岚域自己看的——它在标记一个位置。谷中人说这幅图三十年一开，开了就得有人去，去了的人，回来过一半。你伸手够到那枚{器物}，它在孔里松了。"],"择":[{"名":"取令赴点","文":"你取了器物，按图上山，一路走到了那片不散的云底下。云下是一片极静的空地，草都是新的，中间立着一块无字碑。你在碑前站了半日，什么也没发生。回程时你才发现手里的器物少了一半，不是碎了，是一半不知何时不见了。你在谷中记了一功。","果":{"声望":8,"悟性":3,"因果":2,"修为":100}},{"名":"推演全图","文":"你没碰那枚令，只在崖下把整幅图一笔一笔抄了下来，抄了七夜。抄到最后一笔时你才发现，雁阵的尾端少了一只雁——被人凿掉了。你试着按缺一只的法子推演，推演出一个完全不同的方位。你把这个结果藏起来，没给任何人看。","果":{"悟性":5,"修为":60,"因果":1,"道心":2}},{"名":"报与落雁谷","文":"你回峡中报了这桩事。牙人听完只点头，说这图是他们故意留着让人看见的，看谁看得懂。他给了你五十块灵石，又在你的名册上添了一笔“识图”。你不解，他说：落雁谷不需要会解开阵的人，需要会看出阵在哪里的人。往后有事，自会找你。","果":{"灵石":50,"声望":6,"因果":1,"悟性":2}},{"名":"把令塞回去","文":"你把那枚{器物}重新塞回孔里，严丝合缝。你退后几步看，那一百多只雁的刻纹忽然连成了一片，像是在雾里飞。你在崖下拜了三下才走。三个月后你再来时，崖壁已经塌了一角，雁阵图只剩半个字，那枚令也不在了。","果":{"道心":3,"寿元":3,"修为":50,"因果":1}}]},{"id":"qinglan_039","题":"石桥酒肆","类":"市井","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}的石桥边有一间酒肆，只卖一种酒：竹叶青，三枚铜钱一碗。掌柜的是个独眼{人物}，酒坛埋在桥下的溪水里镇着，舀出来时凉得挂霜。这日店里坐了七八个人，一半是散修，一半是过路的行商，说着说着便吵起来，吵到最后动了刀。","动刀的是个筑基的老散修，对面是个二十来岁的年轻人，手里握着一枚{器物}，指节发白。老散修骂他抢了自己一株{灵材}，年轻人说那是我先看见的。掌柜的独眼看着，把酒碗一只只往回撤，撤到最后一碗时，被人一巴掌扫碎了。","碎瓷响过之后，店里静了。老散修拔刀，年轻人不退。{天象}，桥下的溪水在响，响得很清楚。你坐在角落，面前那碗酒还没动，酒面上浮着一层碎竹叶。掌柜的把擦碗的布往肩上一搭，忽然说了一句：“打可以，别在店里，也别在这儿死人——这桥下埋着我娘子。”"],"择":[{"名":"出门评理","文":"你把酒钱压在桌上，起身说出去打，打完后输的人赔店里碎碗。两人真就出了门，在溪滩上打了一场。老散修赢了，年轻人肩膀上挨了一刀。你替他们把碎碗钱收齐，掌柜的接了，又从坛里舀了一碗给你。这一碗他说不要钱。","果":{"声望":6,"道心":2,"灵石":20,"修为":30}},{"名":"替那灵材出价","文":"你开口说那株灵材我出三十块灵石买了。两人都转头看你。老散修盯了一会儿，收了钱走了。年轻人脸涨得通红，说这不是钱的事。你说我知道，可你现在打不过，钱比刀有用。他沉默很久，把那碗摔碎的酒钱补上，也走了。你手里那株灵材，后来救过一回命。","果":{"灵石":-30,"灵材":1,"因果":2,"道心":1}},{"名":"看他们打完","文":"你没动，看完这一场。老散修刀快，年轻人身法活，两人在溪滩上缠了半炷香，最后年轻人跳上桥栏，钻进了{地点}的竹林。老散修站在桥心喘气，忽然回头看了你一眼，说：你坐那儿看了半天，是等我们两败俱伤？你没答，把酒喝完了。","果":{"修为":40,"悟性":2,"声望":-2,"道心":1}},{"名":"砸了酒坛","文":"你抄起桥栏边一支竹竿，把桥下的酒坛砸了两口。酒香一下冲出来，泼了两人一身。老散修的刀停在半空，年轻人愣住，两边都觉得这事荒唐，竟就散了。掌柜的独眼看着满地碎坛，忽然笑起来，说这两口酒是我娘子当年埋的，早该砸了。","果":{"灵石":-40,"声望":8,"因果":2,"道心":2}}]},{"id":"qinglan_040","题":"雷打竹林","类":"天象","重":2,"域":["qinglan"],"境界":[1,4],"段":["{天象}，竹海里的雷不是从天上劈下来的，是从竹梢往下走。你亲眼看见一记白光落在东边的竹顶上，白光顺着竹节一节一节传下去，传到根，整棵竹子炸开，竹屑飞了半里。同行的{人物}一把拉住你，说别跑，跑动的人身上带风，雷会追风。","你们趴在一个{地点}的低洼处，看着雷一记接一记地落在林子里。有趣的是每落一记，竹林就安静一息。老散修说这叫“雷回气”，雷把竹里的浊气打散了，一炷香之后，这一片的气机要比别处清三分。他说完自己也笑了，说这是卖命换来的话，你可别当真好用。","雷势最盛时，你看见东边那棵最老的竹子被劈中，断成两截，断面上有极细的白纹，纹路像一张符。{天象}之下，整片林子被照亮，你看清了那张符的走势。它不长，一共七笔，第三笔收得极狠。你把它记住了，也在心里明白：这张符，是要人用命去画的。"],"择":[{"名":"爬出去画符","文":"雷一停你就爬出去，用竹枝在泥地上把七笔画了三遍，画到第四遍时手抖得画不成。你抬头看那断面，白纹已经开始发暗。你把它记住，回去后在符纸上试画，前六笔都成，第七笔一落，符纸就烧穿。此后你再没画成过，却一直在画。","果":{"悟性":4,"修为":60,"气血":-15,"灵石":-10}},{"名":"揽气清修","文":"你不去管那张符，只趴在低洼里，等雷势过去。一炷香后，林子里果然清得异常，你顺着那股清气把吐纳走了七周天，走得极顺，顺到你自己都吃了一惊。老散修在旁看着，说你倒是会捡便宜。三年后他死在外域，你还记得他这句话。","果":{"修为":100,"悟性":2,"道心":1,"气血":10}},{"名":"救被雷困的人","文":"雷势里忽然有人喊救命。你循声过去，见一个年轻人抱着竹根缩在那儿，腿被压住了。你拖了他两丈，第三丈时雷落在一旁，竹屑扎了你满背。人救出来了，你背上一共拔了四十七根竹刺。他后来逢人便说这条命是你捡的，说得你不好意思。","果":{"气血":-25,"声望":10,"因果":2,"修为":40}},{"名":"截那断竹","文":"雷一停，你就去抢那棵被劈断的老竹，抢在两截焦竹之间把断口锯下来。断面上那张白符还在，摸上去是温的。老散修说这东西不能带，带在身上雷会寻第二次。你不听。此后半年，每逢下雨天，你身上的旧伤都隐隐发麻。","果":{"器物":1,"魔念":1,"悟性":3,"气血":-20}}]},{"id":"qinglan_041","题":"山门雪夜","类":"人情","重":2,"域":["qinglan"],"境界":[0,3],"段":["青岚域的雪一年只落一两场，落在{地点}的夜里，薄薄一层，天亮就化。那一夜的雪落得极静，你在山门外的石阶下看见一个人坐着，穿的是外门弟子的单衣，怀里抱着一个{器物}，一动不动。走近了才看清，他的嘴唇已经冻成紫色。","他抬头看你，说了一句：“我在这儿坐了三夜了。”他考了两次山门都落榜，今年是第三次，前天放榜，还是没中。他身上没灵石，也没脸回去。他说他想等雪停了，走到{地点}去，那边有个剑庐收学徒，做学徒总比回去种田强。可雪没停，他也没走成。","你蹲下来，跟他面对面。他手里的器物是一只旧瓷碗，碗底有几个缺口。{天象}，石阶上的雪被风卷起来一层。他忽然说：“你别管我。”声音很轻，不像拒人，倒像是怕人可怜他。山门那边，牌坊上的灯笼晃了一下，随即灭了。"],"择":[{"名":"把斗笠给他","文":"你把斗笠和半袋灵石放在他脚边，什么都没说就走了。第二日你路过山门时，石阶下已经没人，雪地上留了两行脚印，一行往西。三年后你在{地点}遇见一个剑庐的匠人，那人自称姓林，说当年在山门下有人给了他半袋灵石，他一直想问一句那人叫什么。","果":{"道心":4,"声望":5,"灵石":-30,"因果":2}},{"名":"陪他坐到天亮","文":"你没给东西，就在他旁边坐下，两人一起看雪。天快亮时他忽然笑了，说这是他这辈子第一次有人陪他坐着。雪停了，他站起来拍拍衣裳，说去{地点}，试试也好。你们在岔口分手，谁也没留名字。这一夜你没长半点修为，可后来每逢寒冬，总想起那点雪声。","果":{"道心":3,"寿元":2,"悟性":2,"气血":-8}},{"名":"带他回山门","文":"你把他扶起来，带到山门下的守夜人那里，说这人在雪里坐了三夜，你们总得给碗热汤。守夜人骂了两句，到底还是给了他半碗姜汤。他被扶进去时一直回头看你。半个月后你听说山门多了一个扫地的杂役，姓什么不知道，人们叫他“雪里坐”。","果":{"声望":6,"因果":1,"道心":2,"灵石":-20}},{"名":"给钱不留名","文":"你把身上三十块灵石全塞进他怀里，转身就走。走出十几步，他把灵石扔了回来，一块砸在你背上。你回头，看见他站着，眼睛通红，说：“我不能要，要了我就得记着。”你把灵石捡起来，重新放回他脚边，也走了。天亮时灵石还在，人已经不在了。","果":{"道心":2,"因果":2,"灵石":-30,"悟性":1}}]},{"id":"qinglan_042","题":"十二峰夜钟","类":"奇闻","重":1,"域":["qinglan"],"境界":[3,7],"段":["{天象}，你正在{地点}候船，忽然听见山那头传来一声钟。极沉，极缓，一声之后便没了。整条街的人一起停下手里的活，有人把碗放下了，有人当场跪了。跑船的老汉说这不是山门的钟，山门的钟是铜的，这声是铁的，四十年来只响过三次。","{天象}，你数了数：这一声之后第七日，青云宗的洗剑峰封了山。第十三日起，每日有剑侍下山，三三两两往竹海里去，去了不回。到了第三十日，宗门对外只说了一句话——峰上弟子“闭关”。你托人打听，回来的人脸色发白，说洗剑峰下埋尸的土是新翻的。","第四十一日夜里，{天象}，你在{地点}看见从山上下来的一个老执事。他一个人走，袍角全湿，走得很慢，走几步停一下。你上前问他峰上到底怎么了。他抬眼看你，眼神空得像一口枯井，说：“钟是给山上听的，不是给山下听的。你要真想知道，就往土里挖。”"],"择":[{"名":"夜里上山","文":"你趁夜上了洗剑峰。峰顶的洗剑池里没有水，池底摆着三十七柄断剑，剑柄朝外成圈。池边立着块新碑，碑上无名，只刻着一行数字。你数了数那圈断剑，正是碑上那个数目。下山时天快亮了，你一路没有说话，从此再不问钟的事。","果":{"魔念":2,"修为":150,"悟性":3,"因果":3}},{"名":"去竹海寻尸","文":"你按老执事的话去了竹海，在翻过的土里挖出三具尸，都穿着外门服色，身上没有伤，脸色如常。你把土重新填好，在竹根下压了三枚铜钱。回程路上你在{地点}遇见那个老执事，他问你挖了没有，你点头。他叹了口气，说那三个人是他带出来的。","果":{"因果":3,"道心":3,"悟性":2,"气血":-10}},{"名":"报与落雁谷","文":"你把这桩事卖给了落雁谷。牙人听完，付了一百块灵石，只问了一句：你听清那声钟是一下还是两下。你答一下。他点点头，把灵石推过来，说明年这个月你再来一趟，若还听见一下，你再来问价。你把灵石收了，也答应了。此后每年那个月，你都睡不好。","果":{"灵石":100,"因果":3,"魔念":1,"道心":-2}},{"名":"什么也不问","文":"你没上山，也没挖土，第三天就离开了青岚域。走出地界时，那声钟的余音好像还在耳朵里。三个月后你在外域的市集听人说，青云宗洗剑峰封山一年，峰主换了人。你端着酒碗听，听完什么也没说。你心里明白，有些事知道了，便再也迈不动腿。","果":{"寿元":3,"道心":2,"修为":30,"因果":1}}]},{"id":"qinglan_043","题":"剑不归鞘","类":"修行","重":2,"域":["qinglan"],"境界":[4,8],"段":["到了你这个境界，剑出鞘就不再算什么难事。难的是收。你在{地点}练了半年，只练一式：把剑收回鞘中，收得干干净净，不带一丝气机外泄。可每一次收，剑鞘都会裂一道细纹。半年下来，你换了十一只剑鞘，最贵的那只，是{灵材}炼的，也只撑了十七日。","教你的老{人物}说，这是“剑不肯回头”。剑出了鞘，尝过血，就不愿意再被关进去。他说年轻时候他也有这毛病，后来遇到一个人，那个人只做了一件事——在他收剑的时候，从背后按住他的肩。按了一百次，剑就服了。你问那个人是谁，他说是仇家。","{天象}。你又一次把剑往鞘里送，剑尖偏了半寸，鞘口崩开。你盯着那道裂口看，忽然明白了一件事：这半年来你收不进去，不是因为剑不听话，是因为你不想收。每次收剑的时候，你心里都在算——这一剑若再进半尺，对面的人还能不能活。你想的是这半尺，不是鞘。"],"择":[{"名":"立誓不杀","文":"你把剑横在膝上，立了一句誓：三个月内不伤人。头十天最难，手一抬就想改主意。到了第三十天，剑在鞘里睡着了，你能听见它在里头极轻的一声嗡。第九十日，你收剑入鞘，鞘口平得像一刀切的豆腐。你抬头看，山门的钟在远处响了一声。","果":{"道心":5,"悟性":3,"修为":80,"声望":4}},{"名":"换成重剑","文":"你放弃了那柄轻剑，去找{地点}的老匠人打了一柄重剑，重三十二斤，剑鞘以阴沉竹为骨。重剑无锋，收起来自然不带杀气。你背了它三年，剑鞘只裂过一次。后来你才想通：不是剑服了，是你背得动了。","果":{"器物":1,"修为":120,"灵石":-150,"气血":10}},{"名":"请人按肩","文":"你找了个信得过的人，请他在你收剑时从背后按住肩。试了三十七次，第三十八次时剑自己滑进了鞘。那个人被剑气震得吐了血，你才明白老剑修说的“仇家”是什么意思——能按住你收剑的人，一定得比你还狠。此后你找人按肩，再没找着第二个敢的。","果":{"修为":160,"因果":2,"气血":-15,"悟性":2}},{"名":"弃鞘不归","文":"你干脆不要鞘了。剑提在手上，走哪里都提着，睡也握着。三个月后你在{地点}与人动手，一剑下去，对面退了七步。你赢了，回去的路上却觉得自己手里提着的不是剑，是一截烧红的铁。这年冬天，你第一次梦见自己把剑丢进溪里。","果":{"修为":200,"道心":-2,"魔念":2,"寿元":-2}}]},{"id":"qinglan_044","题":"货栈夜火","类":"灾祸","重":2,"域":["qinglan"],"境界":[0,3],"段":["{地点}的货栈连成一排，堆着茶、盐、药材与不知道谁家的货。你在栈里做短工，夜里守更。三更时分，你闻到一股极淡的焦味，不是柴火那种，是灯油。你抓起灯笼往外跑，看见东头第七间栈的檐下有火光，火不大，可那间栈的墙根下摞着二十几桶灯油。","守更的{人物}跟出来，一看那地方，脸都白了。他说那间栈是落雁谷寄的货，谁也不敢动，栈门上贴着封条。你正要冲过去，他一把扯住你，低声说：“封条是新的，昨晚才贴。火是从里头烧起来的。”你这才注意到，栈门是从里面闩着的。","{天象}，火苗舔到了檐角，火星子往下掉。街上开始有人喊，远处传来马蹄声。守更的把钥匙攥在手心，抖了一下：“开门，就得说清是谁放的火；不开，烧过去就是十三条街。”远处的马蹄声近了，你听见有人在喊封栈、封栈，声音很急。"],"择":[{"名":"砸门救货","文":"你夺过铁锤，把门锁砸断，推开门冲进去。里头没有人，只有二十几桶灯油和一堆烧了一半的账册。你把油桶一一滚出门，滚到第十八桶时，房梁垮了下来，你被压住一条腿，是守更的把你拖出来的。货保住了，账册没保住。","果":{"气血":-30,"声望":10,"因果":1,"灵石":40}},{"名":"先抢账册","文":"你冲进去，直奔那堆账册。火已经把最上面几本烧透了，你抢出七本，抱在怀里往外跑。跑到门口才知道，怀里那七本里有一本记着落雁谷近三年的进出，另六本是空的。第二日牙人上门取账，给了你八十块灵石，说这七本值这个价。","果":{"灵石":80,"因果":2,"悟性":2,"气血":-15}},{"名":"封街断火","文":"你没去开那扇门，转身去喊人拆西头那两间空栈，断出一条隔火的路。街上的人跟着你拆，拆到天亮，火在第七间栈烧成了一堆黑炭，但没有过街。事后有人问为什么不救那间栈，守更的只说了一句：门是从里头闩的。","果":{"声望":12,"因果":2,"道心":2,"灵石":-20}},{"名":"趁乱取货","文":"你绕到栈后，从破窗翻进去，摸黑抱了两包货出来。第二日你打开看，一包是茶，另一包是包在油布里的{器物}。茶卖了三十块灵石，器物你看不懂，收进了箱底。三日后你听说，那间栈烧完之后，落雁谷来了两个人，在灰里翻了整整一日。","果":{"灵石":30,"器物":1,"因果":3,"道心":-2}}]},{"id":"qinglan_045","题":"潭边放尸","类":"人情","重":2,"域":["qinglan"],"境界":[1,4],"段":["你在{地点}的芦苇边看见一个少年，十五六岁，抱着一具用草席裹着的尸，走几步歇一下。尸的手从席子里滑出来，腕上系着一根红绳。少年见了你，把尸往身后藏了一下，随即又不藏了，说：“我哥。”他说话很平，平得像在说别人的事。","他说哥哥在黑水堂做尸倌，做了六年，上月死在潭边，堂里给了三十块灵石做“殓钱”，让他自己埋。他不肯埋，要送回{地点}的老家去。可他走不动了，草席里已经开始渗水。他问你，能不能帮把手。{天象}，芦苇被风吹得倒向一边。","{天象}，你蹲下去看那尸，鼻子先于眼睛知道不对——那味道不是死了半月的味道。你翻开席子一角，尸的指甲是青的，青里透黑，喉咙上有一道极细的线。这不是尸倌的死法，这是被养过、又弃了的死法。少年在你身后小声说：“我哥走之前回过一次家，说他不干了。”"],"择":[{"名":"帮他抬回去","文":"你抬了前半段，少年抬后半段。两人走了三日，路上换了两张草席。到了{地点}的坟地，你们把人埋了，少年在坟前跪了一夜。第二天他问你要不要收徒，你说你连自己都养不活。他笑了，说他哥也这么说过。他后来在茶帮做了脚夫，年年清明都来谢你一次。","果":{"道心":4,"因果":2,"声望":6,"气血":-15}},{"名":"劝他就地烧","文":"你说这尸不能带走，走了会出事。少年不听，你就把席子掀开给他看喉咙上那道线。他看了很久，忽然跪下去，抱着尸的脚哭。当夜你们在芦苇边堆了柴，火一直烧到天亮。灰收进一只陶罐，他抱着罐子走了，走得比来的时候快。","果":{"道心":3,"因果":2,"悟性":2,"灵石":-10}},{"名":"去堂里问账","文":"你让少年在芦苇里等着，自己去了潭东的土堡。守门的尸倌听你说完，只说人已经除了名。你追问怎么除的名，他不答，反倒问你是谁。你退出来时，堡门在你背后关上了。回去的路上，你看见芦苇边已经空了，草席与人都没了。","果":{"因果":3,"魔念":1,"悟性":2,"气血":-8}},{"名":"买下那具尸","文":"你问少年要多少。他说不要钱，只要送回家。你说我出五十块灵石买。他愣了很久，摇头。你又说，这尸身上有东西，你要留着查。他终于松手，把草席推给你，拿了钱就走，走出很远忽然回头喊了一句：“你要是查出来，告诉我一声。”你没找到他。","果":{"灵石":-50,"因果":3,"悟性":3,"魔念":2}}]},{"id":"qinglan_046","题":"雨雾困阵","类":"灾祸","重":2,"域":["qinglan"],"境界":[2,6],"段":["{天象}，你从{地点}往回走，走了一个时辰，发现自己在原地转圈。第三次看见同一棵歪脖竹时，你知道不对了。这竹子上有一道旧刀痕，位置、角度、深浅都与第一次一模一
