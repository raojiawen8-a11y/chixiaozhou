<script>
/* 赤霄洲 · 设置（离线模式开关 / 跟随 / 存档） */
(function (global) {
  'use strict';
  const E = global.Engine;
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

  const KEY = 'chixiaozhou.settings.v1';
  const defaults = { offline: true, follow: true, autosave: true };
  let cfg = Object.assign({}, defaults);

  function loadCfg() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) cfg = Object.assign({}, defaults, JSON.parse(raw));
    } catch (e) {}
    return cfg;
  }
  function saveCfg() {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function isLocalFile() {
    return location.protocol === 'file:';
  }
  function swSupported() {
    return 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0;
  }
  function swActive() {
    return !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  }

  async function enableOffline() {
    if (!swSupported()) return false;
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      if (reg && reg.active && !navigator.serviceWorker.controller) {
        try { reg.active.postMessage({ type: 'claim' }); } catch (e) {}
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  async function disableOffline() {
    if (!('serviceWorker' in navigator)) return false;
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
      if (global.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((k) => k.indexOf('chixiaozhou') === 0).map((k) => caches.delete(k)));
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  async function applyOffline() {
    if (cfg.offline) await enableOffline();
    else await disableOffline();
  }

  function stateChip(on, onText, offText, unsupported) {
    const s = el('span', 'set-state ' + (unsupported ? 'bad' : on ? 'on' : 'off'));
    s.textContent = unsupported ? '不可用' : on ? onText : offText;
    return s;
  }

  function row(title, desc, right) {
    const r = el('div', 'set-row');
    const t = el('div', 'tt');
    t.appendChild(el('b', null, title));
    if (desc) t.appendChild(el('span', null, desc));
    r.appendChild(t);
    if (right) r.appendChild(right);
    return r;
  }

  function toggle(checked, onchange) {
    const w = el('label', 'sw');
    const i = el('input');
    i.type = 'checkbox';
    i.checked = !!checked;
    i.onchange = () => onchange(i.checked);
    w.appendChild(i); w.appendChild(el('i'));
    return w;
  }

  function render(body) {
    body.innerHTML = '';
    const supported = swSupported();
    const active = swActive();
    const localFile = isLocalFile();

    const g1 = el('div', 'cg-group');
    g1.appendChild(el('h3', null, '运行'));

    const offlineChip = localFile
      ? (() => { const c = el('span', 'set-state on'); c.textContent = '已内置'; return c; })()
      : stateChip(cfg.offline && supported, '已开启', '已关闭', !supported);

    g1.appendChild(row(
      '离线模式',
      localFile
        ? '单文件版本身已含全部代码与数据，断网也能直接打开，无需额外缓存。'
        : supported
          ? (active ? '已缓存本页资源，断网也能继续玩。' : '已开启，但当前页面尚未被缓存接管，刷新一次即可生效。')
          : '当前浏览器不支持离线缓存，请用 Chrome / Safari 打开。',
      offlineChip
    ));

    if (!localFile) {
      const swRow = el('div', 'set-row');
      const swTxt = el('div', 'tt');
      swTxt.appendChild(el('b', null, '离线缓存开关'));
      swTxt.appendChild(el('span', null, '关闭后清除缓存并注销 Service Worker，之后只在线加载。'));
      swRow.appendChild(swTxt);
      swRow.appendChild(toggle(cfg.offline && supported, async (v) => {
        cfg.offline = v;
        saveCfg();
        await applyOffline();
        render(body);
        global.UI.toast(v ? (supported ? '离线模式已开启' : '当前环境不支持离线缓存') : '离线模式已关闭');
      }));
      g1.appendChild(swRow);
    }
    body.appendChild(g1);

    const g2 = el('div', 'cg-group');
    g2.appendChild(el('h3', null, '镜头'));
    g2.appendChild(row('跟随本尊', '镜头平滑跟随主角移动；拖动地图会自动取消。', toggle(global.Renderer.follow, (v) => {
      global.Renderer.setFollow(v);
      $('#btn-follow').classList.toggle('on', v);
      cfg.follow = v;
      saveCfg();
      global.UI.toast(v ? '镜头跟随已开启' : '镜头跟随已关闭');
    })));
    const back = el('button', 'btn sm', '镜头回到本尊');
    back.onclick = () => {
      const p = E.state && E.state.player;
      if (!p || !p.位置) return;
      const pos = global.Renderer.interpPos(p);
      global.Renderer.setFollow(true);
      $('#btn-follow').classList.add('on');
      cfg.follow = true;
      saveCfg();
      global.Renderer.focus(pos.x, pos.y, 0.95);
      global.UI.closeSheet();
    };
    g2.appendChild(row('回到本尊', '一键把镜头拉回主角所在位置。', back));
    body.appendChild(g2);

    const g3 = el('div', 'cg-group');
    g3.appendChild(el('h3', null, '存档'));
    g3.appendChild(row('自动保存', '每 20 秒与切到后台时写入本机（localStorage）。', toggle(cfg.autosave, (v) => {
      cfg.autosave = v;
      saveCfg();
      global.UI.toast(v ? '自动保存已开启' : '自动保存已关闭');
    })));
    const saveNow = el('button', 'btn sm g', '立即保存');
    saveNow.onclick = () => { global.UI.toast(E.save() ? '已保存' : '保存失败（存储空间不足？）'); };
    g3.appendChild(row('手动保存', '随时把当前世界写入本机。', saveNow));
    body.appendChild(g3);

    const tip = el('div', 'cg-note');
    tip.style.marginTop = '10px';
    tip.textContent = localFile
      ? '当前是单文件版（本地打开），所有资源都在这个 HTML 里，天然离线可玩；「离线缓存开关」只在用本地服务器 / 网站方式打开文件夹版时出现。'
      : '提示：单文件版（赤霄洲.html）本身已包含全部资源，无需联网；此处的离线缓存开关只影响文件夹版（index.html + js/css）。';
    body.appendChild(tip);
  }

  function open() {
    loadCfg();
    const body = global.UI.openSheet({ title: '设置', body: document.createElement('div') });
    render(body);
  }

  const Settings = {
    open, loadCfg, saveCfg, applyOffline, swSupported, swActive,
    get cfg() { return cfg; },
    get autosave() { return cfg.autosave; }
  };
  loadCfg();
  global.Settings = Settings;
})(window);

</script>
<script>
/* 赤霄洲 · 启动与主循环 */
(function (global) {
  'use strict';
  const E = global.Engine;
  const R = global.Renderer;
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

  let acc = 0, last = 0, uiAcc = 0, saveAcc = 0;
  let lastLog = -1, lastChron = -1;

  function loop(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0);
    last = ts;
    if (E.state && !E.state.paused) {
      const per = 1000 / Math.max(1, E.state.speed);
      acc += dt * 1000;
      let guard = 0;
      while (acc >= per && guard < 40) {
        acc -= per;
        E.tick();
        guard++;
      }
      if (E.advanceMotion) E.advanceMotion(dt);
    }
    R.draw(dt);

    uiAcc += dt;
    if (uiAcc > 0.22) {
      uiAcc = 0;
      global.UI.renderTop();
      global.UI.renderPlayerCard();
      const st = E.state;
      if (st) {
        const tab = global.UI.currentTab();
        const lc = st.log.length, cc = st.chronicle.length;
        if (tab === 'log' && lc !== lastLog) { lastLog = lc; global.UI.renderDock(); }
        else if (tab === 'chron' && cc !== lastChron) { lastChron = cc; global.UI.renderDock(); }
        else if (tab === 'world' && (lc !== lastLog || cc !== lastChron)) { lastLog = lc; lastChron = cc; global.UI.renderDock(); }
      }
    }
    saveAcc += dt;
    if (saveAcc > 20) {
      saveAcc = 0;
      if (!global.Settings || global.Settings.autosave) E.save();
    }
    requestAnimationFrame(loop);
  }

  function intro() {
    const wrap = el('div');
    wrap.innerHTML = `<div class="cg-note">天倾纪三千二百余年，赤霄洲十二域。你只需按下「入世」，此后九州自转、众生自修、宗门自争——你亦可随时提笔改天。</div>`;
    const g = el('div', 'cg-group');
    g.appendChild(el('h3', null, '立道号'));
    const nameInput = el('input');
    nameInput.type = 'text';
    nameInput.placeholder = '留空则天机代取';
    nameInput.style.cssText = 'width:100%;font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.65);outline:none';
    g.appendChild(nameInput);
    wrap.appendChild(g);

    const g2 = el('div', 'cg-group');
    g2.appendChild(el('h3', null, '择道途'));
    const pathBox = el('div');
    pathBox.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px';
    let chosen = 'jian';
    E.PATHS.forEach((p) => {
      const b = el('button', 'btn sm');
      b.style.cssText = 'text-align:left;padding:7px 9px;line-height:1.35';
      b.innerHTML = `<b style="font-family:var(--serif);color:${p.色}">${p.名}</b><br><span style="font-size:9.5px;color:var(--ink-3)">${p.别名}</span>`;
      if (p.id === chosen) {
        b.classList.add('p');
        b.style.background = 'rgba(176,69,60,.92)';
        b.querySelector('b').style.color = '#fff8ee';
        b.querySelector('span').style.color = 'rgba(255,248,238,.78)';
      }
      b.onclick = () => {
        chosen = p.id;
        [...pathBox.children].forEach((x) => { x.classList.remove('p'); x.style.background = ''; });
        b.classList.add('p');
        b.style.background = 'rgba(176,69,60,.92)';
        b.querySelector('b').style.color = '#fff8ee';
        b.querySelector('span').style.color = 'rgba(255,248,238,.78)';
      };
      pathBox.appendChild(b);
    });
    g2.appendChild(pathBox);
    wrap.appendChild(g2);

    const row = el('div', 'btnrow');
    const start = el('button', 'btn p', '入世');
    start.id = 'btn-start';
    start.style.cssText = 'flex:1;padding:10px;font-size:14px;letter-spacing:.2em';
    start.onclick = () => {
      E.newGame();
      const p = E.state.player;
      if (nameInput.value.trim()) p.道号 = nameInput.value.trim();
      p.路径 = chosen;
      p.功法 = [{ 名: '《引气诀》', 品: '黄阶', 效: 1.0 }, { 名: '《' + (E.PATH_BY_ID[chosen].阶段[0]) + '》', 品: '黄阶', 效: 1.15 }];
      global.UI.closeSheet();
      global.UI.renderAll();
      R.snapTo(p.位置.x, p.位置.y, 0.92);
      const followOn = !global.Settings || global.Settings.cfg.follow;
      R.setFollow(followOn);
      document.getElementById('btn-follow').classList.toggle('on', followOn);
      E.save();
      global.UI.toast('入世 · ' + p.道号);
    };
    row.appendChild(start);
    global.UI.openSheet({ title: '赤霄洲', body: wrap, footer: row });
  }

  function boot() {
    R.resize();
    global.UI.bind();
    global.UI.bindEvents();
    window.addEventListener('resize', () => R.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => R.resize(), 200));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && (!global.Settings || global.Settings.autosave)) E.save();
    });
    window.addEventListener('beforeunload', () => {
      if (!global.Settings || global.Settings.autosave) E.save();
    });

    if (E.load()) {
      global.UI.renderAll();
      const p = E.state.player;
      if (p && p.位置) R.snapTo(p.位置.x, p.位置.y, 0.72);
      const followOn = !global.Settings || global.Settings.cfg.follow;
      R.setFollow(followOn);
      document.getElementById('btn-follow').classList.toggle('on', followOn);
      global.UI.toast('续前缘 · ' + E.dateStr(E.state));
    } else {
      intro();
    }
    setTimeout(() => { const h = $('#hint'); if (h) h.classList.add('hide'); }, 4200);
    if (global.Settings) global.Settings.applyOffline();
    last = performance.now();
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
