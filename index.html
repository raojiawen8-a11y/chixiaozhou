把皮挂高处，好让别的兽闻着味过来。","{天象}，天色忽然暗了，日头被云吞了。四周的藤同时一动，那种细响密得像一场急雨。{人物}说坏了，得立刻找空地。他往左跑，我却看见右边有一处地势高、树稀的地方。藤已经开始从树上往下走，足尖离地只有一寸。"],"择":[{"名":"随他往左","文":"我跟着他往左冲，冲到一片洼地，藤下不来——洼地的水泡烂了藤足。我们蹲在泥里直到日头重新露脸，蹲得两条腿都麻了。他的判断救了两条命。出林时他说，这片林子里最靠不住的就是眼睛，眼睛看见空地，藤也看见空地。","果":{"气血":-10,"悟性":3,"道心":2,"寿元":1}},{"名":"径去高地","文":"我不听他的，径往高地跑。高地上树稀，藤确实少，可地面铺着一层极厚的腐叶，脚一踩就陷。藤没有缠我，腐叶底下却有别的东西在啃我的靴底。我把靴子割了才脱身，出来时满脚是血。{人物}站在林外等了我一夜，见我便说：我说的空地，是有水的空地。","果":{"气血":-30,"修为":60,"因果":1,"道心":-1}},{"名":"割藤开路","文":"我抽刀，把脚下的藤一条条割断。藤汁溅在手上，凉得刺骨，很快起了一层红斑。这法子极慢，可割开的地方藤一时接不上来，我硬是割出一条路。出林时我的手上全是红斑，{人物}说这是藤毒，要泡药汤三个月。可他也承认，这一路我从头到尾没有走错。","果":{"气血":-20,"修为":140,"悟性":3,"灵材":1,"寿元":-2}}],"id":"nanjiang_051"}]},"yunmeng":{"词汇":{"人物":["泽畔渔翁","采莲女","水月宫执灯弟子","沧浪剑派守崖人","雾中渡夫","沉船摸金客","鲛人歌者","镜心岛戒律嬷嬷","游方说书人","芦荡药农","听涛崖磨剑僮","水月宫观月使","泽中捞尸人","蚌珠贩子","云梦散修","画舫船娘","宫中被逐的弃徒","走雾灯的打更人","替人守灵的老妪","南泽马帮的脚夫"],"地点":["镜心岛","听涛崖","芦花荡","落月湾","沉舟滩","九曲水道","白鹭洲","水镜台","半月汀","古钟渊","鲛人渡","断桅礁","藕花深处","泽心莲塘","雾隐渡口","旧宫遗址","蚌母滩","望月楼","洗剑池","废堤"],"天象":["大雾封泽三月不散","月圆之夜水底传来钟声","雾中浮起第二个月亮","水镜里倒着走的人影","夜半泽心起了一层银霜","芦荡无风自鸣","月光落水如铺碎银","细雨落水无声","水面浮灯不知是谁放的","晨雾深处传来断续歌声","天边一线红光如刀","水气凝成白龙横过泽面","日轮惨白没有半分暖意","雾海退去露出古道","夜里有巨影掠过月轮","阴云压水三尺"],"妖异":["三眼水猴","蚌精","雾中白鲛","无面船娘","提灯水鬼","菖蒲化形的药人","沉船的守灵骸","泽中巨鳖","青鳞水蟒","藕花妖","芦荡里的吊死鬼","鲛人哨兵","镜中替身","借月还魂的女尸","双头白鹭","水底钟奴"],"器物":["残破的青铜灯","水月镜","沧浪断剑","菖蒲木匣","蚌珠串","沉船里的青瓷枕","藕丝软甲","崖上无名剑","素心殿的月轮盘","水纹长袍","骨笛","雾灯","定水珠","半面铜镜","刻满宫规的石碑","沉船的旧舵盘","银线渔网","画舫上褪色的灯笼"],"灵材":["九节菖蒲","泽心莲","迷雾蚌珠","水月草","月华露","芦根蜜","青鳞蜕","沉舟铁","白鹭卵","藕心髓","镜心石","水汽芝","寒潭玉","莲心苦胆","泽底墨玉","菖蒲花蜜"],"功法":["《水镜诀》","《月华引》","《沧浪十七式》","《照心篇》","《听涛剑意》","《雾隐步》","《素心咒》","《一苇渡》","《断浪式》","《月下无声剑》","《水月照影法》","《涤尘诀》","《沉舟渡》","《镜心宫规抄》"],"际遇":["于雾中拾得半面铜镜","被水月宫弟子误认作故人","在沉船里翻出一柄未腐的剑","雾散时看清了岛的形状","于月圆夜听见水底钟声","替老渔翁捞起一具不腐的女尸","在芦荡深处遇见独自吹笛的少女","于水镜中看见十年后的自己","拾得一枚带血的蚌珠","被潮水推向无人洲","在废堤下发现刻字的旧砖","于雾中遇上一艘空无一人的画舫","捡到一柄插在泥里的断剑","被鲛人的歌声引离航道","于旧宫遗址拾到半页宫规","在洗剑池边捡到磨了一半的剑胚","在泽心莲塘里捞出半截玉簪","被一声钟响惊得三日不能入定"],"祸患":["被水月宫执灯弟子扣在岛上","被沧浪剑派当成偷剑的贼","误入水镜幻境三日不得出","被同船的人推下水","遭雾中白鲛缠上","替人背了沉船里的因果","被戒律嬷嬷罚在素心殿跪了三日","因窥见宫规被逼立誓","被泽中水鬼借去了名字","遭鲛人索还借去的东西","被人诬作摸金贼","中了菖蒲花毒","被潮水困在断桅礁","因多看一眼月亮而失了三日","被守崖人一剑赶下听涛崖","在雾里丢了船与同伴"],"宗门":["水月宫","沧浪剑派","万宝阁","天涯阁","散修盟","鲛人王庭","天机楼","青云宗","金沙楼","丹霞观","落雁谷","蓬莱阁"],"地名":["云梦泽","南泽","八百里云梦","镜心岛","听涛崖","落月湾","沉舟滩","古钟渊","白鹭洲","鲛人渡","九曲水道"]},"图鉴":[{"类":"地理","名":"镜心岛","卷":2,"文":"云梦泽诸岛皆浮于雾中，独镜心岛终年不沉。岛形如半枚古镜，四围水浅而岛心极深，据说岛底连着一处不知名的地脉，故岛上之水永远清得能照见鱼鳞。水月宫立宫于此，宫墙只用白玉与青石，不施一钉一木，取的是「水中不留痕」之意。岛上不分四时，只分月圆月缺；宫人作息全依月象，月满则闭关，月晦则夜巡。外人登岛须先过水镜台，照出心中最不肯认之事，方能入宫。岛心那口井据说直通古钟渊，每逢月圆会自己涨三分，井水尝起来带一点极淡的甜。宫规刻在宫墙下的石碑上，第一条最狠：凡男子登岛者，沉泽。三百年来沉过四个人。","引":"《南泽志》：镜心不沉，以其心空；心空者，能照万物。"},{"类":"地理","名":"听涛崖","卷":2,"文":"听涛崖在云梦泽东，是唯一一处不受雾锁的高地。崖高四十丈，崖顶是一整块斜向南的平板石，崖上插着三百柄无名剑，剑柄皆朝同一方向，据说那是当年沧浪剑仙最后一次出剑的方向。崖下浪声极响，白日里能盖过人语，夜里反倒静得古怪，老弟子说那是海在换气。崖顶有一汪洗剑池，池底铺着沉舟滩运来的铁砂，水色常年灰黑，养剑不磨锋，是沧浪一脉的独门法度。剑派盛时崖上有三千弟子，如今只剩三十人，剑却一柄也不敢少。守崖人每晨绕崖一周，看哪柄剑的锈色浅了，便拔起来端详片刻，再插回去。","引":"崖上三百剑，无一是活人的；崖下一个人，倒像死了很久。"},{"类":"地理","名":"沉舟滩","卷":1,"文":"沉舟滩在云梦泽西南，是七条沉船的坟。桅杆自水面斜斜戳出，像一排折断的手指，退潮时能看见半截船身陷在泥里，泥色黑得发亮。当地人说这片滩认船不认人：船沉了便一直沉在那儿，一百年也不散架；人下去了，两个时辰不上来，就再也上不来。滩上的泥里埋着不少好东西，瓷器、铁器、封了蜡的木匣，摸金客一年来两趟，只认潮水，退潮后有两个时辰，多一刻便要等人抬着走。滩心的泥最软，据说踩着像踩在活物的舌头上。有人说夜里能听见舱底有呼吸声，一近一远，像有人在里面睡着。","引":"沉舟滩的规矩只一条：拿得走的拿，拿不动的，别回头。"},{"类":"地理","名":"古钟渊","卷":1,"文":"古钟渊是云梦泽最深的一处，水面平得像磨过的镜子，扔石下去听不见回声。渊底据说沉着一口比岛还大的钟，钟里关着一样东西，那东西每百年敲一次钟，只是想让人知道它还活着。渊壁生着成片的黑苔，苔下是青铜纹路，纹路一路延伸到视野之外，摸上去是温的。渊水极冷，寻常修士潜到十丈便要退，能到十八丈者已是金丹以上。渊里的鱼都是白的，眼睛退化了，撞到人身上也不躲。每逢月圆，渊口会浮起一层极薄的银光，渔家说那是钟在换气。有胆子大的潜下去看过，上来后只说了一句：钟壁上刻满了名字。","引":"渊底有钟，钟上有名；名在钟上者，皆已不在人间。"},{"类":"地理","名":"九曲水道","卷":1,"文":"九曲水道是云梦泽最难走的一段水路，从雾隐渡口到白鹭洲，拐九次弯，宽窄不一，最窄处只容一条小船侧身而过。船家说这条道九成会走岔，走岔了不算迷路，算被泽留下了。水道两侧的芦苇长得比人高，风一过便齐齐弯腰，声音像有人在耳边说悄悄话。第三道弯的水下有一整座村子，屋顶、街道、晾着的衣裳都清清楚楚，船过时能看见窗里坐着人。老船家过这一段从不说话，也不许乘客说话，桨要划得极轻，据说水面一响，底下的村子就会跟着动。走完九曲的人，多半记不清自己是怎么走出来的。","引":"九曲非路，是泽的耐心；能走完的，都是泽肯放的人。"},{"类":"地理","名":"白鹭洲","卷":1,"文":"白鹭洲在云梦泽北，是一块会移动的沙洲，一年挪半里，从不固定。洲上生着成片的灯芯草，草心能点，渔家夜里采来当烛，一支能燃一整夜。洲头有一株极老的柳树，树身中空，里头塞满了纸条，都是过路人写的愿。当地风俗：愿不必说出口，写下来塞进树里，若第二年树还在，愿便有一半的机会应验。洲上的白鹭不怕人，落在肩上也不飞，据说是被人养熟了的。有人算过洲的移向，说它正一点点往古钟渊靠，若真靠上去，这一带的雾怕是要散。","引":"洲会走，柳会记；人走了，愿还留在树里。"},{"类":"宗门","名":"水月宫","卷":1,"文":"水月宫为南泽第一大宗，宫中皆为女修，以月华为引、水镜为法，道统清冷，从不肯与人多话。宫中共分三殿：素心殿掌戒律，望月楼掌功法，洗剑池掌器用。宫人入门先学三件事：照镜、静坐、闭口；学不成的一律遣返，学成的进去便再难出来。宫中不许男修登岛，违者沉泽，这条规刻在石碑上三百年，沉过四个人。水月宫历来不问世事，却也从不吃亏：九州各宗要借南泽水道，都得先递帖子；递了帖子的，也未必见得着人。近百年宫势渐盛，隐有南泽第一之势。","引":"宫中无男子，宫中亦无笑声；两样都没有的地方，最难攻。"},{"类":"宗门","名":"沧浪剑派","卷":1,"文":"沧浪剑派传承自上古沧浪剑仙，一脉单传，只传一人。盛时崖上三千弟子，剑插如林；如今只剩三十人，其中十七个是僮仆，十个连剑都提不稳。剑派的规矩极怪：一脉单传，传的不是血脉也不是师徒名分，而是那一柄剑肯不肯认人。崖上三百柄无名剑，谁拔得起来谁便是主，拔不起来而剑身断尽的，要用血来赔。剑派不磨锋，只在洗剑池里泡，泡得住的人剑才留得住。近百年剑派日衰，宗门仍在，名册却一年比一年薄。守崖人把名册摊在石头上念名，念到最后一个，往往要停很久。","引":"剑派未亡，只是无人；无人之处，剑还站着。"},{"类":"宗门","名":"素心殿","卷":1,"文":"素心殿是水月宫掌戒律之处，殿前石阶自泽边一直铺到宫门，共三百级，每一级都刻着字，是历代宫规。新入宫的弟子头三个月每日要在阶上抄一遍，抄不完不许吃饭。殿中供着一面极旧的月轮盘，盘上刻着宫主的名讳与在位的年月，最末一格是空的，留给下一位。殿里议事从不论情理，只论宫规第几条；判了便判了，从不解释。戒律嬷嬷在殿中坐四十年，只翻过一次碑，翻的是她师父的。那夜她哭了半夜，第二日照旧坐在殿里，一字不提。","引":"素心者，先无心，后有心；殿里的人都先死了一遍。"},{"类":"宗门","名":"戒律堂","卷":1,"文":"戒律堂在水月宫素心殿西侧，是一间没有窗的石屋，屋内只有一张矮案、一方砚、一摞空白竹牌。凡犯宫规者，先入此屋自述，不必等人审问；竹牌上写清自己犯了哪一条，写完才知道该受什么罚。堂中执事从不劝人，也不逼人，只把磨好的墨推到你面前，说一句「写吧」。撑得住的人多半写得极细，撑不住的往往写两个字就停笔。宫里老人说，戒律堂最狠的不是罚，是让你自己把话写下来，写完了，那一笔便再也洗不掉。堂外种着一排竹，竹节上都被人刻过字。","引":"堂中无刑具，只有砚；墨落纸上，比血难擦。"},{"类":"宗门","名":"沧浪一脉","卷":1,"文":"沧浪一脉的传承不看根骨，只看心口那口气。剑仙当年立下规矩：一脉单传，只传一人，传的是一柄剑与一句话。那句话从不说出口，只在上一位传人临终前，贴着下一位的耳朵说三个字，说完便咽气。三百年来，这句话已经换了七个主人。剑派弟子私下猜过很多回，有人猜是「不许哭」，有人猜是「往前走」，也有人说那三个字根本没人听清过，只是师门里传下来的一句空话。无论真假，崖上三十个人都在等那句话，等到最后一个也没等到。","引":"一脉单传，传到最后，只剩一柄剑与一句无人听清的话。"},{"类":"人物","名":"观月使","卷":1,"文":"观月使是水月宫夜巡之职，一任三年，任满便换人。此人一身素白，裙角不与水沾，手持一盏不燃自明的水月灯，每夜绕镜心岛走三圈，风雨不误。灯照之处，凡有外人登岛，无所遁形；灯照不到的地方，观月使也从不越界。宫里说此职最苦，不是因为累，而是因为三年里要说的话比常人多十倍——每一圈都要向素心殿回报三个字：无异动。三年下来，多数人变得极静，回到宫里也不大开口。有人说观月使的眼睛比灯还亮，只是亮得没有温度。","引":"灯照三尺，眼照三年；照得多了，便不再照自己。"},{"类":"人物","名":"守崖人","卷":1,"文":"守崖人不称掌门，也不称师兄，崖上三十人都只叫他这一声。他每晨提一桶水绕崖一周，也不擦剑，只看哪一柄的锈色变浅了，拔起来端详片刻，再插回去。三百步一圈，一圈要走一个时辰，八十年没断过。他说话极省，问一句答半句，可只要说起每一柄剑的主人是哪一年死的、死在哪里、最后一剑砍向谁，便一句不漏。有人劝他下山，他说崖上没人守着，剑会自己走。他这一生只用过一柄剑，剑名不详，剑身极长，从不肯挂在腰上，总是横在膝前。","引":"守的不是崖，是三百个死人的名字；名字在，剑就不会散。"},{"类":"人物","名":"鲛人歌者","卷":1,"文":"鲛人歌者是泽上唯一能在人与鲛之间传话的存在。二十年前上岸，学了人话，颈侧有一道始终没褪净的鳞，说话时水面不起波纹。他能听见人心里那句没说出口的话，所以很少有人愿意同他久坐。他说自己并无恶意，只是这本事不像本事，倒像一双眼永远睁着。鲛人王庭与他有旧约：替王庭记下每一句人许下的诺，诺若不还，由他索。他索还的方式极轻，只在你耳边轻轻说一遍那句话，说完便走。凡被索过的人，此后都记不清自己许过什么。","引":"鲛人索诺，从不吵闹；只在耳边说一遍你从前说过的话。"},{"类":"人物","名":"沉船摸金客","卷":1,"文":"摸金客不是一门一派，是一种活法。云梦泽的摸金客多则三十人，少则七八人，都是一身短打、一柄短刀、一副从不上岸晒的皮囊。他们只认潮水，退潮后两个时辰下水，涨潮前一刻必上岸；谁能数得准这半个时辰，谁就能活到下一趟。摸金客之间有一条不成文的规矩：舱里的东西可以拿，舱里的人不可以惊。惊了便等于替整条船背了因果，那因果往往不是落在自己身上，而是落在岸上等着的人身上。干这行的人少有成家的。","引":"摸金客的钱来得快；来得快的钱，向来不是给自己花的。"},{"类":"人物","名":"走雾灯的打更人","卷":1,"文":"云梦泽的渡口村落夜里不敲梆子，敲的是一盏灯。走雾灯的打更人提着灯沿岸走，走一段停一停，把灯举高三寸；灯若熄了，村里那一夜便不出船。此职多由老人担，一夜要走七里，走不动了便换人。打更人不许说话，也不许回头，据说一回头就会看见不该看的东西跟在身后。这一行的规矩是师父带了徒弟三年才准独行，独行第一天，师父会在岸边看一整夜。南泽的老人说，灯是给活人看的，也是给死人看的，两边都看见了，这一夜才算过去。","引":"灯亮一夜，人活一夜；灯灭时，谁也别出船。"},{"类":"法宝","名":"水月镜","卷":1,"文":"水月镜是水月宫开宗祖师留下的第一面镜，形如满月，径尺二寸，镜背铸着一圈极细的水纹，纹路会随月象自己转。此镜不照人形，只照人心：站在镜前，镜中浮出的多半不是自己的脸，而是心里最不肯承认的那一面。宫中有三面，一面在素心殿，一面在水镜台，一面据说随第七代宫主沉进了古钟渊。镜有三忌：忌在月晦之夜照，忌连照三次以上，忌由男子照。前两忌伤身，第三忌沉泽。宫人私下说，第三忌不是护镜，是护人。","引":"镜不欺人，人自欺；镜照见的，从来不是脸。"},{"类":"法宝","名":"沧浪断剑","卷":2,"文":"沧浪断剑只剩三分之一的剑身，长约一尺七寸，剑柄上缠的麻布早烂尽了，露出黑的木。此剑插在沉舟滩的泥里至少两百年，每逢潮退便往外挪半寸，像有什么话没说完。剑身锈剥落之后是极亮的钢色，剑脊上只有一个字：归。守崖人说这是沧浪剑仙生前最后一柄剑，剑断于崖顶那一战，断的那半截至今没人找着。此剑认血不认手，血落剑脊便会自己松泥。凡带它上路的人，梦里都会听见一记极短的剑鸣，像有人在远处收剑。","引":"剑断两百年，仍旧不肯认输；泥能埋剑，埋不掉那口气。"},{"类":"法宝","名":"月轮盘","卷":1,"文":"月轮盘是素心殿正中所供的一件旧器，青玉为底，径三尺，盘面刻着一圈圈同心纹，每一格刻一位宫主的名讳与在位年月。宫主更替时，执事以银针刺入下一格，刺时盘心会渗出一层薄薄的凉雾。此盘据说是用来记时的，可宫里老人说它记的不是年月，是命：宫主若在位未满便死，那一格会自己裂开一道细纹；若寿终正寝，纹会慢慢渗进玉里，看不见。三百年来，裂开的格子有十九个。此盘不许外借，连看也不许看太久。","引":"盘上二十六格，裂了十九个；余下七个，还空着。"},{"类":"法宝","名":"定水珠","卷":2,"文":"定水珠出自沉舟滩最深处的泥里，通体青灰，不圆不亮，握在手里极沉，像攥着一小团化不开的水。此珠不防水，反而吸水：丢进水里，方圆三丈的水面会自己安静下来，浪不起、纹不生，船泊在其中如何晃都不翻。摸金客说这东西是压舱用的，一船带一颗，过九曲水道便不撞礁。可它吸的水会存着，存满了就往外渗，渗出来的水极冷，冷得像是从别处带来的。用满一年便要放在日头下晒三日，晒的时候能听见水声从珠里漏出来。","引":"珠不言，水自静；静得越久，里头存的东西越不干净。"},{"类":"法宝","名":"半面铜镜","卷":1,"文":"半面铜镜只有左半边，断口极齐，像是被人一刀劈开的。镜面已经发乌，可用袖子擦三下便能照人，照出来的影子总是偏右，仿佛那半边还留着另一面镜里的东西。此物在云梦泽并不罕见，摸金客一年能从沉船里摸出七八面，多半送到万宝阁换了灵石。可凡留下一面自己用的人，过不了多久就会开始找另半边：有人找了三十年，有人只找了三天便在泽里失了踪。南泽人说，这镜子是配对的，劈开的两半，终究会自己凑回来。","引":"半边镜照半边人；剩下那一半，不在这世上。"},{"类":"功法","名":"《水镜诀》","卷":1,"文":"《水镜诀》是水月宫入门功法，共九重，前六重只在镜前练。练法极简：以水为镜，以息为引，将月光收进丹田，再借镜面把心里的杂念一层层照出来。口诀只有二十八字，最难的一句是「照而不取」。宫中弟子多能到第四重，能到第七重者一代不过三五人。此诀不伤人，却极熬人：有人练到第三重便开始分不清镜中与镜外，走路会下意识地侧身让镜中的自己。宫规规定，练到第七重前不许独自照镜，须有同门在侧。","引":"九重之中，前六重练功，后三重练人；练人的那三重最难过。"},{"类":"功法","名":"《月华引》","卷":1,"文":"《月华引》传自水月宫第二代宫主，专引月华入体，是南泽少有的不伤元气的进境法。练此功者须在月下静坐，不可避风，不可着厚衣，任月光一寸寸浸到骨里。初练时人会觉得冷，冷到第三个夜晚反而不冷了，那时才算入门。此功最忌心急：若一夜引气过多，经脉里会积一层寒气，日后再也化不开，修为止步于此。宫人说这门功法的好处是稳，坏处是太稳——练了十年，进境与练了一年的人差不太多，可到第二十年便见分晓。","引":"月华不急，急的人先废；这门功夫，赢在肯坐着。"},{"类":"功法","名":"《沧浪十七式》","卷":2,"文":"《沧浪十七式》是沧浪剑派的根本剑法，一式一意，皆取自海。第一式「听涛」只学站桩，站到能听出浪里有几声才算成；第七式「断浪」是剑派唯一被外人见过的一式，据说那一剑落下时，会先听见一声极长的水响。十七式从来没有全部传下来，如今崖上能叫出名字的只有十一式，余下六式只留在传说里。守崖人自己会九式，第七式之后便不肯再演。他说这剑法不是杀人用的，是拿来和一片海讲话的；话没讲完，剑就使不全。","引":"十七式剩十一式；剩下的六式，随海一起退走了。"},{"类":"功法","名":"《一苇渡》","卷":1,"文":"《一苇渡》原是一部轻身法，取自「一苇渡江」的旧典，练成之后可在水面行走，足下不沉。此法在云梦泽流传极广，几乎人人都会一点，可练到深处者极少。诀窍不在气，在「不肯多踩」：脚落下去时只用一个脚尖的面，重心要一直往前赶，慢一步便沉。泽上的老人大多能踩出三十步，宫里的人能踩出百步，据说第三代宫主能踩过整片落月湾。此法不伤人，却极耗神，踩得久了会梦见自己一直在走，走不到岸。","引":"一苇可渡，渡的不是水，是那口不肯停下来的气。"},{"类":"丹药","名":"泽心莲丹","卷":2,"文":"泽心莲丹以泽心莲的花心与莲子为材，须在莲开的那一炷香内取花，过了香便不结丹。丹成时色白近乎透明，丹面上有一层极薄的水光，闻起来没有药味，倒像刚下过雨的水面。此丹的主效是涤去一身浊气，服下后三日之内经脉极清，最宜突破前服用。忌讳也在此：若体内本就有暗伤，浊气涤去的同时会把伤也一并翻上来，多半要躺上半个月。丹霞观曾仿制过，做出来的丹色发黄，被人称作水货。","引":"丹白如月，服之三日；三日之后，才知道自己伤在哪。"},{"类":"丹药","名":"菖蒲醒神散","卷":1,"文":"菖蒲醒神散是南泽渔家的常备药，取九节菖蒲的根，晒足九日，磨成细粉，掺芦根蜜调服。此药专解菖蒲花毒：中毒者会坐着发笑，笑着笑着就记不起昨日做过什么，服散半个时辰便能清醒。药铺的老规矩是卖散不卖方，方子只传自家人。散里有一味极苦的东西，谁也说不上来是什么，只知道没有它便不管用。此散不能多吃，吃多了人会变得极清醒，清醒到夜里睡不着，睁着眼看水面到天亮。","引":"花有毒，根能解；同一株草，杀人救人全看取哪一节。"},{"类":"异兽","名":"雾中白鲛","卷":1,"文":"雾中白鲛是云梦泽最常被认错的妖异。它有三丈长，通体雪白，鳞片极薄，游动时不见水纹，只在雾里显出一道淡淡的影。白鲛不主动伤人，却极爱拦路：它会盘在窄水道上，一动不动，等人绕行。若人熄了灯硬闯，它便会跟上来，用背鳍刮船底，一路刮到天亮。南泽人说白鲛其实是鲛人的哨兵，拦路不是害人，是报信——前面有不该去的地方。凡被白鲛刮过底的船，船家洗三遍才敢再下水。","引":"白鲛拦路，不为食人；它拦的是那些不知道该回头的人。"},{"类":"异兽","名":"泽中巨鳖","卷":1,"文":"泽中巨鳖的背有半里方圆，上面长草、落鸟、积土，年久了便像一块会动的洲。它三百年才浮上来换一次气，浮一次要三个月，浮起来时水面会起一大片浑浊的白气。巨鳖极懒，只要背上的人不闹，它便不理；若有人刺它，它会发出极低的一声鸣，像钟被敲了一下，那声音能把十丈内的人震落水中。它的甲脊上生着一层极厚的黑苔，苔里嵌着贝壳与碎瓷，都是这些年被它一路带来的。南泽人说，它的眼睛是闭着的，从不睁开。","引":"背上生草，草上落鸟；三百年不睁眼，也不肯沉。"},{"类":"异兽","名":"三眼水猴","卷":1,"文":"三眼水猴只有三尺高，通体灰毛，额上生着第三只眼，那只眼从不闭，也不动，像嵌进去的一块黑石。它居于芦花荡一带，最擅长模仿人声：你若在荡里喊一句，它便隔一会儿回你一句，音调分毫不差，只是慢半拍。年纪轻的采苇人常被它引着往深处走，走着走着便找不着路。老辈人说，见了它的第三只眼就不能再看第二眼，看第二眼的人会开始怀疑自己刚才说过什么。它怕火，也怕响。","引":"它学你说话，学得比你好；学得太像的东西，别多看。"},{"类":"异兽","名":"提灯水鬼","卷":1,"文":"提灯水鬼并非真鬼，是九曲水道里一种会发光的浮游之物，聚成人形，高与人齐，手提一盏说不清来处的灯。它们只在无风之夜出现，成排站在水面，灯一盏接一盏地亮，像有人在替谁引路。凡顺着它们的灯走的人，多半能平安出泽；可走出之后总要说不上来自己走了多久。南泽的老人说，提灯的不是鬼，是几十年前沉在这段水道里的人：他们还记得路，也还记得要替后来的人照一照。这些话没有凭据，渔家却照做了。","引":"灯是人提的，人早不在了；路还是那条路，照旧能走。"},{"类":"秘闻","名":"月圆钟声","卷":1,"文":"云梦泽每逢月圆，水底会传来钟声，一声比一声沉，最多九声。渔家说这不是钟，是水下的一座宫在呼吸。钟声响时，水面会裂开一道缝，缝里是向下的石阶，走进去的人有的三日后浮上来，有的一去不返。宫里的旧册子上记过七次，七次共有十一人入水，回来三人，回来的三个都没有老。有人算过钟声间隔，说是三百一十二年响一回大的，其余月份只是余响。守崖人说，那口钟认的从来不是时辰，是人。","引":"钟响九声，开一道门；门开的时候，只问一句凭什么。"},{"类":"秘闻","名":"水下古宫","卷":1,"文":"镜心岛的水月宫是迁来的，迁之前，水月宫在泽底。旧宫如今只剩一列石柱和几面半沉的墙，柱上的字被人刻过又磨平，磨得极浅，须借着灯火斜照才看得清。摸船的摸金客说那里没人管，可他从不下去，因为下去的人总会几天回不来。旧宫地基比今日宫墙低了七丈，历代宫主都葬在那里，每人的名讳刻在一块方碑上，碑面朝下嵌进地里，谁也看不见字。只有宫主本人能翻碑——三百年来，翻过的人不到十个。","引":"新宫在岛上，旧宫在泽底；搬得走人，搬不走那七丈。"},{"类":"秘闻","名":"鲛人借珠","卷":1,"文":"南泽流传最广的一桩旧事，说的是六十年前有人在落月湾借出一颗珠，借珠的是个鲛人，说只借七日，七日后还两颗。七日后那人果然得了两颗珠子，可从此再也唱不成歌，也听不出曲子的高低。这故事各处版本不同：有的说鲛人是替病重的孩子求药，有的说那两颗珠子其实是那人的寿数换来的，还有人说借珠的人根本没还，如今还在鲛渊底下替人拉网。无论哪一版，渔家教孩子时都说同一句：水里的东西可以换，不要借。","引":"借七还二，账面上是赚的；赚了的那种账，最还不起。"},{"类":"秘闻","名":"宫规第一条","卷":1,"文":"凡男子登岛者，沉泽。这九个字刻在镜心岛宫墙下的石碑上，立规者是三百年前那位宫主。宫里从不解释这条规的缘由，只执行。当年为何立规，有三种说法：一说她曾被一个男修骗去半部功法，二说她的亲弟死在一个男子的船上，三说她只是想让这座宫有个不与人争的理由。三百年来这条规沉过四个人，第四个是个十七岁的少年，为替他姐姐送一封信游过了整片泽。而旧宫底那块碑底下，有人翻出来只刻着四个字：我亦不能。","引":"立规的人自己也做不到；做不到，所以更不肯改。"},{"类":"风俗","名":"封泽不开船","卷":1,"文":"云梦泽有一条不成文的规矩：大雾封泽之日，任何船只不得出港，不管客人给多少灵石。雾起时渡口会敲三下铜片，敲完便把所有的船并排锁在一起，钥匙交给年纪最长的船家。这规矩没人立，也没人破。破过的人有三回：第一回的船三天后漂回来，船上空着；第二回连船都没回来；第三回是个外乡的修士，硬要出港，结果第二日自己走回来了，一身水，一句话不说，此后见雾就躲。","引":"雾起锁船，锁的不是船，是那些以为自己能行的人。"},{"类":"风俗","名":"沉泽之刑","卷":1,"文":"沉泽是水月宫最重的一条刑，也是最少用的一条刑。行刑不在夜里，在正午：以素心殿的一根长绳，把犯人缚住双手，从岛西的礁石上推下去，绳子不解，任其沉落。宫里的说法是「沉者不问来路」，沉下去的人不必审、不必辩，也不必立碑。三百年来用过四回，每一回都有执灯弟子在礁上站到日落。此刑之所以少用，并非宫里心软，而是因为沉泽之后，名册上那一格会空着——空着的格子，比刻了字的更让人不安。","引":"刑只四回，回回都在正午；正午沉人，是想让天看着。"},{"类":"地理","名":"芦花荡","卷":1,"文":"芦花荡在云梦泽西北，是整片泽里最容易迷路的地方。芦苇长得比人高，一望无际，进去之后天只剩一条缝，风一过便齐齐弯腰，声音像有人在耳边说悄悄话。荡里水道不成形，今天还通的路明天就被新长的苇根堵死。割苇人有三条规矩：进荡先系红布，红布自解便要退；不许在荡里喊人；日头偏西前必须出荡。荡深处有一片药圃，是菖蒲与水月草长得最好的地方，也是三眼水猴最多的地方。有人说夜里能听见芦花在响，其实那是水在苇根之间走。","引":"芦花荡不杀人，它只是让人多走一会儿，走到忘了自己要去哪。"},{"类":"地理","名":"半月汀","卷":1,"文":"半月汀是云梦泽中唯一一处被官方认可「可以赌」的地方。它原是一块半圆形的沙洲，涨潮时只剩一半，形如残月，故名。汀上有棚无墙，四张方桌，白日里是茶棚，入夜便开赌。南泽的散修、船家、摸金客都往这里挤，赌灵石、赌船道、赌一枚来历不明的东西，也赌一句话。坐庄的据说是当年在天剑域输掉一柄剑的独眼人，庄家的规矩只有一条：赢了不许马上走。汀上的水从不淹上来，老人说是底下压着什么东西，压得水都不敢动。","引":"汀上的账从不清，赌到最后押的都不是钱。"},{"类":"功法","名":"《听涛剑意》","卷":2,"文":"《听涛剑意》不是剑招，是一种养法。沧浪一脉练剑，先在崖顶站桩，站到能从浪声里听出几声、几声重、几声轻，才算入门。此法不拘兵器，一柄木剑、一根竹篙、甚至一截断桅都能练。练成之后出剑不带风声，因为剑意在浪声里，浪响了，剑也就到了。守崖人说这门功夫最忌心急：听不出浪的人，练一百年也只是在听浪。崖上三十人里，真正听出来的只有两个，其中一个已经死了五十年。","引":"听见浪的人不必出剑；出剑的人，是浪先动了。"},{"类":"地理","名":"洗剑池","卷":2,"文":"洗剑池在听涛崖顶，是沧浪剑派养剑之处。池不过两丈方圆，池底铺着从沉舟滩运来的铁砂，水色常年灰黑，看不见底。剑派不磨锋，只在池水里泡：泡三日剑认主，泡七日人认剑，泡过七日的人往往就再也走不开了。池壁上刻着许多名字，都是历年泡剑的人刻的，最浅的一层叠着最深的一层。池水极冷，冷到能钻进骨头，据说是因为池底铁砂里沉着一柄断剑的剑尖，那点锋化在水里，一百年也没化完。","引":"剑不必磨，泡得久了自有利；人不必修，浸得久了自成剑。"},{"类":"地理","名":"鲛人渡","卷":1,"文":"鲛人渡是云梦泽与深水的分界，水面在这里由浊转清，颜色像是被人从底下换过一遍。岸上立着一块无字碑，据说是当年人与鲛人立约时留下的，碑上原有字，三百年前被一场大水磨平，如今谁也补不上。渡口有条不成文的规矩：过此渡者，不许说诳语。船家说这是鲛人在听：说了假话的船，船底总会多一道划痕。渡口的水下有三条极深的水道，通着鲛渊，每逢月圆会往上冒一阵冷流。南泽人过这一段，多半会把要说的事在心里先过一遍。","引":"过鲛人渡不必带钱，只要把话想清楚。"},{"类":"地理","名":"雾隐渡口","卷":1,"文":"雾隐渡口是南泽最老的渡口，石阶磨得发亮，连石缝里的草都不长。摆渡人不收灵石，只收干粮与故事：干粮给自己，故事给过客——他听了四十年，说南泽所有的旧事都是这样听来的。渡口的木板上刻满了名字，都是欠船钱的人留的，划不掉的比划得掉的多，据说划不掉的那些名字底下都有一道细痕。渡口边上有一排矮屋，专给误了潮的客人过夜，屋里只有一张板床和一盏油灯。雾起时渡口会敲三下铜片，敲完全泽的船都不许出港。","引":"渡口不卖船票，卖的是让人把话说完的地方。"},{"类":"法宝","名":"崖上无名剑","卷":2,"文":"听涛崖上插着三百柄剑，剑身长短不一，锈色深浅不同，唯一的共同处是剑柄上都没有刻字，也无剑穗，只有一圈被手磨光了的木柄。守崖人说，沧浪一脉的剑从不题名，因为题了名就成了某个人的东西，而不题名的剑，谁拔得起来便属于谁。三百柄剑里有二十余柄插得极深，剑柄几乎埋进石里，那是连守崖人也拔不出来的。每一柄剑的锈色深浅都不同：锈得浅的，是主人才死了不过几十年；锈得深的，往往已经没人记得它曾经是谁的。","引":"三百柄剑皆无名；有名的那一柄，早断在海里了。"}],"事件":[{"id":"yunmeng_001","题":"雾渡无船","类":"天象","重":4,"域":["yunmeng"],"境界":[0,3],"段":["八百里云梦起了封泽的大雾，{地点}的芦苇被水气压得贴住了地面，连水鸟都不肯落下来。你在渡口站了半个时辰，才等到一条撑篙的小船，船头挂着一盏{器物}，灯芯明明灭灭。梢公说，雾里行舟只认灯不认路，灯若灭了，人就不必再找了。他说话时一直低着头，斗笠遮住半张脸。","船行到半夜，{天象}，水面浮起一层细碎的白光。梢公忽然收篙，说水道前方有{妖异}盘着，绕路要多走一夜，而船上的灯油只剩半盏。你摸了摸随身的包袱，里头是替人捎带的一匣{灵材}，雇主千叮万嘱，这东西沾水就坏。","{地点}的灯火早已看不见，雾里传来一声极轻的、像是有人用指甲刮船底的声音。梢公把篙子横在船头，回头看你：是熄灯硬闯过去，还是把匣子扔下水换一条活路。"],"择":[{"名":"熄灯硬闯","文":"你把灯按灭，整条船顿时黑透。凭着梢公记忆里的水道，船贴着芦苇一点点摸过去。水下的刮擦声越来越近，有一阵冰凉的东西擦过你的手背，腥气直冲鼻端。天亮时船靠了岸，你在舱底捡到一枚不属于自己的蚌珠，而梢公的手，已只剩森森白骨。","果":{"灵石":60,"修为":120,"气血":-20,"因果":1}},{"名":"弃匣换路","文":"你把{灵材}匣子推下水，水面立刻翻起一阵细浪，那刮擦声随之远去。梢公松了口气，绕道把你送到对岸，却死活不肯收船钱。雇主那边自然不好交待，你赔了三十块灵石，可那一夜你睡得极沉，什么也没有梦见。","果":{"灵石":-30,"修为":40,"道心":2,"悟性":1}},{"名":"点亮第二盏","文":"你取火折子点着，在船尾挑起第二盏灯。雾里一时亮如白昼，那东西被照出真形，仓皇沉下水去。可你的眼睛被白光灼了三日，看什么都是重影，这七日里连一枚符纹都画不圆，字也写得歪斜。","果":{"修为":160,"气血":-30,"悟性":-1,"声望":2}}]},{"id":"yunmeng_002","题":"水镜照人","类":"奇闻","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的水镜台一年只开三日，台面是一整块青石凿成的浅槽，蓄着从泽心引来的活水。守台的{人物}说，照镜之人看见的未必是自己，多半是心里最不肯承认的那一面。她把手指竖在唇上，让你照之前先想清楚，到底要不要看。","你俯身照水，镜中浮出的却不是你，是一个穿着{器物}、眉眼与你七分相似的男子，正站在{地点}的废堤上朝你招手。{天象}，镜面起了细纹，水下的影子反倒越发清晰。守台人退了半步，说你身上带着不该带的东西。","镜中的影子开口说了三个字，你听不真切，只觉得心口被人轻轻叩了一下。守台人说，若再照一刻，你便能听全；若此刻退开，这一辈子都不会知道那三个字是什么。{天象}，她的手指在台沿上收紧了一下。"],"择":[{"名":"照到底","文":"你没有退。水面彻底静下来，镜中那人的嘴唇动得极慢，你听见了自己的名字，与一句「莫回岛上」。话音落下，镜面碎成千万点光，你的识海里多了一道说不清来路的印记，此后每逢月圆便隐隐作痛。","果":{"修为":200,"悟性":3,"魔念":1,"道心":-1}},{"名":"拂袖而退","文":"你直起身，把袖口的水珠抖落在石台上。守台人松了口气，替你抹去镜面的水痕，说你是这十年里第四个肯退开的人。你什么也没拿到，只是回去的路上脚步格外稳，夜里也没有梦见那座废堤。","果":{"道心":3,"悟性":1,"修为":30}},{"名":"投石碎镜","文":"你捡起一枚石子投进水里。镜面炸开，那道影子发出一声极尖的响，随即散尽。守台人脸色惨白，说这面镜子要再养三十年才能照人，你这一石子，把三十年的水气都惊散了。她不再理你，只让你快走。","果":{"因果":2,"声望":-3,"修为":80,"灵石":-20}}]},{"id":"yunmeng_003","题":"素心殿前跪","类":"宗门","重":3,"域":["yunmeng"],"境界":[0,5],"段":["你随一条运藕的船误上了{地点}，还没看清宫墙的样子，四盏灯已经围了上来。执灯的{人物}一句话不问，只把灯举到你脸前照了一照，便说你身上有男子的气息，按宫规该沉泽。她的语气平平，像在念一段背熟了的课。","素心殿的石阶上刻满了字，是历代宫规。{人物}跪在最下一级，膝下垫着一块薄薄的青砖，已经跪了不知多久。她说自己只是替一个外人递了一封信，递信不算什么大罪，可宫规里偏偏写了不许。{天象}，殿前的铜铃自己响了一声。","戒律嬷嬷终于来了，手里捧着{器物}。她说宫里从不杀不该杀的人，也从不放不该放的人：你若肯在殿前跪到天亮，替这弟子分一半罚，此事就此揭过；若不肯，便只剩沉泽一条路。"],"择":[{"名":"跪到天亮","文":"你在冰冷的石阶上跪了一夜。膝盖麻木、手指发僵，天亮时露水把衣裳浸得能拧出水来。嬷嬷亲自扶你起来，说宫里记你这一份情。那道被递出去的信从此没人再提，而你在镜心岛的名字，也不再是「外人」。","果":{"气血":-40,"声望":8,"道心":2,"悟性":2}},{"名":"跳水下岛","文":"你趁换灯的空隙翻过宫墙，一头扎进冰凉的泽水。身后的灯一盏盏亮起，却没人真的跳下来追。你在水里泡了半宿才摸上岸，衣裳丢了，随身的{器物}也沉了底，只留下满身水腥和一句再不敢忘的宫规。","果":{"灵石":-60,"器物":-1,"气血":-20,"修为":60}},{"名":"替她作证","文":"你没有跪，而是把那封信的来龙去脉照实说了，说是有一伙摸金客借运藕船夹带私货。嬷嬷听完沉默良久，叫人去查，查实之后罚了六个人。跪着的弟子被搀走时回头看你，眼睛很亮。你得罪了一伙人，也交下了一座宫。","果":{"因果":2,"声望":10,"灵石":50,"修为":80}}]},{"id":"yunmeng_004","题":"崖上三百剑","类":"宗门","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{地点}上插着三百柄剑，剑身锈成一片暗红，剑柄都朝着同一个方向。守崖的{人物}每天清晨提着水桶上来，也不擦剑，只是绕着走一圈，看哪一柄的锈色变浅了，就把它拔起来端详片刻，再插回去。","他说沧浪一脉曾有三万弟子，如今只剩三十人，剑却一柄也不能少。{天象}，崖下的浪声比平日更响，一柄插在崖边的{器物}忽然自己鸣了三声。守崖人的手抖了一下，说这是师门里最后一位长老的剑，长老五十年前死在{地点}，尸骨都没捞上来。","他把剑重新插好，转头看你，说崖上的剑若肯认谁，那人就能带走一柄；可剑认人从来不是看缘分，而是看它能不能替你咽下那些说不出口的话。{天象}，风从崖下卷上来，把剑柄上仅剩的一条红布吹得直晃。"],"择":[{"名":"请剑一试","文":"你把手按上剑柄，一股凉意顺着筋骨窜上来，指尖立刻被剑气割开三道血口。那柄剑没有认你，只是在你掌心留下一个淡红的印。守崖人说，剑没认你，但它记住了你，下次来时它会先响一声。","果":{"修为":150,"气血":-30,"悟性":3}},{"名":"陪他巡崖","文":"你什么也没求，只跟着他走完了那三百步。他一边走一边说每一柄剑的主人是哪一年死的、死在哪里、最后一剑砍向谁。走到崖尾时天已经亮了，他把随身的水囊递给你，说三十年来第一次有人肯把这一圈走完。","果":{"声望":6,"道心":3,"悟性":2,"修为":60}},{"名":"偷拔一柄","文":"你在夜里摸上崖，拔了一柄最短的剑就走。剑出鞘时没有声音，回头的路却走得格外艰难，脚下一块石头都不肯站人。天亮你才发现剑柄上刻着一个女子的名字，而你的掌心，已经裂开了同样的六个字。","果":{"器物":1,"因果":3,"魔念":2,"声望":-8}}]},{"id":"yunmeng_005","题":"沉舟滩摸金","类":"机缘","重":4,"域":["yunmeng"],"境界":[0,5],"段":["{地点}的泥里埋着七条船，都是百年内沉下去的，桅杆从水面斜斜戳出，像一排折断的手指。领路的{人物}说，下滩只认潮水，退潮后有两个时辰，多一刻就要等人抬着走。他说话时一直在往袖子里塞东西。","你跟着下到泥里，脚下黏得像踩在活物的舌头上。第三间舱里，你摸到一只{器物}，擦掉泥之后还能看见青色的釉光。同行的{人物}忽然叫你别动，说舱底有东西在呼吸，那声音很慢，一会儿近一会儿远。{天象}，滩上的水开始往回涨。","他们已经开始往上爬了，只有你还站在舱口。舱底那团呼吸声就在脚下，被泥裹住一半的箱盖掀开了一条缝，缝里的东西微微发亮。你要么拿走那只箱子，要么空着手趕在潮水前上岸。{天象}，泥里的水已经灌进靴筒，凉得刺骨。"],"择":[{"名":"撬开铁箱","文":"你用力一撬，箱盖翻开，一股近乎凝固的香气扑出来。箱中是一枚{灵材}，还压着半卷发黑的绢书。你抱着箱子一路狂奔，爬上岸时水已经漫到腰上。那半卷绢书后来让你少走了三年弯路，只是你从此再也闻不得那种香气。","果":{"灵材":2,"修为":180,"悟性":3,"气血":-25}},{"名":"只拿瓷枕","文":"你退了一步，只把那只青瓷枕塞进包袱。上岸后把它卖给{人物}，换了一百二十块灵石。同行的人后来死了两个，一个沉在舱底，一个上了岸还在说梦话。你摸着那点灵石，总觉得它比瓷枕还凉。","果":{"灵石":120,"因果":-1,"道心":-1,"修为":40}},{"名":"拖人上岸","文":"你把手里的东西全丢了，去拖那个还在舱里的同伴。他死死抓着一只匣子不肯放，你硬把他连人带匣拽出来，两人摔在滩上，潮水从脚边漫过去。他后来把匣子分了一半给你，匣里是十七枚成色极好的{灵材}。","果":{"灵石":80,"灵材":1,"声望":7,"修为":60}}]},{"id":"yunmeng_006","题":"鲛人借珠","类":"奇闻","重":3,"域":["yunmeng"],"境界":[0,6],"段":["{地点}的水面在月下像一整块冷玉，水上浮着一个半身的人影，长发散开，肩背之上覆着细密的鳞。当地的{人物}说，那是鲛人，从不伤人，只是爱借东西，借了便用歌声抵账。她唱完一支曲子，你便没有法子再恨她。","{天象}，那个声音忽然停了。她转过身，露出一张极年轻的脸，把手伸到船边，掌心里是一颗{灵材}，珠光在她的指缝里游。她说她的孩子在{地点}底下病着，这颗珠子只借七日，七日后必定还你两颗。","船家脸色发白，一直拉你的袖子。他说六十年前也有人借过，七日后果然得了两颗珠子，只是那人往后再也唱不成歌，也听不出曲子的高低。水里的手还举着，珠子一明一暗。{天象}，雾在船舷边上散开又合上，把那点珠光收得极小。"],"择":[{"名":"借珠与她","文":"你把珠子按进她掌心。她低头笑了一下，随即沉进水里，连水花都没留。第七天夜里，你的船头多了两颗一模一样的珠子，还有一段说不出来历的调子，你哼它的时候，泽上的雾会自己散开一条缝。","果":{"灵材":2,"悟性":3,"修为":80,"因果":1}},{"名":"以歌换珠","文":"你不肯白借，要她当场唱一支。她唱了，调子极长，你听着听着就忘了自己坐在哪条船上。醒来时天已大亮，手里攥着那颗珠子，嗓子哑了半个月，可脑子里多出一段极清楚的音律，从此布阵的手快得出奇。","果":{"灵材":1,"悟性":4,"气血":-15,"修为":60}},{"名":"摇船便走","文":"你把篙子往水里一插，掉转船头就走。身后没有怒声，也没有追来的水浪，只有那支曲子慢慢低下去，像一根线被水泡软了。船家说你做得对，可你在{地点}上坐着的那一夜，一直觉得心口空了一块。","果":{"道心":2,"修为":30,"因果":-1}}]},{"id":"yunmeng_007","题":"月圆钟声","类":"秘境","重":2,"域":["yunmeng"],"境界":[2,8],"段":["月圆之夜，{地点}的水面上会浮出一口钟的影子，钟声从水底传上来，一声比一声沉。{人物}说那不是钟，是水下的一座宫在呼吸，一百年响一次，响足九声，第九声之后水下会开一条路，走进去的人，有的三日后浮上来，有的再也没浮上来。","{天象}，水面上果然裂开一道缝。缝里没有水，是一条向下走的石阶，湿得反光。你数着钟声往下走，第七声时看见了{器物}插在阶旁的泥里，第八声时，石壁上显出成排的字，是某种极古的功法残篇。","第九声还没落下。石阶尽头有一扇门，门缝里透着比月光更冷的光。你身后那条路还在，只要在钟声落定前退回去，一切都还来得及。{天象}，第九声还在水底蓄着，整条石阶都在轻轻发颤。"],"择":[{"名":"推门而入","文":"你在第九声里推开了门。门后不是宫殿，是一片没有边际的水，水里漂着无数具未曾腐烂的人形，每一个都闭着眼。你只来得及看清最近那个人的脸——和你一样。门在身后合上，再开时，你躺在滩上。","果":{"修为":500,"悟性":5,"寿元":-20,"魔念":2}},{"名":"抢抄残篇","文":"你不再往下走，转身贴着石壁把那些字一个个记进心里。第八声散尽，字迹迅速黯淡，你已经记下了三十七句。第九声落下时水合了，你被浪推回滩上，耳朵里全是水声，脑子里的句子却一字未丢。","果":{"悟性":7,"修为":300,"气血":-30}},{"名":"拦人退路","文":"你没进去，反而在缝口守着，等第七个想下去的人。你把他按在滩上，任他骂你，直到钟声落定、水面合拢。他后来才明白自己那条命的价钱。你在{地点}上坐了一夜，忽然很想笑，又笑不出来。","果":{"声望":5,"因果":2,"道心":2,"修为":100}}]},{"id":"yunmeng_008","题":"芦荡药人","类":"灾祸","重":3,"域":["yunmeng"],"境界":[1,5],"段":["{地点}的深处有一片药圃，是{人物}开垦的，种的尽是九节菖蒲与水月草。此人十年来只与药材说话，见人来便躲。可这一年的菖蒲开得异常，花穗子有半人高，站在花丛里分不清哪一株是人。","你在圃边找到了他，他正蹲在水里给一株{灵材}浇水，动作慢得像在水底。你叫了他两声，他抬起头，脸上生着细密的白根，一直钻到脖颈里。{天象}，圃里的花一齐转向你，花心隐隐张开，像许多只没有眼白的眼睛。","他勉强笑了一下，说自己当年贪那点药性，日日以菖蒲入药，如今倒成了半个药人。他往圃外指了指，说趁着花还没结子，你赶紧走；又往自己胸口指了指，说那里还留着最后一株好的。{妖异}的影子正从花丛后面慢慢漫过来，白得没有边。"],"择":[{"名":"替他取药","文":"你跳下水，把他胸口那一株连根捧出来。根须断时他闷哼了一声，人却清醒了些，脸上的白根慢慢退了半寸。那株药后来被他焙干送给你，说这是他这辈子种的最后一炉，也是最好的一炉。","果":{"灵材":2,"声望":5,"气血":-20,"悟性":2}},{"名":"焚圃断根","文":"你退出去，从囊里摸出火折子，一把火把整片药圃点了。火光里那些花发出细碎的哭声，他跪在泥里没有拦。三日后他来找你，脸上已看不出根痕，只是再也种不活一株菖蒲，见了花就绕着走。","果":{"因果":2,"修为":120,"道心":1,"声望":-2}},{"名":"转身便走","文":"你没有回头，一路走出芦荡，直到听不见花穗摩擦的声音。半年后有人说芦花荡多了一片自己会走的菖蒲，见了船就围上去。你听完只是把船撑得远些，从此再不从那一带过。","果":{"修为":40,"道心":-1,"因果":1}}]},{"id":"yunmeng_009","题":"宫规第一条","类":"人情","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}宫墙下的石碑上刻着宫规第一条：凡男子登岛者，沉泽。字是三百年前刻的，笔锋已被水气磨圆。看碑的{人物}每天都要拿布擦一遍，擦完便坐在碑下补网，一坐就是一日。","你问她这条规到底沉过多少人。她数了很久才说，一共四个，最后一个是个十七岁的少年，为了替他姐姐送一封信游过了整片泽。她说这话时手上的网线断了一根，{天象}，碑面的水痕流下来，像谁在哭。","她把补好的网收进筐里，说宫规不改，人也不能白死。她问你：若有一日你能站到素心殿里说话，你打算说什么。{天象}，碑上的字在灯下泛着一层湿光，像刚被人写上去。"],"择":[{"名":"说该改","文":"你说这条规该改，至少该留一条送信的活路。她听完点了点头，又摇了摇头，说这话三百年来有二十一个人说过，说的人都还活着，规却没有改。她把一枚{灵材}塞进你手里，说你走吧，等她死了，这块碑总有人接着擦。","果":{"道心":3,"声望":3,"悟性":1,"灵材":1}},{"名":"说该守","文":"你说宫规既立了三百年，就有它立的道理，破了例便不再成规。她抬起头看了你很久，把手里的线重新穿进针眼，说你是个讲规矩的人，讲规矩的人在这世道里往往活得最累。","果":{"悟性":2,"道心":1,"修为":60}},{"名":"替没说话","文":"你没有答，只把碑上被水冲淡的两笔补上了墨。她看着你补完，忽然笑了一下，说补碑的人比说理的人少。那夜她把补网的手艺教给了你，说是她母亲传的，一直没找着合适的人。","果":{"声望":6,"悟性":3,"修为":40}}]},{"id":"yunmeng_010","题":"断剑择主","类":"机缘","重":2,"域":["yunmeng"],"境界":[2,7],"段":["{地点}的泥里插着一柄断剑，只剩三分之一的剑身，剑柄上缠的麻布早烂尽了。{人物}说这剑在泥里插了至少两百年，每逢潮退便往外挪半寸，像有什么话没说完。他劝你别碰，说断剑多半不认活人。","你还是走了过去。泥面在你脚边裂开一道口子，{天象}，断剑上的锈忽然剥落，露出里面极亮的钢色。你伸手一握，剑身嗡地震了一声，你右手臂上的经脉一下子被撑开，像有人拿水往里灌。","这时崖上传来喊声，是{人物}带着几个人下来了。他说这剑本是沧浪派的旧物，你若拔得起来，剑归你；若拔不起来而剑身断尽，这泥滩就得用你的血来赔。"],"择":[{"名":"拔剑而起","文":"你沉腰、按住手腕，一寸一寸把断剑拔了出来。泥水从剑尖滴到脚面，你的右臂却彻底麻了，三日后才恢复知觉。剑身上只有一个字，是「归」。守崖人看了很久，让开了路，什么也没再说。","果":{"器物":1,"修为":260,"气血":-35,"声望":4}},{"名":"以血喂剑","文":"你不拔，先咬破指尖，把血抹在剑脊上。断剑震了三下，锈色褪尽，随后竟自己松了泥，横躺在你掌心。守崖人脸色变了，说这剑是「认血不认手」的凶物，你可要想清楚要不要带它上路。","果":{"器物":1,"修为":320,"气血":-60,"魔念":2,"寿元":-10}},{"名":"填泥回滩","文":"你把泥捧起来，一捧一捧填回剑边，直到断剑重新矮下去半寸。守崖人看着你填完，什么也没说。潮水上来时那柄剑又往外挪了半寸，只是这回你没有再伸手。","果":{"道心":4,"因果":1,"修为":50}}]},{"id":"yunmeng_011","题":"蚌珠市价","类":"市井","重":4,"域":["yunmeng"],"境界":[0,3],"段":["{地点}的早市摆在船与船之间，板子一搭就是摊位，卖的全是泽里的东西：{灵材}、藕、鱼、还有一筐一筐的{灵材}。{人物}蹲在船头压价，把一颗迷雾蚌珠举到日头下看，说这珠子的光太散，最多值八十。","卖珠的是个十来岁的孩子，咬着嘴唇不肯松口。你听见旁边有人低声说，这孩子的父亲上个月沉在{地点}，珠子是摸出来的最后一点家当。{天象}，市上的人忽然都安静了半刻，随即叫得比先前更响。","蚌珠贩子转过头来问你，既是行家，便说个公道价。孩子也抬头看你，手里那颗珠子被他攥得全是汗。{器物}在旁边的摊子上被风吹得叮当作响，一声一声，像在替你数价。"],"择":[{"名":"替他撑价","文":"你接过珠子看了半晌，说这种成色的珠子放在中州的万宝阁，一百六十也让不下。贩子脸上一僵，最后一百五十成交。孩子把钱袋抱在怀里，连头也不敢抬，只在跳上另一条船时回头看了你一眼。","果":{"灵石":20,"声望":6,"道心":2,"因果":-1}},{"名":"自己收下","文":"你抢在贩子前头开口，一百一十块灵石，当场付清。珠子确实好，光里带着一层极淡的蓝。孩子走后，贩子笑着拍你肩膀，说后生可畏。你摸着珠子，忽然觉得掌心里那点凉，好几天都没散去。","果":{"灵石":-110,"灵材":2,"道心":-1}},{"名":"只问来路","文":"你没有出价，只问孩子珠子是从哪条船上摸的。他报了个船名，你记下了。那船三年前沉在{地点}，船上载的是一批宫里的货。你没有买珠，却在半月后从那条船里捞出了一样更值钱的东西。","果":{"修为":80,"悟性":3,"灵石":60}}]},{"id":"yunmeng_012","题":"雾中画舫","类":"奇闻","重":2,"域":["yunmeng"],"境界":[1,6],"段":["雾里漂来一艘画舫，{器物}在船头晃着，舱里亮着灯，帘子半卷，能看见桌上的酒还温着。{人物}说这船三十年前就沉在{地点}了，可它每到大雾天就会顺水漂一段，从东漂到西，一次也没撞上过别家的船。","你撑船靠过去，舷边的水纹没有一丝被船身推开的样子。栏杆上搭着一件{器物}，还在滴水。舱里传来调弦的声音，一声、两声，然后有人轻轻唱了一句，唱的是「雾里无人，灯还亮着」。{天象}，画舫的灯忽然暗了一盏。","你可以上船，也可以退开。那调弦的声音停了，像是在等。{天象}，雾把画舫的两头都吞了进去，只剩舱里那一点灯还浮在水上。"],"择":[{"名":"登舫一坐","文":"你踏上甲板，脚下毫无声音，像是踩在别的东西上。桌上那杯酒端起来是温的，喝下去却冰凉，一路凉到丹田。琴声再起时，你已说不出自己在这一处坐了多久，只记得醒来时船在{地点}，手里多出一支骨笛。","果":{"器物":1,"修为":220,"寿元":-8,"悟性":2}},{"名":"拾衫退开","文":"你只把栏杆上那件滴水的衣裳取下，退回自己船上。衣裳一离开画舫便干了。再抬头时，那艘船已经漂远了，灯还亮着，琴声还响。裳上绣着一个名字，后来你在宫里的旧册子上找到了它。","果":{"器物":1,"悟性":3,"修为":90,"因果":1}},{"名":"敲钟示警","文":"你摸出船头的铜片，用力敲了三下。画舫上的灯火骤然全灭，雾里传来一声很长的、像是叹气的声音。第二日整片泽都知道你惊了一艘不该惊的船，有人谢你，也有人从此绕着你走。","果":{"声望":4,"因果":2,"修为":60,"道心":1}}]},{"id":"yunmeng_013","题":"听涛崖逐客","类":"争斗","重":3,"域":["yunmeng"],"境界":[1,6],"段":["你上{地点}的时候，{人物}正在崖边磨一柄极长的剑，磨石硌在青石上，声音像有人在咬着牙。他头也不抬地说，崖上不留外人，这句话八十年来他对三千个人说过，其中有两个没走。","{天象}，海浪拍上来打在崖壁上，水沫能溅到胸口。他终于抬头，把剑横在膝上，说沧浪派的门早已关门，可门规还在：来人若能接下他一剑，崖上的一切任你取用；若接不住，自己从崖上跳下去。","他把剑鞘搁在地上，剑尖斜指水面。崖风把你的衣角吹得笔直，退路在身后只有七步。{天象}，浪又打上来一次，水沫溅到两个人的膝上都湿了。"],"择":[{"名":"接下这一剑","文":"剑落下来的时候你根本没看清，只凭本能侧过半个身子。剑锋擦着肩头劈开一道口子，你站住了，也没有还手。他把剑收回去，看完伤口便转身走了，临走扔下一句：能站住的人，崖上永远给你留一块磨石。","果":{"修为":240,"气血":-45,"声望":7,"悟性":2}},{"名":"认输下崖","文":"你退到第六步时便跪了下去，说接不住。他点了点头，说认输的人比死撑的人多活三十年。你没有上崖，可他没有赶你走，反而在崖下给你指了一处能避风的水湾，说你随时可以再来。","果":{"道心":3,"气血":-10,"修为":80,"声望":2}},{"名":"问他一剑何来","文":"你没有应战，只问他这一剑叫什么名字。他愣了很久，说这一剑本来有名字，叫「沧浪第七式」，可叫得出它名字的人都已经死了，于是他也就不再叫了。那一日你们在崖顶坐到天黑，他教你起手，没教你收式。","果":{"悟性":6,"声望":5,"修为":150}}]},{"id":"yunmeng_014","题":"泽心莲开","类":"机缘","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}的莲只在月圆夜开，一朵一炷香，开过便沉。{人物}说泽心莲的花心里积着一滴水，那水叫月华露，服下能洗去一身的浊气。可莲下有{妖异}守着，年年有人死在这片水面。","{天象}，第一朵莲在水面裂开了，白得几乎透明。你伏在船舷上伸手去够，指尖刚碰到花瓣，水下的泥就动了一下，一张比船还宽的黑影缓缓浮起，把月亮挡了半边。","莲心那一滴水正往下滴。你可以现在就扑过去，也可以等黑影彻底浮上水面看清它是什么。{妖异}在水下缓缓转过半圈，把整片月的倒影揉成了一团。"],"择":[{"名":"抢水便走","文":"你把身子探到极限，接住那滴水，翻身滚回舱里。船底被什么东西顶了一下，整条船横着滑出去三丈。你没回头，一口气撑出半里地，才发觉手里的水已经渗进皮肉，经脉里像过了一遍温水。","果":{"修为":200,"灵材":1,"气血":-20,"悟性":2}},{"名":"看清再说","文":"你按住心跳，等那黑影浮上来。是{妖异}，背甲上生着上百个孔，每个孔里都长着一朵小莲。它浮上来只是为了换气，换完便沉了。它沉下去的地方，水面上留下三朵莲，你慢慢采了个干净。","果":{"灵材":3,"悟性":4,"修为":120}},{"名":"割莲留根","文":"你没有去够那滴水，只把莲茎割断，连根须一起埋回泥里，让这一片水明年还能开花。守莲的老渔翁在船头看了很久，说你是六十年来第一个割莲还记着埋根的人，往后这片莲塘，你可以随便来。","果":{"道心":4,"声望":5,"因果":-2,"修为":60}}]},{"id":"yunmeng_015","题":"借月还魂","类":"灾祸","重":2,"域":["yunmeng"],"境界":[2,7],"段":["{地点}的渔家有条不成文的规矩：月圆夜若见水边站着一个背对月亮的女人，千万不要应她的话。守夜的{人物}说，那是借月还魂的东西，它要的不是命，是名字——有了名字，它就能上岸。","{天象}，你在堤上当真看见了那样一个人影，湿发贴在背脊上，衣裳被水泡得发白。她没有回头，只是轻轻问了一句「我姓什么」。声音很轻，却像是贴着你的耳朵说的。","堤下就是水，水边泊着一条无人看管的小船。你退三步就能走脱，进一步就能看清她的脸。{天象}，月亮被云咬掉了一角，堤上的影子跟着短了一截。"],"择":[{"名":"闭口退去","文":"你咬住舌头，一个字也不出，倒退着走了三十步，直到堤下的水声听不见为止。第二日堤上多了一双湿脚印，一直走到泽边就断了。守夜人给你倒了碗热酒，说你若当时应了半句，如今站在那里的就是她。","果":{"道心":3,"修为":60,"气血":-10,"因果":1}},{"名":"反问其名","文":"你不答，反问一句「你姓什么」。那影子僵在原地，半晌发出一声不是人声的响，随即散成一片水汽。周围的芦苇齐齐倒伏，像被谁踩过。你得了它的三缕阴气，也从此在夜里总能听见有人念你的名字。","果":{"修为":260,"魔念":2,"悟性":2,"道心":-1}},{"名":"掷灯照面","文":"你把手里那盏{器物}掷到堤边。灯光照过去的一瞬，你看见了一张和自己有几分相似的脸，眼睛是空的。灯灭之后堤上空无一人。你的寿元像被人抽走一小截，走回船上的那一路，膝盖一直在抖。","果":{"寿元":-15,"修为":300,"因果":2,"气血":-30}}]},{"id":"yunmeng_016","题":"弃徒归岛","类":"人情","重":2,"域":["yunmeng"],"境界":[1,6],"段":["你在{地点}遇见一个撑着破船的老妇，船上堆着十几口箱子，箱上的封条是水月宫的样式。她说自己是三十年前被逐出岛的弃徒，如今回来，只想把箱子里的东西还回去，人不敢上岛，求你替她送。","{人物}替她说了缘由：当年她替宫里守着一炉丹，丹成那夜被人换了药，却没人敢认，最后只她一个担了罪名。{天象}，箱子缝里透出一点白光，像有什么在里面呼吸。","她把最小的那只箱子推到你脚边，说这一箱不必送上岛，算是谢礼。可她也说了，若你答应送，就要送到素心殿的碑下，不能让第三个人知道。{人物}在船尾轻轻咳了一声，没有回头。"],"择":[{"名":"全数送上岛","文":"你花了三天把箱子一一抬上{地点}，最后一箱抬到碑下时，宫门里的人已经站了一排。为首的那个没让你走，却也没让你留，只问了一句「她还活着么」。你说活着。那人转身走了，第二天岛上撤了她的名字。","果":{"声望":10,"因果":-2,"道心":2,"灵石":60}},{"名":"只送小箱","文":"你把其余箱子推回水里，只抱着最小的一只走了。箱里是一枚{灵材}和一张旧丹方。老妇在你身后没有骂，也没有求，只是把船慢慢撑开。你回头看了两次，第三次的时候，雾把那条破船吞了。","果":{"灵材":2,"悟性":2,"因果":3,"道心":-2}},{"名":"劝她自己上岛","文":"你把船推回她的方向，说宫规再狠，也没有不许人跪到自己碑前的道理。她想了整整一夜，天亮时自己撑船上岛去了。三日后传出消息，戒律堂替她重议了旧案，她被罚在洗剑池边扫三年落叶，罪名抹了。","果":{"因果":-3,"声望":6,"修为":60,"道心":1}}]},{"id":"yunmeng_017","题":"水月台问心","类":"秘境","重":2,"域":["yunmeng"],"境界":[2,8],"段":["{地点}上没有水，只有一面悬在半空的镜子，据说是水月宫开宗祖师留下的第一面水月镜。凡入此台者，都要先过一关：镜会问你一句最不该问的话，你答什么，镜就照出什么。","{人物}带你上台时，镜面正映着{天象}。她退到台下，说你只有一炷香的时间，香尽未答，镜便会把你的影子扣下来自己用。她说完这句，台下就再没有声音了。","镜中浮出一行字，只有一句：「你修行，是为了不死，还是为了让谁看着你活着。」香已经在烧了。{器物}在台下亮了一亮，又暗回去。"],"择":[{"名":"答为不死","文":"镜面平静下去，映出你打坐的样子，只是镜中人影的头发白得比你快。台上传来一声钟响，你的识海里多出一部残缺的{功法}残篇，字迹极冷。自那日起，你对寿数的感觉比别人清楚得多。","果":{"修为":320,"悟性":5,"道心":-1}},{"名":"答为有人看","文":"镜面荡起细纹，很久才静下来。镜中映着的不是你，而是一间旧屋、一盏灯、一个背对门坐着的人。你尚未看清，镜便暗了。下台时{人物}看了你一眼，说你答得不对，但这一关算过了。","果":{"道心":4,"悟性":3,"修为":120,"因果":1}},{"名":"答不为不答","文":"你不答，反问镜中：「你照了这么多人，可曾见过自己？」镜面炸成一片白光，台下的香断成两截。你再睁眼时已躺在滩上，镜不见了，手里却攥着一片极冷的碎镜，割破了掌心。","果":{"修为":400,"悟性":5,"气血":-50,"魔念":2}}]},{"id":"yunmeng_018","题":"九曲迷航","类":"灾祸","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}素有九曲回肠之名，水面宽窄不一，拐了九次才通到{地点}。船家说这条道有九成会走岔，走岔了便不是迷路，是被泽留下了。他说这话时，船正拐进第七道弯。","{天象}，前后都看不见岸，水面安静得听不见桨声。船家忽然停了手，说桨划下去没有回音，这不是水。他回头看你，眼里全是慌。你顺着他的目光看下去，船底下的水面之下，有一整座村子，屋顶、街道、晾着的衣裳，都清清楚楚。","船还在缓慢地斜过去。你有两种法子：把随身的重物全扔下去减轻船身，或是顺着水流，跟着这座水下村子走完这一程。{天象}，水面又低了一寸，那道水下的街反而更清楚了。"],"择":[{"名":"弃物减重","文":"你把包袱、法器、连同一匣{灵材}全数扔进水里。船身微微一提，撑篙的手感回来了。你们一路撑出九曲，天亮时靠上{地点}，船家跪在船头磕头。你身上的东西所剩无几，只剩一条命和满脑子水声。","果":{"灵石":-80,"器物":-1,"修为":100,"气血":-20}},{"名":"顺村而行","文":"你收了桨，任船顺着水流漂。水下的村子从船底缓缓过，你看见最后一间屋的门开着，门口站着一个朝你挥手的小孩。水面忽然一亮，你们已经漂出九曲，船头搁在沙上，桨还在，人还在，只是船上多了半船清水。","果":{"修为":180,"悟性":3,"因果":1,"寿元":-5}},{"名":"下水看村","文":"你脱了外袍跳下水去，那座村子距离水面只有三尺。你摸到第一间屋的窗，窗里坐着一家人，都抬着头看你。你只来得及摸走桌上的一只{器物}，就被一股力道顶出水面，之后三日在船上做同一个梦。","果":{"器物":1,"修为":220,"气血":-40,"魔念":1}}]},{"id":"yunmeng_019","题":"磨剑僮的剑","类":"人情","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}上最年轻的弟子只有十四岁，是个磨剑的僮子，一天要磨七柄剑，磨到指节全裂。他偷偷在洗剑池边藏了一柄自己攒铁打的剑胚，见你来了也不藏，只问你：这样的铁，能杀得了人么。","你接过那柄剑胚，粗得连刃都没开出来，握在手里却意外地沉。{天象}，池水照出他瘦得只剩骨架的影子。他说崖上三十个人，二十七个年纪比他大，可等到那二十七个都死了，崖上就只剩他一个会磨剑的了——他得先有一柄自己的剑。","他把磨石推到你面前，说他不要人教他剑法，只求有人告诉他：这柄剑胚，该不该再打下去。{人物}在崖上远远望着这边，没有下来，也没有喊。"],"择":[{"名":"替他开刃","文":"你把剑胚按在磨石上，一整夜把它开出了刃口。天亮时你的手掌裂了三道，他的眼睛却亮得吓人。三年后你再来{地点}，崖上多了一个会使剑的年轻人，第一式使得极丑，可谁也接不住。","果":{"声望":8,"悟性":3,"气血":-20,"因果":-1}},{"名":"劝他收手","文":"你把剑胚折了，说剑派已没了，不必再拿自己的骨头去填。他没有哭，也没有争，只把两截断铁收进怀里。你走的时候他还在磨石边坐着。十年后有人在万里之外见过他，摆一个卖鱼的摊子，从不与人动手。","果":{"道心":3,"因果":2,"修为":40,"声望":-2}},{"名":"教他一式","文":"你没有碰那柄剑胚，只在池边比了一个起手式，是{功法}里的第一式。他照着比了一遍，剑胚撞在石上崩了个口。你说能崩口就是能打，往下练。他把磨石收起来，从此每天只磨这一柄。","果":{"悟性":5,"声望":6,"修为":120}}]},{"id":"yunmeng_020","题":"鲛歌引航","类":"奇闻","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}是泽与深水交界的地方，两岸的渔家都说，走这一段水道若听见歌声，就顺着歌声走，绝不会撞礁。可也有一句话在后头：顺着歌声走的人，多半会忘记自己要上岸做什么。","你夜里过这一段，果然听见了歌。歌声不高，像有人在很远的地方用湿手拨弦。{天象}，水面上浮起许多细小的光点，一路排开，正指向{地点}的方向。你船头的{器物}忽然亮起来，光与那些点一模一样。","歌声在你耳边绕了三圈，随后转向一条更窄的水道。那条水道不在任何一张图上。{器物}的光跟着偏过去，像是早就认得那个方向。"],"择":[{"名":"依歌而行","文":"你把船头调向那条窄水道。歌声一直在前面，不远不近，水面上的光点替你照亮了两侧的礁石。天亮时船停在{地点}，你在船底发现半船的碎蚌壳，光点不见了，歌声也停了，只有那一段调子留在脑子里，再也忘不掉。","果":{"修为":150,"悟性":3,"灵材":1,"因果":1}},{"名":"闭耳走原路","文":"你撕了衣袖塞住耳朵，咬着牙把船撑回图上标好的水道。歌声被堵在外面，你却觉得船底一直在被人轻轻推。三日后你上了岸，人瘦了一圈，桨断了一支，可该到的地方也到了。","果":{"修为":60,"气血":-25,"道心":2,"灵石":-20}},{"名":"还它一支曲","文":"你没走，坐在船头把小时候听过的渔调哼了一遍，调子跑得厉害。歌声停了片刻，随即有一阵极轻的笑。水面上的光点排成一条更宽的道，直通{地点}。那夜之后你每逢上船，水面都会替你分开一条路。","果":{"悟性":4,"声望":4,"修为":120,"灵材":1}}]},{"id":"yunmeng_021","题":"古钟渊底","类":"秘境","重":1,"域":["yunmeng"],"境界":[3,9],"段":["{地点}是云梦泽最深的一处，水面平得像一块磨过的镜子，扔石头下去听不见声。{人物}说渊底沉着一口比岛还大的钟，钟里关着一样东西，那东西每百年敲一次钟，只是想让人知道它还活着。","你以{功法}护住周身，一点点潜下去。水色从青转黑，到第十八丈时，脚下出现了青铜的纹路，一直延伸到视野之外。{天象}，水下没有风，可你听见了风。钟壁上刻满了名字，最上面一个是五百年前的宫主。","钟壁有一道极细的裂缝，缝里透出暖光。你可以把手探进去，也可以现在上浮。上浮还有一半气，探进去，就不知道要多久才能再见到水面。{天象}，水底的风声又起了一阵，钟壁上的名字一个个亮起来。"],"择":[{"名":"探手入缝","文":"你把手伸进去，指尖触到一团温热的东西，那东西动了动，像被谁握住了手。一股极古老的灵力顺着经脉灌上来，你的修为当场跳了一阶。可你浮出水面时，天已经黑了，你在水下待了整整九个时辰。","果":{"修为":1200,"悟性":5,"寿元":-30,"魔念":2}},{"名":"记名而上","文":"你没有碰那道缝，只在钟壁上找了空处，用剑气刻下自己的名字，然后上浮。上浮那天之后，云梦泽多了一条传言：渊底那口钟上，添了一个新名字。有人在暗处记下了你，也有人开始躲你。","果":{"声望":12,"悟性":3,"修为":400,"因果":2}},{"名":"敲钟一记","文":"你运足了灵力，在钟身上敲了一记。声音在水里散得极慢，你被震得七窍溢血，浮上来后整整三日说不出话。可那一记之后，泽上所有沉船的守灵骸都安静了半年，渔家的孩子再没丢过。","果":{"气血":-80,"声望":15,"修为":600,"因果":-2}}]},{"id":"yunmeng_022","题":"万宝阁收货","类":"市井","重":4,"域":["yunmeng"],"境界":[0,6],"段":["万宝阁在{地点}设了个收货的棚子，一年只来一个月，收的是泽里的{灵材}与沉船货。管事的{人物}坐得极稳，眼皮都不抬，只把手伸出来，让你把东西放在桌上，然后报一个数。","你放下一枚沉船里摸出的墨玉。他的手停在半空，抬眼看你，随即又低下去，说这玉来路不对，是宫里的东西，他不敢收。{天象}，棚子外的水面传来一阵极响的落水声，像是有人在跳水。","管事把玉推回来，压低声音说：要么你把它交给我，我替你消掉来历；要么你自己留着，等宫里查到你门上。{人物}在棚外站着没走，像是也听见了那一句。"],"择":[{"名":"交他销账","文":"他把玉收进袖里，从柜下摸出一百五十块灵石推过来，另外多给了一枚小牌，说凭牌可在九州任何一间万宝阁赊一次账。你走出棚子时，水面已经恢复平静，跳水的人不见了，灵石却很实在。","果":{"灵石":150,"器物":1,"因果":1,"道心":-1}},{"名":"带回自留","文":"你把玉重新收进怀里。管事笑了笑，没有再劝，只在你出门时补了一句「三个月内会有人问起」。那三个月你过得极不安稳，可三个月之后，你在玉里炼出了一缕极纯的水气，修为反而涨了一截。","果":{"修为":200,"悟性":3,"因果":2,"灵材":1}},{"名":"当众交官","文":"你把玉放到棚外的长桌上，高声说这是沉船里摸出来的，来历不明，请宫里的执灯弟子来认。围观的人散了一半。后来宫里来了人，把玉收走，还了你一句「有心」。管事再没同你说过话。","果":{"声望":10,"灵石":-20,"道心":3,"因果":-2}}]},{"id":"yunmeng_023","题":"洗剑池水寒","类":"修行","重":3,"域":["yunmeng"],"境界":[1,5],"段":["{地点}是听涛崖顶的一汪活水，池底铺着从沉舟滩运来的铁砂，水色常年在灰与黑之间。守崖的{人物}说，沧浪派养剑从不磨锋，只在池水里泡，泡得住的人剑才留得住。","你依言把随身的剑浸进池里，水立刻凉得像要钻进骨头。{天象}，池面上浮起一层薄雾，雾里能看见许多柄剑的影子插在水底，都是这些年来没能泡住的。你的剑在手里轻轻挣了一下，像要自己下去。","守崖人说，泡剑三日，剑会认主；泡剑七日，人会认剑。你要泡多久，全凭自己掂量。{天象}，池面上的雾越来越厚，那些沉在水底的剑影一柄柄淡了下去。"],"择":[{"名":"泡足七日","文":"你在池边坐了七日，不吃不睡，手一直浸在水里。第七日剑尖上浮出一线极细的白光，剑身忽然轻了。你睁眼时守崖人正蹲在旁边，说你成了一个铸剑的人，也成了一个被铸进去的人，剑与你从此分不开了。","果":{"修为":300,"悟性":4,"器物":1,"寿元":-10}},{"名":"三日便起","文":"第三日你把剑提出水面，剑身已泛出一层青光。守崖人说你心够狠也够稳，知道什么时候该停。你把剑擦干，剑上从此带着一点点化不开的凉，出手时那一线凉意往往比剑本身更快。","果":{"修为":180,"悟性":2,"器物":1}},{"名":"以血温池","文":"你把腕子割了一道，血滴进池里，池水忽然翻起一层暖气。剑在水中颤了整整一夜，第二日提起来时锋利得连光都能切开。守崖人脸色不太好看，说这法子当年也有人用过，那人后来连自己也一起泡了进去。","果":{"修为":400,"气血":-60,"魔念":2,"器物":1}}]},{"id":"yunmeng_024","题":"老妪守灵","类":"人情","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的堤上有一间没有门的屋子，屋里停着一口薄棺，棺前点着长明灯。守灵的{人物}已经七十六岁，替人守了五十年的灵，自己却没有一个亲人可以替她守。","她说棺里那人是个外乡的书生，五十年前从水里被捞上来，一直没醒也没有死，气息弱得像一片叶子。{天象}，屋里的灯芯忽然爆了一下，棺中传来极轻的一声咳。她的手一抖，五十年来第一次站了起来。","老妪转头看你，眼睛很亮，说：他要醒了。你若肯替我按住棺盖，我进去看看他；若不肯，我便一个人进去，可我这把骨头，怕是撑不住。{器物}的火苗一直在跳，把屋里的人影拉得忽长忽短。"],"择":[{"名":"按棺助她","文":"你双手压住棺盖，掌心能感觉到里面的震。老妪探身进去，说了很久的话，声音低得听不清。天亮时棺盖自动合上，她也靠在棺边睡了过去，脸上有一种很安静的松。三日后她走了，走时灯还亮着。","果":{"道心":4,"声望":5,"因果":-2,"悟性":2}},{"名":"开棺问因","文":"你把棺盖整个推开，棺里那人睁着眼，瞳孔里全是水。他抓着你的手问「船到了么」，问了三遍，然后手就软了。老妪在一旁站着，一直没出声，只把灯捻得更亮些。你替她守了后半夜。","果":{"修为":120,"悟性":3,"因果":1,"气血":-10}},{"名":"灭灯了事","文":"你伸手把长明灯按熄了，说五十年了，让他走吧。屋里立刻黑透，棺中的声音也停了。老妪在黑暗里坐了很久，然后低声说，谢谢你。第二日她请人把棺抬去埋了，自己在堤上坐到天黑。","果":{"因果":2,"道心":-1,"修为":80,"声望":3}}]},{"id":"yunmeng_025","题":"雾鸟报丧","类":"灾祸","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}的人最怕一种鸟，通体灰白，只有眼睛是红的，飞起来没有声音。{人物}说这鸟只在有人将要沉泽的时候出现，它落在哪条船的桅杆上，那条船上就有人回不去。","{天象}，那鸟落在了你这条船的桅上，一动不动地对着舱里看。船上还有个同行的{人物}，正低头数自己的灵石，数到第七块时忽然停了手。他抬头看见那鸟，脸色立刻变了，说你我不该同船。","鸟没有飞走，只是慢慢把头转了过来，看着你。船家已经把篙子收了，一动不动地等着你说话。{天象}，雾从水面上漫过来，把桅杆上的鸟影子罩得只剩一个轮廓。"],"择":[{"名":"靠岸放人","文":"你让船家靠岸，把那同伴推下船，说你走陆路。他不肯，骂了你一路。第三日传来消息，他走的那条陆道塌了半边，人没死，腿断了。你那夜靠岸的地方，后来立了一块很小的木牌，是船家替你立的。","果":{"道心":3,"因果":-2,"修为":60,"声望":3}},{"名":"驱鸟下桅","文":"你运起灵力朝桅杆上打出一道水箭。鸟不躲，被水打穿，散成一片灰白的雾。你的耳朵里立刻嗡了一声，接下来三日什么声音都听不见。那同伴平安上了岸，可你的右耳从此对水声格外敏感。","果":{"修为":160,"气血":-35,"悟性":2,"因果":1}},{"名":"留在船上","文":"你说不必躲，该沉的总要沉。船家听完，把篙子重新提起来，一句话也不再说。那一夜你们的船在雾里撞了三次礁，可三次都擦着过去了。天亮时鸟不见了，你和那同伴都还活着，只是互相看着，像看一个死人。","果":{"修为":200,"寿元":-12,"道心":2,"因果":2}}]},{"id":"yunmeng_026","题":"观月使夜巡","类":"宗门","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{人物}是水月宫夜巡的人，一身素白的{器物}，手里提一盏不燃自明的水月灯，每夜绕{地点}走一圈。她走路极轻，据说从来没有人能在她巡夜时偷上岛。","你这条船在雾里偏了航，正好撞在她巡到的地方。她站在水面上，裙角没有湿，灯火照过来时你整条船都亮得无所遁形。{天象}，她的脸在灯后看不清，只能看见一双极静的眼睛。","她说宫规只在岛上算数，泽里不算。可她今夜已经走了三圈，若第四圈再见你，就得按宫规办。她说完便转身，往岛的方向走了三步。{器物}的灯在雾里轻轻晃了一下。"],"择":[{"名":"立刻离开","文":"你把船掉头，借着她的灯往泽心撑。撑出一里地后回头看，那盏灯还立在水面上，一直没动。第二日你才听说，她那一夜在雾里站到了天亮，因为前三圈她都没看见你，第四圈她走得很慢。","果":{"修为":80,"道心":2,"声望":3}},{"名":"上前问路","文":"你把船撑到她面前，问她能不能指一条不绕远的水道。她沉默了一会儿，抬手往西指了一下。你顺着那条水道走了半夜，省下整整一日。她什么也没多要，只让你记住：路上若见到别人的船，也不要指路。","果":{"悟性":3,"修为":100,"因果":-1,"声望":2}},{"名":"借灯照路","文":"你趁机伸手去接一点灯光。灯没有烫手，可你掌心里落下了一层薄霜。她按住你的手腕，说这灯照的是心里的路，不是水上的路，你要照便照，照完了得把看见的东西忘掉一半。你忘了什么，自己也说不清。","果":{"悟性":5,"寿元":-10,"修为":180,"魔念":1}}]},{"id":"yunmeng_027","题":"藕花深处","类":"奇闻","重":2,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的藕花开得比别处早半月，花叶高过人头，船一进去就看不见岸。采莲的{人物}说，这一片藕花里有个吹笛子的姑娘，谁也没见过她的模样，只听见过笛声，听过的男人都忘了自己要采几分莲。","你的船被花茎拦住，退不出去了。笛声正是在这时候响起来的，极清、极缓，像是有人在很远处替你把心跳放慢了。{天象}，藕叶上凝的水珠随着笛声一颗一颗滚下来，落进船舱。","花丛深处浮出一截白衣的袖子，随即又沉下去。你可以应那笛声，也可以用力把船从花茎里撑出去。{天象}，藕叶上的水珠一起颤了一下。"],"择":[{"名":"应笛而入","文":"你顺着笛声往深处去，藕叶一重一重让开。最后一片叶子后面什么也没有，只有一支竹笛插在水面上。笛子取起来时温热，从此你在夜里吹它，水上会有人应你和声，声音总比你慢半拍。","果":{"器物":1,"悟性":3,"修为":150,"因果":1}},{"名":"撑船出去","文":"你握住篙子，一寸一寸把船从花茎间挤出来，藕叶划破了手背，血滴在水里。笛声一直没停，直到你的船出了花丛才断。采莲的人说你脸色难看，问你听见了什么。你说什么也没听见。","果":{"道心":3,"气血":-15,"修为":60}},{"名":"采莲不惊","文":"你不理那笛声，低头采莲，一朵、两朵，采满一筐便走，动作极轻，连一片叶子都没折断。出花丛时，那白衣袖子又浮了一下，这回像是点了点头。你的筐里所有莲蓬都多结了一粒。","果":{"灵材":2,"道心":2,"修为":80,"因果":-1}}]},{"id":"yunmeng_028","题":"沉船古墓","类":"秘境","重":2,"域":["yunmeng"],"境界":[2,8],"段":["{地点}底下有一艘不该在这里的船，它是被人从别处搬来沉下的，船身比寻常海船大三倍，船舱里却摆着棺。摸金的{人物}说，这是古时候某位大修的墓，他们把墓做成了船的样子，好让主人死在路上。","你从第三舱下去，舱里的水是温的，越往下越暗。第四舱中央摆着一口黑棺，棺上用朱砂画着{功法}里的符纹，纹路还在极缓慢地流动。{天象}，黑棺自己响了一声，像有人从里面翻了个身。","{人物}已经退到舱口，说这种棺不能开，开了要还的不是命，是运数。可棺盖上有一道缝，缝里塞着一卷东西，只露出一角。"],"择":[{"名":"抽卷不开棺","文":"你屏住呼吸，把那一角慢慢抽出来。是一卷极旧的帛，记着一门已经失传的水法。抽尽时棺盖纹路猛地一转，整艘船往下沉了三尺。你借着那股沉势撞开舱门，浮上去时耳朵里全是血气。","果":{"悟性":5,"修为":320,"气血":-40}},{"名":"推棺见主","文":"你把棺盖推开一线。棺中没有尸骨，只有一整套叠得极整齐的衣裳和一柄剑，剑柄朝着舱门。你取了剑，回头时{人物}已经不见了，舱口的门却关着。你在里面困了三天，出来时那艘船彻底塌了。","果":{"器物":1,"修为":450,"因果":3,"寿元":-20}},{"名":"封舱而归","文":"你没有动棺，退出来把舱门重新合上，还在门缝上压了一块石头。摸金客骂你傻。半年后这条水道被人四处开挖，只有你封过的那一格始终没被人打开，你的名字因此被记在了几本旧册子里。","果":{"道心":4,"声望":6,"因果":-2,"修为":100}}]},{"id":"yunmeng_029","题":"沧浪一脉","类":"宗门","重":2,"域":["yunmeng"],"境界":[2,8],"段":["{地点}现在只剩十七个人。守崖的{人物}把名册摊在石头上，一个个念过去，念到第十七个时停住，说这人与他有过一次争执，三十年没说话，如今人死了，话也没了。{天象}，崖上的浪一下一下拍着，像在替谁数数。","他说沧浪派当年有一门规矩：一脉单传，只传一人。可如今连一个能接的人都找不出——三十个人里，十七个是僮仆，十个连剑都提不稳。他抬眼看你，说若再没人接，这门派到这一代就断了。{天象}，崖风把他的衣角掀起来，又放下。","他把那本名册推到你面前，说接不接全在你一句话。接了，从此要守这座崖；不接，他明日便下山去，把剑都扔进泽里。{器物}压在名册上面，压得纸角起了褶。"],"择":[{"名":"接名册","文":"你把名册收进怀里。他跪下来磕了个头，起身时腰背忽然塌了，像卸了一副背了八十年的担子。你在崖上住了三年，教会了十一个人提剑，也送走了六个人。名册上的名字，一个一个被你划掉。","果":{"声望":15,"悟性":4,"修为":400,"因果":2}},{"名":"荐他人接","文":"你说自己担不起这一脉，但崖上那个磨剑的僮子担得起。他愣了很久，随即大笑，笑到咳嗽。那年冬天他亲自教那僮子第一式。离开崖时他送你到崖口，说了句「你比我懂这一脉」。","果":{"道心":4,"声望":10,"悟性":3,"因果":-1}},{"名":"劝他弃派","文":"你说门派早该散了，人比名分要紧。他听完没有动怒，只把名册合上，压在一块石头下面。第二天崖上的人走了大半，他自己留下扫地。三年后你再来，崖上只有一个扫地的老人，剑一柄也没少。","果":{"悟性":4,"声望":-5,"修为":150,"道心":1}}]},{"id":"yunmeng_030","题":"镜中十年后","类":"修行","重":2,"域":["yunmeng"],"境界":[1,7],"段":["{地点}的水面在无风的清晨会自己静下来，静到能照出十年之后的模样。{人物}说这不是吉兆也不是凶兆，只是一个机会：看见的人有的改了路，有的反而一头撞了进去。","天亮前你走到水边跪下去，水面果然先浮出你的脸，随后眉眼一点点变化——眼角多了一道纹，鬓边白了一绺，身上的衣裳换了样式。{天象}，水面上的影子抬手做了一个动作，是结印，印诀你看得清清楚楚。","影子结完印便不动了，只是看着你。水面开始起皱，再过一刻，它就什么也照不出来了。{天象}，水面上的光正一点一点暗下去。"],"择":[{"名":"记下印诀","文":"你把那个印诀一笔一笔刻进心里。水皱起来时你已记全。三年后你在一次生死关头想起来，照着结印，硬生生撑过了那一道劫。可你从此不敢再照那片水面，怕看见自己结的是另一个印。","果":{"悟性":7,"修为":260,"寿元":-8}},{"名":"问自己一句","文":"你对着水面问：「那时我可后悔？」影子没有回答，只是把手放下去了。水皱起来时，影子的眼角似乎有一点点湿。你在岸边坐到日头高起，心里那口一直悬着的气，忽然落回了原处。","果":{"道心":5,"悟性":2,"修为":100}},{"名":"击水碎影","文":"你伸手把水面打碎。影子裂成几十块，每一块里都在做不同的动作。水面重新合上时，已经照不出任何东西了。你不知道这是不是好事，只知道从此再也不必赶着去成为某个人。","果":{"道心":3,"悟性":4,"因果":2,"修为":140}}]},{"id":"yunmeng_031","题":"芦荡吊死鬼","类":"灾祸","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}的芦苇长得比人高，割苇的{人物}说，进荡之前要在船头系一根红布，若红布自己解了，就得马上出来。他说十年前有个采苇人没听，后来人们找到他时，他吊在一根苇杆上，那根苇杆还没有手指粗。","{天象}，你的红布忽然松了，飘进芦花里。船停在原地不动，前面三尺处的水面上，悬着一双赤脚，脚踝上有一圈勒痕。再往上看，却只有芦花。","你可以割断那一丛芦苇，也可以把船退出去，哪怕退得极慢。{妖异}还悬在水面上方，赤脚一动不动。"],"择":[{"名":"割苇断事","文":"你拔刀横割，一整丛芦苇齐齐倒下，那双脚也随之落下，溅起一小片水花，随即什么也没有了。你的刀口上留着一道灰印，擦了很多次都擦不掉。此后每次进芦荡，那一带的苇子都会自己让开一条道。","果":{"修为":180,"气血":-20,"因果":2,"悟性":2}},{"名":"缓退而出","文":"你把桨压得极轻，一寸一寸往后挪，眼睛一直盯着那双脚。退到红布的碎片边上时，脚不见了。你捡起红布重新系好，出了芦荡才发现自己后背全湿。割苇人什么也没问，只多给了你半筐苇子。","果":{"道心":3,"修为":70,"灵石":20}},{"名":"问他姓名","文":"你抬头问：「你叫什么。」芦花里静了很久，然后有个很闷的声音报了一个名字。你把这个名字带出芦荡，交给了割苇人。那年冬天村里给他立了一块牌位，芦荡里再没吊过人。","果":{"声望":8,"因果":-3,"修为":100,"道心":2}}]},{"id":"yunmeng_032","题":"落月湾立约","类":"争斗","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{地点}的湾口只有一条能过货船的水道，水月宫与沧浪派为这条道吵了两百年。宫里说要清静，剑派说要活路，两家都不肯先让，于是每年在湾口立一次约，约立在月亮最圆的那夜。","今年立约的日子，{人物}与{人物}都到了，两边的船隔着三丈停住，谁也不肯先开口。{天象}，湾里的水静得照见人影。你被两家请来做见证，因为你是唯一一个两家都欠人情的散修。","宫里要的是从今夜起封三年水道；剑派要的是许他们每月走一趟货船。两份约书都摆在船板上，等你落笔。{器物}横在约书中间，压着一角。"],"择":[{"名":"判归剑派","文":"你在剑派那份约书上落了笔。宫里的执灯弟子一言不发，撤灯便走。那年冬天剑派靠这条道撑了下来，三十个人没再少过。而水月宫从此把你在岛上的名字划了，五年之内不许登岛。","果":{"声望":8,"灵石":100,"因果":-2,"道心":-1}},{"名":"判归宫内","文":"你在宫里那份约书上落了笔。守崖人看着你，看了很久，最终把剑收回鞘里，什么也没说。那条水道封了三年，剑派的日子过得更紧。三年后你再去{地点}，崖上的人换了一茬，认不出你。","果":{"声望":8,"灵石":100,"因果":2,"道心":1}},{"名":"两约皆毁","文":"你把两份约书一并扫进水里，说这条水道谁也别占，往后按日子轮着走。两家都愣住了，随即一个冷笑、一个摇头。可那一夜之后，湾口真的按日子排了起来，虽然不是因为你，而是因为谁也没法再压过谁。","果":{"道心":4,"声望":12,"因果":-1,"修为":120}}]},{"id":"yunmeng_033","题":"菖蒲花毒","类":"灾祸","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的人春末采九节菖蒲，取的是根，不要花。花有毒，闻久了人会笑，笑着笑着就记不起自己昨天做过什么。收药的老{人物}每年这个时候都要拦人，可总有人贪那一味花香。","你在荡里过夜，睡到半夜被一阵甜香熏醒。{天象}，水面上一层白花，都是被风吹落的菖蒲花。你身边的船家已经坐了起来，脸上在笑，笑得整张脸都变形了，嘴里反复念着一个名字。","药篓里还剩半壶芦根蜜。蜜能解一部分毒，可若是全给了船家，你自己就要另想法子。{天象}，那股甜香又浓了几分，水面上的白花越浮越多。"],"择":[{"名":"蜜尽予人","文":"你把整壶芦根蜜灌进船家嘴里，又用绳子把他绑在桅杆上。天亮时他醒来，什么也不记得，只是一个劲地哭。你自己在水里泡了半个时辰才醒神，此后闻到菖蒲花的甜香，胃里就翻。","果":{"道心":4,"气血":-30,"声望":5,"修为":60}},{"名":"分蜜而饮","文":"你把蜜分成两份，一人一半。船家醒了，你也醒了，可两人的脑子都像糊了一层薄雾，接下来的三日里认错过三次方向。好处是你们都还认得出彼此的脸，这一点比方向要紧。","果":{"气血":-15,"修为":100,"悟性":1,"道心":2}},{"名":"弃船独走","文":"你抓起罗盘跳下水，往最近的一块沙洲游。身后船家的笑声一直追着你，笑了很久才停。三天后有人把那条船拖上了岸，船上没有人，只有一舱的菖蒲花和一圈系得极整齐的绳子。","果":{"道心":-2,"因果":3,"修为":150,"气血":-20}}]},{"id":"yunmeng_034","题":"镜心石","类":"机缘","重":2,"域":["yunmeng"],"境界":[2,7],"段":["{地点}有一处叫蚌母滩的浅水，每逢退潮会露出成片的石壳。当地人说这些石壳里偶尔生着镜心石，通体透明，指甲大小，是水月宫炼镜的根料，一颗值三百灵石。","你在滩上找了半日，{天象}，潮水开始回头。就在你要走的时候，脚下一块石壳里透出一点光。你把它掰开，里面卧着一颗{灵材}，比宫里的成色还要好。可你抬头时，滩对面站着一个{人物}，正看着你手里的东西。","她走过来，说这块滩归水月宫，石也归水月宫，但她可以不追究，只要你把石头交出来，或者拿别的东西换。她把手伸出来，掌心朝上，等着。{天象}，潮水已经漫到脚踝，凉得像一圈铁。"],"择":[{"名":"原物奉还","文":"你把镜心石放进她掌心。她收回手，另外从袖里摸出一张薄笺递给你，上头写着半篇{功法}的起手口诀，说是宫里给「还石之人」的谢礼。原来这条规矩一直都在，只是很少有人肯还。","果":{"悟性":4,"声望":8,"因果":-2}},{"名":"以物相换","文":"你摸出一枚沉船里得的墨玉递过去。她掂了掂，点头换走。镜心石留在你手里，后来被炼成了一面小镜，照人时能映出对面之人的真实家数。那面镜子救过你一次，也害你得罪过一个人。","果":{"灵石":-120,"器物":1,"修为":200,"因果":1}},{"名":"转身即走","文":"你把石头攥紧，转身就往岸上走。她没有追，也没有喊，只是在你背后说了一句「三日之内送回，还来得及」。第三日夜里你的船底漏了一个洞，一块礁石正正划开船板，那石头在那一刻自己碎了。","果":{"灵石":300,"因果":4,"道心":-3,"气血":-30}}]},{"id":"yunmeng_035","题":"南泽马帮","类":"市井","重":4,"域":["yunmeng"],"境界":[0,3],"段":["云梦泽东岸的旱路上有一队马帮，专走{地点}到{地点}这一段，运的是泽里的藕、药，还有不便明说的东西。领队的{人物}脾气极硬，说走这条道三十年，只丢过一次货。","你跟着走了两日，第三日清早发现少了一匹马和一个箱。前头是{地点}的岔口，岔口左边是官道，右边是{地点}的小路。{天象}，路面上有一串刚踩出的蹄印，往右边去了。","领队把刀抽出来又插回去，说你若肯跟他往右追，追回来的货分你三成；若不肯，就到岔口分手，各走各的。{天象}，路面上那串蹄印正被风一点点抹平。"],"择":[{"名":"随之追货","文":"你们顺着蹄印追进小路，在苇子后面堵住了那匹马。偷货的是帮里最年轻的一个，跪在地上直发抖。领队问你怎么处置，你说逐出去就是了，不必见血。那三分货换成了六十块灵石和一袋治伤的药。","果":{"灵石":60,"声望":6,"灵材":1,"因果":-1}},{"名":"独自上岔口","文":"你在岔口跟他们分了手，走了官道。三日后你听说那队人没能追回来，死了两个，货也没找着。你走的那条官道倒是太平，只是在{地点}歇脚时，听见有人提起那个领队的名字，用的是过去的口吻。","果":{"修为":60,"道心":2,"因果":1}},{"名":"夜里先候","文":"你没有跟去，提前绕到小路的尽头等着。半夜那匹马果然来了，马上的人换了装束。你没有动手，只把他的脸看清楚了。回到帮里说出这个名字，领队沉默很久，说这是他自己的侄子。","果":{"灵石":90,"悟性":3,"声望":8,"因果":2}}]},{"id":"yunmeng_036","题":"旧宫半页规","类":"机缘","重":2,"域":["yunmeng"],"境界":[2,8],"段":["{地点}在泽底，是水月宫迁到镜心岛之前的老宫，如今只剩一列石柱和几面半沉的墙。摸船的{人物}说那里没人管，可他从不下去，因为下去的人总有几天回不来。","你潜到底，石柱之间还留着旧时的地砖，砖上刻满了字。第三根柱子下面压着半页纸，纸早该烂尽，却因为压着一块{器物}，居然还完整。上面写的是宫规的外篇，第一条便与今日宫规相悖：男子可入宫，但须以水镜照心。","{天象}，水下的墙忽然动了一下，柱上的字一个个暗下去。那半页纸在你手里微微一烫，像是要你选：带走它，还是把它按回柱子底下。"],"择":[{"名":"带走半页","文":"你把纸收进贴身的油布包里，上浮时水色一路变红，像是整座旧宫都在看你。回到岸上摊开，纸上的字迹仍在。你没有把它交给任何人，只在素心殿的碑前坐了一夜，看那第一条规，看到天亮。","果":{"悟性":5,"修为":300,"因果":2,"声望":3}},{"名":"按回原处","文":"你把那半页纸重新压回柱下，还用碎石压牢。水下的墙不再动了，柱上的字慢慢亮回来。你浮出水面时只觉得头脑极清，此后修习{功法}再也遇不到滞涩。有些东西留在原处，比带在身上有用。","果":{"道心":4,"悟性":3,"修为":200,"因果":-2}},{"名":"拓下全文","文":"你用随身的墨把半页纸拓了两份，一份带走，一份留在原处。你以为这样两头都不亏。可往回走时你发现自己拓下来的两份不一样，留在柱子下那一份多出一行字，写的是「抄者留名」。","果":{"悟性":4,"修为":260,"因果":3,"灵石":80}}]},{"id":"yunmeng_037","题":"剑派没了","类":"宗门","重":2,"域":["yunmeng"],"境界":[3,9],"段":["你再到{地点}时，崖上没有人了。三百柄剑还插在原地，剑柄上的缠布被雨打得烂尽，露出黑的木。崖下新起了一排草棚，是替人修船的，棚主说崖上最后一个人是去年冬天走的，走时把门锁了，钥匙扔进了海里。","{天象}，崖顶传来极轻的一声剑鸣。你上去看，三百柄剑里有一柄自己动了一下。它不在最上面，也不是最长的，剑身上结着一层白霜。{器物}说过的那个名字，正刻在它的柄尾。","那把剑只认一个人，而那个人已经死了。你可以拔它，也可以替它寻一个新的主人。{天象}，崖下那排草棚的灯还亮着，一盏一盏，像有人在等谁回去。"],"择":[{"名":"拔剑自立","文":"你把剑拔出来，霜从剑身漫到你的手臂，一路冻到肩。自那日起你对外说自己是沧浪派，虽然崖上一个人也没有，虽然这一派连名册都不知丢在哪里。有人笑你，可没人敢在你面前笑第二次。","果":{"器物":1,"修为":700,"声望":15,"因果":2}},{"名":"封崖立碑","文":"你没有拔剑，只在崖顶立了一块石碑，把名册上那十七个名字刻上去，一个也没漏。刻完最后一个是半夜，你听见崖下浪声停了一瞬。这派从此真的没了，但也没人再说它是断的。","果":{"声望":18,"道心":5,"因果":-3,"修为":300}},{"名":"寻人授剑","文":"你把那柄剑连鞘带布一起带下崖，找了七年，最后在一处海边渔村交给了一个十六岁的少年。他接剑时手抖得厉害，你却觉得那抖得正好。你只教了他起手，没有教收式——这一派从来都是自己找收式。","果":{"道心":4,"声望":12,"悟性":3,"修为":400}}]},{"id":"yunmeng_038","题":"月华引小成","类":"修行","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{功法}是要在月下练的，练的是引月光入体，再以水为镜把光收在丹田。你在{地点}练了三个月，始终差一线：光进来便散，散得比进来的还快。教你的{人物}说这不是功法不对，是心不定。","{天象}，湖面上一整片月光被风推得晃。她让你今夜别练，只坐着看月亮。你坐到后半夜，忽然发现月光并不是照在水上，而是从水里往上照。那一刻你才明白，这门功法要引的不是天上的月，是水里的月。","她递来一碗{灵材}，说喝了便能通宵不困。喝与不喝，都不妨碍你想通，只是今夜你说不定只此一次。"],"择":[{"名":"饮露通宵","文":"你一口饮尽，整夜没有一丝困意。天亮前那门功夫终于走通了一个周天，你的经脉里像卧着一小片湖。代价是之后七日不能合眼，闭上眼就看见水面，一看见水面就要往下沉。","果":{"修为":350,"悟性":5,"气血":-40}},{"名":"推碗不饮","文":"你把碗推回去，说你怕靠外物走通的路。她笑了笑，把碗自己喝了。你们坐到天亮，你把水里那轮月看进了心里，功夫没大成，可那半线，从此再也没有退回去过。","果":{"道心":4,"悟性":3,"修为":220}},{"名":"反照其师","文":"你把碗端起来，却先递还给她，说你可能更需要。她愣了一下，随即接过喝了。那一夜她的功力破了一层，第二日便下山去了，临走留给你一句话：你这一让，将来会有人还你。","果":{"声望":8,"道心":3,"因果":-2,"悟性":2}}]},{"id":"yunmeng_039","题":"替人背因果","类":"灾祸","重":2,"域":["yunmeng"],"境界":[1,6],"段":["{地点}的渡口有个规矩：船钱可以先欠，欠的人要在渡口的木板上刻一个名字，等有钱了再划掉。木板上的名字有一半是划不掉的。你说不上来为什么，划不掉的那些名字，底下都刻着一道细痕。","一个{人物}拉住你，说他欠了三十块灵石，明日就要离泽，求你替他付了。他指给你看那块木板，他的名字在第三行。{天象}，木板边缘的水痕正一点点往上爬，爬过的地方，名字就淡了。","三十块灵石不多。可那个名字底下的细痕，怎么看都不像是刀刻的。{器物}在渡口的木桩上晃了一下，撞出很闷的一声。"],"择":[{"名":"替他付船钱","文":"你把三十块灵石按在渡口的老木匣里。那人千恩万谢地走了。三个月后你在别处遇见他，他已经认不出你，只说自己这几个月做什么都不顺。你低头看自己的手，掌心浮出一圈极淡的水纹。","果":{"灵石":-30,"因果":3,"道心":-1,"修为":80}},{"名":"问他细痕","文":"你没有付钱，只问他那道细痕是什么。他的脸一下白了，转身就走。你在渡口守了两日，等来的是另一条船上的消息：他在半途落水，人捞上来了，可他的话没人听得懂，一直在说「还差三十」。","果":{"修为":60,"悟性":3,"因果":1,"道心":1}},{"名":"划掉己名","文":"你替自己在木板上刻了一个名字，又当面划掉，把三十块灵石按在匣里做押。渡口的老翁看了你很久，说这法子三百年只有两个人用过，一个死了，一个成了渡口的主人。他问你愿不愿意接这摊子。","果":{"灵石":-30,"声望":8,"因果":-2,"修为":120}}]},{"id":"yunmeng_040","题":"空船自归","类":"奇闻","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}的渔家都有这样的经验：出泽若遇上大雾，把船头调回来，船会自己找到岸。这里的船似乎比人更认路。{人物}说这不是船聪明，是水底下的东西在推，推得多了，它也就记住了每一条船该回哪一处。","你借来的一条小船在雾里漂了一夜，第二天清早自己靠回了渡口，船上一人未少。只是船舱里多了一层浅浅的水，水里浮着几片{灵材}。你问船家，他说自己没有采过，也从没在这一带见过这种莲。","{天象}，渡口的水面下浮起一串气泡，像是有人在水底换了口气。船家把桨收进舱里，让你别出声。"],"择":[{"名":"捞莲带归","文":"你把那几片莲叶捞起来，包进油纸。回到岸上一看，叶背生着细密的字，是一门被人写在水上的功法残篇。你把它们一页页抄下来晒干，此后修习顺了不少，只是每逢大雾天，总觉得有人在你耳边换气。","果":{"悟性":5,"灵材":1,"修为":150,"魔念":1}},{"名":"还莲入水","文":"你把莲叶一片片放回水里，看着它们沉下去。水面安静了一瞬，随即漾开一个极浅的圈。船家这才开口，说你做得对，这船每回带上来的东西都不该带上岸。那年这条船再没出过事。","果":{"道心":3,"因果":-2,"修为":80,"声望":3}},{"名":"问船所自来","文":"你蹲在船头，对着水底问了一句「你们是谁的船」。气泡停了。船家脸色难看地把你拽起来，说这条船本就是捡来的，三十年前从{地点}漂来，船上没有人。那日之后你每次上船，船都会先轻轻晃一下。","果":{"悟性":4,"因果":1,"修为":100,"寿元":-6}}]},{"id":"yunmeng_041","题":"泽中巨鳖","类":"争斗","重":2,"域":["yunmeng"],"境界":[2,7],"段":["{地点}边上有一块会动的洲，方圆半里，上面长了草也落了鸟。{人物}说那不是洲，是{妖异}的背，它三百年才浮上来一次换气，浮一次要三个月。他说这话时，那块洲正在慢慢地、几乎察觉不到地换了位置。","你划船过去，在它背上下了一网{灵材}。网还没收，脚下的草就开始陷。水面像被什么东西从底下顶了一下，整块洲缓缓抬升，露出青黑色的甲脊，上面生着厚厚一层苔。{天象}，水面上浮起一大片浑浊的白气。","它没有看你，只是很慢地把头掉过来。你可以趁它还没完全翻身时跳下水，也可以站在它背上等它转完。{妖异}的甲脊还在往上抬，草与土一层层往两边塌。"],"择":[{"名":"立刻跳船","文":"你扔下网跳进水里，拼命往外游。身后的水面轰地一响，那道影子整个翻了过来，掀起的浪把你推出去很远。你爬上岸时浑身是泥，网没捞着，可网上的那些灵材，第二天竟然都浮在了岸边。","果":{"气血":-25,"灵材":1,"修为":80,"道心":1}},{"名":"立背不动","文":"你站在原处，任它翻身。它转到一半忽然停了，大概是觉得背上这个人不慌，不必理会。你在甲脊上一直站到它重新沉下去，脚下踩着的地方留下一圈很深的苔痕，那几枚灵材就嵌在痕里。","果":{"修为":260,"灵材":2,"悟性":3,"道心":2}},{"名":"刺甲取珠","文":"你运起灵力往甲脊上刺了一剑。剑只入了半分，却引出一声极低的鸣，像钟被敲了一下。你被弹飞出去，摔在水里，怀里多了一枚温热的珠子。而那块洲从此沉了下去，再没有浮起来过。","果":{"灵材":3,"气血":-50,"因果":3,"修为":200}}]},{"id":"yunmeng_042","题":"素心殿旧碑","类":"秘境","重":1,"域":["yunmeng"],"境界":[4,10],"段":["{地点}的地基比宫墙低了七丈，据说是当年沉泽时留下来的。水月宫的历代宫主都埋在这里，每人的名讳刻在一块方碑上，碑面朝下嵌在地里，谁也看不见字。只有宫主本人能够翻碑。","你随着一位{人物}下到地基，她已在这宫里守了四十年，境界高得看不出深浅。她说自己这一生只翻过一次碑，翻的是她师父的，碑底下的字让她哭了半夜。{天象}，地底的积水映着灯火，像一条竖起来的河。","她走到第九块碑前停下，说这一块是三百年前那位写下宫规第一条的宫主。她问你：要不要翻。翻了，你便能看见一个答案；不翻，你还能保留一个说法。{器物}在地底的积水里照着，光被水揉得很碎。"],"择":[{"名":"翻碑看字","文":"你们合力把碑翻过来。碑底只刻着四个字：我亦不能。那位宫主用一生立下的规矩，自己也没能做到。你站在碑前很久，忽然明白为什么水月宫三百年来从不解释这条规——解释不了。","果":{"悟性":8,"道心":3,"修为":900,"因果":2}},{"名":"按碑不翻","文":"你把手按在碑上，没有翻。她看着你，忽然笑了，说你比她聪明。那夜她在灯下跟你讲了半宿宫里的旧事，讲到后来声音低了，只剩下水声。临走时她给了你一枚极旧的令牌，可通岛上所有门。","果":{"声望":10,"悟性":4,"器物":1,"修为":400}},{"名":"另刻一字","文":"你翻过碑，看完那四个字，从袖里取出小刀，在旁边补了一句「后人可改」。她没有阻拦，只是闭了闭眼。第二日素心殿议事，第一条宫规被添了一行小字：送信者可活。三百年的死规，从此有了一道缝。","果":{"声望":20,"因果":-5,"道心":5,"修为":600}}]},{"id":"yunmeng_043","题":"鲛人语者","类":"奇闻","重":2,"域":["yunmeng"],"境界":[2,8],"段":["{地点}的水下有鲛人立国，与人立过旧约：人不上鲛渊，鲛不出深海。可总有例外。{人物}说二十年前有个鲛人上了岸，学了人话，如今在泽上替两边传话，谁都能找他，谁都不肯认他。","你在一处浅滩见到他时，他正坐在水里，只露出上半身，颈侧有一道没能完全褪净的鳞。他说自己听得懂人心里那句没说出口的话，所以很少有人愿意同他久坐。{天象}，他说话时水面一直没起波纹。","他问你，有没有什么话是想说却说不出口的。他说他可以替你带下去，带到鲛渊，交给该听的人——只是带下去的话，就再也不会回来了。{天象}，浅滩上的水纹终于动了一下，又平回去。"],"择":[{"名":"托他带话","文":"你把那句压了很多年的话说给他听。他听完点了点头，什么也没复述，只把手按在水上，水纹往外扩了一圈便平了。自那日起你心里那块一直沉着的东西轻了，虽然你从此再也想不起那句话的完整样子。","果":{"道心":5,"因果":-2,"修为":120,"寿元":-5}},{"名":"只问他名","文":"你问他叫什么。他愣了一下，说上岸二十年，这还是第一次有人问。他报了一个很长的、带着水音的名字，你跟着念了一遍，念得极难听。他笑得肩膀直抖，说往后你在泽上遇见事，可以喊这个名字。","果":{"声望":8,"悟性":3,"修为":100,"因果":-1}},{"名":"以鳞换语","文":"你不要他带话，要他把颈侧那片没褪净的鳞给你。他沉默很久，抬手撕了下来，血把整片浅滩都染红了。你接过鳞片，从此能听懂水里的低语。代价是此后每次听见那些低语，都要分辨哪一句是冲你来的。","果":{"灵材":2,"悟性":5,"修为":200,"魔念":1}}]},{"id":"yunmeng_044","题":"八百年后钟","类":"天象","重":1,"域":["yunmeng"],"境界":[5,11],"段":["云梦泽每八百年会有一次「双月同出」，天上一个月亮，水里一个月亮，两个月亮同时照在{地点}上。{人物}说这一夜水底的钟会连响八十一声，响完之后，泽上会多出一块新的洲，也会少掉一块旧的。","{天象}，双月当空，水面亮得看不清远近。钟声一声接一声从脚下传上来，像是整片泽都在震。你的衣袍被震得贴住了身体，经脉里的灵力被这声音一遍遍推着走，走成了一股不属于自己的流向。","第七十九声落下时，你看见{地点}的方向正在缓缓沉没，而另一侧的水面已经隆起。那里原本有一条水道，是几十户人家的活路。"],"择":[{"名":"随钟行功","文":"你放开周身经脉，任那八十一声推着灵力走。到最后一声时，你的修为越过了一整层，丹田里像沉下去一口小钟。你睁眼已是三月之后，泽上的洲换了一处，而你连自己是怎么上岸的都不记得。","果":{"修为":4000,"悟性":6,"寿元":-40,"道心":-1}},{"名":"渡人过水道","文":"你没有行功，撑船往那条要沉的水道赶。一趟、两趟，到第八十一声时你救出了十九个人，最后一个是个抱婴的妇人。她跪在船头给你磕头，你才发觉自己的修为一点没进，身上的暗伤却全好了。","果":{"因果":-8,"声望":25,"气血":60,"道心":5}},{"名":"拦钟一击","文":"你把全部灵力凝在掌上，往水底打了一记，硬生生截断了最后三声钟。钟声断了，双月同时暗了一瞬，隆起的新洲停在那里，沉没的旧洲也没有沉。你被反噬震得吐血，泽上的渔家却记住了你。","果":{"气血":-120,"修为":2000,"声望":30,"因果":3,"寿元":-30}}]},{"id":"yunmeng_045","题":"采莲女的婚约","类":"人情","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的采莲女十六岁，定的婚约是泽东一户渔家的儿子。她不肯嫁，说那家人只想借她父亲的船道。可退婚要退聘礼，聘礼是一串{灵材}，早被她换成了给母亲治病的药。","她拦下你的船，说听说你是散修，认得人多，求你替她想想办法。{天象}，藕花在她身后开着，她的手上全是采莲磨出的口子。她说她只求一件事：要么把这门亲退了，要么让她有本事不靠这门亲过日子。","你可以替她出聘礼的钱，也可以带她去见沧浪派那位守崖人。两条路，都不算好走。{天象}，藕花在她身后慢慢合拢，把整条船挡在里面。"],"择":[{"名":"出钱退聘","文":"你替她垫了一百五十块灵石。婚事退了，她母亲的药也接上了。第二年你再过{地点}，她已经自己撑一条小船采莲，船头挂着一盏新灯，见你来了远远就喊。那笔灵石她一直没还，你也没提。","果":{"灵石":-150,"声望":10,"道心":3,"因果":-2}},{"名":"荐她上崖","文":"你带她去了{地点}。守崖人上下打量她半天，问她能不能一天磨七柄剑，她说能。她在崖上留了三年，第四年提剑下山，退了婚，也带走了崖上那柄最轻的剑。她后来提起你，只说一句「那人没教我怎么活」。","果":{"声望":8,"悟性":2,"因果":-2,"修为":80}},{"名":"只教她水性","文":"你没有替她退婚，只用了三天教她怎么看潮、怎么识雾、怎么在水里换气。她说这有什么用，你说有用，总有一天用得上。两年后泽上发大水，是她撑着船把整个村子的人一趟一趟运了出来。","果":{"悟性":3,"声望":8,"道心":2,"修为":100}}]},{"id":"yunmeng_046","题":"盗剑的贼","类":"争斗","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{地点}夜里丢了七柄剑。守崖的{人物}把全崖的人叫到池边，说三日内找不回来，他自断一臂抵罪。崖上的人都看着他，谁也没说话。你在崖下修船，被一并叫了上去。","你注意到池边的泥里有两种脚印，一种是草鞋，一种是赤脚。{天象}，崖下传来船桨碰石的声音，很轻，是有人在夜里靠岸。{人物}把手按在剑柄上，说贼大概还没走远。","他问你：是当场搜船，还是等人自己回头。搜船，七柄剑最多找回五柄，崖上从此互相猜疑；等人回头，若那人真走了，剑就一柄也回不来。{器物}在池边石上横着，剑柄朝着崖下。"],"择":[{"名":"当场搜船","文":"船上有五柄剑，用油布裹着。偷剑的是崖上最老实的一个僮子，说是为了换钱给病重的母亲抓药。守崖人没有杀他，只让他把七柄剑一柄一柄擦干净。那天之后，崖上再没有人一起吃过饭。","果":{"声望":6,"修为":120,"因果":1,"道心":-1}},{"名":"等人回头","文":"你拦住了搜船，说再等一夜。天亮时那七柄剑整整齐齐插回崖上，一柄也没少，剑上还多了一层新磨的亮。守崖人什么也没问，只说往后崖上磨剑的活，交给那个人多些。","果":{"道心":4,"声望":8,"悟性":2,"修为":80}},{"名":"自认其罪","文":"你说这七柄剑是你夜里借去看的，忘了还。守崖人盯着你看了很久，最后罚你在池边跪一夜。第二天剑都回来了。那个僮子始终没敢看你，可他在你下山时追了半里地，塞给你一小包药。","果":{"声望":-4,"因果":-3,"道心":3,"灵材":2}}]},{"id":"yunmeng_047","题":"雾里旧相识","类":"奇闻","重":2,"域":["yunmeng"],"境界":[1,7],"段":["雾大的日子，云梦泽最容易认错人。{人物}说他在雾里见过自己死了三十年的兄弟，两人隔着一条水说了半个时辰的话，雾散时那边什么也没有，只有一件漂着的衣裳。","你也在{地点}遇上了这样的雾。雾里走来一个极熟的身影，走路的姿势你认得——那是你多年前失散的人。他停在三丈之外，不肯再近，只说了一句「你怎么才来」。{天象}，水面在你脚边一寸寸退开。","你可以走进那三丈，也可以就站在原地把话说完。雾还在加厚，最多再有一炷香。{天象}，雾里那身影往后退了半步，又停住。"],"择":[{"名":"走进三丈","文":"你走进雾里。他的手很凉，握住你的那一瞬几乎不像是手。你想说的话全都堵在喉咙里，两人就那么站到雾散。雾散后你在滩上醒过来，手里攥着一片极薄的骨片，是当年他随身带着的那一块。","果":{"修为":200,"悟性":3,"因果":2,"寿元":-8}},{"名":"隔水说话","文":"你没有动，只在原地把该说的、不该说的全说了。他一直听着，最后说了一句「我知道」，然后慢慢散进了雾里。你的衣裳湿透了，可你心里那口多年没散的气，被这一场雾洗得干干净净。","果":{"道心":5,"悟性":2,"修为":60,"因果":-1}},{"名":"问他真伪","文":"你开口第一句是：「你若真是他，就说一件只有我们知道的事。」雾里的身影静了很久，最后摇了摇头，转身走了。你没有追。回去的路上你一直在想，那件事到底是你记错了，还是他忘了。","果":{"悟性":4,"道心":2,"修为":100,"因果":2}}]},{"id":"yunmeng_048","题":"以月为心","类":"修行","重":2,"域":["yunmeng"],"境界":[3,9],"段":["水月宫的功法里有一句最难懂的话：以水为镜，以月为心。{人物}修了六十年，说自己至今只到「以水为镜」这一层，镜子照得出别人，照不出自己。她说这一层的关口不在功法上，在人肯不肯认。","她在{地点}上结了个极简的阵，只有一圈水、一盏灯、一个人。她让你坐进阵里，说这阵会照出你此生最不肯认的那一件事，看见之后你只需说一句「是我」。{天象}，阵中水面开始发亮。","水面照出的东西你一眼就认出来了。你张了张口，却发现那两个字比任何功法都难出口。{天象}，水面亮得刺眼，灯焰却一动不动。"],"择":[{"名":"承认是我","文":"你说出了那两个字。阵里的水忽然整个安静下来，灯焰直立不动。她睁开眼看着你，说你过关了。那一刻你觉得身上像是卸了一层东西，从此修习{功法}，再没有遇到过一次心魔。","果":{"修为":800,"悟性":6,"道心":5,"魔念":-3}},{"名":"闭目不认","文":"你闭上眼，什么也没说。水面亮了半宿，最后岸上的灯自己灭了。她叹了口气，说没认也不是错，只是这一关你还要再走一次。你在{地点}上坐到天亮，心里那层东西又厚回来了一点。","果":{"修为":200,"道心":-2,"悟性":2}},{"名":"改口推罪","文":"你说「不是我，是那时没法子」。水面上的光晃了一下，随即浮出一层细纹，把影子搓得看不清了。她什么也没说，只把阵撤了。此后你的修为进境仍在，可每次将要突破，总差那么一线。","果":{"修为":300,"悟性":3,"魔念":2,"道心":-3}}]},{"id":"yunmeng_049","题":"半月汀赌局","类":"市井","重":4,"域":["yunmeng"],"境界":[0,3],"段":["{地点}的半月汀上有一处棚子，棚下四张方桌，桌上不摆菜，只摆牌与骰。南泽的散修、船家、摸金客都爱往这儿挤，赌的也不只是灵石，有时是半条船道，有时是一枚来历不明的{灵材}，还有时是一句话。","坐庄的是个独眼的{人物}，据说当年在天剑域赌输了一柄剑，从此再不碰真的兵器。他看你的眼神很淡，把一枚骰子推到你面前，说押多少随意，赢了拿走，输了替他跑一趟腿。{天象}，棚外的水面上开始浮起一点一点的灯火。","押注的规矩只有一条：赢了不许马上走，得陪他喝完一壶。你身上只剩四十块灵石，可桌角那枚{灵材}实在好看。"],"择":[{"名":"孤注一掷","文":"你把四十块灵石全推上去，手按着桌沿没松。骰子转了七圈，停下来是六点。独眼人笑了一声，把那枚灵材连同灵石一起推给你，末了说一句：赢的人最后都要回来，回来的时候押的就不是钱了。你当时没听懂。","果":{"灵石":200,"灵材":1,"修为":40,"因果":1}},{"名":"只押一句","文":"你不押灵石，只押一句话：赌他这只眼睛是在哪儿丢的。棚里静下来。独眼人盯着你看了很久，最后把自己的骰子收进袖子，说他输了。他告诉你那个地方的名字，还给了你一盏旧灯，说往后路过那儿，把灯点上。","果":{"悟性":4,"灵石":60,"器物":1,"因果":-1}},{"名":"转身离桌","文":"你把手从桌沿上收回来，说赌不起。独眼人没有拦，只让人给你倒了半碗劣酒。你走的时候听见背后有人笑，也听见有人小声说「这人不傻」。那半碗酒你喝了，苦得皱眉，可走出棚子时脚下很稳。","果":{"道心":3,"气血":5,"修为":20}}]},{"id":"yunmeng_050","题":"藕丝软甲","类":"机缘","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{地点}的藕田里出过一件怪事：有人从藕节里抽出一件软甲，薄得像一层雾，穿在身上刀砍不进。消息传了半年，藕的价钱翻了三倍，田被人挖得底朝天，再没出过第二件。","你在一处被挖烂的藕田边遇上了收藕的{人物}，他说自己手里还留着半件——当年挖出来时是整件，被人一刀劈成了两半，另半件被一个{人物}抢走了。他把那半件推到你面前，藕丝泛着极淡的青色，摸上去凉而滑。{天象}，田里的水面浮起一层薄雾。","他说这半件可以白送你，只有一个条件：替他把另外半件找回来，或者，替他把抢东西那个人杀了。{天象}，田里的雾贴着水面走，一层一层，看不出尽头。"],"择":[{"名":"只取半件","文":"你收了半件软甲，把话含糊过去，第二日就离了南泽。这半件确实管用，替你挡过两次暗算。可它也从不贴身，总在胸口偏左半寸的地方留着一道缝，像是还在等另外那半件合上来。","果":{"器物":1,"修为":120,"因果":2,"道心":-1}},{"名":"寻另一半","文":"你顺着他说的线索找了三个月，在一处渔村找到了那半件的下落。抢东西的人早死了，半件软甲被当成了晒鱼的垫子挂在墙头。你把它买下来，两半合上的一瞬彼此生了根，从此穿在身上像长在肉里，脱不下来。","果":{"器物":2,"修为":260,"气血":20,"因果":-2}},{"名":"烧了半件","文":"你当着收藕人的面，把那半件软甲丢进灶里。藕丝遇火并不烧，只是慢慢塌成一团灰白的絮。收藕人脸色铁青，一句话没说就走了。半年后南泽再没人挖藕田，藕价跌回原样，田里的藕长得比往年都好。","果":{"因果":-3,"道心":3,"声望":5,"修为":60}}]},{"id":"yunmeng_051","题":"白鹭洲愿柳","类":"人情","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}洲头有一株极老的柳，树身中空，里头塞满了纸条。南泽风俗：愿不必说出口，写下来塞进树里，若第二年树还在，愿便有一半的机会应验。塞纸的人多了，柳树反倒越长越旺，只是树皮里的字再也取不出来。","你在柳下遇见一个{人物}，她手里攥着一张写了很久的纸，一直不肯塞进去。她说自己的愿是「让父亲别再出船了」，可她父亲这辈子只会撑船，不出船就得饿死。{天象}，柳条一直垂到水面，被风吹得轻轻扫着沙。","她把纸递给你，让你替她塞。她说自己塞进去的愿从来没应过，也许换个手就不同了。{器物}在她手里被攥出了褶，纸上还留着指印。"],"择":[{"名":"替她塞入","文":"你把那张纸卷紧，塞进树最深的那个洞里。她在旁边闭着眼，一直到你塞完才睁开。第二年冬天她父亲果然没再出船——不是不出了，是腿断了，只能坐在门口补网。她来还愿时哭了很久，说的话却是谢谢。","果":{"因果":2,"道心":2,"声望":4,"修为":40}},{"名":"劝她改愿","文":"你把纸还给她，说与其愿父亲不出船，不如愿自己撑得起船。她愣了很久，把纸撕了，第二日就跟着父亲上了船。三年后她自己撑一条小船跑南泽的水道，比父亲还稳。柳树上她始终没塞过纸，她说愿已经应了，不必再写。","果":{"悟性":4,"道心":3,"声望":6,"修为":80}},{"名":"拆树取纸","文":"你忽然想知道树里那些旧愿写的是什么，动手撬开了一块树皮。里头的纸早烂成絮，只余几行字迹。有一张写着「若我死了，别立碑」，落款年份是四十七年前。你把树皮按回去，那个冬天白鹭洲的柳没有再发芽。","果":{"悟性":3,"因果":3,"修为":100,"道心":-2}}]},{"id":"yunmeng_052","题":"雾隐渡口船钱","类":"市井","重":4,"域":["yunmeng"],"境界":[0,3],"段":["{地点}的摆渡人不收灵石，只收两样东西：一是干粮，二是故事。他在这条水道上撑了四十年，说南泽所有的旧事都是听来的，比灵石值钱。你要过泽，得给他讲一件他没听过的事。","你讲了半段，他摇头说听过。你又讲一段，他还是摇头，说这故事十年前就有人讲过，讲的人后来沉了船。{天象}，渡口的水面上浮着几片叶子，一动不动。他把篙子横在膝上，等着，一点也不急。","船还泊着，天光已经开始暗了。你可以再讲一件，也可以把随身的{器物}押给他，说下次补。"],"择":[{"名":"讲自己的事","文":"你把自己这些年最不愿提的一件事讲了，讲得很慢，讲到一半声音就低了。老渡人一直没打断，听完才把篙子提起来，说这件他没听过，往后也不会讲给别人。船撑出去的时候，你忽然觉得那件事轻了。","果":{"道心":4,"声望":3,"修为":80,"因果":-1}},{"名":"押物过泽","文":"你把{器物}押在渡口的木桩上，说下次来赎。老渡人看了一眼，收进船头的箱子里。过了泽你才想起，那东西其实早就不值钱了。三个月后你回来赎，他从箱里把它取出来，说这三个月替你看得挺好。","果":{"器物":-1,"灵石":-40,"修为":30,"因果":1}},{"名":"编一个假故事","文":"你编了一段极精彩的，讲得有头有尾。老渡人听得很入神，撑船撑得比平常快。到岸时他忽然说：这故事是假的，不过编得好，下回带件真的来。他一分钱没多要，你在岸上站了很久，脸上有点热。","果":{"声望":2,"悟性":2,"道心":-1,"修为":20}}]},{"id":"yunmeng_053","题":"镜中替身","类":"灾祸","重":2,"域":["yunmeng"],"境界":[2,7],"段":["水镜照久了会出事，这是水月宫的老话。你在{地点}照镜时多看了两眼，镜中的自己忽然没有跟着动。你抬手，它不动；你退后，它反而往前了一步。","{天象}，镜面上浮起一层白霜。镜中那人穿着你的{器物}，学着你最平常的站姿，只是眼睛里少了一点什么。它抬手在镜面上写了三个字，是「我出去」。你身后就是门，门外是泽。","守镜的{人物}在门外喊你名字，声音很远，像是隔了一层水。镜子里的手按在镜面上，一直没放开。"],"择":[{"名":"打碎镜子","文":"你抄起案上的香炉砸过去。镜面碎成一片一片，每一片里都有一个你，都在往外看。守镜人冲进来，把你的头按进水里，按了很久。你浮上来时神志清了，只是从此照不得任何镜子，连水面也要背过身去。","果":{"气血":-50,"修为":200,"魔念":1,"道心":2}},{"名":"应它出去","文":"你听见自己说了声「好」。镜面像水一样软下来，那人跨出来，从你身边走过，出门去了。你想追，脚却动不了。三日之后你在镜前醒来，宫人说你走失了三天。你的修为没变，只是从那以后，别人叫你名字时，你总要顿一下才反应过来。","果":{"修为":400,"悟性":4,"寿元":-25,"因果":3}},{"名":"与它对坐","文":"你不动，也不出声，只在镜前盘膝坐下，看着它。它写了第二句、第三句，你都不理。天亮时镜面上的白霜自己化了，那个影子重新跟着你动。守镜人扶你起来，说你赢了，但赢的办法她不打算告诉第二个人。","果":{"道心":5,"悟性":5,"修为":240}}]},{"id":"yunmeng_054","题":"水月宫选徒","类":"宗门","重":3,"域":["yunmeng"],"境界":[0,3],"段":["水月宫十年开一次山门，只收十六岁以下的女子。选徒那日，{地点}的渡口挤满了人，有娘带着女儿的，也有自己撑船来的孤儿。执灯的{人物}站在石阶上，一人只看一眼，看一眼便说「过」或「退」，看得极快。","轮到一个小姑娘时，她走上前，行了个不太标准的礼。执灯人看了她很久，忽然说她心里有恨，宫里不收带恨的人。小姑娘咬着嘴唇说自己没有恨。{天象}，石阶上的水痕正一滴滴往下淌。","你正好站在阶下，小姑娘回头看了你一眼。执灯人也看向你，似乎想听你说点什么。{天象}，石阶上等着的人都静了下来，连呼吸都放轻。"],"择":[{"名":"替她说情","文":"你说带恨的人未必不能修心，不带恨的人反倒容易在宫里散掉。执灯人沉默了一阵，让小姑娘进了下一轮。她后来在水月宫修了二十年，成了望月楼里最沉得住气的一个人，从不与人争执。","果":{"声望":8,"因果":-2,"道心":2,"修为":60}},{"名":"一言不发","文":"你没有开口。小姑娘被退回去，转身走下石阶时肩膀一直在抖。三年后你在别处又见到她，她已经有了一身不错的修为，只是眼睛里那点火早灭了，说话也极省。她认出了你，却什么也没说。","果":{"修为":50,"道心":-1,"因果":1}},{"名":"带她走","文":"你走上去，把她从阶上领下来，说宫里不收，那就不必求。她跟着你走了半日，路上一直不吭声，第二日才问你：那我往后靠什么活。你说靠什么活都行，只要不必先把自己的恨藏起来。","果":{"因果":-3,"声望":4,"悟性":3,"修为":80}}]},{"id":"yunmeng_055","题":"断桅礁困潮","类":"灾祸","重":3,"域":["yunmeng"],"境界":[0,5],"段":["{地点}是一块露出水面三丈的黑礁，礁上插着半截断桅，桅上还挂着一片烂帆。南泽人说，那是三十年前一条货船的桅杆，船沉了，桅杆撞在礁上，从此再没倒过。","你的船在涨潮时被推上礁边，卡在两道石缝里。潮水还在往上走，最多一个时辰就会淹过礁顶。{天象}，水面上的浮沫一层层涌上来，把船板拍得直响。船上还有半箱{灵材}，压得船身更沉。","你可以把箱子和桅杆一起砍断，让船脱开石缝；也可以把箱子卸下礁去，减轻船重，等潮水自己把你抬起来。{天象}，水已经漫到膝盖，浮沫拍在船板上一下比一下重。"],"择":[{"名":"砍桅脱困","文":"你举刀砍向那半截断桅，砍到第三刀它才断。桅杆倒下时带起一片水花，船身立刻活了过来。你顺着潮水撑出礁区，回头看那块礁，涨潮后只剩一片白浪。那半箱灵材还在，只是全泡了水。","果":{"器物":-1,"灵材":1,"气血":-25,"修为":90}},{"名":"卸货等潮","文":"你把箱子一件件卸到礁上，用石头压住。船身轻了，潮水上来时果然把船抬了起来，稳稳浮出去。三日后退潮，你回来取箱子，一半还在，另一半不知被什么拖走了，礁上留着一串往水里去的拖痕。","果":{"灵材":-1,"修为":130,"因果":1,"气血":-10}},{"名":"抱桅等死","文":"你没有砍桅，也没有卸货，只把绳子在桅杆上绕了三圈，捆住自己的腰。潮水淹到胸口时，那根桅杆硬是没倒。天亮时水退了，你的船只剩半条，人却一根骨头没断。那块礁从此在你心里有了名字。","果":{"气血":-60,"道心":4,"修为":160,"灵石":-50}}]},{"id":"yunmeng_056","题":"鲛渊旧约","类":"秘境","重":1,"域":["yunmeng"],"境界":[4,10],"段":["{地点}以东的水底有一处深沟，是鲛人王庭的边界。人不上鲛渊，鲛不出深海——这条旧约立了不知多少年，两边的字都刻在各自最硬的东西上：人族刻在碑上，鲛人刻在鲸骨上。","你潜到沟口，看见一块竖着的鲸骨，骨上刻着一行极细的纹，是鲛人的文字。{天象}，沟底浮上来一阵极缓的水流，带着一种低得几乎听不见的鸣。两个{人物}从暗处游出来，一个执叉，一个空手，都不看你的脸，只看你的手。","空手那个忽然开口说话，人话，说得很慢：旧约里有一条，人族可以来换一样东西，换完须留下一样。他把手摊开，掌心朝上，等着。{天象}，沟底的水流又缓了一分，连气泡都停了。"],"择":[{"名":"以物换物","文":"你把随身最旧的一件东西放进他掌心。他看了一眼，点了点头，转身游进沟里，再浮上来时带着一枚泛青的鳞。那鳞贴在眉心可避水三日。你上浮时，执叉那个始终没动，一直到你出了沟口才收回目光。","果":{"器物":-1,"灵材":2,"修为":400,"因果":-1}},{"名":"以言换言","文":"你说自己没有可留的东西，只有一句真话。他们说好。你把自己最不愿对人说的那一句讲了。水流静了一瞬，两个人同时让开路。他们没有给你任何东西，可你在沟口回头时，看见那块鲸骨上多了一道新刻的纹。","果":{"道心":5,"悟性":5,"修为":300,"声望":6}},{"名":"空手而退","文":"你摇头，往上游。空手那个没有追，只在后面说了一句「明年还来」。你一直游到水面才敢回头，沟口什么也没有。此后每逢月圆你都梦见那片深水，梦里那两个人都站着不动，只看你的手。","果":{"修为":150,"寿元":-10,"因果":2,"悟性":2}}]},{"id":"yunmeng_057","题":"说书人的段子","类":"奇闻","重":4,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的茶馆里坐着一个说书的{人物}，讲的全是云梦泽的旧事：水下古宫、鲛人借珠、沧浪剑仙最后一战。他讲得极好，一开口整间茶馆都静下来，连倒茶的都停手。","你听出他讲错了一处，把沉舟滩说成了落月湾。散场后你提醒他，他笑了笑，说那一处是故意错的。「讲对了没人信，讲错一点，倒有人来纠，一纠就记住这个故事了。」{天象}，茶馆外水面浮着一层薄薄的光。","他收拾醒木，忽然问你要不要听一段真的。他说真的那一段，他从来没在茶馆里讲过，因为讲完的人往往要出事。{器物}在桌上被他按得发哑，发出一声短响。"],"择":[{"名":"听真的那段","文":"他压低了声音，讲了半个时辰。讲的是当年沉泽那夜到底发生了什么，讲到一半他自己手都在抖。你听完之后，南泽所有的旧事忽然都连成了一条线。可你从此再也听不进任何别的故事，一听就走神，脑子里全是那一夜。","果":{"悟性":6,"修为":180,"魔念":1,"寿元":-10}},{"名":"替他说书","文":"你不听那段，只问他要不要个替手。他愣了一下，第二日还真让你上台讲了一场。你讲得磕磕绊绊，台下却听得认真，因为你说的是自己见过的雾与船。后来他在南泽各处茶馆都替你留了个位子。","果":{"声望":10,"灵石":80,"悟性":2,"修为":40}},{"名":"劝他别讲","文":"你说这些故事讲一次就有人往泽里去一趟，讲的人不该这么轻快。他把醒木在桌上按了很久，最后说你说得对，可他除了这个什么也不会。那年秋天他换了说的段子，改讲山里的传说，茶馆冷清了，人却还坐着。","果":{"因果":-2,"道心":3,"声望":5,"修为":60}}]},{"id":"yunmeng_058","题":"月下无声剑","类":"修行","重":2,"域":["yunmeng"],"境界":[2,7],"段":["{功法}是沧浪派里最不像剑法的一门：没有起手，没有收式，练的是在月下出剑而不惊动水面。守崖的{人物}说，这门功夫练成的人这一辈子只出过一次剑，那一次之后便再也不必出。","你在{地点}练了四十夜，每次剑到水面就忍不住用力，一路惊起一圈涟漪。第四十一夜，{天象}，水面比任何时候都静。他把手按在你的剑柄上，说：这一次别想着砍什么，只想着别让水知道你在。","剑已经抽出三寸。水面就在脚下，连一根水草都没有动。{天象}，月亮正落在崖顶上方，一点风也没有。"],"择":[{"名":"全剑出鞘","文":"你把剑整个抽出来，横在身前，又缓缓收回去。整片水面没有起一丝纹。守崖人看着水面看了很久，忽然对你行了一礼——不是同辈之礼，是弟子见师的那种。他什么也没说，转身下崖去了。","果":{"修为":500,"悟性":6,"声望":10,"道心":3}},{"名":"半剑即止","文":"你只抽出三寸便停下，把剑按回鞘里。水面静着，可你知道那不是静，是水在等你。守崖人叹了口气，说差一点，不过这一停停得好。第二年他又来教了你一遍，这一年你们谁也没提那次。","果":{"修为":240,"悟性":3,"道心":2}},{"名":"以剑击水","文":"你索性放开，一剑劈进水里。水炸开两丈高，砸下来时淋得两人浑身透湿。守崖人在水里站着，忽然大笑，笑到咳嗽，说四十年了，终于又有人这么干过一次。那一夜你们坐在崖边，一句剑法也没谈。","果":{"修为":300,"气血":-20,"声望":6,"悟性":2}}]},{"id":"yunmeng_059","题":"旧帆下的字","类":"奇闻","重":2,"域":["yunmeng"],"境界":[0,5],"段":["{地点}上那半截断桅挂着一片烂帆，三十年没倒。割苇的{人物}说，那片帆上原本写满了字，是船主的账，后来雨打风吹只剩几笔，谁也看不清了。","你爬上礁去看。帆布一碰就掉渣，果然只剩横竖几道，像极了一门{功法}的起手。{天象}，浪一下一下拍在礁石上，把帆吹得贴住桅杆又放开，那几道笔画在光里忽明忽暗。","割苇人在礁下喊你，说这片帆每过十年会自己换一次字，看过的人多半要记一辈子，也多半要疯一阵。{天象}，礁下的浪把帆吹得鼓起来，像有人在后面推它。"],"择":[{"名":"临摹下来","文":"你掏出炭条，把那几道笔画照原样描在衣角上。描到最后一道时帆布忽然散成了絮。回去之后你按那几笔去推，居然推出小半段剑意。只是此后每逢下雨，你右手的指节就会自己动，画那几道笔画。","果":{"悟性":4,"修为":180,"魔念":1,"气血":-15}},{"名":"点火烧帆","文":"你划了火折子，把那片帆点了。帆布烧得极快，火里飘出一阵墨香。割苇人看着火没说话，等烧完了才说，三十年了，总算有人肯把它烧掉。那天夜里{地点}的风声比往常轻了许多。","果":{"因果":-2,"道心":3,"声望":4,"修为":80}},{"名":"只看不记","文":"你看了一炷香，把每一笔都看进眼里，随后闭眼、跳下礁、上船，一个字也不描。那几笔在脑子里存了三日，第四日就淡了。割苇人说这才是对的，看得见，记不住，才不至于被它拖住。","果":{"悟性":2,"道心":3,"修为":60}}]},{"id":"yunmeng_060","题":"鲛童上岸","类":"人情","重":3,"域":["yunmeng"],"境界":[0,4],"段":["{地点}的浅滩上搁着一个孩子，看着七八岁，腿上的鳞还没褪尽，一沾水就疼得发抖。{人物}说这是鲛人的孩子，被浪推进了浅水，若送回深水还有救，若留在岸上，撑不过三日。","孩子不会说人话，只会哼一段极短的调子，反复哼着，像是名字。{天象}，浅滩上的水一寸寸往回退。岸上已经围了几个人，有人说鲛人的东西不能碰，有人说这是能卖大价钱的。","你可以把他抱回水里，也可以把他带到别处，还有个法子是把这事交给水月宫处置。{天象}，孩子身上的鳞在光下泛白，浅水已经退到脚下了。"],"择":[{"名":"抱他入水","文":"你抱着他走进深水，一直走到胸口。他忽然挣开，扎进水里，几息之后又冒出来，朝你哼了那段调子，然后潜下去不见了。三年后你在同一条水道翻船，有一双手把你从水底托了上来。","果":{"因果":-4,"声望":8,"道心":3,"修为":100}},{"名":"送交宫里","文":"你把孩子送到{地点}的执灯弟子手里。宫里收下了，说要养在素心殿后的池子里，等他褪完鳞再议。半年后你听说那孩子已经会说人话了，只是再不肯唱。你从此不大愿意走岛西那条路。","果":{"声望":5,"因果":2,"修为":80}},{"名":"卖给蚌珠贩子","文":"你把孩子交给了出价最高的那个人，拿了两百块灵石。孩子在船上一直哼那段调子，哼得越来越轻。后来听说那条船在半途翻过，人货两空。你花那笔灵石时，手心总是发凉。","果":{"灵石":200,"因果":5,"魔念":2,"道心":-3}}]},{"id":"yunmeng_061","题":"望月楼借书","类":"宗门","重":3,"域":["yunmeng"],"境界":[1,6],"段":["{地点}是水月宫藏功法的地方，楼共三层，第一层放开，第二层要凭令牌，第三层三十年没开过门。管楼的{人物}说，借书不必求人，只需交一样东西：一段自己的旧事，写在纸上，投入楼下的水瓮。","你在楼下写了半页。瓮里的水映出你写字的手，写完时纸自己沉了下去。管楼人看了一眼水面，说你可以上二层，三层不行，因为你写的那一段里有一句是假的。{天象}，楼里的灯忽然全亮了一层。","她把手按在楼梯口，说若你肯重写一遍，写真的那段，三层也未必不能上去。{器物}在她袖口亮了一下，像在等谁先开口。"],"择":[{"名":"重写真事","文":"你把纸重新铺开，把那句假的划了，写成真的，写得手都在抖。管楼人看完什么也没说，让开了楼梯。三层只有七架书，你借了一部{功法}，抄了三个月才抄完。那部书至今没人跟你抢，因为借过的人只有你一个。","果":{"悟性":6,"修为":260,"声望":6,"道心":2}},{"名":"只取二层","文":"你说二层够了。管楼人点了点头，替你开了门。二层的书多是杂录与旧闻，你抄了整整两年，抄出一部《南泽旧事》，比功法有用得多。后来宫里的弟子偷偷来找你借抄本，借的人越来越多，你的名字也就留在了南泽。","果":{"悟性":4,"灵石":120,"声望":8,"修为":120}},{"名":"不写便走","文":"你把笔放下，说自己的旧事不卖。她愣了一下，随即笑了，说三十年来第二个这么说的人。她送了你一盏{器物}，说凭这盏灯可以在楼下随意看书，不必上楼，也不必写字。楼下那几架，其实比三层更要紧。","果":{"道心":4,"器物":1,"悟性":3,"修为":80}}]},{"id":"yunmeng_062","题":"泽心铁链","类":"秘境","重":1,"域":["yunmeng"],"境界":[3,9],"段":["{地点}的水底沉着一条极粗的铁链，一端不知通向哪里，另一端埋在泥里。摸船的{人物}说这条链每隔几年会松一寸，松到某一日，水底下的东西就能自己上来。","你潜下去摸那铁链，链环有半人高，锈成了黑紫色，摸上去是温的。{天象}，链身上浮着一层极淡的白雾，雾里能看清链上刻着名字，一个接一个，密得数不清。最后一个名字是新的，刻痕还很亮。","链子在你手里轻轻动了一下，像有什么在另一头拉。你可以顺着链子往下摸，也可以就此上浮，或者把这一段撬断。{天象}，水底那层白雾又浓了一分，链上的名字一个接一个亮起。"],"择":[{"名":"顺链而下","文":"你沿着链子往深处摸，摸到二十丈时链子忽然垂直往下垂，再往下就是一片黑。你在黑里摸到了一只手的形状，冰凉，指节极长。你抽手就上浮，浮出水面时天已经亮了，铁链又松了一寸，链上多了一个新刻的名字。","果":{"修为":900,"悟性":5,"寿元":-25,"魔念":2}},{"名":"撬断一段","文":"你运足了灵力去撬链环，撬了半个时辰才断下一节。链断的一瞬，整片泽的水都轻轻晃了一下。你抱着那节铁链上浮，才发觉它比一座屋子还重，浮上来时把船压得几乎沉了。此后泽上的雾，少了三日。","果":{"灵材":2,"修为":600,"因果":3,"气血":-60}},{"名":"上浮不动","文":"你松了手，顺着水浮上去，一直浮到能看见月亮。船上的摸金客问你摸到了什么，你说什么也没摸到。那一夜泽上极静，静得连水声都没有。第二天你把船撑得离{地点}远远的，再没回去过。","果":{"道心":4,"修为":200,"悟性":3}}]}]},"beiming":{"词汇":{"人物":["玄冥殿淬骨弟子","寒山寺闭口僧","冰原猎盟的老猎户","逐雪而居的牧雪人","披兽皮的雪线向导","来自东荒的散修","冻掉三根手指的丹师","守冰渊的执灯人","赤霄剑宗的历练弟子","黑水堂的私贩","雪原游方道人","背着玄冰棺的行脚僧","望极台上的观星客","会写字却不说话的哑猎人","替人暖手的杂役","雪盲未愈的旧镖师","凿冰取髓的苦工","赶着雪橇的商队头目","被逐出殿门的叛徒","无人认领的冻尸","寒山寺的火工道人","替死者收殓的殓雪人"],"地点":["裂骨风口","白骨滩","冻尸岭上","雪魄谷深处","望极台","断指崖","沉钟湖畔","九曲冰河的拐弯处","无声林","玄冰柱林","赤瞳雪窟","回音峡","孤灯驿破屋","三更帐","冰渊边缘","裂开的冰缝里","雪线以北的无人区","寒山山门外的石阶","玄冥宫外的风口","埋着兽骨的雪窝子","冻土裂隙","猎人废弃的营地"],"天象":["极光夜夜垂落如帘","朔风卷雪如刀","白毛风起，天地不分","冻雾封原三日不散","星子冻在天上不动","日晕三重","极光骤熄","雪中闷雷","双月同悬","天光倒悬如镜","雪面浮起一线青光","寒鸦蔽日","雪停后静得能听见血响","冰渊底下泛起幽蓝","暖流反常地吹了一夜","云压得极低，像要塌下来"],"妖异":["冰下巨兽","雪魄","冻尸","雪魈","白毛狼王","赤瞳雪狐","冰螭","寒渊蛟","食雪蛛","雪女","骨鸦","霜甲熊","无声鬼僧","冰髓虫","雪原狐火","替人走路的影子","长着人脸的雪团"],"器物":["玄冰棺","兽骨猎弓","冻裂的铜铃","寒山寺的木鱼","雪魄灯","冰髓针","白狼皮帐","断指骨笛","暖玉护心镜","九节冰链","猎盟的雪铲","玄冥殿的寒铁锁","油布火折","兽脂烛","刺骨钉靴","半截断刀","刻满虫纹的皮囊","冻死的修士的储物袋"],"灵材":["万年玄冰","雪魄花","寒髓","冰蚕丝","雪参","冻土赤芝","玄冰髓玉","霜纹矿石","白狼内丹","雪线苔","冰蛹","极光砂","寒铁砂","冰魄莲子","雪松脂","三寸长的冰笋"],"功法":["《玄冥寒骨经》","《闭口禅》","《寒山苦行法》","《雪魄凝神诀》","《冰渊坐忘功》","《裂冰拳》","《九息御寒术》","《雪行步》","《白骨炼体篇》","《寒髓淬骨法》","《听雪辨踪术》","《冰心不动咒》","《呵气成刃》","《赤足踏雪行》"],"际遇":["于雪窟深处拾得半具不腐的坐化尸身","在冰缝间窥见冰下巨兽翻身","被老猎户让进帐中喝了一碗兽脂汤","捡到一枚冻在冰里的铜铃","在望极台上看见极光里有人影行走","误入寒山寺的苦修洞，听见有人用腹语讲经","雪夜迷路时跟着一串兽迹走出生天","在冻尸岭上找到一件没冻透的旧袍","替猎盟扛回一头霜甲熊","于玄冰柱林中被一位哑僧分了半块干粮","替将死的散修收尸，得他遗下的一卷口诀","在冰下听见三声钟响","跟着狐火走了半夜，走到一处不结冰的小池","雪地里挖出一整副白狼骨架","被雪魄缠上又被猎盟的香灰驱走","在孤灯驿与人对饮，对方始终不肯抬头"],"祸患":["被白毛风困在雪窝里三日","被雪魈换了影子","被猎盟当作偷猎者绑在雪桩上","被冻尸抓破手腕","被同修夺走火折弃于冰原","冻掉两根脚趾","雪盲三日不能睁眼","被赤瞳雪狐引得掉进冰缝","在玄冥宫外被寒铁锁锁了一夜","被寒山寺的僧人堵在山门口不许入内","被散修诬作窃贼","白狼皮帐被人划破，一夜冻透了半条腿","被冰髓虫钻进皮肉","误饮冻血，腹痛如绞","被雇的向导半路卷了行囊跑了","在回音峡里喊了一声，回声引来妖物"],"宗门":["玄冥殿","寒山寺","冰原猎盟","赤霄剑宗","丹霞观","百炼山","青云宗","黑水堂","水月宫","落雁谷"],"地名":["北冥雪原","玄冥宫","寒山","北冥冰渊","雪魄谷","白骨滩","望极台","冻尸岭","三更帐","九曲冰河","沉钟湖","裂骨风口"]},"图鉴":[{"类":"地理","名":"北冥冰渊","卷":1,"文":"在雪原最北，冰面塌下去一道看不见底的裂口，宽处可并十车，窄处只容一人侧身。渊中不结水，结的是更冷的东西，垂绳下去，绳到三十丈就脆了，一扯便断。猎盟把渊口列为禁地，禁地之外还立了一根兽骨柱，柱上刻的是历年下去的人数：三百七十一人，回来的记了四个，四个都不记得自己叫什么。渊壁上有冰阶，一级一级，方向朝下，凿得很整齐，没有人知道是谁凿的。传闻渊底睡着上古凶兽，一翻身就是一场地动。玄冥殿殿主在渊边坐了三年才定下入渊之法，此法至今只在殿内口传。","引":"渊不言深，人自往下。"},{"类":"宗门","名":"玄冥宫","卷":1,"文":"玄冥殿的根本，立在风口之后的一道冰崖里，宫墙是冰的，屋顶是冰的，连门轴都是冰的，推开一次要两个人。殿中弟子以肉身抗寒、以寒髓淬骨，入门先学忍，后学打，能站住风口一夜的才算人。宫中不设钟，报时靠风：风从裂骨风口灌进来，刮过宫墙上的九道窄缝，缝隙不同，声调不同，听熟了便知时辰。殿主在冰渊边坐了三百年，从没有人见他站起来。弟子们说话极少，一年说的话不够别派一日，宫中流传一句话：话说多了，骨头就松了。","引":"不闻人语，但闻风过九缝。"},{"类":"宗门","名":"寒山寺","卷":1,"文":"雪原上唯一的佛门道场，山门朝南，门前石阶一百零八级，雪从不扫，谁上山谁自己踩出一条路。寺中僧人修闭口禅，开口即破戒，破戒即冻伤，因此殿中常年无声，只有木鱼在响。寺里有一口大锅，冬至起连煮三日糙米粥，掺灵材边角，路过的人都能喝，不问来历，也不收谢。寺后有一片无声林，林中有坐化的僧人，被雪封成一个个白色的茧。有人说寒山不是寺，是一座坟；也有人说，正因为有这座坟，雪原上的冻尸才少了一半。","引":"开口即破戒，破戒即冻。"},{"类":"宗门","名":"冰原猎盟","卷":1,"文":"猎盟不是门派，是七十二帐猎人凑起来的规矩。他们逐雪而居，一个冬天挪七次营地，跟着兽群走，跟着雪线走。盟中没有掌门，只有老人；没有功法，只有口诀：不越线，不夺猎，不弃尸。分肉按刀口，不按出力，谁补最后一刀谁先取。盟里最重的一件东西不是刀，是一条绳，绳上每隔三尺结一个疙瘩，风雪天摸着绳子走，能摸回帐里。老人说，猎盟的家业不在雪上，在那条绳上。凡人入盟只要守三年夜、分三回肉，盟里就给他一个位置。","引":"不越线，不夺猎，不弃尸。"},{"类":"秘闻","名":"雪魄花","卷":1,"文":"雪魄花长在极光最盛处的向阳坡上，只在光帘子贴地的那一炷香里开，花瓣薄如冻烟，风一过就碎。花开时整坡雪面会泛青，青得像铺了一层薄釉。根扎在寒髓与冻土之间，拔时要连根带土，土一离地就化，花就死，因此能带走的雪魄花十不存一。此花入药能安神定魄，修士走火入魔时含一片，可压住半日心魔；但花性极寒，一次用两片，人就会连着三日听不见声音。猎盟有一句老话：看见雪魄花开的人，那年冬天要靠它活。","引":"花开一炷香，花死一眨眼。"},{"类":"秘闻","名":"万年玄冰","卷":1,"文":"玄冰不化于火，也不化于夏日，只在两种时候松软：一是极光垂得极低的夜，二是冰渊底下巨兽翻身的那三个时辰。雪原上的匠人要取玄冰，先要在冰面上守三个月，等它自己松。玄冰一离原位，便重得离谱，拳头大的一块能让两个壮汉压弯扁担。用它做剑，剑身会吸走周围的暖，握久了手会粘在剑柄上；用它做棺，尸身百年不腐。玄冥殿的殿门、寒山寺的钟座、三更帐的柜台，都是玄冰。匠人说玄冰不是石头，是冻住的时间，敲它的时候要轻，像怕惊了谁。","引":"冰不化火，火自灭于冰。"},{"类":"丹药","名":"寒髓","卷":1,"文":"寒髓出在冰壁深处，是玄冰里那一缕流动的白，凿出来像一小块凝住的烟。玄冥殿以它淬骨：剖开，涂在骨节外，任它烧，任它冻，一节指骨要忍三十息。寒髓入体时先烫后冷，冷到骨头缝里有东西在胀，熬过去骨头硬一分，能空手接刀；熬不过去，骨头会从里头裂开，裂成几十块，掰都掰不开。雪原上的私贩也做寒髓生意，价高得离谱，黑水堂为此埋了不少人。玄冥殿有禁令：寒髓不许外售，违者锁在宫外风口一整夜，锁的时候不给人衣。","引":"一髓一骨，一骨一命。"},{"类":"功法","名":"闭口禅","卷":1,"文":"寒山寺的根本法，只做一件事：不说话。不是不开口，是连腹中那句都要咽下去，咽到舌根发凉，凉到霜从嘴唇里长出来。修此法之人，语声会逐年退去，退到最后连梦话都没有，一身念力全归内照。据寺中记载，修满一百二十年者，可在不开口的情况下把一句话送进旁人耳中，此为腹语，也就是寺中讲经所用的法子。此法有一险：念力内照太深，人会把自己也听见，听见自己心里最深的那一句，那一句往往不是佛号。寒山寺百年间为此坐化了十七人，蒲团至今还摆着。","引":"不开口者，方能听见自己。"},{"类":"功法","名":"玄冥寒骨经","卷":2,"文":"玄冥殿立殿之法，讲究先死后生：以极寒把骨中的暖一寸寸逼出去，逼到骨髓都不再流动，再以心法把外寒引进来重铸。修此法者初见时面色青白，指甲呈紫，说话很慢，一年比一年慢。殿中口诀只有四句：先忘其暖，再忘其痛，三忘其身，四则寒为我。此法最忌急，急则寒入心，人会当场冻成一具坐像，姿势永远是自己打坐的姿势。冰壁里那些弟子就是这么留下的。执事弟子说，此法练到极处，身上没有一处是热的，只有丹田一点；这一点不灭，人就活着。","引":"四忘之后，寒即是身。"},{"类":"功法","名":"冰渊坐忘功","卷":2,"文":"来历已不可考，玄冥殿从冰渊底下捞起过半部，字迹被水浸得发胀，读得通的只有三十六行。此法不在练气，在练时间：把一息拉长到一炷香，让心在极静里停住，停到能听见冰在长、雪在塌、地脉在翻。练成者能坐三日不动，心跳慢到难以摸出，世人以为死了，抬去埋，到了坑里他自己睁眼。此法有一层险：坐忘太久，人容易把自己忘在里头，醒来了却不记得要走的路。玄冥殿规定，练此法须两人同坐，一人忘，一人守，守的人不许合眼，也不许出声。","引":"忘其形者，得其时。"},{"类":"功法","名":"雪行步","卷":1,"文":"猎盟的看家本事，算不上功法，只是走路。要诀三条：脚尖先落，落而不实，借塌陷送身。会走的人在雪上留浅印，一天走六十里不陷不累；不会走的人越用力陷得越深，走到最后连拔脚都要用两只手。老向导教后辈，从来不讲道理，只让赤脚在雪上走十步，走完说两句：抬脚要低，别想脚。此步在打斗中另有妙用：雪面塌下去的那一瞬间，身子已经滑到别处去了，刀砍过来只砍到一团白气。雪原上的孩子学走路先学这个，学会了才学跑。","引":"雪是虚的，越用力越吞人。"},{"类":"法宝","名":"玄冰棺","卷":2,"文":"雪原旧物，棺身通体透明，冰是万年的，棺主人却不知是谁。曾有人在冰沟下见过一口，棺中人身着旧袍，褶皱都还立着，面色比雪还白，百年不腐。棺盖是从里头推开的，推开一条缝，缝里塞着一卷手写的功法。玄冰棺有个古怪：它不冷，摸上去只是不暖，像是把暖抽走了。传闻此棺原是用来封凶兽的，后被人改作葬具；也有人说，棺中人不是死的，是把自己关在里头守着什么。见过棺的人多，敢推棺的人少，推棺之后还敢回头的人，更少。","引":"棺不从外开，只从内开。"},{"类":"法宝","名":"兽骨猎弓","卷":1,"文":"猎盟的弓不用铁，用兽骨，多取霜甲熊的肋骨，弯成弧形，弦是冰蚕丝绞的，冬天绷紧，夏天要松两扣。此弓拉力极大，臂力不够的人拉不满，勉强拉满会伤肩。弓身要养：每打完一场，用雪擦一遍，再抹一点兽脂，抹多了就废。猎盟的老猎户死前把弓传给谁，等于把猎道传给了谁，因此葬弓比葬人还讲究。有一种说法：骨弓里有兽的余气，射出去的箭会自己找血。老猎户们不信这个，只说箭要瞄，瞄歪了就是瞄歪了，赖不得兽。","引":"弓养三年，认主一夜。"},{"类":"法宝","名":"雪魄灯","卷":2,"文":"灯座是玄冰凿的，灯芯缠着一缕雪魄花的花蕊，点起来光是青的，不热，照三尺，只照雪不照人。玄冥殿的坐关洞用它：一盏烧一炷香，烧完就该出洞，不出来的人，多是自己不想出来。此灯的古怪在于它照不出影子——人在灯下站着，雪地上没有影。老执灯人说，这是灯在替你减负，减的是身上的那点活气，用久了人会淡，淡到别人看你像隔着一层霜。宫里的规矩：一盏灯只许烧一次，烧过的灯不能再点，点了就是借命。","引":"灯青三尺，只照雪不照人。"},{"类":"法宝","名":"断指骨笛","卷":3,"文":"以人的指骨做的笛，七个孔，孔位不齐，音也吹不准。雪原上不产这种邪物，多半是从别处流进孤灯驿，再从三更帐散出去的。骨笛吹起来的声音很低，像有人在很远的地方哭，吹过三更，雪原上的兽会安静下来，猎犬会呜咽着往帐里钻。猎盟明令禁止带骨笛进营，说这东西招雪魈：吹一次，人的影子就会慢半步；吹三次，影子就不肯跟了。私贩不管这些，一根骨笛能换两块寒髓，价高的时候能换五块。","引":"笛声一响，影慢半步。"},{"类":"秘闻","名":"白毛风","卷":1,"文":"雪原上的白毛风不是风大，是天地不分。起风之前先是极静，静得能听见血在耳内流；随后雪面被整片抬起来，天与地成一色，百步之外什么也看不见。风里的雪粒打在脸上像撒沙，打在眼上就是雪盲。白毛风不杀人，冷才杀人，冷是慢慢跟你商量的：先冻手，再冻脚，再让人想睡。猎盟传下的法子是用绳，绳上结疙瘩，摸着绳子往营里走；没有绳就挖雪窝，把自己埋起来，只留一个拳头大的气孔。老人说，白毛风里最忌三件事：站着、跑着、回头看。","引":"风不杀人，冷杀人。"},{"类":"秘闻","名":"极光","卷":1,"文":"雪原的极光夜夜垂落，绿的多，紫的少，垂得低时几乎贴到雪面。老辈人说极光是先人赶路，队伍在前头走，谁也不能喊，喊了队伍就乱。极光最盛的一夜，落在雪上的光会凝成砂，细得看不见，摸上去像一层油，此物名极光砂，是雪原上等的好东西。取砂要慢，刮一小捧就封进玉瓶，手沾了绿光，皮肉会透明，能看见底下的筋。极光也有凶险：传说光帘子里走过的人影会停下来招手，应了的人，第二年就要跟着走。寒山寺的僧人把这些话记在墙上，一句一句，写得极简。","引":"光如帘，帘后有人。"},{"类":"异兽","名":"冰下巨兽","卷":2,"文":"没人见过全貌，见过的都是影子：比马车还长，脊背上一排凸起，游得很慢。它在冰渊与九曲冰河之间活动，抬头时能把脸贴到冰面底下，眼里有墨一样的瞳孔。冰面在它靠近时会发出细密的响声，像有人在很远的地方捏碎瓷碗，随后整块冰往下沉，一寸，两寸。猎盟的规矩是听见这声响就趴下，不许站。据说它一翻身就是三个时辰，翻完雪原的形貌会变，冰丘冒起来，裂口合上。玄冥殿说它不是凶兽，是锁；锁着什么，殿里不说。","引":"未见其形，先陷其冰。"},{"类":"异兽","名":"白毛狼王","卷":2,"文":"毛色不是白的，是灰白，雪地里看着像一块旧毡。体型比寻常白狼大出三成，牙长过掌，一年换一次牙，换牙的七天不能咬，只能吞，这七天它是弱的，也是雪线以北唯一能上人的时候。狼王活着的时候,雪原的兽群有秩序：狼群不越猎道，猎人不进兽道。它死的那年，雪原乱了三年。猎人里有句话：狼王不是猎物的头，是规矩的头。所以老猎户主张不杀换牙的狼王；主张杀的人也有道理——等它牙长齐了，这一片就再没有猎人敢来。","引":"牙换七日，规矩一年。"},{"类":"异兽","名":"赤瞳雪狐","卷":2,"文":"通身雪色，眼睛是红的，尾分三条。它吐出的气会凝成青色的火，飘在雪面三尺高的地方，不烫手，也不灭。老辈人说狐火专引人往冰缝里走，跟着走的人尸骨都找不到；也有人说，跟着狐火走过的人其实都活着走出了雪原。两种说法都对，看的是狐挑没挑中你。雪狐爱干净，常在一个不结冰的小池边打转，池水是暖的，谁也不知道暖从何来。猎盟不猎雪狐，说杀了它，那年冬天狐火就要自己找路，找到哪儿，哪儿就有人掉进冰缝。","引":"三尾之狐，引而不害。"},{"类":"异兽","名":"雪魈","卷":2,"文":"雪魈不作恶，只换影子。它藏在风雪的间隙里，跟着走夜路的人走，走半个时辰，人的影子就慢半步；再走半个时辰，影子会自己往前走两步，再停。换了影子的雪魈会顶着那个人的脸回营，吃他的饭，睡他的铺，没人看得出来。破法有二：一是在雪地上与自己的影子并行到天亮，影自归位；二是用器物横在脚边把影子割断，但割断之后人就没有影子了，白天也看不清人脸。老辈人说，雪魈其实是那些死在雪里、没人收尸的人，它们只是想再走一段路。","引":"影慢半步，人已非人。"},{"类":"异兽","名":"冻尸","卷":3,"文":"死在雪原上、三日之内无人收殓的，就有可能起身。起身的冻尸不咬人，只拉人：抓住手腕，一路往雪里带，带到冻尸岭，人就变成第二个。冻尸的可怕处在于它还认得人，认得路，认得自己生前的帐子，会在帐外站一整夜，不出声。雪原上的规矩因此极严：人死了，尸首不能就地丢下，要守到雪把它盖满三尺，否则年年在这里拉人。寒山寺每年做一场法事，为无人认领的尸首诵经；猎盟则在雪葬的骨头上刻名字，刻了的，就不容易起身。","引":"三日不葬，起身拉人。"},{"类":"异兽","名":"雪女","卷":3,"文":"雪做的女子，衣裳、头发、裙摆都是冰，没有脚，人形浮在雪面上。她不害人，只讨一样：替她捧一会儿碗，好暖一暖手。碗是冰的，极薄，一碰就碎。应了她的人，第二年多半冻死在雪里——不是她害的，是那点暖被借走了，人自己撑不过冬天。也有人说，雪女原是个等丈夫归来的妇人，等了三十年，等到自己化成雪。破法古怪：给她一碗热酒，或者握住她的手。握过的手从此不觉得冷，也不觉得烫。","引":"借暖一分，还命一年。"},{"类":"地理","名":"无声林","卷":2,"文":"雪松长得极密，树身裹冰，进林之后世界就没有声音，连自己的脚步都听不见。不是耳朵坏了，是声音出来就被吃掉，喊一声，嗓子里的那点震都没了回响。林深处一片空地，摆着几十张蒲团，蒲团上坐着坐化的僧人，被雪封成一个个白色的茧，面容安详，衣角不腐。空地雪上有一行指划的字：此处无声，心有声者留。寒山寺的僧人到此止步，说这是给能坐住的人留的地方；坐不住的人进来，多半是被自己的心跳赶出去的。","引":"声出即灭，唯心跳可闻。"},{"类":"地理","名":"白骨滩","卷":1,"文":"方圆五里的雪面上，骨头露出来一截一截，都是人的，叠了不知多少层，踩上去咯吱作响。传说三百年前有两拨人在这里争一部经，打到最后一个人，也没人把经书拿走。骨滩上插着许多剑，一柄压着一柄，剑身不锈，反倒泛蓝。骸骨的姿势很怪：大多是盘坐的，双掌叠在膝上，像是自己坐下来等死的；也有几具是从背后被捅穿的，伤口齐整，一看就是熟人下的手。雪原上的人绕道走，说这地方的风不吹骨头，专吹人的后颈。","引":"五里白骨，一柄压一柄。"},{"类":"地理","名":"望极台","卷":1,"文":"雪原上最高的一处石台，四周没有遮挡，极光就从头顶三尺处垂下来。台上坐一夜，据说能多看见一寸天。台缘结着冰，冰里冻着许多小东西：铜钱、指甲、一撮头发，都是坐过的人留下的。看台的老观星客说，这台上看的是光后面的东西——极光后有一道极暗的影，横贯半边天，像一条冻住的河。望极台有个忌讳：不许在台上往虚空里迈步。迈过的人，有的回来，眼睛从此看着远处；有的没回来，雪地上连脚印都没有。","引":"一寸天，一寸命。"},{"类":"地理","名":"沉钟湖","卷":2,"文":"湖一年只有二十天不封冻，冰下极清，能看见湖底散着的钟，一口压着一口，钟身结着白霜。传说三百年前陆沉时这里沉了一座寺，钟楼还立在湖底，钟口朝上，钟舌被冻住了。湖底最大的一口钟倒扣着，钟沿下压着一具人形，手里握着用油布缠好的东西。靠近那口钟时，人的血会在皮下变慢，慢到手掌发青。冰下钟响有两种：一种是冰层裂的声，一种是钟真在响，真响时冰面会出现一圈圈霜纹，霜纹中心是一块颜色更浅的薄冰。","引":"钟在湖底，敲给谁听。"},{"类":"风俗","名":"三更帐","卷":1,"文":"雪原上唯一三更天还亮着灯的地方，一顶极大的帐子，烧兽脂，烟熏得人眼酸。猎盟、散修、私贩、行脚僧都在这儿换东西，什么都不问来历，谁也不许在这里动刀。柜台后是个断了鼻梁的老妇，一手记账，一手拨火。规矩三条：不问来路，不赊不欠，天亮前走人。帐里最贵的东西不是货，是消息：哪条雪线能走，哪片冰面在塌，哪个猎队回了几个。有人在这里一掷百枚灵石，也有人用半壶酒换走一条救命的道。灯灭了，就该散了。","引":"不问来路，天亮即散。"},{"类":"风俗","名":"雪葬","卷":2,"文":"猎盟的人死了不埋土，埋雪。尸首要抬到风口，让风把雪一层层盖上去，盖满三尺，再在雪丘上压一块兽骨，骨上刻死者的名字和他猎过的兽。抬尸四人一副，抬得手心发烫，肩上是冷的。刻骨有讲究：刻不完就由活着的人替刻，但要先把手冻透，冻透了才知道死人想写什么。雪葬之后，骨上的刻痕被风磨平，雪丘塌下去，人就真没了。猎盟说这叫还给雪原；寒山寺的僧人另有一说：雪盖满三尺，尸首就不会起身。","引":"三尺雪下，方得安眠。"},{"类":"风俗","名":"逐雪而居","卷":1,"文":"猎盟的活法：一个冬天挪七次营地，跟着兽群走，跟着雪线走。帐子是白狼皮缝的，拆一次要两个人，搭一次要一个时辰；雪橇上捆着兽皮、锅、绳、火种，还有一坛烧酒。挪营有个铁律：先走老的，再走小的，最后走牲口。迁到新营地，第一件事是拉绳——从帐门口往外拉，每隔三尺结一个疙瘩，风雪天摸着绳子能摸回帐里。此俗最忌两件事：把营地扎在兽道上，把死人的骨留在营地边。老人说，人不该在雪原上留痕迹，雪会自己把一切抹平。","引":"雪不留痕，人自逐之。"},{"类":"人物","名":"玄冥殿主","卷":2,"文":"玄冥殿主在冰渊边坐了三百年，从没有人见他站起来。宫里的执灯人说，他的身形已经和冰长在一处，只剩下一个影子还活着，那影子会走。影子走过的地方冰会薄一分，走到冰渊边上就停下，低头听，天亮前散去，冰上留下一行浅刻：它在里面，我在外面。他是玄冥殿唯一不淬骨的人——他的骨早在三百年前就寒透了。殿中弟子只在新年那天能远远看见他，看见的是一个盘坐的雪堆，雪堆里露出半张脸，眼睛闭着。","引":"形已入冰，影犹行雪。"},{"类":"人物","名":"老执灯人","卷":3,"文":"玄冥宫的执灯人换过七十三个，这一位做得最久，久到没人记得他上一位叫什么。他右手缺三根指头，缺得很整齐，像是自己伸手给人切的。宫里坐关洞的灯由他管：一盏烧一炷香，烧到他手里，他就坐在洞口打盹，从不催人出来。他说话极慢，一年说的话不够别派一日，可宫里最要紧的事都由他定：谁能进洞，谁该出洞，谁的指头该切。有人问他缺的手指去了哪里，他抬手指了指宫外的风口，说埋在那儿了，风大，能吹干净。","引":"灯尽人出，指埋风口。"},{"类":"地理","名":"孤灯驿","卷":1,"文":"雪原南缘唯一一处能称作驿的地方，其实只剩半间破屋、一处火塘、一个总在打盹的老驿卒。屋梁上挂一盏灯笼，油是过路人凑的，谁添油谁就能在火塘边坐一夜。驿里没有床，只有一圈石头围出的火位，石头上都磨出了坐痕，深的能容下半个屁股。孤灯驿的规矩只有一条：火塘边的位置按先来后到，不管你是猎盟、私贩，还是从别处逃来的。老驿卒从不问人名，只在人要走的早晨说一句：路上别停。","引":"一盏灯，照半个雪原。"},{"类":"风俗","名":"猎犬","卷":2,"文":"猎盟的犬不长在帐里，长在雪地里，毛厚、耳短、鼻头是黑的，冻得再狠也不叫。一头好犬要训三年：先训跟绳，再训闻雪，最后训认尸。认尸这一关最难，得让它能在三尺雪下闻出人味，闻出来就坐在雪上不走，也不叫，等人来挖。猎盟视犬如亲：犬死了要雪葬，骨上刻爪印；犬要是在猎场上被人射了，那就是私仇，谁也不能替谁和解。猎户有句话：雪原上分不清方向的不是人，是犬。犬若不肯走，人就不该走。","引":"犬停则人停，犬吠则人备。"}],"事件":[{"id":"beiming_001","题":"雪下往上走的脚印","类":"灾祸","重":3,"域":["beiming"],"境界":[0,6],"段":["日头一落，风就换了方向，把雪面刮出一道道横纹。你在{地点}寻见一串脚印，步子很匀，深浅一致，走了一夜也没被新雪填平。你跟上它，走到第三里，才发觉不对——脚印的脚心朝天，脚背朝下，是从雪底下往上踩出来的。{天象}，你呼出的白气落地就成了一粒冰，叮的一声。","那串脚印在一处雪窝前停住，窝里坐着个人形，浑身裹着冰壳，眉眼还清楚，嘴唇是青的。你摸他的腕子，皮下是硬的，可指头一按，那层冻住的皮肤竟往下陷了一陷，像是里头有什么在缓慢地翻身。他腰间挂着{器物}，还系着半截绳索，绳头断处参差，分明是被人从另一头割断的。","{天象}，风又起来了，雪粒打在你后颈上像撒了一把沙。你退开两步，那人形忽然抬了一下下巴，冰壳裂开一道缝，缝里透出比雪更白的白。你知道自己只有这一刻可以决定：是替他把绳头解开，还是把绳子系到别处去，让这串脚印从此有了新主人。"],"择":[{"名":"解绳","文":"你蹲下去，指头冻得捏不住绳结，只能用牙去咬。绳一松，那具冰壳哗啦塌成一片雪，底下只剩一具干瘪的骨殖，腰间{器物}却整整齐齐摆在雪上。你把骨头刨坑埋了，雪下三尺是硬冻土，挖到指腹出血才够深。起身时你周身发暖，像有人在你后心轻轻推了一把。","果":{"修为":90,"悟性":2,"因果":1,"气血":-6,"寿元":0}},{"名":"系绳","文":"你把绳头系在自己腰上，往回走了半里，感觉肩后越来越沉，像拖着一整个冬天的雪。回头看，那串脚印正一寸寸朝你这边挪。你猛地割断绳索滚进雪沟，指甲全翻了起来。第二天你在沟底醒来，指尖结着一层洗不掉的白霜，看东西时总觉得雪面上有一层薄薄的影在走。","果":{"修为":150,"魔念":2,"因果":-1,"气血":-18}},{"名":"不碰","文":"你把行囊里的干粮掰了一半放在雪窝边，退着走了七步，再转身。走出半里，你听见身后有细碎的咀嚼声，很慢，很耐心。你没有回头。当夜你宿在{地点}背风的石缝里，一觉睡到天光，梦里有人在雪底下数你的脚步，数得不快不慢，刚好跟得上。","果":{"悟性":1,"道心":3,"灵石":20}}]},{"id":"beiming_002","题":"雪魄花开的时辰","类":"机缘","重":4,"域":["beiming"],"境界":[0,5],"段":["雪魄花只在极光最盛的那一炷香里开，花瓣薄得像冻住的烟，风一过就碎。{天象}，你在{地点}看见一整坡的花苞同时抬头，把雪面照得发青。守了这一夜的人不止你一个，坡下还蹲着三个影子，谁都没动，谁的手都在袖子里攥着东西。","花开到第七分时，{天象}，雪面忽然起了涟漪，像水被什么从底下顶了一下。那是冰下巨兽在翻身。三个影子同时窜出去，最前头那个抢到花就往外跑，跑出十步，脚下一软，整个人陷进雪里，只余一只手还在外面，那只手上还攥着花。剩下两个立刻不追了。","你站在坡腰上，看那朵花在雪坑边缘轻轻摇。花根扎在{灵材}上，拔的时候要连根带土，土一离地就化，花就死。你往下走了两步，雪在靴底发出很脆的声响。此刻你有三种走法，每一种都要拿命去换一样东西。"],"择":[{"名":"抢花","文":"你踩着那人的手背下了坑，他没松手，指甲在你脚踝划出一道血口。你连根刨出花，塞进怀里用体温捂着，转身就往坡外滚。滚到坡底，花还在，你的左耳却听不见声音了，怎么拍都不通。三日后耳朵里滴出一线血，这才慢慢有了响动。","果":{"灵材":3,"修为":120,"气血":-20,"寿元":-2}},{"名":"救手","文":"你没拿花，先把陷进雪里的那只手拽了出来。那是个冻得说不出话的少年，指节已经发黑。你分他半件外袍，他缓过来后从怀里摸出一小包{灵材}塞给你，说这是他师父留的，师父就在坡下第三堆雪里。你没问那句多余的话。","果":{"声望":6,"因果":1,"道心":2,"灵材":1,"气血":-8}},{"名":"等谢","文":"你什么也不做，就站在坡腰看花开到败。花落时整坡的雪都塌了一层，露出底下密密的兽骨，骨上有牙印。你捡起一截断骨，骨腔里凝着一滴没冻的髓。这比你原本想拿的花值钱得多，只是从今往后，你在雪原上总听见有人在你背后数数。","果":{"灵材":2,"悟性":3,"魔念":1,"灵石":60}}]},{"id":"beiming_003","题":"闭口禅","类":"宗门","重":3,"域":["beiming"],"境界":[0,5],"段":["寒山的雪从山门一直铺到殿脊，中间不留一个脚印。{天象}，你踏上去，脚下的雪咯吱一声，殿里木鱼就停了一拍。火工道人来开门，只看你的手，不看你的脸，然后侧身让你进去，指了指蒲团，又指了指自己的嘴。寺中僧人修闭口禅，开口即破戒，破戒即冻伤，这是{地点}人尽皆知的规矩。","{天象}，殿里很暖，暖得反常。三十几个僧人坐着，谁都不出声，呼吸细得几乎听不见，只有喉结在上下滚动。你注意到最里侧那个老僧的嘴唇是白的，白得像结了一层霜，霜下隐约有血。他的嘴唇微微颤动，像有话到了舌根又被冻回去，于是每一次都停在半途。","火工道人把手里的{器物}递给你，碗里是热粥，粥面上浮着一层油。你接过来，才发现自己的手指僵得握不住碗，得用两只手捧。老僧忽然睁开眼，看了看你捧碗的姿势，眼里的东西很复杂。木鱼声重新响起，一声一声，像有人替谁在数余下的日子。"],"择":[{"名":"开口问","文":"你终究还是开了口，只问了三个字：他在等什么。殿里三十几个人同时抬头。老僧的嘴唇一抖，霜壳裂开，血顺着下巴流到衣襟上，他却笑了。他说他在等一个人替他开口，等了一百二十年。那夜他坐化了，只留下一句话给火工道人，说山门可以晚半个时辰关。","果":{"悟性":4,"道心":2,"因果":1,"声望":-2,"气血":-5}},{"名":"闭嘴喝粥","文":"你把话咽回去，一口一口把粥喝完，烫得舌头发麻也不敢停。喝完你把碗放回蒲团前，双手合十退了出去。山门在身后关上的那一刻，你听见殿里传来极轻的一声——像是谁长长地吐了一口气，压在胸口一百年的那口气。雪原很静，你走了三里，仍觉得肩头轻了些。","果":{"道心":4,"悟性":2,"修为":60}},{"名":"偷看经","文":"你借着添粥的机会挪到老僧身后，看见他膝上摊着一卷手写的《闭口禅》，字迹是腹语口述、旁人笔录的，涂改处密密麻麻。你记下前三页，退出山门时手心全是汗。此后每次静坐，舌根都会自发地卷起来，像有人在你口中替你锁上一道门闩，锁得你连咒都念不出。","果":{"器物":1,"修为":160,"魔念":2,"气血":-10}}]},{"id":"beiming_004","题":"冰渊坐关","类":"秘境","重":2,"域":["beiming"],"境界":[2,8],"段":["玄冥宫的坐关洞开在{地点}的冰壁上，洞口只有半人高，进去三尺就没了光。{天象}，宫里的执灯人给你一盏{器物}，说烧完就出来，烧不完也别硬撑。洞里坐满了人形，都是历代坐关不成的弟子，冻在冰里，姿势还保持着打坐的样子，指甲都是紫的。","{地点}的最深处，你依着{功法}的路子坐下，把呼吸压到每息一寸，寒气就从尾椎一路钻上来，钻到后心时像有人拿冰锥慢慢往里旋。到第三十六息，你的心跳开始变慢，慢到能数清每一次之间有几次耳鸣。这时你听见冰壁里有声音，像是有人在里面用指节敲，敲的正是《玄冥寒骨经》的节拍。","灯芯只剩最后一指长，{器物}的光在冰上只照出一小圈。你面前有两条路：一条是顺着敲击的节拍把寒气往骨头里引，那必然要冻伤；另一条是守着丹田，什么也不引，等灯灭。冰壁上敲击声越来越急，急得不像教，倒像催。"],"择":[{"名":"引寒入骨","文":"你把牙关咬死，随节拍一记一记把寒气打进骨缝。第一记打下去，指头立刻失去知觉；第七记时，你听见自己的骨头发出一声很轻的脆响，像瓷器的裂纹。灯灭之前，你身上覆了一层薄霜。出洞时执灯人看了你一眼，只说了一句：三百年了，终于有人坐满。","果":{"修为":320,"悟性":3,"气血":-35,"寿元":-5,"道心":2}},{"名":"守丹田候灯灭","文":"你收心守丹田，任那敲击声在背上敲得生疼也不理。灯灭的一刻，洞里忽然静得彻底，连耳鸣都停了。你摸黑爬出洞口，雪光刺得眼泪直流。这一夜你没得什么，只是从今往后，再冷的天你也能睡满四个时辰——在雪原上，这比一门功法更值钱。","果":{"气血":15,"寿元":3,"道心":1,"修为":40}},{"名":"敲回去","文":"你抬手在冰壁上敲了一记，用丹田的余震。冰壁那头静了。你敲第二记，第三记，节奏越敲越快，敲到后来是在泄愤。冰壁忽然整片裂开，一股腥气涌出来，你在黑暗里看见一只比人还大的眼。你连滚带爬冲出洞口，回头看去，洞口已经冻死了。","果":{"修为":200,"悟性":2,"魔念":2,"因果":-1,"气血":-12}}]},{"id":"beiming_005","题":"白毛风","类":"天象","重":4,"域":["beiming"],"境界":[0,5],"段":["起风之前先是静，静得连血在耳内流的声音都盖不住。随后雪面被抬起来，像一块白色的布被抽走，天地之间只剩一种颜色。{天象}，你在{地点}跑了不到百步就撞上一道雪墙，鼻子撞出血，血一抹就冻成了红冰碴子。","你摸到一个雪窝，钻进去，把{器物}抱在怀里。风在外面刮得像有人拿锉刀锉骨头，雪粒从领口一点点灌进来，化一层，再冻一层，衣服硬得像木板。你数着数，数到一千二百，手指已经不能弯，指甲盖下泛起一片死白。你想起部族的老话：白毛风不杀人，冷才杀人，冷是慢慢跟你商量的。","风势到后半夜低了些——{天象}，你听见外头有人在喊，声音很近又很远。也可以不出去，就这样蹲到天亮，代价是可能再也站不起来。你在雪里睁着眼，眼睛里全是没有温度的蓝。"],"择":[{"名":"爬出去","文":"你用牙咬着{器物}的带子，四肢并用往声源爬，爬十步就要喘三十息。爬到最后，你摸到一条绳索，绳上结着一排疙瘩，是猎盟的规矩。你顺着绳摸进帐里，被灌了一碗滚烫的兽脂汤，烫得胃里像搁了一块炭。醒来时，你的左耳冻掉了半片耳廓。","果":{"声望":5,"气血":-14,"寿元":-1,"修为":40}},{"名":"挖洞自保","文":"你不动，低头用两只胳膊把雪往身上拢，把自己埋成一堆，只留一个拳头大的气孔。雪层很暖，暖得让你想睡。你不敢睡，就反复默念{功法}，念到第三遍，天亮了。风停之后你从雪堆里拱出来，浑身僵得像一具冻尸，但脚还在。","果":{"气血":-8,"悟性":2,"道心":2,"修为":60}},{"名":"引雷同归","文":"你索性出了雪窝，在风口上盘膝坐下，把风当成刀用来磨骨。风灌进衣袖时你疼得想喊，喊出来的只有一口白气。这一次你伤得很重，肩胛骨裂了一条缝，可从此你的皮肉像浸过一遍冰，寻常寒气再钻不进去。代价是每逢阴天，那块骨头就隐隐作疼。","果":{"气血":-30,"修为":240,"悟性":3,"寿元":-3}}]},{"id":"beiming_006","题":"猎盟分肉","类":"人情","重":4,"域":["beiming"],"境界":[0,4],"段":["{地点}的老规矩：一头霜甲熊抬回来，肉按刀口分，不按出力分。谁补了最后一刀，谁先取；剩下的看谁身上血多。{天象}，帐外的雪地上摊着一整张熊皮，血还在往外渗，渗到雪里就冻成一片黑红的壳。围着的人不多，七八个，脸上都结着霜。","{天象}，你只砍了熊的后腿，算不上主要功劳。头一刀的猎户正在割胸口最肥的那块，他的手在抖，不是冷，是断了三根肋骨。他割完，把那块肉扔到你脚边的雪上，什么也不说。旁边一个年轻人脸色不好看，低声嘀咕，说外人没资格分这块。猎盟的向导抬了抬下巴，让俩人都闭嘴。","风把熊皮掀了一角，底下压着一块{灵材}，是熊胆。所有人的眼睛都朝那边去了一下，又都移开。按规矩，熊胆要留给死者的家眷，可这头熊是在雪线以北打的，死了的那个还没找回来。"],"择":[{"名":"让肉","文":"你把熊肉推回给断肋骨的老猎户，说你不饿。他看了你很久，最后从怀里摸出一小瓶{灵材}塞给你，说是自己攒了九年的。你没推辞。出帐时那个年轻人追上来，把半块烤熟的心塞给你，声音低得快听不见：雪线以北，别一个人去。","果":{"灵材":1,"声望":6,"因果":1,"道心":2,"气血":-3}},{"名":"分熊胆","文":"你把熊胆剖开，一半撒在这样的雪地上祭了死者，一半给了断肋骨的老猎户。年轻人不吭声了。三天后你听见消息，那个死在雪线以北的猎户被人找回来了，尸身被一块兽皮裹着。老猎户托人带话给你，说今年冬天猎盟多留了一个空位。","果":{"声望":8,"因果":2,"修为":30}},{"名":"买下熊胆","文":"你掏出一小袋灵石，按市价三倍的数放在雪上，把熊胆买走了。帐里安静了一瞬，然后有人笑起来了，笑得很难听。你收好熊胆转身走，风雪里传来那个年轻人的声音：有些东西是不可买的。你不回头，熊胆在你怀里慢慢暖起来，暖得发烫。","果":{"灵石":-80,"灵材":3,"声望":-4,"魔念":1}}]},{"id":"beiming_007","题":"冰下的影子","类":"奇闻","重":3,"域":["beiming"],"境界":[0,6],"段":["{地点}的冰面有丈许厚，能走雪橇，也能看见底下的东西。这天{天象}，冰下极深处浮起一个影子，比马车还长，游得很慢，脊背上一排凸起跟着水一起起伏。走冰的人都停住了，没有人说话，连雪橇上的铃铛都被按住。","影子在冰下绕了两圈，绕到第三圈时，它忽然抬头，把脸贴到冰面底下。你能看见那只眼的瞳孔在冰里收缩，像一滴墨落进奶里。冰面开始发出细密的响声，像有人在很远的地方捏碎瓷碗。身旁的老猎户把{器物}横在胸前，低声说了一个字：趴。","整块冰在往下沉，一寸，两寸。{天象}，贴地的人都能感觉到寒气从肚皮里往上爬。影子停在冰下不动，似乎在听，听冰上有没有人还站着。你的膝盖已经开始发抖，抖得雪面都在跳。"],"择":[{"名":"伏地不动","文":"你把整个人压进雪里，一口气憋到胸口发疼也不敢吐。膝下的冰不再响了。过了很久，冰下的影子缓缓沉下去，沉得像一块石头掉进更深的黑里。你爬起来时，冰面上留下一道白色的痕，那是指甲抠进去又冻住的痕，不是你的。老猎户说，这道痕每十年添一道。","果":{"悟性":2,"道心":2,"气血":-5,"修为":80}},{"名":"凿冰下望","文":"你要看清它，就用{器物}凿开一层薄冰，把眼睛贴上去。冰水刺得眼球剧痛，你看见的不是鱼，是一片鳞甲整整齐齐的侧腹，每一片都刻着纹。它忽然转身，你的鼻尖抵到了冰底的鳞上。你猛地后仰，鼻血涌出来，在雪上滴成一条红线，从那天起，你的眼珠在暗处会泛出一点淡青。","果":{"修为":180,"悟性":3,"气血":-18,"魔念":1}},{"名":"敲冰试探","文":"你用刀柄敲了三下冰，回音很闷，像敲在空的东西上。影子停了，然后猛地向上撞了一下。冰没破，你被震得滚出两丈，耳朵里嗡嗡作响。冰缝里渗出一股腥味，腥得呛人。同行的向导没说话，只把你拖走，走出十里才放开手，说了一句：它在记你的味道。","果":{"修为":120,"因果":-1,"气血":-12,"灵石":30}}]},{"id":"beiming_008","题":"极光里的队伍","类":"奇闻","重":3,"域":["beiming"],"境界":[0,7],"段":["极光落下来的时候，雪原是绿的，绿得像铺了一层薄釉。你在{地点}仰头，看见光帘子后面走过一队影子，一个接一个，谁也没停。{天象}，他们的脚步声居然传到了地上，很轻，像有人在远处敲木鱼，敲得很慢。","{天象}，队伍走在你头顶三尺的地方，看不清脸，只看得见手里的东西：一杆旗、一盏灯、一柄倒提的剑。数到第十七个人时，走在最后的那个忽然停下，低头看你。你看清了它的脸，是一张没有眉毛的脸，眉眼却像照着你长出来的，五官位置一分不差。","它抬起手，指甲是白的，朝你招了招。{天象}，队伍走远了，光帘子慢慢向西卷。它没有跟上去，就站在那里，和你一样站在雪上，中间隔着三丈。风把这中间的一段雪吹得很干净，干净得像特意留出来的路。"],"择":[{"名":"跟上去","文":"你朝前走了三步，第四步时那个人影开始变薄，薄到透过它你能看见后面的雪。你伸手去碰，指尖穿过一片很冷的空，冷从指骨一路传到后脑，眼前闪过许多别人家的窗子、别人家的灯。你跌回雪里，醒来三天后，从此能一眼看出一个人还剩下几年寿数。","果":{"悟性":4,"修为":150,"寿元":-4,"魔念":1}},{"名":"跪下磕头","文":"你跪下去磕了三个头，额头压在雪上，冻得发麻。磕完抬头，那个人影已经不见了，雪地上留着一小块没有结冰的地方，像有人一直站在那儿。你把手按在那块地上，按了很久，手是暖的。老人说极光是先人赶路，给他们磕头的人，路上会有人替你挡一次风。","果":{"道心":4,"因果":1,"寿元":2,"气血":5}},{"名":"扭头就走","文":"你转身就走，脚步很快，走得后背全是汗，汗在衣服里冻成冰片。走出两里，你忍不住回头——它还在，只是比刚才近了一丈。你再走两里，再回头，又近了一丈。你不敢再回头了，一路走到天亮，走进{地点}的营地才停。当夜你梦见它站在你床边，替你掖了掖被角。","果":{"气血":-8,"魔念":2,"修为":100,"道心":-1}}]},{"id":"beiming_009","题":"玄冰棺","类":"秘境","重":2,"域":["beiming"],"境界":[1,8],"段":["冰沟底下横着一口{器物}，通体透明，透过冰能看清里头那个人：二三十岁年纪，衣袍的褶皱都还立着，脸上没有一丝腐相，只是肤色比雪还白。{天象}，你顺着冰沟滑下去，滑得手心一片血痕，站在棺前才发现，棺盖是从里头推开的，推开一条缝，缝里塞着一卷东西。","你抽出那卷东西，是半部{功法}，纸被冻得硬如薄铁，翻一页就掉一层粉。棺中人的右手垂在身侧，五根手指全断了，断口平整，像是被人一节一节削去的。冰棺边沿有许多抓痕，方向朝外，抓得很深。","{天象}，你试着推棺盖，纹丝不动，寒气却顺着指骨往上爬，爬到肘部时你听见很细的一声笑，从棺里传出来，笑得很客气。你身上那点热，正一忽一忽往外流。"],"择":[{"名":"推棺","文":"你用肩去顶，用背去撞，撞到第七下，棺盖滑开半尺。一股陈年的冷雾漫出来，你在雾里看见那只断手动了动。你没退，伸手把《寒髓淬骨法》整卷取出，又从腰里摸出{器物}压在棺口。棺盖自己合上了。你回身爬冰沟，爬得指甲缝全是血，那卷经书在怀里冰得像一块铁。","果":{"器物":2,"修为":260,"气血":-22,"寿元":-3,"魔念":2}},{"名":"原样放回","文":"你把那卷残法塞回棺缝里，用雪把缝口填实，又把{器物}搁在棺前，算是替人守一夜。第二天你再下去，棺缝里多了一枚小小的冰符，握着它修行时，寒气入体的剧痛会减轻三分。你不知道这是谢礼还是别的什么，只是从此不太敢正眼看冰。","果":{"灵材":2,"悟性":3,"道心":2,"修为":120}},{"名":"砸棺取髓","文":"你抄起石头砸棺角，砸了整整两个时辰，砸出一道缺口。棺里那具人身忽然睁了眼。你没有停。缺口开得能伸进手去，你摸到的不是尸体，是一块冻得结结实实的{灵材}。你把东西塞进袋里就跑，跑上冰沟，听见身后有人在冰里慢慢地起身。","果":{"灵材":4,"灵石":100,"因果":-2,"魔念":2,"气血":-15}}]},{"id":"beiming_010","题":"断指崖的赌","类":"市井","重":4,"域":["beiming"],"境界":[0,3],"段":["{地点}的崖壁上钉着一排铁环，环上挂着手指，都是赌输的人自己剁下来的，剁完还得亲手钉上去，这是崖下的规矩。{天象}，崖下围了二十来号人，中间摆着一张兽皮，皮上放着一枚歪的骰子和半壶烧酒。","设局的是个独臂的雪原游方道人，笑得和气，说今晚只赌一样：谁能在崖顶站满一炷香，不在崖壁找扶手，谁就把这壶酒和皮上的{器物}拿走。有人笑，有人已经往上爬了。你抬头看，崖壁垂直，雪被风磨得像镜面，顶上的风口正是裂骨风口。","{人物}把香插在雪里，烟被风吹
