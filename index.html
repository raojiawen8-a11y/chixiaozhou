得斜成一线。他忽然压低声音对你说，崖顶那块石头去年站过一个人，站到香烧尽，第二天在那块石头上发现了一双冻掉的脚。他说这话时还在笑，笑得眼睛都没有弯。"],"择":[{"名":"上崖","文":"你双手插进雪里，一点点往上抠，指甲翻了就没再长回来。上到一半，风从裂骨风口灌进来，把整个人往崖外推。你咬住{器物}的带子，靠一张脸贴在崖上撑了半炷香，最后那半炷是跪着挨完的。香烧尽，你从崖顶滚下来，脚上的靴子冻在崖上没跟下来。","果":{"器物":1,"修为":110,"气血":-28,"声望":5,"寿元":-2}},{"名":"拆局","文":"你不爬，蹲下去看那张兽皮，把骰子拿起来对着光一照，骰心是空的。你把骰子捏碎，里头掉出一撮极细的{灵材}。围的人静了。独臂道人笑着站起来，说他只是替人试胆。你伸手要那壶酒，他不给，你也不逼，只要了那撮粉。他给的时候，手在抖。","果":{"灵材":2,"悟性":2,"声望":4,"因果":1}},{"名":"替人爬","文":"有个少年被架上去了，爬到一半挂在铁环上下不来，指头已经开始黑。你从侧面爬过去，把他绑在背上，两个人一起往下溜，溜到崖底，身上被雪磨出的血口有七处。少年没死，掉了一根小指。他娘后来在孤灯驿煮了三个月的粥，谁路过都能喝，不收钱。","果":{"声望":8,"因果":2,"道心":2,"气血":-20}}]},{"id":"beiming_011","题":"换牙的狼王","类":"争斗","重":3,"域":["beiming"],"境界":[1,7],"段":["白毛狼王的牙一年换一次，换的时候有七天不能咬，只能吞。这七天是狼群最弱的时候，也是猎盟一年里唯一敢上雪线以北的日子。{天象}，你在{地点}跟着队伍走了两天，第三天清晨，雪面上出现了一串大得离谱的爪印，爪印边上还有血，是牙龈的血。","老猎户把{器物}解下来递给你，说狼王换牙时会退到雪窝里，退到最里面。它不会先咬人，可你若进了窝不补刀，等它牙长齐了，这一片就再没有猎人敢来。队伍里分两说：一说趁它病要它命，一说狼王是雪原的规矩，破了规矩，明年雪原会乱。","{天象}，你们在雪窝外守到黄昏。窝里有很轻的声响，像有小兽在舔牙床。老猎户把弓放下，坐在雪里，一言不发，似乎在等你先开口。风把雪扫进窝口，一层一层，几乎要把入口填死。"],"择":[{"名":"入窝补刀","文":"你提着{器物}钻进去，窝里腥味浓得发甜。狼王趴着，眼睛是黄的，一动不动看你走近，喉咙里的声音很低。你补了一刀，干净利落。剥皮的时候你才发现它侧腹有三道旧伤，是替狼群挡过箭的。队伍分了三天肉，你没吃几口，夜里总听见很远的地方有狼在叫。","果":{"灵材":3,"灵石":120,"修为":150,"因果":-1,"魔念":1}},{"名":"守到它换完","文":"你在窝外守了七天，每天把带来的干肉推一截进洞。第七天傍晚，狼王出来，牙全了，比你手臂还长。它绕着你走了一圈，鼻子在你冻伤的肩头碰了一下，然后带着狼群往雪线以北去了。此后的三年，雪线以北的猎道无人被袭，猎盟的老人都说，这是有人在狼王身上留了话。","果":{"声望":10,"因果":2,"道心":3,"气血":-12,"修为":60}},{"名":"割牙换财","文":"你不杀它，趁它昏睡拔了两颗旧牙，揣进{器物}的袋里。牙到手，你退得很快。第二年冬天，狼群翻过雪线，咬死了三个猎户，其中一个就是上月才跟你分过肉的那个。你把牙卖了个好价，钱袋很沉。从那以后你不再走夜路，总觉得雪里有东西跟着，跟得不紧不慢。","果":{"灵石":180,"灵材":2,"因果":-2,"魔念":2,"声望":-6}}]},{"id":"beiming_012","题":"雪盲","类":"灾祸","重":3,"域":["beiming"],"境界":[0,4],"段":["雪原上连着三日大晴，日头一照，雪面白得刺目，眼睛受不了。先是流泪，然后疼，像眼里塞了把盐。到第三天下午，你在{地点}忽然发现自己看不见了，眼前一片奶白，只余下一点模糊的边。{天象}，你站着不敢动，听见风声、听见雪在脚下塌、听见自己的心跳，唯独看不见路。","同行的{人物}已经走远，喊也喊不应。你摸到一块石头，坐下，用袖子挡住眼。雪盲有个诀窍：不能揉，越揉越坏。可你的手很冷，冷到麻，麻就不听话。你按住自己的手腕，指头还在往里抠，抠得眼角出血。血滴在雪上，是唯一的颜色。","天黑之后风起了，你听见不远处有人踩雪，步子很轻，一步一步来回走，像在等你起身。你不知道那是人，还是雪里的东西。你手边有一块{灵材}，是白天捡的，冰得刺骨，据说敷在眼上能缓一缓——也可能只是老人的一个说法。"],"择":[{"名":"敷冰等明","文":"你把{灵材}按在眼皮上，冷得脑子一片空。按到后半夜，眼里的火终于退了些，能看见指头在动。你不敢动，就坐着等天亮。天亮时血色的东西从白里慢慢渗出来，是极光的残影。你的眼睛留下了毛病：从此看见特别白的东西，会先看见一片红。","果":{"气血":-10,"悟性":2,"寿元":-1,"修为":50}},{"名":"循声问路","文":"你站起来，朝那脚步声开口，说自己是路过的，眼瞎了。脚步停了。半晌，有人把一只很凉的手塞进你手里，牵着你走。走了半夜，摸到帐篷，那人松开手就不见了。你第二日睁眼，眼上蒙着一层薄薄的霜，看得清东西了，只是从那天起，雪地上任何一个人的脚印，你都能看出他当时是慌还是稳。","果":{"悟性":3,"道心":2,"修为":90,"因果":1}},{"名":"扒雪见缝","文":"你趴下去，用眼睛贴近雪面，靠雪层厚薄认路，一寸一寸往前挪。挪了三个时辰，手和下巴全磨破了。你摸到一条冻硬的绳索，是猎盟的标记绳，顺着绳子爬进营地时，你已经看不清人影，只看见两团模糊的暖色。有人给你灌了热汤，你哭了，眼泪在脸上冻成两道冰。","果":{"气血":-14,"声望":4,"寿元":-1,"修为":40}}]},{"id":"beiming_013","题":"寒髓淬骨","类":"修行","重":3,"域":["beiming"],"境界":[1,7],"段":["玄冥殿的淬骨之法和别处不同：不用丹，不用药，只取{灵材}，剖开，把里面的髓液涂在骨节外头，任它烧，任它冻。{天象}，你在{地点}领到一小块，掌心里那块东西是透明的，里头有一缕流动的白，白得像烟。执事弟子只说了一句：涂第一节指骨，忍过三十息。","{灵材}涂上去的第一息没感觉，第二息像有人往骨头上浇滚水，第三息忽然又变冷，冷得骨头缝里有东西在胀。你的手臂开始不受控地抖，抖到指尖划破了自己的脸。身旁坐着十几个同样涂了髓的弟子，谁都不出声，只有一个人在小声数息，数得越来越慢。","在{地点}，三十息没到，你的脚趾已经抠进雪里。执事弟子蹲下来看你的眼睛，看完不置一词，起身走了。你知道这意味着你可以自己决定要不要涂第二节——每多一节，承受的痛就翻一倍，而得到的骨头会硬一分，硬到能空手接刀。"],"择":[{"名":"涂满五指","文":"你把髓液一节一节往上涂，涂到第三节时已经喊不出声，只有气在喉咙里咕噜。十指涂完，你昏倒在雪地上，醒来时手背的皮全裂了，裂口里露出的骨是青白色的，摸上去像铁。此后你握拳时能听见轻微的响声，握别人的手腕，对方会疼得跪下。","果":{"修为":280,"气血":-30,"寿元":-4,"道心":2}},{"名":"只涂一节","文":"你只涂了第一节指骨，把剩下的髓液封好收回袖里。执事弟子远远看了一眼，没说什么。这一节指骨后来救过你两次：一次是接刀，一次是在冰缝里抠住冰壁。玄冥殿的人知道了，说这叫惜身，也叫惜道，殿里最老的执灯人就只淬了一节。","果":{"修为":100,"气血":-6,"悟性":2,"道心":2,"灵材":1}},{"名":"转卖髓液","文":"你没涂，把髓液用兽皮裹好，夜里出山门，卖给了等在风口的黑水堂私贩。价钱好得离谱。三个月后你在孤灯驿听说，有个弟子拿买来的髓液一次涂满双臂，死在淬骨洞里，骨头裂成几十块，尸体冻得掰不开。你把那袋灵石花得很慢，一枚一枚地花。","果":{"灵石":200,"因果":-2,"魔念":2,"声望":-5}}]},{"id":"beiming_014","题":"无声林","类":"秘境","重":2,"域":["beiming"],"境界":[1,8],"段":["{地点}的雪松长得极密，树身都裹着冰，进了林子，世界就没了声音，连自己的脚步都听不见。{天象}，你在林口停了停，还是进去了。走了半个时辰，你忽然意识到不对：你不是听不见声音，是声音出来就被吃掉了，喊一声，嗓子里那点震都没了回响。","{天象}，林深处有一片空地，空地上摆着几十张蒲团，蒲团上坐着人，全都是坐化的僧人，被雪封成一个个白色的茧，面容安详，衣角不腐。雪地上写着一行字，是用指头划的：此处无声，心有声者留。你的心跳在胸腔里撞得厉害，撞得你几乎能听见。","{天象}，最靠里的那张蒲团空着，蒲团前放着一只木鱼和一根木槌。木鱼上落了厚厚一层霜。你回头看，来时的路已经被树影封住了，树影之间的雪面平整，没有任何脚印，像是从来没有过人进来。"],"择":[{"名":"坐下","文":"你在空蒲团上坐下，闭上眼，让心声撞自己。撞到后来，那些声音一样一样被剥掉：先是风声，然后心跳，然后连念头都没了。你出定时，林子里落了新的雪，蒲团前的木鱼上被人敲出了一个浅坑。你走出无声林，从此打坐入定只需三息。","果":{"道心":4,"悟性":4,"修为":200,"寿元":3,"气血":-8}},{"名":"敲木鱼","文":"你抄起木槌敲了一下。声音没有传出去，可整片林子的雪同时塌了一层，几十个白茧一齐裂开细细的缝。你吓得连退三步，撞在一棵树上。树上的雪落下来，把你埋了半边。爬出来之后，你的耳朵里多了一种声音，很轻，像有人在很远的地方一直敲着一只空木鱼。","果":{"修为":150,"魔念":2,"气血":-15,"悟性":1,"因果":-1}},{"名":"原路退","文":"你什么也不碰，顺着记忆里的方向倒退着走，走了很久很久，退出林口时天已经黑透。你在林外的一块石头上坐了一夜，冻得说不出话，但心里很稳。第二天你发现自己的鞋底磨穿了，脚掌上却没有伤，只有一层薄薄的茧，厚得像长年赤足的人才有的。","果":{"气血":-6,"寿元":2,"悟性":2,"道心":2}}]},{"id":"beiming_015","题":"雪线","类":"宗门","重":4,"域":["beiming"],"境界":[0,5],"段":["冰原猎盟逐雪而居，一个冬天要挪七次营地，跟着兽群走，跟着雪线走。{天象}，你在{地点}追上他们的时候，帐子已经拆了一半，兽皮捆在雪橇上，猎犬在雪里打滚。盟里的老人正用{器物}在地上划一道线，划完对你说：线里是猎道，线外是兽道，人和兽各走各的。","{天象}，你看见线的外侧有三头白毛狼，蹲在雪坡上，不动，也不叫。猎盟的人从它们面前拉着雪橇走过去，最近的距离不到二十步。这是逐雪而居的人才敢做的事：把命交给一个默契。老人说，这默契是拿三代人的骨头换的，谁先破了，谁这一族就得用血赔。","{天象}，拆到最后一顶帐时，坡上的狼站起来了。老人把刀扔进雪橇，回头问你：今晚跟不跟着走？跟，就得分担半个月的守夜和口粮；不跟，可以在这条雪线上留着，一个人守一个冬天。"],"择":[{"名":"跟走","文":"你跟着营地往北挪了四十里。守夜的第六夜，你听见狼在帐外转，转了一整夜，你握刀握到手指僵直，没出声。天亮时狼走了，帐门口留下半只冻硬的雪兔。老人说这是还礼。此后你在猎盟有了名字，被叫成那个守夜的，猎盟分肉时会多切一寸给你。","果":{"声望":8,"气血":-10,"修为":70,"灵材":1}},{"名":"留在线里","文":"你留下来了，一个人守一个冬天。屋子是用雪块砌的，屋里放着{器物}，火不敢生大，怕雪化。三十七天后，最后一根兽脂烛烧尽。你熬过来了，眼睛变得能在雪夜里看清三里外的脚印，代价是耳朵常年嗡鸣，听人说话总像隔着一层冰。","果":{"悟性":3,"修为":130,"气血":-16,"寿元":-2,"道心":2}},{"名":"越线看兽","文":"你越过那条线，朝雪坡走了几步，狼没动。你再走几步，三头狼同时低下头，像在行礼。你看清了它们脚边的雪底下埋着一排猎人的骨头，每具都朝着同一个方向。你退回去，把那片地方记在心里。老人后来知道你去过，只说了一句：它们是在等一个换班的人。","果":{"悟性":3,"因果":-1,"修为":110,"魔念":1,"气血":-6}}]},{"id":"beiming_016","题":"冻住的商队","类":"人情","重":3,"域":["beiming"],"境界":[0,6],"段":["{地点}的雪堆里露出半截车辕，你扒开雪，看见一整支商队。人和牲口都站着，姿势完整，脸上蒙着一层薄冰，冰下表情平静。{天象}，风把车上的布幌刮得猎猎作响，幌子上写着雪线货栈四个字，字迹被冻得发白。","{天象}，你数了数，一共十一个人，十一个都朝同一个方向站，像在看什么东西。顺着他们的视线望去，雪原尽头什么也没有，只有一条极淡的青色横在地平线上。车队中间有一辆车的箱盖开着，箱里是空的，箱底刻着一个记号，两个交错的骨头——黑水堂的记号。","{天象}，你在领头那人的怀里摸到一封信，纸冻得脆，一碰就掉屑。信上的字只看得清三句：货已脱手，接的人在冻尸岭，勿走大路。你合上信，抬头发现雪又开始下了，落得很慢，落在那些人的脸上，一层一层，像是在替他们盖被子。"],"择":[{"名":"替他们埋","文":"你花了整整一天，把十一个人一个一个拖进雪沟，用{器物}刨坑，刨到十指全破。埋完你在雪上插了十一根木牌，写上能认出的名字。当夜你梦到这十一个人围着你坐，谁都不说话，其中一个递给你一只空碗。你醒来时，怀里多了一枚冻得透明的{灵材}。","果":{"因果":2,"道心":3,"灵材":2,"气血":-18,"寿元":1}},{"名":"照信寻货","文":"你揣着信往冻尸岭去，走了两天，在一处雪窝里找到两口未曾启封的箱子：一口是{灵材}，一口是空的。空箱子底下压着半张脸，眼睛还睁着。你抱走了那口有货的箱子，回头时发现雪地上多了一串新脚印，跟在你后面，不紧不慢。你不敢回头，一路跑到孤灯驿。","果":{"灵材":4,"灵石":150,"魔念":2,"因果":-2,"气血":-8}},{"名":"只取车马","文":"你不碰人，只把还能用的两头雪橇和几捆绳索拆下来，连同行囊里的干肉一起留下。走前你把信塞回原处，又替领头那人把被风吹开的外袍拉正。这一年冬天你用那副雪橇拉了三次货，每次路过这条雪线，都在原地放一小块盐。第三次去时，那些人都已经被雪盖没了。","果":{"灵石":60,"器物":1,"因果":1,"气血":-5}}]},{"id":"beiming_017","题":"极光砂","类":"机缘","重":3,"域":["beiming"],"境界":[0,6],"段":["极光最盛的一夜，落在雪上的光会凝成砂，细得看不见，摸上去像一层油。这种{灵材}只在光帘子紧贴雪面的时候才有，一个冬天也未必赶上一回。{天象}，你在{地点}看见雪面泛起一层淡淡的绿，风一过，绿就顺着风走。","旁边已经有人伏在雪上，用{器物}把表层刮进皮袋。他们动作很轻，刮一下就停一停，像在偷东西。有人刮得急了些，袋口漏了，绿光洒在雪上，一瞬就灭了，那人急了，伸手去捧，手一沾，整条小臂都泛起同样的绿，绿得发亮，然后皮肤开始透明，能看见底下的筋。","{天象}，你没动，蹲在雪里看。绿光正一层层往你靴边爬，爬得很慢。刮砂的行家有句话：砂是活的，会挑人。此刻雪原静得能听见那层绿在爬。"],"择":[{"名":"慢刮","文":"你把{器物}放平，贴着雪面一层层刮，刮一小捧就收进玉瓶，瓶口用蜡封严。刮到天亮，收了小半瓶，够换一副上好法器。回去路上你想起来，那个手沾绿光的人不见了，雪上只留一个浅浅的人形，人形边缘结着绿霜。你没敢走近。","果":{"灵材":3,"灵石":80,"修为":60}},{"名":"救那手","文":"你扑过去，把那个人按在雪里，用{器物}割开他的袖口，一路割到肩，把绿皮整片刮掉，露出底下血红的肉。他喊得像杀猪，喊到后来没声了。绿停在肩头不再上爬。他的臂废了，人活着。三年后他在孤灯驿卖热酒，看见你就多添半碗，从不收钱。","果":{"因果":2,"声望":6,"道心":2,"气血":-10}},{"名":"以身吸光","文":"你把双手插进那层绿里，让光往皮肉里钻。痛得像被千万根针同时刺进骨缝，可你咬牙撑住，把它引到丹田，硬生生压成一枚绿色的小珠。回去后你修行的速度快了一倍，只是每逢极光之夜，你的皮肤就会自己泛起绿纹，猎盟的人见了都绕着走。","果":{"修为":260,"悟性":3,"魔念":2,"气血":-20,"寿元":-3}}]},{"id":"beiming_018","题":"巨兽翻身","类":"灾祸","重":2,"域":["beiming"],"境界":[2,9],"段":["冰渊里的东西平时不动，一动就是一整片雪原的事。{天象}，你在{地点}先是听见一声闷响，像很远的山塌了一角，接着雪面开始起伏，起伏的波浪一浪接一浪，从远处推到脚下。冰层裂出几十道口子，每道口子里都在冒白气。","老猎户把雪橇砍断，用绳子把人和人连起来，说这是巨兽翻身，翻一次要三个时辰，翻完雪原的形貌会变。第一顶帐子陷进裂缝时，他连头都没回。远处有一座冰丘正在升起，升得很慢，冰丘顶上有一层绿——那是从冰底带上来的{灵材}。","所有人都看见了那层绿。{天象}，裂口就在冰丘脚下，宽的地方能过一辆车，深得看不见底。有人在喊，说等翻完就没机会了。绳子绷得很紧，像有人在两头同时拉。"],"择":[{"名":"解绳取绿","文":"你割断绳索，顺着斜坡冲向冰丘，脚下裂口在合拢，你跳过去，扑到那层绿上。冰丘忽然下沉，你被拽着一起往下滑，滑到一半抓住一块凸起的冰，用{器物}把绿刮进怀里。冰丘合拢时你只剩半个身子在外面，是猎盟的人用绳子把你拽出来的，胸口压出两道紫黑的淤。","果":{"灵材":5,"修为":320,"气血":-35,"寿元":-5,"声望":3}},{"名":"守绳救人","文":"你站在坡上拉绳，把陷进裂缝的人一个一个拽上来。第七个人爬上来时，你看见冰丘已经封了，绿光也没了。清点人数，少一个。你把绳索解开，坐进雪里，很久没有说话。那年冬天猎盟给你记了一笔，写在兽皮上，说这条命是拽回来的。","果":{"声望":10,"因果":2,"道心":3,"气血":-20,"修为":60}},{"名":"录地动","文":"你不跑不收绿，就地盘坐，把耳朵贴在雪面上，一笔一笔在心里记那股起伏的节律。三个时辰，整个雪原都在你身下起伏。翻身停了，雪原的样貌变了，你也在泥雪里冻了一夜。醒来时你想起那节律与《冰渊坐忘功》里一段没人能练成的口诀一模一样，你把它改了。","果":{"悟性":5,"修为":240,"道心":2,"气血":-25,"寿元":-2}}]},{"id":"beiming_019","题":"赤足","类":"修行","重":3,"域":["beiming"],"境界":[0,5],"段":["寒山寺的苦行法第一条：赤足踏雪，三九不停。{天象}，你在{地点}遇见一个赤脚的僧人，脚掌是黑的，裂口里塞着雪，走一步留一个血印。他不说话，只朝山上走，走得很慢。你看了很久，跟了上去。","{天象}，跟出五里，你的靴子成了累赘，雪灌进鞋筒，化了再冻，脚趾挤得生疼。僧人在一块石头上坐下，把一只脚抬起来给你看：五个脚趾只剩三个，断口早长成了硬茧。他又指了指你的靴子，然后指了指山上，意思很简单：要不脱，要不回去。","你脱下靴子的那一刻，{地点}的雪像火一样咬上来，脚下那点热一瞬就被抽干。僧人站起来，继续往上走，走得还是那么慢。你没跟上去，站在原地，一手提着靴子，一手按着膝盖，等自己的脚重新有知觉。"],"择":[{"名":"脱靴跟行","文":"你把靴子扔进雪里，光脚踩上去，每一步都疼得钻心。走到半山腰，脚已经不再是脚，只是一团麻木的东西。僧人停下来等你，把怀里一块化了一半的干饼分了你一半。你们一起到了寺前。你的脚养了两个月才长回皮，此后骨头对寒冷再不入心，能站在风口上打坐。","果":{"修为":200,"气血":-25,"道心":3,"寿元":2,"悟性":2}},{"名":"穿靴绕行","文":"你把靴子重新穿上，绕过僧人抄近路上了山。到了山门，僧人已经在门口等，你先到，他后到，可先到的人却在喘，后到的人只是冒着白气。他看了你一眼，从袖里取出一小瓶{灵材}递给你，转身进去。你握着瓶子，觉得自己的脚比他的暖，可心里凉了一截。","果":{"灵材":1,"悟性":1,"道心":-1,"修为":40}},{"名":"以掌代足","文":"你不脱靴，也不绕路，蹲下去把两只手掌按进雪里，一寸寸往前推，用双臂拖着身子爬。做了一百次，手掌冻得发紫。僧人回头看了很久，忽然停下来，用树枝在雪地上写了四个字：此法亦可。他成了你在雪原上唯一说过话的和尚，虽然那话是写在雪上的。","果":{"修为":120,"气血":-15,"悟性":3,"道心":1}}]},{"id":"beiming_020","题":"木鱼第三声","类":"奇闻","重":3,"域":["beiming"],"境界":[0,6],"段":["寒山寺的木鱼只在三更敲，敲三声，一慢、一快、一停。{天象}，你在{地点}听见了这三声，可今晚敲了第四声。第四声很短，像有人敲到一半被人按住了手。寺里的灯一盏一盏亮起来，僧人们披着单衣走出来，站在雪里，谁也不说话，都在等第五声。","第五声没有来。到天亮，寺里少了一个人：那个闭口一百二十年的老僧，蒲团还温着，人不在。寺门是从里开的，门口的雪上有一串脚印，朝{地点}去，走得很直。火工道人递给你一件旧袍，让你顺着脚印去找，说寺里不能出去太多人，怕山里出事。","{天象}，脚印走到雪魄谷就没了，最后一个印子很浅，像是被人抱着走的。谷口有一口古钟，钟身冻着厚冰。钟下坐着一个孩子模样的东西，抱着膝盖，脸埋在臂弯里，头发是雪做的，一见你就抬了头。"],"择":[{"名":"送他回寺","文":"你把旧袍裹在那东西身上，抱起来就走。它很轻，轻得像一束草，怀里却极冷，冷得你胸口像贴了块铁。走到寺门口，它忽然从你怀里滑下去，落在雪上散成一小堆白。老僧就站在门里，双手合十，弯了一躬。第二天寺里的木鱼照旧三声，不多不少。","果":{"因果":2,"道心":3,"声望":6,"气血":-12,"悟性":2}},{"名":"坐下等它说","文":"你在谷口坐下，什么也不做，就等。等到日头偏西，那孩子抬起头，脸上没有五官，只有一片平白。它慢慢伸手，在你掌心里写了一个字：归。你的手指被它碰到的地方立刻起了霜。你回寺复命，火工道人听完，把旧袍收回去，说老僧一百二十年前就是为了这个字才闭的口。","果":{"悟性":4,"修为":130,"气血":-15,"寿元":-1,"道心":1}},{"名":"敲钟问因","文":"你拾起石头去敲那口冻钟，敲了三下。钟声闷得像被人捂着。第四下敲下去，钟上的冰整片迸开，钟里滚出一具蜷着的骸骨，是个人形，骨头上一道道刀痕。孩子不见了。你抱着骸骨回寺，寺里替他做了法事。此后你能听见所有钟声里那一层被人捂住的余音。","果":{"修为":180,"悟性":3,"因果":1,"魔念":1,"气血":-10}}]},{"id":"beiming_021","题":"盗髓","类":"争斗","重":2,"域":["beiming"],"境界":[1,7],"段":["{地点}的冰壁里冻着数十具凿髓者的尸首，都是往年偷凿玄冥殿的寒髓，被冻在里头没出来。{天象}，你和另外两个人蹲在冰壁下，凿子已经磨好了。冰壁上的寒髓像一串冻结的灯，凿下来一块，够修三年。","三个人分，本来该说清楚。可第三人从背上取下一把{器物}，慢条斯理地擦，擦完说：这壁里的东西是我先找着的。另一个人不服，直起腰，把凿尖对着他。你们三个都知道，这地方离玄冥宫的巡山道不到两里，动了手，谁也走不了。","{天象}，冰壁忽然响了一声，很短，像有人在里面翻身。你贴上去看，壁里最近的那具尸首，眼睛是睁着的，正贴着冰壁朝外看。此刻凿子在你手里，冰壁上那两个影子都还僵着，等着谁先动。"],"择":[{"名":"先动手","文":"你一凿子砸在那人持械的手腕上，骨头碎的声音很脆。他倒进雪里，第二个人立刻把凿子放下。你们把寒髓凿了六块，三块归你，两块给他，被砸的那个丢在冰壁下，一动不动。你走时回头，看见冰壁里的尸首把两只手贴在了壁上。三日后你听说那人冻死了，冻死时还朝着冰壁爬。","果":{"灵材":4,"修为":140,"因果":-2,"魔念":2,"气血":-8}},{"名":"提议平分","文":"你把凿子插进雪里，说一人两块，多的给伤着的那个。他们愣了愣，最后照做了。寒髓到手，你多留了一块给后来被巡山道查问时被打断腿的那个。三年后你在孤灯驿冻病，有个瘸腿的送来三服汤药，一句话也没留。你认出了他的手。","果":{"灵材":2,"因果":2,"声望":4,"修为":80}},{"名":"撤手走人","文":"你放下凿子退了出去，一路退到巡山道边上大声咳了一下。两个时辰后玄冥殿的人赶到，凿髓的两个人都被锁走了，你躲在雪坡后看着。他们的腿后来都废了，但在殿里干活有饭吃。你的名声在散修里坏了，说你不讲义气。你并不觉得那两个字能用在这地方。","果":{"因果":1,"声望":-6,"悟性":2,"灵石":30}}]},{"id":"beiming_022","题":"冰缝下的孩子","类":"人情","重":3,"域":["beiming"],"境界":[0,6],"段":["{天象}，你在{地点}听见一声很轻的哭，断断续续，像猫。顺着声音找过去，是一道窄冰缝，缝下三尺处卡着一个孩子，浑身裹着兽皮，脸冻成青的。缝壁光滑，孩子的脚悬着，一动不动，只有嘴在动。","缝太窄了，大人下不去。你横趴在缝口，用{器物}撑住身子，把手伸下去，够不着。还得再往下半尺。缝里的寒气往上冒，是冰渊那种冷，冷得人的骨头像是被人用锤子敲过。孩子忽然不哭了，眼睛睁着看你，很平静的样子，这种平静比哭更让人难受。","{天象}，远处传来雪橇的铃声，是猎盟的巡队。你可以喊他们，他们有绳索；也可以现在就往下探，探下去可能两个人一起滑进冰渊；还可以去附近找根树枝，但那至少要小半个时辰，孩子未必等得了。"],"择":[{"名":"探手下去","文":"你把半截身子探进缝里，肋骨卡在冰棱上，痛得眼前一阵一阵发黑。指尖触到孩子的手，你扣住，用力往上拖，拖到一半自己的腰带崩了。最后是两个人一起卡在缝口，被赶来的猎盟巡队拖上去的。你的两根肋骨裂了，孩子哭出了声，这是好事。","果":{"因果":2,"声望":8,"气血":-22,"道心":2}},{"名":"喊巡队","文":"你扯着嗓子喊，喊到喉咙破了血。巡队来得很快，用绳套把孩子吊了上来。孩子的娘跪在雪里给你磕头，磕得额头出血。你把她扶起来，什么也没说。这事之后猎盟认你这个外人，可以在三更帐里过夜。孩子长大后成了猎盟最好的向导，回头找过你一次，那时你已不在雪原。","果":{"声望":10,"因果":2,"道心":2,"气血":-5}},{"名":"先寻树枝","文":"你跑去找树枝，跑出两百步就听见缝里没声了。你抱着树枝跑回来，孩子还在，只是双目闭合，嘴唇全白。你把树枝伸下去，他抓不住。最后你用牙咬着树枝把身子伸进缝里，把他勾上来。孩子活着，手指冻掉四根。你没敢看那四根指头。","果":{"因果":1,"道心":1,"气血":-14,"魔念":-1,"修为":30}}]},{"id":"beiming_023","题":"冻土赤芝","类":"机缘","重":3,"域":["beiming"],"境界":[0,5],"段":["冻土三尺之下长赤芝，是雪原上少有的暖性灵草。它熟的时候会把头顶的雪烘出一小块凹陷，凹陷边上结一层极细的水珠，这是唯一能认出它的法子。{天象}，你在{地点}看见雪面塌了十几个小坑，排得很整齐，像有人在这底下种过什么。","{天象}，你挖开第一个坑，底下是空的，只剩下一条被刀割断的根。第二个、第三个也是。挖到第七个，你才明白：这些坑是别人采过留下的，采的人很讲规矩，只取芝盖，留下根须，让冻土慢慢回暖。可第十个坑里的根也被拔了，土是翻过的，翻得很急躁。","{天象}，再往北二十步还有一片坑，雪面还没化。你蹲着看了一会儿，发现那片坑的间距比前头的都小，明显是一个人匆忙采的。雪上有一道拖痕，通往一口冰缝；很奇怪的拖痕，因为拖的方向是往缝里去的，不是从缝里出来。"],"择":[{"名":"先采一片","文":"你取了一片赤芝，按规矩留着根，又用雪把坑填回原样。这片赤芝在怀里发着暖，走到半路竟把胸前的衣服烘出一小块干。回去之后你用它换了二十枚灵石，余下小半片自己含在舌下，整夜不冷。第二年你再经过，那些坑都长回了新芝。","果":{"灵材":2,"灵石":40,"气血":8}},{"名":"顺着拖痕","文":"你顺着拖痕爬进冰缝，缝底有一具穿着猎盟皮袍的尸身，身边散着上百个芝根，都是被攥在手里的，攥到指骨发白。他显然采了别人的份。你把芝根一颗颗捡起来，塞进自己的袋里，尸身没有动。走时你替他把手掰开，那只手里是空的。","果":{"灵材":5,"灵石":120,"因果":-1,"魔念":1,"气血":-10}},{"名":"报与猎盟","文":"你把采坑的位置报给猎盟，说有人坏了只取芝盖的规矩。巡队去了，回来时带着一具冻硬的尸身和两袋芝根。盟里把芝根按规矩分给了各帐，你分到的份最少，可从此三更帐的人给你留了一个位置。老人说，雪原上的东西不是拾来的，是借来的。","果":{"声望":8,"因果":2,"灵材":1,"灵石":30}}]},{"id":"beiming_024","题":"白骨滩的剑","类":"秘境","重":2,"域":["beiming"],"境界":[1,8],"段":["{地点}名不虚传：方圆五里的雪面上，骨头露出来一截一截，都是人的，叠了不知多少层。传说三百年前有两拨人在此争一部经，打到最后一个人，也没人拿走经书。{天象}，你在骨头缝里看见一柄剑，半截插在冰里，剑身没锈，反倒泛着蓝。","{天象}，剑旁盘着一具盘坐的骸骨，双掌叠在膝上，掌心里托着一枚冻死的铜令。你拔剑，剑被冻得很牢，用力拔了三次，拔出来时带出一股白烟，烟里有极细的念诵声。剑柄上刻着两个字：归还。那不是剑名，是一句嘱咐。","你回头看那具骸骨，{天象}，忽然发现它肩后有第二道伤口，从背后穿到胸前，是被人从背后捅的。雪原上这三百年的故事，大概都写在这具骨头的背面。风把骨滩上的雪掀起一层，露出底下更多的剑，一柄压着一柄。"],"择":[{"名":"带走剑","文":"你把剑插进背上的皮囊，铜令也一并收了。走出白滩十里，剑忽然自己叫起来，声音像风过破瓦。你的手臂跟着发麻，一路麻到肩。当夜你在{地点}扎营，剑从皮囊里滑出来，剑尖指着来路。你明白了，它是想回去。你没有送回去，第二天它不叫了，剑身也蓝得淡了。","果":{"器物":3,"修为":200,"因果":-1,"魔念":1,"气血":-12}},{"名":"连剑带骨埋了","文":"你把剑插回原处，又用雪和石头替那具骸骨垒了个小丘，铜令压在丘顶。垒到一半，你的手被骨茬划破，血渗进雪里，雪却化了一小片。你走开五步，回头看见雪丘上立着一道极淡的蓝影，朝你躬了躬身。此后你拔刀时手上总会多出一分力气，也不知从哪来。","果":{"道心":3,"因果":2,"修为":120,"悟性":2}},{"名":"翻找经书","文":"你把白骨一具具扒开，找那部经。扒到第四十具时找到半卷湿透的《裂冰拳》残页，字迹早糊了，只能看清几个发力的要诀。你把残页揣进怀里走人，走过的地方骨堆被翻得乱七八糟。当夜风很大，你在帐里听见骨头相互磕碰，磕了一整夜，像有人在门口踱步。","果":{"器物":1,"修为":160,"悟性":3,"因果":-1,"气血":-8}}]},{"id":"beiming_025","题":"雪女","类":"奇闻","重":3,"域":["beiming"],"境界":[0,6],"段":["{天象}，{地点}的雪面上站着一个女子，衣裳是雪做的，极白，白得反光。她没有脚，人形在雪面上浮着，裙摆下是空的。听说雪女会向迷路的人讨一口热汤，喝了汤的人，第二年必定冻死在雪里。","她朝你伸手，{天象}，手心朝上，手里是一只很薄的冰碗。她说她不喝汤，只想让人替她捧一会儿碗，好暖一暖手。她的声音很轻，轻到像雪落在雪上。风把她的头发吹起来，头发是细密的冰针，落在你手背上就是一排细小的血点。","你手里有半壶烧酒，壶还是温的，腰后那把{器物}硌着骨头。你可以把酒倒进冰碗，可以把手放进她手里暖她，也可以转身走开——雪女不会追，她只会在原地等下一个路过的人。"],"择":[{"名":"倒酒入碗","文":"你把酒倒进冰碗，酒一入碗就不冒气了，结成一小块透明的冰，冰里裹着酒的颜色。她低头看了看，笑了，笑的时候脸裂开细纹，像一块化了一半的冰。她把冰碗递回给你，碗底有一粒{灵材}。你走开十步回头看，她已经散了，雪面上只留两个很浅的脚印，脚是朝里的。","果":{"灵材":2,"修为":110,"悟性":2,"气血":-6}},{"名":"握她的手","文":"你把手放进她手里，冷像一把刀，从掌心一路剜到心口。你没有抽回。她看着你，很惊讶，然后极轻地说了一句：三百年来第一个。她的手一点点化开，化成水，水又结成冰，冰里裹着一枚极小的冰珠。你的右手从此再不觉得冷，也再感觉不到烫。","果":{"寿元":-3,"悟性":4,"修为":220,"道心":3,"气血":-18}},{"名":"转身走","文":"你没回头，走得很快，一路走到{地点}的营地才停。守夜的人问你脸怎么白成这样，你说风吹的。那一夜你睡得很好，可第二天醒来，枕边的雪地上多了一只冰碗，碗里盛着半碗清水，水面上浮着一根冰针。此后每年冬至，那只碗都会出现在你枕边。","果":{"道心":1,"魔念":1,"悟性":1,"寿元":1}}]},{"id":"beiming_026","题":"玄冥考校","类":"宗门","重":3,"域":["beiming"],"境界":[1,7],"段":["玄冥殿收人不看资质，只考一样：在{地点}的风口上站一夜，不许运功取暖，不许挪脚。{天象}，三十几个来考校的人一字排开，脚下都画了圈。殿里出来三个执事，不说话，只在雪上插香。","第一个时辰还有人小声抱怨，{天象}，第二个时辰就没人说话了。风从裂骨风口灌进来，刮得人衣裳贴在身上，又硬成壳。你左边那个考校的年轻人开始抖，抖到后来不抖了——不抖不是好事，抖是身体还在挣扎，不抖说明它放弃了。他倒下去时脸砸在雪里，没人扶。","第四个时辰，{天象}，你的膝盖以下已经没有知觉，脑子里开始出现一些很暖的东西，比如火塘，比如有人替你盖被子。执事弟子从你身边走过，脚步很轻，他在看谁的圈里雪是化的。雪化，说明你偷偷运了功，那是作弊。你的圈里，雪没有化。"],"择":[{"名":"站到底","文":"香烧尽时你还站着，两只脚已经和雪冻成一块，是被人用小凿子敲开的。你进殿的第一课不是功法，是治冻伤：殿里的老执灯人把你两脚按进一盆雪水里，慢慢加温，痛得你咬破了嘴唇。三个月后你能赤脚走在风口上，那时候你才知道，那一夜只是开头。","果":{"修为":240,"气血":-30,"寿元":-3,"道心":3,"声望":5}},{"名":"偷偷运功","文":"你实在撑不住，悄悄转了一圈心法，脚下那点雪立刻化了个小坑。执事弟子停在坑前，看了三息，转身走开。香还在烧，可你的人已经不在考校的名册里了。天亮后你被送出山门，走的时候没人拦，也没人送。你把那点融化的雪记了很多年。","果":{"气血":5,"修为":40,"道心":-2,"声望":-4,"悟性":1}},{"名":"替人挡风","文":"你往左挪了半步，站到那个快倒的人的上风处，替他挡了半夜的风。两个人挤在一块，谁也没多说话。天亮时两个人都还站着，圈都画在外头了。执事弟子看了很久，最后说了一句：殿里缺的不是能站的，是肯挪半步的。你们都进去了，也都被记了一笔。","果":{"道心":3,"声望":6,"因果":2,"气血":-18,"修为":120}}]},{"id":"beiming_027","题":"回音峡","类":"灾祸","重":3,"域":["beiming"],"境界":[0,6],"段":["{地点}两侧是笔直的冰壁，中间只容两人并行。进去之后，你喊一声，回音会回来三四次，一次比一次近，最后一次几乎贴在耳边。{天象}，你进去时天还亮，走到一半，回音开始不听话了：你喊的是喂，回来的多了半句。","那半句听不清，像{妖异}在很远的地方接着你的话往下说。你停下来，回音也停。你再咳一声，回来的是一声很长的叹息。冰壁上开始出现影子，一个、两个，顺着壁面慢慢往你这边聚，影子有手，手贴在壁上，指甲抠着冰。","{天象}，峡谷前头有岔路，一条往东是雪坡，能绕出去；一条往北是窄缝，据说能穿过冰渊边上。身后那些影子已经聚到十步之内，你能听见它们在壁上挠的声音，很细很密。"],"择":[{"名":"闭嘴快走","文":"你把嘴闭死，一句话也不说，闷头往东跑。影子跟了半里就没再跟。跑到雪坡上，你一屁股坐下，大口大口喘气，喘出的白气在面前结成一团团雾。你回头望峡谷，看见壁上无数只手还在慢慢挠。那一夜你的嗓子说不出话，第三天才能发出声音。","果":{"气血":-10,"悟性":2,"道心":2,"修为":60}},{"名":"回声骂回去","文":"你转过身，冲着峡谷大声骂了一句最难听的话。回音把这句话原样送回来，送了四遍，一遍比一遍近。影子全停住。第五遍的时候，声音里的东西变了，变成一声笑，笑得很愉快。影子一片片退回冰壁深处。你的耳朵从此多了一种能力：听回音能辨出对面东西的多少。","果":{"悟性":3,"修为":140,"魔念":1,"气血":-8}},{"名":"钻进北缝","文":"你侧身钻进北缝，冰壁挤压着肋骨，衣服被刮成条。缝里很黑，越走越窄，走到最后得吸气收腹才能过。出来时人在冰渊边上，脚下是看不见底的裂口。你伏在雪上喘，听见身后一条缝里有呼吸声跟着你，跟着走到崖边，没再往前。","果":{"气血":-16,"修为":100,"因果":1,"寿元":-2}}]},{"id":"beiming_028","题":"三更帐","类":"市井","重":4,"域":["beiming"],"境界":[0,4],"段":["{地点}是三更天还亮着灯的唯一一顶帐子：猎盟、散修、私贩、行脚僧都在这儿换东西，什么都不问来历。{天象}，帐里烧着兽脂，烟熏得人眼酸，二十几个人挤在里头，说话都压着嗓子。柜台后是个断了鼻梁的老妇，一手记账，一手拨火。","今天有件事悬着：昨夜有人拿一柄染血的{器物}来换酒，换完就走了。今早猎盟发现巡队少了两个人。帐里的人都看着那柄{器物}，谁也不敢碰。老妇把火拨旺，说东西在她这儿，规矩是不交人，只交物，谁要就拿钱来赎，赎了就是谁的。","{天象}，人群里有人开始往门口挪，有人把手按在刀上。你坐在角落，手里攥着一小袋灵石。你不缺那柄东西，可你知道谁最想要它：帐子最里头坐着一个独臂的散修，眼窝很深，一直没说话，也一直没走。"],"择":[{"名":"出价赎走","文":"你把灵石推上柜台，老妇数了两遍，把{器物}包在兽皮里推给你。独臂散修站了起来，你没等他开口，把东西放在他面前的桌上。他愣了半宿，最后把皮解开，抱住那柄东西，肩膀抖得像风里的帐子。帐里的人散了。第二天猎盟找到了两具尸首。","果":{"灵石":-60,"因果":2,"声望":5,"道心":2}},{"名":"报给猎盟","文":"你退到帐外，绕到营地报了信。天没亮，猎盟的人围了帐子。老妇被绑在雪桩上，冻了一夜，没说话。那柄{器物}被搜出来，独臂散修抢了它就跑，跑进风雪里，没再回来。此后三更帐换了主人，规矩也换了：什么都不问，也什么都不收。","果":{"声望":6,"因果":1,"灵石":40,"魔念":1}},{"名":"什么也不做","文":"你在角落里喝完自己那壶酒，起身走出去。帐外的雪下得正紧，你听见里头有桌椅翻倒的声响，随后是压低的骂。你没有停。三天后你在别处听说，那一夜三更帐死了两个人，一个是私贩，一个是行脚僧。你记住了那个独臂散修的眼窝，很深，像两个洞。","果":{"道心":-1,"悟性":1,"气血":3,"灵石":10}}]},{"id":"beiming_029","题":"替人守尸","类":"人情","重":3,"域":["beiming"],"境界":[0,5],"段":["雪原上的规矩：人死了，尸首不能就地丢下，要守到雪把它盖满三尺，否则死者会变成冻尸，年年在这里拉人。{天象}，你在{地点}撞见一个散修坐在尸首旁边，脸色比尸首还白。他说他守了两夜，再守下去自己也要死，求你替他一夜。","尸首是个女人，怀里抱着一个用兽皮裹紧的包袱。{天象}，那包袱上落的雪一粒也没化。散修临走前叮嘱三件事：不要碰包袱，不要和尸首说话，火堆不许灭。他说完就跑了，跑得很快，好像有东西在追。你添了柴，坐在三步外，看着雪一粒一粒往下落。","到了后半夜，{天象}，火堆暗下去，尸首的手指动了一下。你没动。她的嘴张开，从喉咙里吐出一口白气，白气聚在胸前，慢慢拼出一个人形的轮廓，朝着包袱的方向低头。风把火吹斜了，雪开始大片大片地落下来。"],"择":[{"名":"守着不动","文":"你坐着，一直添柴，添到天亮。雪盖到三尺的时候，那口白气散尽了，尸首的手指也松开了。散修回来时给了你些灵石，你收下了。三年后有个女人在孤灯驿找到你，说她当年被人误传死讯，包袱里是留给女儿的遗物，问你是否见过。你说了实话。","果":{"灵石":50,"因果":2,"道心":2,"气血":-12}},{"名":"打开包袱","文":"你把包袱解开，里头是半副兽皮缝的护甲和一张画，画上是一个六七岁的女孩。你把画收进怀里。天亮时散修回来，看见包袱开着，脸色变了，什么也没说，把东西抢过去就走。你说了一句：画上那孩子，是不是在找她。他跑得更快了。","果":{"悟性":2,"因果":1,"魔念":1,"器物":1,"气血":-8}},{"名":"与尸对话","文":"你对着尸首开口，问她想说什么。白气凝成的人形转过来，朝你伸出手，手指在你眉心点了一下。那一瞬你看见了很长的一段路，一个女孩在雪里走，走到冻尸岭，坐下，再没起来。你天亮后往冻尸岭去，找到了那个女孩，还活着，正在雪里挖一个坑。","果":{"因果":3,"道心":3,"声望":5,"气血":-16,"修为":60}}]},{"id":"beiming_030","题":"冰髓虫","类":"灾祸","重":3,"域":["beiming"],"境界":[0,6],"段":["冰髓虫只有米粒大，通身透明，藏在{灵材}里，专挑人的伤口钻，钻进皮肉后顺着血管往上走，走到心口，人就冻成了冰雕。{天象}，你在{地点}处理一块刚凿下的寒髓，凿开的断面有一条极细的银线，一闪就没了。","{天象}，你没在意，第二天手上起了个白点，按下去有点硬，不疼。第三天白点顺着小臂爬了两寸，皮下能看见一条淡白的线在动，动得很慢。同帐的散修看见了，脸色一变，说这叫走髓，得在它还到不了心口前，用刀把那条线整条剜出来。","他递给你{器物}，又递来一壶烧酒，说剜的时候不能晕，晕了手就抖。帐外的风把门帘掀开又落下。你看着自己小臂上那条白线，它正一寸一寸往上，走到肘弯时停了一停。"],"择":[{"名":"自己剜","文":"你咬住衣袖，一刀下去，血冻在刀口上，划开第二刀时手已经在抖。白线被整条挑出来，蜷在雪上，像一根极细的银丝。你灌了半壶烧酒，用火烫了刀口。这条臂后来抬不起来了，抬到肩就疼。可你记住了那个散修的名，他叫雪原上一句老话：见过的都欠一次。","果":{"气血":-25,"寿元":-2,"悟性":3,"道心":2,"修为":80}},{"名":"以寒逼虫","文":"你不剜，把整条手臂埋进雪里，再压上一块{灵材}。冷逼到骨头，白线爬得慢了，最后停在肘弯，团成一个小结。你保住了胳膊，代价是这条臂从此怕热，一烤火就疼得钻心。那个小结鼓在皮下，摸上去很硬，像一颗种子。","果":{"气血":-14,"修为":120,"灵材":-1,"寿元":-1}},{"名":"推脉挤虫","文":"你运功把那条白线往下逼，一寸一寸挤向伤口。挤到腕部时，白线忽然断了，半条钻回皮肉深处，半条被挤出体外。你把自己救了一半。从此每到阴天，你的心口会有一阵极短的冷，冷得像有人拿指节在那儿敲一下，提醒你还剩半条。","果":{"气血":-18,"修为":160,"魔念":1,"寿元":-3,"悟性":1}}]},{"id":"beiming_031","题":"雪门施粥","类":"人情","重":4,"域":["beiming"],"境界":[0,4],"段":["寒山寺每年冬至在{地点}支一口大锅，煮粥三日，谁路过都能喝，不问来历，不收谢。{天象}，锅底烧的是干兽骨，粥是糙米掺了{灵材}的边角，稠得能立住筷子。排队的人从雪坡上一路蜿蜒到山门，有散修，有猎户，有破衣的私贩。","在{地点}，排在你前头的是个抱着孩子的女人，孩子嘴唇发紫，一直没哭。再前头是个满脸血痂的男人，一只手藏在袖里，另一只手端碗时在抖。盛粥的僧人不说话，给每人一勺，不多不少，最后一勺舀给最矮的那个。","轮到你时，锅里只剩锅底了，{器物}挂在锅沿上，被火熏得发黑。僧人用木勺刮了刮，把最后半碗推过来，又抬头看了看你身后——那里还站着七八个人，都冻得缩成一团。他看了看锅，又看了看你，把木勺放下，转身往寺里走，是要去取米，还是要去关山门，你看不出来。"],"择":[{"名":"把粥让出","文":"你把半碗粥递给身后那个冻得最狠的老猎户，自己退到一边。老猎户没推辞，两口喝完，眼眶红了。僧人很快抬了一袋米出来，重新生火。这一天的粥煮到三更，最后一个喝到的人是你。粥不烫了，可喝下去，胃里像是升起一小团火，走了很远都没灭。","果":{"因果":2,"道心":3,"气血":8,"声望":5}},{"名":"先喝了","文":"你端起碗，一口气喝干。粥烫得喉咙发疼，那股热从喉咙一路走到丹田，把整夜的寒气顶了出去。你放下碗，看见身后那些人还站着，眼睛都落在空锅上。你从怀里摸出几枚灵石，放在锅台上，转身走。僧人没有收，只是合十。灵石在雪上冻了一夜。","果":{"气血":12,"修为":30,"因果":-1}},{"名":"入寺帮忙","文":"你跟着僧人进寺，挑水、劈柴、抬米，做了一夜。寺里的水是从冰河上凿的，一桶水挑回来，桶壁上结了半寸冰。天亮时你分到最后一大碗粥，还多了一块咸肉。火工道人说，寒山不留人，可做过一夜工的人，山门永远给他留着。","果":{"气血":10,"声望":7,"因果":1,"修为":40,"悟性":1}}]},{"id":"beiming_032","题":"雪行步","类":"修行","重":3,"域":["beiming"],"境界":[0,5],"段":["在雪原上走路是有法子的，猎盟叫它雪行步：脚尖先落，落下去不压实，借那一点点塌陷把身子送出去，走一天也不陷，也不累。{天象}，你在{地点}跟着一个老向导学，他走在前面，回头看你的脚印，看一步摇一次头。","你学了半日，走得腰酸腿软，脚印还是深深的。老向导停下来，把{器物}往地上一插，说：你当雪是实的，所以你要用力；雪是虚的，你越用力，它越吞你。他脱下靴子，赤脚在雪上走了十步，脚印浅得像猫。","{天象}，他招手让你试。你脱了靴子，脚一沾雪就痛得眼泪出来。他站到一旁，说你走十步，我给你一句。雪原很静，远处有一片蓝，是冰渊的方向。"],"择":[{"名":"走完十步","文":"你走了十步，每步都疼，走到第七步时脚已经没了知觉。老向导在第八步说了一句：抬脚要低。第十步说了一句：别想脚。你回头，脚印浅了一半。此后三天你赤脚走了三十里，脚底长出一层黑茧。这辈子你再没在雪里陷进去过。","果":{"修为":180,"悟性":3,"气血":-18,"寿元":1,"道心":1}},{"名":"穿靴走","文":"你把靴子穿上，照样走。走到第十步，脚印依旧深。老向导没有再说话，只是把你的{器物}拔起来还给你。你没学到步法，可学会了看他怎么走：他的脚跟从不落地，膝盖永远半弯，走路时上半身一动不动。你后来照这个走法走了很多年，虽然慢，但从不摔。","果":{"悟性":2,"修为":60,"气血":-5}},{"名":"用轻功","文":"你不学步法，直接运功提气，脚不沾雪地往前掠。掠出三十步，气一散，整个人砸进雪里，砸出个半人深的坑。老向导在坑边看了半天，忽然大笑，笑到咳嗽。他说这样也行，只是雪原上一口气换不过来的人，都埋在坑里。你从坑里爬出来，把这句话记住了。","果":{"修为":100,"气血":-10,"悟性":1,"道心":1}}]},{"id":"beiming_033","题":"望极台","类":"修行","重":3,"域":["beiming"],"境界":[1,8],"段":["{地点}是雪原上最高的一处石台，四周没有遮挡，极光就从头顶三尺处垂下来。{天象}，你爬上去的时候，台上已经坐着两个观星客，一个老，一个少，谁都不说话，各自看着不同的方向。石台边缘结着冰，冰里冻着许多小东西：铜钱、指甲、一撮头发。","{人物}开口，说这台上每坐一夜，就能多看见一寸天；少的不服，说他坐了七夜，什么也没看见。老的说：你看见的是光，我看的是光后面的东西。他抬手一指，极光里果然有一道极暗的影，横贯半边天，像一条冻住的河。","{天象}，少的那个人站起来，走到台边，说要看就看得近一点。他抬脚往虚空里迈了一步。老的没有拦。风把他的衣角吹起来，他停在台缘上，脚尖悬空，回头看了你一眼。"],"择":[{"名":"拉他回来","文":"你扑过去抓住他的后领，两个人一起摔在石台上。他挣扎了两下，忽然不动了，眼睛还盯着天上，嘴里说：我看见了。老的笑了笑，说他看见的是一条路，路上没有人。天亮后那少年下山走了，谁也不知道他去了哪里，只留下一句话，说望极台该有人守着。","果":{"因果":2,"道心":2,"悟性":2,"声望":4,"气血":-8}},{"名":"跟着看","文":"你没有拦他，只是抬头去看他看的方向。极光后面那条暗影慢慢显出来，是无数细小的光点在移动，像雪，又像人。你看了很久，眼泪冻在脸上，直到眼前一片黑。老的在你肩上拍了一下，说：看见了就忘不掉，忘不掉就得走。你没问走去哪儿。","果":{"悟性":5,"修为":240,"寿元":-3,"气血":-16}},{"名":"闭眼下台","文":"你闭上眼，一步一步摸下石台。风雪在背后把石台吹得呜呜作响。你在台脚坐了一夜，什么都不看。天亮后老的下来，在你面前站住，说了一句：不看的人，天不会为难他。你回到营地时，发现自己这一夜睡得极沉，醒时浑身经络通畅，像被人重新疏理过一遍。","果":{"修为":120,"道心":3,"气血":10,"寿元":2}}]},{"id":"beiming_034","题":"狐火引路","类":"奇闻","重":3,"域":["beiming"],"境界":[0,6],"段":["雪原上的狐火是青的，不烫手，也不灭。{天象}，你在{地点}迷了路，看见远处有一团青火，忽近忽远。老辈人说狐火是赤瞳雪狐的吐息，专引人往冰缝里走；可也有人说，跟着狐火走过的人，都活着走出了雪原。","{天象}，你跟着走了半个时辰，火烧到前头去了，隔十几步停一停，像在等你。走到一处背风坡，狐火忽然分开，变成三四团，围着雪地上一处不结冰的小池打转。那池水冒着气，是暖的。你把冻僵的手伸进去，痛得倒抽一口气，那是活人的痛。","{天象}，抬头时雪坡上蹲着一只狐，眼睛是红的，尾巴分了三条。它看着你，不躲，也不叫。池边雪地上有脚印，很小，围着池子转了十几圈，还有一双人的脚印，走到池边，就不见了。"],"择":[{"名":"饮池水","文":"你伏下去喝了两口，水很甜，甜得不像雪原上的东西。喝下去之后，腹中一阵滚烫，接着全身发汗，汗出来在衣服里又冻住，冻得你直打哆嗦。第二天你发现自己在雪里睡了整夜，没死，也没伤。从此你不怕雪原的夜，只是再没找到那个池子。","果":{"气血":20,"寿元":3,"修为":60,"悟性":1}},{"名":"追那脚印","文":"你顺着那双人的脚印走，走出百步就断了。断处有一小坑，坑里冻着一件旧袍和一枚{器物}。你把它们捡起来，回头时狐还在坡上。它朝你眨了一下眼，三条尾巴散成三点青火，飘走了。你知道这个人是怎么没的：不是被吃的，是自己走进去的。","果":{"器物":1,"悟性":3,"因果":1,"魔念":1,"气血":-5}},{"名":"谢它","文":"你朝雪坡上抱了抱拳，转身往相反的方向走。走出二十步，身后那团青火跟上来了，一直跟到你看见营地的灯火。你回头看，它停在雪坡上，慢慢熄了。此后每年冬天你身上都会莫名其妙地有一点暖，像有人在你后背放了一小块烧过的石头。","果":{"道心":3,"因果":2,"气血":5,"寿元":2}}]},{"id":"beiming_035","题":"冻死的丹师","类":"机缘","重":2,"域":["beiming"],"境界":[1,7],"段":["{天象}，你在{地点}的雪窝里发现一具尸首，怀里抱着一只铜炉，炉里还有半炉没烧完的药材。尸首冻得很整，脸还保持着皱眉的样子，右手食指和中指之间夹着一根银针，针尖是黑的。这是一位丹师，死在丹成的最后一刻。","铜炉上刻着两个字：勿开。{天象}，炉壁很薄，能听见里头有极轻的响，像有什么在壳里挣。周围的雪地上散着药渣，你捡起来闻，辨别出六味，还差三味没见过。丹师左手压着一本小册，被血冻在掌心里。","你可以把{器物}连同尸首一起埋了，可以把炉砸开看看里面是什么，也可以先把册子从他手里取下来——血冻得很硬，取册子要先掰开手指。风把药渣吹走了一些。"],"择":[{"名":"砸炉","文":"你用石头砸开炉盖，一股黑烟窜起来，熏得你眼前发绿。炉心卧着一枚丹丸，紫得发黑。你吞了下去，丹力烧得你五脏俱焚，在雪里滚了半夜。天快亮时你吐出一口黑血，血落地就把雪化开一片。你的修为精进了许多，但从那天起，你再也闻不出任何药材的气味。","果":{"修为":340,"气血":-30,"寿元":-4,"魔念":2}},{"名":"取册","文":"你把尸首的手掰开，一根一根地掰，掰断了食指才取出小册。册上记着一味偏门的丹方，用的全是这雪原上的寒性灵材，最后一行写着：丹成需人守，不可离炉三寸。你把丹方记住了，把铜炉留在原处，把尸首埋了。以后你炼丹时总要把炉子贴着身子，也不知道是谁在守谁。","果":{"悟性":4,"灵材":2,"修为":120,"道心":1}},{"名":"埋炉埋人","文":"你没碰册子，也没开炉，只把人和炉一起埋进雪沟，用石头压了个记号。埋完你在雪上站了一会儿，什么也没想。三年后你再经过那地方，雪沟上竟没有积雪，露着一小片黑土，土里长了一株极矮的药草，叶子上有霜纹。你摘了一片叶，含在嘴里，苦得掉眼泪。","果":{"因果":2,"道心":3,"灵材":1,"悟性":2,"气血":3}}]},{"id":"beiming_036","题":"雪葬","类":"风俗","重":4,"域":["beiming"],"境界":[0,4],"段":["猎盟的人死了不埋土，埋雪。尸首要抬到{地点}，让风把雪一层一层盖上去，盖满三尺，再在雪丘上压一块兽骨，骨头上有死者生前的刻痕。{天象}，你被叫着一起抬——四个人抬一副，抬得手心发烫，肩上是冷的。","{天象}，死的是个年轻猎户，二十出头，去年才换的新弓，猎犬一直跟在后头，走到雪丘边就不肯再走，蹲在雪里低声呜咽。他的娘站在一旁，手里拿着一块还没刻完的骨头，刀在手里，划不下去。猎盟的老人在旁说，刻不完就由活着的人替刻，但要先把手冻透，冻透了才知道死人想写什么。","{人物}把刻刀递给你。你接过来，骨头很凉，刀尖一碰就滑。旁边有小伙子小声说，这不合规矩，你是外人。老人的目光没有动，还是看着你。"],"择":[{"名":"替他刻","文":"你把手插进雪里冻了一炷香，冻到握不住刀，再拿起来。刀尖在骨头上走出三道浅痕，是他的名字和他猎过的三头兽。刻完，你把骨头压上雪丘，猎犬凑上来舔了舔骨面。他娘跪下去，脸贴在雪丘上，很久没有起来。此后你在猎盟的名字被写在兽皮上，排在第七。","果":{"声望":10,"因果":2,"道心":3,"气血":-12}},{"名":"让给他娘","文":"你把刻刀递还给那位母亲，退到一边。她握着刀坐了半个时辰，最后在骨头上只刻了一个字：归。老人点头，把骨头压在雪丘上。你站在人群外，看着雪一层层盖上去，忽然明白雪原上有些事不该由外人碰。当晚你分到一碗肉汤，汤里有两块肉，是双份。","果":{"声望":5,"道心":2,"因果":1,"气血":5}},{"名":"刻完就走","文":"你把刻刀往骨头上一按，刻了死者的名字，又多刻了一个字：债。没有人说什么。盖雪的三天里，你每天都来站一会儿，站到第三日，雪丘齐胸。他娘临别时给你一块干肉，你收下了。那块肉你一直没舍得吃，挂在腰上，硬得像石头，走了半个雪原。","果":{"悟性":2,"因果":1,"道心":1,"魔念":-1,"气血":-6}}]},{"id":"beiming_037","题":"殿主的影子","类":"宗门","重":2,"域":["beiming"],"境界":[2,9],"段":["玄冥殿的殿主在冰渊中坐了三百年，从没有人见他站起来。殿里的执灯人说，殿主的身形已经和冰长在一处，只剩下一个影子还活着，那影子会走。{天象}，你在{地点}见过那个影子：一个人形的暗，走在冰面上，没有脚印。","影子走过的地方，冰会薄一分。你跟了一夜，发现它走到{地点}就停下，停下时对着冰渊的方向低头，像在听什么。天亮前，影子散了，冰上留下一行浅浅的刻字，笔画很勉强，像用指头抠的：它在里面，我在外面。","{人物}找到了你，脸色很不好看，说你不该跟。他给你两个选择：现在就走，忘掉这一夜；或者留下，替他守三夜灯，守完可以问一个问题。风把冰面上的字吹得模糊了，你要在字消失前做决定。"],"择":[{"名":"守三夜灯","文":"三夜灯，第三夜灯灭了两次，你都重新点上。第三夜将尽时，冰渊深处穿了声很远的气，像有人在里头翻了个身，又躺平。执事弟子在第四日清晨把灯收走，问你那个问题。你问：殿主在等什么。他沉默了很久，说：等冰下的东西先醒，还是他先。","果":{"悟性":5,"修为":260,"道心":3,"气血":-18,"寿元":-2}},{"名":"走","文":"你什么都没问，转身离开。走出山口，天正好亮，雪原一片白。守山的人没收你的东西，也没送你，只在你背后把门关上了。此后很多年你都没再去过玄冥宫，可每逢极光最盛的时候，你会醒，醒来会想起冰上那一行字：它在里面，我在外面。","果":{"道心":1,"悟性":2,"修为":60}},{"名":"把字刻深","文":"你没走也没答应，蹲下去用指甲把那行字抠深，抠到指头出血。执事弟子看着，最后跪了下来，也一起抠。两人抠到正午，字深了三分。此后那几行字再没被雪盖过。殿里没给你名分，也没赶你走。你在玄冥宫外的风口上住了一冬，没有一个弟子跟你说过第二句话。","果":{"因果":2,"声望":4,"修为":180,"气血":-14,"道心":2}}]},{"id":"beiming_038","题":"冰下钟声","类":"奇闻","重":3,"域":["beiming"],"境界":[0,7],"段":["{地点}的冰下埋着一座寺，据说是三百年前陆沉时沉下去的，钟楼还立在冰层里，钟口朝上，钟舌被冻住了。{天象}，你在冰面上趴着，听见了三声钟响，闷得像隔着一床棉被。冰面上什么都没动，可你的牙关跟着震了三下。","同行的向导说，冰下钟响有两种：一种是冰层裂的声，一种是钟真在响。真响的时候，冰面上会出现一圈一圈的霜纹，霜纹的中心就在钟口正上方。你低头看，果然有一圈，中心位置有一块圆形的薄冰，颜色比周围的浅。","向导把{器物}解下来递给你，说薄冰底下就是钟口，从这儿进去，能到钟楼。他说这话时自己的手在抖。冰面上的霜纹在一圈一圈往外扩，扩到第七圈时，钟又响了。"],"择":[{"名":"凿冰下去","文":"你凿开薄冰，一股陈年的冷气涌上来。下到钟楼里，四周全是冰，钟身上结着厚厚的霜，钟舌上挂着一个人形的冰坨，抱着钟舌，姿势像在推。你伸手一碰，冰坨裂开成粉。钟声在你耳边响了一下，极响，响了之后你的耳朵流了三天血，从此听任何声音都像隔着一层水。","果":{"修为":220,"悟性":3,"气血":-25,"寿元":-3}},{"名":"等钟自己停","文":"你不动，就在冰上坐着，听那口钟一声声敲。敲到第九声，停了。霜纹从中心往回缩，缩到最后一个点时，冰面上浮出一小块{灵材}，白得像蜡。向导说，这是寺里的香火钱，钟停时留给等的人。你收下了，从那以后，你每到一处都能听见那里下一个时辰会有什么声音。","果":{"灵材":2,"悟性":4,"修为":100,"道心":1}},{"名":"走开","文":"你站起来就走，走了十几步，钟声忽然变急，一声追着一声。你没有回头。向导跟上来，脸色很难看，说你是个明白人。走到营地时，你发现贴身带着的{器物}裂了一道细缝，裂口很新。这天夜里你没睡好，总觉得冰底下有人一遍遍敲，敲给谁听不知道。","果":{"气血":-6,"魔念":1,"悟性":1,"修为":60}}]},{"id":"beiming_039","题":"私贩的账","类":"市井","重":3,"域":["beiming"],"境界":[0,5],"段":["雪原上的私贩不比别处狠，可他们的账最狠：一笔账两清，不讲情，也不给你赖的余地。{天象}，你在{地点}找到黑水堂的一个私贩，问他手里有没有{灵材}。他没答，先让你看账本上的一行字：一位雪原散修，欠他三块寒髓，已逾期两年。","那个人你认识，就是上个月在孤灯驿跟你喝过酒的老散修，手指冻坏了三根。私贩说，不催，也不杀，只等他自己来。他说着翻开另一页，那页记着十几个名字，每个名字后头都有一行小字，多是死的年月。","私贩合上账本，给了你一个价钱，比市价低三成：条件是替他走一趟雪线，把一样东西送到三更帐，不能开，不能问。东西就在桌上，用兽皮包着，巴掌大，比看上去沉。"],"择":[{"名":"接这趟","文":"你把兽皮包揣进怀里，走了两天两夜。路上有三次想打开看看，都忍住了。到了三更帐，交东西的人接过包，看了你很久，说了一句：路上没人跟着？你说没有。他给了你一小袋灵石，比说定的还多。回去之后你才知道，那包里是三个人的骨灰，账本是账本，账也分轻重。","果":{"灵石":90,"声望":4,"因果":1,"气血":-10}},{"名":"替老散修还账","文":"你掏出自己的灵石，把三块寒髓折成数，替那个人清了账。私贩在账本上划了一笔，抬头看你，头一次露出像是笑的表情：雪原上替人还账的，一辈子还不完。老散修后来知道了，没说什么，把冻坏的手指一节一节剁了，从此用左手使刀，比从前还快。","果":{"灵石":-100,"因果":2,"道心":3,"声望":6}},{"名":"报给猎盟","文":"你把账本上的一页默记下来，回头描给猎盟看。猎盟没管账，只对名字感兴趣，顺手清了一处私贩的货栈，缴了不少{灵材}。私贩没死，只是把货栈挪得更远。你的名字上了另一本账，谁记的不知道。此后你在雪原上走，总觉得有人隔着很远在数你走的日子。","果":{"灵石":60,"灵材":2,"因果":-1,"魔念":1,"声望":3}}]},{"id":"beiming_040","题":"替身","类":"灾祸","重":3,"域":["beiming"],"境界":[0,6],"段":["雪魈不作恶，只换影子。{天象}，你在{地点}走了半个时辰，忽然发现雪上的影子不对：它走得太慢，慢了半步。你停下，影子还在走，走了两步才停。你回头，影子没有回头。","老辈人说，雪魈换了人的影子，就会顶着那个人的脸走回营地，吃他的饭，睡他的铺，没人看得出来。等真身被雪埋透了，替身就再也走不下来。你想起昨夜在营里见过的那个人：他跟你打招呼，笑得很熟，可他自己从不肯背对火堆。","影子正在从你的脚边往外挪，挪得很慢，像怕惊动你。你手里的{器物}能割断它，可割断了，你往后就再没有影子，白天也会看不清东西。你也可以让它挪，转身回营去认那个替身。"],"择":[{"名":"割断影","文":"你把{器物}横在脚边，用力一划。影子像被割开的布，蜷着缩回脚下。那一瞬你的白光晃了一下，之后你成了没有影子的人。你回营认出了替身，他正捧着碗喝粥，见到你笑了一下，然后就散了，散成一堆雪。此后你在雪原上的日子很难熬：阳光下你看不清人脸，只能听声音分辨。","果":{"气血":-18,"悟性":3,"因果":1,"寿元":-2}},{"名":"先回营","文":"你快步回营，戳穿了那个替你吃饭的人。它抬起头，脸还是你的脸，只是眼睛空着。营里的人先是不信，后来是害怕。老猎户一刀把它钉在雪地上，它化成雪，雪里裹着一根手指——是这营里去年冻死的那个人。你在自己的铺上睡了一夜，影子好好地跟着。","果":{"声望":5,"因果":2,"道心":2,"修为":60}},{"名":"与影并行","文":"你不割也不跑，就慢慢走，跟自己的影子并着走。走了一夜，走到天亮，影子终于重新贴在脚下。你没觉得有什么变化，只是从那以后，凡是你在夜里说的话，第二天自己总记不全；有人问你昨夜说过什么，你要想一想才能答。","果":{"悟性":2,"魔念":2,"修为":100,"气血":-8}}]},{"id":"beiming_041","题":"冰魄莲子","类":"机缘","重":2,"域":["beiming"],"境界":[0,6],"段":["冰魄莲长在冰渊边上，花是冻的，莲蓬却是活的，里头的莲子温热，一粒能顶半月苦修。{天象}，你在{地点}看见一丛莲，生在一块高悬的冰崖上，崖下是深渊，崖上覆着新雪，雪下是玻璃一样的冰，看不出哪一脚会碎。","莲蓬伸手可及，但要趴在崖沿上够。你趴下去，冰面在你身下发出细密的响声，像有人在里头慢慢撕纸。就在你指尖碰到莲蓬的时候，脚下的冰裂了，冰面上出现一道很细的白线，从你膝盖一路往外。","身后有人，是上山时遇到的两个散修。其中一个在喊，说你别动，另一个已经解下绳子。喊的那个往前走了两步，走得很急，急得雪在他脚下塌了。"],"择":[{"名":"够莲蓬","文":"你指尖一勾，摘下整枚莲蓬，随即整块冰往下塌。坠落的短瞬你翻过身，抓住崖下的冰棱，靠一条手臂吊着，另一只手死死攥莲蓬。上面绳子放下来，你被拖上去时，掌心全是血。莲蓬有八粒莲子，你分了两粒给救你的人，剩下的藏进玉瓶。","果":{"灵材":3,"修为":160,"气血":-16,"声望":3}},{"名":"先退回去","文":"你慢慢往回挪，一寸一寸，白线在扩大，但不追你。挪回岸上时，你听见那块冰整个落下去，落到很深的地方才响。你坐下来，手抖了很久。那两个散修没说什么，一起下山。莲还在崖上，第二年你再去，崖已经不见了。你没得到什么，只是那一夜睡得很沉。","果":{"道心":2,"气血":-4,"悟性":1,"寿元":2}},{"名":"拽住同伴","文":"你回头抓住那个踩塌雪的散修的衣领，用另一只手勾住冰棱。两个人一起吊在崖边，绳子从上面下来，第一次只够着一个人。你把他推了上去。第二次下来时，崖沿已经碎了。你被拖上来时，昏了很久。醒来怀里的莲蓬被人放好了，还有一件旧皮袍。","果":{"因果":3,"声望":8,"气血":-26,"灵材":2,"道心":2}}]},{"id":"beiming_042","题":"裂冰拳","类":"争斗","重":3,"域":["beiming"],"境界":[1,7],"段":["玄冥殿的裂冰拳不教招式，只教一件事：一拳打出去，打的是冰，不是人。{天象}，你在{地点}看见两个弟子对练，中间隔着一块半尺厚的冰。一个出拳，冰面裂出蛛网；另一个一掌按住，裂缝停住。两人都不说话，练完各自找地方坐下，手背上的皮全翻开了。","带你的执事弟子让你也打一块。你运足了气，一拳下去，冰裂了一道。他不点头也不摇头，只把冰立起来，指着裂缝说：裂口歪的，力从肩上来，没从脚上来。他让你再打，打到裂缝是直的为止。你打了七次，第八次时指骨裂了。","执事弟子把{器物}递过来，说拳可以停，也可以不停。不停的话，指骨裂了会自己长回去，但长回去的形状是歪的，以后再打，就觉得拳面有一块多余的骨头。他这话不是劝，只是说明。"],"择":[{"名":"继续打","文":"你打到第十八次，裂缝终于成了直线，冰面从中间分开，倒了。你的右拳手背鼓起一块，摸上去像贴了一枚硬钱。此后你的拳重了三分，出拳时骨头发响。玄冥殿的人见了这块骨头，就知道你练过裂冰拳。只有你自己知道，每逢下雨，它疼得让你握不住筷子。","果":{"修为":260,"气血":-22,"悟性":2,"声望":4,"寿元":-1}},{"名":"停手养骨","文":"你收起拳，回去用雪水泡手，泡了三夜。指骨自己长合了，长得很正。执事弟子第二天看了你的手，什么也没说，只把《裂冰拳》的第一页抄给了你，上面写着：能停的人，才配练第二式。你后来练得很慢，可练成的每一拳都是直的。","果":{"器物":1,"修为":120,"气血":6,"道心":2,"悟性":2}},{"名":"改拳为掌","文":"你不打拳，把手掌贴在冰面上按。按到手掌冻成白色，冰面从掌心往外裂。执事弟子看了很久，说这不是裂冰拳，这是你自己找着的路。他把你带到风口，让你按了整整一夜。你的掌心后来长出一层透明的硬皮，能握住烧红的铁，也能按住别人的刀。","果":{"修为":200,"悟性":4,"气血":-18,"道心":2}}]},{"id":"beiming_043","题":"沉钟湖底","类":"秘境","重":2,"域":["beiming"],"境界":[2,9],"段":["{地点}一年只有二十天不封冻，湖面结着薄冰，冰下很清，能看见湖底散着的钟，一口压着一口，钟身上结着白霜。{天象}，你在湖边砸开薄冰下水，水冷得像有人在剥你的皮，剥到第三层时你已经感觉不到自己的腿。","湖底有十几口钟，最大的一口倒扣着，钟沿下压着一具人形。人形的手从钟沿下伸出来，手里握着一卷用油布缠好的东西。你可以去够那卷东西，但钟沿下的水有古怪：靠近它的时候，你的血在皮下开始变慢，慢得让你看见自己的手变成青色。","你的气只够一炷香。够那一卷东西，就要在水下多待几十息；不碰它，现在上浮还来得及。湖面上的光在头顶晃，越来越远，越来越小。"],"择":[{"名":"潜到底","文":"你憋着气潜到钟沿，手指刚碰到油布卷，那具人形的手就松开了。你抱起油布卷往上浮，浮到一半，气已经空了，眼前一片黑，是被什么东西顶出水面的。上岸后你趴着咳了很久，咳出的水是黑的。油布卷里是半部《冰渊坐忘功》，字迹被水浸得发胀，仍能读。","果":{"器物":2,"修为":300,"气血":-32,"寿元":-4,"悟性":2}},{"名":"捞钟","文":"你不碰那卷东西，把最小的一口钟抱了上来。钟是青铜的，钟口有一圈刻痕。你把钟卖给了孤灯驿的私贩，得了不少灵石。夜里你把钟挂在帐里，风吹过它，会发一声极闷的响，响得让人恶心。第三天你把钟扔回了冰窟窿，钱已经花了一半。","果":{"灵石":200,"因果":-1,"魔念":1,"气血":-14}},{"名":"浮上去","文":"你没再多看一眼，转身往上游。浮出水面时，天已经黑了，你在冰窟窿边上抖成一团，抓着{器物}爬了半里才找着营地。当夜你梦见湖底那口钟倒了，钟沿下的人形站了起来，在水里慢慢走。第二天湖又封冻了，冰面上什么痕迹都没有。","果":{"道心":2,"寿元":2,"气血":-10,"悟性":1}}]},{"id":"beiming_044","题":"赤霄来客","类":"争斗","重":2,"域":["beiming"],"境界":[1,8],"段":["赤霄剑宗的弟子每年冬天来雪原历练一次，说是斩妖，其实是拿雪原上的活物试剑。{天象}，你在{地点}看见三个剑修围着一头霜甲熊，熊的背上已经插了两柄剑，站着不倒，血从伤口流出来，在雪上冻成红柱子。","剑修里领头的那个看上了你腰间的东西，问都不问就来取。你侧身避开，他的手停在半空，笑了一下，说雪原上的人不懂规矩。他拔剑，剑身在雪光下白得刺眼。他的两个同伴退开半步，这是他们的规矩：一对一，不帮手，也不算犯规。","霜甲熊忽然动了，一头撞向其中一个退开的剑修。那人的剑还插在熊背上，人仰倒在地。领头的剑修回头看了一眼，又转回来看着你，剑尖压得很低。他等于给了你一个选择：让开路，还是让开命。"],"择":[{"名":"打","文":"你在雪里滑了半步，让过第一剑，第二剑来的时候你抓住了剑脊，手心被割开，血立刻冻住。你顺势撞进他怀里，一脚踹在膝盖上。他倒了，站起来时脸色很难看，没再出第三剑，带着人走了。你手心的伤口一个冬天没合，合上之后留了一道很粗的疤。","果":{"修为":240,"声望":8,"气血":-20,"因果":-1,"灵石":40}},{"名":"让开","文":"你退了半步，把路让出来。他走过去，从你腰间取了想要的东西，又扔下一小袋灵石，说算买的。你没捡那袋灵石，转身走了。霜甲熊是猎盟的猎物，那天被三柄剑分了，熊胆被挖走。猎盟的人没说什么，只是在往后的冬天，不再给你留位置。","果":{"声望":-6,"气血":-2,"悟性":2,"道心":1}},{"名":"先救熊","文":"你不看剑修，转身去拖那头熊。熊的鼻息喷在你脸上，是热的。三个剑修被这一手弄愣了，倒地的那个还等着被扶。你把熊拖出三丈，熊倒下时压住你半条腿。剑修们走了，走时一句话都没留。猎盟分肉那天，给你留了熊的右前掌，这是最高的那一份。","果":{"声望":10,"因果":2,"道心":3,"灵材":2,"气血":-18}}]},{"id":"beiming_045","题":"冻掉的手指","类":"修行","重":2,"域":["beiming"],"境界":[2,9],"段":["到了金丹，肉身已经不惧寻常风雪，可一身的道还是会从最末的地方漏出去：手指、脚趾、耳廓。{天象}，你闭关到第九十一天，出关时才发现左手小指已经黑了。不是冻伤的红，是死透的黑，一按，皮就陷下去。","玄冥殿的老执灯人看了你的手，只说了一句：切掉，趁它还没上行。他把{器物}摆在你面前，又放了一小瓶药酒。他说金丹修士断一节指，三个月就能长回来，长得比原来还硬；但若拖着，烂到腕子，那这一身修为就要从腕子上废掉。","你自己看得见那条黑线：它停在指根，正在极慢地往上走，一夜不到半分。窗外雪光很亮。老执灯人握着自己的右手——他缺了三根指头，缺得很整齐。"],"择":[{"名":"自己切","文":"你把左手放在石台上，刀口对准指根，一刀剁下去。血喷在雪上，喷得很高。你把断指扔进火里，烧得噼啪响。药酒倒上去时你喊了一声，喊完就昏了。三个月后长出一节新指，硬得能戳裂冻土，只是长歪了一点，永远向内弯。","果":{"修为":320,"气血":-30,"寿元":-3,"道心":3,"悟性":2}},{"名":"以寒封毒","文":"你没切，把整只手按进雪里，再压上{灵材}，以寒制寒，让那条黑线停在原处。三个时辰后手指又活了，但从此它总是凉的，握东西时用不上力。这节指头后来救过你：曾有一枚毒针钉进指腹，毒被封在指内，没上行。你在殿里因此得了个外号，叫凉指。","果":{"气血":-12,"修为":180,"悟性":3,"道心":1,"寿元":-1}},{"名":"求人切","文":"你自己下不去手，把刀递给老执灯人。他看着你，看了很久，然后一刀切下。他的手法极快，血还没涌出来，伤口已经封住了。他把断指包进一块雪布里，说要替你埋在宫外的风口上，那里风口大，能吹干净。他没说为什么要埋。你三年后才知道，他缺的那三根指头，也是他自己求人切的。","果":{"修为":280,"气血":-26,"因果":1,"道心":2,"声望":3}}]},{"id":"beiming_046","题":"冰渊之下","类":"秘境","重":1,"域":["beiming"],"境界":[4,13],"段":["北冥冰渊的深处不是水，是更冷的东西。{天象}，你在{地点}沿着冰阶往下走，走了整整一日，脚下的冰变成了青黑色，四壁也不再反光，只有极偶尔的一闪，那是冰里有东西在动。空气里有一股铁锈味，闻久了舌根发苦。","走到第七日，冰壁里出现了人形的凹痕，一排一排，像是在冰里站过许多人，又都被剔掉了。最深处有一道横着的裂口，裂口里透出一线白，白得不属于这个世界。你贴近去听，听见里面有很沉很慢的搏动，一拍，两拍，接着是长久的静。","裂口边上结着一层薄薄的霜，霜上有字，笔画很大，写的是：莫要再往下。可裂口下还有一级冰阶，清清楚楚，像是留给人走的。你身上的骨节已经在响，那是极寒压到骨头里的声音。"],"择":[{"名":"再下一阶","文":"你踩了下去。那一瞬你听见的不是声音，是一种从骨头里出来的一声闷响，像什么东西在你体内合上了。白线扑面而来，你在白里站了很久，直到指甲开始一片片脱落。爬上来时你用了十四日，出渊时已不记得自己的名字，只记得那搏动的节拍。你的修为高得可怕，人也空了一块。","果":{"修为":600,"悟性":6,"气血":-60,"寿元":-12,"魔念":3}},{"名":"刻字回话","文":"你在霜字旁边用工整的笔法刻了一行：已知，回。刻完，那搏动停了很久，然后缓缓动了一下，像应了一声。你沿冰阶往上走，走到第三日，冰壁里的人形凹痕全都转了过来，朝着你的方向。此后你修寒法极快，也极容易被雪原上的东西认出来。","果":{"悟性":5,"修为":320,"因果":1,"道心":3,"气血":-25}},{"名":"转身便走","文":"你看了那三个字，就转身往上走。走了半日，背后的搏动忽然快起来，越来越快，急得像在追。你不敢停，走到脚底全是血。出渊时天正下着雪，雪落在你身上，竟有一瞬间是暖的。你在渊口跪了很久，把手里那盏{器物}留在了冰阶上，算是给人照路。","果":{"道心":4,"悟性":3,"寿元":2,"气血":-14,"修为":140}}]},{"id":"beiming_047","题":"冰河渡口","类":"争斗","重":3,"域":["beiming"],"境界":[0,5],"段":["九曲冰河一年只在这二十天里能渡，河面化了一半，剩下一半是浮冰。{天象}，你在{地点}的渡口等到天黑，才见一条窄船从对岸撑过来。船家是个没牙的老汉，收钱只收一样：要你从自己的行囊里挑一件扔进河里。","河中间浮着许多人的家当，冻在冰里，像一片被冻住的集市。老汉说，河要东西，不给就翻船，这是三十年的规矩。你身后还排着五个人，其中一个抱着孩子的女人已经把一枚银簪子扔下去了，簪子落水的声音很轻，孩子在她怀里一直没哭。","你的行囊里有{器物}，也有几块{灵材}。船到河心，冰在船底刮出声响，老汉把篙横在膝上，等你的动作。浮冰正在往船边挤，挤出的水漫过船板，很快就冻成一层薄壳。"],"择":[{"名":"扔器物","文":"你把{器物}扔进河里，落点很近，溅起的水星在船帮上冻成一圈白点。老汉点点头，篙子一撑，船稳了。靠岸时他多说了一句：冰河只认舍得的人。你上岸走了两步，忍不住回头看，浮冰下面有东西在动，一片一片，把那件东西往深处带。","果":{"器物":-1,"气血":5,"修为":80,"悟性":2}},{"名":"扔灵材","文":"你把几块{灵材}扔下去，浮冰上立刻结出新的白霜，霜纹往船边爬。老汉脸色变了，猛撑一篙，船歪了半边，抱孩子的女人险些落水。你抓住了她的胳膊。船靠岸时老汉没看你，说：河不收灵材，收了就不还了。你回头望，河心那片霜纹还在，像一张脸。","果":{"灵材":-2,"因果":-1,"气血":-8,"修为":60}},{"名":"什么也不扔","文":"你把行囊抱紧，什么也不扔。船到河心，冰从底部顶上来，一下，两下。老汉放下篙，自己跳进了河里，落水的声音很沉，之后什么也没有。船自己漂到了对岸。船上五个人，谁也没说话。你把船钱放在船头，收了那根篙，走了一夜才敢停。","果":{"道心":-2,"因果":-2,"魔念":1,"气血":-10,"灵石":40}}]},{"id":"beiming_048","题":"无声鬼僧","类":"奇闻","重":2,"域":["beiming"],"境界":[1,7],"段":["雪原上有一种东西不叫妖怪，叫无声鬼僧：裹着破僧袍，赤着脚，在风口上走，走近了也听不见脚步。{天象}，你在{地点}遇见一个，他朝你合十，嘴在动，一点声音也没有。你退了一步，他也跟着退了一步，始终和你隔着三丈。","老辈人说，这是那些闭口禅没修成的僧人，开口破了戒，冻死在雪里，念力还留着，就一直在雪原上走来走去，见人就合十，见人就念一段听不见的经。也有人说，跟它走上半里，人会忽然听懂那段经，懂了的当场坐下，坐下的就不起来了。","它忽然停下，抬起一只手，指向你身后的方向。你回头，什么也没有，雪原一片白。再转回来，它已经近了一丈，僧袍的下摆还在风里，没有声音。你可以站着不动，可以也朝它合十，也可以转身就走——它跟着你，跟到什么时候不知道。"],"择":[{"名":"也合十","文":"你朝它合十，弯了弯腰。它的嘴停住了，然后也弯下腰去，弯得很低，僧袍垂在雪上。它直起身，慢慢往后退，退出一丈，两丈，最后转过身走进风雪里，走的时候仍没有声音。你在原地站了很久，脑子里多了一段听不懂的经，像是留在舌根下的凉。","果":{"悟性":3,"道心":2,"修为":100,"因果":1}},{"名":"站着等","文":"你不动，等它走近。它走到一尺的地方停下，抬起手，在你眉心点了点。那一下很轻，却像有人从你脑子里抽走了一根线。它的嘴又动了，这次你听懂了半句：别坐。它转身走了。你后来在雪原上走了很多年，遇见想坐下的人就拉一把，从不多说。","果":{"悟性":4,"道心":3,"修为":140,"气血":-6}},{"名":"开口念经","文":"你张嘴，随便念了一段，声音在风里散得很快。它忽然不动了，然后慢慢转过身来，僧袍下没有脚。你看见它的脸，一张没有皮的脸。它朝你走了一步，你退了三步，转身就跑。跑出半里回头看，它站着没动，手里捧着一样东西——是你在跑的时候，从袖里掉出去的{器物}。","果":{"魔念":2,"悟性":2,"器物":-1,"气血":-12,"修为":80}}]},{"id":"beiming_049","题":"换命","类":"人情","重":3,"域":["beiming"],"境界":[0,6],"段":["雪原上的散修有个说法：命能换，换了就两不相欠。{天象}，你在{地点}遇见一个躺着的修士，脏腑受了重伤，冻血把袍子粘在雪上。他拉住你的裤脚，说可以拿一样东西换你背他走三十里，走到孤灯驿就活，走不到就两个人一起埋。","他许诺的东西是半部《寒髓淬骨法》的口诀，还有一枚能换不少灵石的{器物}。你看了看天，风正在起，还剩下不到一个时辰的光亮。三十里，背着一个人，在这样的雪里，谁都知道是什么分量。","他忽然又说了一句：其实不用背，你把我拖在雪橇上就行，我这条命比看上去轻。说完他自己笑了，笑到一半咳出一口血，血落在雪上，很快冻成一个暗红的点。他手上的力气一点点松了。"],"择":[{"名":"背他走","文":"你把他背上肩，走了三十里，中间歇了四次，每次他都还能说话。他说他年轻时也在雪原上背过一个人，那个人后来在别处死了。到孤灯驿时，他的脸已经和雪一个颜色。他给了你那半部口诀，还有那件器物，然后闭上眼。他没死，只是睡了三天。醒来后他一瘸一拐地走了，从此再没见。","果":{"修为":160,"器物":1,"因果":2,"道心":3,"气血":-22}},{"名":"讨价","文":"你先让他把口诀和器物都交出来，才动手背。他交了，笑了一下，笑得很淡。你背着他走了十五里，风起来了，你在雪窝里蹲了一夜。第二天他还在，你也还在。到孤灯驿时他给了你一块干肉，说这一路你不欠他的。他走得很快，伤口却已经结了硬壳。","果":{"修为":100,"器物":1,"因果":1,"气血":-14,"魔念":1}},{"名":"留下陪他","文":"你没有背他，也没有走。你坐下来，生了火，用{器物}挡风。他问你为什么不走，你说三十里走不到，火能挡一夜。他在火边睡了一夜，天亮时已经僵硬。你把他拖进雪沟，用石头压了个记号，然后往孤灯驿走。三天后你到了，没人知道你在这条路上停了多久。","果":{"道心":4,"因果":1,"气血":-10,"寿元":1,"悟性":1}}]},{"id":"beiming_050","题":"极夜的灯","类":"天象","重":2,"域":["beiming"],"境界":[1,8],"段":["雪原每年有九日极夜，日头不升，天是一种很深的蓝，极光一条一条挂在上面，像谁把一整匹布撕了。{天象}，你在{地点}守着最后一盏{器物}，灯油只够九日里的第六日。第五日之后，雪原上的声音开始变样：远的变近，近的变远。","极夜里人容易走错，也容易听见不该听的东西。老猎户说，这九日里不要在雪上留灯，留了就会有人顺着灯走来，走来的不一定是人。可第九日若一盏灯都没有，这一片雪原就会冻实，冻透，第二十条猎道就废了。","第六日夜里，油烧到最后一指，雪坡上出现了三个黑影，走得很慢，方向正对着灯。他们不喊，也不举火。你手边有一把雪铲，一囊剩油，还有一盏快灭的灯。"],"择":[{"名":"灭灯","文":"你把灯捂住，一口气吹灭。雪原一下子黑透了，连极光的绿都落不到地上。坡上那三个黑影停住，站了很久，然后一个一个往回退，退进蓝里。你在黑暗里坐着，听见自己牙齿在磕。第九日天亮时你还坐着，那三个人影的地方有三堆雪，堆得很整齐。","果":{"道心":3,"气血":-14,"悟性":2,"寿元":1}},{"名":"添油亮着","文":"你把最后的油全倒进去，灯亮得像一小团日头。三个黑影走到灯前十步，站住，不动了。天亮时他们散了，散成一地冰碴。你那盏灯从此再点不着。第二年极夜，有个老猎户说他看见猎道上亮着一盏灯，谁也不承认点过。","果":{"声望":8,"因果":2,"气血":-20,"修为":100}},{"名":"举灯迎去","文":"你端起灯，朝他们走过去。走近了才看清，三个都是往年守灯的人，脸上结着霜，眼睛里映着同一团光。你把灯放在他们中间，坐下来。他们围着你，谁都没说话。极夜过去时，灯油还有一指，你的头发白了一半，寿元被借走了几年，可你从此不怕黑。","果":{"寿元":-4,"悟性":4,"道心":3,"修为":220,"气血":-18}}]}]}},"codex":[{"类":"宗门","名":"寒山堂","区":"qinglan","文":"寒山堂不算大宗，山门只有五间屋、七十二口钟。掌门裴疏，修为不过金丹初成，却有一手绝活：识药。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了十二年，还越撑越稳。","引":"青岚域俗谚：「寒山堂的门槛，比山还高。」"},{"类":"功法","名":"《玄冰功》","区":"qinglan","文":"《玄冰功》，残本，存二十四页，缺首尾。据说是五年前一位阵修所创，专为心性不稳者而设。修法极险：每日以灵机冲一遍死穴。练成者进境极快，练废者沦为药人。此本现藏于青云宗，看管的人从不让人翻到最后一页。","引":"青岚域传言：「《玄冰功》一页，命一条。」"},{"类":"人物","名":"商之","区":"qinglan","文":"商之，青岚域山门考核人，少年时以猎户为业，二十四岁那年误入一处秘境，得了半部阵图。此后一百零八年，他从炼气一路修到元婴，却在渡劫时被同门所害。如今他在青云宗开了一间茶铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"青岚域人语：「商之若不入仙门，或可活到白头。」"},{"类":"人物","名":"裴长明","区":"qinglan","文":"裴长明，青岚域落雁谷人，少年时以药童为业，二十四岁那年误入一位散人的洞府，得了半部剑诀。此后十二年，他从筑基一路修到金丹，却在破境时被同门所害。如今他在散修开了一间卦摊，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"青岚域人语：「裴长明若不入仙门，或可活到白头。」"},{"类":"丹药","名":"续命丸","区":"qinglan","文":"续命丸，一位游方丹师所制，主药是赤砂，辅以一钱雷击木灰。成丹率不足两成，故价高。服之可续命三月，但会在梦里见到献药之人。青岚域的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「续命丸救急不救穷。」"},{"类":"风俗","名":"赛剑","区":"qinglan","文":"青岚域有赛剑之俗，每年开春举行，二十四年不曾中断。届时各家各户关门闭户。规矩有三条：不许提旧事；犯者逐出本域。外人多以为是热闹，本地人却说这是送客。老人们说，这俗是给活人看的，也是给死人看的。","引":"青岚域民谚：「赛剑一过，各安天命。」"},{"类":"人物","名":"钟离夜","区":"qinglan","文":"钟离夜，青岚域灵茶人，少年时以药童为业，五岁那年误入一场法会，得了半部阵图。此后七年，他从筑基一路修到金丹，却在斗法时伤了道基。如今他在青云宗开了一间铁匠铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"青岚域人语：「钟离夜若不入仙门，或可活到白头。」"},{"类":"法宝","名":"断剑","区":"qinglan","文":"此断剑出自一位无名器修之手，二十四年前流落青岚域。通体乌黑，入手极寒。据说持它的人可挡三剑，代价是此生不可再入宗门。如今它被一个不识货的货郎拿去压咸菜，知道来历的人都不敢去取。","引":"《青岚域异物志》：「断剑，凶物也，非命硬者不可近。」"},{"类":"风俗","名":"赶沙","区":"qinglan","文":"青岚域有赶沙之俗，每年冬至举行，一百零八年不曾中断。届时各家各户关门闭户。规矩有三条：不许提旧事；犯者三年不得入山。外人多以为是热闹，本地人却说这是壮胆。老人们说，这俗是给活人看的，也是给死人看的。","引":"青岚域民谚：「赶沙一过，各安天命。」"},{"类":"功法","名":"《焚天章》","区":"qinglan","文":"《焚天章》，残本，存九页，缺首尾。据说是十七年前一位魔修所创，专为灵根驳杂者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者沦为药人。此本现藏于落雁谷，看管的人从不让人翻到最后一页。","引":"青岚域传言：「《焚天章》一页，命一条。」"},{"类":"地理","名":"无字碑林北坡","区":"qinglan","文":"青岚域山门考核之间有一处无字碑林北坡，本地人说不清它是哪一年有的。山志只记了一句：十七年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了九日，最后只抬回三具尸首。此处日光不至，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《青岚域风土记》：「山门考核多异，无字碑林北坡为最。」"},{"类":"法宝","名":"断剑·11","区":"qinglan","文":"此断剑出自百炼山之手，二十四年前流落青岚域。通体乌黑，见血则鸣。据说持它的人可挡三剑，代价是此生不可再入宗门。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《青岚域异物志》：「断剑，凶物也，非命硬者不可近。」"},{"类":"异兽","名":"白骨行者","区":"qinglan","文":"白骨行者，二阶妖兽，出没于青岚域落雁谷一带。形如犬而三尾，喜食腐肉。猎人若能取其骨，可换二十四块灵石。但它成群而居，三年来折在它口中的猎户不下七十二人。当地人说，见它须先敬一碗酒，否则必死。","引":"青岚域猎谚：「宁遇虎，莫遇白骨行者。」"},{"类":"地理","名":"无字碑林","区":"qinglan","文":"青岚域散修之间有一处无字碑林，本地人说不清它是哪一年有的。山志只记了一句：七年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了三百日，最后只抬回九具尸首。此处寸草不生，走过的人都说脚底发凉。有游方道人来看过，说底下压着一条旧脉，动不得。","引":"《青岚域风土记》：「散修多异，无字碑林为最。」"},{"类":"宗门","名":"落雁堂","区":"qinglan","文":"落雁堂不算大宗，山门只有三百间屋、八十一口钟。掌门程真，修为不过元婴初期，却有一手绝活：做买卖。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了五年，还越撑越稳。","引":"青岚域俗谚：「落雁堂的门槛，比山还高。」"},{"类":"风俗","名":"问茶","区":"qinglan","文":"青岚域有问茶之俗，每年端午举行，三十六年不曾中断。届时宗门弟子列队上山。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是问路。老人们说，这俗是给活人看的，也是给死人看的。","引":"青岚域民谚：「问茶一过，各安天命。」"},{"类":"风俗","名":"赶沙·16","区":"qinglan","文":"青岚域有赶沙之俗，每年中秋举行，二十四年不曾中断。届时镇上摆三日流水席。规矩有三条：不许在夜里点灯；犯者罚灵石三百。外人多以为是热闹，本地人却说这是问路。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"青岚域民谚：「赶沙一过，各安天命。」"},{"类":"功法","名":"《万蛊解》","区":"qinglan","文":"《万蛊解》，残本，存七十二页，缺首尾。据说是四十九年前一位丹修所创，专为寿元将尽者而设。修法极险：要以自身精血养一道符。练成者进境极快，练废者化为血水。此本现藏于黑水堂，看管的人从不让人翻到最后一页。","引":"青岚域传言：「《万蛊解》一页，命一条。」"},{"类":"宗门","名":"丹霞寺","区":"qinglan","文":"丹霞寺不算大宗，山门只有三十六间屋、七十二口钟。掌门段舟，修为不过元婴初期，却有一手绝活：铸剑。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了五年，还越撑越稳。","引":"青岚域俗谚：「丹霞寺的门槛，比山还高。」"},{"类":"风俗","名":"祭山","区":"qinglan","文":"青岚域有祭山之俗，每年开春举行，三百年不曾中断。届时所有人都要说一句实话。规矩有三条：不许提旧事；犯者罚灵石三百。外人多以为是热闹，本地人却说这是问路。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"青岚域民谚：「祭山一过，各安天命。」"},{"类":"地理","名":"望仙台","区":"yunmeng","文":"云梦泽雾岛之间有一处望仙台，本地人说不清它是哪一年有的。山志只记了一句：十七年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了三百日，最后只抬回四十九具尸首。此处终年积水，走过的人都说脚底发凉。有游方道人来看过，说底下压着一条旧脉，动不得。","引":"《云梦泽风土记》：「雾岛多异，望仙台为最。」"},{"类":"异兽","名":"山魈","区":"yunmeng","文":"山魈，一阶妖兽，出没于云梦泽沉船一带。形如犬而三尾，喜食腐肉。猎人若能取其尾羽，可换二十四块灵石。但它成群而居，五年来折在它口中的猎户不下三人。当地人说，见它须先敬一碗酒，否则必死。","引":"云梦泽猎谚：「宁遇虎，莫遇山魈。」"},{"类":"法宝","名":"古镜","区":"yunmeng","文":"此古镜出自藏锋阁之手，三百年前流落云梦泽。通体泛白，入手极寒。据说持它的人可窥人心一念，代价是持宝者不得善终。如今它被一个不识货的货郎拿去压咸菜，知道来历的人都不敢去取。","引":"《云梦泽异物志》：「古镜，凶物也，非命硬者不可近。」"},{"类":"丹药","名":"回春丹","区":"yunmeng","文":"回春丹，一位游方丹师所制，主药是冰魄花，辅以一枚妖兽内丹。成丹率不足两成，故价高。服之可洗去一身丹毒，但一生只能服一次。云梦泽的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「回春丹救急不救穷。」"},{"类":"风俗","名":"走阴","区":"yunmeng","文":"云梦泽有走阴之俗，每年端午举行，三年不曾中断。届时镇上摆三日流水席。规矩有三条：不许提旧事；犯者罚灵石三百。外人多以为是热闹，本地人却说这是送客。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"云梦泽民谚：「走阴一过，各安天命。」"},{"类":"宗门","名":"蓬莱殿","区":"yunmeng","文":"蓬莱殿不算大宗，山门只有三间屋、三十六口钟。掌门顾真，修为不过元婴初期，却有一手绝活：识药。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了三年，还越撑越稳。","引":"云梦泽俗谚：「蓬莱殿的门槛，比山还高。」"},{"类":"地理","名":"旧渡口","区":"yunmeng","文":"云梦泽水镜之间有一处旧渡口，本地人说不清它是哪一年有的。山志只记了一句：五百年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了二十四日，最后只抬回三具尸首。此处寸草不生，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《云梦泽风土记》：「水镜多异，旧渡口为最。」"},{"类":"丹药","名":"引雷丹","区":"yunmeng","文":"引雷丹，一位游方丹师所制，主药是冰魄花，辅以一枚妖兽内丹。成丹率不足一成，故价高。服之可强破一境，但会在梦里见到献药之人。云梦泽的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「引雷丹救急不救穷。」"},{"类":"法宝","名":"铜灯","区":"yunmeng","文":"此铜灯出自藏锋阁之手，三百年前流落云梦泽。通体泛白，触之微温。据说持它的人能避一次雷劫，代价是用满九次必遭反噬。如今它被一个不识货的货郎拿去压咸菜，知道来历的人都不敢去取。","引":"《云梦泽异物志》：「铜灯，凶物也，非命硬者不可近。」"},{"类":"丹药","名":"换血丹","区":"yunmeng","文":"换血丹，青木谷所制，主药是紫芝，辅以一钱雷击木灰。成丹率不足一成，故价高。服之可忘一段旧事，但必以同等寿元相抵。云梦泽的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「换血丹救急不救穷。」"},{"类":"功法","名":"《焚天章》","区":"yunmeng","文":"《焚天章》，残本，存九页，缺首尾。据说是九年前一位阵修所创，专为寿元将尽者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者疯癫而死。此本现藏于月华，看管的人从不让人翻到最后一页。","引":"云梦泽传言：「《焚天章》一页，命一条。」"},{"类":"地理","名":"古驿道下院","区":"yunmeng","文":"云梦泽水镜之间有一处古驿道下院，本地人说不清它是哪一年有的。山志只记了一句：九年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了七十二日，最后只抬回九具尸首。此处风声如哭，走过的人都说脚底发凉。山民在此立过一块无字碑，碑面被摸得发亮。","引":"《云梦泽风土记》：「水镜多异，古驿道下院为最。」"},{"类":"宗门","名":"万剑观","区":"yunmeng","文":"万剑观不算大宗，山门只有十二间屋、九口钟。掌门陆松，修为不过金丹初成，却有一手绝活：看相。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了八十一年，还越撑越稳。","引":"云梦泽俗谚：「万剑观的门槛，比山还高。」"},{"类":"异兽","名":"纸人","区":"yunmeng","文":"纸人，三阶妖兽，出没于云梦泽沧浪剑派一带。形如犬而三尾，昼伏夜出。猎人若能取其内丹，可换四十九块灵石。但它能幻化人形，三年来折在它口中的猎户不下一百零八人。当地人说，见它要喊它的名字，否则必死。","引":"云梦泽猎谚：「宁遇虎，莫遇纸人。」"},{"类":"功法","名":"《皇极经》","区":"yunmeng","文":"《皇极经》，残本，存五百页，缺首尾。据说是三十六年前一位阵修所创，专为心性不稳者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者疯癫而死。此本现藏于沉船，看管的人从不让人翻到最后一页。","引":"云梦泽传言：「《皇极经》一页，命一条。」"},{"类":"法宝","名":"铁铃","区":"yunmeng","文":"此铁铃出自一位无名器修之手，十七年前流落云梦泽。通体乌黑，敲之有钟声。据说持它的人能避一次雷劫，代价是用满九次必遭反噬。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《云梦泽异物志》：「铁铃，凶物也，非命硬者不可近。」"},{"类":"宗门","名":"寒山观","区":"yunmeng","文":"寒山观不算大宗，山门只有十二间屋、三十六口钟。掌门苏照，修为不过元婴初期，却有一手绝活：铸剑。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了七十二年，还越撑越稳。","引":"云梦泽俗谚：「寒山观的门槛，比山还高。」"},{"类":"人物","名":"林眠","区":"yunmeng","文":"林眠，云梦泽镜心岛人，少年时以渔户为业，二十四岁那年误入一场法会，得了半部符书。此后三年，他从筑基一路修到元婴，却在斗法时为救一人耗尽修为。如今他在沉船开了一间卦摊，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"云梦泽人语：「林眠若不入仙门，或可活到白头。」"},{"类":"丹药","名":"引雷丹·18","区":"yunmeng","文":"引雷丹，青木谷所制，主药是云苔，辅以三滴精血。成丹率不足两成，故价高。服之可忘一段旧事，但服后三日不能运气。云梦泽的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「引雷丹救急不救穷。」"},{"类":"地理","名":"望仙台北坡","区":"yunmeng","文":"云梦泽听涛崖之间有一处望仙台北坡，本地人说不清它是哪一年有的。山志只记了一句：五百年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了二十四日，最后只抬回九具尸首。此处寸草不生，走过的人都说脚底发凉。有游方道人来看过，说底下压着一条旧脉，动不得。","引":"《云梦泽风土记》：「听涛崖多异，望仙台北坡为最。」"},{"类":"功法","名":"《青木经》","区":"luoxia","文":"《青木经》，残本，存三十六页，缺首尾。据说是五百年前一位阵修所创，专为灵根驳杂者而设。修法极险：要以自身精血养一道符。练成者战力远超同阶，练废者疯癫而死。此本现藏于丹霞观，看管的人从不让人翻到最后一页。","引":"落霞山脉传言：「《青木经》一页，命一条。」"},{"类":"丹药","名":"换血丹","区":"luoxia","文":"换血丹，一位游方丹师所制，主药是青莲，辅以三滴精血。成丹率不足一成，故价高。服之可强破一境，但会在梦里见到献药之人。落霞山脉的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「换血丹救急不救穷。」"},{"类":"风俗","名":"祭山","区":"luoxia","文":"落霞山脉有祭山之俗，每年中秋举行，二十四年不曾中断。届时各家各户关门闭户。规矩有三条：不许提旧事；犯者逐出本域。外人多以为是热闹，本地人却说这是还债。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"落霞山脉民谚：「祭山一过，各安天命。」"},{"类":"丹药","名":"忘忧散","区":"luoxia","文":"忘忧散，丹霞观所制，主药是雷木，辅以半两阴土。成丹率不足三成，故价高。服之可续命三月，但服后三日不能运气。落霞山脉的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「忘忧散救急不救穷。」"},{"类":"功法","名":"《青木经》·4","区":"luoxia","文":"《青木经》，残本，存三页，缺首尾。据说是十七年前一位丹修所创，专为心性不稳者而设。修法极险：每日以灵机冲一遍死穴。练成者进境极快，练废者经脉尽断。此本现藏于剑冢，看管的人从不让人翻到最后一页。","引":"落霞山脉传言：「《青木经》一页，命一条。」"},{"类":"人物","名":"晏松","区":"luoxia","文":"晏松，落霞山脉赤岩人，少年时以渔户为业，三岁那年误入一位散人的洞府，得了半部丹方。此后七十二年，他从筑基一路修到元婴，却在斗法时为救一人耗尽修为。如今他在炉火开了一间私塾，绝口不提当年。有人问起，他只笑：当年那半部书，害我半生。","引":"落霞山脉人语：「晏松若不入仙门，或可活到白头。」"},{"类":"秘闻","名":"半张地图","区":"luoxia","文":"落霞山脉有一桩旧事：九年前，一整支商队在金乌失踪，只留下半张地图。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。后来有人在别处见过其中一人，容貌未变，问他姓名却答不上来。此事在落霞山脉不算秘密，只是没人愿意在夜里提起。","引":"《落霞山脉琐闻》：「半张地图在，旧事便不算完。」"},{"类":"异兽","名":"食铁兽","区":"luoxia","文":"食铁兽，三阶妖兽，出没于落霞山脉断剑一带。形如人而立行，喜食腐肉。猎人若能取其尾羽，可换三百块灵石。但它极记仇，五百年来折在它口中的猎户不下七人。当地人说，见它须先敬一碗酒，否则必死。","引":"落霞山脉猎谚：「宁遇虎，莫遇食铁兽。」"},{"类":"人物","名":"商川","区":"luoxia","文":"商川，落霞山脉炉火人，少年时以猎户为业，九岁那年误入一场法会，得了半部剑诀。此后四十九年，他从筑基一路修到金丹，却在斗法时被同门所害。如今他在剑冢开了一间卦摊，绝口不提当年。有人问起，他只笑：修仙？修的是命。","引":"落霞山脉人语：「商川若不入仙门，或可活到白头。」"},{"类":"异兽","名":"赤目蝠","区":"luoxia","文":"赤目蝠，三阶妖兽，出没于落霞山脉断剑一带。形如犬而三尾，昼伏夜出。猎人若能取其眼，可换三十六块灵石。但它成群而居，一百零八年来折在它口中的猎户不下八十一人。当地人说，见它不可与它对视，否则必死。","引":"落霞山脉猎谚：「宁遇虎，莫遇赤目蝠。」"},{"类":"法宝","名":"铁铃","区":"luoxia","文":"此铁铃出自一位无名器修之手，八十一年前流落落霞山脉。通体青灰，见血则鸣。据说持它的人可窥人心一念，代价是每用一次折寿一年。如今它被一个不识货的货郎拿去压咸菜，知道来历的人都不敢去取。","引":"《落霞山脉异物志》：「铁铃，凶物也，非命硬者不可近。」"},{"类":"异兽","名":"青蛟","区":"luoxia","文":"青蛟，二阶妖兽，出没于落霞山脉剑冢一带。形如鱼而双翼，畏火。猎人若能取其内丹，可换五百块灵石。但它会学人语，四十九年来折在它口中的猎户不下四十九人。当地人说，见它要喊它的名字，否则必死。","引":"落霞山脉猎谚：「宁遇虎，莫遇青蛟。」"},{"类":"异兽","名":"纸人","区":"luoxia","文":"纸人，一阶妖兽，出没于落霞山脉雷雨一带。形如鱼而双翼，喜食腐肉。猎人若能取其内丹，可换一百零八块灵石。但它能幻化人形，十二年来折在它口中的猎户不下三十六人。当地人说，见它要喊它的名字，否则必死。","引":"落霞山脉猎谚：「宁遇虎，莫遇纸人。」"},{"类":"秘闻","名":"旧钟","区":"luoxia","文":"落霞山脉有一桩旧事：十七年前，一位元婴老祖在丹香失踪，只留下旧钟。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。那块碑至今无人敢拓，拓过的人都说夜里听见有人敲门。此事在落霞山脉不算秘密，只是没人愿意在夜里提起。","引":"《落霞山脉琐闻》：「旧钟在，旧事便不算完。」"},{"类":"人物","名":"晏微","区":"luoxia","文":"晏微，落霞山脉丹霞观人，少年时以挑夫为业，二十四岁那年误入一座古墓，得了半部阵图。此后八十一年，他从筑基一路修到金丹，却在渡劫时为救一人耗尽修为。如今他在百炼山开了一间茶铺，绝口不提当年。有人问起，他只笑：当年那半部书，害我半生。","引":"落霞山脉人语：「晏微若不入仙门，或可活到白头。」"},{"类":"宗门","名":"寒山堂","区":"luoxia","文":"寒山堂不算大宗，山门只有三十六间屋、三十六口钟。掌门陆舟，修为不过金丹初成，却有一手绝活：铸剑。门中规矩极怪，入门先扫三年地。外人都说这门派撑不过十年，可它偏偏撑了七年，还越撑越稳。","引":"落霞山脉俗谚：「寒山堂的门槛，比山还高。」"},{"类":"宗门","名":"太虚阁","区":"luoxia","文":"太虚阁不算大宗，山门只有四十九间屋、十七口钟。掌门姜山，修为不过元婴初期，却有一手绝活：铸剑。门中规矩极怪，弟子不许在夜间练功。外人都说这门派撑不过十年，可它偏偏撑了七年，还越撑越稳。","引":"落霞山脉俗谚：「太虚阁的门槛，比山还高。」"},{"类":"宗门","名":"星枢楼","区":"luoxia","文":"星枢楼不算大宗，山门只有二十四间屋、三百口钟。掌门商舟，修为不过元婴初期，却有一手绝活：做买卖。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了二十四年，还越撑越稳。","引":"落霞山脉俗谚：「星枢楼的门槛，比山还高。」"},{"类":"丹药","名":"破障丹","区":"luoxia","文":"破障丹，青木谷所制，主药是雷木，辅以半两阴土。成丹率不足两成，故价高。服之可强破一境，但服后三日不能运气。落霞山脉的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「破障丹救急不救穷。」"},{"类":"法宝","名":"玉牌","区":"luoxia","文":"此玉牌出自百炼山之手，十二年前流落落霞山脉。通体暗红，触之微温。据说持它的人能避一次雷劫，代价是持宝者不得善终。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《落霞山脉异物志》：「玉牌，凶物也，非命硬者不可近。」"},{"类":"人物","名":"秦寒","区":"nanjiang","文":"秦寒，南疆蛊林万蛊门人，少年时以账房为业，三岁那年误入一场法会，得了半部阵图。此后三年，他从炼气一路修到金丹，却在斗法时为救一人耗尽修为。如今他在蛊皿开了一间卦摊，绝口不提当年。有人问起，他只笑：当年那半部书，害我半生。","引":"南疆蛊林人语：「秦寒若不入仙门，或可活到白头。」"},{"类":"功法","名":"《引雷篇》","区":"nanjiang","文":"《引雷篇》，残本，存十二页，缺首尾。据说是十七年前一位丹修所创，专为根骨平庸者而设。修法极险：每日以灵机冲一遍死穴。练成者可越阶而战，练废者沦为药人。此本现藏于瘴气，看管的人从不让人翻到最后一页。","引":"南疆蛊林传言：「《引雷篇》一页，命一条。」"},{"类":"丹药","名":"续命丸","区":"nanjiang","文":"续命丸，丹霞观所制，主药是星尘，辅以三滴精血。成丹率不足三成，故价高。服之可强破一境，但必以同等寿元相抵。南疆蛊林的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「续命丸救急不救穷。」"},{"类":"丹药","名":"驻颜丹","区":"nanjiang","文":"驻颜丹，丹霞观所制，主药是紫芝，辅以三滴精血。成丹率不足一成，故价高。服之可续命三月，但会在梦里见到献药之人。南疆蛊林的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「驻颜丹救急不救穷。」"},{"类":"宗门","名":"赤霄寺","区":"nanjiang","文":"赤霄寺不算大宗，山门只有五间屋、五百口钟。掌门林衍，修为不过元婴初期，却有一手绝活：画符。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了一百零八年，还越撑越稳。","引":"南疆蛊林俗谚：「赤霄寺的门槛，比山还高。」"},{"类":"法宝","名":"木匣","区":"nanjiang","文":"此木匣出自一位无名器修之手，一百零八年前流落南疆蛊林。通体泛白，见血则鸣。据说持它的人能避一次雷劫，代价是每用一次折寿一年。如今它被一个不识货的货郎拿去压咸菜，知道来历的人都不敢去取。","引":"《南疆蛊林异物志》：「木匣，凶物也，非命硬者不可近。」"},{"类":"人物","名":"柳微","区":"nanjiang","文":"柳微，南疆蛊林斗蛊人，少年时以账房为业，一百零八岁那年误入一位散人的洞府，得了半部剑诀。此后七年，他从炼气一路修到元婴，却在渡劫时被同门所害。如今他在蛊皿开了一间茶铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"南疆蛊林人语：「柳微若不入仙门，或可活到白头。」"},{"类":"法宝","名":"罗盘","区":"nanjiang","文":"此罗盘出自百炼山之手，四十九年前流落南疆蛊林。通体青灰，触之微温。据说持它的人能在梦中杀人，代价是持宝者不得善终。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《南疆蛊林异物志》：「罗盘，凶物也，非命硬者不可近。」"},{"类":"功法","名":"《万蛊解》","区":"nanjiang","文":"《万蛊解》，残本，存二十四页，缺首尾。据说是三百年前一位丹修所创，专为灵根驳杂者而设。修法极险：要以自身精血养一道符。练成者可越阶而战，练废者沦为药人。此本现藏于菌毯，看管的人从不让人翻到最后一页。","引":"南疆蛊林传言：「《万蛊解》一页，命一条。」"},{"类":"人物","名":"许辰","区":"nanjiang","文":"许辰，南疆蛊林蛊皿人，少年时以挑夫为业，一百零八岁那年误入一处秘境，得了半部符书。此后五百年，他从炼气一路修到元婴，却在斗法时伤了道基。如今他在菌毯开了一间卦摊，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"南疆蛊林人语：「许辰若不入仙门，或可活到白头。」"},{"类":"地理","名":"无字碑林北坡","区":"nanjiang","文":"南疆蛊林万蛊门之间有一处无字碑林北坡，本地人说不清它是哪一年有的。山志只记了一句：十二年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了五日，最后只抬回五具尸首。此处日光不至，走过的人都说脚底发凉。有游方道人来看过，说底下压着一条旧脉，动不得。","引":"《南疆蛊林风土记》：「万蛊门多异，无字碑林北坡为最。」"},{"类":"丹药","名":"忘忧散","区":"nanjiang","文":"忘忧散，青木谷所制，主药是剑心草，辅以半两阴土。成丹率不足三成，故价高。服之可续命三月，但服后三日不能运气。南疆蛊林的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「忘忧散救急不救穷。」"},{"类":"异兽","名":"白骨行者","区":"nanjiang","文":"白骨行者，二阶妖兽，出没于南疆蛊林青木谷一带。形如人而立行，畏火。猎人若能取其骨，可换三十六块灵石。但它能幻化人形，七年来折在它口中的猎户不下一百零八人。当地人说，见它不可与它对视，否则必死。","引":"南疆蛊林猎谚：「宁遇虎，莫遇白骨行者。」"},{"类":"丹药","名":"忘忧散·13","区":"nanjiang","文":"忘忧散，丹霞观所制，主药是云苔，辅以一枚妖兽内丹。成丹率不足三成，故价高。服之可强破一境，但会在梦里见到献药之人。南疆蛊林的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「忘忧散救急不救穷。」"},{"类":"法宝","名":"铜灯","区":"nanjiang","文":"此铜灯出自百炼山之手，五百年前流落南疆蛊林。通体乌黑，入手极寒。据说持它的人可窥人心一念，代价是此生不可再入宗门。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《南疆蛊林异物志》：「铜灯，凶物也，非命硬者不可近。」"},{"类":"秘闻","名":"空棺","区":"nanjiang","文":"南疆蛊林有一桩旧事：十二年前，一位元婴老祖在斗蛊失踪，只留下空棺。官面说法是遇了妖兽，私底下却传得更邪：说他们走进了同一座山门却再没出来。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在南疆蛊林不算秘密，只是没人愿意在夜里提起。","引":"《南疆蛊林琐闻》：「空棺在，旧事便不算完。」"},{"类":"人物","名":"萧望","区":"nanjiang","文":"萧望，南疆蛊林祖灵人，少年时以药童为业，十二岁那年误入一座古墓，得了半部丹方。此后十二年，他从筑基一路修到元婴，却在斗法时为救一人耗尽修为。如今他在本命蛊开了一间铁匠铺，绝口不提当年。有人问起，他只笑：修仙？修的是命。","引":"南疆蛊林人语：「萧望若不入仙门，或可活到白头。」"},{"类":"地理","名":"枯井北坡","区":"nanjiang","文":"南疆蛊林斗蛊之间有一处枯井北坡，本地人说不清它是哪一年有的。山志只记了一句：三十六年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了七十二日，最后只抬回一百零八具尸首。此处寸草不生，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《南疆蛊林风土记》：「斗蛊多异，枯井北坡为最。」"},{"类":"宗门","名":"万蛊楼","区":"nanjiang","文":"万蛊楼不算大宗，山门只有七十二间屋、三百口钟。掌门白微，修为不过元婴初期，却有一手绝活：布阵。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了九年，还越撑越稳。","引":"南疆蛊林俗谚：「万蛊楼的门槛，比山还高。」"},{"类":"风俗","名":"祭山","区":"nanjiang","文":"南疆蛊林有祭山之俗，每年清明举行，三百年不曾中断。届时镇上摆三日流水席。规矩有三条：不许在夜里点灯；犯者逐出本域。外人多以为是热闹，本地人却说这是送客。老人们说，这俗是给活人看的，也是给死人看的。","引":"南疆蛊林民谚：「祭山一过，各安天命。」"},{"类":"秘闻","名":"旧钟","区":"beiming","文":"北冥雪原有一桩旧事：三年前，三名散修在极光失踪，只留下旧钟。官面说法是遇了妖兽，私底下却传得更邪：说他们临行前都收到过一封没有落款的信。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在北冥雪原不算秘密，只是没人愿意在夜里提起。","引":"《北冥雪原琐闻》：「旧钟在，旧事便不算完。」"},{"类":"法宝","名":"古镜","区":"beiming","文":"此古镜出自一位无名器修之手，三年前流落北冥雪原。通体泛白，敲之有钟声。据说持它的人能在梦中杀人，代价是每用一次折寿一年。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《北冥雪原异物志》：「古镜，凶物也，非命硬者不可近。」"},{"类":"人物","名":"皇甫砚","区":"beiming","文":"皇甫砚，北冥雪原冻原人，少年时以账房为业，五百岁那年误入一位散人的洞府，得了半部符书。此后四十九年，他从筑基一路修到金丹，却在渡劫时被同门所害。如今他在寒山寺开了一间铁匠铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"北冥雪原人语：「皇甫砚若不入仙门，或可活到白头。」"},{"类":"地理","名":"雾谷外滩","区":"beiming","文":"北冥雪原雪魄之间有一处雾谷外滩，本地人说不清它是哪一年有的。山志只记了一句：十七年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了八十一日，最后只抬回十二具尸首。此处寸草不生，走过的人都说脚底发凉。山民在此立过一块无字碑，碑面被摸得发亮。","引":"《北冥雪原风土记》：「雪魄多异，雾谷外滩为最。」"},{"类":"异兽","名":"腐傀","区":"beiming","文":"腐傀，一阶妖兽，出没于北冥雪原冰渊一带。形如鱼而双翼，昼伏夜出。猎人若能取其眼，可换八十一块灵石。但它能幻化人形，八十一年来折在它口中的猎户不下五人。当地人说，见它不可与它对视，否则必死。","引":"北冥雪原猎谚：「宁遇虎，莫遇腐傀。」"},{"类":"丹药","名":"回春丹","区":"beiming","文":"回春丹，一位游方丹师所制，主药是青莲，辅以一枚妖兽内丹。成丹率不足两成，故价高。服之可忘一段旧事，但一生只能服一次。北冥雪原的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「回春丹救急不救穷。」"},{"类":"丹药","名":"破障丹","区":"beiming","文":"破障丹，丹霞观所制，主药是月露，辅以一钱雷击木灰。成丹率不足一成，故价高。服之可续命三月，但会在梦里见到献药之人。北冥雪原的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「破障丹救急不救穷。」"},{"类":"功法","名":"《碎星诀》","区":"beiming","文":"《碎星诀》，残本，存三页，缺首尾。据说是八十一年前一位阵修所创，专为寿元将尽者而设。修法极险：必先散尽一半修为。练成者进境极快，练废者疯癫而死。此本现藏于寒山寺，看管的人从不让人翻到最后一页。","引":"北冥雪原传言：「《碎星诀》一页，命一条。」"},{"类":"秘闻","名":"夜半歌","区":"beiming","文":"北冥雪原有一桩旧事：五百年前，三名散修在猎盟失踪，只留下夜半歌。官面说法是遇了妖兽，私底下却传得更邪：说他们走进了同一座山门却再没出来。那块碑至今无人敢拓，拓过的人都说夜里听见有人敲门。此事在北冥雪原不算秘密，只是没人愿意在夜里提起。","引":"《北冥雪原琐闻》：「夜半歌在，旧事便不算完。」"},{"类":"丹药","名":"驻颜丹","区":"beiming","文":"驻颜丹，丹霞观所制，主药是星尘，辅以一钱雷击木灰。成丹率不足两成，故价高。服之可强破一境，但会在梦里见到献药之人。北冥雪原的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「驻颜丹救急不救穷。」"},{"类":"功法","名":"《玄冰功》","区":"beiming","文":"《玄冰功》，残本，存七十二页，缺首尾。据说是九年前一位魔修所创，专为心性不稳者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者疯癫而死。此本现藏于雪魄，看管的人从不让人翻到最后一页。","引":"北冥雪原传言：「《玄冰功》一页，命一条。」"},{"类":"功法","名":"《玄阴录》","区":"beiming","文":"《玄阴录》，残本，存二十四页，缺首尾。据说是四十九年前一位丹修所创，专为寿元将尽者而设。修法极险：每日以灵机冲一遍死穴。练成者战力远超同阶，练废者疯癫而死。此本现藏于冻原，看管的人从不让人翻到最后一页。","引":"北冥雪原传言：「《玄阴录》一页，命一条。」"},{"类":"秘闻","名":"缺页账本","区":"beiming","文":"北冥雪原有一桩旧事：十七年前，一个外乡货郎在冰层失踪，只留下缺页账本。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。那块碑至今无人敢拓，拓过的人都说夜里听见有人敲门。此事在北冥雪原不算秘密，只是没人愿意在夜里提起。","引":"《北冥雪原琐闻》：「缺页账本在，旧事便不算完。」"},{"类":"法宝","名":"木匣","区":"beiming","文":"此木匣出自藏锋阁之手，八十一年前流落北冥雪原。通体泛白，见血则鸣。据说持它的人可挡三剑，代价是持宝者不得善终。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《北冥雪原异物志》：「木匣，凶物也，非命硬者不可近。」"},{"类":"宗门","名":"万蛊观","区":"beiming","文":"万蛊观不算大宗，山门只有二十四间屋、七口钟。掌门韩尘，修为不过金丹初成，却有一手绝活：铸剑。门中规矩极怪，弟子不许在夜间练功。外人都说这门派撑不过十年，可它偏偏撑了七十二年，还越撑越稳。","引":"北冥雪原俗谚：「万蛊观的门槛，比山还高。」"},{"类":"秘闻","名":"井底人","区":"beiming","文":"北冥雪原有一桩旧事：四十九年前，一位元婴老祖在雪魄失踪，只留下井底人。官面说法是遇了妖兽，私底下却传得更邪：说他们临行前都收到过一封没有落款的信。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在北冥雪原不算秘密，只是没人愿意在夜里提起。","引":"《北冥雪原琐闻》：「井底人在，旧事便不算完。」"},{"类":"功法","名":"《万蛊解》","区":"beiming","文":"《万蛊解》，残本，存十二页，缺首尾。据说是一百零八年前一位阵修所创，专为灵根驳杂者而设。修法极险：需在雷雨天引雷入体。练成者可越阶而战，练废者沦为药人。此本现藏于玄冥殿，看管的人从不让人翻到最后一页。","引":"北冥雪原传言：「《万蛊解》一页，命一条。」"},{"类":"秘闻","名":"无字碑","区":"beiming","文":"北冥雪原有一桩旧事：五百年前，一整支商队在寒山寺失踪，只留下无字碑。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在北冥雪原不算秘密，只是没人愿意在夜里提起。","引":"《北冥雪原琐闻》：「无字碑在，旧事便不算完。」"},{"类":"功法","名":"《玄冰功》·18","区":"beiming","文":"《玄冰功》，残本，存三百页，缺首尾。据说是三百年前一位丹修所创，专为心性不稳者而设。修法极险：每日以灵机冲一遍死穴。练成者战力远超同阶，练废者疯癫而死。此本现藏于玄冥殿，看管的人从不让人翻到最后一页。","引":"北冥雪原传言：「《玄冰功》一页，命一条。」"},{"类":"丹药","名":"续命丸","区":"beiming","文":"续命丸，青木谷所制，主药是赤砂，辅以一枚妖兽内丹。成丹率不足两成，故价高。服之可续命三月，但一生只能服一次。北冥雪原的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「续命丸救急不救穷。」"},{"类":"法宝","名":"铁铃","区":"ximo","文":"此铁铃出自藏锋阁之手，十二年前流落西漠。通体泛白，入手极寒。据说持它的人能在梦中杀人，代价是持宝者不得善终。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《西漠异物志》：「铁铃，凶物也，非命硬者不可近。」"},{"类":"法宝","名":"符笔","区":"ximo","文":"此符笔出自一位无名器修之手，七十二年前流落西漠。通体乌黑，敲之有钟声。据说持它的人可窥人心一念，代价是用满九次必遭反噬。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《西漠异物志》：「符笔，凶物也，非命硬者不可近。」"},{"类":"宗门","名":"落雁阁","区":"ximo","文":"落雁阁不算大宗，山门只有十二间屋、三百口钟。掌门崔白，修为不过筑基，却有一手绝活：做买卖。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了三百年，还越撑越稳。","引":"西漠俗谚：「落雁阁的门槛，比山还高。」"},{"类":"异兽","名":"山魈","区":"ximo","文":"山魈，二阶妖兽，出没于西漠绿洲一带。形如人而立行，喜食腐肉。猎人若能取其尾羽，可换五百块灵石。但它会学人语，七年来折在它口中的猎户不下三百人。当地人说，见它须先敬一碗酒，否则必死。","引":"西漠猎谚：「宁遇虎，莫遇山魈。」"},{"类":"风俗","名":"斗蛊","区":"ximo","文":"西漠有斗蛊之俗，每年端午举行，八十一年不曾中断。届时各家各户关门闭户。规矩有三条：不许提旧事；犯者逐出本域。外人多以为是热闹，本地人却说这是问路。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"西漠民谚：「斗蛊一过，各安天命。」"},{"类":"风俗","名":"问茶","区":"ximo","文":"西漠有问茶之俗，每年端午举行，五年不曾中断。届时镇上摆三日流水席。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是还债。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"西漠民谚：「问茶一过，各安天命。」"},{"类":"风俗","名":"斗蛊·6","区":"ximo","文":"西漠有斗蛊之俗，每年端午举行，三十六年不曾中断。届时宗门弟子列队上山。规矩有三条：不许带兵器；犯者逐出本域。外人多以为是热闹，本地人却说这是送客。老人们说，这俗是给活人看的，也是给死人看的。","引":"西漠民谚：「斗蛊一过，各安天命。」"},{"类":"秘闻","名":"旧钟","区":"ximo","文":"西漠有一桩旧事：三年前，一个外乡货郎在流沙盗失踪，只留下旧钟。官面说法是遇了妖兽，私底下却传得更邪：说他们临行前都收到过一封没有落款的信。那块碑至今无人敢拓，拓过的人都说夜里听见有人敲门。此事在西漠不算秘密，只是没人愿意在夜里提起。","引":"《西漠琐闻》：「旧钟在，旧事便不算完。」"},{"类":"丹药","名":"驻颜丹","区":"ximo","文":"驻颜丹，青木谷所制，主药是紫芝，辅以三滴精血。成丹率不足三成，故价高。服之可忘一段旧事，但服后三日不能运气。西漠的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「驻颜丹救急不救穷。」"},{"类":"异兽","名":"腐傀","区":"ximo","文":"腐傀，一阶妖兽，出没于西漠金沙楼一带。形如鱼而双翼，喜食腐肉。猎人若能取其内丹，可换九块灵石。但它成群而居，三年来折在它口中的猎户不下三十六人。当地人说，见它须先敬一碗酒，否则必死。","引":"西漠猎谚：「宁遇虎，莫遇腐傀。」"},{"类":"宗门","名":"丹霞寺","区":"ximo","文":"丹霞寺不算大宗，山门只有三百间屋、五口钟。掌门苏弈，修为不过筑基，却有一手绝活：画符。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了十二年，还越撑越稳。","引":"西漠俗谚：「丹霞寺的门槛，比山还高。」"},{"类":"风俗","名":"放河灯","区":"ximo","文":"西漠有放河灯之俗，每年开春举行，五年不曾中断。届时宗门弟子列队上山。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是问路。老人们说，这俗是给活人看的，也是给死人看的。","引":"西漠民谚：「放河灯一过，各安天命。」"},{"类":"宗门","名":"星枢殿","区":"ximo","文":"星枢殿不算大宗，山门只有二十四间屋、七口钟。掌门白微，修为不过金丹初成，却有一手绝活：画符。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了七年，还越撑越稳。","引":"西漠俗谚：「星枢殿的门槛，比山还高。」"},{"类":"地理","名":"石阶","区":"ximo","文":"西漠商队之间有一处石阶，本地人说不清它是哪一年有的。山志只记了一句：五百年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了一百零八日，最后只抬回十二具尸首。此处寸草不生，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《西漠风土记》：「商队多异，石阶为最。」"},{"类":"宗门","名":"蓬莱谷","区":"ximo","文":"蓬莱谷不算大宗，山门只有一百零八间屋、二十四口钟。掌门林渡，修为不过筑基，却有一手绝活：做买卖。门中规矩极怪，入门先扫三年地。外人都说这门派撑不过十年，可它偏偏撑了五百年，还越撑越稳。","引":"西漠俗谚：「蓬莱谷的门槛，比山还高。」"},{"类":"秘闻","名":"无字碑","区":"ximo","文":"西漠有一桩旧事：三年前，三名散修在沙海失踪，只留下无字碑。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在西漠不算秘密，只是没人愿意在夜里提起。","引":"《西漠琐闻》：「无字碑在，旧事便不算完。」"},{"类":"风俗","名":"斗蛊·16","区":"ximo","文":"西漠有斗蛊之俗，每年中秋举行，四十九年不曾中断。届时宗门弟子列队上山。规矩有三条：不许在夜里点灯；犯者逐出本域。外人多以为是热闹，本地人却说这是壮胆。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"西漠民谚：「斗蛊一过，各安天命。」"},{"类":"法宝","名":"骨笛","区":"ximo","文":"此骨笛出自百炼山之手，四十九年前流落西漠。通体青灰，敲之有钟声。据说持它的人能在梦中杀人，代价是每用一次折寿一年。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《西漠异物志》：「骨笛，凶物也，非命硬者不可近。」"},{"类":"异兽","名":"火狐","区":"ximo","文":"火狐，一阶妖兽，出没于西漠苦行沙门一带。形如鹿而独角，喜食腐肉。猎人若能取其尾羽，可换三百块灵石。但它能幻化人形，一百零八年来折在它口中的猎户不下十二人。当地人说，见它须先敬一碗酒，否则必死。","引":"西漠猎谚：「宁遇虎，莫遇火狐。」"},{"类":"异兽","名":"食铁兽","区":"ximo","文":"食铁兽，一阶妖兽，出没于西漠驼铃一带。形如人而立行，畏火。猎人若能取其内丹，可换十二块灵石。但它极记仇，八十一年来折在它口中的猎户不下一百零八人。当地人说，见它不可与它对视，否则必死。","引":"西漠猎谚：「宁遇虎，莫遇食铁兽。」"},{"类":"法宝","名":"古镜","区":"zhongzhou","文":"此古镜出自百炼山之手，一百零八年前流落中州。通体泛白，触之微温。据说持它的人可窥人心一念，代价是持宝者不得善终。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《中州异物志》：「古镜，凶物也，非命硬者不可近。」"},{"类":"地理","名":"枯井外滩","区":"zhongzhou","文":"中州拍卖会之间有一处枯井外滩，本地人说不清它是哪一年有的。山志只记了一句：四十九年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了二十四日，最后只抬回四十九具尸首。此处日光不至，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《中州风土记》：「拍卖会多异，枯井外滩为最。」"},{"类":"秘闻","名":"缺页账本","区":"zhongzhou","文":"中州有一桩旧事：三百年前，一整支商队在道会失踪，只留下缺页账本。官面说法是遇了妖兽，私底下却传得更邪：说他们走进了同一座山门却再没出来。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在中州不算秘密，只是没人愿意在夜里提起。","引":"《中州琐闻》：「缺页账本在，旧事便不算完。」"},{"类":"风俗","名":"走阴","区":"zhongzhou","文":"中州有走阴之俗，每年清明举行，三十六年不曾中断。届时所有人都要说一句实话。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是问路。老人们说，这俗是给活人看的，也是给死人看的。","引":"中州民谚：「走阴一过，各安天命。」"},{"类":"异兽","名":"双头鹤","区":"zhongzhou","文":"双头鹤，三阶妖兽，出没于中州王城一带。形如人而立行，喜食腐肉。猎人若能取其骨，可换七十二块灵石。但它能幻化人形，三年来折在它口中的猎户不下九人。当地人说，见它要喊它的名字，否则必死。","引":"中州猎谚：「宁遇虎，莫遇双头鹤。」"},{"类":"异兽","名":"白骨行者","区":"zhongzhou","文":"白骨行者，三阶妖兽，出没于中州大衍皇朝一带。形如犬而三尾，畏火。猎人若能取其尾羽，可换五百块灵石。但它能幻化人形，十七年来折在它口中的猎户不下十二人。当地人说，见它要喊它的名字，否则必死。","引":"中州猎谚：「宁遇虎，莫遇白骨行者。」"},{"类":"秘闻","名":"井底人","区":"zhongzhou","文":"中州有一桩旧事：四十九年前，一位元婴老祖在王城失踪，只留下井底人。官面说法是遇了妖兽，私底下却传得更邪：说他们临行前都收到过一封没有落款的信。后来有人在别处见过其中一人，容貌未变，问他姓名却答不上来。此事在中州不算秘密，只是没人愿意在夜里提起。","引":"《中州琐闻》：「井底人在，旧事便不算完。」"},{"类":"异兽","名":"阴兵","区":"zhongzhou","文":"阴兵，三阶妖兽，出没于中州龙脉一带。形如人而立行，好洁。猎人若能取其骨，可换四十九块灵石。但它能幻化人形，二十四年来折在它口中的猎户不下八十一人。当地人说，见它须先敬一碗酒，否则必死。","引":"中州猎谚：「宁遇虎，莫遇阴兵。」"},{"类":"异兽","名":"腐傀","区":"zhongzhou","文":"腐傀，一阶妖兽，出没于中州太虚道宗一带。形如犬而三尾，喜食腐肉。猎人若能取其内丹，可换九块灵石。但它能幻化人形，五百年来折在它口中的猎户不下八十一人。当地人说，见它须先敬一碗酒，否则必死。","引":"中州猎谚：「宁遇虎，莫遇腐傀。」"},{"类":"人物","名":"洛雪","区":"zhongzhou","文":"洛雪，中州气运人，少年时以药童为业，五百岁那年误入一场法会，得了半部丹方。此后五百年，他从炼气一路修到元婴，却在破境时被同门所害。如今他在天机楼开了一间茶铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"中州人语：「洛雪若不入仙门，或可活到白头。」"},{"类":"宗门","名":"万剑宫","区":"zhongzhou","文":"万剑宫不算大宗，山门只有十二间屋、三口钟。掌门叶白，修为不过元婴初期，却有一手绝活：做买卖。门中规矩极怪，见客必须报出师承三代。外人都说这门派撑不过十年，可它偏偏撑了一百零八年，还越撑越稳。","引":"中州俗谚：「万剑宫的门槛，比山还高。」"},{"类":"法宝","名":"铁铃","区":"zhongzhou","文":"此铁铃出自一位无名器修之手，三十六年前流落中州。通体暗红，敲之有钟声。据说持它的人可挡三剑，代价是持宝者不得善终。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《中州异物志》：「铁铃，凶物也，非命硬者不可近。」"},{"类":"宗门","名":"蓬莱洞天","区":"zhongzhou","文":"蓬莱洞天不算大宗，山门只有三十六间屋、七十二口钟。掌门钟离眠，修为不过筑基，却有一手绝活：识药。门中规矩极怪，入门先扫三年地。外人都说这门派撑不过十年，可它偏偏撑了七十二年，还越撑越稳。","引":"中州俗谚：「蓬莱洞天的门槛，比山还高。」"},{"类":"风俗","名":"走阴·13","区":"zhongzhou","文":"中州有走阴之俗，每年中秋举行，七年不曾中断。届时各家各户关门闭户。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是问路。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"中州民谚：「走阴一过，各安天命。」"},{"类":"异兽","名":"山魈","区":"zhongzhou","文":"山魈，三阶妖兽，出没于中州诏书一带。形如鱼而双翼，畏火。猎人若能取其骨，可换十二块灵石。但它会学人语，三百年来折在它口中的猎户不下五百人。当地人说，见它不可与它对视，否则必死。","引":"中州猎谚：「宁遇虎，莫遇山魈。」"},{"类":"宗门","名":"太虚宫","区":"zhongzhou","文":"太虚宫不算大宗，山门只有三百间屋、二十四口钟。掌门皇甫辰，修为不过筑基，却有一手绝活：看相。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了二十四年，还越撑越稳。","引":"中州俗谚：「太虚宫的门槛，比山还高。」"},{"类":"异兽","名":"镜鬼","区":"zhongzhou","文":"镜鬼，三阶妖兽，出没于中州万宝阁一带。形如鱼而双翼，喜食腐肉。猎人若能取其内丹，可换四十九块灵石。但它能幻化人形，五百年来折在它口中的猎户不下八十一人。当地人说，见它不可与它对视，否则必死。","引":"中州猎谚：「宁遇虎，莫遇镜鬼。」"},{"类":"秘闻","名":"夜半歌","区":"zhongzhou","文":"中州有一桩旧事：五百年前，一整支商队在太虚道宗失踪，只留下夜半歌。官面说法是遇了妖兽，私底下却传得更邪：说他们被一阵雾吞了。那块碑至今无人敢拓，拓过的人都说夜里听见有人敲门。此事在中州不算秘密，只是没人愿意在夜里提起。","引":"《中州琐闻》：「夜半歌在，旧事便不算完。」"},{"类":"功法","名":"《玄阴录》","区":"zhongzhou","文":"《玄阴录》，残本，存七页，缺首尾。据说是二十四年前一位魔修所创，专为根骨平庸者而设。修法极险：每日以灵机冲一遍死穴。练成者战力远超同阶，练废者沦为药人。此本现藏于龙脉，看管的人从不让人翻到最后一页。","引":"中州传言：「《玄阴录》一页，命一条。」"},{"类":"法宝","名":"木匣","区":"zhongzhou","文":"此木匣出自藏锋阁之手，九年前流落中州。通体泛白，敲之有钟声。据说持它的人可窥人心一念，代价是持宝者不得善终。如今它在某座当铺的柜底，知道来历的人都不敢去取。","引":"《中州异物志》：「木匣，凶物也，非命硬者不可近。」"},{"类":"人物","名":"皇甫尘","区":"tianjian","文":"皇甫尘，天剑域万剑冢人，少年时以挑夫为业，三岁那年误入一场法会，得了半部符书。此后九年，他从筑基一路修到元婴，却在破境时为救一人耗尽修为。如今他在剑意开了一间卦摊，绝口不提当年。有人问起，他只笑：修仙？修的是命。","引":"天剑域人语：「皇甫尘若不入仙门，或可活到白头。」"},{"类":"法宝","名":"断剑","区":"tianjian","文":"此断剑出自藏锋阁之手，七年前流落天剑域。通体暗红，见血则鸣。据说持它的人能在梦中杀人，代价是此生不可再入宗门。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《天剑域异物志》：「断剑，凶物也，非命硬者不可近。」"},{"类":"丹药","名":"驻颜丹","区":"tianjian","文":"驻颜丹，一位游方丹师所制，主药是血参，辅以一钱雷击木灰。成丹率不足一成，故价高。服之可强破一境，但一生只能服一次。天剑域的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「驻颜丹救急不救穷。」"},{"类":"地理","名":"听雨桥","区":"tianjian","文":"天剑域剑峰之间有一处听雨桥，本地人说不清它是哪一年有的。山志只记了一句：五百年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了九日，最后只抬回三百具尸首。此处风声如哭，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《天剑域风土记》：「剑峰多异，听雨桥为最。」"},{"类":"功法","名":"《焚天章》","区":"tianjian","文":"《焚天章》，残本，存五百页，缺首尾。据说是五年前一位魔修所创，专为寿元将尽者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者经脉尽断。此本现藏于星陨铁，看管的人从不让人翻到最后一页。","引":"天剑域传言：「《焚天章》一页，命一条。」"},{"类":"风俗","名":"斗蛊","区":"tianjian","文":"天剑域有斗蛊之俗，每年冬至举行，四十九年不曾中断。届时各家各户关门闭户。规矩有三条：不许带兵器；犯者由长者当众训诫。外人多以为是热闹，本地人却说这是问路。有一年办到一半，山里出了事，从此规矩又加了一条。","引":"天剑域民谚：「斗蛊一过，各安天命。」"},{"类":"人物","名":"晏渊","区":"tianjian","文":"晏渊，天剑域断崖人，少年时以账房为业，七十二岁那年误入一位散人的洞府，得了半部阵图。此后一百零八年，他从炼气一路修到元婴，却在破境时为救一人耗尽修为。如今他在雷竹开了一间茶铺，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"天剑域人语：「晏渊若不入仙门，或可活到白头。」"},{"类":"人物","名":"叶眠","区":"tianjian","文":"叶眠，天剑域剑鸣人，少年时以药童为业，九岁那年误入一处秘境，得了半部丹方。此后一百零八年，他从筑基一路修到元婴，却在破境时被同门所害。如今他在雷竹开了一间私塾，绝口不提当年。有人问起，他只笑：我这条命，早就不算自己的了。","引":"天剑域人语：「叶眠若不入仙门，或可活到白头。」"},{"类":"地理","名":"雾谷旧址","区":"tianjian","文":"天剑域剑峰之间有一处雾谷旧址，本地人说不清它是哪一年有的。山志只记了一句：三十六年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了九日，最后只抬回五百具尸首。此处日光不至，走过的人都说脚底发凉。有游方道人来看过，说底下压着一条旧脉，动不得。","引":"《天剑域风土记》：「剑峰多异，雾谷旧址为最。」"},{"类":"人物","名":"谢渊","区":"tianjian","文":"谢渊，天剑域无锋剑人，少年时以渔户为业，五百岁那年误入一处秘境，得了半部丹方。此后七年，他从炼气一路修到金丹，却在斗法时被同门所害。如今他在藏锋阁开了一间卦摊，绝口不提当年。有人问起，他只笑：修仙？修的是命。","引":"天剑域人语：「谢渊若不入仙门，或可活到白头。」"},{"类":"异兽","名":"白骨行者","区":"tianjian","文":"白骨行者，二阶妖兽，出没于天剑域雷竹一带。形如人而立行，喜食腐肉。猎人若能取其眼，可换二十四块灵石。但它成群而居，五百年来折在它口中的猎户不下五人。当地人说，见它不要跑，要退，否则必死。","引":"天剑域猎谚：「宁遇虎，莫遇白骨行者。」"},{"类":"功法","名":"《青木经》","区":"tianjian","文":"《青木经》，残本，存四十九页，缺首尾。据说是四十九年前一位剑修所创，专为寿元将尽者而设。修法极险：必先散尽一半修为。练成者战力远超同阶，练废者经脉尽断。此本现藏于剑鸣，看管的人从不让人翻到最后一页。","引":"天剑域传言：「《青木经》一页，命一条。」"},{"类":"功法","名":"《玄冰功》","区":"tianjian","文":"《玄冰功》，残本，存七页，缺首尾。据说是二十四年前一位丹修所创，专为心性不稳者而设。修法极险：要以自身精血养一道符。练成者进境极快，练废者沦为药人。此本现藏于万剑冢，看管的人从不让人翻到最后一页。","引":"天剑域传言：「《玄冰功》一页，命一条。」"},{"类":"法宝","名":"蒲团","区":"tianjian","文":"此蒲团出自藏锋阁之手，三百年前流落天剑域。通体泛白，敲之有钟声。据说持它的人能在梦中杀人，代价是用满九次必遭反噬。如今它随一具白骨埋在沙里，知道来历的人都不敢去取。","引":"《天剑域异物志》：「蒲团，凶物也，非命硬者不可近。」"},{"类":"功法","名":"《玄冰功》·14","区":"tianjian","文":"《玄冰功》，残本，存二十四页，缺首尾。据说是一百零八年前一位魔修所创，专为心性不稳者而设。修法极险：需在雷雨天引雷入体。练成者可越阶而战，练废者沦为药人。此本现藏于葬剑，看管的人从不让人翻到最后一页。","引":"天剑域传言：「《玄冰功》一页，命一条。」"},{"类":"地理","名":"雾谷下院","区":"tianjian","文":"天剑域万剑冢之间有一处雾谷下院，本地人说不清它是哪一年有的。山志只记了一句：五年前，有['三', '五', '七', '九', '十二', '十七', '二十四', '三十六', '四十九', '七十二', '八十一', '一百零八', '三百', '五百']人在此失踪，官府查了十七日，最后只抬回五百具尸首。此处日光不至，走过的人都说脚底发凉。后来有人在此开了一间茶棚，生意极好，只是不卖隔夜茶。","引":"《天剑域风土记》：「万剑冢多异，雾谷下院为最。」"},{"类":"秘闻","名":"井底人","区":"tianjian","文":"天剑域有一桩旧事：十七年前，一位元婴老祖在剑峰失踪，只留下井底人。官面说法是遇了妖兽，私底下却传得更邪：说他们临行前都收到过一封没有落款的信。账本最后一页写着九个字，字迹被水浸过，只认得出「莫回头」三字。此事在天剑域不算秘密，只是没人愿意在夜里提起。","引":"《天剑域琐闻》：「井底人在，旧事便不算完。」"},{"类":"人物","名":"白真","区":"tianjian","文":"白真，天剑域无锋剑人，少年时以药童为业，八十一岁那年误入一座古墓，得了半部符书。此后三年，他从筑基一路修到元婴，却在斗法时被同门所害。如今他在剑鸣开了一间铁匠铺，绝口不提当年。有人问起，他只笑：当年那半部书，害我半生。","引":"天剑域人语：「白真若不入仙门，或可活到白头。」"},{"类":"丹药","名":"换血丹","区":"tianjian","文":"换血丹，青木谷所制，主药是赤砂，辅以一钱雷击木灰。成丹率不足一成，故价高。服之可续命三月，但会在梦里见到献药之人。天剑域的黑市上偶有流通，真伪各半，买主多半是走投无路的人。","引":"丹家谚：「换血丹救急不救穷。」"},{"类":"宗门","名":"落雁楼","区":"tianjian","文":"落雁楼不算大宗，山门只有七间屋、二十四口钟。掌门江长明，修为不过筑基，却有一手绝活：铸剑。门中规矩极怪，每旬要交一篇札记。外人都说这门派撑不过十年，可它偏偏撑了七年，还越撑越稳。","引":"天剑域俗谚：「落雁楼的门槛，比山还高。」"}]};

    const 功 = techniqueFactor(b);
    const 志 = b.志向 === '证大道' ? 1.08 : b.志向 === '不再被人踩在脚下' ? 1.1 : 1;
    return Math.max(0.1, base * 灵机 * 道 * 魔 * 功 * 志 * (p.属性.功 || 1) * state.规则.修为倍率);
  }
  function powerOf(b) {
    const base = (REALMS[b.境界] || REALMS[0]).战力基数 * (1 + b.层 * 0.22);
    const p = PATH_BY_ID[b.路径] || PATHS[0];
    let 器 = 1;
    (b.法宝 || []).forEach((f) => (器 += (f.效 || 0.1) * 0.1));
    return base * (1 + b.根骨 / 60) * 器 * (p.属性.攻 || 1) * (1 + b.魔念 / 150);
  }
  function breakChance(b, 大关) {
    let p = 0.5 + b.悟性 * 0.011 + b.机缘 * 0.008 + (b.道心 - 50) * 0.004 + sectPower(b) * 0.012 - b.魔念 * 0.003;
    if (大关) p -= 0.18;
    p *= state.规则.突破倍率;
    return clamp(p, 0.03, 0.97);
  }

  function applyGain(b, key, v, quiet) {
    if (typeof v !== 'number') v = Number(v) || 0;
    switch (key) {
      case '灵石': b.灵石 = Math.max(0, Math.round(b.灵石 + v)); break;
      case '修为': b.修为 = Math.max(0, b.修为 + v * 1.6); break;
      case '悟性': b.悟性 = Math.max(1, b.悟性 + v); break;
      case '声望': b.声望 = Math.max(0, b.声望 + v); break;
      case '魔念': b.魔念 = clamp(b.魔念 + v, 0, 100); break;
      case '因果': b.因果 += v; break;
      case '寿元': b.寿元 = Math.max(b.年龄 + 1, b.寿元 + v); break;
      case '气血': break;
      case '道心': b.道心 = clamp(b.道心 + v, 0, 100); break;
      case '机缘': b.机缘 = Math.max(1, b.机缘 + v); break;
      case '灵材': b.灵石 += Math.round(v * 8); break;
      case '器物': {
        const 名 = pick(POOLS.器物);
        b.法宝.push({ 名, 品: pick(['下品', '中品', '上品', '极品']), 效: rf(0.1, 0.8) });
        if (!quiet) pushLog('机缘', `${b.道号}得一件${名}。`);
        break;
      }
      case '功法': {
        const 名 = pick(POOLS.功法);
        b.功法.push({ 名, 品: pick(['黄阶', '玄阶', '地阶', '天阶']), 效: rf(1.04, 1.5) });
        if (!quiet) pushLog('机缘', `${b.道号}得一部${名}。`);
        break;
      }
    }
  }

  /* ---------------- 突破 ---------------- */
  function doBreakthrough(b, force) {
    if (!b.活) return false;
    if (!force && b.修为 < expCap(b.境界, b.层)) return false;
    const 大关 = b.层 >= layersOf(b.境界) - 1;
    const 劫名 = (REALMS[b.境界] || {}).突破劫 || '无';
    const p = force ? 1 : breakChance(b, 大关);
    b.修为 = 0;
    if (force || chance(p)) {
      b.突破失败 = 0;
      if (大关) {
        if (b.境界 >= REALMS.length - 1) {
          b.修为 = 0;
          if (b.是玩家) pushLog('突破', '你已至大罗圆满，前路再无境界可破。再往上，只有天。');
          return false;
        }
        b.境界++; b.层 = 0;
        b.寿元 += Math.round(((REALMS[b.境界].寿元加成 || 0) * 0.3) * state.规则.寿命倍率);
        if (b.是玩家) {
          pushLog('突破', `你于${pick(POOLS.地点)}破${(REALMS[b.境界 - 1] || {}).突破劫 || '关'}，晋${realmName(b.境界, 0)}。${REALMS[b.境界].描述}`);
          addChronicle('突破', `「${b.道号}」破境，晋${realmName(b.境界, 0)}。`, b.境界 >= 4);
        } else if (b.境界 >= 3) {
          addChronicle('人物', `${SECT_BY_ID[b.宗门] ? SECT_BY_ID[b.宗门].名 : '散修'}${b.道号}破境，晋${realmName(b.境界, 0)}，一域震动。`, b.境界 >= 4);
        }
      } else {
        b.层++;
        if (b.是玩家) pushLog('突破', `经脉中一缕清气盘旋九周，你入${realmName(b.境界, b.层)}。`);
      }
      b.悟性 += ri(0, 1);
      b.道心 = clamp(b.道心 + rf(0.4, 1.6), 0, 100);
      state.统计.破境++;
      if (b.是玩家) emit('player');
      return true;
    }
    b.突破失败 = (b.突破失败 || 0) + 1;
    b.修为 = 0;
    b.道心 = clamp(b.道心 - rf(1.5, 6), 0, 100);
    b.魔念 = clamp(b.魔念 + rf(0, 2.5), 0, 100);
    if (b.是玩家) pushLog('失败', `你强行冲关，${pick(['识海一阵剧痛', '灵机在丹田处溃散', '呕出一口血来'])}。修为散尽，道心受损。`);
    if (state.规则.天罚 && 大关 && b.突破失败 % 3 === 0) {
      if (b.是玩家 && b.命数 > 0) {
        b.命数--;
        pushLog('天命', `劫雷落下的一瞬，袖中旧玉牌碎裂，替你挡了一劫。命数 -1。`);
      } else if (!b.是玩家 && chance(0.35)) {
        killBeing(b, `渡${劫名}失败，身死道消`);
      } else if (b.是玩家) {
        killBeing(b, `渡${劫名}失败，身陨`);
      }
    }
    return false;
  }

  function killBeing(b, 原因) {
    if (!b.活) return;
    b.活 = false;
    b.状态 = '已陨';
    state.统计.陨落++;
    if (b.是玩家) {
      pushLog('生死', `你死了。${原因}。\n九州不会因为少一个人而停转——但它记下了你的名字。`);
      addChronicle('生死', `「${b.道号}」${原因}，享年${Math.round(b.年龄)}，止步${realmName(b.境界, b.层)}。`, true);
      if (state.规则.自动转世) reincarnate(b);
      else emit('death', { 道号: b.道号, 原因, 寿: Math.round(b.年龄), 境: realmName(b.境界, b.层) });
      emit('player');
    } else {
      if (b.境界 >= 3 || b.声望 > 60) addChronicle('生死', `${SECT_BY_ID[b.宗门] ? SECT_BY_ID[b.宗门].名 : '散修'}${b.道号}${原因}，享年${Math.round(b.年龄)}。`, b.境界 >= 4);
    }
  }

  function reincarnate(old) {
    const p = makePlayer();
    const baseName = String(old.道号 || '').replace(/·第[一二三四五六七八九十百]+世/g, '');
    p.转世 = (old.转世 || 0) + 1;
    const ord = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][Math.min(9, p.转世)];
    p.道号 = baseName + '·第' + ord + '世';
    p.悟性 += 3; p.机缘 += 2; p.命数 = clamp((old.命数 || 0) + 1, 0, 9);
    p.路径 = old.路径; p.志向 = old.志向;
    p.功法.push({ 名: '《前尘残卷》', 品: '玄阶', 效: 1.25 });
    (old.法宝 || []).forEach((f) => p.法宝.push(f));
    state.player = p;
    state.beings.push(p);
    pushLog('轮回', `你在另一个清晨醒来，记得前世所有的失败。这一世，你修的还是${(PATH_BY_ID[p.路径] || {}).名}。`);
    addChronicle('轮回', `「${p.道号}」转世重修，前世之悟未散。`, true);
    emit('player');
  }

  /* ---------------- 人物行动 ---------------- */
  function isMoving(b) {
    return !!(b && b.位置 && b.位置.from && b.位置.t < 1);
  }

  function travel(b, toRegion) {
    const adj = ADJ[b.区域];
    if (!adj || !adj.length) return false;
    if (isMoving(b)) return false;
    const to = toRegion && adj.indexOf(toRegion) >= 0 ? toRegion : pick(adj);
    const [x, y] = POS[to] || POS.zhongzhou;
    const cur = b.位置 || spawnPos(b);
    const from = { x: cur.to ? cur.to.x : cur.x, y: cur.to ? cur.to.y : cur.y };
    const target = { x: x + rf(-64, 64), y: y + rf(-46, 46) };
    const dist = Math.hypot(target.x - from.x, target.y - from.y);
    b.位置 = { x: from.x, y: from.y, from, to: target, t: 0, dur: clamp(dist / 210, 0.9, 3.2) };
    b.区域 = to;
    b.状态 = '行旅';
    return true;
  }

  function advanceMotion(dtSec) {
    if (!state || !dtSec) return;
    const list = state.beings;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (!b.活 || !b.位置 || !b.位置.from || b.位置.t >= 1) continue;
      const dur = b.位置.dur || 1.6;
      b.位置.t = Math.min(1, b.位置.t + dtSec / dur);
      if (b.位置.t >= 1) {
        b.位置.x = b.位置.to.x;
        b.位置.y = b.位置.to.y;
        b.位置.from = null;
        b.位置.t = 1;
        b.状态 = '在野';
      }
    }
  }

  function beingMonth(b) {
    if (!b.活) return;
    b.年龄 += 1 / 12;
    if (b.年龄 > b.寿元) {
      if (b.是玩家 && state.规则.上帝模式) {
        b.寿元 = Math.ceil(b.年龄) + 100;
      } else if (b.是玩家) { killBeing(b, '寿元耗尽'); return; }
      else killBeing(b, '坐化');
      if (!b.活) return;
    }
    if (state.规则.无限灵石 && b.是玩家) b.灵石 = 999999999;

    b.修为 += cultivateRate(b) / 12 * (b.是玩家 ? 1 : 0.85);
    const cap = expCap(b.境界, b.层);
    if (b.修为 >= cap) {
      const autoP = b.是玩家 ? 0.9 : 0.35;
      if (chance(autoP)) doBreakthrough(b, false);
      else if (b.修为 > cap * 1.35) b.修为 = cap * 1.35;
    }
    if (b.魔念 > 65 && chance(0.01)) {
      b.道心 = clamp(b.道心 - rf(1, 4), 0, 100);
      if (b.是玩家) pushLog('心魔', '你听见另一个自己在耳边说话，声音很轻，却比雷声更真。');
    }
    if (b.宗门 && state.sects[b.宗门]) {
      b.灵石 += 1 + b.境界 * 2;
      const s = state.sects[b.宗门];
      b.声望 += chance(0.2) ? 1 : 0;
    }
    if (!isMoving(b)) {
      const wander = b.是玩家 ? 0.16 : 0.07;
      if (chance(wander)) travel(b);
    }
  }

  function npcDrama(b) {
    if (!b.活 || b.是玩家) return;
    const r = rnd();
    if (r < 0.11 * state.规则.争斗频率) {
      let o = null;
      for (let tries = 0; tries < 8; tries++) {
        const cand = state.beings[(rnd() * state.beings.length) | 0];
        if (cand && cand.活 && !cand.是玩家 && cand.id !== b.id && cand.区域 === b.区域) { o = cand; break; }
      }
      if (!o) return;
      const pb = powerOf(b), po = powerOf(o);
      const win = pb * rf(0.75, 1.3) > po;
      state.统计.争斗++;
      if (win) {
        o.法宝 = [];
        b.声望 += 8;
        if (chance(0.14)) {
          killBeing(o, `于${(REGION_BY_ID[b.区域] || {}).名}被${b.道号}所斩`);
          b.魔念 = clamp(b.魔念 + rf(0, 3), 0, 100);
          if (b.境界 >= 3) addChronicle('争斗', `${SECT_BY_ID[b.宗门] ? SECT_BY_ID[b.宗门].名 : '散修'}${b.道号}于${(REGION_BY_ID[b.区域] || {}).名}斩${o.道号}，夺其法宝而去。`, true);
        }
      } else {
        b.声望 = Math.max(0, b.声望 - 4);
        if (chance(0.08)) killBeing(b, `于${(REGION_BY_ID[b.区域] || {}).名}败于${o.道号}之手`);
      }
    } else if (r < 0.2) {
      const sects = Object.keys(state.sects);
      const sid = pick(sects);
      if (b.宗门 !== sid && state.sects[sid].势力 > 3 && chance(0.5)) {
        b.宗门 = sid;
        if (chance(0.4)) addChronicle('宗门', `${state.sects[sid].名}纳${b.道号}入门，门中又多一名${b.境界 >= 2 ? '真传' : '弟子'}。`, false);
      }
    } else if (r < 0.3) {
      const ev = pick(ALL_EVENTS);
      const opt = pick(ev.择 || []);
      if (opt && opt.果) Object.keys(opt.果).forEach((k) => applyGain(b, k, opt.果[k], true));
      if (b.境界 >= 2 && ev.重 >= 3 && chance(0.5)) addChronicle('奇闻', `${b.道号}于${(REGION_BY_ID[b.区域] || {}).名}遇「${ev.题}」。`, false);
    } else if (r < 0.36 && b.境界 < REALMS.length - 1) {
      if (chance(0.02 + b.悟性 * 0.001)) doBreakthrough(b, false);
    }
  }

  /* ---------------- 玩家事件 ---------------- */
  function pickEvent() {
    const p = state.player;
    let pool = (REGION_EVENTS[p.区域] || []).filter((e) => {
      const rg = e.境界 || [0, 13];
      return p.境界 >= (rg[0] || 0) && p.境界 <= (rg[1] != null ? rg[1] : 13);
    });
    if (!pool.length) pool = ALL_EVENTS.filter((e) => { const rg = e.境界 || [0, 13]; return p.境界 >= (rg[0] || 0) && p.境界 <= (rg[1] != null ? rg[1] : 13); });
    if (!pool.length) pool = ALL_EVENTS;
    const weighted = [];
    pool.forEach((e) => { for (let i = 0; i < Math.max(1, e.重 || 1); i++) weighted.push(e); });
    return pick(weighted);
  }

  function fireEvent(ev) {
    const p = state.player;
    if (!ev) ev = pickEvent();
    const ctx = { being: p, 区域: p.区域 };
    const 段 = (ev.段 || []).map((s) => expand(s, ctx));
    const opts = ev.择 || [];
    if (!opts.length) return;
    let chosen;
    if (opts.length === 1) chosen = opts[0];
    else {
      const good = opts.filter((o) => (o.果 && (o.果.魔念 || 0) <= 0 && (o.果.道心 || 0) >= 0));
      if (p.道心 > 68 && good.length && chance(0.55)) chosen = pick(good);
      else if (p.魔念 > 45 && chance(0.5)) chosen = pick(opts.slice().sort((a, b) => ((b.果 || {}).魔念 || 0) - ((a.果 || {}).魔念 || 0)).slice(0, 2));
      else chosen = pick(opts);
    }
    const 文 = expand(chosen.文 || '', ctx);
    const 果 = chosen.果 || {};
    Object.keys(果).forEach((k) => applyGain(p, k, 果[k]));
    pushLog('事件', `【${ev.题 || '奇遇'}】\n${段.join('\n')}\n\n你择「${chosen.名 || '从心'}」。${文}`);
    addChronicle('事件', `「${p.道号}」于${(REGION_BY_ID[p.区域] || {}).名}遇「${ev.题}」，择「${chosen.名 || '从心'}」。`, ev.重 >= 4);
    p.传记.push({ t: dateStr(state), 题: ev.题, 择: chosen.名, 文: 文 });
    if (p.传记.length > 60) p.传记.shift();
    emit('player');
    return { ev, chosen };
  }

  /* ---------------- 世界演化 ---------------- */
  const WORLD_TEMPLATES = [
    (r) => `${r.名}灵机骤涨，地脉中隐有青光上浮，修士谓之「地涌青莲」。`,
    (r) => `${r.名}大雾封境三月不散，往来商队十失其三。`,
    (r) => `${r.名}地动，山中裂开一道深谷，谷底有古碑现世。`,
    (r) => `${r.名}灵机枯竭，草木一夜间尽枯，散修纷纷外迁。`,
    (r) => `${r.名}上空${pick(POOLS.天象)}，有修士见${pick(POOLS.妖异)}掠过，不知吉凶。`,
    (r) => `${r.名}新开一处秘境，三日之内涌入数百修士，生还者不足十一。`,
    (r) => `${r.名}灵脉被人以阵法截断，${pick(SECTS).名}与${pick(SECTS).名}因此交恶。`
  ];

  function worldMonth() {
    state.灵潮 = lerp(state.灵潮, 0, 0.08) + (chance(0.1) ? rf(-0.15, 0.25) : 0);
    REGIONS.forEach((r) => {
      const s = state.regions[r.id];
      s.灵机 = clamp(lerp(s.灵机, r.灵机, 0.12) + rf(-0.02, 0.02) + state.灵潮 * 0.1, r.灵机 * 0.5, r.灵机 * 1.9);
      s.气运 = clamp(s.气运 + ri(-2, 2), 0, 100);
    });
    Object.keys(state.sects).forEach((sid) => {
      const s = state.sects[sid];
      const base = SECT_BY_ID[sid] ? SECT_BY_ID[sid].势力 : 3;
      s.势力 = clamp(s.势力 + ri(-1, 1) + (s.势力 < base ? 1 : 0), 1, 12);
      s.状态 = s.势力 >= 8 ? '鼎盛' : s.势力 >= 5 ? '兴盛' : s.势力 >= 3 ? '平稳' : '式微';
    });
    state.世界计时++;
    if (state.世界计时 >= 5) {
      state.世界计时 = 0;
      const r = pick(REGIONS);
      const s = state.regions[r.id];
      const tpl = pick(WORLD_TEMPLATES);
      if (chance(0.5)) s.状态 = pick(['动荡', '平静', '灵气充盈', '妖祸']);
      const txt = tpl(r);
      addChronicle('天地', txt, false);
      if (chance(0.35)) pushLog('天下', txt);
    }
    const alive = state.beings.reduce((n, b) => n + (b.活 ? 1 : 0), 0);
    if (alive < 60 && chance(0.4)) {
      const n = ri(1, 3);
      for (let i = 0; i < n; i++) {
        const nb = randomBeing();
        nb.年龄 = ri(14, 22);
        nb.境界 = 0; nb.层 = 0; nb.修为 = 0;
        state.beings.push(nb);
        state.统计.降生++;
      }
      if (chance(0.25)) addChronicle('人物', `九州各域又有少年叩仙门，此年入道者数十。`, false);
    }
    if (state.beings.length > 320) {
      state.beings = state.beings.filter((b) => b.活 || b.是玩家);
    }
    if (state.year % 17 === 0 && state.month === 0) {
      state.天象 = pick(POOLS.天象);
      state.劫数++;
      addChronicle('天象', `天象易变，${state.天象}。九州修士皆言：此年多劫。`, true);
    }
  }

  function playerMonth() {
    const p = state.player;
    if (!p || !p.活) return;
    state.事件计时++;
    if (state.事件计时 >= Math.max(1, state.规则.事件间隔)) {
      state.事件计时 = 0;
      fireEvent(null);
    }
    if (chance(0.05)) {
      const 得 = Math.round((5 + p.境界 * 4) * regionOf(p).灵机 * rf(0.7, 1.6));
      p.灵石 += 得;
      p.修为 += 得 * 0.8;
      if (chance(0.3)) pushLog('修行', `你于${pick(POOLS.地点)}采得${pick(POOLS.灵材)}，卖与山下药铺，得灵石${得}。`);
    }
  }

  /* ---------------- 主推进 ---------------- */
  function tick() {
    if (!state || state.paused) return;
    state.month++;
    if (state.month >= 12) { state.month = 0; state.year++; }
    worldMonth();
    const beings = state.beings;
    for (let i = 0; i < beings.length; i++) {
      const b = beings[i];
      if (!b.活) continue;
      beingMonth(b);
      if (b.活) npcDrama(b);
    }
    playerMonth();
    if (state.beings.length > 220) {
      const dead = state.beings.filter((b) => !b.活 && !b.是玩家);
      if (dead.length > 60) state.beings = state.beings.filter((b) => b.活 || b.是玩家);
    }
    if (state.统计.降生 === 0 && state.year > -300) state.统计.降生 = 1;
    emit('tick');
  }

  /* ---------------- 金手指接口 ---------------- */
  const cheat = {
    player() { return state.player; },
    being(id) { return state.beings.find((b) => b.id === id); },
    setBeing(id, patch) {
      const b = this.being(id);
      if (!b) return null;
      Object.keys(patch).forEach((k) => { b[k] = patch[k]; });
      if (patch.境界 != null || patch.层 != null) {
        b.境界 = clamp(b.境界, 0, REALMS.length - 1);
        b.层 = clamp(b.层, 0, layersOf(b.境界) - 1);
      }
      if (patch.区域 != null && POS[patch.区域]) b.位置 = spawnPos(b);
      if (patch.寿元 != null) b.寿元 = Math.max(1, Number(patch.寿元) || 1);
      if (patch.年龄 != null) b.年龄 = Math.max(0, Number(patch.年龄) || 0);
      if (patch.灵石 != null) b.灵石 = Math.max(0, Math.round(Number(patch.灵石) || 0));
      emit('player'); emit('beings');
      return b;
    },
    setPlayer(patch) { return this.setBeing('player', patch); },
    addBeing(opts) {
      const b = newBeing(opts || {});
      state.beings.push(b);
      addChronicle('人物', `「${b.道号}」现世，${(REGION_BY_ID[b.区域] || {}).名}多一人。`, false);
      emit('beings');
      return b;
    },
    kill(id, 原因) { const b = this.being(id); if (b) killBeing(b, 原因 || '被天机笔抹去'); return b; },
