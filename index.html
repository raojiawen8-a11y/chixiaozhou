样。雾里没有风，可竹叶在动，动的方向是反的。","你蹲下去摸地面，摸到一根埋在土里的阵线，是{灵材}拉成的丝，埋在土下三寸。这不是落雁谷的手笔——谷中的阵讲究留生门，这阵只有死门。你顺着阵线摸了两步，摸到另一根，两根之间隔着一具枯骨，骨头上的肉早烂光了，可腰间的钱袋还在。","你抬头看，头顶的雾是圆的，像一口倒扣的锅。兜了七圈之后，你确认这阵的范围不过三十步。三十步之内困死过的人，至少有三个。你身上的干粮只够两日，火折子受了潮，打不出火。{天象}里，那具枯骨的钱袋上绣着一个字，你凑近了看清，是“云”。"],"择":[{"名":"循骨找人","文":"你不再找出路，改找骨头。三十步的范围里，你一共数出七具尸，位置连起来是一条线，线的尽头是一块半埋的青石。你把青石翻开，阵线断开一线，雾立刻薄了一层。你从缺口走出去，走了半里才敢回头。身后那片雾，已经散得干干净净。","果":{"修为":60,"悟性":4,"气血":-20,"因果":2}},{"名":"以力破阵","文":"你取出{器物}，照着阵线最密处猛砸。第七下时阵线断了，雾里响起一声极尖的啸，你耳中一阵刺痛，随即眼前一黑。从雾里走出来时，你已经走出去了，只是右耳自此听不清高音。那具枯骨的钱袋被你带了出来，里头有七块灵石与一枚青云宗的旧扣。","果":{"气血":-35,"器物":1,"灵石":20,"寿元":-3}},{"名":"坐阵待变","文":"你索性坐下，不走了。既然阵要困人，那阵里的人不动，阵便无用。你坐了整整一日，雾不散也不收。第二日正午，阵线自己松了一线——布阵的人总得来看，一看便是破绽。你等到第三日，果然听见远处有人踏雾而来，脚步很轻。你屏住了气。","果":{"悟性":5,"修为":80,"道心":3,"灵石":-10}},{"名":"挖那枯骨","文":"你把七具尸一具一具挖出来，摆成一排，再以阵线的方位把尸首重新摆正。摆完之后，雾退了三步。你明白了：这阵用尸压阵眼，尸正了，阵就乱。你走出雾的时候，身后那片竹林里传来一阵极轻的响，像有人在道谢，又像有人终于放下了什么。","果":{"因果":4,"道心":3,"修为":70,"魔念":1}}]},{"id":"qinglan_047","题":"老茶农的仇","类":"人情","重":2,"域":["qinglan"],"境界":[0,3],"段":["{地点}的老茶农姓陈，种了四十年茶，独子去年死在外门。他每回见你都要说一遍儿子的事：考进了青云宗，第三年回家一趟，第四年又来了一封信，第五年人就没了。信上写的字他认不全，托你念。信只有三行：儿好。勿念。下月归。可下月归的人，一直没归。","{天象}，信纸已经很旧，折痕裂了口。他问你，这“归”字是不是写错了。你说是回来。他点点头，说那也是，那孩子从小话少。他又说，去年秋天有个穿青袍的人来过，说儿子是病死，给了二十块灵石。他收了，可夜里翻来覆去，总想着死病死的人，怎么连尸首都不给看。","{天象}。他忽然从灶后摸出一个布包，一层层打开，里头是三片竹签与一枚{器物}，签上的名字一年一片。他说他不懂山门的规矩，也不敢去问，就问一句：这枚东西，是不是宗门的？你认得，那是外门弟子的腰牌，缺了一角，背面刻着峰名与编号。"],"择":[{"名":"替他读信","文":"你重新给他念了一遍那封信，念得很慢，一句一句讲明白。他听着听着就笑了，笑完又抹眼睛。临走时他硬塞给你一包新茶，说自家炒的，不值钱。你把茶带走了，也把那枚缺角令牌带走了——他托你，若哪天路上碰见宗门的人，替他把这个还回去。","果":{"声望":6,"道心":3,"灵石":20,"因果":2}},{"名":"去查那编号","文":"你带着令牌去了{地点}，托了一个识得宗门名录的老书役。老人翻了两日，说这编号对应的人三年前就销了名，事由栏写着“病故”，经办人是个早不在职的执事。老人合上名录时看了你一眼，说这种事，每年都有七八桩，你别都往心里去。","果":{"悟性":3,"因果":3,"修为":40,"声望":3}},{"名":"劝他别问","文":"你说山门里的水深，查了也查不出，反倒把自己搭进去。老人听着，把布包收起来，一层层裹好，说你说得对。他起身去灶上烧水，背对着你说了句：我不是要查，我就是想知道他最后有没有受苦。这句话后来在你耳朵里响了很多年。","果":{"道心":-1,"因果":1,"寿元":1,"悟性":1}},{"名":"答应带回山门","文":"你答应了，把令牌收进{器物}里。三个月后你真去了青云山，在戒律堂外站了半日，把令牌递了进去。堂里的人接令牌时没问你是谁，只让你等着。等到你走，也没等到回话。回程路上你在{地点}又碰见老人，他问你办成了没，你说了实话，他反倒笑了，说办成就怪了。","果":{"因果":3,"声望":5,"道心":2,"灵石":-30}}]},{"id":"qinglan_048","题":"驿中说书","类":"市井","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}的夜里只有一件事可做——听书。说书的老头在灶边支一盏灯，敲一块竹板，一天说一段。散了场，听的人丢两枚铜钱在碗里，他从不称。今日他说的是一桩旧事：四十年前，黑水堂的堂主进过一次青云山门，是抬着进去的。","{天象}，他敲一下竹板：“那日抬的是顶轿，轿子四面都封了黑布，八个抬轿的，走到山门牌坊下就不动了。牌坊上的铜铃响了九声，山门里出来三个人，一个是当时的掌门，一个是戒律堂的老执事，还有一个，是站在最后面、一直没说话的瞎子。”说到这儿，他把竹板按住了。","满座的人都在等。老头喝了口水，忽然问：“谁知道那瞎子是谁？”没人应。他的眼睛扫过一圈，最后落在你身上，“后生，你说说。”{天象}，灯芯爆了个花。你忽然想起，白天在{地点}见过一个算命摊，摊主是个瞎子，桌上摆着一只{器物}。"],"择":[{"名":"照实说出","文":"你说那是山门外摆算命摊的老人。满座哄然，老头却笑了，敲了三下竹板，说这后生眼睛毒。他又说，四十年前那瞎子站在最后一排，一句话没说过，可那天的轿子是他开口之后才抬回去的。说到这儿，他把灯拨灭了，说今夜的散了。","果":{"悟性":3,"声望":4,"灵石":10,"因果":1}},{"名":"反问堂主","文":"你问，那堂主进山门是求什么。老头看了你很久，伸出一只手，比了个数字。他说那日轿子里的人只剩一口气，来换一样东西，山门里只肯给半样。后来那口气又续了二十年，黑水潭一脉，便是这二十年里养肥的。说完他收了碗，说两枚铜钱听一段书，听多了要加价。","果":{"悟性":4,"因果":2,"灵石":-10,"修为":30}},{"名":"追问后来","文":"你追问那瞎子后来怎样。老头说，后来那瞎子就一直在山门外摆摊，摆到今天，谁也不知道他等什么。他说完把竹板一合，起身收拾。你跟着他出去，在小巷里问他这些书是从哪听来的。老头回头笑了笑，说：“听的次数多了，自己就成了一段书。”","果":{"悟性":3,"因果":3,"修为":20,"道心":2}},{"名":"掏钱续场","文":"你掏出三十枚铜钱放在碗里，说想听个全的。老头看着那碗钱，忽然不作声了。他把钱一枚枚数回去，只留两枚，说书是书，命是命，不能混。他重新坐下，把“那瞎子”一段改了个说法，说的是四十年前有个散修在山门外坐了三十年。你听着，觉得那是另一本书。","果":{"灵石":-30,"悟性":2,"道心":3,"因果":2}}]},{"id":"qinglan_049","题":"山门送信","类":"宗门","重":3,"域":["qinglan"],"境界":[0,3],"段":["{地点}的迎仙牌坊下，一个{人物}拦住你，手里捏着一封火漆信，说只要送上山，就给十块灵石。信是给洗剑峰上一位姓白的执事的，走正门进不去，得从西侧的柴道绕。他说得很急，手一直在抖，抖得火漆都裂了一角。","你接了信。走柴道时天已经黑了，{天象}，柴道两侧堆着枯枝，脚下一踩就响。走到半山腰，前头有人提灯等你，是个年轻剑侍，伸手就要那封信。你问他姓什么，他说姓白。可白日里那人说的白执事，是个五十来岁的老人。你把信往怀里按了按。","剑侍的笑淡了，把手按在剑柄上：“山里规矩，送信的只认信不认人。你把信给我，十块灵石照给。”他身后又走出两个人，都提着灯，灯光照得柴道一片明黄。你背后是下山的道，脚下是松的碎石。{天象}，山顶上传来一声钟响，只响了一下。"],"择":[{"名":"要凭据","文":"你说要凭据，请他把腰牌亮出来。他愣了愣，从腰间解下一枚木牌，牌背刻的编号与白日里那人说的对不上。你转身就跑，跑下柴道时听见身后有人骂了一句脏话。三日后你把信交给了真正的白执事，老人拆开看了一眼，把信烧了，给了你三十块灵石，什么也没说。","果":{"灵石":30,"因果":2,"声望":5,"气血":-12}},{"名":"交信走人","文":"你把信给了。剑侍接了，塞给你十块灵石，笑得像卸了个包袱。你下山时一路顺畅，没人拦。半年后你在{地点}听说白云峰上一位执事死于“闭关走岔”，所涉正是私通外域。你算了算日子，正是你送信后第九日。那十块灵石你一直没花。","果":{"灵石":10,"因果":3,"道心":-2,"悟性":1}},{"名":"拆信来看","文":"你假装掏信，趁灯火一晃，把火漆揭了半角，就着灯光只看了一眼：信里没有字，只有一张图，画的是一段山道的走向。你把信塞回怀里，说火漆裂了不敢交。剑侍脸色一沉，三人围上来。你把信往地上一扔，趁他们低头去拾，滚下坡跑了。","果":{"气血":-18,"悟性":4,"因果":2,"灵石":-20}},{"名":"转交落雁谷","文":"你把信带下山，第二天送到了{地点}的牙人手里。牙人拆开看完，把信折好，给你五十块灵石，说这信本该由他们先看。你问里头写什么，他没答，只说了一句：这山路，画的是别人家的后门。此后你在青云山下再没遇见过那个拦你的执事。","果":{"灵石":50,"因果":4,"道心":-3,"声望":-4}}]},{"id":"qinglan_050","题":"竹签占卦","类":"奇闻","重":3,"域":["qinglan"],"境界":[0,2],"段":["{地点}的算命摊摆在墙根下，一张矮桌，一副竹签，签筒被摸得发了亮。摊主是个瞎子，眼皮耷拉着，你说什么他都只点头。你本不信这些，可这日心里堵着事，便坐下让他算一卦，钱给三枚铜钱，多了他不收。","他摇了七下签筒，掉出一支，签上的字他看不见，让你念。你念了，是“山高路远，回头是岸”。他听完忽然笑了，笑得很轻，说你念错了，这支签上写的是“山高路远，回头无岸”。你说你念的是对的，我一个识字的人还会念错？","他不争，只把签收回去。{天象}，摊前的风把几张纸吹起来。他忽然从桌下摸出一只{器物}，放在你手边，说：这签我不收钱，你把这样东西带走，就算两清。你问他为什么，他说他算命三十年，头一回遇到念错签的人——签没写错，是念的人念对了，世道就错了。"],"择":[{"名":"收下器物","文":"你把那{器物}收了。回家拆开看，里头是一张很旧的竹纸，纸上是一份名单，七个名字，前六个都划了叉，第七个空着。你把纸折回去，塞进墙缝。三年后你在{地点}听说山门外那个算命摊收了，瞎子不知去向，桌上只留着一支竹签。","果":{"器物":1,"因果":3,"悟性":2,"魔念":1}},{"名":"再问一卦","文":"你说再算一卦，问的是这支签到底给谁。他摇头，说一人一卦，卦不可贪。你放下三枚铜钱想再求，他把钱推回来，说这钱不能收。你走的时候，他在身后说了一句：后生，你念对了签又如何，签还是那支签。","果":{"悟性":3,"道心":2,"灵石":-10,"寿元":1}},{"名":"替他看签","文":"你说你替他念签，念一年。他愣了愣，随即大笑，说这是三十年来头一个愿意念签给他听的人。那一年你在墙根下念了四千多支签，念到后来，闭着眼也知道哪支签会掉出来。年底他给你一块木牌，牌上没字，只刻了一个圈。","果":{"悟性":5,"声望":4,"修为":30,"灵石":-20}},{"名":"揭他招牌","文":"你伸手把他摊上那块写着“神算”的木牌摘下来，说他这卦是骗人的。街上的人都围过来看。也不恼，从桌下摸出一叠纸，每一张都是三十年来的卦底，算对了多少、算错多少，一笔一笔记着。他把纸摊开，说：你自己数。你数到一半，手停了。","果":{"悟性":4,"道心":2,"声望":-3,"因果":1}}]},{"id":"qinglan_051","题":"血衣童子","类":"奇闻","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的巷子很窄，白天也没有几个活人走。你被一阵哭声引进去，巷子尽头蹲着一个孩子，七八岁的样子，身上一件红衣，红得发褐，像浸过血。他抬头看你，脸是干净的，眼睛也是干净的，只是那件红衣在不断往下滴水。","你蹲下去问他家在哪。他说家在潭那边，又说他娘让他在这儿等，等一个人来接他。你问他等了多久，他伸出手指数，数到七就重头数。{天象}，巷子里的水汽越来越重。你注意到他脚边没有影子，也没有水渍——他的衣裳一直在滴水，地上却是干的。","巷口忽然传来一串铃声，三五下，停一停。孩子一听这铃声，猛地站起来，脸一下就白了，说他们来了，他们又来收人了。他往你身后躲，抓住你的衣角，那只手冷得像刚从井里捞出来。铃声更近了。你抬头，看见巷口有一个{人物}的身影。"],"择":[{"名":"挡在巷口","文":"你挡在巷口，掏出{器物}横在胸前。巷外的人看了看你，没上前，只把铃摇了两下便退走了。孩子在你身后慢慢松了手，衣裳上的水也止了。你回头，巷子尽头只剩一件叠得整齐的旧红衣。此后那条巷子再没闹过，只是每年清明，地上会有一小滩水。","果":{"因果":3,"道心":3,"魔念":1,"修为":60}},{"名":"问他是谁","文":"你没挡人，先蹲下去问他是谁家的孩子。他报了一个名字，你记下了。铃声到巷口时，那{人物}看见孩子，忽然停了手，把铃收进袖里，说这孩子是他外甥，七年前掉进潭里没捞上来。他把孩子抱走了，走时头也没回。那件红衣留在地上，干了。","果":{"因果":2,"悟性":3,"声望":4,"气血":-8}},{"名":"抱他出巷","文":"你一把把孩子抱起来就往巷外跑。跑出十几步，怀里的重量一点点没了，最后只剩一件湿透的红衣。你抱着那件衣裳站在街心，路人都避开你走。当夜你梦见一个孩子坐在潭边，背对着你，说谢谢，又说你别再来了。","果":{"气血":-15,"因果":3,"道心":2,"悟性":2}},{"名":"问他要什么","文":"你问他要什么。他说他想要一碗热粥，那天他是去买粥的，路上被人推了一把。你去街口买了一碗，端回来时巷子已经空了，只有地上摆着三枚旧铜钱，摆成一个圈。你把粥洒在地上，那三枚钱后来怎么找也找不着。","果":{"道心":4,"因果":2,"灵石":-5,"寿元":2}}]},{"id":"qinglan_052","题":"剑庐认剑","类":"人情","重":2,"域":["qinglan"],"境界":[1,4],"段":["{地点}的剑庐里来了个客人，是个瘦得脱形的{人物}，抱着一柄没有鞘的剑，说要把剑认回去。认剑是剑庐的生意，收十块灵石，看剑的来处、主人的手法、剑身上的旧痕，认出来便写一张字据。这人身上没钱，剑庐的老匠人也不赶他，只让他坐在门槛上等。","等你到的时候，他已经坐在那儿一整夜了。剑放在膝上，剑身有一道旧裂，裂口被人用铜丝绞过，绞得不算好。老匠人拿起来看了半晌，问这剑从哪来。他说是从{地点}捡的，主人是他的师兄，三年前失踪，他找遍了青岚域。","老匠人把剑放下，说这剑他认得，三十年前他亲手打的，剑主是个女修，姓什么不记得了，只记得她左手上戴着七个指环。那人脸色一下就白了。{天象}，剑庐的炉火噼啪响了一声。老匠人又添了一句：“这剑身上的铜丝，不是同一双手绞的。”"],"择":[{"名":"替付认剑钱","文":"你摸出十块灵石放在桌上。老匠人收了，写下字据，字据上写着剑的来历与那道铜丝的年份。瘦人拿着字据看了很久，忽然把脸埋在袖子里。他走的时候，把剑留在了剑庐，说你若哪天想要，来取。那剑至今还挂在梁上。","果":{"灵石":-10,"道心":3,"因果":2,"声望":4}},{"名":"追问铜丝","文":"你问他那道铜丝是怎么回事。他沉默很久，说他师兄失踪后，他在乱葬岗找到一具穿内门服色的尸，尸上的剑已经断了，他用铜丝绞好带回去。老匠人听完，把剑递给他，说我不能写这张字据——写了我就是害你。他抱着剑走了。","果":{"悟性":3,"因果":3,"修为":40,"道心":2}},{"名":"买剑","文":"你出八十块灵石买这柄剑。瘦人愣住，说不卖。你加到一百二，他还是不卖。最后老匠人开口，说这剑买不得，剑上还压着人的气。你收了钱，走出剑庐，听见屋里传来极轻的一声响，像是剑在鞘里翻了个身。","果":{"灵石":-120,"器物":1,"魔念":2,"因果":2}},{"名":"替他了断","文":"你问他知不知道师兄是怎么死的。他说知道，只是不敢说。你说那你现在说，我在。他就说了：是丹房的事。当日你们三人一起去了{地点}，把剑庐的字据交给了该交的人。老匠人到最后也没收钱，只把炉火拨旺了一点。","果":{"声望":8,"因果":3,"修为":60,"灵石":-20}}]},{"id":"qinglan_053","题":"潭心旧镜","类":"秘境","重":2,"域":["qinglan"],"境界":[3,7],"段":["{地点}的水在秋末最清，清到能看见潭心那块青石。青石上有一圈圈水锈，锈的正中嵌着一面{器物}，半张脸那么大，边缘碎了，还能照人。你是在血月之后下去的，不为别的，就为看那面镜子到底照出什么。","镜子里照的不是你。镜子里是一间屋子，屋里坐着一个穿旧袍的人，正在磨一柄剑，磨得很慢。你抬头看，潭面上只有自己的影子。再低头，屋里那人的剑已经磨好了，他抬起头来，面向镜子——那张脸不是你的，眉眼却与你极像。","你伸手去碰镜子，指尖刚触到水面，镜子里的屋门忽然开了，走进来一个{人物}，手里端着一盏灯。那盏灯的形状你认得，是{地点}老茶棚里用的那种粗瓷灯。镜子里的两个人说了几句话，你听不见声音，只看见那人放下灯，从袖里取出一封信，递给磨剑的人。{天象}，潭水忽然一圈一圈荡开。"],"择":[{"名":"取镜上岸","文":"你一把把镜子抠下来，抱在怀里浮上去。镜子出水的一瞬，凉得像冰，随即变温。你把镜子藏在{器物}里，三个月后才敢拿出来再看——镜子里还是那间屋子，只是磨剑的人不见了，桌上留着一封信。你看了信，把镜子砸了。","果":{"器物":1,"悟性":4,"因果":3,"魔念":2}},{"名":"看完再走","文":"你没有碰镜子，只是站着，把那间屋子里的每一样东西都看了个清楚。看到最后，磨剑的人从桌上拿起一封信，对着镜子递过来。你没接。他便把信放回桌上，熄了灯。你浮上水面时天已经黑了，此后很多年，你都记得桌上那封信的位置。","果":{"悟性":5,"道心":2,"修为":100,"因果":1}},{"名":"碎镜断念","文":"你以{器物}击碎镜面。水面炸开一圈白浪，潭底传来极长的嗡鸣。碎片沉下去时，你听见一个很轻的声音，像有人在很远的地方说了句“好”。上岸后你吐了三口黑水，气机反而通畅。此后你再没有梦见过那间屋子，却总觉得少了什么。","果":{"修为":140,"气血":-25,"道心":2,"魔念":-2}},{"名":"记下灯样","文":"你没碰镜子，也没多看，只把那盏粗瓷灯的样式记在心里。回去后你在{地点}的老茶棚里问，才知那种灯三十年前就不做了。你把灯的样式画下来，托人打了一盏。灯点起来时，光晕的形状与镜中一模一样。你把灯留着，一直没敢点第二回。","果":{"器物":1,"悟性":3,"因果":2,"灵石":-40}}]},{"id":"qinglan_054","题":"驿丞旧账","类":"人情","重":2,"域":["qinglan"],"境界":[0,3],"段":["{地点}的老驿丞七十岁了，背驼得厉害，走路要扶墙。驿站里只剩他一个人，哑巴杂役去年冬天死了，他说那小子是冻死的，死的时候手里还攥着一把柴。这日他忽然拉着你说，想请你替他把驿站的账清一清，清完他就走。","账本很旧，记了三十年的进出：谁在哪一年住过、谁欠了几枚铜钱、谁走的时候把马拴在了桩上、谁死后把包袱留在了驿站后头。你翻到一页，上头写着“欠茶钱两枚，来年还”，落款是一个名字。老驿丞说那个人第二年就死了，死在{地点}。","{天象}，驿站的灯油快烧完了。老人把账本合上，说这三十年的账，欠的人多半都死了，欠他的他也不要了，他只要你替他在账本末页写一句：云脚驿，清。他说完咳了一阵，从灶边摸出一样东西给你，是一只{器物}，说是早年间一个过路的散修留下的，托他转交给“将来会来的人”。"],"择":[{"名":"写清账目","文":"你在末页写了“云脚驿，清”五个字，字写得很正。老人看完，长长舒了一口气，像是卸下了什么。第二天早上他坐在门槛上走了，走的时候背是直的。你替他守着驿站三日，等到山下的人上来接手。那只{器物}你带走了。","果":{"器物":1,"道心":4,"因果":2,"声望":8}},{"名":"替他清账","文":"你没照他说的写，而是循着账本上的名字，一个一个去要账。要回来的钱不多，一共四十七枚铜钱，欠账的人里还有三个活着。你把钱拿回去时，老人看着那堆铜钱，忽然哭了，说三十年，头一回有人替他把钱要回来。他没再提“清”字。","果":{"灵石":20,"声望":10,"因果":2,"道心":3}},{"名":"问他那人是谁","文":"你问那散修是个什么样的人。老人想了很久，说是个话很少的年轻人，住了七夜，每天在院子里写东西，写完了就烧。第七夜他把那{器物}交给老人，说将来会来的人，你一看便知。老人说完，抬头看你，“我看你像。”","果":{"悟性":4,"因果":3,"器物":1,"道心":2}},{"名":"劝他别走","文":"你说这驿站不能没人，劝他再守几年。老人摇头，说他守了三十年，守的其实是一个人——那年有个孩子从这里往东走，走了没回来，他就一直守着，等着。他说那孩子若是回来，得有人给一碗热汤。他说完笑了，说他等了三十年，那碗汤自己都热不了了。","果":{"道心":3,"悟性":2,"寿元":1,"灵石":-10}}]}]},"tianjian":{"词汇":{"人物":["散修","游方剑客","负剑的少年","剑冢守冢人","藏锋阁铸剑师","断崖磨剑的老翁","执剑长老","崖顶听剑的女修","背三柄断剑的浪人","剑庐弃徒","葬剑人","洗剑池的杂役","剑意入魔的疯子","断锋会的刀客","卖剑穗的老妇","问剑台的记名弟子","藏锋阁少主","独臂剑修","赴冢殉剑的痴人","巡夜的剑冢弟子","云游的炉匠","碑前扫叶的哑仆"],"地点":["万仞剑峰","万剑崖","剑冢碑林","藏锋崖","洗剑池","问剑台","断锋谷","听剑亭","埋锋坪","剑心草坡","雷竹海","星陨铁坑","一线天剑隙","葬剑洞","剑鸣峡","赤霄剑柱","三千级剑阶","无锋石室"],"天象":["晴日有剑鸣自云中传来","暴雨时万峰如剑出鞘","剑意凝成白虹贯日","子夜万剑齐颤","剑冢上空浮着一层薄薄的铁腥雾","雷竹被雷劈出青光","云海裂开一道剑痕","霜降之日崖上血锈泛红","月圆时剑影自崖壁走出","风过万崖如万人拔剑","星落之夜剑冢生寒焰","大雾三日不散锁住剑阶","剑气冲霄惊得飞鸟不敢过","雪落不积只因剑意太利","剑冢深处传出金石相击之声","铁锈色的雨下了整整一夜"],"妖异":["剑冢食铁蚁","断锋鬼","负锈的剑傀","三首铁鹫","吞剑的白鳞蛟","剑灵化形的白衣童子","锈面人","沿崖壁游走的剑影","拾剑的赤目猿","以断剑为骨的尸修","雷竹精","葬剑洞的哑鬼","啃食剑穗的灰鼠妖","附在残剑上的怨魂","千年不死的守冢石兽","剑鸣峡的盲鲛"],"器物":["断成两截的青锋剑","无锋的玄铁重剑","剑柄缠着旧布的钝剑","只剩剑格的残剑","藏锋阁的三号剑匣","刻满名字的剑鞘","装过血的酒葫芦","生锈的磨剑石","星陨铁铸的剑胚","有九道裂纹的剑丸","剑冢的引路铜铃","半枚剑穗","薄如蝉翼的快剑","赤霄剑柱上垂下的断链","一枚剑形木牌","藏锋阁的试锋铜人","剑心草编的护腕","沉在洗剑池底的剑匣"],"灵材":["剑心草","星陨铁","崖顶雷竹","铁锈苔","剑鸣石","赤霄铜","剑冢寒泉","锈红藤","雷击竹心","埋锋土","剑穗丝","九锻砂","剑冢白蜡","断锋谷的玄铁砂","洗剑池沉泥","剑形灵芝"],"功法":["《万剑归宗》","《藏锋诀》","《断剑十三式》","《一剑三生》","《锈剑经》","《快剑一字诀》","《重剑无锋篇》","《钝剑养锋法》","《择人剑意》","《葬剑人歌》","《听剑录》","《三出剑》","《洗剑诀》","《剑心通明》"],"际遇":["于剑冢拾得半柄认主的残剑","在洗剑池底摸到一枚剑匣","被崖顶雷竹引落的天雷劈中而悟剑","在碑林读到与自己同名的剑铭","夜里听见有人在剑冢低声数剑","得藏锋阁老匠赠一柄未开锋的剑胚","误入葬剑洞听见有人唤自己的名字","暴雨中被万剑齐鸣惊醒","在问剑台连输九场却不想走","见一柄断剑自己插回崖上","遇独臂剑修在崖上磨一柄无锋剑","于剑心草坡睡了一夜醒来满身剑意","拾到一枚写着生辰的剑形木牌","替守冢人扫了三年碑","在断锋谷见两人以断剑换命","被剑意压得吐血却不肯退","于剑鸣峡听出剑中有哭声","捡到藏锋阁遗落的三号剑匣"],"祸患":["被同门指为盗剑之人","剑意入体走火入魔","被断锋会追杀三百里","在剑冢失剑而被逐","被剑傀缠上夜夜来索","遭人嫁祸于问剑台失手伤人","被师门逼着赴死战","剑心草反噬蚀了经脉","被锈面人偷走本命剑","误以他人剑铭为己名","被执剑长老断了一臂","剑匣里的剑不肯认主反伤己身","被云游剑客以一剑换去十年寿","遭葬剑洞的哑鬼夺了声音","剑意太盛引来天雷劈庐","被洗剑池的旧怨剑主认作仇人"],"宗门":["万剑冢","藏锋阁","断锋会","听剑楼","北崖剑庐","洗剑池执事堂","剑冢巡守","太虚道宗","万宝阁","天机楼"],"地名":["天剑域","万仞剑峰","剑冢","藏锋崖","断锋谷","问剑台","剑鸣峡","赤霄剑柱","雷竹海","一线天"]},"图鉴":[{"类":"地理","名":"万剑崖","卷":1,"文":"万剑崖在万仞剑峰之腰，横开三百丈，崖面插剑如钉。相传上古有天剑坠落于此，碎作万段，剑修便各取一段插回崖上，以示不忘剑。年深日久，崖壁被剑意浸透，凿石不入，取土不陷，风过时万剑齐鸣，声如潮汐，谷中樵夫闻之必跪。崖分七段，每段有守，寻常人止步于第一段。","引":"《剑冢录》云：剑不在崖，崖即是剑。"},{"类":"地理","名":"剑冢碑林","卷":1,"文":"碑林在剑冢北麓，石碑不下万块，皆无生卒年月，只刻一柄剑的形制与一句断语。有人刻断肠人剑未断，有人刻我负剑剑不负我，也有只刻半个姓氏的。碑下不许焚香，只许插剑，插得越深，说明主人越不肯走。守冢人有言，碑林夜半常闻人声，是那些刻字的人在互相认。","引":"刻碑者不死，死的是碑上的字。"},{"类":"地理","名":"洗剑池","卷":1,"文":"池在剑冢西口，水黑而寒，四季不冻。传为古代剑修洗去剑上血迹之地，凡杀人过百者，剑须入池三日。池底积匣无数，世称剑冢底。有渔人说池中有大鱼，鱼腹剖开皆是剑穗；也有说池水通幽冥，夜里能听见水底有人补剑鞘。执事堂立碑三条：不取匣，不下水，不夜浴。","引":"剑洗其血，血洗其人。"},{"类":"地理","名":"断锋谷","卷":1,"文":"谷在剑冢东南，一沟两壁，皆是断剑插地之痕。旧时有剑客相斗，败者折剑于此，胜者亦折，遂成风气，谷底断锋积至三丈。谷中无草，唯生玄铁砂，色赤，可铸剑胚。近三十年成了悬赏买卖的地界，谷口常挂新斩的首级，谷中常有新埋的人。","引":"入谷者挟剑，出谷者挟名。"},{"类":"宗门","名":"万剑冢","卷":2,"文":"冢中无主，唯剑择人。宗门不设山门，亦不记辈分，凡得剑者即为门人，失剑者自逐。门人分巡守、葬剑人、碑仆三等，巡守持引路铜铃夜行百崖，葬剑人负尸入壑，碑仆专修残碑。冢中律法只有一条：剑不认主，不许强夺，夺者全冢共诛。千年来被诛者七人，尸皆插在崖上。","引":"剑择人，人亦择死法。"},{"类":"宗门","名":"藏锋阁","卷":2,"文":"阁在藏锋崖，以铸剑养剑闻名，藏剑十万，分三等九号，三号剑匣最贵，匣内衬以剑心草编的软席。阁中弟子不称剑修，称铸者与养者，铸者三年出一剑，养者十年不拔剑。阁主一生只出过三剑，每出一剑，必先斋戒百日。阁中有一条旧规：剑成之日不试锋，试锋之日不饮血。","引":"善剑者藏，不善剑者出。"},{"类":"人物","名":"藏锋阁主","卷":2,"文":"阁主姓氏不传，阁中人只称阁主。据《藏锋旧谱》，其一生只出三剑：第一剑斩断北崖剑庐的山门，第二剑挑了断锋会十三位堂主，第三剑之后再无人见其拔剑。有人问他为何不再出剑，他说剑出得多了，人就钝了。阁主养剑之法极怪，每日与剑对坐一个时辰，不言不动，谓之听锋。","引":"一生三剑，剑剑改局。"},{"类":"人物","名":"守冢人","卷":1,"文":"守冢人不传名，代代相承，任者须先葬一柄自己最爱的剑。守冢人掌崖门七日一开之期，辨剑气，断剑缘，量来人心性。其腰间常悬一枚引路铜铃，铃声所至，剑影退避。传言守冢人不能下山，下山则剑冢乱；又说守冢人本就是被剑留下的人，只是自己不知道。","引":"守的不是坟，是门。"},{"类":"地理","名":"藏锋崖","卷":1,"文":"崖在万仞剑峰之东，高七千三百级，石色青黑如淬过的铁，摸上去有股冷油味。崖顶风急，炉烟不成缕，皆横着走。阁中铸炉九座，依崖势而建，火借风力，故不需鼓风之器。崖下有洗剑池，水入崖腹，绕炉一周而复出，阁中人谓之剑脉。每年冬月，崖上结霜而炉不熄，霜落炉壁即化，化作白汽如剑形；寒夜远望，似崖上插了万柄白剑，随风摇而不倒。阁中老人言，藏锋崖不藏剑，藏的是火。","引":"《藏锋旧谱》：锋可藏，火不可藏。"},{"类":"地理","名":"问剑台","卷":1,"文":"台在剑冢南麓，整块青石，高三丈，台面平滑如水，唯九道剑痕不入平滑，痕深处可容半掌。传为千年前九位剑修以命相搏所留，痕各有主，后人补刀不入，也补不好，补过的地方三年必裂。凡入剑冢者先上台，输够九场而能自立者，方许上崖。台上无裁判，胜负自认；台下有记名弟子，专录输者败因，录完还要让输者自己按一个指印。旧例一年一次，后改一月一次，近三十年又改七日一次，只因来者太多，崖上装不下。","引":"台上九痕，痕痕都是别人替你留的。"},{"类":"地理","名":"剑鸣峡","卷":1,"文":"峡在剑冢西南，两壁夹一线天，长三十里，终年积雾，雾里有铁腥。峡中插剑三百余柄，皆为无主之剑，传闻其主死于峡外，剑自归而入，插得极深，拔不出来。夜静时峡中常有细响，或如虫鸣，或如泣，剑修谓之剑哭。入峡者可行雾中听剑，听得出剑之旧主何人、死于何处、死时说了什么；然听多则伤神，有听了十日不能言者。峡口立一石，上刻四字：听者自负。石上无年款，字迹已被人摸得发亮。","引":"剑哭不择人，人自择其听。"},{"类":"地理","名":"雷竹海","卷":1,"文":"竹海在剑峰西麓，方圆百里，竹高十丈，节间有纹如雷，故名雷竹。此地多雷，雷常劈竹而不焚林，竹得雷气则心青而坚，断之可养剑意，一节能抵三年静修。采竹者须在雷停后一个时辰内动手，过时竹心之青即散，散则如枯柴。乡人不敢尽采，言竹海有数，采过其数则雷迁于村，迁到村口，村必烧。竹海深处有旧庐一所，庐主不知何年入海，只知其人尚在，因每逢雷雨，庐中必有人声，说着一些谁都听不懂的旧地名。","引":"竹受雷而青，人受雷而白。"},{"类":"地理","名":"埋锋坪","卷":1,"文":"坪在剑冢北，一片缓坡，长三百步，坡上插满剑柄，柄下皆是无名之坟。剑冢之法：剑先葬，人后葬，剑不入土则人不入土。故送葬者须先送剑，葬剑人接剑，问死者最后一战立于何处，高者浅埋，低者深埋，谓之让剑先安。坪上不立碑，只插剑柄，柄上不刻名，因名已刻在剑上，人忘了剑还记得。近年坪地不足，守冢人于坡外另辟一坪，谓之新锋坪，新坪的土还是生的，踩上去会陷。","引":"先葬剑，后葬人，剑比人金贵。"},{"类":"风俗","名":"三千级剑阶","卷":1,"文":"自藏锋崖底至崖顶，石阶三千，级级刻名，名皆剑修，皆曾登临者。登完者名刻于顶，未登完者，其名由后来人踩磨而平，谓之借脚。阶上有三处歇台，台上各插一柄剑，供人扶着喘息，剑柄都被摸得温润，像有人刚刚握过。阁中旧例：每三十年清阶一次，磨去已登顶者的名，让位于后来者，磨下的石粉要收起来，倒进炉里；只有第一千级那个名字从未磨过，一字而已，无姓，无人知其为谁，问阁中老人，都摇头。","引":"阶有三千，人只有一双膝盖。"},{"类":"风俗","名":"剑冢开崖","卷":1,"文":"剑冢每七日开崖一次，日出而启，日落而闭。开崖之日，崖门自开三丈，凡身带剑气者可上；上者不得携绳，不得三人以上结伴，不得负尸下行。崖分七段，段段有守，守者持引路铜铃，铃响则剑影退避，铃不响则人自退。闭崖之时未下崖者，其名自记于崖门石上，来年开崖再看，若名已磨平，即为葬于崖上。故有剑修一上崖便不再下来，不是不能，是不肯。守冢人对此从不置评，只在关崖时多敲一次铃。","引":"门开七日，人只还一半。"},{"类":"风俗","名":"剑穗","卷":1,"文":"剑修系剑穗于剑柄，非为好看。穗长不过三寸，以丝线三股绞成，死扣藏于内，遇血则紧，可防剑脱手，故有老剑修言：穗比手可靠。穗色有其法：青者示未杀人，红者为报仇，黑者为守丧，白者为葬剑人专用。天剑域风俗，穗只收不送，送穗者示其命，等于把命交出去一半；受者接了，就要应一件事。洗剑池边卖穗的老妇说，一柄剑只有一次送穗的机会，送了就换不回来，硬要换，线会自己断。","引":"穗不送人，送者送命。"},{"类":"宗门","名":"断锋会","卷":2,"文":"会中人多背断剑，以断处为刃，出手只使断的那一截，断口越不平越难防。入会须先断自己一柄剑，断得越干净，位次越高；断不断得干净，看的是你舍不舍得。会分三堂：快堂使短而快，重堂使沉而钝，钝堂最怪，专收断了剑又不肯换的人。会训只有一句：剑断则不受制于人。近三十年会中接悬赏、护商队、替人收债，与万剑冢极不睦，冢中弟子见了背断剑者，多绕道走。","引":"断的不肯换，换的不算断。"},{"类":"宗门","名":"北崖剑庐","卷":2,"文":"剑庐在天剑域北崖，山门是一道石梁，梁上无匾，只刻一柄没有锋的剑。庐中不收名门弟子，专收无门无派之人，来者须交出自己的旧剑，庐主封之于库，三年不发还，谓之忘剑。庐规有两条：一不传子，二不与藏锋阁往来。前者因庐主亲见亲族相残，后者因六十年前藏锋阁主第一剑斩断了庐中山门，至今留着一道豁口，庐中人不补，年年以红漆描之。剑庐弟子无多，止三十七人，人人使剑皆不重样。","引":"北崖不补山门，只描红。"},{"类":"宗门","名":"洗剑池执事堂","卷":2,"文":"执事堂在洗剑池东，三间石屋，屋前一口钟，钟身无纹，只在钟口刻着三个数字：一、三、七。堂中执事九人，皆非剑修，多为算账出身，管池、管穗、管价、管悬赏、管崖门开关之期。凡谷中相斗、崖上失剑、池底失匣，皆投状于堂，堂中只做一件事：按例断。堂中立碑三条：不取匣、不下水、不夜浴。执事堂无权无势，却无人敢犯，因为犯了例的人，第二日就会被全谷的人知道。","引":"堂中断例，例断人。"},{"类":"人物","名":"葬剑人","卷":1,"文":"葬剑人不问死者姓名，只问最后一战站在哪里，站得高还是低，剑在手里还是在鞘里。问完便走，走得极快，负尸入壑，一炷香即返，身上不沾土，只沾一点铁锈味。其腰间悬一短铲，铲柄缠布，布色黑，遇雪不化。传言葬剑人从不葬活人的剑，曾有人以重金请他埋一柄尚在认主的剑，他把钱退了，说剑还在选人，埋了就是害人。又言葬剑人本有名字，入行那年自己把名字刻在埋锋坪，刻完就忘了。","引":"《埋锋记》：葬剑者不葬名。"},{"类":"人物","名":"剑冢巡守","卷":1,"文":"巡守夜行百崖，二人一组，一人持铃，一人持无锋短剑，遇剑影则摇铃，遇人则先问一句话：你的剑在哪里。答不上来的，多被押下崖去。巡守不佩长剑，因崖上剑太密，佩长剑者容易被剑意勾走，走到半路自己拔剑。巡守的位子不世袭，须由失剑而不失心者担任，故巡守多半是些断过剑的人，话少，走路低头，看人只看手。守冢人每月查一次铃，铃哑者即换。","引":"巡的不是崖，是那些不肯走的人。"},{"类":"法宝","名":"三号剑匣","卷":2,"文":"藏锋阁藏剑十万，分十号匣，三号匣最贵。匣以赤霄铜为骨，内衬剑心草编的软席，席下铺埋锋土三寸，可养剑意，使剑不生锈、不认错主。匣盖有锁扣，扣上一枚剑形铜片，须以剑气叩之方开，故无剑气者得匣亦无用。阁中三号匣只十二具，一具在阁主座后，一具在洗剑池底，余十具散在人间，去的都是不该去的地方。阁中老人说，三号匣认匣不认人，落在谁手里，谁的运就跟着匣走。","引":"匣养剑，剑养匣中人。"},{"类":"法宝","名":"无锋之剑","卷":2,"文":"此剑出藏锋阁，长二尺七，重四斤，刃口朝里，故谓之无锋。寻常剑锋在外，斩物；此剑锋在内，斩持剑之人。阁中铸者言，铸此剑须以自身指血淬火，淬时炉火不旺，反要压火，压到火熄为止，熄一次，剑长一寸。剑成之后从不试锋，因试锋者必自伤。阁主第三剑未出之前，曾以此剑对坐百日，之后命人沉入无锋石室。近年有人从石室取出过一柄，持之三日，第四日手不能握，第五日不认得家人。","引":"锋朝外者伤人，朝内者养人，也吃人。"},{"类":"法宝","名":"引路铜铃","卷":1,"文":"铜铃大如鸡子，铃身无纹，内悬一舌，舌是断剑尖磨成的。铃声不脆，闷而短，听见的人只觉得胸口一沉。剑冢崖上剑影多，遇铃即退，退得极快，故巡守与守冢人皆佩之。铃有数：一铃管一段崖，第七段的铃至今无响，守冢人换了三枚，皆哑。旧例，铃不可赠，只可借；借铃者须留下自己一柄剑作押，还铃时剑还你，剑若在借期内响了，铃归你。故有人为得一铃，故意让剑响。","引":"铃响剑退，铃哑人退。"},{"类":"法宝","名":"试锋铜人","卷":2,"文":"铜人在藏锋崖下，一排七具，高与人齐，锈得看不出眉眼，肩背之上却有三千道剑痕。铜人不还手，只记你出剑的毛病：起手快者，痕在肩；收势迟者，痕在腰；心浮者，痕在胸口，一道不落。试锋者出三剑，铜人不动，到第三剑必弹开你，弹的角度与你自己毛病的方向一致。铜人有一异处：被劈落的铜臂会在七日后自生，重生之臂比旧臂薄一分，故七具铜人皆残缺，无一是全的。","引":"铜人不用打你，你自己会露出来。"},{"类":"丹药","名":"剑心草","卷":1,"文":"草生剑意浓处，叶赤如锈，细长似剑，一株只生三叶，叶尖朝天，风过则相互轻击，声如极小的剑鸣。采者以竹刀断其根，断处以土覆之，三日自愈，故草不可尽采。根嚼之极苦，苦过之后心静，静到能听见自己的剑在想什么，剑修谓之听锋。入药则可镇剑意入体之症，然不可多服，多服者三日内不辨亲疏，只认剑。剑冢巡守每年秋末采一篓，晒干存于碑林石室，供人急用，取者须留名。","引":"草有锋而不伤人，人有心而不自见。"},{"类":"秘闻","名":"剑鸣石","卷":1,"文":"石出断锋谷深处，色青灰，质脆，敲之则鸣，鸣声长短不一，长的能响半炷香。谷中人说，石中困着剑鸣，剑死了，声音还没死。以石磨剑，剑锋可添一分寒气，然磨过三次之后，石不再鸣，磨剑者夜里会梦见有人在他耳边数数。执事堂曾收石三百斤，封于池边，不许买卖，后不知何故又尽数散出，散得极快，快得像有人怕它们留在谷里。","引":"石鸣三日，人哑三年。"},{"类":"秘闻","名":"洗剑池沉泥","卷":1,"文":"池泥乌黑，腥而冷，握之如水银，久久不干。泥中有极细的铁屑，皆为千年来洗剑所落，以泥敷剑，可去剑上旧血，亦可使新剑不生锈。然泥有一忌：不可敷于未认主之剑。敷了，剑会认泥，不认人，持之者一拔剑就见池底的影子。执事堂曾禁人取泥，禁了三十年，池边却总有新挖的坑，坑口小而深，像是用剑尖挖的，挖完还要把泥填回去一半。","引":"泥记得每一柄洗过的剑。"},{"类":"秘闻","名":"赤霄剑柱","卷":2,"文":"柱在剑冢心腹之地，高九丈，赤色如新淬，柱上垂一断链，链粗如人臂，断口平整。柱面无字，唯近地三尺处有一处凹陷，形如人握剑之手。传闻此柱为古时镇剑意之物，链的另一端原系着一柄无主之剑，剑走之后链自断，断后柱身年年矮一寸。有人量过，三十年矮了三寸。柱下一圈空地不生草，踩之松软，如踩在旧年积雪上。阁中旧档称此柱为赤霄，其余一概不载。","引":"柱矮一寸，人间多一剑。"},{"类":"地理","名":"葬剑洞","卷":1,"文":"洞在剑冢西壁之下，口小如门，内里极深，进者须侧身。洞中无光，有风自内出，风里带铁腥与旧纸味。剑冢旧法，断剑不弃，凡断者尽葬于此，故洞中剑不下万柄，铺成一层剑地，踩上去会响。洞有名曰哑，因入洞者多失声，先失声，再失名，最后失愿。守冢人每年清明入洞一次，只带一柄无锋剑，出来时剑必换一柄新的，无人问为什么。","引":"剑葬于洞，人葬于忘。"},{"类":"地理","名":"一线天剑隙","卷":1,"文":"隙在剑冢东南，宽一尺，长十里，两壁笔直如刀削，壁上无苔，唯有一道道剑痕，痕皆从左向右斜下，方向一致。隙中常年有风，风急时可吹人贴壁，风静时能听见远处有水滴之声，然寻遍十里不见水。传说此隙为一剑所开，开隙之人死在其中，尸首至今未出，隙底有石室一所，室中坐着一具不腐之身，膝上横剑。近三十年入隙者十一人，出来七人，七人皆不记得自己怎么进去的。","引":"一线之天，十里的黑。"},{"类":"功法","名":"快剑一字壁","卷":2,"文":"壁在剑鸣峡外，石高一丈，上刻一字，笔画极简，据说便是《快剑一字诀》全部。字已被人看烂，看成一个空洞，边角被指头摸圆。看壁之法不靠眼，靠闭目数念：念起则剑慢一寸，念灭则剑快一分，练到不想为止。壁上另有一撇已被削去，是三十年前一位剑修试剑所留，削口至今新亮，不见锈。看壁者多，成者少，成者通身有一股急气，走路比常人快半拍，停不住。","引":"快不是手快，是不想。"},{"类":"功法","名":"藏锋诀","卷":2,"文":"阁中不传之诀，共九段，段段讲藏：藏锋、藏气、藏意、藏杀、藏名、藏剑、藏人、藏心、藏死。前六段尚可授，后三段只授阁主。诀法极怪，不教拔剑，只教收剑：一剑出鞘之后如何在一息之内归鞘，归得不带风声，不带杀意，连剑锋上的血气都要收回去。练成者出手极慢，慢到对手以为他不会武，走近三步才知自己已经死了。阁主一生三剑，皆以此诀收势，收得干干净净。","引":"会拔剑的是剑客，会收剑的是阁主。"},{"类":"功法","名":"三出剑","卷":2,"文":"藏锋阁主自撰，全书只三页，一页一剑，每页只画一个起手，不着一字。传闻第一剑斩断北崖剑庐山门，第二剑挑断锋会十三堂主，第三剑至今未写，第三页是空的。阁中人言，第三页不是没写，是写不出来，因为写出来就成了定法，定了法就不值钱。此诀不可强学，学之者多半在第二页停下，停下的都在崖上住了下来，替阁主守第二剑的旧账。","引":"三剑之中，最重的是那把没出的。"},{"类":"功法","名":"断剑十三式","卷":1,"文":"断锋会所传，十三式皆以断剑为使，剑只剩半截，招式却因此短而狠，专攻人下三路与手腕。第一式曰断，末式曰不换。会中弟子入门先断剑，断后练此诀，练到能用断口削断一柄完好长剑，方算入门。此诀有一忌讳：不可与完好之剑对练超过九招，超过九招者，多会忍不住把断剑扔了。会中老人说，这不是剑法，是脾气。","引":"断口不平，人心不平。"},{"类":"秘闻","名":"择人剑意","卷":2,"文":"剑冢之剑能择人，世人多以为是剑有灵，其实不然。守冢人言，剑意本无主，插在崖上百年，便记下了那片崖的形状、风向、雾的浓淡；人走近时，若此人的呼吸、步幅、握剑的角度与那形状相合，剑便自出。故所谓认主，认的是相合，不是情分。剑意合者，剑轻如木；不合者，重如碑。也有合了一半的，剑提着走，走三步响一声，响得人心慌，这种剑最难处置，葬也不是，留也不是。","引":"剑认的不是人，是那个人走路的形状。"},{"类":"法宝","名":"一字剑","卷":2,"文":"藏锋阁出过一柄剑，无名，剑身窄如指，长二尺六，重一斤二两，剑格上只刻一个字：一。此剑快得出奇，出鞘到归鞘只在一息之间，中间的事持剑人自己都说不清。阁中老匠说铸此剑火不能旺，旺了剑就燥，须以文火养七日，每日只捶三下，多一锤则快一分，快过了头就断。此剑只出过三柄，三柄皆不同主。持之者有三忌：不可久持，不可夜行，不可与人争辩，争辩时手比嘴快。","引":"快剑不给人后悔的时间。"},{"类":"法宝","名":"断岳","卷":2,"文":"剑长四尺八，重二十七斤，无锋无脊，剑身厚如城砖，正面铸两个字：断岳。此剑不斩人，只压人；一剑落下，石裂三丈，人立不起来，站起来了也抬不起手。藏锋阁铸此剑花了十一年，炉火压了十一次，压到炉工换了四个，最后一个炉工铸成之后不再开户。持剑者须自备一根腰绳，绑紧，不然劈到第三下腰就折。剑冢巡守不许此剑上崖，怕它把崖压塌，压塌了剑没人捡。","引":"重剑无锋，落在谁头上谁知道。"},{"类":"法宝","名":"老铁","卷":1,"文":"此剑原无名字，因剑身灰黑如旧铁，人唤老铁。无锋，剑脊厚一寸，磨了四十年仍不见锋，磨石倒是磨穿了十七块。老铁有一怪处：与人相斗从不伤人，只压人手腕，压得人握不住剑，然后收手，从不补第二下。剑主死前把剑插在崖上，插了三百年，无人能拔。守冢人说，这剑在等一个不急的人；来试的人越多，它插得越紧。","引":"钝的不肯快，快的不肯钝。"},{"类":"法宝","名":"十七","卷":1,"文":"此剑断在第十七场争斗，故名十七。断口齐整，只剩二尺一，断处被人用布缠了七层，缠了二十年，布色由白转黑。持剑者用断口斩人，斩法极不讲理，专攻膝弯与手腕，断口处的铁比新锋更利。断锋会把它印在会旗上，旗上不画剑，只画一道斜的断口。会中人说，十七的断口比谁的锋都诚实，因为它从来不说自己能斩多远。","引":"断了才晓得自己有多长。"},{"类":"秘闻","名":"无鞘之剑","卷":1,"文":"剑冢里有剑不配鞘，因鞘是给它藏的地方，它不肯藏。无鞘之剑插在崖上，剑身常年露在风里，两面都起了霜，霜化了也不擦，擦的人多半会割破手。守冢人说，无鞘的剑最难驯，因为它什么都不肯收；收不进去的剑，往往也拔不出来。近年崖上有三柄无鞘剑，两柄已经锈死，锈得连剑格都认不出，只剩一柄还在响，响得极轻，像有人在鞘里呼吸。","引":"不肯入鞘的，多半也不肯入土。"},{"类":"秘闻","名":"剑冢碑谱","卷":2,"文":"碑谱是执事堂的旧册，记着崖上每一柄剑的位置、来路与择主之兆。谱分三卷：上卷记有名之剑，中卷记无名之剑，下卷只有一页，记那一柄插在崖顶、从不与人照面的剑。下卷那一页是空白，只盖了一个印，印文两字：无主。翻谱者须先洗手，洗到指缝里没有铁腥为止；堂中老人说，谱上不干净，翻多了眼睛会花。谱每三十年重抄一次，抄的人要换，不许同一人抄两次。","引":"剑有名，人无名，谱只好空一页。"},{"类":"风俗","名":"洗剑池旧约","卷":1,"文":"洗剑池立有旧约三条：一不取匣，二不下水，三不夜浴。约是千年前立的，立约者不知何人，约石上的字被人摸得发亮，摸得连笔画都圆了。执事堂说这三条约是池自己定下的，不是人定下的，人能改，池不能。犯约者并非立死，只是从犯约那日起，剑上会慢慢生出一层洗不掉的锈，锈从哪里起，自己心里清楚。谷中有言：约在池底，不在石上，石头会烂。","引":"约在池底，人在岸上。"},{"类":"功法","名":"葬剑人歌","卷":2,"文":"《葬剑人歌》共九段，句短而涩，唱起来像哭，唱到第三段嗓子必哑。歌中不授招式，只授一种本事：听剑。练成者能在十步之内听出一柄剑的岁数、旧主的死法与剑上还有多少不肯散的意。葬剑人唱此歌时低头，唱完要往地上吐一口唾沫，说是替死者还的。会唱全九段的人极少，唱到第九段还站得住的，几乎没有；有人说第九段唱的不是剑，是唱的人自己。","引":"唱的送人，听的送己。"}],"事件":[{"id":"tianjian_001","题":"万剑择人","类":"机缘","重":3,"域":["tianjian"],"境界":[0,6],"段":["万剑崖下，{天象}，{人物}牵着你往崖上走，说剑冢每七日开一次崖，凡是身上带一点剑气的都能上去。你仰头看那座万仞剑峰，崖壁上插着密密麻麻的残剑，风一过，剑身相击如潮，声音低低地贴着骨头往下走，像有人在极深的井里数着数。","走到半山，一柄{器物}忽然从岩缝里脱出来，剑尖对着你，悬在三尺之外一动不动。守冢的老人说这叫剑择人，剑先看你的手稳不稳，再看你的心贪不贪。他这辈子见过太多人伸手，有一半人被剑削去了半只手掌，另一半人得了剑，最后又把自己插回了崖上。","剑在山雾里轻轻颤，颤得极细，像在数你的呼吸。你身后有人低声催促，也有人已经悄悄退开，退得连脚步声都收了。你的手抬到一半，忽然想起自己上山究竟是为了什么，那句写在{功法}里的话就在这时候浮上来，晃得你眼睛发涩。"],"择":[{"名":"伸手","文":"你握住剑柄的一瞬，剑脊上的锈屑落进掌心，割开一道不深的口子。剑没有认你，也没有拒绝你，只是从那日起，你的梦里多了一片剑鸣不止的崖，梦里你总在往上走，走不到顶。","果":{"修为":120,"悟性":2,"因果":1,"气血":-15}},{"名":"退步","文":"你把手收回袖里，往后退了三步，退到老人身侧。剑在空中悬了一息，掉头插回石缝，锈屑簌簌地落。守冢人看了你一眼，说懂得不伸手的人，剑冢会记着，然后指给你一条下山的近路，你走的时候觉得脚下比来时稳。","果":{"声望":4,"道心":2,"灵石":30}},{"名":"先问名","文":"你没有伸手，先问它叫什么名字。老人在旁边愣了一下，说三百年没人问过这句话。你凑近剑格，认出半个被磨平的字，念出来的那一刻剑落进你手里，轻得不像铁，像一根被水泡透的旧木。","果":{"悟性":3,"修为":60,"因果":2}}]},{"id":"tianjian_002","题":"断锋谷三杀","类":"争斗","重":2,"域":["tianjian"],"境界":[1,7],"段":["断锋谷里没有活水，只有一道被剑气劈开三十丈的石沟，{天象}。你蹲在沟底擦剑，听见上游传来三声闷响，像有人把三柄剑同时插进土里，又像三具身子同时跪下去，跪得整整齐齐。","抬头时，{人物}正踩着血水往下走，腰上挂着{器物}，一手提剑，剑上不沾血，血全落在他靴底。他说他在谷里杀了三个抢剑的人，杀到第三个才看清，那三个都只是替人试剑的杂役。他问你，愿不愿意替他背这个名声。","沟边的断锋上还插着半截剑，剑柄缠布，布上绣着一个姓氏。你知道谷外的{宗门}正悬赏杀他，也知道他杀人时用的正是{功法}里的路子，一招一式都不留退路。他把剑递过来一半，剑尖朝地，等你的手。"],"择":[{"名":"接过剑","文":"你握住剑柄，血还温着。他笑了一声就把剑鞘扔进深沟，转身走了，留你一个人站在原地替三个死人守夜。天亮时{宗门}的人围上来，你才知道剑柄上那个姓氏是谁的，也知道自己替谁背了这口锅。","果":{"灵石":-80,"修为":150,"魔念":2,"因果":2,"声望":-5}},{"名":"摇头","文":"你把手垂回身侧，说这名声太重，背不动。他没恼，只把剑收入袖里，踩着血水往上走。你在谷底坐到日头偏西，才发觉自己的手一直在抖，抖得像刚替人拔过剑，又像刚替人收过尸。","果":{"道心":3,"寿元":3}},{"名":"问名","文":"你问他那三个人叫什么。他停下脚，回头看了你很久，最后只说了句不知道，声音轻得不像杀过人的。他把{器物}留在石头上就走了，那东西上还带着另一柄剑的剑痕，深得能养鱼。","果":{"悟性":2,"修为":40,"因果":1,"器物":1}}]},{"id":"tianjian_003","题":"试锋铜人","类":"宗门","重":3,"域":["tianjian"],"境界":[0,4],"段":["藏锋阁不收弟子，只收剑。你带着{器物}到了藏锋崖下，崖壁前一排铜人，锈得看不出眉眼，却个个立得笔直，像一排等着受罚的兵。守崖的{人物}说，先过试锋，铜人不还手，只记你出剑的毛病。","你出第一剑，铜人不动；第二剑，铜人肩上的锈掉了一块；第三剑，剑被轻轻弹开，虎口发麻，麻到肘弯。老人说铜人身上有三千道旧剑痕，每一道都是一个来试锋的人留下的，毛病一样的人，留下的剑痕也一样深。","他递给你一块磨石，说想留在藏锋阁，先学会把自己的毛病磨掉。崖上风很大，{天象}，铜人在风里发出低低的嗡声，像在打盹。你听见更高处有人铸剑，锤声一下一下，很有耐心，比你练过的所有剑法都慢。"],"择":[{"名":"留下磨剑","文":"你在崖下磨了三年剑，磨到铜人肩上那道旧痕与自己的缺口严丝合缝。老人说你成了。第三年冬天他不见了，只留下一把钥匙和一句别开北崖的门，你把钥匙挂在腰上，一直没问北崖有什么。","果":{"修为":200,"悟性":3,"寿元":-3,"声望":5}},{"名":"另投别处","文":"你抱剑下山，觉得藏锋阁的规矩太旧，磨三年剑不如挣三年灵石。半年后你在断锋谷听人说起那排铜人夜里会自己走动，替阁里杀过三个偷剑的人，动作慢得像在磨自己身上的锈。","果":{"灵石":60,"因果":1,"修为":30}},{"名":"劈铜人","文":"你恼了，一剑横劈，铜人断了半条臂，锈水溅了你一脸。老人没拦你，只说铜臂七日后会重铸，你的名字却要记进阁里，记在试锋谱上，往后来人都会看见有人曾向铜人撒气。","果":{"修为":80,"魔念":1,"声望":-3,"器物":1}}]},{"id":"tianjian_004","题":"剑鸣自云来","类":"天象","重":4,"域":["tianjian"],"境界":[0,7],"段":["{天象}。你在{地点}歇脚，整整一个晌午，云里都有东西在响，像有人在天上磨一柄很长的剑，磨得极慢，极稳。同行的{人物}说，那是剑冢的剑在找主，响一回，就有一个人要上山，上山的人十个里活不下三个。","响到第三遍时，你手里的{器物}自己颤了一下。他不笑了，说剑应了。剑应了就是命应了，你不上山，它会在你袖里响一辈子，响到你哪一天受不了，自己迈开腿走上去，走得头也不回。","可那座山上埋着的不是机缘，是剑和人的骨头，一层压着一层。他指着云里那道白痕说，看见没有，那是剑意，剑意不认路，只认人。风一停，云里的声音也停了，像谁伸手把剑按回了鞘中。"],"择":[{"名":"即刻上山","文":"你没等到天亮就动身，走到半山腰，剑鸣忽然停了，四野安静得能听见自己的心跳。你知道它不是不响了，是在等你走近，等你自己把脖子送到剑锋前面去。山雾里有很多插在地上的剑，剑柄都朝着上山的方向。","果":{"修为":140,"因果":2,"寿元":-2}},{"名":"先修三年","文":"你把剑埋进土里，压了三块石头，说三年后来取。三年里你只练气不练剑，剑在土里一直没有动静。第三年冬天你去挖，土是湿的，剑不在了，坑底只剩三块石头，摆得整整齐齐，像有人替你看过。","果":{"修为":90,"道心":3,"悟性":1}},{"名":"不理会","文":"你把{器物}塞进包袱最底下，转身往南走，走得很快。可每到晴日你还是会抬头看云，看得久了，连耳边的风都像剑鸣。你后来才明白，剑不响的时候更难熬，因为它在你心里响。","果":{"灵石":50,"道心":-1,"魔念":1}}]},{"id":"tianjian_005","题":"洗剑池底","类":"秘境","重":2,"域":["tianjian"],"境界":[1,6],"段":["洗剑池的水是黑的，池边石碑刻着一句剑洗其血，人洗其心。你在池沿洗{器物}，水面上浮起一层红，红得不像锈，倒像有人刚在这里洗过手。{人物}说池底沉着历代剑修扔下去的东西，有人捞过，捞上来的是自己。","那天池水忽然退了三尺，露出池底一层剑匣，匣上爬满{灵材}，根须钻进匣缝里，钻得极深。你看见一只匣子的锁扣是开的，里面躺着半枚剑穗，穗子上结的绳还是新的，新得像是昨天才系上。","{天象}。池水在一寸寸往回落，回落得极慢，像在给你留时间，也像在等你反悔。岸上没有人，只有风把石碑上的字吹得发白，那个心字被磨平了一半，看着像一口空井。"],"择":[{"名":"下水取匣","文":"你潜到池底，手刚碰到匣盖，水里就浮起无数只手，轻轻地按着你的肩，不重，也不松开。你抱着匣子浮上来时，头发白了一半，匣子里的剑还是温的，温得像刚离过人的手。","果":{"器物":2,"灵石":200,"寿元":-8,"修为":60}},{"名":"只取剑穗","文":"你没动匣子，只把那半枚剑穗解下来，揣进怀里贴着心口。池水退回原位时是静的，一点声音也没有，连涟漪都没有留下。你走了很远才敢摊开手，掌心里全是穗子上的红线印。","果":{"悟性":2,"因果":1,"道心":2}},{"名":"推回原处","文":"你把露出来的匣子一具具推回淤泥，推到最后一具时，指缝里渗出血来，血在池水里散成一线。池水漫上来的时候是暖的，暖得让人想坐下来，你就坐在池边坐了一夜，什么也没想。","果":{"声望":6,"修为":100,"气血":-20}}]},{"id":"tianjian_006","题":"钝剑磨锋","类":"修行","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}有个老翁，日日磨一柄钝剑，磨了四十年。那剑没有锋，剑脊厚得像块铁板，看着不像兵器，倒像一根压书的东西。你问他为什么不换一柄，他说这剑是师父留的，师父一生只赢过一场，用的就是它。","他把剑递给你，让你劈那块{灵材}。你劈了三次，石头没断，虎口先裂了。他笑说，钝剑不斩物，斩的是你那一口不肯认输的气，气断了，剑才轻。你看他手背上全是旧疤，疤的走向都一样，都是被自己的剑蹭出来的。","{天象}。老翁忽然把剑横在膝上，说他大概要死在这块石头上了，让你替他扶一次剑。剑很重，你双手托着它的时候才明白，四十年里他每天磨的不是锋，是那一寸没处放的恨，磨得锃亮，却没有地方用。"],"择":[{"名":"替他扶剑","文":"你扶着剑，看他把额头抵在石头上，呼吸一声比一声浅，最后慢慢地没了。剑落进你手里，重得你站不起来，可你一直没松手。天亮时你想把剑放回石头，剑柄却像长在你掌心里。","果":{"修为":180,"悟性":2,"寿元":-2,"器物":1}},{"名":"劝他回去","文":"你说天还早，先回去喝口热的。他没答话，只把剑往你怀里一塞，说替他磨完最后这一遍。第二天他死在崖上，手里握着一块没有棱角的石头，钝剑却在你这里，压在你包袱底下。","果":{"声望":4,"道心":2,"修为":70}},{"名":"偷换快剑","文":"你夜里拿一柄快剑换走了钝剑，想让他临了尝尝顺手的滋味。他第二天握着快剑磨了一整日，磨得手指出血，晚上把剑扔进沟里，说这不是他的，然后照常去摸那空了的磨石，摸到天亮。","果":{"魔念":2,"因果":1,"悟性":1,"灵石":-40}}]},{"id":"tianjian_007","题":"葬剑亦葬人","类":"人情","重":3,"域":["tianjian"],"境界":[2,8],"段":["剑冢不收尸，只收剑。可{地点}底下埋着的，从来不只是剑。你是来送剑的，送的是{人物}的遗物，一柄{器物}。葬剑人接剑时不问名字，只问死者最后一战站在哪里，站得高还是站得低，站得低的人，剑要埋得深些。","他把你带到埋锋坪，那里一排排新土，土上插着剑柄做记号，有的柄上还缠着没烂透的布。他说人死之后剑还在响，响得最久的那个，就埋在最深的地方，因为剑不肯走，人就别想安生。你送来的这柄剑，响了一整夜，天快亮时才停。","他把剑丢进坑里，抓起第一捧土，忽然停了手，回头看你。{天象}。他说按规矩，送剑的人要亲手填第一捧土，填了土，这柄剑就与你再无干系；不填，剑会记着你，记一辈子，记到你哪天也躺进来。"],"择":[{"名":"填土","文":"你捧起土，土里混着碎骨，手一抖，撒了一半。葬剑人没帮你，只站在旁边等你自己把剩下的填完。填完时你听见坑底有一声极轻的金石之音，像有人在土里翻了个身，然后一切都安静了。","果":{"修为":100,"道心":3,"因果":1,"灵石":50}},{"名":"不填","文":"你把手收回，说这剑该自己记得主人，不该记得我。葬剑人点点头，把剑拾起来另埋一处，埋得比别人的浅，剑柄露在外头，露得明明白白，像给路过的人指了个方向。","果":{"悟性":2,"魔念":1,"修为":40,"因果":2}},{"名":"拔剑","文":"你把剑从坑里抽出来，说死人不配这么好的剑。葬剑人往后退了一步，说剑既出坑便是你拿了，从此它响不响，你都得听。你把剑插回自己腰上，走了很远才发觉剑柄在发烫。","果":{"器物":1,"修为":80,"魔念":2,"声望":-4}}]},{"id":"tianjian_008","题":"一生三剑","类":"宗门","重":2,"域":["tianjian"],"境界":[4,10],"段":["藏锋阁每年只开一次门，开门那天崖上不留人，只有{天象}。你走过三千级剑阶上去，见阁主坐在崖边，膝上放着一柄没有鞘的剑，剑身裹着一层灰，像一把还没想清楚要斩谁的凶器。","他说他这一生只出三剑，前两剑都出了，第三剑一直没出，因为他还没找到值得拔剑的人。他问你上山做什么，是求剑，还是求他拔剑。你答得慢了半拍，他就笑了，说慢得好，快答的人一般都求剑，慢答的人才求人。","他把剑横过来，剑脊上有一道极细的裂，裂里嵌着一根白发。他说这一剑出了，天下就少一个值得拔剑的人，多一个持剑的人。崖下的{宗门}等他这一剑等了三十年，风把剑阶吹得冷冷地响，一级一级往下传。"],"择":[{"名":"求剑","文":"你跪下接剑，剑入手时很轻，轻得不像凶器。阁主说轻是因为它还没认你，认了你就会重，重到你走路都要低着头。你下山时觉得背上多了一个人，可回头去看，剑阶上只有风。","果":{"器物":1,"修为":200,"声望":5,"因果":2,"寿元":-5}},{"名":"求他不出","文":"你请他别拔这一剑，说这世上值得他斩的人，大概也值得活着。他看了你很久，把剑收回膝上，说你早来三十年，或者晚来三十年，这句都轮不到你说。他自己也不知道这是夸你还是骂你。","果":{"声望":8,"道心":4,"悟性":2}},{"名":"请问剑","文":"你不求剑也不求他拔剑，只问他这第三剑想斩什么。他把剑举到眼前看了半晌，终于说不知道，所以才留了三十年。那一刻你看见他握剑的手背上有一条旧疤，疤的走向和剑脊上的裂一模一样。","果":{"悟性":4,"修为":60,"因果":1}}]},{"id":"tianjian_009","题":"快剑一字诀","类":"修行","重":3,"域":["tianjian"],"境界":[0,4],"段":["{地点}有块石壁，壁上刻着一个字，据说那就是《快剑一字诀》的全部。那个字已经被人看烂了，看成了个空洞，边角都被指头摸圆。你也去看，从早看到晚，看得眼睛发花，什么也没看出来。","{人物}在壁下坐着，说他看了十一年。他教你，快不是手快，是不想。想一下，剑就慢一寸；慢一寸，人就没命。他让你闭眼去看自己心里第二个念头，说那个念头就是将来杀你的东西。","{天象}。他忽然拔剑，你只见一道白光从眼前掠过，鼻尖一凉，石壁上那个字的最后一撇已经被削掉了。你伸手一摸鼻子，血才下来，滴在石壁上，红得比那个字显眼。他说你看，这就是快，你自己都不知道该躲。"],"择":[{"名":"练剑","文":"你在壁下练了七日，练到不想为止。第八日拔剑，剑只出鞘三寸，人已经向前冲了一丈。你知道自己从此快了一点，也少了点什么，少了的那点东西，你后来在剑冢碑林里找了一整天也没找回来。","果":{"修为":150,"悟性":2,"气血":-10}},{"名":"问念","文":"你问他那个要命的念头到底是什么，他说是我还在。你不懂，他也不再讲，只把这柄{器物}留给你，说等你哪天懂了，剑会自己出鞘。你抱着那柄剑坐了半宿，剑一直没动。","果":{"悟性":3,"道心":2,"修为":40,"器物":1}},{"名":"削字","文":"你把石壁上剩下的半个字彻底削平，说这字坏了一代又一代人。他在旁边看着，没有拦，只说你削得快，比我快，可惜你削的不是人。你走的时候石壁光得像面镜子，照见自己的脸。","果":{"灵石":40,"魔念":1,"因果":1,"声望":3}}]},{"id":"tianjian_010","题":"重剑无锋","类":"机缘","重":3,"域":["tianjian"],"境界":[1,6],"段":["{地点}的崖壁上插着一柄{器物}，重得连风都不敢碰它，周边的剑都朝它弯着腰。{人物}说那是某位剑修的陪葬，谁拔得出来就归谁，三百年里试过的人，都能在崖下堆成一座坟。","你上去试，剑柄纹丝不动。可你双手一握，脚底下的石头先裂了，裂缝里流出一股{灵材}磨成的粉，粉是灰的，落在手背上很烫。他说这剑挑人，不挑力气，挑的是一个知道自己有多重的人。","{天象}。你松了手，剑却自己往下沉了一寸，崖壁被它压出一道凹痕，凹痕里积着三百年的雨。你忽然明白，这剑不是插在这里的，是被它自己压住的，压了三百年，还没压到底。"],"择":[{"名":"再拔","文":"你把气沉到脚底，拔到第七次，剑出崖三寸，两条腿陷进土里。剑身上没有锋，可你握着它的时候觉得它比任何快剑都危险，因为它不快，它只是压过来，压得你想不起自己会什么。","果":{"修为":220,"气血":-30,"器物":1,"寿元":-3}},{"名":"放它回去","文":"你松手退开，说它压了三百年，不差我这一个。剑在原地晃了晃，崖壁上那道凹痕更深了些，深得能盛下一整夜的雨。你回头看了一眼，剑柄上不知何时多了一道新的手印。","果":{"道心":3,"悟性":1,"声望":3}},{"名":"刻名","文":"你在剑柄上刻了自己的名字，刻完就走。三日后你梦见这柄剑压在心口上，压得你天亮才醒，醒来时床板断了一条腿。你知道它在数日子，数到你敢回去的那天。","果":{"魔念":2,"因果":2,"修为":60,"悟性":2}}]},{"id":"tianjian_011","题":"断剑换命","类":"争斗","重":2,"域":["tianjian"],"境界":[2,8],"段":["断锋谷的规矩，两人有仇不必分生死，各折一柄剑便算了断。你到谷底时，{人物}与另一个剑修正跪在玄铁砂里，各自把本命剑抵在膝上，两个人都没抬头，膝盖已经陷进砂里半寸。","他们曾是同门，为一柄{器物}反目。执事堂的人在一旁敲钟，钟响三下不折剑，就要见血。第一声钟响过，谁都没动；第二声，左边的折了半截；第三声，右边的把整柄剑按进了砂里。","{天象}。折剑的人吐了一口血，血落在断锋上，断锋亮了一下，亮得像有人在里面点了灯。执事堂的人说这算成了，从今往后两人各欠一柄剑，一柄记在活人身上，一柄记在剑冢碑林里。"],"择":[{"名":"作证人","文":"你在碑林的石头上替他们刻名，刻到第二笔，石屑烫手。执事堂的人给了你一枚引路铜铃，说以后谷里再有事，你来敲钟。你把铃挂在腰上，走一步响一声，响得心里发空。","果":{"声望":6,"灵石":100,"因果":2}},{"名":"替人折","文":"你把自己的剑折了，替那个跪着不肯折的人顶了这一记。他抬头看你，眼里没有谢，只有恨，恨你让他欠了一柄剑。你把断剑插进砂里，转身就走，听见身后钟响第四声，没人再敲。","果":{"修为":120,"因果":3,"器物":-1,"道心":2}},{"名":"挑起","文":"你在旁边说了一句这剑本就不该留。两边都听见了，钟还没响完，砂里已经见了血，血渗进玄铁砂里，砂色变了，变得比原先更红。执事堂的人没说你错，只是从此不再让你进谷。","果":{"魔念":3,"修为":150,"因果":-2,"声望":-6}}]},{"id":"tianjian_012","题":"无锋石室","类":"秘境","重":2,"域":["tianjian"],"境界":[3,9],"段":["藏锋崖后有一间石室，门是整块石头，没有缝，只有一个剑形的凹槽。{人物}说那是阁里最大的忌讳，阁主第三剑至今不出，就是因为这间石室。你把{器物}插进凹槽，门自己开了，开得没有声音。","石室很空，四壁磨得极平，中间只有一块石台，台上放着一柄没有锋的剑，短得像个孩子的玩物。墙上刻满了字，都是同一句：我练了四十年，才敢承认它不锋利。字迹一行比一行淡，最后几行几乎看不见。","{天象}。你伸手去拿那剑，剑身忽然透出一线白光，白光里有个人的影子，背影很瘦，正在低头磨剑。你不知道那是谁，只觉得那道背影很像自己，连握剑的姿势、连肩膀塌下去的角度都像。"],"择":[{"名":"取剑","文":"你握住剑，白光散了，石室里的字也一起灭了。出门时门自己合上，凹槽里的{器物}被吞了进去，崖壁上多出一道新的剑痕，和墙上那些字一样淡。你抱着剑回屋，一整夜没敢睡。","果":{"器物":1,"修为":240,"悟性":2,"因果":3}},{"名":"跪拜","文":"你朝石台跪下，磕了三个头。石台上的剑自己转了半圈，剑尖朝着门。你退出石室时门没有关，一直开着，风灌进去，把墙上那些字吹得更淡，淡到连最后一行也不见了。","果":{"道心":4,"声望":4,"悟性":3}},{"名":"抄字","文":"你把墙上的字一字一字抄在衣襟内侧，抄到最后一句时笔断了。你出门之后才看清，最后那行写的是：别学我。你站在崖上发了很久的呆，衣襟被风吹得贴在胸口上。","果":{"悟性":4,"修为":80,"灵石":60}}]},{"id":"tianjian_013","题":"剑冢失剑","类":"灾祸","重":3,"域":["tianjian"],"境界":[0,5],"段":["你只是睡了一夜。醒来时枕边的{器物}不见了，枕上留着一道压痕，压得很浅，像拿走它的人不忍心使力。{人物}说，剑冢的规矩，失剑者自逐，没人能替你说话，连守冢人也不能，规矩比人老。","你去找，翻遍了{地点}每一道石缝。第三天有人说，看见一个瘦背影揣着你的剑往剑鸣峡去了，走得不快，还在峡口停了一停。你追到峡口，{天象}，峡里全是雾，雾中有很多把剑插在石头上，每一柄都像你的。","你在峡口站到天黑，终于认出哪一柄是你的。可它插在那里，纹丝不动，剑柄朝外，像不认识你。你想起那条规矩的后半句：失剑者自逐，剑若还认你，可以走另一条路，只是那条路要跪着走。"],"择":[{"名":"拔剑还冢","文":"你拔出来后没有把剑往崖上插，而是抱着它跪在崖门前认罚。守冢人断你一根指骨，说剑回来了，人就不必走。你抱着剑在崖门坐了一夜，指骨长歪了，握剑的姿势也跟着歪了。","果":{"修为":130,"气血":-25,"声望":4,"因果":2}},{"名":"认逐","文":"你没有拔，转身就走。走了三里，剑鸣从身后追上来，一声接一声，你不敢回头。半年后你听说那柄剑自己插回了崖上，插在第七段，那里本不该有它的位置，看崖的人说它插得很用力。","果":{"修为":60,"悟性":2,"灵石":150,"道心":-2}},{"名":"换剑","文":"你把别人的剑拔了出来，打算拿它顶账。峡里的雾一下散了，你手里那柄剑断了，断得干净利落，断口像被人用指甲掐过。雾散之后峡中空空，你那柄剑不见了，连剑痕都没留。","果":{"魔念":2,"因果":3,"灵石":-100,"修为":40}}]},{"id":"tianjian_014","题":"碑林同名","类":"奇闻","重":2,"域":["tianjian"],"境界":[1,7],"段":["{地点}的碑一块挨着一块，你在其中一块前面站住了。碑上刻着一个名字，和你一模一样，旁边还记着剑的形制：长三尺二，重九斤，无格。碑背面的断语只有四个字：此人来迟。","{人物}过来看了一眼，说碑林里三成是活人的碑，剑修死前来自己刻，刻完回去练剑，练到死为止。这块碑上的刻痕很新，新到石屑还是白的，刻它的人最多只走了半年。","{天象}。他问你敢不敢把自己的名字磨掉。磨了，碑就空着，空碑在剑冢里叫借路，往后每个路过的剑修都能借你的名字写自己的死法；不磨，这个迟字就要跟你一辈子，跟到你躺下。"],"择":[{"名":"磨名","文":"你借了块磨石，磨到第三天名字才平。守冢人给了你一盏引路铜铃，说空碑有人看，比有名字的碑更难守。你走出碑林时听见身后有人低声念你的名字，念得很慢，像在确认。","果":{"悟性":3,"因果":2,"修为":90}},{"名":"不磨","文":"你站在碑前看了很久，说这个迟字认得我。你没有磨，回去接着练剑，练到手掌裂开。后来你再去看那块碑，碑上多了一行小字，刻得歪歪扭扭，写的是：未迟。","果":{"道心":3,"修为":120,"寿元":-2}},{"名":"另刻","文":"你在自己名字旁边刻了另一个名字，把那个迟字挪过去。第二日你梦见一个人站在碑前骂你，骂了一整夜，骂的词你一句都记不住。醒来你去看碑，自己名字旁的字被人磨掉了。","果":{"魔念":1,"因果":1,"灵石":80,"悟性":1}}]},{"id":"tianjian_015","题":"雷竹引雷","类":"修行","重":3,"域":["tianjian"],"境界":[0,6],"段":["{地点}的雨来得急。你本想在竹下避一避，刚蹲下去，天上一道白光直劈下来，劈在离你三尺的那根竹上，{天象}。雷过之后你浑身发麻，脑子却亮得像被谁擦过一遍，连十年前忘记的剑招都想起来了。","{人物}在远处喊你别动，说雷击过的竹心最养剑意，人在雷里站一夜，抵得上旁人苦练三年，也抵得上旁人折三年寿。他说这话的时候自己也站在雷里，衣裳烧黑了半边，脸却是笑的。","第二道雷正在云里攒，云压得很低，低得贴着竹梢。雷竹海一片青，青得不真实，每一根竹子里都像藏着一柄待出鞘的剑。你听见自己骨头里有声音在响，像剑在鞘里翻身，也像有人在问你的命有多长。"],"择":[{"名":"站雷里","文":"你在雷里站到天亮，站到说不出话。醒来时手里的{器物}通体发青，剑诀里最难的那一节忽然通了，气走到那里不再卡住。可你数不清自己少了多少年，只记得醒来时头发里全是灰。","果":{"修为":260,"悟性":3,"寿元":-12,"气血":-40}},{"名":"退到坡下","文":"你连滚带爬退到坡下，雷在竹海里劈了一夜。天亮时竹海烧了三成，焦竹的气味苦得呛人；第三天新竹抽芽，长得比原来还高，一夜间拔起三尺，节上带着细细的雷纹。","果":{"修为":60,"道心":2,"灵石":60}},{"名":"引雷入剑","文":"你把剑举起来，硬引那道雷劈上剑身。雷过之后剑上多了一道焦纹，从剑格一直烧到剑尖，像有人用炭笔在剑上画了一条路。你握剑的手从此再也不觉得冷，冬天也是温的。","果":{"器物":1,"修为":180,"气血":-50,"因果":2}}]},{"id":"tianjian_016","题":"卖剑穗的妇人","类":"市井","重":4,"域":["tianjian"],"境界":[0,3],"段":["{地点}下有个卖剑穗的老妇，摊上一排穗子，红黑白青，都是自己编的，编得比剑冢的碑还整齐。她不喊价，只问买家剑叫什么名字，名字好听的便宜，名字难听的加价，说难听的名字要多一根穗子压着。","你翻看那些穗子，其中一枚编得极工整，线头藏在里面，结的是个死扣。她说那枚不卖，是替人留的，那人三十年前说去买一柄剑，回来就编上。{天象}，摊上的穗子被风吹得一起低头。","她把那枚穗子往你手里一塞，说拿着吧，那人不会回来了。你不知道该不该接，穗子在掌心里很轻，轻得像一根断了的念。她又低头去编新的，手指上全是线勒出的口子，一个也没结痂。"],"择":[{"名":"收下","文":"你收下穗子，想给钱，她摆手。你走了十步回头，摊子还在，人不见了，连凳子都收得干干净净。那枚穗子后来被你系在自己剑柄上，系了三年，线一直没松，死扣也没解。","果":{"悟性":2,"因果":1,"道心":2}},{"名":"问那人","文":"你问她那人叫什么，她说不上来，只记得他背剑的姿势，剑鞘总是斜的，走路往左偏。你在问剑台的记名册上翻了一整夜，翻到一个斜鞘的名字，旁边只写着未归两个字，墨色很旧了。","果":{"修为":40,"灵石":20,"悟性":2,"因果":1}},{"名":"买尽","文":"你把摊上的穗子全买了下来，说省得她再替人留。她愣了一下，收了钱，一枚一枚给你包好。第二天摊子照旧摆着，摊上多了一枚新的穗子，结的还是死扣，线是新的。","果":{"灵石":-60,"声望":3,"悟性":1}}]},{"id":"tianjian_017","题":"问剑台九败","类":"宗门","重":3,"域":["tianjian"],"境界":[0,5],"段":["问剑台是一整块青石，台面上有九道剑痕，深的地方能插进半个手掌，浅的地方只是一道白印。{人物}说上台不必赢，只要输够九场还能自己站起来，就算过了。你上去的时候，{天象}，那句话被风送到耳边就散了。","第一场你输在起手太快，第二场输在收势太慢，第九场你连剑都没拔出来。对面那人收了剑说，你不是不会打，你是舍不得。他顿了顿，说舍不得剑比舍不得命更要命，命丢了还会有人替你埋剑。","第九场结束，台下的记名弟子递来一碗水，水里漂着一片竹叶。{宗门}的簿上要写一句你九败的缘故。台边的剑痕一层压一层，最浅的那道是新刻的，刻的正是你今天输的那个位置。"],"择":[{"名":"记名","文":"你在簿上写了舍不得三个字。执事堂的人看了许久，说这三个字三十年没人敢写，写过的都留了下来，如今一半在剑冢守崖，一半在葬剑洞底下。你放下笔，手心全是汗。","果":{"声望":5,"悟性":3,"修为":80}},{"名":"再战","文":"你把碗放下，说再打第十场。对面那人叹了口气，拔剑。这一场你赢了半招，赢在自己先松开了剑，用拳头砸在他手腕上。你坐在台上起不来，看着自己的剑躺在两步外。","果":{"修为":160,"气血":-30,"声望":3}},{"名":"下台就走","文":"你把水喝完，一句话没说就下台。走到台阶最后一级时听见有人在背后说，这人九场都输在同一个地方，可惜了。你没回头，只是把脚放得很轻，轻得像怕踩到什么。","果":{"道心":2,"灵石":50,"修为":30}}]},{"id":"tianjian_018","题":"锈面人","类":"奇闻","重":2,"域":["tianjian"],"境界":[2,8],"段":["{地点}的行商都说，遇见面覆红锈的人不要拔剑，也不要让他看你的剑。你第一次遇见他是在{天象}的傍晚，他蹲在路边，脸上一片锈红，像戴着一张摘不下来的面具，锈面上还有几道像是剑划的白痕。","他抬头问你，能不能看看你的剑。他问得很客气，客气得让人不好拒绝，客气里还带着一点疲倦。你想起那句传言，手按在剑柄上没松。他也不急，就那样蹲着，锈屑从他侧脸落到地上，落地有声。","他忽然说了一个名字，说是三十年前借剑的人，借了之后一剑未还。他说他不夺剑，他只是替每柄剑找原来的主人，找了三十年，找到自己都记不清脸了，只记得那人的剑鞘是斜的。"],"择":[{"名":"给他看","文":"你把剑递过去。他捧着剑看了许久，还回来时说这剑没见过血，可惜。第二天你发现剑上多了一道旧痕，旧得像三百年前留下的，痕里嵌着一点红锈，擦不掉。","果":{"器物":1,"悟性":2,"因果":2,"修为":60}},{"名":"拒绝","文":"你按住剑说不行。他点点头站起来，走了，走时留下一片锈，锈在地上排成半个字，你认了半夜才认出是个还字。第二天风把锈吹散了，那个字也没了。","果":{"道心":2,"灵石":80,"魔念":1}},{"名":"问他名字","文":"你问他借剑的人叫什么。他报了个名字，你恰好听过，那人三十年前死在剑鸣峡，尸首一直没找到，只找到一柄插在崖上的剑。他听完站起来，说那我找错了，转身就走。","果":{"悟性":3,"因果":1,"修为":40,"灵石":120}}]},{"id":"tianjian_019","题":"剑心草坡","类":"机缘","重":3,"域":["tianjian"],"境界":[0,4],"段":["{地点}的草是红的，草叶细如剑尖，风一过就有一片细响，像很多人同时拔剑又同时收手。{人物}说那是剑心草，只在剑意浓的地方生，一株草就是一柄小剑，割破了手，血流得比寻常慢三倍。","你在坡上坐了半日，忽然发觉自己的呼吸跟着草叶一起起伏，起的时候草低头，落的时候草抬头。他教你嚼草根，说嚼下去人会静，静到能听见自己的剑在想什么。你嚼了一口，苦得眼泪直流，可眼泪流过之后，心里空出一块。","{天象}。坡上的草忽然齐齐朝东倒，倒得整整齐齐，像在拜谁。他说剑冢东面有人出了新剑，草比人先知道。草倒的方向就是那剑意来的方向，你若顺着看，会看见天上有一道很淡的白。"],"择":[{"名":"朝东拜","文":"你朝东跪了下去。草在你膝下断了一片，断口平整得不像踩断的。那天夜里你梦见一柄剑从东边来，从你头顶过去，没有停，风把它带来的铁腥味留在你屋里，三天没散。","果":{"悟性":3,"修为":80,"道心":2}},{"名":"嚼草根","文":"你嚼了一整把草根，苦得说不出话。三天里你不思不睡，剑意却清得能照见人，连自己有几分散漫都照出来了。第四天你倒在坡上，醒来时嘴里还有那点苦。","果":{"修为":140,"悟性":2,"气血":-20,"寿元":-2}},{"名":"割草","文":"你把坡上的草割了一片，想拿回去卖给收灵材的商人。割到第三把时手被草叶割开一道口子，血不停地流，草却越长越密，割过的地方第二天就长回来了。","果":{"灵石":120,"气血":-30,"因果":1,"魔念":1}}]},{"id":"tianjian_020","题":"食铁蚁过境","类":"灾祸","重":3,"域":["tianjian"],"境界":[0,4],"段":["剑冢食铁蚁来的那夜，{地点}的值夜人先听见了声音，像下雨，又像有人在很远的地方磨刀。等你提着灯出去，{器物}的剑鞘已经被啃掉一层，鞘里的剑还在，剑穗却没了，连系穗的绳头都被咬得齐整。","{人物}说食铁蚁不吃肉，只吃锈与断锋，可饿极了的蚁群会顺着铁腥味找活人，先啃鞋底，再啃脚踝，啃完脚踝就不急了。他让你把剑埋在土里，人上石台，等天亮，天亮它们才肯散。","{天象}。石台边沿已经爬上来一线黑，黑在动，动过之后台面就低了一分。你手里只剩一柄断剑，断剑也是铁的，也在它们要吃的名单上，而且排在很前面。"],"择":[{"名":"埋剑上石","文":"你把剑埋进土里，上了石台。天亮时台下三尺厚的土被翻过一遍，土色发黑，剑还在，剑柄露在外面，锈得比昨夜重了十年。你拔出来握了握，剑还是那柄剑，只是轻了。","果":{"修为":90,"气血":-15,"灵石":60}},{"名":"引蚁向东","文":"你把剑鞘点上火扔向东边，蚁群跟着火光去了，去得很急，像有谁在赶。东边三里是{宗门}的药圃，第二天药圃没了，只剩一圈圈被啃平的土，土上还有几根完整的竹篱。","果":{"魔念":2,"因果":2,"声望":-4,"修为":50}},{"名":"以剑喂蚁","文":"你把断剑扔进蚁群，蚁群扑上去的那一瞬，你听见剑在响，响得像笑。吃完之后它们退了，退得很安静，退得地面一寸一寸变回原样，仿佛什么都没发生过。","果":{"器物":-1,"悟性":3,"修为":70,"魔念":1}}]},{"id":"tianjian_021","题":"守冢人的酒","类":"人情","重":4,"域":["tianjian"],"境界":[0,6],"段":["守冢人每月十五喝一次酒，酒是自己酿的，用{灵材}泡过，颜色发青。他喝到第三碗才肯说话，说的都是崖上的事：哪一柄剑昨夜响了，哪一柄剑的主人其实没死，只是不敢回来，回来了也不知道该插在哪一段。","你陪他喝。他说他年轻时也是剑修，输在一场不该输的比试上，输了就上了崖，上了崖就下不去了，下来也无人认。他把酒碗推过来，说你看这崖，插着的不是剑，是一群不肯认输的人。","{天象}。他忽然问你，若有一天他不在了，你敢不敢接这个位置。酒碗里映着崖影，崖影后面还有一柄剑，插在最上面的位置，比所有剑都高，那柄剑他从来不提。"],"择":[{"名":"答应","文":"你说敢。他把碗里的酒泼在地上，说敬那些不认输的。第二天他把引路铜铃挂在崖门上，人不见了，屋里只剩半坛酒和一块磨得极薄的磨石，磨石上还有余温。","果":{"声望":6,"修为":60,"寿元":-3,"道心":3}},{"名":"不答","文":"你摇头，说你还要下山。他笑了，说好，下山好，下山的人才有故事，上山的人只有碑。那晚他喝得比平日多，醉倒在碑前，手里的碗一直没松。","果":{"灵石":80,"悟性":2}},{"名":"问那剑","文":"你问他最上面那柄剑是谁的。他手一抖，酒洒了半碗，说那是他的，是他自己当年插上去的。他补了一句，说插上去那天他以为自己会回来取，取的时候才知道手不够长。","果":{"悟性":4,"因果":2,"修为":40}}]},{"id":"tianjian_022","题":"少主拆剑","类":"宗门","重":2,"域":["tianjian"],"境界":[3,9],"段":["藏锋阁少主不铸剑，只拆剑。他在{地点}摆了张长桌，桌上拆开的剑排成一列，从剑柄到剑镡，每一件都擦得发亮。{人物}说他拆了八百柄剑，只为弄明白一件事：剑为什么肯听人的话。","他递给你一柄{器物}，让你当着他的面拆。你拆到剑茎的时候手停了，茎上刻着两个字，是他父亲的名讳。他脸色没变，说拆，拆完告诉我它为什么不锋利，说这话时他手一直在桌下攥着。","{天象}。他把拆下来的剑刃对着光看，看了很久，忽然说原来不是不锋利，是刃口朝里。他抬头问你，一柄刃口朝里的剑，算不算凶器，问得极认真，像在问自己。"],"择":[{"名":"算","文":"你说算，朝里也是刃。他把那柄剑重新装好，装得很慢，一颗钉一颗钉敲回去，装完放回匣里，说他要拿它去问他父亲。他把匣子抱在怀里，像抱了个睡着的孩子。","果":{"声望":4,"悟性":3,"修为":90}},{"名":"不算","文":"你说不算，那是剑在护人，刃口朝里的人，心里总还有一块软的地方。他沉默半晌，把剑匣推给你，说这剑该给会护人的人拿着，阁里的剑匣它待着太冷了。","果":{"器物":1,"道心":3,"声望":3}},{"名":"反问他","文":"你问他为什么要把父亲的剑拆开。他答不上来，手在桌上摸了一圈，摸到的全是零件。最后他把桌上的剑一柄柄收了，留你一个人站在长桌旁，桌面上有一道很深的划痕。","果":{"悟性":2,"因果":1,"灵石":100}}]},{"id":"tianjian_023","题":"剑鸣峡听哭","类":"天象","重":3,"域":["tianjian"],"境界":[1,7],"段":["{地点}的雾散得晚，你在石上打坐，忽听得一声极细的哭，哭声不是从人嘴里出来的。你循声找过去，见一柄{器物}斜插在岩缝里，剑身在雾里一颤一颤，颤得极有节制，像怕被人听见。","{人物}说那是剑在哭，剑认过主就会哭，哭得越久，说明主人死得越不甘。他说剑鸣峡里这样的剑有三百柄，哭到剑身长出锈来才停，锈是剑的眼泪凝的，很硬，磨下去也擦不掉。","他让你把剑柄贴在自己额上听。你贴上去，听见的不是哭，是一个人断断续续说话，先报了一个地名，然后说别上山，说了三遍。{天象}，雾一下子浓了，把峡口堵死，连来路都看不见。"],"择":[{"名":"听下去","文":"你听了整整一夜，听到最后，那人说完了自己的名字，声音就断了。你把名字记在剑鞘上，一笔一划刻得很深，刻完之后剑不哭了，雾也散了，峡口那条路看着比来时宽。","果":{"悟性":4,"修为":120,"因果":2,"气血":-15}},{"名":"拔剑","文":"你把剑拔出来，哭声明明停了，雾却更浓。你抱着剑走了三里，剑一直在怀里发烫，烫得你不得不换手。到了峡口你才发现，剑身上不知何时多了六个字：别上山，我上去过。","果":{"器物":1,"修为":100,"魔念":1,"寿元":-2}},{"名":"掩土","文":"你在剑边堆了一堆石头，把剑埋进去半截，埋得像一座小坟。第二日石头被人挪开了，挪得整整齐齐，剑还插在那里，剑柄上落了一层新的雾水。","果":{"道心":3,"声望":3,"灵石":40}}]},{"id":"tianjian_024","题":"星陨铁坑","类":"市井","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}的坑是三百年前一颗星砸出来的，坑底的黑石至今还有热气，冬日摸上去像人的额头。{人物}说星陨铁可铸剑，也可以卖，来挖的人多，挖到的不多，挖到了多半也回不去，坑壁上全是攀爬留下的抓痕。","你下坑，坑底已经有人在凿，凿得很小声，像怕吵醒谁。那人抬头看你一眼，说这条矿脉是他先看见的，要么一起分，要么谁也别想上去。他手里那把凿子上缠着布，布上是一片干透的黑血。","{天象}。坑底的铁敲起来有一种很闷的响，响过之后耳朵会疼。你手上的凿子震得发麻，那块铁露出来的部分颜色黑里透青，青得像随时会睁开一只眼。"],"择":[{"名":"分他一半","文":"你和他分着凿了三天，凿出七块，一人三块半，多出来的那块他让给了你。他临走说下次别下坑了，这坑吃人，吃得不动声色。你上坑时回头看了一眼，坑底那块铁还在发青。","果":{"灵石":180,"灵材":2,"修为":40,"因果":1}},{"名":"独吞","文":"你趁他夜里睡着，把凿出来的铁全背走了上坑。爬到一半，坑壁的抓痕里伸出一只手，抓了个空，指甲刮在你靴底上。你没有回头，第二天听说坑底塌了半边。","果":{"灵石":260,"灵材":2,"魔念":2,"因果":2}},{"名":"废矿","文":"你把矿脉砸塌了，说省得再有人下来。他愣了很久，忽然跪下磕头，说这条命算是你给的。你扶他起来，他膝盖上的土抖不掉，抖了半天还在。","果":{"声望":7,"道心":2,"灵石":-40}}]},{"id":"tianjian_025","题":"剑意入魔","类":"灾祸","重":2,"域":["tianjian"],"境界":[2,8],"段":["你开始觉得剑比命亲。这不是一日两日的事：先是睡时手还握着剑柄，后来吃饭也要剑在膝上，再后来{地点}的人跟你说话，你要先看一眼剑才敢答。{人物}说你眼睛里有东西在动，动得不像人的东西。","那天你在{天象}里练剑，练到第七遍，忽然发觉自己在重复一个不属于自己的动作，一个回身反撩，撩得极老，老得像练过几百年的人才会有的顺手。你停了手，手却不停，剑在你手里自己转了一圈。","他说这是剑意入体，剑的旧主想借你的手再出一剑。他给你两个办法：把自己关进无锋石室，或者去洗剑池泡一夜，把剑气洗掉。两个办法都要命，只是要的命不太一样。"],"择":[{"名":"入石室","文":"你在石室里关了七日，关到不记得自己叫什么。第八日门开，手里的剑断了，剑意没了，可你也想不起自己原来练的是什么剑，站在崖上连起手的姿势都要重新想，想了半日才想起该先把脚分开。","果":{"修为":-100,"道心":4,"悟性":2,"气血":-40}},{"名":"去洗剑池","文":"你在池里泡了一夜，池水黑了。天亮时从水里站起来，身上什么感觉都没有了，冷的、热的、想拔剑的，都没有了。你在池边站了很久，才想起自己该往回走，走的时候脚是软的。","果":{"修为":60,"道心":2,"寿元":-6,"魔念":-2}},{"名":"顺它一回","文":"你没有关自己，也没有去泡池，任它出一剑。那一剑削平了半座崖，崖上的剑齐齐断了一截。你站在原地喘了很久，觉得自己从来没有这么强过，也从来没有这么不像自己。","果":{"修为":300,"魔念":3,"因果":3,"气血":-60}}]},{"id":"tianjian_026","题":"三千剑阶","类":"修行","重":3,"域":["tianjian"],"境界":[1,6],"段":["从藏锋崖底到崖顶，一共三千级石阶，每级都刻着一个人的名字，名字被人踩得模糊。{人物}说走完台阶的人，名字会被刻在最上面；走不完的，名字会被磨掉，磨平了给下一个人踩。","你走到第一千级，膝盖开始发抖；走到两千级，{天象}，石阶上的霜结了又化，化得台阶湿滑；走到两千九百级，你忽然看见自己的名字刻在脚边，刻得歪，石屑还是白的，像是刚刻不久。","最后一百级没有名字，只有一道道剑痕。他说那是一个个走到这里又退回去的人留下的，剑痕的深浅，就是他们当时有多想上去。最浅的那道只有半寸，深的那道能放进去一整只手掌。"],"择":[{"名":"走完","文":"你走完最后一百级，跪在崖顶。风大得把你吹得几乎站不住，你用手按着石面才没被掀下去。有人把你的名字刻在了台阶最上面，刻得很浅，可你自己看着觉得比什么碑都重。","果":{"声望":8,"修为":180,"寿元":-4,"道心":3}},{"名":"回头看名","文":"你在两千九百级停下来，蹲下看自己的名字为什么刻得这么歪，看着看着就坐下了。那天你没上去，但台阶记住了你坐的位置，第二天那里多了一道新的剑痕，很浅。","果":{"悟性":3,"修为":60,"灵石":40}},{"名":"抹名","文":"你把脚边自己的名字磨掉，说这名字不配刻在这里。磨完之后你走得更快，快到崖顶时发现那里已经有一块空碑，碑上什么都没有，连一个字都没有。","果":{"悟性":2,"修为":100,"因果":2}}]},{"id":"tianjian_027","题":"剑影出壁","类":"奇闻","重":2,"域":["tianjian"],"境界":[3,9],"段":["月圆那夜，{地点}的崖壁上走出一个影子。影子是剑的形状，长三丈，从石里一步步走出来，走出来时不带一点声音，只在石面上留了一道很淡的湿。{人物}说那是古人刻在崖上的剑意，每逢月圆便出来走一遍。","影子沿崖走了半圈，停在一处插着{器物}的地方，剑尖垂下，垂得很低，像在认。你站在影子里，影子扫过你的时候浑身一凉，感觉自己被读了一遍，从骨头读到念头，读到最不愿意给人看的那一层。","{天象}。影子忽然回头，朝你转过来，剑尖对着你的胸口。崖上的人都退了，退得很快，只有你没退。你听见一个很老的声音说：这一柄，还算干净。"],"择":[{"名":"拔剑相迎","文":"你拔剑。影子没有动，你的剑穿过去，像穿过一层凉气，剑上起了一层白霜。之后你的剑上多了一道洗不掉的白痕，无论怎么磨，那痕都在剑脊上，像一根白发，白得比你头上的还早。","果":{"器物":1,"修为":160,"气血":-20,"因果":2}},{"名":"收剑跪","文":"你把剑横在膝上跪下。影子看了你很久，绕着你走了一圈，走得很慢，然后走了。第二天崖上多了一道新的剑痕，刻的是你的姿势，连肩膀塌下去的角度都刻得分毫不差。","果":{"悟性":3,"道心":3,"声望":4}},{"名":"伸手","文":"你伸手去碰那道影子，指尖一凉，整条手臂麻了三天。三天里你一直在想那句话，想它说的干净是什么意思，是没杀过人，还是杀过人还肯收手。想到第三日麻木才退，答案还是没有。","果":{"悟性":4,"修为":50,"气血":-30}}]},{"id":"tianjian_028","题":"断锋会追命","类":"争斗","重":2,"域":["tianjian"],"境界":[2,7],"段":["断锋会找上你，是为了一年前那柄{器物}。会里做事讲规矩：先递帖，帖上写明三日之内交出剑，交不出就交人。{人物}把帖递给你时，还替你数了数崖上有几处能藏身的地方，数完摇了摇头。","三日过去，你在一线天剑隙被堵住。来的三个人都背着断剑，断剑是他们的招牌，出手只用断的那一截。第一个人的剑很短，快得出奇；第二个人的剑很重，砸在石上碎石飞溅，溅到脸上生疼。","{天象}。第三个人没有出手，站在最后面看你。他说会里不杀无用之人，你若把剑交出来，可以入会。你身后的峡壁很窄，退无可退，前面的两个人已经站好了位置，站得像两扇门。"],"择":[{"名":"交剑","文":"你把剑扔过去，扔得很稳。第三个人接住，掂了掂，说这剑不合用，把剑插回你脚边，转身走了。你活了下来，可从此再也拔不动这柄剑，它在你手里重得像一块碑。","果":{"器物":-1,"寿元":5,"声望":-3,"修为":-40}},{"名":"死战","文":"你杀了第一个人，被第二个人砸断两根肋骨，第三个人放你走了。他临走说你有点意思，下次还来。你在峡里躺到天黑，肋骨断口一动就响，响得像有人在里面拨弦。","果":{"修为":220,"气血":-60,"因果":3,"魔念":1}},{"名":"入会","文":"你说入会。第三个人笑了，把一柄断剑递给你，说断锋会不收剑，只收断了剑还不肯走的人。你接过断剑，剑柄比你想的沉，沉得让手腕往下坠。","果":{"修为":80,"灵石":200,"因果":2,"道心":-3}}]},{"id":"tianjian_029","题":"一枚木牌","类":"人情","重":4,"域":["tianjian"],"境界":[0,5],"段":["{地点}的旧货摊上，你翻到一枚木牌，牌上刻着一个生辰，还有一个名字，名字被磨掉了一半。摊主说这东西是从剑冢的土里翻出来的，不知是哪一年埋下去的人留下的，埋得浅，所以翻得着。","你把木牌拿在手里，木是剑形，边缘磨得很圆，显然被人日日摩挲了许多年。{人物}说剑修身上常带两样东西，一是剑鞘上的穗，二是这样一枚牌，牌上的生辰不一定是自己的，多半是留给还活着的人的。","{天象}。摊主问你要不要，说这牌不要钱，只是带着它的人要应一件事：若遇到牌上那个人，把牌还回去。他把牌往你手心里一按，凉得像刚从井里捞上来的石头。"],"择":[{"名":"收下","文":"你收下木牌。三年后你在剑鸣峡遇见一个人，那人报出名字的时候，你的手已经摸到了怀里的牌，牌是温的，像被谁先捂过。你没敢把牌拿出来，只问他一句你丢过什么。","果":{"因果":2,"悟性":2,"修为":60,"灵石":40}},{"名":"还给摊主","文":"你把牌放回摊上，说这债太重。摊主没拦，只把牌翻了个面，背面刻着一行小字：无人认领者，归冢。他把牌推到摊角，牌落下去的时候响了一声，很轻，轻得不像木头。","果":{"道心":2,"灵石":60,"悟性":1}},{"名":"埋回去","文":"你把木牌埋回剑冢的土里，埋得很深。填土时你觉得有人在看你，抬头只有崖，崖上有几柄剑在风里轻轻地晃，晃得像是点头。","果":{"修为":40,"因果":1,"声望":2}}]},{"id":"tianjian_030","题":"赤霄剑柱","类":"秘境","重":1,"域":["tianjian"],"境界":[4,11],"段":["赤霄剑柱插在{地点}的正中央，柱身赤红，上面垂着一条断链，链子粗如人臂，断口平整得像被切开的豆腐。{人物}说那是古时锁剑之物，锁的不是剑，是剑意，怕它自己走下柱来。柱上至今没有名字，因为没人配。","你走近，柱面上的红忽然暗了一块，暗出一个人形，人形没有脸。你伸手去摸，手上沾了一层铁屑，屑是热的，热得像血。柱子下面有一圈空地，空地上一根草都不长，踩上去是软的。","{天象}。断链在你头顶晃了一下，晃得极慢，慢得能看清每一节的锈。你忽然明白这柱子不是用来锁剑意的，是用来锁一个还没到的人——链子的另一头空着，正等着人来系。"],"择":[{"名":"系上自己","文":"你把断链缠在自己腕上，链子收紧时你没挣。柱面上的红亮了一夜，亮得像有人在里面烧炭。天亮时链子松了，腕上多了一圈红痕，红痕的形状是一柄剑，红得像刚系上去的绳。","果":{"修为":320,"因果":4,"寿元":-10,"气血":-50}},{"名":"斩链","文":"你一剑斩断链子，链断的瞬间柱子轻轻震了一下，远处的剑冢万剑齐鸣，鸣得整座山都在抖。你听见有人在很远的地方叹了口气，叹得很轻，像认了输。","果":{"修为":200,"因果":-2,"魔念":2,"声望":6}},{"名":"退出去","文":"你退出那圈软土，站在草上看了很久。你没有碰柱子，柱子也没有碰你，你们各自站着，像两个都不肯先开口的人。风把草吹得很低，低到贴地。","果":{"道心":4,"悟性":3,"修为":40}}]},{"id":"tianjian_031","题":"哑鬼夺声","类":"灾祸","重":2,"域":["tianjian"],"境界":[1,6],"段":["{地点}的洞口结着一层白霜，霜上没有一个脚印。{人物}说进去的人不少，出来的都不说话，不是不肯说，是说不出。哑鬼无骨无形，专夺人的声音，入洞一步夺一语，出洞时的人就成了哑巴。","你还是进去了，因为洞里有剑鸣，和你腰间那柄{器物}一个调子，连尾音都像。洞壁上的划痕一道挨着一道，全是被夺了声的人留下的字，写的多是救我，写到一半就断了，断处有指甲抠过的白。","{天象}。洞深处有一点青光，青光里立着一柄剑。你张了张嘴，发现自己已经想不起上一句话是怎么说的，只剩一个念头还清楚：再往前十步，再往前十步就能看清那剑的样子。"],"择":[{"名":"退","文":"你退了出来，退到洞口才想起怎么说话。你开口第一句是自己的名字，说得很生涩，像小孩学语。你在洞口坐了半日，才把刚才想说的话一句句捡回来，捡回来的话少了一句。","果":{"修为":70,"道心":3,"悟性":1}},{"名":"写","文":"你在洞壁上划字，划到手腕发酸。最后你划出一句话：我只是来看剑的。青光灭了，剑鸣也停了，洞壁上的白霜一夜之间退了三尺，你走出去时天正亮。","果":{"悟性":3,"修为":90,"因果":2}},{"名":"取剑","文":"你伸手握住那柄剑，剑很凉，凉得指骨发疼。你听见自己的声音从很远的地方回来，落进喉咙里，可那声音说的不是你要说的话，说的是别走。","果":{"器物":1,"修为":140,"气血":-35,"魔念":2}}]},{"id":"tianjian_032","题":"铸剑炉断火","类":"宗门","重":3,"域":["tianjian"],"境界":[1,5],"段":["藏锋阁的炉火三百年没灭过，那一夜灭了。你在{地点}被一声闷响惊醒，起来看见炉口的火只剩一线红，红得像快要干了。{人物}跪在炉前，一双手按在炉壁上，按得皮都焦了。","他说炉火靠{灵材}续着，这一年灵材越来越少，他省着烧，省到最后还是断了。阁里的规矩，炉火断者，铸者三年不得开炉。可他手里那柄剑还差最后一道淬火，差了那一道，剑就是废铁。","{天象}。炉口的红一点点暗下去，你听见炉膛里有铁在响，像有东西在里面挣。他抬头看你，说他要不要拿自己的手去续这一炉火，问得极平静，平静得像在问别人的事。"],"择":[{"名":"拦他","文":"你扑过去把他拉开，他的手指已经和炉壁粘在一起，撕开时掉了一层皮。炉子彻底灭了，那柄剑也没成，他在炉前坐到天亮，一句话没说，天亮时把剑胚埋进炉灰里，埋得很深。","果":{"道心":3,"声望":3,"修为":40}},{"名":"替他","文":"你把手按上炉壁，火没续上，掌心却烧出一道剑形的疤，疤的边缘发白。他看了你很久，最后把那柄未成的剑胚塞给你，说这炉剑欠你的，往后你自己烧。","果":{"气血":-40,"器物":1,"修为":120,"因果":2}},{"名":"砸炉","文":"你把炉门砸开，铁水泼了一地，泼出一条很长的红，红到第二天早上还没凉。炉废了，可炉膛里那柄剑还在，红得发亮，剑身上有一道谁也没打过的纹。","果":{"修为":90,"魔念":2,"声望":-3,"灵石":150}}]},{"id":"tianjian_033","题":"不肯认主的剑","类":"机缘","重":2,"域":["tianjian"],"境界":[2,8],"段":["你得了{器物}，三个月没认主。剑不响，不颤，不服你，也不反抗你，只是每次你拔它，剑身都要慢半拍，慢得让你出手总是差那么一线。{人物}说这种剑最麻烦，它不恨你，它只是看不起你。","他教你一个笨办法：日日带它去看别人比剑，让它自己挑。三个月里它一柄都没挑，只看。看到第九十七场，它忽然在你腰上轻轻撞了一下，撞的方向是台上一个瘸腿的剑客。","{天象}。那剑客用的是最脏的打法，专攻人下三路，赢了还要踩一脚，踩得台下的人都不出声。你腰上的剑一直在动，动得越来越急。你忽然明白，它不是在挑主人，它是在替自己挑一个最不体面的死法。"],"择":[{"名":"给它","文":"你把剑抛上台，剑客接住，掂了掂，笑得很脏。他赢得更脏了，可剑在他手里响得比在你手里欢，响得整座台都听见。你退到人群最后，看它一次次往人膝盖上撞。","果":{"器物":-1,"因果":2,"修为":60,"道心":-2}},{"名":"不给","文":"你按住剑柄，说你再脏，也比它挑的那个干净。剑不响了，从此再没响过，也不动，你拔它它还是慢半拍。你把剑挂在墙上，挂了很久，久到剑上起了霉。","果":{"修为":100,"道心":2,"悟性":1}},{"名":"问它","文":"你拔剑指着那剑客，问它是不是要这个。剑沉默了半夜，天亮时轻轻碰了一下你的手，碰得很轻，轻得像认了。你后来才知道，那剑客三个月前就死在谷里了。","果":{"悟性":4,"修为":80,"因果":1}}]},{"id":"tianjian_034","题":"崖上磨剑翁","类":"修行","重":4,"域":["tianjian"],"境界":[0,7],"段":["{地点}的崖边总坐着一个磨剑的老翁，磨的是一柄{器物}，磨到剑身薄得像纸，透着光能看见背后的山。他不说话，你问他磨什么，他只把剑举起来，让你看剑上映出的山，看完了也不解释。","{人物}说这翁年轻时是位大剑修，一剑劈开过断锋谷。后来他把自己的剑磨薄了，说太锋利的东西留不住人，薄一点，斩人的时候会慢一点，慢一点就有得商量，商量就有活路。","{天象}。他把剑递给你，说替他磨半个时辰，他去崖后头看看。你磨着磨着，发现剑身上映出的山少了一座，再磨，又少了一座，磨到第三座时你不敢再动了。"],"择":[{"名":"继续磨","文":"你磨到天黑，剑薄得能透光，剑上的山只剩一座，那一座是剑冢。他回来接过剑，看了看，说够了，转身把剑插进崖缝，插得很轻，剑没进石半寸。","果":{"修为":130,"悟性":3,"道心":2}},{"名":"停手","文":"你停下，把剑放在石上。他回来时看了一眼，说你还算有点良心，然后把剑收回鞘里走了。第二天崖边空着，石上留了一块磨石，磨得凹下去一个剑形。","果":{"道心":3,"灵石":40,"修为":50}},{"名":"换剑","文":"你把自己的剑换给他磨，磨成薄薄一片。他磨完什么也没说，把两柄剑一起插在崖上，插得并排，像两个人的肩。你下山时觉得手里空着，空得心里发慌。","果":{"修为":60,"器物":-1,"悟性":2,"因果":1}}]},{"id":"tianjian_035","题":"剑冢寒泉","类":"秘境","重":2,"域":["tianjian"],"境界":[2,7],"段":["{地点}的泉眼在崖底，水极寒，喝一口要痛三日，痛过之后眼睛能看见剑意。{人物}说他喝过，看见了满山的白线，白线都是剑走过的路，有的路走到一半就断了，断得很干净。","泉边有一口石井，井里沉着几十个葫芦，葫芦上都刻着名字，是来喝泉的人留下的。他说喝泉要留葫芦，喝了不认账的人，泉水会自己找上门来，找到人家里去。","{天象}。你在井边蹲下，水面上映出的不是你，是一柄剑的倒影。你回头看，身后没有剑，只有崖壁，崖壁上有一道缝，缝里正插着那柄剑，插得很正，一点都没歪。"],"择":[{"名":"喝","文":"你喝了一口，痛了整整三日，三日里眼睛一直流泪，止不住。痛过之后你看见满山的白线，看见有一条白线从你脚下一路通到崖顶，白线中间有一处极细的断口，断口正对着你站的地方。","果":{"修为":180,"悟性":4,"气血":-40}},{"名":"只留葫芦","文":"你把葫芦放进井里，没有喝。井水晃了一下，晃出一点涟漪，涟漪散开时，你看见水底有一柄剑对着你点了点，剑柄上系着一根旧穗，穗子的颜色你已经认出来了。","果":{"道心":3,"因果":1,"灵石":60}},{"名":"取井中剑","文":"你伸手进井里，摸到一柄剑，拔出来时带出一串葫芦，葫芦在水面上撞得叮当响。那剑在你手里响了一声，响得整个崖底都在回应，回声里有别人的声音，像是在喊一个名字。","果":{"器物":1,"修为":120,"因果":2,"气血":-25}}]},{"id":"tianjian_036","题":"剑穗与生辰","类":"人情","重":3,"域":["tianjian"],"境界":[0,4],"段":["{地点}的洗剑池边，一个女修在给一柄剑系穗子，系得很慢，一边系一边念一个生辰。{人物}说她每七日来系一次，系了两年，那柄剑的主人在剑鸣峡没回来，剑倒是自己回来了。","她抬头看你，问你有没有见过那个人，然后细细地描述：个子不高，左手使剑，剑鞘上有一道裂纹，笑起来牙不齐。你说没见过，她点头，又低头去系，系到一半线断了，她重新开始，一声不吭。","{天象}。她忽然把穗子解下来递给你，说这穗子系了两年，也该换个地方了。她说完就走了，走得很轻，轻得没在池边留下脚印。你握着那枚穗子，觉得指头上还留着她的温度。"],"择":[{"名":"替她系","文":"你把穗子系到自己的剑上，系了三圈，系得很牢。你后来打听过那个人，打听了三年，最后是在剑鸣峡的一块碑上看见他的名字，碑上的字被雨蚀得只剩一半，那半个字你还认得。","果":{"因果":2,"悟性":2,"修为":50}},{"名":"还给她","文":"你追上去把穗子还给她，说这东西该你自己系。她接了，笑了一下，说她只是累了，累得手都不听话。第二日池边没人，石上留着一柄剑，穗子系得好好的。","果":{"声望":4,"道心":2,"灵石":40}},{"名":"烧了","文":"你把穗子烧了，烧得很干净，连线头都没剩。灰落在池面上，被水带走，带走得很慢，慢到你以为它不肯走。","果":{"魔念":1,"因果":1,"道心":-1,"灵石":80}}]},{"id":"tianjian_037","题":"万剑沉海","类":"天象","重":1,"域":["tianjian"],"境界":[5,12],"段":["那一年剑冢的剑忽然齐齐向南倾，倾了七日。{人物}说这是万剑沉海的兆，一千二百年一回，剑要离崖，去海上另找主人。崖上的人跪了一地，跪不住的人被剑意压趴在石上，脸贴着石头说不出话。","第八日，第一柄剑脱崖，飞出去时带起一道白气，接着是第二柄、第三柄，到后来你分不清是剑在飞还是雨在飞。{天象}。守冢人抱着他那柄{器物}站在崖门口，一步没动，连头都没抬。","他问你，剑都走了，人还守在这里做什么。他说这话时脸上没有悲色，倒像松了一口气。你看见崖顶那柄最高的剑也在晃，晃得最厉害，晃得像是第一个要走又最后一个舍不得。"],"择":[{"名":"追剑","文":"你追出去三百里，追到海边，看见成千上万柄剑插在浅海里，像一片不动的林子。你捡了一柄，剑柄上还带着崖上的霜，霜化了以后露出一个名字，你没敢看。","果":{"器物":1,"修为":260,"寿元":-5,"因果":3}},{"名":"守崖","文":"你留在崖上，替守冢人守了七日空崖。剑走完之后崖上很静，静得能听见自己心跳的回声，回声里没有铁腥味，倒有一点潮气。第七日夜里守冢人睡熟了，那是他三十年来第一次睡着。","果":{"道心":4,"声望":5,"修为":80}},{"名":"拦剑","文":"你拔剑挡在崖门，挡住一柄又一柄。挡到第十七柄时被剑气掀下崖去，摔断一条腿。你在崖底躺了三天，听见头顶上剑还在走，走得比先前慢，像是有人回头看了看你。","果":{"气血":-70,"修为":200,"魔念":2,"因果":2}}]},{"id":"tianjian_038","题":"剑庐弃徒","类":"宗门","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}来了个北崖剑庐的弃徒，背着三柄剑，说是被逐出来的。他被逐的缘由说了三遍，每一遍都不一样：第一遍是偷剑，第二遍是练了禁招，第三遍是他自己说的——他师父的剑选中了他，没选中师父。","他在崖下摆了个摊，替人磨剑，一柄五枚灵石，磨得极好，磨完还替你把剑鞘上的灰擦干净。{人物}说别用他磨的剑，他磨的剑会记仇。你不信，请他磨了一次，磨得确实好，好得让人心里不踏实。","{天象}。剑磨完，他在剑脊上添了一道极淡的线，说是记路用的，走到哪都找得回来。你看着那道线，越看越觉得它不像记号，像一条拴在脖子上的绳。"],"择":[{"名":"用剑","文":"你用那柄剑打了三场，三场都赢。第四场剑忽然在你手里转了个向，自己劈向左边，左边什么都没有，只有一棵树。树断了，断口平整，剑在你手里轻轻地响。","果":{"修为":150,"魔念":2,"因果":2}},{"名":"擦掉线","文":"你把剑脊上那道线磨掉了，磨了一整夜，磨掉三块磨石。第二天他不见了，摊子收了，石上留着一块磨石，凹得极深，凹处积着一点水，水里映着一柄剑。","果":{"悟性":3,"修为":40,"灵石":-20}},{"名":"问他","文":"你问他师父的剑现在在哪。他沉默很久，说在他背上那三柄里，最短的那柄，剑柄缠着旧布。你后来听说北崖剑庐的掌门三年之内再无弟子下山，山门一直关着。","果":{"悟性":2,"因果":2,"修为":60}}]},{"id":"tianjian_039","题":"天雷劈庐","类":"灾祸","重":3,"域":["tianjian"],"境界":[1,6],"段":["雷是从剑冢上空落下来的，落得很准，只劈你的剑庐，庐边的竹一根没伤。{天象}。你从火里爬出来，看见自己的剑插在庐外的土里，剑身发红，像一根刚出炉的铁条，插进去的地方土都焦成了硬块。","{人物}赶来，看了一眼就说这不是天雷。天雷不认人，只认势，这一道认的是你的剑。他说你的剑意太盛，盛得让天上有人不高兴，不高兴的不是天，是守着旧规矩的那几个人。","火灭了之后庐里只剩一堆黑炭。他在炭堆里翻出一块烧不化的铁，铁上有字，字是反的，要照着水面才念得出来，念出来是：藏锋。他念完就把铁塞回你手里，转身走了。"],"择":[{"名":"搬家","文":"你把剑庐搬到崖下三里，从此练剑不外露，一年没让人看见你拔剑。一年之后你发现剑生锈了，锈得很慢，像有人在暗处替你磨。","果":{"修为":-60,"道心":3,"寿元":4,"灵石":80}},{"名":"受着","文":"你在原址重建，建得比原来还大，门口插了一排剑，七柄一列。此后三个月雷再没来，倒是来看你的人多了起来，都站在门口数剑。","果":{"声望":7,"修为":100,"气血":-20}},{"名":"查字","文":"你把那块铁翻过来念出藏锋二字，然后去找藏锋阁。开门的老匠看了铁一眼，脸色就变了，把门关上，隔着门说了一句：那剑不该在你这里。","果":{"悟性":4,"因果":2,"修为":60}}]},{"id":"tianjian_040","题":"三千剑铭","类":"奇闻","重":1,"域":["tianjian"],"境界":[3,10],"段":["{地点}里有一面石壁，壁上刻着三千个剑名，是千年来最出名的三千柄剑。{人物}说壁上的名字会自己变淡，淡到什么程度，就是那柄剑在人间的名声还剩多少，淡没了，剑也就没人记得了。","你找到几柄听过的剑名，都淡得看不出笔画，只剩一个模糊的轮廓。倒是有些从没听过的名字刻得极深，深到能盛住雨水。他说这种剑不出名，只是还在响，响得总有人记得。","{天象}。壁的右下角有一块新刻的空白，石屑还是白的，谁刻的没人知道。他递给你一把凿子，说这个位置空了三十年，空着不好看，也不好听。"],"择":[{"名":"刻自己","文":"你把自己的名字刻上去，刻得很深。第二日你去看，名字淡了一半，淡得像是被人用指头抹过，抹得很仔细。你忽然明白，刻上去的不是名字，是有人记得你多久。","果":{"声望":4,"魔念":1,"修为":70}},{"名":"不刻","文":"你把凿子递回去，说自己的剑还没到能刻上墙的年纪。他笑了，说这话他在这个位置上听了三十年，说完把凿子收进袖里，靠墙坐下，望着那块空白出神。","果":{"道心":3,"悟性":2,"灵石":50}},{"名":"刻剑不刻名","文":"你只刻了自己剑的形制，没刻名字。石壁上多了一柄没有名字的剑，第三天石屑被人扫干净了，扫得极仔细，连缝里的都抠了出来。","果":{"悟性":3,"因果":1,"修为":80}}]},{"id":"tianjian_041","题":"一线天剑隙","类":"秘境","重":2,"域":["tianjian"],"境界":[1,6],"段":["一线天剑隙是一道只有一尺宽的石缝，长十里，缝里常年有风，风里带着极细的铁腥味。{人物}说这缝是古时一剑劈开的，劈剑的人后来死在缝里，没走出去，尸首也没人收。","你侧身进去，走了半里，缝壁上开始出现剑痕，一痕比一痕深，到后来整面壁都像被人用刀削过。缝越走越窄，窄得你要吸着气才能过。{天象}，缝里什么也看不见，只有声音在往前带。","走到第七里，前面忽然宽了，宽出一个能容两三人的小洞。洞里坐着一个人，背对着你，膝上放着{器物}，一动不动。你听不见他的呼吸，可他的衣角在轻轻动，像有风从很远的地方吹进来。"],"择":[{"名":"绕过去","文":"你侧着身子从那个人旁边挤过去，挤过去时肩头蹭到了他的袖子，袖子里是空的，没有手臂。你走出十里回头，缝口已经合上，像从来没开过。","果":{"悟性":3,"修为":90,"气血":-20}},{"名":"开口问","文":"你问他是不是劈开这道缝的人。他没有回头，声音却在你耳边响起来，说的是这缝不是劈开的，是被剑自己走出来的。你回头去看缝壁，那些剑痕果然都朝同一个方向。","果":{"悟性":4,"修为":120,"因果":2}},{"名":"取剑","文":"你伸手去拿他膝上的剑，指尖刚碰到剑柄，整个洞的石头开始渗水，渗得极快。你抱着剑退出来，缝里的水跟在后面，一直跟到缝口才停。","果":{"器物":1,"修为":160,"气血":-40,"因果":2}}]},{"id":"tianjian_042","题":"剑不得葬","类":"灾祸","重":2,"域":["tianjian"],"境界":[2,8],"段":["{人物}死在一场没名目的争斗里，尸首抬到剑冢，守冢人却不肯葬。缘由很简单：他死的时候剑不在手边，剑不知去了哪里。剑冢的规矩，剑不得葬者，人亦不得葬。","你替他去寻剑，寻了七日。第八日剑自己回来了，插在崖门口，剑身上裹着一层水汽，水汽散开之后，剑脊上多了一道你不认识的刻痕，刻的是另一个人的名字。","{天象}。守冢人来看了一眼，说这剑已经认了别人，不算他的。他问你，是要葬一个没有剑的人，还是去把那柄剑夺回来，把那个名字连同剑一起带回来。"],"择":[{"名":"葬人","文":"你说葬人吧，剑的事归剑。守冢人点头，把他葬在碑林最外一排，那里埋的都是没有剑的人，碑上只刻一个姓。你去添土，土很松，松得像是早就有人替他挖好。","果":{"道心":3,"声望":3,"修为":40}},{"名":"夺剑","文":"你去找那个名字，找了三个月，找到了，在一处山坳里。你把剑夺了回来，也把一条命留在了那里，一条不属于你的命。剑回到崖门时响了一声，响得不像回家。","果":{"修为":180,"魔念":3,"因果":3,"气血":-50}},{"名":"替他认剑","文":"你把自己的剑插进他的坟里，替他凑了两柄。守冢人看了你很久，说这不合规矩，然后还是收了，收得很快，像怕自己反悔。你的剑至今还插在那里。","果":{"器物":-1,"声望":5,"因果":2,"灵石":100}}]},{"id":"tianjian_043","题":"重剑压峰","类":"修行","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}的崖顶压着一块巨石，石上插着一柄重剑，剑身入石半尺，石下是空的，空到能听见风在底下走。{人物}说这块石头是那柄剑压住的，剑一拔，崖就塌，崖下二十户人家连门都来不及关。","你上去看，剑柄缠着旧布，布上结了一层霜，霜里嵌着几根断发。石缝里有很多指痕，都是试过要拔的人留下的。他说这些人拔的时候崖下的村子都在抖，抖到他们自己先怕了，手就松了。","{天象}。你把手放在剑柄上，崖下传来犬吠，一声接一声，从村头响到村尾。你忽然明白，这剑不是在等谁来拔，是在等一个敢承担塌崖的人，八百年一个都没等着。"],"择":[{"名":"拔","文":"你拔了半寸，崖下的犬吠一下子变成了哭声。你把剑又插回去，插得比原来深一指，从此再没上过崖顶。你在村口住了一夜，听了一夜的哭，天亮了才敢走。","果":{"修为":140,"道心":3,"气血":-20,"因果":2}},{"名":"不拔","文":"你把手收回来，坐在石边吹了一下午的风。下山时村里的人照旧晒谷，没有一个人抬头看你，鸡照旧在门槛上打盹。你觉得自己像个多管闲事的人。","果":{"道心":2,"灵石":50,"修为":30}},{"名":"问村","文":"你下崖去问村里人，知不知道为什么石头压在那里。老人们说那是祖先的剑，祖先拔过一次，塌了半个村，剩下的半个村就搬到了现在这里，搬了三代人。","果":{"悟性":3,"因果":1,"修为":60}}]},{"id":"tianjian_044","题":"剑市斗剑","类":"市井","重":4,"域":["tianjian"],"境界":[0,4],"段":["{地点}的剑市每年开一次，三日里满街都是剑，插在竹架上，从街口排到街尾。{人物}说这里的规矩是斗剑不斗人：两柄剑对着立在案上，谁的剑先响就是谁输，输的那柄当场折价三成，三十年没变过。","你在摊上看见一柄{器物}，剑柄上刻着一个很小的字，字被磨过，磨得只剩一点。摊主说这剑是他自己的，赢了七场，你要买得按七场的价。你要看它响不响，他不肯，说它累了，累了就该歇。","{天象}。街尾忽然起了一阵骚动，有人抬着一柄通体漆黑的剑进来，说是从剑冢崖下捡的。所有的剑同时响了一声，响得整条街都静了，静得能听见抬剑人的脚步声。"],"择":[{"名":"买旧剑","文":"你把摊上那柄剑买下了，按七场的价，一文没还。摊主找钱时手在抖，说这剑跟了他七年，从来没响过，一次也没有。你把剑抱在怀里，走了很远都被那点凉意贴着。","果":{"器物":1,"灵石":-120,"因果":1,"修为":40}},{"名":"斗一剑","文":"你把自己的剑立上案，对面那柄黑剑响了一声，你的剑没响。街上的人都在看你，有人笑，有人叹气。你收了剑就走，走出去十步，剑在你手里轻轻地颤了一下。","果":{"修为":90,"声望":-3,"悟性":2}},{"名":"跟去崖下","文":"你跟着抬剑的人走，走到半路他们拐进一条小巷，巷里已经等着四个人。你把剑收了，说只是问问价。为首的那个笑了，说崖下捡的东西，从来不讲价。","果":{"修为":120,"气血":-30,"因果":2,"魔念":1}}]},{"id":"tianjian_045","题":"阁主第三剑","类":"宗门","重":1,"域":["tianjian"],"境界":[7,13],"段":["三十年了，阁主终于出第三剑。崖上立着十二个人，都是各域赶来的，{天象}，三千级剑阶上还站着几百个看客，没有一个人说话。阁主站在崖边，膝上的剑第一次出鞘，出鞘时没有声音。","他说这一剑不劈人，劈的是一道旧账。你们抬头，云里什么也没有，只有一道极淡的白痕，从西到东横在天上，淡得像被水洗过。他说那道痕是他师父当年留下的，留了八百年，抵着他的道。","他起手的时候，崖上所有的剑同时低了三寸，剑尖朝地，像在行礼。你听见风停了，听见几百人同时不敢呼气的那种声音。剑落下去的时候，天上那道白痕还亮着，亮得刺眼。"],"择":[{"名":"看着","文":"你看完了这一剑，很久之后才有人敢呼气。白痕还在，一点没变。阁主收剑回鞘，说这一剑他输了。崖上的人都散了，只有他还站在崖边，站到天黑。","果":{"悟性":4,"修为":150,"道心":2}},{"名":"记下","文":"你把这一剑的起落记在心里，记了一辈子。后来你教徒弟时只教这一个起手，不教后面的，因为后面的你也没看清。徒弟问你为什么，你说有些东西看清了就不灵了。","果":{"悟性":3,"修为":200,"声望":4}},{"名":"替他补","文":"你在阁主收剑之后拔出自己的剑，朝那道白痕劈了一下。剑断了，断得干脆，白痕亮了一瞬就灭。阁主回头看你，眼里第一次有了别的神色，像是羡慕。","果":{"修为":120,"器物":-1,"因果":3,"魔念":1}}]},{"id":"tianjian_046","题":"空剑匣","类":"奇闻","重":2,"域":["tianjian"],"境界":[0,7],"段":["{地点}的人捡到一个剑匣，匣子极重，锁扣完好，摇不出一点声音。{人物}说这是藏锋阁的三号匣，匣里本该有一柄剑，若空着，说明剑自己走了，或者根本就从来没成过，只是匣子舍不得扔。","他让你打开。你说匣子是别人的，他说匣子在路上就是无主的，无主的东西只管打开。你还是没开，把匣子抱回住处放在床头。夜里匣子里有很轻的响，像有人在里面翻身，也像有人在数数。","{天象}。第三日匣子上的锁自己开了，开得没有声音，扣环掉在桌上，滚了半圈才停。你站在床边看了很久，匣子里空着，只有一片剑形的灰，灰的形状比任何一柄剑都标准。"],"择":[{"名":"装剑","文":"你把自己的剑放进匣里，放的时候剑柄朝外。从此你每次取剑，剑都比上一次钝一点，钝得很慢，慢到你几乎察觉不到，直到有一天你劈不动一根竹。","果":{"器物":1,"修为":90,"悟性":2,"因果":1}},{"名":"送回","文":"你把匣子送回藏锋阁，老匠接过匣子时叹了口气，说这匣子已经找了三百年，三百年前它出去的时候，匣里有一柄没开锋的剑。他没问你路上发生了什么，只是把匣子放回架上。","果":{"声望":5,"灵石":150,"因果":2}},{"名":"埋掉","文":"你把匣子埋进崖下的土里，埋完之后夜里睡得极好，好到第二天忘了自己埋在哪里。你在崖下转了一整日，土还是那片土，土上什么痕迹都没有。","果":{"道心":2,"寿元":3,"修为":40}}]},{"id":"tianjian_047","题":"一剑三生","类":"秘境","重":2,"域":["tianjian"],"境界":[3,9],"段":["{地点}的石壁上刻着一柄剑，剑身被分成三段，三段各配一个执剑的姿势，姿势之下没有一字注解。{人物}说这叫一剑三生，一剑可以当三剑使，只是每用一次，剑就少活一次，剑也有寿，寿尽了就自己断。","他让你把剑插进壁上的剑槽。你插进去，壁里透出三道白光，一道朝东，一道朝南，一道直直照着你的胸口。他说选一道，选了之后你的剑就只剩那一道的用法，另外两道从此不能再用，用了也不灵。","{天象}。三道白光都在慢慢变暗，变暗的速度不一样，朝东那道最快，已经只剩一线。他说白光灭尽就什么都没了，这是剑在催你，你要是犹豫到什么也看不见，它就替你选，替你选的多半是最快的那道。"],"择":[{"名":"朝东","文":"你选了朝东。剑从壁里出来时轻了一半，从此你的剑只能走快路，慢不下来，慢下来剑身就发颤。你后来遇见一个使重剑的人，被压得抬不起手，才知道自己丢了什么。","果":{"修为":180,"悟性":2,"气血":-20,"因果":1}},{"名":"朝南","文":"你选了朝南，剑身上多了一道横纹。从此你的剑沉了三分，出手比先前慢，可每一剑都往下压，压得对手的剑抬不起来。你后来遇见一个使快剑的人，被他绕了三圈，第四圈你一剑把他钉在地上。","果":{"修为":160,"气血":-10,"道心":2,"因果":1}},{"名":"都不选","文":"你拔剑就走，三道白光在你背后灭了，灭得很快。剑在鞘里响了一声，响得像松了口气。你走出来才发现壁上的剑形淡了，淡得只剩一个轮廓，像被人用袖子擦过。","果":{"悟性":3,"道心":3,"修为":40}}]},{"id":"tianjian_048","题":"剑市旧债","类":"市井","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}的剑市上，你的剑被人拦住了。拦住你的是个老账房，手里抱着一本簿子，簿上记着三十年前一柄{器物}的旧账：谁买的，谁卖的，中间谁插了一手，插的时候多收了七成。","他说那七成该由持剑的人来还，如今持剑的人是你，账就落在你头上。他把簿子翻给你看，纸上墨迹发褐，像被血浸过又晾干。{人物}在旁边低声说，这簿子厉害，三十年来没记错过一笔。","{天象}。老账房说不急，他可以等，等到你哪一天拿不出灵石，把剑押给他也行。他说话时手一直按在簿子上，按得很稳，指甲缝里嵌着陈年的墨。"],"择":[{"名":"还账","文":"你把身上所有灵石都拿出来，还不够三成。老账房收了，在簿上划掉一笔，划得很轻，说剩下的记你名下。你走出剑市，觉得背上比来时沉，沉得像多背了半个人。","果":{"灵石":-150,"因果":2,"道心":1,"修为":40}},{"名":"赖账","文":"你说这账不是你欠的。他把簿子合上，说好，然后当着满街的人把你的名字念了一遍，念得很慢，念完还把你的相貌说了一遍。你在剑市里走了三百步，三百步里都有人回头看你。","果":{"声望":-6,"灵石":60,"魔念":1}},{"名":"查账","文":"你要看三十年前这买卖是谁经的手。他翻到最后一页，指上一个名字，那名字你认得，是剑冢碑林里你见过的一块碑。他说这个人早就死了，账却还活着，账比人活得久。","果":{"悟性":3,"因果":2,"修为":60}}]},{"id":"tianjian_049","题":"崖顶雷竹","类":"修行","重":3,"域":["tianjian"],"境界":[0,5],"段":["{地点}的崖顶只有一根雷竹，孤零零长在最靠近天的地方，竹身焦黑，节上却还有新青。{人物}说他守这根竹守了二十年，等它再挨一次雷，就能取竹心；取到竹心的人，剑意能清上三年，三年里心不会乱。","雷要来了。云在崖顶压成一块铁，铁里有光在动，动得很慢。他忽然说他不取了，让你取。你问他为什么，他说他等得太久了，等怕了，等久了的人取不到，手会软。","{天象}。雷落下来的时候，竹身没有断，反倒直了直，焦黑褪去一层。你听见他站在后面数数，一声一声数到七就停了，停下来之后再没出声。"],"择":[{"名":"取竹","文":"你抢在雷停之前剖开竹身，取出一节温热的竹心。竹心在你手里跳了一下，像有心跳。他站在后面看着，脸白得像纸，说二十年他都没敢下这一刀，说完就坐下了。","果":{"灵材":1,"修为":150,"悟性":2,"气血":-25}},{"名":"让他取","文":"你退开一步，把他推到竹前。他愣住，手抖着去剖，剖到一半竹就枯了，竹心成了灰。他跪在灰里，说不怪你，说这是命。你站在旁边，觉得自己推了他一把，推的是一辈子的念。","果":{"道心":-1,"因果":2,"修为":30,"灵石":80}},{"名":"护竹","文":"你把剑插在竹前引雷，雷劈在剑上，竹一根没伤。你的剑从此带着一道雷纹，纹路很细，细得像头发。他看了很久，说这竹他要再守二十年，守到它自己老的。","果":{"器物":1,"修为":120,"声望":3,"寿元":-2}}]},{"id":"tianjian_050","题":"剑冢过夜","类":"奇闻","重":2,"域":["tianjian"],"境界":[0,6],"段":["你被闭崖留在崖上，只能过一夜。{人物}说崖上过夜有三件事不能做：不能拔剑，不能应声，不能往上看。他塞给你一枚旧剑穗，说握在手里，听见什么都别松手，松了手就找不着下山的路。","天黑得很快，快得像有人在上面拉了一块布。崖上的剑开始响，一柄接一柄，响到后来像有很多人在你身边走来走去。你听见有人叫你的名字，叫得很亲，亲得你差点应了，喉咙里那个字已经上来了。","{天象}。声音停下来之后，你听见有人在替你数剑，一柄一柄地数，数到你的剑时停了一下，停了一下才继续数。你手里的剑穗被汗浸湿了，指节发白，一夜没松。"],"择":[{"名":"握着不动","文":"你握着剑穗坐到天亮，一句没应，一眼没抬。天亮时崖门开了，守冢人看了你手里的穗子一眼，说这穗子是他三十年前给出去的那一枚，他以为早就没了。","果":{"道心":3,"修为":90,"悟性":2}},{"名":"往上看","文":"你忍不住往上看了一眼。崖顶那柄最高的剑不在原处，剑尖朝下落，正对着你。你赶紧低头，那一夜再没敢动，天亮时发现自己的头发白了一小撮。","果":{"修为":120,"气血":-30,"寿元":-2,"魔念":1}},{"名":"应声","文":"你应了一声。声音出来才发现不是自己的嗓子，那声应答很老，很哑。之后崖上的剑一齐静了，静得像在等你说话。你一句话没说，熬到天亮，从此说话总带一点哑。","果":{"因果":3,"修为":60,"气血":-20,"悟性":1}}]},{"id":"tianjian_051","题":"断锋会买命","类":"争斗","重":2,"域":["tianjian"],"境界":[1,6],"段":["断锋会开了价，要一个人的命，价开得不高，只三柄断剑。{人物}说这价不是开给杀手的，是开给死者的家人看的，让人知道自己值多少，值多少就有多少人来。","那个人住在{地点}，一个瘸腿的老剑客，天天坐在门口晒太阳，膝上横着一柄没锋的剑。你去的时候他正在磨剑，见你来，说坐吧，等我把这一遍磨完，磨完再谈事，事不急。","{天象}。他磨完，把剑放在膝上，问你价开了多少。你说了。他点点头，说比我估的高一点，然后问你，你是来杀我的，还是来告诉我这件事的。他问得很平静，像在问天气。"],"择":[{"名":"只告知","文":"你说只是来告诉他。他笑了，说三十年了，第一次有人只来告知。他请你喝了一碗酒，酒很浊，碗底沉着一点铁屑；喝完他把那柄没锋的剑递给你，说他用不着了。","果":{"道心":3,"声望":4,"器物":1,"修为":60}},{"名":"动手","文":"你动手了。他没还手，只把剑横在膝上，说这一剑你留着，往后你每想起今天，手都会抖一下。他死得很快，血落到那柄没锋的剑上，剑身亮了一下就暗了。","果":{"修为":140,"魔念":3,"因果":3,"气血":-15}},{"名":"替他抵命","文":"你去断锋会，说这命我替他。会里的人看了你很久，问你凭什么。你说凭我还有一柄好剑。他们笑了，把价改成了你的命，改得很快，像一直在等这句话。","果":{"声望":6,"修为":100,"寿元":-6,"因果":3}}]},{"id":"tianjian_052","题":"藏锋阁收剑","类":"宗门","重":2,"域":["tianjian"],"境界":[2,7],"段":["藏锋阁每年收一次剑，不收好剑，只收断的。{人物}说阁里铸剑十万，最缺的偏偏是断剑，断剑里藏着剑最不肯说的那一句话，铸新剑的时候要用它垫底，垫了才不会一铸就软。","你在崖下排队，前面的人抱着半截剑，后面的人抱着三截。轮到收剑的老匠，他把每柄断剑都举到耳边听一听，听到不响的就退回去，说死的剑不收，死的剑没话可说，收了也是废料。","{天象}。轮到你时，老匠听了很久，眉头动了动，说这剑还活着，不收，活的东西不能当料。他把剑推回你怀里，推得很轻，像怕碰疼了什么。"],"择":[{"名":"求他收","文":"你说这剑跟了我十年，断了三年，早该死了。老匠摇头，说它死没死，你比我清楚。他把手插回炉灰里暖着，不再看你，炉灰落了一地。","果":{"悟性":2,"修为":40,"因果":1}},{"名":"砸断它","文":"你当场把剑砸成三截，砸得很用力，砸到石上火星四溅。老匠叹了口气，收了，收的时候手很轻，说可惜了，它本来还能再说几年话。","果":{"器物":-1,"灵石":150,"魔念":2,"因果":2}},{"名":"带回","文":"你把剑带回来，从此不再拿出来。三年后你在剑冢听人说，那一年的断剑里有一柄夜里会响，响得守夜的人不敢靠近，响到后来自己锈断了。","果":{"道心":2,"修为":60,"寿元":2}}]},{"id":"tianjian_053","题":"剑心草反噬","类":"灾祸","重":2,"域":["tianjian"],"境界":[0,5],"段":["你吃太多剑心草了。起初只是心静，静得能听见自己血流的声音；后来静得过了头，你听见别人的心跳，隔着三里都听得见，听得头痛，痛到夜里睡不着。","{人物}说你这是草气入脉，草在替你呼吸。他让你把手按在崖壁上，说崖壁凉，能把草气压回去。你按了，壁上开始渗水，水是红的，红得像有人在石头里流血，流得极慢。","{天象}。他忽然说，明日之前你若还听得见别人的心跳，就得把血放掉一半。他说这话的时候手里已经拿着一只碗，碗边有缺口，看着像是用了很多年。"],"择":[{"名":"放血","文":"你放了半碗血，血是黑的，黑得发亮，落进碗里没有声音。心跳声没了，可你从此看见的东西都淡了一层，连剑锋的光都淡，淡到要凑近才能看清。","果":{"气血":-50,"道心":3,"修为":60,"寿元":4}},{"名":"不服","文":"你不肯放，硬撑了三日。第三日你听见整座崖的心跳，齐得像一面鼓，鼓点落在你太阳穴上。你去求他的时候，他只说了一句：早三日来，血还能少放些。","果":{"气血":-80,"修为":140,"悟性":2,"寿元":-6}},{"名":"以剑镇","文":"你把剑插在自己面前，让剑意压住草气。压住了，可剑从此不肯归鞘，剑身在鞘外露着一寸，露了整整数月，像有话没说完。","果":{"修为":120,"道心":1,"魔念":1,"因果":2}}]},{"id":"tianjian_054","题":"剑庐问心","类":"修行","重":2,"域":["tianjian"],"境界":[0,6],"段":["北崖剑庐有个规矩，入门者要在空屋里待三日，屋里只有一柄没开锋的剑和一个蒲团。{人物}说三日里会在墙上看见自己最怕的东西，那不是幻，是剑照出来的，剑照得比镜子老实。","你进去了。第一日墙上什么都没有，第二日出现一个人影，背对着你，手里提着剑。第三日那人转过身来，你看清了他的脸，是自己，脸比你老，眼睛比你狠，站着的样子比你有底气。","{天象}。屋外有人问你怕不怕。你说不怕。你说怕的是他手里的剑比你的快。说完这句，墙上的影子笑了一下，笑得跟你一模一样，笑完往墙里退了半步。"],"择":[{"名":"问他","文":"你问那影子，你比我快多少。影子没有答，只把剑横过来，让你看剑脊。你凑近去看，剑脊上刻着一个日子，那个日子还没到，你却认得那是自己的死期。","果":{"悟性":4,"修为":100,"道心":2}},{"名":"递剑","文":"你把手里那柄没开锋的剑递过去。影子接了，接得极自然，然后屋子空了，空得连墙上的影子都干净了。你手里剩下一柄开过锋的剑，锋很薄，薄得像还没决定要斩谁。","果":{"器物":1,"悟性":2,"修为":80,"因果":2}},{"名":"坐满三日","文":"你坐满三日，一句话没说。出门时他问看见了什么，你说看见自己。他点头，说看见自己就对了，看不见的人要再关三日，关到看见为止，有人被关了一整年。","果":{"道心":3,"修为":60,"声望":3}}]},{"id":"tianjian_055","题":"洗剑池夜浴","类":"奇闻","重":2,"域":["tianjian"],"境界":[1,6],"段":["执事堂禁令第三条：不夜浴。有个后生不听，夜里下了池。第二日他站在池边，衣裳是干的，头发也是干的，可他一直在搓自己的手臂，搓到皮破，搓到血都出来了。","{人物}去问他，他说池底有人在教他剑，教得很耐心，一招一式掰着手教。他说学了一夜，学会三招，招式极好，好得让他心慌，只是每一招都要从别人身上取一样东西回来。","{天象}。他伸出那条手臂，手臂上有一道道浅痕，痕的数目正好是三的倍数。他说完就笑，笑得很轻，轻得像怕吵醒池里的东西。"],"择":[{"名":"拉他上岸","文":"你把他拽到岸上，他还在搓手，搓得指节全白。三天后他死了，死的时候手是展开的，掌心朝上，像在等什么东西落下来。执事堂在他名字上画了一道线。","果":{"道心":2,"声望":2,"修为":40}},{"名":"下水学","文":"你也下去了。池底确实有人在教，声音很轻，教得很有耐心，你却一直看不清脸。天亮时你上了岸，学会了一招，那一招后来救过你一次命，也害过你一次。","果":{"修为":180,"魔念":2,"因果":2,"气血":-30}},{"名":"问执事堂","文":"执事堂的人翻出旧簿，说这后生不是第一个，簿上记着十一个名字，十一个是十年前的事，墨色都旧了，只有最后一个名字是新添的，墨还没有干。","果":{"悟性":3,"因果":1,"灵石":60}}]},{"id":"tianjian_056","题":"问剑台收徒","类":"宗门","重":3,"域":["tianjian"],"境界":[0,4],"段":["问剑台每年收一次徒，收的不算最能打的，收的是输得最不肯走的。{人物}说能打的人到处都有，输够了还敢自己站起来的，十年才出两三个，两三个里还有一个后来疯了。","你看见一个少年输到第九场，躺在地上不起来，也不走，就那么躺着看天。台上的人问他为什么不走，他说他在想刚才那一剑错在哪里，想明白了就走，想不明白就再躺一会儿。","{天象}。他把九场里每一场都想了一遍，想到天黑，天上有星星出来。然后他自己爬起来，走下台，走过你身边时脚是稳的，眼睛亮得不像刚输了九场。"],"择":[{"名":"举荐","文":"你在簿上写下他的名字。他进了剑冢，三年后你听说他守第七段，守得很稳。他没再跟你说话，只在每次见你时点一下头，点的角度一直没变。","果":{"声望":5,"修为":40,"因果":1}},{"名":"跟着他","文":"你跟着他下台，跟他搭话。他说他还要再输九场，输完再决定要不要进剑冢。你问他要是输不完呢，他说那就一直输，输到没人肯跟他打为止。","果":{"悟性":2,"修为":60,"道心":2}},{"名":"上台","文":"你上台，赶在他第九场之后。他看了你一眼，说这一场我输给你，然后自己走下台。你在台上站了很久，觉得自己赢了一件事，又好像什么都没赢。","果":{"修为":90,"声望":3,"灵石":60}}]},{"id":"tianjian_057","题":"剑冢问卜","类":"奇闻","重":2,"域":["tianjian"],"境界":[0,6],"段":["{地点}有个替人问卜的老妇，不烧香，不摇签，只看剑。她把你的剑横在膝上，从剑柄一直摸到剑尖，摸到剑格时停一停，就知道你要问的事该问不该问。她说剑比人诚实，人撒谎的时候，剑不会撒谎，剑身上的东西都在。","你要问的是下山之后该往哪里走。她摸到剑尖时皱了眉，说剑尖上有三处缺口，三处都是替人挡下来的，挡过三次，第四次就挡不住了。她问你这第四次，是替自己挡，还是替别人挡，问完就那么看着你，等你答。","{天象}。她把剑还给你，说她只能看到这里，后面的路藏在剑鞘里，鞘不开就看不见，硬开的人多半开了个空。她收的价很怪：不要灵石，只让你留下一句话，说给下一个来问卜的人听，说什么都行。"],"择":[{"名":"说真话","文":"你留了一句实话，说得很难听，难听到自己都皱眉。她点头，说这句话会害人，也会救人，说完把剑推回来，剑尖上那三处缺口不知何时平了一处。你后来才知道，平掉的那一处，是替别人挡的。","果":{"悟性":3,"因果":2,"修为":60}},{"名":"说假话","文":"你留了一句假话，编得很圆。她说好，然后把假话写在一块木牌上挂起来。三个月后你听说有人看了那木牌就下山去了，再没回来，木牌也被摘了，摘的人没留下名字。","果":{"魔念":1,"因果":2,"灵石":80}},{"名":"不说话","文":"你什么也没留，转身就走。她在背后说，你不留话，就只能留东西。你走出很远，摸到剑鞘上少了一颗铜钉，那颗钉子你摸了三年，熟得像自己的牙。","果":{"器物":-1,"因果":1,"修为":40,"道心":1}}]},{"id":"tianjian_058","题":"崖顶守夜人","类":"人情","重":3,"域":["tianjian"],"境界":[0,5],"段":["剑冢七段崖，第七段只有一个守夜的人，没有名字，也没有住处，就坐在最高那块石头上。{人物}说他在上面坐了四十年，四十年里没下过崖，饿了有人送饭，冷了有人送衣，谁送的没人知道。","你爬上去看他。他很瘦，眼睛却亮，膝上横着一柄没有鞘的剑。他问你怕不怕高，你说不怕。他说怕高的人上不来，不怕高的人上来了也下不去，两种人都得在这儿坐一夜，坐到天亮才知道自己是哪一种。","{天象}。那一夜崖上风大，你听见万剑齐鸣，一柄接一柄，响了整宿。他一句话没说，只在最响的那一瞬伸手按了一下你的肩，按得很重，重到你把到了嘴边的惊叫咽了回去。"],"择":[{"名":"陪他坐到天亮","文":"你陪他坐到天亮。天亮时他说你可以下去了，还说四十年来第一个陪他坐到天亮的，是个连名字都没报的人。你下崖时回头看，那块石头上空着，像从来没人坐过。","果":{"道心":3,"声望":3,"修为":60,"悟性":2}},{"名":"问他为什么不下","文":"你问他为什么不下崖。他说他下去过一次，下去之后发现崖上少了一个人，剑冢就乱了七天。他说他不是不能下，是下了之后没人肯上来，说这话时他一直看着崖下的雾。","果":{"悟性":4,"修为":40,"因果":1}},{"名":"替他守一夜","文":"你让他睡，你来守。他没推辞，靠着石头就睡着了，睡得像个孩子。半夜你看见崖下有很多光在动，动到崖脚就停住。天亮时他醒了，说四十年第一次睡整宿。","果":{"修为":120,"气血":-20,"声望":5,"道心":2}}]},{"id":"tianjian_059","题":"星陨铁铸剑","类":"修行","重":3,"域":["tianjian"],"境界":[1,6],"段":["你从{地点}得了一块星陨铁，黑里透青，握久了手心发烫。{人物}说这铁能铸剑，但铸之前要先问它一句：你愿不愿意。铁不说话，愿意的铁在炉里会自己变软，不愿意的会炸炉，炸起来能把人烧成焦炭。","你把铁放进炉里，火一旺，铁就开始响，响得很细，像有人在里面磨牙。他说这是铁在挑主人，挑不上的铁宁肯自己碎，也不肯成剑。他让你把手伸到炉口，让铁闻一闻你的血气，闻过了再决定。","{天象}。炉口的火苗忽然矮了一半，铁在炉里翻了个身，露出底面一层青。他说成了，这铁认你了，认了之后你铸它三日不能睡，睡了它就记恨，记恨的剑会在你背后响。"],"择":[{"名":"铸三日","文":"你铸了三日没合眼，眼睛肿得睁不开。剑成那一刻炉火自己灭了，剑身上浮着一层青，青得像深水。你握着它，觉得掌心那块地方从此不会冷，也不会热。","果":{"器物":1,"修为":200,"气血":-40,"灵材":-1}},{"名":"让它歇","文":"你铸到第二日就撑不住，睡了。醒来时剑成了一半，剑尖没成形，钝钝的像根铁条。老匠说这样也好，钝的不伤人，就是自己看着难受，看着看着就想起那一觉睡得太沉。","果":{"器物":1,"修为":80,"悟性":1,"气血":-10}},{"名":"弃铁","文":"你说这铁太挑，把炉门拉开，任它落在地上。铁落地时响了一声，响得很长，长得不像铁。老匠蹲下去看了很久，说它记仇了，往后你铸什么都不会成。","果":{"灵材":-1,"修为":40,"因果":2,"魔念":1}}]},{"id":"tianjian_060","题":"剑市真假剑","类":"市井","重":4,"域":["tianjian"],"境界":[0,4],"段":["{地点}的剑市分两段：东段卖真剑，西段卖假剑。假剑不害人，只骗人，剑身是好的，剑柄里灌了铅，拿着沉，出手慢，用久了手腕会废。{人物}说西段的买卖比东段红火，因为买假剑的人多半只看一眼，看不出柄里的名堂。","你在西段看中一柄{器物}，花纹漂亮，剑鞘还镶了铜。摊主说这是从剑冢流出来的，价不贵。你掂了掂，觉得沉，沉得不合分量。他见你迟疑，就说沉的剑才压得住手，轻的剑都是没养过的。","{天象}。你正要把剑放下，旁边有人伸手把剑接了去，那人穿着藏锋阁的旧袍，袖口磨破了。他把剑横过来，在柄上敲了两下，敲出一点空响，然后把剑递回摊主，一句话没说就走了。"],"择":[{"名":"追那人","文":"你追上去问他是怎么听出来的。他停下脚，说听剑不用耳朵，用虎口；剑是死的还是活的，虎口一握就知道。他教了你三句口诀，说完就走，你后来凭这三句捡了三回命。","果":{"悟性":4,"修为":60,"灵石":40}},{"名":"买下","文":"你把那柄剑买下了，指明要撬开柄看。摊主脸白了，撬开一看，柄腔里灌满了铅，铅里还混着细砂。满街的人都围过来看，摊主当天就收了摊，从此西段少了一家。","果":{"灵石":-60,"声望":4,"因果":1,"修为":20}},{"名":"砸摊","文":"你当场把剑折了，折成两截，铅块掉在地上，砸出一个坑。摊主扑上来要打，被旁边的人按住。西段的买卖照旧红火，只是从此见了你都不吆喝了。","果":{"声望":3,"修为":60,"灵石":-20}}]},{"id":"tianjian_061","题":"葬剑人最后的活","类":"人情","重":2,"域":["tianjian"],"境界":[2,8],"段":["葬剑人老了，手抖，连铲子都提不动。他把{器物}放在你面前，说这是他这一行最后一件活，问你能不能替他做完。你没问是谁的，他也没急着说，只是把那个地方说了一遍，说了三遍，怕你记不住，说完还在地上画出方位。","地方在{地点}，一具尸首靠着石壁坐着，死了有些年头，骨头白得发干，骨头旁边插着一柄断剑。断剑插得很正，剑柄朝上，柄上缠的布已经烂成丝，丝里还夹着一点朱红。你伸手去拔，拔不动，剑在石头里生了根。","{天象}。葬剑人不知什么时候跟了上来，站在你身后，看着那柄断剑，说他三十年前就该来，来了却一直不敢下手。他说这剑记得他，认出来了会响，一响他就走不动道，走不动就埋不成了。"],"择":[{"名":"替他拔","文":"你拔出断剑，剑身上有一道刻痕，刻的是葬剑人的本名。老人接过剑，跪下磕了三个头，磕得很慢，然后倒在尸首旁边，倒得极安静。你把两具尸首一起埋了，土是新挖的，埋得很深。","果":{"道心":4,"声望":4,"修为":80,"因果":2}},{"名":"问他","文":"你问他这人是谁。他说是师兄，三十年前把师兄埋在这里，没埋剑，因为他贪了那柄断剑，贪了之后就再也睡不着。他说这话时手一直抖，抖得裤子上的土簌簌往下掉。","果":{"悟性":3,"因果":2,"修为":40}},{"名":"埋剑","文":"你没把剑拔出来，只把土培得更厚，培成一个大坟。老人看着，说这样也好，剑留着，人就不算白死。第二年春天那地方长出一丛红草，草叶细如剑尖，谁也不敢割。","果":{"声望":3,"修为":50,"灵石":60}}]},{"id":"tianjian_062","题":"试锋礼","类":"宗门","重":3,"域":["tianjian"],"境界":[1,6],"段":["藏锋阁每三年办一次试锋礼，礼上只做一件事：当众开一柄剑。开剑的老匠蒙着眼，全凭手摸，摸出这剑该交给谁。{人物}说这礼比斗剑还伤人，摸错了，接剑的和开剑的都要背三年，背到名声洗清为止。","今年开的是{器物}，剑匣一开，满崖的人都往后退了半步，退得靴底擦着石头。老匠伸手摸剑脊，摸到一半停住，往东边一指，指到一个瘸腿的杂役身上。杂役连连摆手，说他一辈子没握过剑，握了也拿不稳，拿稳了也没胆子用。","{天象}。老匠不理他，把剑放到他手里，剑忽然轻了，轻得他一只手就托住，托得稳稳的。崖上的人都不说话，只有风把试锋谱翻得哗哗响，翻到某一页就停了，停得像是有人按住。"],"择":[{"名":"贺他","文":"你上前道贺。杂役抬头看你，眼里没有喜色，只说从今天起他就得上崖守剑了，守到什么时候没人说。三年后你在第七段见到他，他已经不瘸了，走路很稳，也不跟人说话。","果":{"声望":4,"修为":60,"因果":1}},{"名":"疑老匠","文":"你当众问老匠，摸剑的手会不会也摸错人。老匠不恼，把蒙眼的布解下来，眼眶是空的，说他这双眼瞎了二十年，靠的就是不出错。他说错一次，就得有人替他赔一辈子，赔不起。","果":{"悟性":3,"修为":40,"声望":3}},{"名":"求开剑","文":"你请他替你开一柄。他摸了摸你的剑，摇头，说这剑该你自己开，我开了它就废了。他补了一句，说被人开过的剑，一辈子都在找那只手，找不到就响，响到锈死。","果":{"悟性":2,"道心":2,"修为":50}}]},{"id":"tianjian_063","题":"洗阶雨","类":"天象","重":2,"域":["tianjian"],"境界":[0,7],"段":["{天象}。你在三千剑阶第十九级避雨，雨顺着石阶往下淌，淌成一条细河，河水是灰的。阶上刻着的名字被雨浸得发黑，一个个浮出来，像有人从石头里探出头来透气，看得久了会觉得他们还在。","{人物}说这雨叫洗阶雨，三十年下一回，下一回冲掉一层名字。被冲掉的那些，多半是登过顶又死了的人，死了就没人替他们保养石头。他说名字被冲掉的人，来年就没有人替他们扫阶，扫阶的只扫有名字的。","雨越下越大，你脚边的名字开始模糊，糊成一团。你低头去看自己那一块，看见名字的位置已经淡了一半，再冲一个时辰，就什么也不剩了，剩下的石头会跟新的一样平。"],"择":[{"名":"刻深些","文":"你冒着雨在阶上重刻自己的名字，刻得极深，深到能盛水。第二天雨停了，你的名字没被冲掉，倒是刻得太深，上山的人路过都会绊一下，绊完就骂一句。","果":{"修为":90,"悟性":2,"因果":1}},{"名":"不刻","文":"你没动，任雨水把自己的名字冲淡。雨停之后那块石头干净得发亮，像本来就是一块无字石。守阶的老人走过，看了很久，说这样好，省得将来有人替你磨。","果":{"道心":3,"修为":40,"寿元":2}},{"名":"替人刻","文":"你替旁边几个快被冲掉的名字重刻了一遍，刻了七个，手都磨破了。刻到第七个时你想起来，这七个人你一个都不认识，只是他们的名字比你的清楚。","果":{"声望":4,"气血":-20,"因果":2}}]},{"id":"tianjian_064","题":"洗剑池沉匣","类":"秘境","重":2,"域":["tianjian"],"境界":[2,7],"段":["洗剑池的水位今年退得厉害，退到露出池底一整片匣子。{人物}说这是三十年一遇，池底的东西都在等人，等人来取，也等人来还。执事堂的人守在池边，只许看，不许下手，下了手就要按旧约办。","你看见一只匣子的锁扣是自己开的，匣里没有剑，只有一柄剑的影子，影子在匣底躺着，躺得很正。执事堂的人说这种叫空匣，剑走了，影子没走；取了影子也没用，还会招来别的东西，招来的东西不好送走。","{天象}。池边忽然起了一阵风，把最边上那只匣子吹翻了。匣口朝上，里面全是剑穗，缠成一团，颜色新旧不一，最新的那一根还是湿的，湿得像是刚从谁的剑柄上解下来。"],"择":[{"名":"取影","文":"你把手伸进空匣，摸到一片凉，凉顺着胳膊往上走，走到心口停住。从此你在夜里能看见剑的影子，看得见也摸不着，摸不着的时候最难受，像有话卡在喉咙里。","果":{"修为":180,"悟性":2,"因果":3,"气血":-30}},{"名":"数穗","文":"你数了数那团穗子，一共四十九根。执事堂的人脸色变了，说四十九是旧约里的数，多一根就要出事，少一根也要出事。他们当场把匣子合上，抬回堂里，抬的时候四个人抬一只匣子还发抖。","果":{"悟性":4,"因果":2,"修为":60}},{"名":"不动","文":"你什么也没动，退到岸上。池水第二天涨了回去，涨得很慢，像有人在下面推。涨满的时候水面起了一个很小的旋，旋中心浮着一根新穗，浮了一下就沉了。","果":{"道心":3,"声望":2,"灵石":50}}]},{"id":"tianjian_065","题":"无锋认主","类":"秘境","重":1,"域":["tianjian"],"境界":[3,10],"段":["无锋石室的门第二次开了。{人物}说上一回开门是阁主亲手开的，开门为的是一位剑修，那人在室里待了九日，出来时手里多了一柄没有锋的剑，剑很轻，轻得像一句没写完的字，握着没什么分量。","这次门是自己开的，只开了一条缝，缝里有白光透出来，白光落在地上，照出一柄剑的影子。你站在门口，觉得那影子在等你，等你进去，也等你替它做一件事；至于是什么事，影子不说，只在光里轻轻晃。","{天象}。石壁上那些字比上回更淡了，淡到只剩一点印子。你听见室里有人在磨剑，磨得很慢，一下一下，那节奏刚好和你的呼吸对上，对上之后你就分不清是谁在磨。"],"择":[{"名":"进去","文":"你进去，石台上没有剑，只有一块凹下去的印子，印子边缘光滑得像被手摸了几百年。你在印子上跪下，白光落进你眼睛里；从此你的剑越来越钝，你的手却越来越稳，稳得让人害怕。","果":{"悟性":4,"修为":240,"道心":3,"寿元":-6}},{"名":"关门","文":"你把门推上。门合得很慢，慢到你能看清里面那点白光被一点点夹灭，像有人慢慢合上眼睛。合上之后崖上安静了很久，久到你怀疑刚才听见的磨剑声是自己的耳朵在骗自己。","果":{"道心":2,"修为":60,"因果":1}},{"名":"守门","文":"你在门外坐了九日，不进也不走。第十日门自己关了，关的时候没有声音。门缝里那点白光从此成了你夜里唯一看得见的光，你后来学会了在那光里睡觉。","果":{"修为":100,"悟性":3,"气血":-25}}]},{"id":"tianjian_066","题":"剑庐末战","类":"争斗","重":2,"域":["tianjian"],"境界":[2,8],"段":["北崖剑庐的老庐主要死了，死之前要跟人打最后一场。{人物}说他选了你，只因为你身上没有门户，不是谁家的人，输了也没人替你讨说法。庐中弟子不服，说一个外人凭什么，老庐主只回了一句：他输得起。","你们在{地点}比剑，比到第三剑，他的手开始抖，抖得剑尖画圈。他说他这手抖了三年，三年里没跟第二个人说过，因为一说就得放下剑，放下剑就没人记着他还会打，会打的人才有人送饭。","{天象}。他忽然把剑插进地里，说这一场他输了。你问他为什么，他说他刚在你身上看见了自己三十年前的样子，一模一样，连站姿都像，他不想把自己的结局一并递给你。"],"择":[{"名":"扶他","文":"你上前扶他，他靠在你肩上走了，走得很轻。临走他把剑留给你，剑鞘里塞着一张纸，纸上只有一个字：慢。你把那张纸揣了十年，慢字磨得快看不见了。","果":{"道心":4,"声望":5,"器物":1,"修为":80}},{"名":"再打","文":"你拔剑说还没打完。他笑了，笑着咳，咳出血来，血落在剑身上，剑亮了一下。他倒了，倒得很轻，倒下去的时候手还握着剑，握得比站着时稳。","果":{"修为":140,"魔念":1,"因果":2,"气血":-15}},{"名":"接剑","文":"你接了他的剑，回身给他的弟子磕了三个头。弟子们愣住，最后最老的那个也跪下来，跪得很慢。你在剑庐住了七日，庐里没一个人跟你提那场比试，也没人提他。","果":{"声望":6,"道心":2,"修为":60,"灵石":100}}]},{"id":"tianjian_067","题":"断岳上崖","类":"争斗","重":1,"域":["tianjian"],"境界":[2,7],"段":["断岳被人搬上了崖。{人物}说这剑不该来，来了就要出事，因为崖上的剑都不喜欢重的东西，重的东西压在崖上，崖会记仇。抬剑的十二个人抬到第六段就抬不动了，坐在石阶上喘，喘声比脚步声还大。","那天夜里崖上所有的剑都在响，响得比万剑沉海那回还凶。有几柄从崖壁上自己脱了出来，落在断岳旁边，落得离它很近，近得像要跟它说话，也像要跟它斗一场。守冢人站在崖门口，一夜没敲铃。","{天象}。你听见一声闷响，像山从中间裂开。第二天早上第六段塌了半边，断岳插在塌下来的乱石里，剑身一半埋着，一半露着，露出来的那一半上落着一层灰。"],"择":[{"名":"抬走","文":"你组织人把断岳抬下崖，抬了三天，肩膀磨破了三层皮。抬走之后崖上安静了，剑也不再响，可塌掉的那半边谁也没再补，补了两次，两次都塌，塌得比先前更狠。","果":{"气血":-40,"声望":4,"修为":90,"因果":1}},{"名":"留下","文":"你说让它插着，插着就把塌了的地方压住了。三年里那地方没人敢过，路过的人都绕着走，走的时候还要往上头看一眼。断岳一直没锈，也没响，安静得像一块真的石头。","果":{"修为":60,"道心":2,"因果":2}},{"名":"刻字","文":"你在断岳露出来的那半截剑身上刻了四个字：不要上来。刻得很深，深到能插进去一根手指。后来那四个字被人磨掉过两次，每次磨掉，第二天又有人照原样刻回去。","果":{"声望":3,"悟性":2,"修为":70}}]},{"id":"tianjian_068","题":"空崖三年","类":"天象","重":1,"域":["tianjian"],"境界":[5,12],"段":["万剑沉海之后的第三年，剑冢开始空了。{人物}说空得慢，一年空一段，从第七段往上空，空到后来崖上只剩锈和风。风过的时候没有声音了，安静得让人害怕，因为听惯了剑鸣的人，最怕安静。","守冢人还坐在崖门口，膝上那柄{器物}也不见了。他说他的剑跟着走了，走的时候没有告别，只在门边轻轻碰了一下石头。他不怪它，说剑要活自己的命，人不能拦，拦下来的剑会恨人一辈子。","{天象}。崖上忽然传来一声极轻的鸣，从很低的地方来，低得像是从土里。他一下站起来，站得比这几年都直，说那是剑回来了，回来就好，回来就还有戏，说话时他的手已经摸上了空了的膝头。"],"择":[{"名":"陪他等","文":"你陪他等了三日。第三日崖上确实多了一柄剑，插在最下面一段，锈得看不出形，锈里还嵌着一点红。他走下去看了很久，回来时没说话，只是把崖门的铜铃重新挂上了。","果":{"道心":4,"声望":4,"修为":100}},{"名":"劝他下山","文":"你劝他下山，他摇头，说崖空了他更不能走，走了崖就真空了，空崖会招人来，来的都是不该来的。他说完把酒碗递给你，碗里空着，连一滴酒都没有，他还是递。","果":{"道心":2,"修为":40,"因果":1}},{"名":"补崖","文":"你开始往崖上插自己的剑，插了一百柄，插得手都起了茧。他看了没拦，只说假的也行，反正崖认不出，认得多了也就认了。三年后那些剑里有一柄真的响了，响得很短。","果":{"器物":-1,"修为":160,"声望":3,"灵石":-100}}]}]},"ximo":{"词汇":{"人物":["走沙客","驼队脚夫","金沙楼的账房先生","验货的独眼掌柜","绿洲茶馆的老板娘","黑市掮客","赶驼人","替人写契的落第书生","收尸人","卖水的哑童","赤足苦行僧","守泉的老妇","流沙盗的哨子","耍刀的独臂马匪","寻龙的散修","押驼的护卫","沙画师","磨刀匠","泉边的卦师","被逐出师门的丹师","押盐的官差","白驼商会的二掌柜"],"地点":["沙海绿洲","流沙谷","枯骨寺","日曜峡","月牙泉","黑石城","白骨滩","风哭口","千窟崖","沙下古城","断水驿","盐霜原","埋驼坡","死人沟","赤沙渡","老鸦泉","驼骨岭","金沙渡","沙脊关","白盐湖"],"天象":["沙暴封道三日","白日昏黄如暮","双日压沙","沙丘夜移","龙涎云压顶","沙下传来钟声","血月照沙","盐风割面","热浪如墙","沙尘成柱","驼铃无声之夜","星尘雨落","沙面结霜","日曜当空","夜半沙鸣如鼓","蜃楼行宫浮于天边"],"妖异":["沙蝎王","食金蚁群","驼骨鬼","沙下巨鳝","胡狼妖","蜃中人","沙傀","守涎沙蟒","赤砂蜈蚣","白毛骆驼妖","枯骨僧影","沙盗亡魂","石胎人","风里的哭妇","吞沙蟾","沙下巨鼍"],"器物":["驼铃串","断刃弯刀","金沙楼的铜账牌","剥皮水囊","日曜罗盘","沙门铁钵","麻绳缠足的草鞋","流沙盗的绊索","藏着契书的皮筒","验沙的琉璃镜","驮架上的黑木箱","沙下古城的铜锁","皮面账本","割驼的病刀","绿洲私铸的灵石筹码","沙门镇沙杵","风干的人皮地图","半枚火漆印"],"灵材":["星尘沙","沙海龙涎","日曜晶","千年沙参","盐霜草","驼脂","沙下青玉","火蚁卵","白盐晶髓","沙枣","龙骨粉","沙蝎尾针","绿洲寒泉","风蚀琉璃","埋沙铁","双生沙棘果"],"功法":["《流沙刀诀》","《驼铃摄魂咒》","《沙行步》","《金沙算经》","《枯骨禅》","《赤足行沙法》","《龙涎炼形篇》","《沙暴指》","《日曜煅体诀》","《盗门绊索手》","《蜃楼幻景术》","《无相乞食法》","《压沙诀》","《埋骨禅定》"],"际遇":["于沙丘下挖出半截刻字的铜碑","在绿洲黑市以低价换来一只锁死的皮箱","救起一名倒在驼道上的渴毙驼奴","于枯骨寺外拾得一串断珠","在白骨滩上抓住一截还活着的驼骨","替人守夜时撞见换货的暗契","拾到一枚烫手的火漆印","随驼铃误入沙下古城","于风哭口听见有人念自己的名字","救下一个自称账房的伤者","在盐霜原上捡到一只握刀的手","换得一张画着三条商道的人皮图","于日曜峡底挖出一块会发热的石头","被一个行脚僧讨走了半囊水","在月牙泉边替人代写了一封休书","捡到一枚写着陌生姓名的铜牌","在沙暴里抱住一根拴着驼铃的木桩","替死人合上眼睛后听见一句遗言"],"祸患":["被流沙盗认作眼线","替人担保却被弃账","驼队断水三日","被苦行沙门指为亵渎","在黑市换来一只赝品","被蜃景引离商道","遭沙蝎群围困","背上了一笔死人账","被同行诬作劫道的","在沙暴中与驮队走散","被枯骨寺的守碑人驱赶","误饮了盐霜水","被人以假契换走了真货","欠下金沙楼一笔利钱","被流沙盗在脚底刻了记号","遭人下药夺去了水囊"],"宗门":["金沙楼","苦行沙门","流沙盗","枯骨寺","黑市行会","驼帮","盐帮","收尸人一脉","白驼商会","沙脊关守军"],"地名":["沙海绿洲","流沙谷","枯骨寺","日曜峡","月牙泉","黑石城","白骨滩","风哭口","沙下古城","千窟崖"]},"图鉴":[{"类":"地理","名":"沙海绿洲","卷":1,"文":"西漠深处唯一常年有水的洼地，泉眼在石下，水甜而微咸，一日能出三百桶。绿洲没有城墙，靠的是一圈半塌的土屋和一条不成文的规矩：井边不许动刀。金沙楼的柜上开在绿洲正中，货架从盐到剑都有，价钱每日三变。走沙的人到了这里就算活了一半，剩下的一半，看的是出去时带没带对路。","引":"《西漠行程记》：进了绿洲算活命，出了绿洲才算命。"},{"类":"地理","名":"流沙谷","卷":1,"文":"沙海腹地一道极深的沟壑，谷底是会吞人的流沙，表层结着一层硬壳，看着像路。流沙盗把营地扎在谷壁的岩洞里，出入靠绳索和暗桩，外人走一百步有九十九步是死路。谷中出土一种青灰色的沙，掺进刀口能削铁，盗众管它叫谷沙。谷底另有地下水脉，水苦，却能养活一谷人马。","引":"俗谚：谷上的硬壳是给活人看的，谷底的软沙才是给人走的。"},{"类":"地理","名":"枯骨寺","卷":2,"文":"西漠最老的寺，建在一处干涸的古河床上。寺不大，只有三重殿、九间僧房，墙是夯土，屋顶压着石。寺外的碑林刻的是死者生前的债，不是功德。苦行沙门的僧人赤足、日食一餐、不点灯，说灯会照见不该照的东西。后院有一口枯井，寺里三百年不许人靠近，也不许人问。","引":"《枯骨寺碑记》：立碑不为记事，为记欠。"},{"类":"地理","名":"日曜峡","卷":2,"文":"全长四十里的石峡，两侧岩壁赤红，正午时太阳直射谷底，石面热得能烙饼。峡底散着一种会自己发热的胎石，里头的日曜晶是锻体、炼器的上品。峡内无水无风，走一趟要带足三日的量。老走沙的人说，进了日曜峡不要坐下，坐下的人会舍不得起来，最后烧干在石头上。","引":"峡口刻字：走，不要坐。"},{"类":"地理","名":"月牙泉","卷":1,"文":"沙丘之间的一弯水，形似新月，水面离沙脊只有三尺。泉边有一棵活了不知多少年的老沙柳，根须垂进水里。传说这是当年一位走沙人替全队人挡了沙暴，死后沙丘自己让出的地方。泉水不深，旱年不涸，涝年不溢。凡在泉边许过愿的人，多半会在三年之内回来一次，不为还愿，只为看一眼。","引":"泉边石碑：水不记人，人记水。"},{"类":"地理","名":"白骨滩","卷":2,"文":"一片白色的沙砾地，风把细沙吹走，只剩骨与石。这里是西漠几条老道的交汇，也是最容易出事的地界：不缺水，只缺遮掩，谁在这儿歇脚，谁就被人看个清楚。滩上常有半埋的驮架和刀，收尸人多来此寻活。滩心的沙下据说压着一座比沙下古城更早的城，谁也不敢挖。","引":"《白骨滩杂录》：滩上无活物，只有还没死的。"},{"类":"地理","名":"风哭口","卷":1,"文":"沙脊上一处天然的豁口，两侧岩壁呈喇叭形，风过必响，声如妇人夜哭。白日里过口子要快，风大得能掀翻驮架；夜里过口子要静，因为据说哭声里会夹着名字。商队过此，惯例是把铃铛摘了，不许说话，不许回头。也有胆大的专程来听，听完回去，多半会病上几日。","引":"老驼工的话：哭的不是风，是你还没认的那笔账。"},{"类":"地理","名":"千窟崖","卷":2,"文":"一道横亘三十里的赭色岩壁，凿着一千个窟，大半已被风沙填死，真正能进的只有十一处。窟内壁画以朱砂掺星尘沙绘制，画的是一千只伸向沙丘的手。壁画越是往里越新，最深处那一幅，据说画的是当下站在窟口的人。沙门不许弟子入内，金沙楼却出高价收摹本。","引":"《千窟崖残卷》：画者不知其为画，观者不知其为观。"},{"类":"宗门","名":"金沙楼","卷":1,"文":"西漠最大的商盟，总柜设在沙海绿洲，分柜遍及关内外十一个渡口。楼中不设护法，只设账房与执刀人；账房管钱，执刀人管欠钱的人。金沙楼只认灵石不认人，一手交钱一手交货，从不赊给生客，可对老主顾极重信义：说三日到，误一日赔一倍。楼里那块“欠者必还”的匾，据说原字是“欠者必偿”，后来被人改了一笔。","引":"楼规第一条：不认人，只认账。"},{"类":"宗门","名":"苦行沙门","卷":1,"文":"佛门苦修一脉，以枯骨寺为祖庭，弟子赤足行沙、日食一餐、不蓄私财。门中不重神通而重忍：能忍渴、忍痛、忍人。修的是《赤足行沙法》与《埋骨禅定》，据说炼到极处，脚底可踏滚沙如平地。沙门每年在沙场开一次斋，谁都能吃一碗，吃的人须留一句实话。凡人畏其苦，也敬其直。","引":"沙门偈：脚底有沙，心里才没有。"},{"类":"宗门","名":"流沙盗","卷":1,"文":"沙海马匪，巢在流沙谷，专劫商队，也替人洗货。盗众不立名号，只以脚底的刻痕相认：一痕是货，二痕是命，三痕是两样都要。刀法走《流沙刀诀》，出手极快极低，专往腿上下刀，说杀人不如废人，废人能换赎金。盗首原是金沙楼的账房，最清楚哪条道油水厚，也最清楚哪一笔账该找谁要。","引":"盗中传言：账房算得清，所以抢得准。"},{"类":"宗门","名":"驼帮","卷":2,"文":"不是门派，是一群赶驼人的行会，掌西漠七成驮运。帮规三条：不弃驼、不弃水、不弃同帮。帮里最老的驼工能凭铃音辨出驼队的队形，也能凭沙纹辨出前头出过什么事。驼帮与盐帮旧怨极深，为一头压死驮盐驴的病驼，能打上三天。帮中没有高手，只有一群认得路的人。","引":"《驼帮旧规》：宁可丢货，不可丢铃。"},{"类":"宗门","名":"盐帮","卷":2,"文":"掌白盐湖与盐霜原的采盐行会，帮众多在盐场做苦役，脚上常年裂口，走路一瘸一拐。盐帮不收灵石，收盐引；一张盐引能在关内外十三个柜上兑盐。帮里有条暗规：欠盐不欠命。据说这条规矩是三十年前一位帮主用自己的一条腿换来的，那条腿埋在盐场最大的一堆盐下面。","引":"盐场老话：盐是白的，账是黑的。"},{"类":"宗门","名":"收尸人一脉","卷":2,"文":"西漠最不起眼也最不可少的一门行当。收尸人不称宗门，只以麻布和铜铃相认，凡在沙里死了人，无论贵贱，都由他们卷走、擦脸、压石。规矩有四条：不问死因、不收重礼、不留遗物、不替人报仇。他们知道西漠最多的秘密，却从不说，因为说了，下一具尸首就是自己。","引":"收尸人自道：我们只管送，不管说。"},{"类":"人物","名":"金沙楼的账房","卷":2,"文":"姓不传，人称“先生”。年纪不大，眼睛却像在账本里泡了几十年，看人只看手和靴：手上有茧的是干活的，靴底干净的才是有钱的。他记性极好，谁在哪一年哪一月赊了几块灵石都记得，也记得谁在什么时候替别人还过账。西漠说他不认人，其实他认人，只是认的方式是认账。","引":"他的口头禅：数目不会说谎，人会。"},{"类":"人物","名":"独眼验货人","卷":3,"文":"绿洲黑市上最有名的验货人，一只眼被人挖了，剩下那只据说能看见货里的“气”。他验货不用秤不用镜，只把东西在手里翻三下，说一句成或不成，从无第二次。凡被他判成赝品的摊子，三日内必被行会清出市口。他收钱极贵，也从不赊账，只有一条例外：替死人验遗物，分文不取。","引":"市口传言：他那只眼，看的是人心里的贪。"},{"类":"人物","名":"守碑人","卷":2,"文":"枯骨寺外碑林的看守，赤足，拄一根包铁的木杖，据说已在碑间走了四十年，从没进过寺门一步。他识得每一块碑上的人名与债数，也识得每一个来念碑的人心里想什么。凡入寺者须先念一块碑，念得不诚的，他一杖打下石阶，从不解释。有人说他就是当年那块碑上写的人。","引":"《碑林琐记》：守碑人不守碑，守的是一句话。"},{"类":"法宝","名":"驼铃串","卷":2,"文":"西漠驼队的命脉，一串九铃，铜铸，铃舌各有不同。走沙人凭铃声辨队形、辨风向、辨前头有没有人。老驼工说，好铃能自己响：夜里若有沙盗近前，铃会先哑一声。另有邪说，说用死人指骨做铃舌的驼铃，能摄人魂魄，摇至九十九下，听者自会走出营地。此物黑市有售，价高而少。","引":"《沙海器物志》：铃是给活人听的，也是给死人听的。"},{"类":"法宝","名":"日曜罗盘","卷":3,"文":"前朝走沙人留下的旧物，铜面，内嵌星尘沙压成的磁心。寻常罗盘指北，这一种指“归”——心里最放不下的事在哪个方向，针就往哪边偏。用它找路的人，十有八九找到的是坟。也有说它是找井的：把盘拆开，磁心背面常刻着一行小字，写着某处旧井的方位，字极小，须借日头才看得清。","引":"旧货摊主的话：它不指路，指人心。"},{"类":"法宝","名":"沙门铁钵","卷":2,"文":"苦行沙门弟子随身之物，生铁铸，口沿磨得极薄，重约三斤。钵内壁刻着一圈极细的经文，据说是历代沙门以指甲所刻。此钵不盛金银，只盛乞来的饭食；凡在钵中放过灵石的人，此后三年乞食必空。沙门另有镇沙杵，形如短棍，以铁钵叩之作声，能压住流沙半刻，救人无数。","引":"沙门规矩：钵空则心满。"},{"类":"法宝","名":"铜账牌","卷":3,"文":"金沙楼发给老主顾的凭牌，巴掌大，铜铸，正面刻骆驼纹，背面刻号码与柜号。持牌者可在关内外任何一处分柜赊三十块灵石，不必押物，不必立契，楼里只认牌不认人。牌若转卖，须到柜上重新刻号；私刻者，执刀人会上门。西漠有人说，一块铜牌的分量，比一条命重，因为命死了就完了，账还活着。","引":"楼中旧语：牌在人在，牌失账不灭。"},{"类":"功法","名":"流沙刀诀","卷":2,"文":"流沙盗的看家刀法，共三十六式，起手极低，刀走的是脚下三寸，专砍腿与踝。要旨在“借沙”：刀不出全锋，先让刀锋吃进沙里的阻力，再借沙势弹出，故沙越深，刀越快。此诀后十八式不立文字，全靠盗中口传，师父死前才肯说一半。练至深处者，刀过之处沙面不见痕。","引":"盗中口诀：刀不砍人，砍人的影子。"},{"类":"功法","名":"赤足行沙法","卷":2,"文":"苦行沙门的根本法门，不炼气而炼足。初学赤足踏沙，日行三里即血泡遍足；三年后可踏滚沙如平地；七年后足底筋膜如铁，能在正午的沙面上站着不动一个时辰。法门另有心法：随沙陷随沙起，不抗不争，故又名“随陷”。沙门说这法门修的是忍，不是功。","引":"沙门传法：脚先成，心后成。"},{"类":"功法","名":"金沙算经","卷":3,"文":"金沙楼不传之秘，非杀伐之术，而是以算筹推演货价、脚程、水耗、死伤的一门学问。学者须先背八十一张行情图，再学“三变”：价变、道变、人变。楼中账房人手一册，遇人要问底细，只须翻三页便知对方这一趟赚赔。此经与鬼谷一派渊源极深，据说原本是一卷推演天机的残篇。","引":"《金沙楼杂记》：算盘一响，人心就露。"},{"类":"灵材","名":"沙海龙涎","卷":1,"文":"千年沙蟒死后，尸身化成的琥珀色黏涎，凝于沙下坑洞，腥甜而微温。此物是炼体、续命的上品，一勺可抵三月苦修，亦可入药解百毒。取涎极险，出涎之夜必有守兽盘踞。西漠人说龙涎认人：贪者取之，得涎亦得病；以诚取之，涎自凝而不散。真伪之别在于火：真涎入火不焦，假涎一触即黑。","引":"《沙海本草》：涎出于尸，尸出于贪。"},{"类":"灵材","名":"星尘沙","卷":2,"文":"十年一落的星尘雨所凝之沙，颗粒极细，色银白，白日看不出，夜里微微发亮。此沙能压灵机、定心神，炼器时掺入可让法器不散；修者用以封存记忆、镇压心魔。西漠的风水先生也用它画阵，说沙落成阵，阵成则地气不动。此物极轻，一囊不过二两，价钱却抵得上三囊金。","引":"《西漠风物志》：沙从天上来，落到人心上。"},{"类":"灵材","名":"日曜晶","卷":2,"文":"产于日曜峡胎石之中，色如凝血，触之微烫，白日晒之愈热，夜里方凉。此晶是锻体、淬器的上品，炼入刀剑可断金石；研粉入药可续筋骨，然过服则血脉如焚。峡底胎石不可久坐，坐者血燥而亡。西漠人说日曜晶是“晒出来的火”，采晶之人须在日出前动手，晚一刻，石头就开始烧人。","引":"采晶人语：日头一高，命就低。"},{"类":"秘闻","名":"沙下古城","卷":1,"文":"二十年前第一次露门，至今露过三次。城是整座沉下去的，屋舍、街巷、库房都还保持着当年的样子：案上有饭，柜上有钱，门上的铜锁锁得死死的。进过城的人说，城里的时间是停的，走一步要用三步的力气。也有人说，城里有一样东西在等人接，等的年头比城还长。城门一开，必有灯；灯灭之前不出，就出不来了。","引":"《沙下城记》：城不是埋了，是躲了。"},{"类":"秘闻","名":"沙下的钟","卷":2,"文":"西漠传了几百年的异声：夜半沙底有金石相击，一声一声，如钟如磬。老辈说那是古城的钟楼还活着；也有说是地脉换气；沙门则说那是“认名”——钟声里夹着人唱名，念的都是已死之人。西漠人有个忌讳：听见钟声不许应，应了声的，名字会被念到。近年钟声渐稀，有人说是被人挖断了，也有人说，是名字念完了。","引":"沙门旧笺：钟不催命，命自应钟。"},{"类":"秘闻","名":"化神沙印","卷":3,"文":"日曜峡东六十里地面上有一枚极深的掌印，五指各长一丈，印底沙化为琉璃。据传是七百年前一位化神修士为镇沙下之物一掌按出，掌印至今未平，掌缘的沙也不敢漫过去。修士坐印续镇，可承其镇压之力；拔印则放物。西漠有守印人一脉，代代相传，不入宗门，不立姓名，只管坐。","引":"守印人语：印不必深，心不必浅。"},{"类":"风俗","名":"论货之会","卷":2,"文":"白驼商会三年一次的暗会，在沙海绿洲的旧仓里开，不设名帖，只发皮纸请帖。会上不卖货，排座次：谁能坐上前三张桌子，往后三年的商道便归谁先挑。座次靠“压桌的货”定，货可以是奇珍，也可以是一条没人走过的道。会中不许动刀，动了刀的人，往后连绿洲的井都不许打。","引":"请帖上的字：有货者入，无货者看。"},{"类":"风俗","名":"一囊水","卷":1,"文":"西漠最硬的规矩，不在金沙楼的账上，在一囊水里。走沙的人见面，先递水，后说话；接了水的人，当日不许对递水的人动刀。这条规矩连流沙盗也守，据说盗首年轻时曾因破了这条规矩，被自己人绑在沙里晒了一天。另一条是：不要相信沙漠里遇见的第二个人——第一个可以救，第二个必有所图。","引":"《西漠旧俗》：水过喉，刀入鞘。"},{"类":"丹药","名":"沙棘双果","卷":3,"文":"背风沙洼里生的怪果，一红一白，同枝双生。红果续命，白果夺命，可外观无别，须以盐水试之：浮者为生，沉者为死。药家说这是“一株两性”，草木也懂取舍。西漠有暗话叫“送白”，即把白果包了送人，是极阴的杀人法子。也有修士以两果同服，赌一线生机，十人中活一人，活下来的都说值。","引":"药家批语：同根而异命，天意也。"},{"类":"异兽","名":"守涎沙蟒","卷":2,"文":"盘踞于龙涎坑底的巨蟒，通体沙色，鳞片细如粉，不动时与沙无异，唯双目作黄。此蟒以龙涎为食，护涎如护子，凡近坑者必遭其撞。据沙门记载，此物寿可千年，每百年蜕一次皮，蜕皮之夜目盲而性躁。老走沙的人说，此蟒不食活人，只把人撞进沙里埋了，等沙把人化了再吃。","引":"《沙海异兽录》：沙不动，是蟒在睡。"},{"类":"秘闻","名":"死账","卷":2,"文":"西漠人的债不随人死而消。凡死者欠下的账，先由同行者分摊，无同行者则由柜台记入“死账”，挂在一块木牌上，牌上刻人名与数目，一挂数十年。金沙楼有一面墙专挂这种牌，老账房每日擦一遍。传闻死账满一百块，就会有人来找——不是讨钱，是讨一个说法。","引":"柜上旧话：人死账不死，账死人再死。"}],"事件":[{"id":"ximo_001","题":"一囊水的情面","类":"人情","重":5,"域":["ximo"],"境界":[0,5],"段":["断水驿的土屋里，{人物}把一只{器物}推到你面前。他说这是昨夜从{地点}逃出来的人丢下的，物主已死在半路，尸首还埋在驿外三十步的沙里。驿中水缸见了底，人人口唇干裂，没人去问那尸首埋得深不深。","{天象}。有人肯出三十块灵石买那皮囊里剩下的东西，说是要验一验缝线的针脚；也有人低声说该还给死人的家眷，免得夜里{妖异}顺着味儿找来。屋里的火堆没人添柴，风从门缝里钻进来，把灯焰吹得歪歪斜斜。","皮囊在你脚边摊着，缝口还系着一个谁也解不开的死结。{人物}看着你，等你替他把这笔糊涂账分清楚些。门外驼铃响了一声，又停了。"],"择":[{"名":"私开皮囊","文":"你抽出割驼的病刀挑断缝线。里头是半囊浑水、三枚火漆印，还有一本记着七条商道脚程的簿子。水当晚救了屋里七个人。第二日天没亮，流沙盗的哨子就找到了驿门口，问你这两枚印是从哪只罐子里倒出来的。","果":{"灵石":70,"修为":15,"因果":2,"魔念":1,"声望":-6}},{"名":"物归家眷","文":"你顶着日头把皮囊送到死人沟边的三户人家，丧事上没人哭得出声，只把囊中余水泼在坟前。临走时老人塞给你一小包沙枣和一句口信，说往后走这条道缺什么，报他儿子的名字便是。","果":{"声望":9,"因果":-2,"灵石":-15,"悟性":1}},{"名":"转手卖印","文":"你把皮囊整个卖给了黑市的掮客，价钱比那三十块高了两倍。他心里明白，你也明白，只是谁也没提那死人。回程时你总觉得骆驼的步子比来时沉，驼铃也哑了一声，好歹银子在袖子里是实的。","果":{"灵石":130,"道心":-1,"声望":-9,"因果":3}}]},{"id":"ximo_002","题":"赤足者的钵","类":"修行","重":4,"域":["ximo"],"境界":[0,4],"段":["往{地点}去的路上，你遇上一个赤足走沙的苦行僧。他脚底结着厚茧，踩在滚烫的沙上像踩自家门槛，手里只托一只{器物}。他说从枯骨寺出来已行了四十九日，日食一餐，餐是向人乞的。","你身上只剩三块干饼。他把钵伸过来，不看你，只看你身后的影子。你忽然想起{功法}里有句话，说得道的先要肯把最后一口也给出去。风卷着{天象}的预兆掠过，他的眉眼却纹丝不动。","他等你把东西放进钵里，也等你转身走开。{天象}，日头正毒，这一让一不让，往往就是一个人往后的路。"],"择":[{"名":"舍尽干饼","文":"你把三块干饼全倒进钵里，自己只剩一囊带盐味的水。他合十一礼，随口念了半段《无相乞食法》的口诀，你当时只觉荒诞，走出二里地才发觉腹中竟不十分饿，后来这一句救过你两回。","果":{"修为":60,"悟性":3,"道心":2,"灵石":-10,"气血":-5}},{"名":"分他一半","文":"你留了一块半给自己，剩下的给了僧人。他不谢，也不嫌少，只把饼掰成两半，一半塞回你手里，说走沙的人比和尚更需要嚼头。你与他同行半日，学会了如何在正午把步子放慢三成。","果":{"修为":30,"悟性":1,"声望":3,"灵石":-5}},{"名":"绕道避过","文":"你偏开脸绕了半里路，回头见他还站在原处。那条道后来你走了很多趟，再没见过他。只是每逢沙暴封路，你总记得那只伸过来的空钵，和它里头干干净净的影子。","果":{"灵石":15,"道心":-1,"因果":1}}]},{"id":"ximo_003","题":"脚底的记号","类":"灾祸","重":4,"域":["ximo"],"境界":[0,6],"段":["宿在{地点}的驼棚里，半夜你被脚心的刺痛惊醒。借着棚外微弱的天光，你看见脚底被人用刀尖划了三道短痕，血已凝住。{人物}蹲在棚门口抽旱烟，见你醒来，只把烟锅在门框上磕了磕。","三道痕是流沙盗的记号：一痕是货，二痕是命，三痕是两样都要。你想起白日里替人搬过一只{器物}，那人自称是替驼帮送货的，可他的靴底没有沙，只有泥。{祸患}这四个字，到此刻才落到自己身上。","{天象}，棚外传来一两声不知是狼是人的呼哨。{人物}说，记号划上了，要么连夜换道走三十里，要么等人来收。他没说第三种，可棚里每个人都想到了。"],"择":[{"名":"连夜换道","文":"你抓了一把沙揉进伤口，借着夜色往{地点}方向硬走了三十里，鞋底磨穿，脚背肿成馒头。天亮时听人说昨夜驼棚被围，死了两个人，抢走的货里有一箱正是你搬过的那只。你活了下来，却整月走不快。","果":{"气血":-20,"寿元":-3,"修为":20,"灵石":10}},{"名":"烧痕认账","文":"你把烧红的铁片按在脚底，将三道痕烙成一团疤，又请人把话递进流沙谷，说这双脚不认第二回记号。话传回来后，谷里回了八个字：刺得深，算是条汉子。从此过流沙谷，你的驼队不收买路钱。","果":{"气血":-25,"声望":12,"因果":-1,"魔念":1}},{"名":"供出货主","文":"你把那搬货的人告诉了{人物}，换了一夜安睡和半囊水。第二日那人被吊在枯树上，流沙盗说这是给驼帮的体面。你走的时候没敢抬头，可你知道自己再进不了那条商道了。","果":{"灵石":40,"声望":-12,"魔念":2,"因果":2,"道心":-1}}]}
