<html lang="zh-CN">

<title>赤霄洲 · 修仙界自动演化</title>
<script>
(function(){
  function lockLandscape(){
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape-primary').catch(function(){});
    }
    if(window.orientation !== undefined && window.orientation !== 90 && window.orientation !== -90){
      // not in landscape, try to force
    }
  }
  window.addEventListener('load', lockLandscape);
  window.addEventListener('orientationchange', lockLandscape);
  window.addEventListener('resize', lockLandscape);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) lockLandscape();
  });
})();
</script>



<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="赤霄洲 · 全自动演化的 2D 俯视修仙世界，可提笔改天">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e9dfcb;
  color: var(--ink);
  font-family: var(--sans);
  touch-action: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  height: 100dvh;
}

/* 双画布绝对定位，不参与文档流 */
#terrain {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  transform-origin: 0 0;
  pointer-events: none;
  will-change: transform;
}
#world {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  touch-action: none;
  cursor: grab;
}

/* Top bar - vertical on left */
#topbar {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 4px;
  background: linear-gradient(90deg, rgba(242,235,219,.96), rgba(242,235,219,.78) 70%, rgba(242,235,219,0));
  z-index: 20;
  pointer-events: none;
}

#topbar > * { pointer-events: auto; }

.era { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; flex: 0 0 auto; }
.era-name { font-family: var(--serif); font-size: 9px; letter-spacing: .18em; color: var(--ink-3); white-space: nowrap; transform: rotate(-90deg); transform-origin: center; }
.date { font-family: var(--serif); font-size: 11px; color: var(--ink); white-space: nowrap; }

.spd { display: flex; flex-direction: column; gap: 3px; margin: 8px 0 0; flex: 0 0 auto; }
.spd button { font-family: var(--serif); font-size: 10px; min-width: 26px; height: 24px; padding: 0 3px; border-radius: 3px; border: 1px solid var(--line); background: rgba(255,252,244,.6); color: var(--ink-2); cursor: pointer; transition: .15s; }
.spd button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.spd button:active { transform: scale(.94); }

.seal-btn { font-family: var(--serif); font-size: 11px; min-height: 28px; padding: 0 6px; border-radius: 3px; cursor: pointer; border: 1px solid rgba(176,69,60,.55); color: var(--cinnabar); background: rgba(176,69,60,.07); letter-spacing: .06em; transition: .15s; white-space: nowrap; flex: 0 0 auto; }
.seal-btn:active { transform: scale(.95); }
.seal-btn.on { background: var(--cinnabar); color: #fff8ee; box-shadow: 0 0 0 3px rgba(176,69,60,.18); }

/* Player card - top right */
#pcard {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 220px;
  z-index: 15;
  background: rgba(247,241,229,.93);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 11px 10px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: .2s;
}
#pcard:active { transform: scale(.985); }
#pcard .nm { display: flex; align-items: baseline; gap: 6px; }
#pcard .nm b { font-family: var(--serif); font-size: 15px; font-weight: 600; }
#pcard .nm span { font-size: 10px; color: var(--ink-3); }
#pcard .sub { font-size: 10.5px; color: var(--ink-2); margin-top: 2px; letter-spacing: .03em; }
#pcard .bar { height: 3px; background: rgba(80,70,52,.12); border-radius: 2px; margin-top: 7px; overflow: hidden; }
#pcard .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--jade), #7fa08c); width: 0; transition: width .4s; }
#pcard .row { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); margin-top: 4px; }
#pcard .spark { margin-top: 6px; height: 20px; width: 100%; display: block; opacity: .7; }

/* Side panel - right side */
#side {
  position: absolute;
  right: 4px;
  top: 158px;
  bottom: calc(var(--dockh, 40vh) + 10px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  z-index: 15;
  pointer-events: none;
  overflow: visible;
}
#side .sbtn { pointer-events: auto; flex: 0 0 auto; }
.sbtn {
  width: 34px;
  height: 34px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: rgba(247,241,229,.92);
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(60,48,30,.10);
  writing-mode: vertical-rl;
  letter-spacing: .1em;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.sbtn:active { transform: scale(.94); }
.sbtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Dock - bottom */
#dock {
  position: absolute;
  left: 54px;
  right: 0;
  bottom: 0;
  z-index: 18;
  background: rgba(240,232,215,.985);
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 20px rgba(60,48,30,.10);
  padding-bottom: var(--safe-b);
  max-height: 50vh;
  display: flex;
  flex-direction: column;
  transition: max-height .28s cubic-bezier(.3,.9,.3,1);
}
#dock.folded { max-height: 36px; }
#dock.folded .dockbody { display: none; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 6px 8px 4px; flex: 0 0 auto; position: relative; z-index: 3; border-bottom: 1px solid var(--line-2); }
.tab { font-family: var(--serif); font-size: 12px; padding: 4px 12px; border-radius: 3px; cursor: pointer; border: none; background: transparent; color: var(--ink-3); letter-spacing: .08em; }
.tab.on { background: rgba(80,70,52,.09); color: var(--ink); }
#tab-fold { margin-left: auto; font-size: 13px; padding: 2px 10px; color: var(--ink-3); }
.dockbody { flex: 1 1 auto; overflow-y: auto; padding: 2px 12px 12px; -webkit-overflow-scrolling: touch; }
.dockbody::-webkit-scrollbar { width: 3px; }
.dockbody::-webkit-scrollbar-thumb { background: rgba(80,70,52,.2); border-radius: 2px; }

/* Log entries */
.entry { padding: 7px 0; border-bottom: 1px dashed var(--line-2); animation: fadein .4s; }
.entry:last-child { border-bottom: none; }
.entry .hd { display: flex; gap: 7px; align-items: baseline; margin-bottom: 2px; }
.entry .tag { font-family: var(--serif); font-size: 10px; color: var(--cinnabar); border: 1px solid rgba(176,69,60,.3); border-radius: 2px; padding: 0 4px; flex: 0 0 auto; }
.entry .tag.g { color: var(--jade); border-color: rgba(93,125,108,.35); }
.entry .tag.k { color: var(--ink-3); border-color: var(--line); }
.entry .tm { font-size: 9.5px; color: var(--ink-3); margin-left: auto; flex: 0 0 auto; }
.entry .tx { font-family: var(--serif); font-size: 12.5px; line-height: 1.72; color: var(--ink-2); white-space: pre-wrap; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Chronicle */
.chr { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.chr .yr { font-family: var(--serif); font-size: 9.5px; color: var(--ink-3); flex: 0 0 74px; padding-top: 2px; }
.chr .bd { flex: 1 1 auto; }
.chr .cl { font-family: var(--serif); font-size: 9.5px; color: var(--gold); letter-spacing: .1em; }
.chr .tx { font-family: var(--serif); font-size: 12px; line-height: 1.66; color: var(--ink-2); }
.chr.imp .tx { color: var(--ink); }
.chr.imp .cl { color: var(--cinnabar); }

/* World */
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.wcard { border: 1px solid var(--line-2); border-radius: 3px; padding: 7px 9px; background: rgba(255,252,244,.5); cursor: pointer; transition: .15s; }
.wcard:active { transform: scale(.98); }
.wcard .rn { font-family: var(--serif); font-size: 12.5px; display: flex; justify-content: space-between; align-items: baseline; }
.wcard .rn em { font-style: normal; font-size: 9.5px; color: var(--ink-3); }
.wcard .mt { display: flex; gap: 8px; font-size: 9.5px; color: var(--ink-3); margin-top: 3px; }
.wcard .mini { height: 2px; background: rgba(80,70,52,.1); margin-top: 5px; border-radius: 1px; overflow: hidden; }
.wcard .mini i { display: block; height: 100%; background: var(--jade); }
.statline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-3); padding: 4px 0 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 8px; }
.statline b { color: var(--ink); font-family: var(--serif); font-weight: 600; }

/* Modal */
#modal-root { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.mask { position: absolute; inset: 0; background: rgba(48,40,28,.42); backdrop-filter: blur(2px); pointer-events: auto; animation: fadein .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: min(88vh, calc(100dvh - 16px)); pointer-events: auto; background: var(--paper); border-radius: 12px 12px 0 0; box-shadow: 0 -8px 32px rgba(50,40,25,.25); display: flex; flex-direction: column; overflow: hidden; animation: slideup .28s cubic-bezier(.25,.9,.3,1); padding-bottom: var(--safe-b); }
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.sheet .hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line-2); flex: 0 0 auto; }
.sheet .hd h2 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .06em; }
.sheet .hd .x { margin-left: auto; width: 28px; height: 28px; border: none; background: transparent; font-size: 18px; color: var(--ink-3); cursor: pointer; line-height: 1; }
.sheet .bd { overflow-y: auto; padding: 12px 16px 22px; flex: 1 1 auto; min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-footer { flex: 0 0 auto; padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line-2); background: var(--paper); }
.sheet-footer .btnrow { margin-top: 0; }
.sheet .bd::-webkit-scrollbar { width: 3px; }
.sheet .bd::-webkit-scrollbar-thumb { background: rgba(80,70,52,.2); border-radius: 2px; }

/* Details */
.dt-title { font-family: var(--serif); font-size: 18px; display: flex; align-items: baseline; gap: 8px; }
.dt-title em { font-style: normal; font-size: 11px; color: var(--ink-3); letter-spacing: .1em; }
.dt-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.chip { font-size: 10px; padding: 2px 7px; border-radius: 2px; background: rgba(80,70,52,.07); color: var(--ink-2); border: 1px solid var(--line-2); }
.chip.r { color: var(--cinnabar); background: rgba(176,69,60,.07); border-color: rgba(176,69,60,.25); }
.chip.g { color: var(--jade); background: rgba(93,125,108,.08); border-color: rgba(93,125,108,.25); }
.dt-p { font-family: var(--serif); font-size: 13px; line-height: 1.8; color: var(--ink-2); white-space: pre-wrap; margin: 0 0 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill,minmax(96px,1fr)); gap: 6px 10px; margin: 10px 0; }
.kv div { font-size: 10.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 1px; }
.kv b { font-family: var(--serif); font-size: 13px; color: var(--ink); font-weight: 600; }
.bars { margin: 10px 0; }
.bars .b { margin-bottom: 7px; }
.bars .b .lb { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); margin-bottom: 3px; }
.bars .b .tr { height: 4px; background: rgba(80,70,52,.1); border-radius: 2px; overflow: hidden; }
.bars .b .tr i { display: block; height: 100%; border-radius: 2px; transition: width .4s; }
.sect-line { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line-2); font-size: 11.5px; align-items: baseline; }
.sect-line b { font-family: var(--serif); font-size: 12.5px; }
.sect-line em { font-style: normal; font-size: 9.5px; color: var(--ink-3); margin-left: auto; }
.sect-line.clickable { cursor: pointer; }
.sect-line.clickable:active { opacity: .6; }

/* Codex */
.cx-cats { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.cx-cat { font-size: 10.5px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); cursor: pointer; }
.cx-cat.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cx-item { padding: 8px 0; border-bottom: 1px dashed var(--line-2); cursor: pointer; }
.cx-item .t { font-family: var(--serif); font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
.cx-item .t em { font-style: normal; font-size: 9.5px; color: var(--cinnabar); }
.cx-item .s { font-size: 11px; color: var(--ink-3); line-height: 1.6; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Beings */
.being-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dashed var(--line-2); cursor: pointer; }
.being-row .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.being-row .nm { font-family: var(--serif); font-size: 12.5px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.being-row .rl { font-size: 9.5px; color: var(--ink-3); flex: 0 0 auto; }
.being-row.dead { opacity: .42; }

/* Toast */
#toast { position: absolute; left: 50%; bottom: calc(var(--dockh, 380px) + 14px); transform: translateX(-50%) translateY(8px); background: rgba(50,42,30,.9); color: #f6efe0; font-size: 12px; padding: 8px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: .28s; z-index: 80; max-width: min(78vw,420px); text-align: center; font-family: var(--serif); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast { max-width: min(78vw,420px); }

.hint { position: absolute; left: 50%; bottom: calc(50vh + 14px); transform: translateX(-50%); font-size: 10px; color: var(--ink-3); background: rgba(247,241,229,.8); padding: 3px 10px; border-radius: 10px; z-index: 14; pointer-events: none; transition: opacity .6s; white-space: nowrap; }
.hint.hide { opacity: 0; }

/* Cheat */
.cheat .hd h2 { color: var(--cinnabar); }
.cheat .bd { padding-bottom: 34px; }
.cg-note { font-family: var(--serif); font-size: 11px; line-height: 1.7; color: var(--ink-3); border-left: 2px solid rgba(176,69,60,.4); padding: 2px 0 2px 9px; margin-bottom: 12px; }
.cg-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line-2); scrollbar-width: none; }
.cg-tabs::-webkit-scrollbar { display: none; }
.cg-tab { flex: 0 0 auto; font-family: var(--serif); font-size: 11.5px; padding: 4px 11px; border-radius: 3px; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--ink-3); white-space: nowrap; }
.cg-tab.on { background: rgba(176,69,60,.1); color: var(--cinnabar); border-color: rgba(176,69,60,.28); }
.cg-sec { display: none; }
.cg-sec.on { display: block; }
.cg-group { margin-bottom: 14px; border: 1px solid var(--line-2); border-radius: 4px; padding: 9px 11px; background: rgba(255,252,244,.4); }
.cg-group > h3 { font-family: var(--serif); font-size: 12px; margin: 0 0 8px; color: var(--ink-2); letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
.cg-group > h3::before { content: ""; width: 3px; height: 11px; background: var(--cinnabar); border-radius: 1px; }
.fld { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.fld label { font-size: 11px; color: var(--ink-3); flex: 0 0 72px; text-align: right; }
.fld .inp { flex: 1 1 auto; display: flex; gap: 5px; min-width: 0; }
.fld input[type=text], .fld input[type=number], .fld select, .fld textarea { flex: 1 1 auto; min-width: 0; font-family: var(--sans); font-size: 12px; color: var(--ink); background: rgba(255,255,255,.65); border: 1px solid var(--line); border-radius: 3px; padding: 5px 7px; outline: none; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: rgba(176,69,60,.5); background: #fffdf8; }
.fld textarea { resize: vertical; min-height: 44px; line-height: 1.5; }
.fld input[type=range] { flex: 1 1 auto; accent-color: var(--cinnabar); min-width: 0; }
.fld .val { font-family: var(--serif); font-size: 11px; color: var(--cinnabar); flex: 0 0 46px; text-align: right; }
.btn { font-family: var(--serif); font-size: 11.5px; padding: 6px 12px; border-radius: 3px; cursor: pointer; border: 1px solid var(--line); background: rgba(255,252,244,.8); color: var(--ink-2); transition: .15s; white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn.p { background: var(--cinnabar); color: #fff8ee; border-color: var(--cinnabar); }
.btn.k { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.g { background: rgba(93,125,108,.14); color: var(--jade); border-color: rgba(93,125,108,.35); }
.btn.d { background: rgba(176,69,60,.07); color: var(--cinnabar); border-color: rgba(176,69,60,.3); }
.btn.sm { padding: 3px 9px; font-size: 10.5px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sw { position: relative; width: 38px; height: 21px; flex: 0 0 auto; cursor: pointer; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw i { position: absolute; inset: 0; background: rgba(80,70,52,.18); border-radius: 11px; transition: .2s; }
.sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw input:checked + i { background: var(--cinnabar); }
.sw input:checked + i::after { transform: translateX(17px); }
.cg-list { max-height: 210px; overflow-y: auto; border: 1px solid var(--line-2); border-radius: 3px; background: rgba(255,255,255,.35); }
.cg-li { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: 11.5px; }
.cg-li:last-child { border-bottom: none; }
.cg-li:hover { background: rgba(176,69,60,.05); }
.cg-li.on { background: rgba(176,69,60,.09); }
.cg-li b { font-family: var(--serif); font-weight: 600; font-size: 12px; }
.cg-li em { font-style: normal; font-size: 9.5px; color: var(--ink-3); margin-left: auto; flex: 0 0 auto; }
.cg-hint { font-size: 10px; color: var(--ink-3); margin: 5px 0 0; line-height: 1.5; }
.cg-divider { height: 1px; background: var(--line-2); margin: 12px 0; }
.cg-warn { font-size: 10px; color: var(--cinnabar); font-family: var(--serif); margin-top: 6px; }

/* Settings */
.set-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--line-2); }
.set-row:last-child { border-bottom: none; }
.set-row .tt { flex: 1 1 auto; min-width: 0; }
.set-row .tt b { display: block; font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--ink); }
.set-row .tt span { display: block; font-size: 10.5px; line-height: 1.55; color: var(--ink-3); margin-top: 2px; }
.set-state { font-size: 10.5px; font-family: var(--serif); padding: 2px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--ink-3); flex: 0 0 auto; }
.set-state.on { color: var(--jade); border-color: rgba(93,125,108,.35); background: rgba(93,125,108,.08); }
.set-state.off { color: var(--ink-3); }
.set-state.bad { color: var(--cinnabar); border-color: rgba(176,69,60,.3); background: rgba(176,69,60,.06); }

/* Desktop/Tablet adjustments */
@media (min-width: 760px) {
  #pcard { width: 224px; top: 58px; left: 14px; }
  #side { right: 14px; top: 58px; }
  #dock { max-height: 34vh; }
  .dockbody { max-width: 940px; margin: 0 auto; width: 100%; padding-left: 20px; padding-right: 20px; }
  .tabs { max-width: 940px; margin: 0 auto; width: 100%; padding-left: 20px; padding-right: 20px; }
  .entry .tx { font-size: 13.5px; line-height: 1.8; }
  .chr .tx { font-size: 13px; line-height: 1.75; }
  .chr .yr { flex-basis: 120px; }
  .wgrid { grid-template-columns: repeat(3, 1fr); }
  .hint { bottom: calc(34vh + 14px); }
  #topbar { padding: 0 16px; }
  .seal-btn { height: 32px; padding: 0 14px; }
}
@media (min-width: 1180px) {
  #dock { max-height: 32vh; }
  .hint { bottom: calc(32vh + 14px); }
  #pcard { width: 246px; }

<script>
(function(){
  function forceLandscape(){
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape-primary').catch(function(){});
    }
  }
  window.addEventListener('load', forceLandscape);
  window.addEventListener('orientationchange', forceLandscape);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) forceLandscape();
  });
})();
</script>

<script>
window.GAME_DATA={"world":{"版本":1,"纪年":{"开界":-12000,"今":-312,"纪元名":"天倾纪","说明":"自太虚崩碎、九州陆沉至今，已历三千二百余年。"},"洲名":"赤霄洲","区域":[{"id":"qinglan","名":"青岚域","方位":"东荒","灵机":1.0,"凶险":1,"地貌":"丘陵与竹海","特产":["青岚灵茶","三百年份的紫芝","溪底寒铁"],"异象":["夜半竹涛如诵经","山雨之后常有虹霓横跨七十二峰"],"宗门":["青云宗","落雁谷","黑水堂"],"描述":"东荒边陲之地，灵脉细碎却绵长，最宜炼气、筑基之辈扎根。域内散修如草，宗门如林，年年有人叩仙门，也年年有人埋骨乱葬岗。"},{"id":"yunmeng","名":"云梦泽","方位":"南泽","灵机":1.15,"凶险":3,"地貌":"大泽与雾岛","特产":["九节菖蒲","泽心莲","迷雾蚌珠"],"异象":["大雾封泽三月不散","月圆之夜水底有钟声"],"宗门":["水月宫","沧浪剑派"],"描述":"八百里云梦，雾锁重楼。泽中有岛，岛上有宫，宫中人以水为镜、以月为心，历来不问世事，却也从不吃亏。"},{"id":"luoxia","名":"落霞山脉","方位":"西岭","灵机":1.3,"凶险":4,"地貌":"赤岩与断崖","特产":["赤髓砂","千年火枣","落霞石"],"异象":["每到申时，满山赤霞如血","雷雨时山脊上有电蛇盘行"],"宗门":["赤霄剑宗","丹霞观","百炼山"],"描述":"传说上古有金乌坠于此地，血染万山，故此山土石皆赤。山中灵材极盛，剑修、器修、丹修争斗不休。"},{"id":"beiming","名":"北冥雪原","方位":"北疆","灵机":1.1,"凶险":5,"地貌":"冻原与冰渊","特产":["万年玄冰","雪魄花","寒髓"],"异象":["极光夜夜垂落如帘","冰渊之下有巨影游弋"],"宗门":["玄冥殿","寒山寺","冰原猎盟"],"描述":"朔风终年不息，白雪覆地三尺。北冥之下沉睡着上古凶兽，也沉睡着无数求道者的尸骨。"},{"id":"nanjiang","名":"南疆蛊林","方位":"南荒","灵机":1.25,"凶险":5,"地貌":"雨林与毒沼","特产":["金线蛊虫","尸香魔芋","千足藤"],"异象":["林间夜歌不知出自何人","雨季之后遍地生出荧光菌毯"],"宗门":["万蛊门","巫祝祖庭","青木谷"],"描述":"蛮荒雨林，瘴气终年不散。此地修行不重境界而重养蛊，一门蛊术可抵半部功法，也常令施术者死得比蛊虫更早。"},{"id":"ximo","名":"西漠","方位":"西域","灵机":0.8,"凶险":4,"地貌":"沙海与绿洲","特产":["星尘沙","沙海龙涎","日曜晶"],"异象":["沙暴之后沙丘排列如古阵","夜半沙下有金石相击之声"],"宗门":["金沙楼","苦行沙门","流沙盗"],"描述":"黄沙万里，商道如线。西漠的规矩只有一条：不要相信沙漠里遇见的第二个人。"},{"id":"zhongzhou","名":"中州","方位":"中央","灵机":1.7,"凶险":3,"地貌":"平原与王城","特产":["龙脉土","万宝阁的货","御供灵米"],"异象":["王城上空终年盘着一条气运金龙","九门钟鼓声可传出百里"],"宗门":["太虚道宗","大衍皇朝","万宝阁","天机楼"],"描述":"九州腹心，灵脉交汇。皇朝、道宗、商盟三足鼎立，一纸法旨可定一域生死，一场道会可让万修云集。"},{"id":"tianjian","名":"天剑域","方位":"东南","灵机":1.45,"凶险":4,"地貌":"万仞剑峰","特产":["剑心草","星陨铁","崖顶雷竹"],"异象":["晴日有剑鸣自云中传来","暴雨时万峰如剑出鞘"],"宗门":["万剑冢","藏锋阁"],"描述":"天下剑修心中的圣地。万剑冢葬剑亦葬人，剑意终年不散，据说每一柄插在崖上的残剑都还记得主人最后一战。"},{"id":"penglai","名":"蓬莱海域","方位":"东海","灵机":1.55,"凶险":5,"地貌":"群岛与鲸波","特产":["鲛人泪","海心珊瑚","蓬莱仙枣"],"异象":["海市蜃楼中可见仙宫","潮起时岛礁如呼吸般起伏"],"宗门":["蓬莱阁","鲛人王庭"],"描述":"海外仙山，雾中楼阁。世人皆言蓬莱有长生法，却少有人提那些出海未归的船。"},{"id":"youming","名":"幽冥鬼域","方位":"极西","灵机":1.2,"凶险":6,"地貌":"冥河与枯骨原","特产":["幽冥引魂香","千年阴芝","鬼面藤"],"异象":["白日无影，夜里鬼火成街","冥河涨潮时能听见故人唤名"],"宗门":["酆都鬼市","白骨道场"],"描述":"阴阳交界之地，生者慎入。鬼修在此如鱼得水，活人在此寸步难行，可偏偏最珍贵的续命之物，都长在冥河岸边。"},{"id":"taixu","名":"太虚星台","方位":"天外","灵机":2.0,"凶险":7,"地貌":"浮空残台与星轨","特产":["星辰砂","太虚残简","周天星核"],"异象":["残台上可闻远古道音","星轨错位之夜有仙人虚影掠过"],"宗门":["星枢阁","观天监"],"描述":"上古太虚宫崩碎后的残骸，浮于九天之上。能登台者万中无一，能活着下来的更是寥寥。"},{"id":"guixu","名":"归墟","方位":"绝地","灵机":2.4,"凶险":9,"地貌":"无光深渊","特产":["归墟黑水","寂灭之花","道则碎片"],"异象":["万物入之无声，连光都被吞没","偶有上古道音自深渊上浮"],"宗门":["无"],"描述":"万水所归，万道所终。传说大乘以上者若想飞升，必先入归墟一行；而入者十死无生，归者不见其形。"}],"宗门":[{"id":"qingyun","名":"青云宗","驻地":"青岚域·青云山","类型":"正道","势力":6,"道统":"剑、符并重","脾性":"守序","描述":"东荒第一大宗，山门十二峰，弟子三万。宗规森严，最重根骨与出身，却也是散修唯一能凭战功叩开的大宗门。"},{"id":"luoyan","名":"落雁谷","驻地":"青岚域·落雁峡","类型":"中立","势力":4,"道统":"阵法与情报","脾性":"圆滑","描述":"以阵法和消息起家，谷中弟子人人会布阵、人人会做买卖。号称东荒没有落雁谷不知道的事。"},{"id":"heishui","名":"黑水堂","驻地":"青岚域·黑水潭","类型":"魔道","势力":3,"道统":"血法与炼尸","脾性":"狠戾","描述":"盘踞黑水潭的魔道小宗，以血养功、以尸炼傀。宗门上下皆被正道通缉，却总也剿不干净。"},{"id":"shuiyue","名":"水月宫","驻地":"云梦泽·镜心岛","类型":"正道","势力":6,"道统":"水法与幻术","脾性":"清冷","描述":"宫中皆为女修，以月华为引、以水镜为法。宫规不许男修登岛，违者沉泽。"},{"id":"canglang","名":"沧浪剑派","驻地":"云梦泽·听涛崖","类型":"中立","势力":5,"道统":"剑道","脾性":"孤傲","描述":"剑派传承自上古沧浪剑仙，一脉单传式微，如今只剩崖上三百柄无名剑与三十名弟子。"},{"id":"chixiao","名":"赤霄剑宗","驻地":"落霞山脉·赤霄峰","类型":"正道","势力":7,"道统":"剑道、火法","脾性":"刚烈","描述":"天下剑修三大宗之一，剑出必见血。宗主为一柄断剑所困三百年，宗门却在其剑意庇护下愈发鼎盛。"},{"id":"danxia","名":"丹霞观","驻地":"落霞山脉·丹霞洞天","类型":"中立","势力":5,"道统":"丹道","脾性":"市侩","描述":"观中丹炉三百座，丹药销往九州。观主名言：丹可救人，亦可杀人，全看买主出多少灵石。"},{"id":"bailian","名":"百炼山","驻地":"落霞山脉·百炼炉","类型":"中立","势力":5,"道统":"器道","脾性":"固执","描述":"山中炉火三百年不熄，器修一锤一凿皆是道。百炼山出品，九州修士争抢。"},{"id":"xuanming","名":"玄冥殿","驻地":"北冥雪原·玄冥宫","类型":"中立","势力":6,"道统":"体修与寒法","脾性":"沉默","描述":"殿中弟子以肉身抗寒、以寒髓淬骨，个个沉默寡言。据说殿主曾在冰渊中坐了三百年。"},{"id":"hanshan","名":"寒山寺","驻地":"北冥雪原·寒山","类型":"正道","势力":5,"道统":"佛门","脾性":"慈悲","描述":"雪原上唯一的佛门道场，寺中僧人修闭口禅、行苦修法，却常为过路散修施粥赠药。"},{"id":"wangu","名":"万蛊门","驻地":"南疆蛊林·万蛊窟","类型":"魔道","势力":6,"道统":"蛊道、毒术","脾性":"诡谲","描述":"门中人以身为蛊皿，养千虫于血肉。入门第一课便是选一只本命蛊，从此生死与共。"},{"id":"wuzhu","名":"巫祝祖庭","驻地":"南疆蛊林·祖灵谷","类型":"中立","势力":5,"道统":"巫道、祭祀","脾性":"神秘","描述":"南疆最古老的传承，以血脉祭祀山川祖灵。祖庭不问外界纷争，但若有人擅入祖灵谷，必遭万蛊噬心。"},{"id":"qingmu","名":"青木谷","驻地":"南疆蛊林·青木涧","类型":"正道","势力":4,"道统":"木法与医道","脾性":"仁善","描述":"谷中弟子以草木为药、以灵植为阵，是九州少有的能解蛊毒的地方。"},{"id":"jinsha","名":"金沙楼","驻地":"西漠·沙海绿洲","类型":"中立","势力":5,"道统":"商道、暗道","脾性":"逐利","描述":"沙海中的商盟，楼中货架连通九州。金沙楼只认灵石不认人，但对老主顾讲信义。"},{"id":"kuxing","名":"苦行沙门","驻地":"西漠·枯骨寺","类型":"正道","势力":4,"道统":"佛门苦修","脾性":"坚忍","描述":"沙门弟子赤足行沙海、日食一餐，以极苦磨心。传说枯骨寺下埋着一位即将圆满的菩萨。"},{"id":"liusha","名":"流沙盗","驻地":"西漠·流沙谷","类型":"魔道","势力":3,"道统":"刀法、陷阱","脾性":"凶悍","描述":"沙海马匪，专劫商队。盗首据说曾是金沙楼的账房，最清楚哪条商道油水最厚。"},{"id":"taixu","名":"太虚道宗","驻地":"中州·太虚山","类型":"正道","势力":9,"道统":"道法、雷法","脾性":"威严","描述":"九州第一道宗，掌天机、执雷罚。宗中元婴如云，化神坐镇。道宗旨意所至，皇朝亦要退让三分。"},{"id":"dayan","名":"大衍皇朝","驻地":"中州·大衍城","类型":"皇权","势力":8,"道统":"气运、军阵","脾性":"霸道","描述":"以一国气运供养皇室修士。皇朝不重个人修为，重的是万民、疆土与龙脉，一纸诏书可征十万修士。"},{"id":"wanbao","名":"万宝阁","驻地":"中州·万宝城","类型":"商盟","势力":7,"道统":"商道、鉴宝","脾性":"中立","描述":"九州最大的商盟，分号遍布各域。万宝阁有三不卖：不卖国运，不卖寿数，不卖归墟之路。"},{"id":"tianji","名":"天机楼","驻地":"中州·天机阁","类型":"中立","势力":6,"道统":"推演、卜算","脾性":"莫测","描述":"楼中只做三件事：卖消息、算命数、记史。天机楼记下的史册，比皇朝史官的更可信。"},{"id":"wanjian","名":"万剑冢","驻地":"天剑域·剑冢","类型":"中立","势力":8,"道统":"剑道","脾性":"孤高","描述":"万剑插崖，剑意成海。冢中无主，唯有剑择人。得剑者入冢修行，失剑者葬身剑海。"},{"id":"cangfeng","名":"藏锋阁","驻地":"天剑域·藏锋崖","类型":"中立","势力":6,"道统":"剑道、器道","脾性":"低调","描述":"以铸剑与养剑闻名，阁中藏剑十万。阁主一生只出过三剑，每一剑都改写了一域格局。"},{"id":"penglai","名":"蓬莱阁","驻地":"蓬莱海域·浮仙岛","类型":"正道","势力":8,"道统":"水法、丹道","脾性":"超然","描述":"海外仙门，据说阁中藏有半卷飞升法。蓬莱阁招收弟子只看缘法，不看根骨，外界因此更加趋之若鹜。"},{"id":"jiaoren","名":"鲛人王庭","驻地":"蓬莱海域·鲛渊","类型":"异族","势力":6,"道统":"音律、水法","脾性":"骄傲","描述":"深海鲛人立国，以歌声为兵器。王庭与蓬莱阁有旧约：人不上鲛渊，鲛不出深海。"},{"id":"fengdu","名":"酆都鬼市","驻地":"幽冥鬼域·鬼门关","类型":"中立","势力":6,"道统":"鬼道、幽冥法","脾性":"诡秘","描述":"阴阳交界的集市，纸钱、寿数、残魂皆可交易。鬼市有三条规矩：不问来路，不谈价钱，不留活人过夜。"},{"id":"baigu","名":"白骨道场","驻地":"幽冥鬼域·白骨原","类型":"魔道","势力":5,"道统":"尸道、骨法","脾性":"阴冷","描述":"以白骨为林、以尸气为雾的道场。道场主事者据说已死过三次，每次归来都更强。"},{"id":"xingshu","名":"星枢阁","驻地":"太虚星台·枢星台","类型":"中立","势力":7,"道统":"星象、推演","脾性":"清高","描述":"观星测运，据说阁中人能看见一个人的死期。星枢阁不与凡人交易，只与能登台者论道。"},{"id":"guantian","名":"观天监","驻地":"太虚星台·监天台","类型":"正道","势力":6,"道统":"雷法与天象","脾性":"严谨","描述":"替天行雷、监看九州气运。观天监的雷罚落下时，从不问对方是谁。"},{"id":"sanxiu","名":"散修盟","驻地":"各域流动","类型":"中立","势力":3,"道统":"杂学","脾性":"松散","描述":"无门无派的散修结成的松散联盟，出了事一哄而散，分宝时一拥而上，却是散修唯一能抱团取暖的地方。"},{"id":"tianya","名":"天涯阁","驻地":"各域流动","类型":"中立","势力":4,"道统":"情报、刺客","脾性":"冷血","描述":"接单杀人的地方。天涯阁的价目表按境界标价，唯一不接的单子是杀天机楼楼主。"}],"境界":[{"名":"炼气","层名":["一层","二层","三层","四层","五层","六层","七层","八层","九层"],"寿元加成":20,"战力基数":10,"突破劫":"无","描述":"引气入体，淬炼经脉。此境修士已能御物、辟谷，在凡人眼中已是仙师。"},{"名":"筑基","层名":["初期","中期","后期","圆满"],"寿元加成":60,"战力基数":60,"突破劫":"心魔劫","描述":"筑就道基，寿元大增。道基之品级，决定了此后一生能走多远。"},{"名":"金丹","层名":["初期","中期","后期","圆满"],"寿元加成":180,"战力基数":300,"突破劫":"丹火劫","描述":"结丹成道，金丹一成，便算真正踏入长生之门。金丹品相分九等，紫金丹为上。"},{"名":"元婴","层名":["初期","中期","后期","圆满"],"寿元加成":400,"战力基数":1200,"突破劫":"婴变劫","描述":"元婴出窍，神游千里。此境修士已可开宗立派，一域之内皆要称一声老祖。"},{"名":"化神","层名":["初期","中期","后期","圆满"],"寿元加成":800,"战力基数":5000,"突破劫":"神劫","描述":"神念化域，言出法随。化神修士的心思，凡人连揣摩的资格都没有。"},{"名":"炼虚","层名":["初期","中期","后期","圆满"],"寿元加成":1500,"战力基数":20000,"突破劫":"虚空劫","描述":"炼虚合道，一身神通已近于道则。此境修士动辄闭关百年，出关便是风云变色。"},{"名":"合体","层名":["初期","中期","后期","圆满"],"寿元加成":3000,"战力基数":80000,"突破劫":"雷劫","描述":"法身与天地相合，举手投足皆引动一方灵机。合体老祖一怒，可令一域三年无雨。"},{"名":"大乘","层名":["初期","中期","后期","圆满"],"寿元加成":6000,"战力基数":300000,"突破劫":"九重雷劫","描述":"大乘之境，只差一步便可飞升。可这一步，古往今来困死了九成九的天骄。"},{"名":"渡劫","层名":["初期","中期","后期","圆满"],"寿元加成":12000,"战力基数":1000000,"突破劫":"飞升劫","描述":"渡劫者，已是在与天争命。每一道劫雷落下，都是在问一句：你凭什么。"},{"名":"地仙","层名":["初期","中期","后期","圆满"],"寿元加成":24000,"战力基数":3000000,"突破劫":"地火劫","描述":"陆地神仙，不受凡俗气运所缚，却也再难回头看一眼人间。"},{"名":"天仙","层名":["初期","中期","后期","圆满"],"寿元加成":50000,"战力基数":10000000,"突破劫":"天罚劫","描述":"天仙之姿，已可在九天之上开府。九州容不下此等存在，故天仙多隐于天外。"},{"名":"金仙","层名":["初期","中期","后期","圆满"],"寿元加成":100000,"战力基数":30000000,"突破劫":"道则劫","描述":"金性不朽，万劫不磨。金仙之体，纵使天地倾覆，亦能留一线真灵。"},{"名":"太乙","层名":["初期","中期","后期","圆满"],"寿元加成":200000,"战力基数":100000000,"突破劫":"太乙劫","描述":"太乙者，已窥天数。一念可算百世，一动可移星辰。"},{"名":"大罗","层名":["初期","中期","后期","圆满"],"寿元加成":500000,"战力基数":300000000,"突破劫":"大罗劫","描述":"大罗之上，再无境界。此境修士已超脱九州，不入轮回，不落因果。"}]},"paths":{"路径":[{"id":"jian","名":"剑修","别名":"御剑者·一剑破万法","色":"#8fb3c9","字":"锐","要义":"以剑为道，以心御剑。万物皆可为剑，剑修所求不是杀伐，而是那一线斩断因果的锋。","本命":"本命飞剑","副作用":"剑心易折，一旦道心动摇，飞剑先叛主","主修":"剑道","副修":"身法","属性":{"攻":1.5,"守":0.9,"速":1.4,"玄":0.8,"运":0.9,"功":1.0},"阶段":["御剑术","剑气护体","剑心通明","万剑归宗"],"征":"战力高、突破率偏低，需以杀证道","文":"剑修自古是九州最锋利的道。他们入门先立剑心，再寻一柄能与心相合的剑，此后人剑同修、同生共死。剑修的战力往往高出同境半筹，可剑心一碎，轻则跌落境界，重则被本命剑反噬，尸骨无存。天下剑修半出天剑域，余下的，多半死在去天剑域的路上。"},{"id":"dan","名":"丹修","别名":"丹鼎客·以药续命","色":"#c98f5a","字":"和","要义":"以草木金石为骨，以炉火为魂。丹修不与人争锋，却掌握着所有人最想要的东西——多活几年。","本命":"本命丹炉","副作用":"炉火反噬，丹毒积于经脉，久则药人","主修":"丹道","副修":"医道","属性":{"攻":0.7,"守":1.0,"速":0.9,"玄":1.1,"运":1.2,"功":1.1},"阶段":["辨药","控火","结丹","丹成九转"],"征":"寿元与灵石收益高，战力低，需靠丹药堆突破","文":"丹修最懂一件事：命是可以买的。一粒续命丹能换一名金丹修士三年效忠，一炉破境丹能让散修倾家荡产。可丹修自己往往活不长久——试药、控火、结丹，每一步都在拿自己的经脉做赌注。丹霞观的老观主说，丹修的死法只有一种：死在丹炉边上。"},{"id":"qi","名":"器修","别名":"百炼师·一器镇山河","色":"#9a9a8f","字":"工","要义":"以锤为笔，以火为墨。器修把道刻进器物里，让一块顽铁替自己活上千年。","本命":"本命法宝","副作用":"器成则主人耗尽心血，法宝品阶越高，反噬越重","主修":"器道","副修":"阵道","属性":{"攻":1.2,"守":1.3,"速":0.8,"玄":0.9,"运":0.9,"功":1.0},"阶段":["辨材","淬火","铭纹","器灵共生"],"征":"防高、灵石收益高，进度慢，需长期积累","文":"器修信奉「一件好东西胜过十句空话」。他们把半生耗在炉前，只为一柄剑的弧度、一面盾的厚薄。九州叫得上名号的法宝，七成出自器修之手；而器修自己，往往穿着最破的道袍，守着最贵的炉子。百炼山有句老话：器修穷，穷得只剩法宝。"},{"id":"fu","名":"符修","别名":"朱笔客·一纸镇万邪","色":"#b0453c","字":"敕","要义":"以朱砂为血，以符纸为骨。符修画的是天地的漏洞，贴出去的是自己的命数。","本命":"本命朱笔","副作用":"符纸燃尽时反噬神魂，画符越急，反噬越凶","主修":"符道","副修":"阵道","属性":{"攻":0.9,"守":1.1,"速":1.2,"玄":1.2,"运":1.3,"功":1.1},"阶段":["凝神","落笔","敕令","万符归一"],"征":"突破率与气运高，战力中等，符箓消耗大","文":"符修是九州最像赌徒的一群人。一张符画成，可挡雷劫、可镇邪祟、可换一条命；画废了，朱砂反噬，轻则神魂受损，重则当场癫狂。符修相信万物皆有缝隙，只要笔够稳，就能在缝隙里写下一个「敕」字。落雁谷的符师接单前必问一句：你这条命，值几张符？"},{"id":"zhen","名":"阵修","别名":"布阵人·方寸困山河","色":"#6f8f7a","字":"局","要义":"以地为盘，以灵为子。阵修不在一时胜负，而在落子之前就算清了十步之后。","本命":"本命阵盘","副作用":"阵破则主人神魂受创，越大的阵，反噬越狠","主修":"阵道","副修":"符道","属性":{"攻":0.9,"守":1.4,"速":0.8,"玄":1.3,"运":1.1,"功":1.0},"阶段":["观势","布眼","锁灵","阵成天地"],"征":"守御与探索极强，单挑弱，善以弱胜强","文":"阵修眼里没有路，只有势。山是势，水是势，人心也是势。他们能在方寸之地布下困杀元婴的大阵，也能用一座残阵保住整座城。阵修最怕的不是强敌，是变数——所以真正的阵修，往往也是最不信命的人。"},{"id":"shou","名":"御兽师","别名":"牧灵人·万兽为我所用","色":"#a8823f","字":"契","要义":"以血为契，以心为桥。御兽师不驯兽，他们交朋友，只是这些朋友恰好能撕碎金丹修士。","本命":"本命灵兽","副作用":"灵兽战死则主人神魂同伤，契约越深，伤得越重","主修":"兽道","副修":"体修","属性":{"攻":1.2,"守":1.1,"速":1.2,"玄":0.9,"运":1.1,"功":1.1},"阶段":["通兽语","结契","共战","万兽朝宗"],"征":"战力稳定、探索强，需长期培养灵兽","文":"御兽师是九州最不孤单的修士。他们身边总跟着一头或几头畜生，饿了要吃，伤了要治，死了要哭。旁人说御兽师靠兽吃饭，御兽师说：我这条命，早就是它们的了。南疆的御兽师甚至会把本命蛊与灵兽同养，一人一兽一蛊，三条命拴在一根绳上。"},{"id":"ti","名":"体修","别名":"炼体士·以肉身为鼎","色":"#a35d3f","字":"刚","要义":"不修金丹，不结元婴，只把一身血肉炼成法宝。体修的答案很简单：打不死，就赢了。","本命":"肉身宝光","副作用":"肉身崩坏极难恢复，重伤后需以灵材重塑","主修":"体道","副修":"武道","属性":{"攻":1.3,"守":1.6,"速":0.9,"玄":0.7,"运":0.8,"功":0.9},"阶段":["淬皮","锻骨","换血","肉身成圣"],"征":"气血极厚、抗劫强，悟性与玄机偏低","文":"体修是最不被看好的一条路。别人金丹一转便御剑千里，体修还在雪地里赤身站桩；别人元婴出窍，体修还在挨雷劈。可真正打起来，体修往往是最难缠的那个——你打他十剑，他挨了；他打你一拳，你没了。北冥玄冥殿的殿主说过：肉身是唯一不会背叛你的道。"},{"id":"mo","名":"魔修","别名":"血道人·以杀证道","色":"#8e3b57","字":"逆","要义":"大道无情，我便比大道更无情。魔修不敬天，不礼地，只信手中力量。","本命":"血海魔功","副作用":"魔念侵蚀道心，失控则堕为只知杀戮的血傀","主修":"魔道","副修":"血道","属性":{"攻":1.5,"守":1.0,"速":1.3,"玄":1.0,"运":0.8,"功":1.4},"阶段":["血祭","噬魂","魔化","血海无涯"],"征":"修炼极快、战力高，魔念高则走火入魔","文":"魔修不是生来就坏的。多半是走投无路的人，在某个雨夜捡到半部血经，从此一步快、步步快，也一步步把退路烧掉。魔修修得快，是因为他们拿命、拿寿元、拿别人的命来换。九州正道见魔修必杀，可每年仍有无数散修在黑市上打听：有没有快一点的法子？"},{"id":"fo","名":"佛修","别名":"苦行僧·一念渡众生","色":"#c9a24a","字":"慈","要义":"不争不抢，不嗔不怒。佛修以慈悲为盾，以愿力为刀，渡人亦渡己。","本命":"本命佛珠","副作用":"慈悲过头便是执念，执念入魔比魔修更难回头","主修":"佛道","副修":"禅定","属性":{"攻":0.9,"守":1.5,"速":0.9,"玄":1.2,"运":1.2,"功":1.0},"阶段":["持戒","入定","愿力","金刚不坏"],"征":"抗魔念与抗劫极强，突破慢，战力中庸","文":"佛修在九州是个异数。他们不争灵石，不抢机缘，遇事只念一句佛号。可偏偏天劫落在佛修头上时最轻，魔念缠上佛修时最容易散。寒山寺的老僧说，佛修不是不痛，是知道痛也是空的。话虽如此，九州被灭门的佛寺，一座也没少过。"},{"id":"ru","名":"儒修","别名":"读书人·一言定乾坤","色":"#7d8fa3","字":"正","要义":"以文载道，以言立命。儒修修的是人心与气运，一句道理讲通了，比一柄飞剑管用。","本命":"本命文印","副作用":"言出法随，说错一句便是自折道行","主修":"儒道","副修":"治世","属性":{"攻":0.8,"守":1.1,"速":1.0,"玄":1.2,"运":1.6,"功":1.2},"阶段":["明理","立言","教化","一言定鼎"],"征":"气运与人脉极强，战力偏低，善借势","文":"儒修在仙门里常被看轻，觉得他们只会耍嘴皮子。可到了中州才知道，太虚道宗的道旨、大衍皇朝的诏书，背后都有儒修的手笔。儒修不炼飞剑，炼的是一口气——正气。这口气撑着，百邪不侵；这口气散了，比凡人还不如。"},{"id":"meng","名":"梦修","别名":"游梦人·一梦一世界","色":"#7b6fa8","字":"幻","要义":"以梦为舟，以念为桨。梦修在别人的梦里杀人，也在自己的梦里长生。","本命":"本命梦蝶","副作用":"梦醒则修为倒退一截，沉醉梦境者终身不醒","主修":"梦道","副修":"幻术","属性":{"攻":0.9,"守":1.0,"速":1.3,"玄":1.5,"运":1.3,"功":1.1},"阶段":["入梦","织梦","盗梦","大梦千秋"],"征":"玄机与悟性极高，进度波动大，易陷入幻境","文":"梦修是最难被抓住的一群人。他们可以在你梦里住上三年，醒来时你只过了一夜。梦修说，世间本就是一场大梦，修梦不过是提前学会醒。可梦修自己也常分不清，哪一段是别人的梦，哪一段是自己的。有人一睡三百年，醒来时宗门已成废墟。"},{"id":"yinguo","名":"因果修士","别名":"执秤人·一因还一果","色":"#5f827f","字":"衡","要义":"世间万法皆有因果。因果修士不抢机缘，他们记账；不争胜负，他们等债。","本命":"本命因果秤","副作用":"因果反噬最重，欠下的债迟早要以身偿还","主修":"因果道","副修":"卜算","属性":{"攻":0.9,"守":1.2,"速":1.0,"玄":1.4,"运":1.7,"功":1.2},"阶段":["观因","记果","借势","因果循环"],"征":"气运最高、擅长借力，直接战力偏低","文":"因果修士相信，九州没有白得的东西。今日多拿一块灵石，来日就要少活一刻；今日救一个人，来日他可能在某个绝境里替你挡一刀。因果修士不轻易出手，因为他们出手前就先算过了价钱。这一脉人丁稀少，因为算得太清的人，往往活得太累。"}]},"vocab":{"人物":["青衣少年","白发老妪","断臂剑客","赤脚僧人","挎刀游侠","采药女童","醉道士","蒙面客","跛脚掌柜","守碑老人","游方货郎","黑衣执事","落魄书生","独眼猎户","卖符老道","撑伞女子","沉默挑夫","烧火杂役","云游星官","瞎眼琴师"],"地点":["断魂崖","听雨桥","乱葬岗","落霞渡","青石巷","望仙台","枯井旁","古道茶亭","废弃山神庙","黑水潭边","竹海深处","云脚驿","一线天","旧矿洞","渡口","断碑林"],"天象":["血月当空","大雾封山","雷云压顶","夜雨如注","星斗倒悬","赤虹贯日","阴风骤起","霜降三日","流火坠地","青气冲霄","月华如练","黑云吞星","白昼无影","落雪无声"],"妖异":["三尾火狐","青鳞蛟","纸人新娘","食梦魇兽","白骨行者","赤目蝠群","半人半蛛","无面僧人","石心老猿","阴兵队列","镜中鬼影","双头鹤","腐土傀儡","山魈"],"器物":["断刃残剑","青铜古灯","无字玉牌","缺角铜镜","黑铁铃铛","半卷残经","裂纹丹炉","玄铁令牌","素色骨笛","破旧蒲团","锈迹罗盘","褪色符笔","旧铜权","碎玉镯"],"灵材":["三百年紫芝","寒潭青莲","赤髓砂","九节菖蒲","星尘沙","冰魄花","金线蛊虫","雷击木心","阴芝","血玉参","云母苔","火枣","剑心草","月华露"],"功法":["《碎星剑诀》","《青木长生经》","《玄阴炼骨法》","《太虚引雷篇》","《万蛊真解》","《云梦水镜术》","《赤霄焚天诀》","《北冥玄冰功》","《大衍皇极经》","《因果秤心法》","《梦蝶游神篇》","《百炼铭器录》","《符箓总纲》","《九转金丹方》"],"际遇":["于乱葬岗拾得半卷残经","在古井底听见有人唤名","被一阵怪风卷进山洞","于渡口替人撑船换来一坛酒","在雪地里救下一头幼兽","于破庙中躲雨撞见旧事","在山道捡到一枚带血玉牌","误入一场无人主持的法会"],"祸患":["被同门诬陷盗取丹方","遭仇家在半路伏击","因一件法宝被人盯上","误食毒果三日不能言","被宗门罚去守三年药园","在秘境中与人失散","欠下一笔还不清的因果债","被诬为魔道细作"],"宗门":["青云宗","落雁谷","黑水堂","水月宫","沧浪剑派","赤霄剑宗","丹霞观","百炼山","玄冥殿","寒山寺","万蛊门","巫祝祖庭","青木谷","金沙楼","苦行沙门","流沙盗","太虚道宗","大衍皇朝","万宝阁","天机楼","万剑冢","藏锋阁","蓬莱阁","鲛人王庭","酆都鬼市","白骨道场","星枢阁","观天监","散修盟","天涯阁"],"地名":["青岚域","云梦泽","落霞山脉","北冥雪原","南疆蛊林","西漠","中州","天剑域","蓬莱海域","幽冥鬼域 之中有九门；门开则万修入，门闭则一国死。」"},{"类":"地理","名":"九门内城","卷":1,"文":"九门者，承天、定鼎、朱雀、玄武、宣阳、丹凤、金水、铜驼、望岳。九门各有一门之主，号为门将，掌一门的开闭、验引与夜禁。城门厚九尺，门轴用的是寒潭铁母，开合之时半城可闻。门的朝向与寻常城池不同：承天门朝南却偏东三分，为的是让紫气进得来；玄武门朝北而闭而不死，门下埋着一块镇岳鼎的碎片。九门之制最讲时辰：五更开三门，日中开六门，日落闭八门，只余宣阳门通宵不闭，专供信使与急报。此门谓之活门，也叫鬼门，夜里从这道门进出的人，多半不带名字。","引":"「闭八门而开一门，非为仁厚，为的是让该走的东西走完。」"},{"类":"地理","名":"太虚山","卷":2,"文":"太虚山在中州东百里，山势如覆钟，峰顶终年笼着一层雷云。相传太虚崩碎之时，一块残山落在此处，压住了九州最燥的一条雷脉，故山上无草木而多雷纹，石有焦痕，雨落不至地便散。太虚道宗依山建了九重殿，最上一重只一间茅庐，供宗主闭关。山腰的雷池深九丈，池底雷水终年不冻，宗中犯戒者下池受罚。山上有一条不成文的规矩：不许以法术惊动栖在山阴的鸟。那些鸟以雷为食，一只受惊，满山的雷气便要乱上三日。山下镇子里的人说，太虚山不是一座山，是一道还没落完的雷。","引":"「山不藏人，山藏雷；人不畏山，人畏自己心里的那一点燥。」"},{"类":"地理","名":"万宝城","卷":2,"文":"万宝城与皇城只隔一条漕渠，却自成一体。城中不设坊墙，街巷尽以货栈相连，一街一货，米街、丹街、器街、符街、兽街，最深处一条叫哑街，只收不留名的东西。万宝阁总号在城心，楼高七重，内堂称宝鉴堂，寻常人不许入。城中最奇的是价：同一件货，上午与下午的价可以差三倍，全看当日的气运秤往哪边沉。城规只有三条：不赊账、不认旧怨、不问来路。三条里最难守的是第三条，因为每天都有人的仇家在同一张柜台上挑东西。","引":"「万宝无贵贱，只有出得起的人；人无善恶，只有还得起的人。」"},{"类":"地理","名":"天机阁","卷":2,"文":"天机阁不在城中闹处，落在御街尽头的旧观里，门不朝南而朝西。阁楼三层，一层卖消息，二层算命数，三层记史，三层之上还有一间不设门的小屋，只有瞎子进得去。阁中录史不收徒，只从各域捡来目不能视的孩童，教以盲文与推演。天机阁的买卖极怪：问前程收钱，问兴衰收命，问来处收寿，问别人的去处只收一句话。规矩还有一条：凡入阁者不许提自己的名字，名字一出口，所问便不作数。据说楼里那册无名簿子记着九州所有进过这扇门的人，谁也没见过那册子的第一页。","引":"「天机不泄，泄的是价钱；人不问命，问的是自己敢不敢听。」"},{"类":"地理","名":"白马原","卷":2,"文":"白马原在城北四十里，一望无际的枯草，草下尽是白骨。三百年前此地一战国灭，此后每逢阴天，原上便有马蹄声，走近了却什么也没有。皇朝在此设了九座镇魂墩，每墩压一块刻字的石，石上的字年年要重描一次，描轻了便会有骸骨从草里浮出来。原上最忌两件事：一是在日落之后走原心，二是在原上喊人的全名。前者会被马蹄声引走，后者则容易把不该来的东西叫醒。军中每年秋后在此演阵，演完必以酒泼地，说是给原上的兵也分一口。","引":"「原上的草长得旺，不是因为雨水，是因为底下的骨还热。」"},{"类":"地理","名":"寿安山","卷":3,"文":"寿安山是皇陵所在，山势低缓，九条支脉如九条手臂环抱。山南有一座衣冠冢，山北才是真陵，两处相距十二里，中间不设路，只设三重石门，石门之后是终年不散的雾。守陵的兵分两班，一班看人，一班看雾，看雾的那一班三年一换，换下来的多半已不会说话。陵区之内不许飞行，不许鸣钟，不许见血。山上种的全是金丝楠灵木，一棵也不许伐，有一年风折了一棵，朝中为这一棵树议了三天。山下几十户守灵人，世代不纳税，也不许迁走。","引":"「陵前三百步，活人让死人；陵后三百步，死人让龙脉。」"},{"类":"地理","名":"封禅台","卷":3,"文":"封禅台在北郊，台基三层，高九丈，正面三十三级石阶，每一级都刻着前朝的祭辞，字迹多半被草根撑裂。前朝在此封禅三次，第三次之后不到十年便亡了国，从此无人再登。台上立着一方无字碑，碑下的土年年松散，有人挖过，挖到一半便封回。当地的老人说这台下埋着一口铜箱，箱里装的是前朝没能带走的东西，谁开谁就要替前朝还债。台基的裂纹里有金气外溢，钦天监每年派人来量一次裂口的宽窄，量完只报一个数字：还是那三寸。","引":"「封禅封的不是天，是自己那句说给天下人听的话。」"},{"类":"宗门","名":"太虚道宗","卷":4,"文":"九州第一道宗，掌天机、执雷罚。宗中元婴如云，化神坐镇，山门九重，弟子分内外两门：外门修雷法、行苦役，内门修道统、议大事。太虚道宗有一样东西是别家没有的：雷罚之权。凡有宗门犯下大忌，道宗可遣雷堂执事持紫金雷印下山，先问后罚，罚了无人敢申辩。宗中戒律七十三条，第一条是「不得以雷私报」，犯此条者下雷池受刑。这些年道宗与皇朝表面相敬，暗里各自都在数对方的兵：道宗数的是京营里有几个化神，皇朝数的是山上有几位长老。","引":"「道宗执雷，雷不认人；执雷久了，人也以为自己不是人。」"},{"类":"宗门","名":"大衍皇朝","卷":4,"文":"皇朝以一国气运供养皇室修士，不重个人修为，重的是万民、疆土与龙脉。朝廷设三院：中书省掌诏令，御史台掌纠察，钦天监掌星象与卜算。一纸诏书可征十万修士，征来的编成九阵，阵前悬虎符，阵后立旗官。皇朝的修士有一处极特别：他们的境界多半虚高而根基不牢，因为修行借的是气运，气运一断，修为便如退潮。三百年来皇朝最怕的不是外敌，是龙脉出问题——龙脉一漏，皇室的气运便跟着漏，朝堂上的动静也就要变。","引":"「天子之剑不斩人，斩的是一域的水旱与一万人的丰歉。」"},{"类":"宗门","名":"万宝阁","卷":4,"文":"九州最大的商盟，分号遍布各域，总号在万宝城。阁中设掌事九人，称九掌事，其上一位大掌事，只在拍卖会与国事上露面。万宝阁有三不卖：不卖国运，不卖寿数，不卖归墟之路。这三条挂在宝鉴堂的墙上，字是三百年前第一位大掌事写的，写得极丑。阁中最重的是信誉，一诺千金不假，但这一诺的价钱由阁来定。阁中货分九等，第九等的从不摆出来，只给进过内堂的人看。据说内堂里还有一本赊账簿，记着九州多少宗门欠了阁里的债，那本簿子的厚度，决定了这九州谁说了话最算数。","引":"「三不卖者，非有所畏，是留三条路给自己走。」"},{"类":"宗门","名":"天机楼","卷":4,"文":"楼中只做三件事：卖消息、算命数、记史。天机楼记下的史册，比皇朝史官的更可信，因为它不奉诏、不避讳、不改笔，写完即封，封了便不再动。楼中录史不称官职，只称第几录史，活着的录史从不以真名见人。天机楼有一条极怪的规矩：答复只说一遍，听不清便是你自己的事。还有一条：凡入楼问事者，问完须留下一样东西，可是一片衣角、一句真话、一段记忆，也可以是一个人的名字。收下的东西放在三层之上那间无门小屋里，谁也不知道什么时候会被人取用。","引":"「史不必传世，只需在有人翻的时候还在那里。」"},{"类":"宗门","名":"钦天监","卷":5,"文":"钦天监掌星象、历法、卜算与国运测算，衙门不大，权却重。监中设监正一人、监副二人、小吏数十，最要紧的是观星台上的三件旧物：一面巡天镜、一具星晷、一册逐年校订的星图。钦天监每年上四道奏疏：春报水旱，夏报兵象，秋报收成，冬报国运。四道奏疏里，冬疏最险，因为冬疏常要写一句「帝星有变」，写完这一句，上一个写的人已经被贬去守皇陵。监中规矩：星图三十年一校，校图之夜不许点灯，只许借星光照石。","引":"「仰头看星的人，看的从来不是星，是地上谁该让位。」"},{"类":"宗门","名":"九门镇抚司","卷":5,"文":"镇抚司管的是京城的夜。白日里九门由门将管，日头一落便归镇抚司，巡夜分九队，每队十二人，持一枚勘合，走到子时须在指定地点交牌，交不上牌的那一队按例不再寻人。司中治的是三类事：以术乱禁者、以气盗运者、以假乱真者。三类的处置各不相同：第一类当场格杀，第二类押入天牢等明正典刑，第三类则多为私了——京里的假货案若都捅开，半个官场都要塌。镇抚司的人不穿甲，只穿黑衣，腰间一枚铜牌，牌上无字，只有一道刻痕，刻痕的深浅代表他手上沾过多少。","引":"「白日防人，夜防的不是人；能杀的不必审，能审的不必杀。」"},{"类":"宗门","名":"龙脉司","卷":5,"文":"龙脉司是皇朝里最不显眼的衙门，衙署只三间破屋，管的事却压得住整个九州：测脉、护脉、补脉、镇脉。司中匠人多为世代相传，不修法术，只修地气，手中罗盘比法宝更精。司里有一条铁律：脉有九道，一道不许断；又有一条暗规：断一道可补，断三道则国亡，若到了那一步，须由司中第一人以身填脉。三百年来填过脉的一共四人，名字刻在署后一面石墙上，第四个名字下面的石缝里，还夹着半截没有烧完的香。司中匠人一辈子不出京，说是怕走了，脉会认不出人。","引":"「脉在人下，人不知；脉断才知，知时已晚。」"},{"类":"宗门","名":"诸子学宫","卷":5,"文":"学宫在城东，旧屋三百间，书八万卷，从星象到农桑，从雷法到蛊术，无所不有。学宫不属朝廷也不属宗门，靠历代士人捐输与抄书度日，故极穷，冬天只供一炉炭。宫中每月初一论道，题目由抽签定，论完不问对错，只问有无新意。学宫有一条祖训：凡在此说过的话，出了门便不算数；凡在此写过的东西，出了门便算数。因这条祖训，京中许多人来此说心里话，也有许多人来此偷听。据说学宫藏着一册无名手稿，记录了三百年间所有在这里脱口而出的真话。","引":"「学宫的门槛低，低到能进来；话说出口却重，重到出不去。」"},{"类":"人物","名":"大衍帝","卷":6,"文":"当今天子即位二十七年，未出过皇城一步。他不是修为最高的那个，却是把气运用得最精的那个：一座城的运、九州的赋、十万修士的命，都在他手里过账。朝中说他寡言，一年在廷议上说不到百句，句句都是问话，从不给答案。他最常做的一件事是半夜登上玉阙宫的角楼，看九门上空的龙气，看很久。近侍说他有一本私账，记的不是国库，是各家宗门三百年来欠下的债，账上一笔一笔都清楚。他这三年下令修陵，修得极急，工部的老人说，这不是给自己修的。","引":"「天子不言，言则改元；天子不动，动则换朝。」"},{"类":"人物","名":"天机楼主","卷":6,"文":"天机楼主是一个瞎子，这是第三代的瞎子。楼中不传子而传徒，选徒只看两样：一看是否目不能视，二看是否肯替人背一句不该背的话。他今年不知多少岁，脸上一层薄薄的白，走路不用杖，说是楼里的路他闭着眼走了六十年。他极少开口，一开口便是断语，从不解释。有人说他算尽了九州，却算不出自己的寿数；也有人说他早算出了，只是不肯说，因为一说出来，那册无名簿子便要添一页。他有一条怪癖：每答一问，必亲自送客出门，站在门槛内，一步不出。","引":"「瞎子的眼里没有光，只有该来的和不该来的。」"},{"类":"人物","名":"万宝阁大掌事","卷":6,"文":"万宝阁大掌事姓什么已无人记得，阁中上下只称一声大掌事。他起家于西漠的一条商道，二十岁替金沙楼押货，三十岁带着七车货进京，四十岁坐上宝鉴堂的主位。他有一手绝活：看一眼货，便知来路、经手几人、死了几条命。他定下的规矩极硬，犯者不问情由，一律逐出商盟；可他也有一样软处，凡遇带着孩子来的卖家，价总要往上抬两成。阁里人私下说，大掌事这辈子最贵的一笔买卖，是三十年前买下的一个哑孩子，那孩子如今在宝鉴堂管账。","引":"「我卖的都是死物，只有价是活的；活的东西我不卖。」"},{"类":"人物","名":"太虚宗主","卷":7,"文":"太虚宗主闭关已十一年，宗中大小事由三位长老分理。他年轻时以一道雷法劈开过北疆的冰渊，也为一句承诺在雷池里坐了四十九日。如今山上关于他的消息一年比一年少，有人说他已化神圆满，有人说是伤重难出。雷堂执事每月上山送一次饭，饭放在茅庐外的石上，次日去收，碗总是空的。他闭的不是修行的关，是心关：三十年前他亲手罚下山的那个弟子，如今成了皇朝座上客，这件事他一日没想通，雷便一日不听他的。","引":"「雷听人心，不听人令；心有一寸不平，雷便有一寸不回。」"},{"类":"人物","名":"司天监正","卷":7,"文":"钦天监监正姓崔，出身寒门，靠一手推演入监，二十年爬到监正。他这官做得极谨慎：奏疏上从不多写一个字，星图校完必亲手锁柜，连家里的仆役都不许进书房。他有一件旧物，是一枚磨得发亮的卜骨，据说是他父亲留下的。他每日上观星台之前，必先在台下站一刻，摸一摸那枚骨，像是在跟谁打个招呼。这些年他递过三道冬疏，三道都写了「帝星有变」，三道都没被驳回，也没被准。他知道这意思：皇帝在看他会写第几道。","引":"「监正之职，不在看懂星，在知道哪颗星看懂也不能说。」"},{"类":"人物","名":"白衣巷老卜","卷":7,"文":"白衣巷最深处的墙角有一张矮桌，桌上一枚卜骨、一碗清水、一盏不灭的油灯。摆摊的老者不报姓名，也不要钱，只收一样东西：来人的一句实话。他说自己算的不是命，是人敢不敢认。巷里的人都叫他老卜，谁也说不清他在这条巷子坐了多少年，有人说三十年，有人说他父亲小时候就见过他。他替人算过七次大事，七次都准，七次来问的人后来都死得很早。有人问他还算不算，他只说：算得准不算本事，让人不算，才算。","引":"「我不算命，我只问一句：你敢不敢听。」"},{"类":"法宝","名":"传国玉玺残角","卷":8,"文":"前朝玉玺在国破那日碎成九块，最大的一块落在皇朝手里，最小的一块丢在民间三百年。残角不过拇指大，色如冻脂，缺处有一道旧裂，裂里渗着一点洗不掉的红。据说此物不认新主，只认旧誓：凡持残角者，可于梦中听前朝旧臣议事一夜，醒来忘其名而记其言。钦天监曾想把它熔了补进新玺，炉火烧了三日，残角一点未损，反倒把炉子烧穿了。如今这块残角下落不明，最后见过它的人说，它被装在一口铁匣里，匣上刻着半句咒，后半句无人能补。","引":"「玉碎而角存，存的是不肯认的那一口气。」"},{"类":"法宝","名":"九门虎符","卷":8,"文":"虎符一分为九，一符管一门，合九符方能调京营。符身长三寸，左右各一，左在兵部，右在门将，中缝咬合处有九个齿，齿的深浅各不相同，仿不出来。虎符最忌离水：符身上的九道纹路其实是地脉的走向，离了水便会干裂，裂一道便失一门。兵乱那年崩掉了一角，那一角的符从此称为残符，残符虽不能调兵，却能让本门的兵认人不认令。三百年来残符流落民间，据说到过旧货摊、祠堂、甚至一口棺材里，每一次现身，城里便要出事。","引":"「一符不足调兵，九符合则国动；符在谁手里，命在谁手里。」"},{"类":"法宝","名":"锁龙钉","卷":8,"文":"锁龙钉九枚一套，钉长七寸，钉头铸作兽口，钉身有极细的纹，纹路是镇脉的咒。钉不是钉在龙身上，是钉在脉眼上：一钉落下，那一处的气便沉住不动，城池因此得安。此物的厉害在于双刃：钉得久了，龙脉会把钉当成自己的一部分，钉一拔，脉便跟着疼。龙脉司的老匠人说，钉的寿数比人长，钉上的咒要靠活人的血续，一代一代续下去，续到没人肯续的那一天，钉子就自己松了。近年来九门底下总有钉子在松，司里每年要多派两班人下去摸钉。","引":"「钉住的是脉，钉不住的是人想动它的心。」"},{"类":"法宝","名":"气运秤","卷":9,"文":"气运秤收在万宝阁宝鉴堂的内案上，秤杆乌沉，秤盘是一块磨得极薄的白玉，据说掺了玄黄之气。此物称的不是物，是运：往上放什么，秤便显出那件东西牵连的气运轻重。它有两处古怪：一是称不出自己的重量，二是称不动的人一律被记为「运在别处」。三十年来只有两人上秤称不动，一位是皇朝太子，另一位如今已死。阁中规矩，此秤不出内堂，凡请称者须先交出全部身家作押——不是怕人抢，是怕人赖。","引":"「称得出的是货，称不出的是谁在替你担着。」"},{"类":"法宝","名":"天机铜盘","卷":9,"文":"天机铜盘径一尺二寸，盘面刻着周天三百六十五度，中央一枚铜针，针下有一圈极浅的槽，槽里注水。此物不指方位，只指变数：针走则事将起，针停则事已定，针倒转则有人在改命。天机楼用它验天下大势，一月一次，验完即封。铜盘最奇的是不能对镜，一对镜，针便乱转三日，据说是因为镜里另有一个天。楼中录史说，此盘三百年来只倒转过两次，两次之后都换了朝代。","引":"「盘上无字，字在针下那一圈水里。」"},{"类":"法宝","名":"星晷","卷":9,"文":"星晷在观星台正中，形如巨碗，碗里盛着一层薄水，水面上浮着九枚极轻的银片，各对应一域。星气一动，银片便移，移多少、往哪边移，都记在值夜人的册子上。此物最怕两样：一是风，二是人的呼吸。故台上四面悬着铜铃，一有风便响，值夜人听见铃响须立刻俯身遮住碗口。星晷的旧例是三年一换水，换水这日不许人在台上说话，说是水听惯了旧话，换了新水要重新认人。有一次换水时有人打了个喷嚏，那年九州出了一场大乱。","引":"「看天的人，先要学会不惊动这只碗。」"},{"类":"法宝","名":"巡天镜","卷":10,"文":"巡天镜悬在观星台顶层，镜面朝北，照的是九域气脉。镜不是铜的，据说是太虚山落下来的一块东西磨成的，镜面有极细的纹，像冰裂又像脉络。镜碎则九域的水旱必乱，故钦天监视此镜如视国运。补镜之法只有一个：以心头血浇裂，血入裂中，纹路自合，代价是三年之内不能行功。三百年来补过四次，四位补镜的人后来都去看守旧档了。旧镜换下之后不许毁，要送进库房封存，因为旧镜里还留着上一任的影。","引":"「镜里照的是九州，镜碎时最先裂的却是看镜人的心口。」"},{"类":"法宝","名":"斩龙剑","卷":10,"文":"斩龙剑不是用来斩真龙的，斩的是龙脉上的结。剑长四尺，无锋，剑脊上有一道浅浅的槽，槽里灌的是水银样的东西，一挥便有一线青光。此剑出自龙脉司，历代只用过七次，每用一次，那一段脉便断上一节，断处须以掌印复脉，用剑的人至少要少活十年。剑身不许沾血，沾了血便认主，认了主的剑再不能用来斩脉。司里的老人说，此剑真正的可怕之处不在剑，而在用剑之前那一夜的静——因为要用剑的人都知道，斩下去之后，这一段地脉的气就要从别处找补。","引":"「斩脉如断指，断了能活，只是从此少一根。」"},{"类":"功法","名":"《太虚雷典》","卷":11,"文":"太虚道宗的镇宗之法，九卷，前八卷讲引雷、正雷、藏雷、借雷，第九卷只有一句话。此法的根本不在术，在气：修者须先以自身经脉作引，让雷气在体内走一遍，走得顺了才谈得上放出。宗中弟子多卡在第三卷，因为第三卷要人一边承雷一边静心，心一乱，雷便走岔，走岔则伤的是自己的髓。历代宗主中只有两人修到第八卷，第九卷无人敢开。据抄本的跋语说，第九卷那句话是留给「雷不听话的那一天」用的。","引":"「雷典九卷，八卷教人放，一卷教人收。」"},{"类":"功法","名":"《大衍运朝法》","卷":11,"文":"皇朝秘传，不载于任何书坊，只由宗人一脉相授。此法不炼己身，炼的是一方气运：以民为田，以政为渠，以刑赏为雨露，修得深了，一人之气可与一州相连。故修此法者须有官身，无官身者强修，气无所依，必反噬自身。此法有三层，修到第三层，气运便认人不认己，届时所到之处风调雨顺，所亲之人却要一一凋零。皇朝历代只有皇帝与两位亲王修到第三层，前一位亲王在修成的第七年病故，死时城中三月无雨。","引":"「以国为身，则民为血肉；血肉尽了，身还在走。」"},{"类":"功法","名":"《天机演算篇》","卷":11,"文":"天机楼的不传之秘，共七章，讲的是如何把眼前的事算成后头的事。此法的门槛极怪：须先学会不算。楼中录史说，初学者算得越准，错得越惨，因为局是活的——你算得准，局便照着你算的路走，走到最后你会发现，是你把路走成了算出来的样子。故此法第七章只有一句告诫：算到七八分便住手。天机楼历代楼主都死在第八章上，第八章不在书上，在自己心里。","引":"「算尽则局成，局成则人困；留三分不算是给自己留门。」"},{"类":"功法","名":"《九门镇国经》","卷":12,"文":"皇朝镇国的根本之法，不入宗门，只授门将与镇抚。此法以九门为九窍，以城墙为经脉，以钟鼓为呼吸，修成了可与一座城同气：城在则人在，城破则人亡。故修此法者极难离开京师，离了城，一身修为便要去七成。此法还有一桩不合常理处：修者越强，越不肯出城，出城越久，心便越慌。三百年来修此法的人里，只有一位在城破之后活了下来，那个人后来疯了，整日在废墟上敲钟。","引":"「与城同气者，城是命，也是牢。」"},{"类":"功法","名":"《周天承运图》","卷":12,"文":"此图不属任何一家，来历只说是前朝遗留，图在绢上，长九尺，画的是一周天的气行路线，与寻常经脉之说全不相同。图上的路并不连贯，中间有七处断口，须人以自身之气去补。补得对，周天自转，修为如潮；补错一处，气便从断口漏尽，人当场成了空壳。三百年来见过此图的不下百人，补成的只有三人，三人之中两人不知所终，一人如今在万宝阁管账。绢本末尾有一行小字：此图非功法，是一张地图。","引":"「周天不是路，是路底下的另一条路。」"},{"类":"丹药","名":"九转朱果","卷":13,"文":"朱果产在赤壤深厚处，性极燥，生食如吞火。九转之法是把果子以蜜水浸九次、以寒泉淬九次，每一次都要换一处地气不同的地方，故一枚九转朱果至少要耗三年工夫与三处灵地。炼成的果子色如琥珀，入口先甜后辣，丹田内会生出一股暖流，三日不退。此物最适于筑基圆满者冲金丹，能提三成把握。禁忌有二：一是服时不可动怒，怒则火走岔；二是果核不可弃，核里有火，埋进土里能养出一处小火脉。","引":"「九转不是炼果，是让果子把九处地气都记一遍。」"},{"类":"丹药","名":"太虚雷精","卷":13,"文":"雷精出自太虚山雷池，是雷水凝成的晶，色青而透，触之发麻。此物不能直接吞，须以自身的雷法引着走一遍经脉，走到哪一处，那处的经脉便被冲宽一分，代价是痛得极真。故雷堂弟子多备酒，痛极了便灌一口。雷精的品相看纹：纹直者为下，纹如枝者为中，纹如毛细血管者为上，上品的雷精里的纹路会自己动。此物在市面上流通极少，太虚道宗每年只得出十枚下山，多半被万宝阁收去，转手价高三倍。","引":"「雷精不救人，只把人烧宽一点。」"},{"类":"丹药","名":"朝露玉髓","卷":13,"文":"玉髓采自京畿的赤壤深处，是地气上涌时凝在石缝里的露，色如蜜冻，嗅之有土腥。此物最宜疗伤：以温水化开服下，内伤可缓，经脉破裂之处能自行黏合。它的好处在于不挑人，炼气与元婴服了都有用，坏处也在此：用得多了，人便生惰性，经脉不肯自愈，非得再服。京中有钱人家的子弟多犯此症，脸色红润而根基虚浮。龙脉司的匠人常说一句：玉髓是地气借给你的一口气，早晚要还。","引":"「地气借你一口，你便欠它一分；借得多了，人就成了地的一部分。」"},{"类":"丹药","名":"御供灵米","卷":14,"文":"灵米出自京畿十八州的水田，田里引的是漕渠的活水，水里含着龙脉的余息。米粒略长，色微青，蒸熟后有淡淡草木香，一碗可当半日辟谷。此米不入民间，产多少、运多少、入仓多少，都归龙脉司与钦天监合记。灵米的用处不止于吃：军中修士以米为饵布阵，丹师以米浆调药，某些低阶的符也要以米汤贴。最忌掺假，掺了赤壤陈米，煮熟之后颜色不变，只是那碗饭吃下去，气要散三日。故每岁过秤，一斤一两都不许差。","引":"「一饭之微，系一国之气；秤上不让，是替万民守着。」"},{"类":"丹药","名":"凝神香","卷":14,"文":"凝神香以金丝楠灵木的边角料与一种生于旧观墙根的苔合制，制时须避火，只以日光晒成。此香燃起，烟直如线，不散不斜，闻之心中忽然安静，杂念如落叶入水，慢慢沉下去。京中闭关者十有八九用它，天牢里也用它——牢头说犯人闻了香，招得顺些。此香有一处古怪：久闻者会渐渐听不见外面的声音，先是不闻市声，再是不闻家人说话，最后连自己的名字都听着生疏。老香师说，静是好的，静过了头便成聋。","引":"「香直烟不散，是心定了；心定太久，也听不见叫门的人。」"},{"类":"秘闻","名":"龙脉九道","卷":15,"文":"九州之下有九道龙脉，交汇于中州，名为九脉归一。九道各有其性：北道寒，南道湿，东道疾，西道燥，中道厚，其余四道如丝如缕，接在四隅。脉不是水，是地气行走的路径，看得见，摸不着，只在某种土里留下颜色。凡脉眼之处，草木必异，石上必有纹。三百年前太虚崩碎，九道脉断了三道，余下六道撑着九州的气运。断了的三道至今未接，只以锁龙钉与龙脉土勉强镇着，故钦天监每年冬疏里必有一句：脉未还。","引":"「九脉断三，天下尚安；若断其五，则王城无墙。」"},{"类":"秘闻","名":"气运金龙","卷":15,"文":"王城上空终年盘着一条气运金龙，这不是传说，是每日抬头都能看见的东西。龙形由城中万户的气聚成，长短随国运盛衰而变，据说最盛时盘了九匝，如今只余六匝半。龙不见首尾，只见鳞，鳞动时檐瓦皆明。钦天监有一条铁律：不许以术惊龙。龙惊则气散，气散则城乱。此龙最奇之处在于它有眠：眠时鬃毛间会现出细钉的影子，那是有人在做手脚；醒时则不食不动，只看着皇城。老吏说，这条龙不知道该听道宗的还是听皇帝的，所以它大多时候都不动。","引":"「龙不护城，龙只是城里人心里的那口气凝成了形。」"},{"类":"秘闻","名":"玄黄之气","卷":15,"文":"玄黄之气是天地初分时留下的那一层气，沉在脉眼最深处，色介于金与黄之间，极稠，捞之如捞蜜。此气不入人体，入则破境，故有「一钱玄黄换十年」之说。取法极险：须以气运秤为引，以锁龙钉开口，一钉一取，取多则脉断。三百年来真正取到的只有两次，一次在封禅台下，一次在锁龙井底，两次之后城里都出了大乱。万宝阁的三不卖里没有这一条，但它也从不进货——因为没有商人敢经手一个会让自己折寿的买卖。","引":"「玄黄不是宝贝，是这片地还没借出去的最后一点本钱。」"},{"类":"秘闻","名":"楼中记史法","卷":16,"文":"天机楼记史与别处不同：不记年号，只记日；不记官职，只记事；不写评语，只写后果。一条史料写成三段，第一段记事，第二段记与之相关的一处地名，第三段留白。留白是给后人的：凡有后来者添着一笔，那一条便算活过。故楼中史册多有批注，字迹杂沓，有的隔了一百年。封卷用的是旧观里一种极韧的纸，封了之后不许开封，只许在石室里读。楼里录史说，史册最怕两样：一是火，二是有人照着自己的样子改。","引":"「史不必真，须有人；笔不必快，须在后头留着。」"},{"类":"异兽","名":"朱厌","卷":17,"文":"朱厌形如巨猿，白首赤足，身高丈余，见于军镇与旧战场，古书说它现世主刀兵。此兽不吃人，只踏：走过一片田，田里便三年不生；走过一座营，营里便三日不合眼。它对人间的器物极敏感，尤其怕带煞的兵刃，见了便要跟上去，一直跟到那件东西被埋进土里为止。故朱厌入城，多半不是它要进来，是城里有人把不该有的东西带进来了。杀它极难，皮坚如铁，伤它一记要用上乘的雷法，且杀完之后兽群要在城外游荡两年，夜里的嚎声能传出三里。","引":"「朱厌不为祸，只替一件杀人的东西找人。」"},{"类":"异兽","名":"窃运鬼","卷":17,"文":"窃运鬼没有形，附在人影上，被附的人白日里看不出异样，只是渐渐行路处处不顺：喝水呛着、出门下雨、说三句话得罪两个人。此鬼不伤人，只偷运：人的运像一口井，它每日偷一勺，偷到井底，人就自己倒了。此物最喜气运深厚之地，故王城、万宝城、太虚山脚最多。驱它的法子不难，难的在于找：鬼附影上，须在正午时看脚下影子是否比旁人短一寸。故京中老人至今仍有一句俗话：日中看脚，不看路。","引":"「偷运气的人自己不知；等到事事不顺，已经偷了大半年。」"},{"类":"异兽","名":"纸上人","卷":17,"文":"纸上人出自旧丧仪：扎纸为仆，烧予死人。此物本该在火里化掉，若有未了之事，便撑着不化，趁着夜色从纸铺里出来，穿着官服，面无五官，走路脚不着地。它们成群时必有定数，数目与某处新丧的人数相同，说是替那些人回来办一件事。此物怕火，也怕人喊出它生前的名字：名字一被喊出，它便伏地成灰。故守夜的人听见街上有纸声，先别跑，先想那一片近来死了几个人。","引":"「纸人无脸，脸刻在还记着他的人身上。」"},{"类":"异兽","名":"金甲尸将","卷":18,"文":"金甲尸将是旧战场上没能下葬的将官所化，穿的是锈成一整块的甲，甲片上有未干的血锈。此物白日里埋在地下，夜里出来沿着当年的阵线走，走到哪儿便站在哪儿，一站就是一整夜。它不攻人，只拦路：凡从它面前过的人，都要被它看一眼，被看一眼的人当夜要做一个梦，梦里是那场仗。军中相传，尸将是在等一个认得它的人。故白马原上每年演阵之后都要泼酒，泼的不是敬，是让这些走了一百年的兵也喝一口。","引":"「甲锈了还穿着，路断了还站着，等人认他。」"},{"类":"风俗","名":"九门开闭之制","卷":19,"文":"九门五更开三门，日中开六门，日落闭八门，只余宣阳门通宵不闭。开门的号令是钟，闭门的号令是鼓，钟鼓不可错一声，错一声则值门者要挨十杖。凡入城者须过验引，引上有名、有乡贯、有一句自陈。验引的校尉常只问一句：你进城做什么。答得含糊的，多在门外多站一个时辰。城门门轴每月上一次油，用寒潭铁母碾的粉调油，一年耗掉的油钱够养三十个兵。关门落闩那一声，半城可闻，老京人都说，那是这城一天里最像家的声音。","引":"「门开迎人，门闭拒鬼；钟鼓不错，则城里城外两不相犯。」"},{"类":"风俗","名":"万宝拍卖会","卷":19,"文":"万宝阁一年开一次大拍卖，分内外两场：外场人人可入，内场须有阁中玉牌。拍卖的规矩刻在宝鉴堂门内的石上：一不还价，二不认旧怨，三不问来路，四不许兵刃入堂，五不许当堂验货。末席的竹凳最便宜，坐末席的人往往比坐前排的更懂货。会中最要紧的不是价钱，是掌事的一声「还有加者否」，这一声落，东西便定了，谁也不能再动心思。历年拍卖都有一两件不卖之物压场，压场的东西不为卖，只为让人知道这阁里还藏着什么。","引":"「拍卖会卖的是货，看的是人；敲一锤，定的是价，也是一个人的胆子。」"},{"类":"风俗","名":"十年道会","卷":19,"文":"十年一度的道会开在太虚山，九州三十七家云集。会期九日，前六日论道，后三日论法。论道的座次按势力排，论法却按抽签，故常有小宗门的弟子一首打落大宗门的脸面。道会的规矩有三条：不许在堂上动用术法，不许议当家的人，不许在门口动手。会上所论最为要紧的一题是「气运属于谁」，三家各执一说，说了三百年也没有定论。散会那日，山门外的石阶要洒扫一遍，扫出来的多是别家的荐书与几张写满了字的纸。","引":"「道会论的不是道理，是谁的道理能压住另两家。」"},{"类":"风俗","名":"诏书之制","卷":20,"文":"皇朝的诏书分三种：明诏、密诏、血衣诏。明诏走中书省，用御墨，盖玺，邸报登出；密诏只交一人之手，封口以火漆，漆上按指印；血衣诏是不入册的，封皮上只一片血，写得极简，往往是几个名字。三种诏书的用纸不同：明诏用御供的厚帘纸，密诏用生宣，血衣诏用旧绢。中书省誊诏的旧吏有两样东西不离身：一枚乌木镇纸，一柄小刀。前者压纸，后者刮错——因为在诏书上写错一个字，便再没有第二种改法。","引":"「一纸诏书，写的人手抖，读的人腿软，死了的人听不见。」"},{"类":"风俗","名":"御供道场","卷":20,"文":"每年秋后，皇朝在城内开御供道场三日，说是为万民祈福，实则是调配京畿灵气。道场之内灵机涨至三倍，蒲团按官阶与宗门的势排，内场三十六席，外场百席，散席另说。三日之内不许斗法、不许见血、不许在道场周围买卖。头两日自由吐纳，第三日由钦天监收气入册，收气之时场外要立三道旗，旗动则停。外场的人最恨这第三日，因为气总往内场流，散了场只剩一身空。故有修士宁可在家自修，也不去挤那一圈。","引":"「道场是给万民祈福的，分气的时候，万民站在外头。」"},{"类":"风俗","名":"白衣巷夜市","卷":20,"文":"白衣巷白天看起来只是一条窄巷，墙根长着会咬人的枯藤。入了夜，巷口点起一串纸灯，摊子便一个接一个支起来：改路引的、卖假丹的、替人写讼状的、收不明之物的，还有一位不收钱只收实话的老卜。夜市的规矩只有一条：不问来历。所以这条巷子里没有人称名，都称「那位」「这边」「掌柜的」。天亮前摊子必散，散得极干净，只在墙根留下一圈圈的油渍与几片纸灰。京中人说，这条巷子不是做买卖的，是给城里那些说不出口的事留一个出口。","引":"「不问来路，不查去向，只在天亮前把话说完。」"},{"类":"地理","名":"漕渠河","卷":21,"文":"漕渠河穿城而过，一头连着京畿十八州的粮道，一头通着宫城的水口，是全城活命的咽喉。河宽不过十丈，水却极深，底下有九处暗渠，与龙脉相参。每年开春要清淤一次，清出来的泥里常混着不该有的东西：断了的符、空的骨灰罐、还有不肯浮上来的尸。河上共十二座桥，最要紧的是金水桥，只许宫中车驾通行，桥下的水一夜要换三回。河中鱼不可捕，捕者重罚，因为鱼吃的是宫中排出的药渣，那药渣里带着好几种外人见不得的东西。","引":"「一条河养活一城人，也埋了半城人的事。」"},{"类":"地理","名":"锁龙井","卷":21,"文":"锁龙井在城西一条无名小巷的尽头，井口比寻常水井大一圈，井沿上钉着九枚锁龙钉，钉子早被摸得发亮。井水干了三百年，井底却时常传出水声，靠近的人能听见有人在很深的地方说话。此井不许填，也不许在井边动土，钦天监每年派人来看一次，只在井口贴一张新符。坊间相传井里锁着一条没长成的龙，龙若是饿极了，便要拿城里的气运来喂。老匠人私下说：井里没有龙，只有一条脉，脉通到皇陵底下，动了它，陵里的东西就要出来。","引":"「井不深，人心深；锁住的不是龙，是那道口子。」"},{"类":"地理","名":"铜驼陌","卷":21,"文":"铜驼陌是一条夹在两条大街之间的窄巷，巷口立着两只铜驼，驼身被摸得发亮。此地原是前朝的官市，国灭后败落成一片混杂的市口：白日卖旧书旧器，夜里卖别的。巷中有个不成文的规矩：铜驼之下不议价，出了铜驼便不认账。故讨价还价都在驼影外头，谈妥了才进去取货。巷子最深处的墙上有半幅壁画，画的是一队西来的商旅，画到一半忽然断了，断口处被人反复描过，谁也说不清是怕它断了，还是怕它接上。","引":"「铜驼不语，见惯了这城三百年的讨价还价。」"},{"类":"宗门","名":"白马书院","卷":22,"文":"白马书院在白马原边上，原是军中的义学，后来独立成一门，专教军阵与文书的合用之法。院中弟子一手执笔一手执刀，读书声与喊杀声混在一处。书院最有名的是「三日课」：三日之内，学生要在纸上打完一场仗，纸上的每一个数字都要有粮草、道路与死伤作支撑，最后一日由老山长亲自批。批得最狠的一句是「纸上无人」——意思是这仗看着好看，只是没死人。书院出过七位兵部尚书，也出过三位因纸上轻动而误了万人的罪臣。","引":"「纸上也能死人，只是死的人不知道该找谁。」"},{"类":"宗门","名":"百工监","卷":22,"文":"百工监掌天下营造、器物与机关，监中设九作：木作、石作、金作、漆作、织作、陶作、机作、符作、骨作。九作各有一位大匠，地位不高，脾气极大。监中造过的东西极杂：宫城的门轴、观星台的铜铃、机关兽、还有能自己走的灯笼。百工监有一条祖训：凡造之物，须留一处可以拆。这条祖训救过不少人的命，因为城中有几次大祸，都是靠拆开某样东西才止住的。近年机作的大匠在造一件不肯说名字的东西，监里人只听见后院整夜有金属磨石的响声。","引":"「造得出的是器，造不出的是分寸。」"},{"类":"地理","名":"天枢台","卷":23,"文":"天枢台在皇城东北角，形如一座倒扣的钟，台高三层，上头只悬一只巨大的铜铃，铃舌是一根悬空的铁针。此台不看天，看风：风从何处起、带不带土腥、有没有雷意，都在铃上显出。天枢台的值守最难，铃响一声是常风，响三声是异风，响到九声便要报钦天监与镇抚司。三十年前铃曾响过十一声，那一夜城外的河堤决了，水没到城根。台上不许点灯，也不许说话，因为人一开口，风便被搅乱了。值守的老吏说，他在台上听过一次铃自己响，响的时候一丝风也没有。","引":"「风未至而铃先动，是风在别处，还是铃在别处。」"}],"事件":[{"id":"zhongzhou_001","题":"御街拾图","类":"机缘","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["秋雨落在大衍城{地名}的青石板上，{人物}缩在檐下数着怀里的碎灵石，忽见一乘无牌车驾碾过积水，车轮翻起的水花里浮出半张油纸——那是{器物}的一角，墨线勾出的山川里，九条地脉像九条蜷伏的赤蛇，笔画老辣得不像今人所绘。","他把油纸收进袖中，街角便响起铁靴声。两名{人物}提着灯笼沿街搜检，口称今夜{天象}，钦天监丢了要紧之物。灯笼光扫过来时，他借着檐下积水看清纸上有一处朱批，写的是某位{宗门}的名号，字边还沾着一星未干的铜红。","他退到{地点}的阴影里，那张纸贴着心口像一块烧红的炭。往前是九门盘查，往后是死巷，头顶一只{妖异}的影子掠过檐角，而那乘无牌车驾，此刻正停在巷口，车轮一动不动。"],"择":[{"名":"上交监司","文":"他把油纸交到钦天监的门房，只说拾于御街。次日有人递给他一囊灵石，另附一句「不必再问」。此后他在京中行走，盘查之多了一分客气，也多了一分目光。","果":{"灵石":120,"声望":6,"因果":1}},{"名":"私藏出城","文":"他连夜从宣阳门混出城去，把图裱在腰间。三个月中他凭着图上的水脉找见两处细脉，修为涨得飞快；却在第七次出城时被人揭了底，从此不敢再回京畿。","果":{"悟性":3,"修为":160,"因果":2,"声望":-8}},{"名":"当街焚图","文":"他借檐下一盏油灯把纸点了，火苗窜起时竟有一声极细的哭音。灰烬散去，他心口一阵清明，仿佛卸下了什么；只是一宿过后，他再也想不起图上的山川形状。","果":{"道心":3,"悟性":1,"灵石":-20}}]},{"id":"zhongzhou_002","题":"九门钟鼓","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[0,6],"段":["子时三刻，{地点}上的铜钟自鸣九声，鼓楼随即应了九下，声浪推开雾气，一路推到{地名}尽头。巡夜的{人物}脸色发白，说这调子是封城之音，今日并无诏令。","{人物}挤在人群里看热闹，只听一位白发老者低声道：这钟不是人敲的，是{天象}压得钟架子自己响。话音未落，城楼上一条{妖异}般的气影缓缓升起，盘作九折，把整座王城的屋脊照得发青。","镇抚司的人马已经登城，火把排成一线。守门的校尉传话下来：今夜城中不许走动人。人群渐散，唯有{地点}的台阶上还坐着一个人，怀里抱着个鼓槌大的{器物}，抬头问他敢不敢上城楼看个究竟。"],"择":[{"名":"上城观气","文":"他随那人上了城楼。气影近看竟是一条真龙的残魂，蟠在{地名}上空已不知几百年。他把手按在雉堞上，只觉得一身的经脉被那气压得嗡嗡作响，三日之内不能运功，却记住了龙气的走势。","果":{"悟性":2,"修为":120,"气血":-30,"因果":1}},{"名":"闭门守夜","文":"他退回客栈，一夜没敢出门。天亮时钟声停了，街上多了七具盖着草席的尸首，都是夜里在城中走的。他活着，也从此知道这王城的夜不属于人。","果":{"道心":1,"寿元":3,"声望":-2}},{"名":"追那鼓槌","文":"他认出那鼓槌是钦天监的报时法器，追问之下被人塞了五十块灵石封口。他收了灵石，却也在当夜被人记下了样貌，往后出城过门，总要被多看两眼。","果":{"灵石":50,"因果":2,"声望":-3}}]},{"id":"zhongzhou_003","题":"拍卖末席","类":"市井","重":4,"域":["zhongzhou"],"境界":[0,4],"段":["万宝城的拍卖会开到第九日，{人物}只买得起末席的一张竹凳。台上掌事的{人物}抖开一卷旧帛，说是从{地点}底下起出来的{器物}，底价三百灵石，无人应声。","他看出帛上一圈圈墨痕其实是龙脉的走向，与行脚的{人物}闲谈时听过的说法一致。刚举牌，二楼帘后便有人跟价，一跟便是三倍。他抬头望去，帘子后伸出一只戴玉扳指的手，扳指上刻的是{宗门}的印。","价越抬越高，掌事的笑越来越淡。末席的人都明白，这帛不是在卖，是在钓人——{地名}的旧货从不入拍卖，能上这一台，背后必有人想看看谁会伸手。他怀里的灵石只够再叫一次，而帘后那只手已经停了，仿佛就等他开口。"],"择":[{"名":"倾囊夺帛","文":"他把最后一注叫了出去，帛卷到手，袋中空空。出门时两个汉子跟了三条街，被他用一卷假货换下。真正的帛他连夜拓了图，拓完便烧，可那笔债他记了整整一年。","果":{"灵石":-400,"悟性":3,"因果":1,"声望":4}},{"名":"停手观局","文":"他放下牌子，只看。帛最终被帘后之人以九倍价买走，散场时钟漏已过三更。掌事的却悄悄塞给他一枚{器物}，说看局看得久的人，才值得交。","果":{"灵石":60,"悟性":1,"声望":3,"因果":1}},{"名":"截胡转手","文":"他提前离场，托一名{人物}带话给帘后之人：帛上第九道水脉是假的。第二日那人果然寻来，给了他一大笔灵石换一句实话。至于假在何处，他自己也没看明白。","果":{"灵石":500,"魔念":1,"因果":2,"声望":-5}}]},{"id":"zhongzhou_004","题":"锁龙井下","类":"秘境","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["龙脉司的老匠人说，{地名}底下有一口{地点}，井口用九枚{器物}镇着。井水已干了三百年，近来却有雾气自井壁往上爬，街坊夜夜听见水声，都说那是{天象}将至的先兆。","他随匠人下了井。井道盘曲，越往下石壁上的刻痕越密，尽是历代镇脉者的名与年号。走到第七层，脚下一具枯骨横着，指骨还扣在最后一枚{器物}上，钉头已经松了半寸，缝里渗出细细的{灵材}。","匠人跪下去摸那枚钉，忽然说：钉子一拔，这条脉就再也镇不住，可若是留着，脉气便要从{地点}底下漏去城外。他把手按在钉上，听见井底有东西极缓慢地抬起了头。"],"择":[{"名":"拔钉泄脉","文":"他拔了钉。井底先是一阵长叹，随即九道雾气散入城中，龙脉之气一夜疏散，城里人人神清气爽，家家檐下开出一朵白花。而他此后每遇雷雨，脊背便如被钉穿一般疼。","果":{"修为":300,"悟性":2,"气血":-60,"因果":3}},{"名":"重钉入石","文":"他咬破手指把钉按回原处，钉身饮血，一寸寸嵌进石里。井底的声音低了下去。爬回地面时他少了两成修为，却得匠人一句：这条脉记住了你的名字。","果":{"修为":-120,"声望":8,"因果":-2,"道心":2}},{"名":"取骨上物","文":"他不肯动钉，只从枯骨手里取下一枚残留的{灵材}——那是前代镇脉者以身化成的髓。带了回去炼入丹田，修为涨得极快，只是夜夜梦见有人在井底喊他的名字。","果":{"灵石":80,"修为":200,"魔念":2,"寿元":-8}}]},{"id":"zhongzhou_005","题":"诏书誊抄","类":"人情","重":3,"域":["zhongzhou"],"境界":[0,4],"段":["中书省的旧吏病倒在值房，三百份诏书压在案上，天亮前必须誊清。{人物}被人拉来顶差，笔是{器物}笔，墨是掺了{灵材}的御墨，落纸便发微光，一个字写错便再也改不掉。","写到第七十份，他发现两份诏书的措辞只差一字：一份说「查勘」，一份说「清剿」，所指的是同一个{宗门}。送文的{人物}低头催他快写，眼神却时不时飘向门上那盏灯。","窗外的{天象}压在宫墙上，值房的烛火一跳。他握着笔，笔尖悬在那一个字的空处，墨珠将落未落——这一笔下去，明日{地点}外或许要多出几百条人命。"],"择":[{"名":"照抄如仪","文":"他一字不改地抄完，天亮交卷，手抖得握不住杯。三日后邸报上登出一段剿抚的消息，没有名字，只有数字。他升了半级，也从此再不敢在值房里看窗外。","果":{"灵石":90,"声望":6,"因果":2}},{"名":"两卷俱废","文":"他故意打翻砚台，污了那两份诏书。重抄之令拖了三日，那{宗门}得信散去大半。上头查不出是谁的手，只把他赶出了中书省，他从此在京中做了个走街的抄书人。","果":{"道心":3,"声望":-5,"因果":-3,"灵石":-60}},{"名":"密告其宗","文":"他把那一个字的差别写在纸上，托人送进{地点}。那宗门连夜上表自陈，反把一批对手拖下水。他得了两封谢礼，却不知谁在暗处记下了他的名字。","果":{"灵石":240,"因果":3,"魔念":1,"声望":2}}]},{"id":"zhongzhou_006","题":"雷堂试法","类":"修行","重":2,"域":["zhongzhou"],"境界":[2,8],"段":["太虚山雷堂三年一开，{人物}持荐书入山。堂前石阶三十三级，每一级都埋着一道引雷之纹，踏错一步便要被{天象}般的雷光从头浇到脚。引他上山的{人物}只说：走过去，别抬头。","走到第二十级，雷声就在他耳边炸开。他修的是{功法}，此刻经脉里的气与雷纹相冲，半步也挪不动。阶顶有人击了三下铜铃，算是弃权的提示，山风把铃声吹到脚边，像一句轻飘飘的劝。","他跪在阶上，看见石缝里长着一株被雷烧焦又抽新芽的{灵材}。雷堂执事的声音从头顶落下来：抬头的死，低头的退，你要哪一样。"],"择":[{"名":"抬头承雷","文":"他抬头，雷柱当场落下，把他整个人钉在阶上。三日三夜，他的经脉被冲断了又接回，接回之后竟比原先宽了一倍，从此行雷气如行水。只是这一身雷伤，每逢阴天便发作。","果":{"修为":320,"气血":-80,"悟性":3,"声望":5}},{"名":"叩首退阶","文":"他叩首退下，一步一步走回山脚。执事没有为难他，还赐了一卷{功法}残页，说知进退的人才有下次。他在山下坐了三年，把那残页读透，反倒比自己原来走得更稳。","果":{"悟性":2,"道心":2,"修为":60,"声望":-3}},{"名":"折道旁灵材","文":"他伸手折了石缝里那株灵材，雷纹霎时尽灭，整条石阶暗了下去。他得了宝贝，也断了雷堂三年一开的机缘。执事只看了他一眼，说：你带走的不是草，是三百人的路。","果":{"灵石":200,"修为":120,"因果":3,"声望":-8}}]},{"id":"zhongzhou_007","题":"天机三问","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[0,9],"段":["天机阁的门不朝南，只朝{地点}。{人物}在门外站了七日，第八日门开了，一个瞎了眼的录史请他入内，案上只摆了一枚{器物}和一碗清水，说楼中只答三问，问完收价。","第一问他问了前程，录史拨了拨{器物}，说：你能活到看见{天象}的那一年。第二问他问了宗门兴衰，录史笑了，说这话不该由一个{人物}来问。第三问他还没开口，录史先抬头，明明瞎着，却像看进他眼底。","案上的清水忽然起了纹，纹路慢慢排成一个人的样子，又散开。录史说：第三问你若问自己的来处，我要你三十年寿元；你若问别人的去处，我只收你一句话。窗外{地点}的钟正好敲响。"],"择":[{"名":"问己来处","文":"他舍了三十年寿元。录史翻开一册无名簿子，念了三行，他听见自己父母的名字，也听见一个本该早就死了的人的名字。走出天机阁时他须发白了一半，却知道自己该往哪里去。","果":{"寿元":-30,"悟性":4,"因果":-2,"道心":2}},{"名":"问人去处","文":"他开口问了那个人的下落，录史便只说了一句话：他在{地点}底下，还活着。这句话轻得像叹息，他却当场出了一身冷汗。此后再见那人一面，他便要多付一次代价。","果":{"悟性":2,"因果":3,"魔念":1,"灵石":-100}},{"名":"转身不问","文":"他把清水推回去，说三问换三缄。录史怔了怔，忽然大笑，说楼里三十年没遇上这样的人，便送他一枚空白签牌——此后每逢天机阁有大会，他可入场旁听，只是不许说话。","果":{"道心":3,"声望":5,"因果":-1}}]},{"id":"zhongzhou_008","题":"白衣巷刺","类":"争斗","重":3,"域":["zhongzhou"],"境界":[1,6],"段":["{地点}的巷子只容两人并行，墙上爬着一种会咬人的枯藤。{人物}提着一盏纸灯往巷深处走，灯上的火是{灵材}点的，能照出三尺内的血气——今夜它照出了两道。","两道人影一前一后，前面那个披着斗篷，腰上挂着一枚{器物}；后面那个走得很轻，脚不沾尘，是位专职的{人物}。斗篷人忽然停步，转过身来，露出一张他认得的脸：那是三日前在金殿廷议上说话的{人物}。","刺客已经抬手，指尖一点冷光。斗篷人却不看他，只对巷口的{人物}说：你若替我挡这一下，明日{地点}的位子归你。巷上空的{天象}正压下来，把三个人的影子拉得很长。"],"择":[{"名":"挡下此击","文":"他扑上去替那人挡了一指，冷光穿肩而过，整条手臂三个月抬不起来。次日他果然得了一个位子，只是每逢阴雨，那处伤口便会自己渗出一点黑血，像是还没死透。","果":{"声望":10,"气血":-70,"灵石":180,"因果":1}},{"名":"退让观变","文":"他退到藤后，看着那一击落下，斗篷人倒地，刺客转身便走。他记住了刺客的步法，也记住了自己那一夜的怯。三日后他凭这条线索换了一份差事，却总觉有人在背后看他。","果":{"悟性":1,"灵石":120,"道心":-2,"因果":1}},{"名":"反手擒刺","文":"他弃灯出手，与刺客在窄巷里缠了七招。刺客的刀法出自{功法}一路，被他认出，反手扣住命门。斗篷人冷冷道：留活口，我要知道是谁递的刀。","果":{"修为":150,"声望":6,"因果":2,"气血":-30}}]},{"id":"zhongzhou_009","题":"金龙昼眠","类":"天象","重":2,"域":["zhongzhou"],"境界":[0,7],"段":["自{地名}往北望，天边有一条金龙盘着不动，白日里竟能看见鳞片上的光。钦天监贴出告示说这是国运安泰之象，{人物}却在城门口听见另一个人低声说：龙不动，是在睡，睡着的龙最容易被拔鳞。","他上了{地点}，果然看见那条金龙的鬃毛间插着七枚黑钉，钉尾还有未干的{灵材}。一位{人物}正在退远，手里牵着一条细如发丝的线，线的另一端通进城南的{宗门}。","云影移动，龙鳞的光暗了一瞬。{天象}之下，整座王城的屋檐都泛着金边，而那个人已经转进巷子，只留一枚{器物}落在瓦上当响。他有半炷香的时间决定要不要追。"],"择":[{"名":"追入巷中","文":"他追进巷子，那人回头一笑，说自己只是奉命行事。两人过了三十招，他中了一记暗掌，却也扯下对方一角衣袖，袖口绣着{宗门}的暗纹。这条线索后来换了他半生前程。","果":{"修为":140,"气血":-50,"悟性":2,"因果":1}},{"名":"拾瓦上物","文":"他拾起那枚{器物}便走，一日之内就被人寻上门来赎。他把东西还了，收了赎金，也答应今夜看见的事一句不提。从此他知晓这城里的规矩：看见的多，说出的少。","果":{"灵石":260,"因果":1,"道心":-1}},{"名":"登楼告监","文":"他奔去钦天监击鼓，监副听完只问了一句：你确定看见的是钉？他答确定。当夜七枚黑钉被取下，金龙腾空三日。他得了赏，也被人记在了簿子上。","果":{"声望":8,"灵石":150,"因果":-2,"魔念":0}}]},{"id":"zhongzhou_010","题":"白马原战","类":"争斗","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["{地名}的草长得比人高，风一过便露出底下的白骨。皇朝征来的修士列成九阵，阵前悬着{器物}，阵后立着一名披甲的{人物}。他这队人被编在第七阵，只管听鼓。","鼓响三声，对面山坳里涌出的不是兵，而是一群{妖异}。阵后那位{人物}却迟迟不举令旗，像是要等第七阵先死一批。同行的{人物}骂了一句，说这一仗打的不是敌军，是各家的势力。","令旗终于落地。{天象}压在原上，把九阵的影子拉成一片。他手里的兵刃已经在响，退是军法，进是死地，而侧翼那条无人看守的坡道，通向{地点}。"],"择":[{"名":"死守本位","文":"他守在第七阵，从午后杀到日落，阵中的人换了两轮。天黑时他活了下来，背上添了三道疤，也添了一身说不清的名声。班师之日，他领到的赏银只够买一副好甲。","果":{"修为":220,"气血":-90,"声望":6,"灵石":80}},{"名":"从坡道走","文":"他带着两个同乡从侧坡溜下去，绕到{妖异}群后烧了对方的粮车。这一手解了九阵之围，也违了军令。论功时他被抬得很高，转头又被人以临阵之名罚了一年军俸。","果":{"声望":10,"修为":120,"灵石":-60,"因果":1}},{"名":"夺旗自立","文":"他一刀斩了不发令的旗官，抢过令旗改令为守。九阵勉强撑到援军抵至。战后他升了校尉，也从此结下了一个不共戴天的仇家，那人现在管着{宗门}的钱粮。","果":{"声望":14,"灵石":200,"因果":3,"魔念":1}}]},{"id":"zhongzhou_011","题":"监中星图","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[1,7],"段":["钦天监的{地点}上有一面石墙，刻着九州三百年的星图。{人物}夜里去修补漏雨的瓦，发现墙上有九颗星自己挪了位，挪出的形状像一枚{器物}的轮廓。","监副领他去看，说星图三十年一校，上一次校在皇帝登基那年，校完的第二年便有了{天象}。他伸手去摸那几颗新挪的星，指腹上沾下一点湿，那是血，还没干透。","次日清晨，监正的座案上多了一封奏疏，说星图之变主一域易主。他站在廊下，看见一顶青帷小轿抬进{地点}后门，轿里坐着的正是那位上疏的{人物}。"],"择":[{"名":"改回星位","文":"他趁夜把九颗星刻回原位，用的是自己的血。次日星图如旧，谁也没看出异样。可他知道，那一夜他改的不是天象，是一封能把人送进{地点}的奏疏。","果":{"因果":-2,"道心":2,"寿元":-6,"声望":3}},{"名":"照抄献上","文":"他把挪动的星位一一抄下，暗中送去了{宗门}。三个月后那场上疏无疾而终，监正被贬。他得了一份差，也背上了一个字：叛逆的代价。","果":{"灵石":200,"悟性":3,"因果":3,"魔念":2}},{"名":"闭口不言","文":"他补完瓦便走，一句不说。此后再看星图，那些星已然归位，唯独第九颗还偏着半分。他把这半分记在心里，一记就是十年。","果":{"悟性":1,"灵石":40,"因果":0}}]},{"id":"zhongzhou_012","题":"丹凤门车","类":"人情","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["{地点}每日只开两个时辰，门外的车驾排到御街转角。{人物}赶着一辆破车，车里坐的是位被召见的{人物}，怕见官，非要他做车夫。车帘边挂着一枚褪色的{器物}。","等到日头偏西，门内出来一位内侍，扫了一眼破车，脸上笑意淡了三分，说今日名额已满。那位{人物}掀帘的手停在半空，车外恰有{天象}，光落在他脸上，看得出已经老了很多。","他忽然想起，城门校尉的先人，是这位老人在二十年前从{地点}的雪地里背出来的。他把车赶上前去，说了一句话，那校尉的手抬了起来——开不开这道门，只在他这一句。"],"择":[{"名":"报旧恩","文":"他把二十年前的旧事当众说了一遍。校尉脸色数变，终究抬起手放了行。老人进去不到半炷香便出来了，事情没办成，却在车上对他深深一揖，那揖重得压了他许多年。","果":{"声望":6,"因果":-2,"道心":2}},{"名":"收钱办事","文":"他趁老人还在车里，先向校尉递了一囊灵石，说是车资。门开了，老人事情办成，回头却什么也没给他。他赚了两头，也从此被{宗门}的门房看作能用的手。","果":{"灵石":180,"因果":1,"声望":2}},{"名":"掀帘揭丑","文":"他掀开帘子，把老人递来的银票丢在车前，说宁可不做人情也不欺这个门。围观者一片哗然，门是开了，他却从此在本城再没接过一趟活。","果":{"道心":3,"声望":-4,"灵石":-70}}]},{"id":"zhongzhou_013","题":"纸上人行","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[0,6],"段":["入夜后{地点}的铺子纷纷落板，只余一盏孤灯。{人物}看见街心走来一队人，穿着官服，面目却是一片空白，纸糊的衣角在风里擦出沙沙的响声，脚底都踩不实。","那些{妖异}径直走向{宗门}的粮仓。他数了数，一共三十二个，数目正与日前被征走的三十二名壮丁相同。{天象}照下来，纸面上竟浮出一个个名字，其中有他认识的一个。","为首的纸人在仓门前停下，慢慢转过头来，脸上的空白处正在长出一张嘴。{天象}照在巷子里，街角的更夫已经不敲梆子了，整条巷子静得能听见纸页摩擦的声音。"],"择":[{"名":"焚符断路","文":"他烧了一张{器物}上抄来的符，火光过处，纸人成排烧起，火里传出三十二声极短的喊叫。粮仓保住了，他也从此在夜里听见纸响便惊，睡不安寝。","果":{"修为":160,"气血":-40,"因果":2,"声望":4}},{"名":"喊破其名","文":"他照着纸上浮出的名字，一个个喊了出来。喊到最后一个，纸人尽皆伏地，化成纸灰。次日他去寻那三十二家的人，告诉他们人是死了还是走了，得了满城的香火人情。","果":{"声望":9,"悟性":2,"因果":-2}},{"名":"看其入仓","文":"他站着没动，看着纸人走进粮仓。次日仓里三万石御供灵米尽成灰白。他被叫去问话，说得很清楚，一个字也没添。问话的人赏了他，也留了一份卷宗提着他。","果":{"灵石":120,"道心":-1,"因果":2}}]},{"id":"zhongzhou_014","题":"宗子之争","类":"宗门","重":3,"域":["zhongzhou"],"境界":[0,6],"段":["{宗门}的宗子之位空悬三年，族中两房斗得厉害。{人物}是旁支里最没分量的一支，只在{地点}管着族里的旧档，谁也没料到有人会来找他。","来的是长房的一位{人物}，带了一卷旧档的拓本，说只要他在族会上作证，证明二房嫡系的生辰有伪。那卷拓本上的墨色他一看便知真假——他亲手抄过的档，纸是他铺的。","族会就在明日{地点}，{天象}笼着整座祖宅。长房许他一座田庄，二房许他一条活路。他把拓本放在灯上，火还没点着，门外已经有两拨人候着了。"],"择":[{"名":"焚拓明真","文":"他在族会上烧了拓本，把真档摊在案上，两房俱废宗子之议。族中长辈沉默良久，把宗祠的钥匙交到他手里，说他虽无血脉之贵，却有传家之重。他此后再不能出{地名}半步。","果":{"道心":3,"声望":8,"因果":-2,"寿元":-4}},{"名":"从长房言","文":"他照长房的意思说了，二房嫡系被黜。他得了一座田庄、三千灵石，也从此在族中抬不起头。此后每逢族祭，他都排在最后，跪在最外侧。","果":{"灵石":400,"声望":4,"因果":2,"道心":-2}},{"名":"两不相帮","文":"他当夜收拾旧档，走出{地名}，谁也没带走。三年后两房斗得两败俱伤，宗子之位落在个七岁的孩子身上。他回乡时，那个孩子认他做了先生。","果":{"悟性":2,"道心":1,"灵石":-50,"寿元":6}}]},{"id":"zhongzhou_015","题":"御米之案","类":"市井","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["御供的{灵材}年年从{地名}十八州运来，粒粒要过秤。今年过秤的却在{地点}查出一批掺了赤壤的陈米，押运的{人物}当场被锁了，主事的是位{人物}，姓甚名谁没人肯说。","他去牢里送饭，那押运的只说：米是从{宗门}的仓里换的，换米的单据在漕渠河的一条船上。话没说完，牢头便在外头咳了一声，铁链响了两下。","他把那半碗饭放下，出门便见{天象}，满天赤气像血一样漫过屋脊。漕渠河离此不过三里，可三里之内有三道关卡，今夜一旦踏出去，便再没有退路。"],"择":[{"名":"夜取单据","文":"他摸黑进了漕渠河，从第三条船的舱底摸出一包单据。天亮时案发，主事的{宗门}被罚了一年供奉，他也被人从这一行彻底赶了出来，只能靠替人跑腿过活。","果":{"灵石":160,"声望":6,"因果":2,"道心":-1}},{"名":"暗中索赎","文":"他没有去取单据，而是把话带到{宗门}的门下。三日后押运的死在牢里，罪名是自尽。他收了三百灵石，这笔钱花起来总觉得烫手。","果":{"灵石":300,"魔念":2,"因果":3}},{"名":"上告御史","文":"他写了一纸诉状，投进了御史台的门缝。案子查了半年，牵出的官员有十一个，他也没能置身事外，被盘问了整整两月，最后什么也没捞着，只落得一身清白的名。","果":{"声望":8,"灵石":-40,"因果":-2}}]},{"id":"zhongzhou_016","题":"卜骨名字","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[1,7],"段":["城南的卜摊摆在一棵老槐下，摊上只放一枚{器物}，骨上刻满细纹。{人物}路过时，那卜者忽然抬头说：你来得正好，这骨上今晨自己浮出一个名字。","他低头看，骨上果然是自己的名字，刻得极深，笔画里还有血。卜者说这是死人书，写好的人活不过这个冬天。不远处{地点}的鼓声正敲，街上的人来来往往，没有一个回头看他们。","{天象}压低了云。卜者又摸出第二枚骨头，说想改命只有一个法子：把名字换到别人骨上。那个人必须与你同生辰，且在你眼前走过。街上恰有一人停下脚步，正望着他们。"],"择":[{"名":"换名与人","文":"他把名字换到了那人骨上。那年冬天他过了个安稳冬，只是城外传来一桩无名的冻毙。他再没去过城南，也再没敢问那具尸首是谁。","果":{"寿元":8,"魔念":3,"因果":3,"道心":-3}},{"名":"持骨问天","文":"他把骨头抱在怀里，去了{地点}，在雪里坐了一整夜。天亮时骨头裂成两半，名字也散了。他活下来，多了一道疤，也多了一分看破生死的冷。","果":{"道心":3,"修为":100,"气血":-50,"寿元":3}},{"名":"砸摊毁骨","文":"他一拳砸了卜摊，骨头碎在石板缝里。卜者没有拦，只说碎了骨头，债还在。此后三个月他夜夜听见有人在门外念他的名字，一次比一次近。","果":{"悟性":1,"因果":2,"气血":-20,"灵石":-30}}]},{"id":"zhongzhou_017","题":"太虚道会","类":"宗门","重":2,"域":["zhongzhou"],"境界":[2,10],"段":["十年一度的道会开在{地名}，九州三十七家的修士云集{地点}。{人物}持一枚偏门的荐牌入席，看见主位上坐着三位：一位是{宗门}的化神长老，一位是皇朝的亲王，一位是万宝阁的大掌事。","道会论的是一道题：气运究竟属于谁。长老说属于道，亲王说属于国，掌事说属于能出价的人。台下有人笑，有人低头。论到第三日，{天象}忽起，台上三人同时看向门外的云。","第四日有人递上一卷{功法}，说是前朝遗留，愿以此换一个承诺。卷子在三人之间传来传去，最后停在{人物}面前。满堂的呼吸都轻了，等他这个无名之辈如何处置。"],"择":[{"名":"当众开卷","文":"他把卷子当众展开，里面只有半篇，另半篇被人裁去。满堂哗然，三家的脸色各变。他因此得罪了所有人，也成了唯一一个什么也没拿的人，此后十年无人邀他赴会。","果":{"声望":-4,"道心":3,"悟性":3,"灵石":-100}},{"名":"献与道宗","文":"他把卷子双手奉上，道宗长老收了，另赐他一枚记名玉牌，许他日后上{地名}听讲。他从此走进了一扇门，也从此在皇朝的名册上被记了一笔。","果":{"声望":8,"悟性":2,"修为":200,"因果":1}},{"名":"私拓后焚","文":"他借着递卷的空隙拓了一遍，回去烧了原卷，说卷子被风吹进了香炉。三家彼此疑心，道会不欢而散。他手里那半篇功法，字迹在三年后开始自己褪去。","果":{"悟性":4,"修为":240,"魔念":2,"因果":3}}]},{"id":"zhongzhou_018","题":"漕渠血水","类":"灾祸","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["漕渠河的水一夜之间变红，{地点}的码头停了三十条船，无人敢上货。管事的{人物}说这是上游冲下来的赤壤，天热发色，无害。可打上来的鱼都翻了白肚，死得干干净净。","他绕到上游去，看见一处新挖的渠口，泥土里混着{灵材}的碎末，还有一股极淡的腥。渠旁站着两个{人物}，正把一具用草席裹着的东西往水里推。","{天象}照着河面，血色的水纹一路铺到{地名}城墙下。草席沉下去之后，河底有一样东西翻了个身，把整片水搅得发响。他伏在芦苇里，手里只有一枚{器物}。"],"择":[{"名":"下水捞尸","文":"他下水把草席拖了上来，席里是个穿官服的年轻人，怀里揣着半张单据。单据上写着{宗门}的名。他把尸首藏进破庙，这件事后来掀翻了半座城的官。","果":{"悟性":2,"因果":3,"声望":6,"气血":-40}},{"名":"记录在案","文":"他把所见一笔一笔写下来，托人送去天机阁。楼里收了他的稿，付了酬，说三十年后会有人读。他活得很安稳，只是每次经过河岸，都觉得那具尸首还在看。","果":{"灵石":150,"因果":0,"道心":1}},{"名":"受钱闭口","文":"岸上的人发现了他，递来一囊灵石，他只点头。那条渠三个月后被填平，河里的鱼再没回来。他在城中过得不差，只是从此不吃鱼。","果":{"灵石":320,"魔念":1,"因果":2,"道心":-2}}]},{"id":"zhongzhou_019","题":"气运秤","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[1,8],"段":["万宝阁的内堂摆着一杆{器物}，据说是能称气运的。{人物}被引进去时，掌柜的正把一枚{灵材}放上秤盘，秤杆一沉，堂里的烛火全矮了半寸。","掌柜的请他上秤。他犹豫着站上秤盘，秤杆却不起不落，平平地悬着。掌柜的脸色变了，说三十年来只见过两个人站上去秤不动，一个是皇朝的太子，另一个现在躺在{地点}底下。","堂后帘子响了一声，走出来的是位{人物}，手里捏着一串与我同年的生辰竹牌。掌柜的低声说：秤不动的人，要么是无运可称，要么是运在别处。你要留下，还是现在走。"],"择":[{"名":"请秤国运","文":"他反手把秤盘指向堂外，说要称的是这城的气运。秤杆猛地一沉到底，铜盘裂了一道缝。掌柜的当场封了内堂，第二天万宝城所有的货价都涨了三成。","果":{"悟性":4,"声望":8,"因果":3,"灵石":-80}},{"名":"买下此秤","文":"他把身上所有灵石倒在案上，要买这杆秤。掌柜的看了很久，收了一半，把秤给他。此后他行走九州，替人称了七次气运，第七次之后秤再没动过，他也再没称过自己。","果":{"灵石":-300,"器物":1,"悟性":2,"因果":2}},{"名":"退堂而去","文":"他下了秤盘，一言不发地走了。掌柜的没有留。三年后此城大乱，万宝阁内堂被劫，那杆秤不知去向，他庆幸自己当年没在那张案前多站一刻。","果":{"道心":2,"寿元":4,"灵石":40}}]},{"id":"zhongzhou_020","题":"镇抚夜巡","类":"争斗","重":3,"域":["zhongzhou"],"境界":[1,7],"段":["九门镇抚司的夜巡分九队，每队持一枚{器物}，走到子时须在{地点}交牌。{人物}今夜替人值勤，队伍里新添了一个面生的{人物}，走路没有声音。","走到第三更，前面巷子里传来金属刮石的声音。队长抬手示意停步，那面生的却不听，径直往前走，嘴里念着一段不属于人间的调子。{天象}之下，他的后颈泛出一层青。","队长低声说：这是{妖异}借了人的皮。按规矩当场格杀，不问来历。可那皮囊下的东西忽然开口叫出了{人物}的名字，还说了句只有家中人才知道的话。"],"择":[{"名":"依令格杀","文":"他先动了手。刀落之后，皮囊塌成一张空皮，血是黑的。队长记了他的功，赏了牌。他回营那夜没睡，一直想着那声唤名，想着它到底是从哪里听来的。","果":{"修为":130,"声望":6,"因果":2,"道心":-1}},{"名":"留其活口","文":"他拦下队长的刀，逼那东西开口。那东西说了三个字，是一个地名，说完便自燃成灰。他因违令被罚了半年军俸，却记住了那个地名，后来在那里挖出一座旧观。","果":{"悟性":3,"灵石":-80,"因果":1,"魔念":1}},{"名":"弃牌独走","文":"他把交牌的差事丢下，独自跟那东西走了三条街。天亮时他回来了，带回一只断了的手，指节上纹着{宗门}的标记。队伍的人都当没看见他，从此也没人再叫他值夜。","果":{"悟性":2,"因果":2,"声望":-3,"修为":90}}]},{"id":"zhongzhou_021","题":"封禅旧台","类":"秘境","重":2,"域":["zhongzhou"],"境界":[2,9],"段":["{地点}在{地名}北郊，台基三层，草长过膝。前朝在此封禅，后来国灭，台便荒了。{人物}来此寻一味只长在旧台石缝里的{灵材}，却在第三层看见一圈新踩的脚印。","台上立着一方无字的碑，碑前的土被翻开一半，露出底下一口铜箱。箱盖上有九道锁纹，纹路与{器物}上的一模一样。他伸手一触，整座台下响起极低的诵声，像有很多人同时念一段{功法}。","{天象}忽至，云压得极低。诵声渐急，台基的裂纹里有金气溢出。他知道这箱子里装的不是宝贝，是前朝没能带走的东西；而脚下这三级台，正是{地名}龙脉最深的一处穴眼。"],"择":[{"名":"开箱取物","文":"他撬开铜箱，里面只有一捧土和一枚残印。土是{灵材}，印是玉玺的一角。他把两样都带走，此后二十年官运亨通，也二十年不敢再回此地。","果":{"灵石":600,"修为":180,"因果":3,"魔念":2}},{"名":"填土封碑","文":"他把土推回去，用碎石压实，又对着无字碑磕了三个头。诵声停了。他什么也没得，出城的路上捡到一枚温热的石子，此后修行顺遂得有些反常。","果":{"道心":3,"悟性":2,"因果":-3,"修为":80}},{"名":"记下锁纹","文":"他不开箱，只把九道锁纹一一画在纸上，回城卖给了一位{人物}。买家看完图纸，脸色白得厉害，退了他一半钱，说这东西不该由活人画出来。","果":{"灵石":220,"悟性":2,"因果":2,"气血":-20}}]},{"id":"zhongzhou_022","题":"旱魃入城","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[2,9],"段":["三月不雨，{地名}城外的田裂成蛛网。钦天监说是{天象}所致，可{人物}在{地点}外的乱葬岗看见一具新坟被扒开，棺里的尸首坐起来了，皮肉干得像晒过的皮囊。","{妖异}顺着官道往城走，走到哪里，哪里的井就干。城门口排着求水的长队，一位{人物}在队前叫卖符水，一囊卖十块灵石，队伍却越排越长。城墙上的兵不敢放箭。","那东西停在了{地点}的牌楼下，抬头看城楼上的匾。他的{器物}在袖里发烫，热得几乎握不住。城里有人说该请{宗门}出手，也有人说该把城门关死，不管外头几千人。"],"择":[{"名":"独挡牌楼","文":"他一个人出了城，在牌楼下与旱魃缠了两个时辰。最后用{器物}钉进它的天灵盖，热气散尽，雨当夜就落了。他躺在泥里，全身的水像被抽干，此后一生畏热。","果":{"声望":12,"修为":260,"气血":-100,"因果":-2}},{"名":"请道宗援","文":"他一路奔上{地名}求援。太虚道宗来了两名雷堂弟子，三息之间便把旱魃烧成焦炭。城保住了，援手的功劳记在道宗名下，他只得了郡里一句褒奖和三十石灵米。","果":{"灵石":100,"声望":4,"因果":1}},{"名":"开城放人","文":"他劝守将开了侧门，把外头的百姓放进来大半，旱魃随之入城，烧了三条街。事后论罪，他挨了三十杖；论功，那三条街的人家至今供着他的长生牌位。","果":{"声望":8,"气血":-60,"因果":-3,"道心":2}}]},{"id":"zhongzhou_023","题":"天门大比","类":"宗门","重":4,"域":["zhongzhou"],"境界":[0,6],"段":["三年一度的大比开在{地点}，三十六座擂台同日开打，胜者可得{宗门}的荐书。{人物}抽到第七台，对手是个连走路都在打颤的瘦小{人物}，台下的人都以为这一场没看头。","上台三招，他便知道自己错了。那瘦子的拳法里藏着一路{功法}的余韵，出手极轻，落点却在经脉交汇处。第七招上，他膝弯一软，半个身子跪了下去，台下的哄笑像潮水一样涨起来。","他撑地起身，看见擂台边的榜上已经写好了对手的名字，墨还没干。裁判的手抬到一半。{天象}正从城头上掠过，把擂台的影子劈成两半——他还有一次机会，用最不体面的法子。"],"择":[{"名":"认输下台","文":"他举手认输，走下擂台时把对手的拳路记了个大概。此后他照着那路数自己推演，三年后在同样的台上一拳打穿了对手的护体气。那年他二十八岁，比旁人都晚。","果":{"悟性":3,"道心":2,"声望":-3,"修为":60}},{"名":"诈败反手","文":"他装着重伤，等对手近身时一把抱住对方撞下擂台，两人同落，判他输。台下骂声一片，可也有人记住了这份狠。荐书没拿到，倒被镇抚司看上，做了个不要命的差。","果":{"修为":100,"声望":-6,"魔念":2,"灵石":80}},{"名":"以命换胜","文":"他拼着废掉一条经脉，硬接了对手最后一记杀招，反手把人掀下台。荐书到手，他的右手从此不能再握剑。三年后他坐上了{宗门}的讲席，右手始终拢在袖里。","果":{"声望":10,"修为":200,"气血":-90,"因果":1}}]},{"id":"zhongzhou_024","题":"紫气东来","类":"天象","重":2,"域":["zhongzhou"],"境界":[1,10],"段":["清晨，{地名}东门外的天边漫起一层紫气，铺了半个时辰不散。城里的老人都说这是圣人出世的兆头，{人物}却看见钦天监的人连夜登了{地点}，把测风的旗全换了方向。","紫气进城之后，凡是气运深厚的人身上都浮出一层淡光。他在{地点}看见一位{人物}浑身亮得像灯，也看见一个落魄的{人物}周身灰暗，那人抬头看他，眼里竟有笑意。","到了午时，紫气忽然向着一处聚拢，聚在{宗门}的丹房上空。街市上的人纷纷跪了，只有他知道，那丹房里此刻正在炼的东西，是一炉能改气运的丹。紫气不是来贺的，是来抢的。"],"择":[{"名":"闯入丹房","文":"他挤进丹房，炉火已乱，两枚丹在炉里撞得叮当响。他伸手抢出一枚，另一枚炸成灰。那枚丹吞下之后，他浑身气运翻涌，行路处处逢源，只是每遇大事必先遭一场无妄之灾。","果":{"修为":240,"悟性":3,"因果":2,"寿元":-10}},{"名":"退而观气","文":"他不进丹房，只在门外看紫气如何流转，一看看了六个时辰。气归位时他闭目推演，竟摸出一道借气的门径。这一日他什么也没得，也什么也没失，只是从此看人先看气。","果":{"悟性":4,"道心":2,"修为":60}},{"名":"通报监司","文":"他把丹房的异动报给了钦天监。丹房被封，一炉丹全数充公。他得了一份赏银，也在万宝阁的账上多了一笔黑账——那炉丹本是人家的货。","果":{"灵石":260,"声望":5,"因果":2,"魔念":1}}]},{"id":"zhongzhou_025","题":"皇陵守灵","类":"人情","重":2,"域":["zhongzhou"],"境界":[0,6],"段":["{地名}的皇陵终年有兵把守，陵外三里有几十户守灵人。{人物}去送一车炭，在陵外的茶棚里遇见个跛脚老者，自称看守先帝的衣冠冢已有四十年。","老者请他喝一碗粗茶，说自己原是{宗门}的外门弟子，因为一句话被发配到此。他说陵里有一样东西不能碰：{器物}，压在先帝棺上，一碰，整座{地名}的脉气就要倒流。","夜里起了{天象}，陵园方向有火光。老者拄着拐站起来，忽然不跛了，腰间露出一枚褪色的行牌。他说：你要么跟我进去，要么现在就走，别回头。"],"择":[{"名":"随老入陵","文":"他跟着进了陵园。火是一伙盗墓贼放的，老者在火光里连出七掌，掌风中有雷意。贼人退尽，老者把一个空匣塞给他，说这里头本来有东西，四十年前就没了。","果":{"修为":180,"悟性":2,"因果":1,"声望":4}},{"名":"回车即走","文":"他赶着空车回城，一夜没停。第二天听说皇陵失了火，守灵人死了七个。他每年都往那个方向烧一沓纸，纸灰飘过去，半途就散了。","果":{"道心":-1,"寿元":5,"灵石":40}},{"名":"奔告守军","文":"他去报官，守军赶到时火已被扑灭，贼人一个没抓着。老者从陵门走出来，看他的眼神很平静，说：你这一报，我四十年的差事就算完了。此后他再没见过那老者。","果":{"灵石":120,"声望":3,"因果":2}}]},{"id":"zhongzhou_026","题":"巡天镜碎","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[2,10],"段":["{地点}上那面{器物}照的是九州九域的气脉，镜面一碎，九域的水旱便要乱了。{人物}今夜值守，瞌睡醒来，发现镜面上裂了一道细纹，裂纹正对着{地名}的方向。","监副赶到时脸色铁青，说这镜自前朝便在此处，从未裂过。查了一夜，只查出昨夜有人上过楼，留了一枚{器物}在角落，牌上没有一个字。","{天象}把整座观星台照得雪白。监副问他昨夜几时醒的，他答不出。天快亮了，补镜的法子只有一个：以心头血浇裂，三年之内不能行功。而报与不报，明日就是两份不同的卷宗。"],"择":[{"名":"以血补镜","文":"他咬破心口，把血抹在裂纹上，镜子慢慢合了缝，只留一道淡痕。此后三年他不能运功，便被调去看守旧档。三年后他再上楼，那道淡痕仍在，正对着他自己。","果":{"寿元":-12,"气血":-60,"声望":8,"因果":-3}},{"名":"据实上报","文":"他如实报了值守失察，挨了四十杖，官职降了两等。镜子换了新的，旧镜被送进库房。他后来在库房里见过一次那面旧镜，裂纹里嵌着一点黑，像眼睛。","果":{"气血":-50,"声望":2,"因果":1,"灵石":-60}},{"名":"查那铜牌","文":"他不报失察，只追那枚铜牌。查了三个月，查到{宗门}的一处别院，查到一半便被上司叫停，还得了五十灵石的车马费。此后他把铜牌收在箱底，再没拿出来过。","果":{"灵石":150,"悟性":2,"因果":2,"魔念":1}}]},{"id":"zhongzhou_027","题":"龙脉吐雾","类":"天象","重":2,"域":["zhongzhou"],"境界":[1,8],"段":["{天象}的说法在{地名}的老人口里传了几代：雾从九门底下冒出来的时候，要收人。今夜{地点}的石缝里果然渗出一层白雾，贴着地面往城南流，所过之处狗不叫、灯不亮。","龙脉司的{人物}带着罗盘赶到，说这是地肺换气，雾里有龙脉的余息，沾得多了会经脉逆行。雾流到{地点}的巷口，巷子里还有二十几户没搬，里面有几个正在闭关的{人物}。","罗盘上的针疯转。匠人说只有两个法子：一是封巷，把雾闷在里头；二是引雾入渠，冲进漕渠河，但那渠通着{地名}的水脉。雾已经漫到鞋面，冷得像踩进了深冬。"],"择":[{"名":"引雾入渠","文":"他带人破开渠口，把雾引进了漕渠河。河面结了一层薄冰，城里三万户人家保住了，只是漕渠三年不出鱼，沿河的渔家骂了他半辈子。","果":{"声望":6,"因果":2,"灵石":80,"修为":100}},{"名":"封巷守人","文":"他选了封巷，逐户敲门把人背出来，背到第十七个，雾已经漫过腰。最后一个人背出来时，巷子里的灯全灭了。他在巷口坐了一夜，从此见白雾便要退三步。","果":{"气血":-70,"声望":10,"因果":-3,"道心":2}},{"名":"吸雾炼气","文":"他张口把雾吸进肺里，以{功法}强行炼化。三日之间修为暴涨，经脉却烧得像被人用铁刷子刮过。此后他每逢雨天便咳血，咳出的血在碗里凝成细小的鳞。","果":{"修为":400,"气血":-110,"魔念":2,"寿元":-15}}]},{"id":"zhongzhou_028","题":"学宫辩难","类":"人情","重":2,"域":["zhongzhou"],"境界":[0,6],"段":["{宗门}每月初一开讲，{人物}混在听席的末排。这一日辩的是「修士该不该受朝廷的册封」，主讲的是位老博士，对面的年轻人一身白衣，说话直得像刀。","辩到酣处，白衣人忽然指着他这一排，说：请这位来说说，修士若受了册封，雷劫来了是谁替他挡。满堂的人都转过头来，案上那枚{器物}在灯下晃了一晃，前排几位穿官服的不动声色地记着什么。","{天象}从学宫的天井照下来，照在讲台上那一卷{功法}上。老博士没有拦，反而把茶盏放下了，像是也在等一个答案。答得好是名声，答得差便是一份文书的边角。"],"择":[{"名":"直陈其非","文":"他站起身说：册封封的是人，封不了劫。满堂静了一瞬，随后有人击掌。老博士大笑三声，把讲台上的一卷书掷给他。三日后他被叫去问话，问了两个时辰，出来时靴底磨薄了一层。","果":{"声望":8,"悟性":2,"灵石":-20,"因果":1}},{"名":"诡辞避锋","文":"他说自己只是旁听，不敢与诸公论道。堂上有人笑出声，白衣人摇了摇头。散场后老博士在廊下叫住他，说：你避得开这一问，避不开往后每一年。","果":{"道心":-1,"声望":-2,"灵石":60}},{"名":"举古驳今","文":"他引了前朝旧事，说受封者十有八九不得善终，条条有年号可考。白衣人竟拱手认输，官服诸公脸色却沉了。此后学宫的讲席给他留了位置，京中的门却关了三扇。","果":{"悟性":3,"声望":6,"因果":2,"灵石":40}}]},{"id":"zhongzhou_029","题":"玉玺残角","类":"秘境","重":2,"域":["zhongzhou"],"境界":[3,11],"段":["前朝玉玺早碎，残角流落民间三百年，最后一片据说在{地点}的旧库。{人物}受人所托去取，许的价钱高得不像话，托他的人只在帘后伸出一只手，腕上一条旧疤。","旧库的砖缝里嵌着一层{灵材}，越往里走气息越重。残角锁在一口铁匣里，匣面刻着半句咒，与{功法}的第一句正好相接。他伸手去拿，匣上的咒自己亮了。","身后传来脚步，来的是一个穿灰袍的{人物}，手里提着{器物}。灰袍人说：这东西一离库，{地名}的气运就要乱上一甲子。你若取了，我今夜就得杀你。灯影一晃，两个人都不动。"],"择":[{"名":"取角而去","文":"他把残角揣进怀里，硬接灰袍人一记闷掌，翻墙走了。托他的人收了东西，付了双倍灵石。半月后本城连出三桩怪事，他不敢看邸报，把灵石全换成了药。","果":{"灵石":700,"修为":150,"气血":-80,"因果":4}},{"名":"退匣封咒","文":"他抽手退后，把咒文拓下来交给灰袍人。灰袍人看罢长叹，说这咒缺了后半句，三百年来无人能补。他后来补上了，补在自家墙上，一辈子没敢说出去。","果":{"悟性":4,"道心":2,"因果":-3,"灵石":-50}},{"名":"与灰袍易","文":"他提议以一枚{器物}换残角的一角碎屑。灰袍人想了很久，答应了。碎屑不足指甲大，他炼进丹田，得了一点说不清的气，也从此刻在了某本簿子上。","果":{"修为":220,"悟性":2,"因果":2,"魔念":1}}]},{"id":"zhongzhou_030","题":"朱厌踏郊","类":"争斗","重":2,"域":["zhongzhou"],"境界":[3,11],"段":["{地名}东郊三十里内，连着七天有村落被踏平，田里留着巨大的爪印。{人物}赶到时，看见{妖异}正坐在一堵断墙上，搔着头，身后是烧了一半的祠堂，火还没灭。","那东西站起来有丈许高，浑身赤白相间，见人不扑，只伸手指了指{地点}的方向。他顺着看过去，那边是皇朝的军械库。朱厌不是乱走，它是在沿着一道线找什么东西。","军械库的守将已经列阵，箭在弦上。{天象}压下来，兽群远远地嚎。他站在断墙上，忽然想起古书上说，朱厌现世主刀兵，而它走入人间，必是被一件带煞的{器物}引来的。"],"择":[{"名":"引其出城","文":"他以自身血气为饵，把朱厌一路引向东边的荒谷，绕开了军械库和三座村庄。最后他躲进石缝，兽爪在石上抓了一整夜。天亮时他浑身是血，城却完好。","果":{"声望":12,"气血":-100,"修为":180,"因果":-2}},{"名":"入阵共战","文":"他与守将合围，三百弓弩加他的{功法}，足足打了半日才把那东西放倒。剖开兽腹，里面果然有一枚带煞的{器物}。功劳七成记在军中，他得了一枚腰牌和一个敌手。","果":{"修为":250,"声望":8,"灵石":200,"因果":1}},{"名":"取兽骨走","文":"他趁乱割下朱厌背上的一段骨，转身便走。那骨是炼器的绝料，卖了大价钱。兽群此后在城郊游荡了两年，他再也没敢走东门。","果":{"灵石":500,"魔念":2,"因果":3,"声望":-6}}]},{"id":"zhongzhou_031","题":"国运拍卖","类":"市井","重":3,"域":["zhongzhou"],"境界":[2,10],"段":["万宝阁有三不卖：不卖国运，不卖寿数，不卖归墟之路。今夜内堂的帘子却挂了出来，台上摆着一只黑匣，掌事的说匣里是{地名}某州三年的气运，起价三千。","堂中坐着的都是生面孔，个个身上气机深得看不出底。{人物}坐在最末，只替人记价。叫到第二十轮，价钱已是起价的九倍，叫价的人却只剩下两个，一个戴青铜面具，一个披着{宗门}的旧袍。","掌事的忽然看向末席，说按阁里的旧规矩，末席有权问一句：这气运从哪一州抽来。堂中静了。帘后有人轻轻咳了一声，那声音他听过，就在昨日{地点}的廷议上。"],"择":[{"名":"当堂发问","文":"他站起问了那一句。掌事的脸色变了两变，终究报了州名。那州今年恰逢大旱，满堂哗然，拍卖当场流了。他出了万宝城，第二日便有车马在客栈外候了一整天。","果":{"声望":10,"因果":-3,"灵石":-120,"魔念":0}},{"名":"闭口记价","文":"他低头把每一轮的价都记清，回去交账。三日后黑匣以天价成交，那州的气运果然断了一截。他什么也没说，只是把账本上那一页折了个角，压了三十年。","果":{"灵石":180,"因果":2,"道心":-1}},{"名":"替人举牌","文":"一个托客塞了他三百灵石，让他代举到第十轮。他举了，气运之价被抬高三成。事后他被万宝阁查了出来，逐出内堂，终身不得入拍卖会。他把那三百灵石花得很慢。","果":{"灵石":300,"声望":-6,"因果":2,"魔念":1}}]},{"id":"zhongzhou_032","题":"观星夜算","类":"修行","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["{地点}的顶层只容一人，四面悬着铜铃，风过便要响。{人物}借了三个夜晚的钥匙，摊开{功法}，要把自己这三十年的运数算一遍——算出来的东西，他不打算给别人看。","第一夜算到四更，铜铃响了三声，他没有抬头。第二夜，纸上出现了七条线，每一条都通往同一个死局。第三夜他换了算法，把{天象}也一并入了局，死局竟开了个口子。","口子后面是一段空白，纸上另有一枚{器物}压着纸角。他在空白处写下自己的名字，笔尖一颤，纸上渗出一行极淡的字：你算得越准，局便越准。楼下传来上楼的脚步声，不止一人。"],"择":[{"名":"焚纸绝算","文":"他把三夜的纸全烧了，连灰都收进袖里带走。此后他不再推演自己的命，只推旁人的。他活得比算出来的寿数多出十一年，这十一年的每一天都像是白捡的。","果":{"道心":3,"寿元":11,"悟性":2,"因果":-2}},{"名":"照局行之","文":"他按纸上的七条线一一走完，果然每年都有一场大劫，也果然每次都从缺口里活了出来。他的修为一路直上，只是渐渐分不清是自己走了路，还是路走了自己。","果":{"修为":320,"悟性":3,"因果":3,"道心":-2}},{"名":"留下残页","文":"他把那张开了口子的纸留在案上，从窗子翻了下去。第二日天机阁来取走了纸，留下四字批语：此人有胆。他此后的行迹，从此都记在了楼里的簿上。","果":{"声望":6,"因果":1,"悟性":1,"灵石":90}}]},{"id":"zhongzhou_033","题":"血衣之诏","类":"灾祸","重":2,"域":["zhongzhou"],"境界":[1,9],"段":["更漏刚过三更，{地点}的门缝里塞进一卷诏书，封皮上没有御印，只有一片干涸的血。{人物}拆开一看，写的是三道诛杀令，三名官员，其中一位是昨夜还在{地点}与他饮酒的{人物}。","血衣诏是前朝旧制，废了三百年，谁用谁便要担一个弑臣之名。他把诏书压在灯下照，纸背透出一行小字：印在{宗门}。他认得这笔字，是那位替他誊诏的老吏所书。","{天象}盖住了整座内城。天一亮便要开朝，若这卷东西递进金殿，三个人活不过午时；若压着不动，递诏的人便会找上他。他把诏书卷起，塞进袖口，袖里还有一枚{器物}。"],"择":[{"名":"当朝呈上","文":"他在金殿上举起血衣诏，殿中鸦雀无声。三个人当场被押，罪状三日便定。他得了御史的一席之位，也从此每晚都要换一处睡，因为那卷诏上的第四道空白，迟迟没有填。","果":{"声望":12,"灵石":260,"因果":3,"道心":-2}},{"名":"连夜示警","文":"他跑了三处宅子，把三个人一一叫醒。天亮时只有一个人选择出城，另两个把自己的名字划掉了。他把诏书烧在{地点}的井里，此后案子成了悬案，他倒一直平安。","果":{"因果":-3,"道心":3,"声望":4,"寿元":-6}},{"名":"反制递诏者","文":"他把诏书与老吏的笔迹一并封存，反过来送进{宗门}的门下。三日之内，那位替他誊诏的老吏被人从漕渠里捞起。他活着，也明白自己成了别人手里的一把刀。","果":{"灵石":180,"魔念":3,"因果":3,"悟性":1}}]},{"id":"zhongzhou_034","题":"雷池问罪","类":"宗门","重":2,"域":["zhongzhou"],"境界":[2,9],"段":["{地名}雷堂后有九丈深池，池底雷水终年不冻，宗中犯了大戒的弟子要下池受罚。{人物}被两名执事押到池边，罪名是私通{宗门}，无人替他说一句话。","他确实见过{宗门}的人，只为一件事：托他查一个孩子的下落。这件事说出来没人信，不说便坐实了罪名——他袖中那卷{功法}是雷堂亲授的，此刻却在替他发抖。池面浮起一层电光，映出他脸上那道还没结痂的伤。","堂上坐着的长老敲了一下铜尺，说：下池三炷香能活着上来的，罪减半。两根绳索已经垂到他面前。{天象}在堂外压得很低，雷声一声接一声，像是池底有什么在应和。"],"择":[{"名":"下池受罚","文":"他解衣下池，三炷香里忍了九道雷。上岸时浑身焦黑，戒律堂却也没再多问一句。他带着一身雷伤离了{地名}，此后修行再难寸进，那种痛却刻进了骨。","果":{"气血":-110,"修为":60,"道心":3,"声望":3}},{"名":"引雷反噬","文":"他在池边催动{功法}，把池底的雷气引向堂上的铜尺。尺断，长老退了半步，满堂哗然。他趁乱走了，从此在三家宗门的通缉令上各留了一个名字。","果":{"修为":280,"声望":-10,"魔念":2,"因果":3}},{"名":"举证自清","文":"他把那封托付的信当堂呈上，请雷堂去查那个孩子。查了半月，孩子找到了，人早已被做成药。案子牵出另一个长老，他得以脱罪，也从此再不敢信宗中任何一人。","果":{"悟性":3,"因果":2,"声望":5,"道心":-1}}]},{"id":"zhongzhou_035","题":"万宝假货","类":"市井","重":3,"域":["zhongzhou"],"境界":[0,5],"段":["东市的{人物}手里有三串假珠，用的是{灵材}浸的鱼目，摆在万宝城最偏的一格柜上。{人物}贪便宜买下一串，回去一验，珠子在灯下化成水，水里浮着一只死虫。","他回去寻人，摊子已经换了个主。新主说前三日的摊子是租的，租摊人的路引上写着{宗门}的别号。隔壁裁缝插了一句：那人昨日还卖了一柄{器物}给兵部的人。","万宝阁的巡查已在街上。假货一案按阁规要三倍赔，可若他把这案子捅到阁里，摊子背后的{宗门}必然要倒一个。街上的{天象}正压下来，灯影在柜面上晃，巡查的问他是私了还是报官，问得很和气，眼里却不和气。"],"择":[{"名":"三倍索偿","文":"他选了私了，拿回三倍的钱，还多得一枚旧玉。巡查的在册子上勾了他一笔，说来年竞价时可优待。他从此买货先看人，再不看价。","果":{"灵石":220,"悟性":1,"因果":0}},{"名":"报阁彻查","文":"他把那串化了的珠水和死虫一起送进阁里。查下来牵连三家铺子，那位宗门的长老被削了一职。他得了一笔重赏，也从此在市面上再买不到便宜货。","果":{"灵石":400,"声望":8,"因果":2,"魔念":0}},{"名":"买假充真","文":"他转身又去买了两串同样的假珠，转手卖给了不识货的{人物}。一来一回赚了三倍，也从此学会了这门手艺：让人自己看不出真假。","果":{"灵石":500,"魔念":2,"道心":-2,"因果":2}}]},{"id":"zhongzhou_036","题":"帝星晦暗","类":"天象","重":2,"域":["zhongzhou"],"境界":[2,11],"段":["入冬之后，{天象}成了街头巷尾都在议论的事。钦天监的告示换了三次，头两次说星象如常，第三次干脆不贴了。{人物}在{地点}听一位老卜者说：北边那颗星，暗得只剩一线。","紫微暗则主上不安，主上不安则朝局要动。他替人送信，送到{地点}时被拦了三次，最后一次是位内侍，塞了他一封信，要他连夜送去城外的{宗门}，信上连火漆都没封。","雪落在{地点}的青石上，很静。他揣着那封信走出去半里，回头看见宫城上空的星忽然亮了一瞬，又暗下去。城门口的兵已经在换岗，多了一倍，个个带着弓。这封信送与不送，今夜都要见血。"],"择":[{"名":"送信出城","文":"他把信送到，收信的是位副宗主。三日后朝中换了两位宰执，血没流在街上，流在诏书里。他拿了钱，从此每回进城都绕开正门，从水门走。","果":{"灵石":300,"因果":3,"悟性":2,"魔念":1}},{"名":"拆信焚之","文":"他在雪地里拆了信，里面只有一句：明日莫入朝。他把信烧了，转身回城去敲那内侍的门，敲了半夜没人应。第二日朝会上死了两个人，都不是那内侍。","果":{"道心":2,"因果":1,"灵石":-40,"悟性":1}},{"名":"投书御史","文":"他把信交给了御史台。查了一个冬天，牵出的人和星象一样多。他得了赏，也被那位副宗主记在了心里，此后十年，他走的每条路都有人先到。","果":{"声望":8,"灵石":160,"因果":3,"寿元":-8}}]},{"id":"zhongzhou_037","题":"天机封卷","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[1,9],"段":["天机阁每年封一次卷，封卷那日楼门不开，使者只把一卷新史送入地下石室。{人物}受了差事，要在封卷前把一册旧史从石室里取出来核对，管事叮嘱他：只许看，不许抄。","旧史写的是三十年前一桩旧案，字迹被水浸过，糊了半边。糊掉的地方，正是如今{宗门}的三位长老的名字。他翻到最后一页，看见一行新添的字：此卷已改。墨还是湿的。","石室的门外传来落锁的声音。他数了数，一共落了七道。箱子里的{器物}发出很轻的响动，像是有人在里面翻纸。这楼里从不缺会算的人，缺的是活到算完之后的人。"],"择":[{"名":"抄下一册","文":"他借着箱缝的微光把有用的一页抄在衬里。三日后出楼，他把衬里拆下来藏进{地点}的一尊石像。此后他每年去添一次香，也每年都看那尊石像一眼。","果":{"悟性":4,"因果":2,"灵石":120,"魔念":1}},{"名":"据实上报","文":"他把「此卷已改」四字报给管事，管事看了很久，说这四字三十年前就有。他信了，也从此知道自己不算聪明。他此生再没进过那间石室。","果":{"道心":1,"声望":2,"灵石":60}},{"名":"逐字补全","文":"他就着水痕把糊掉的名字一个个补了出来，补完时发现少一个：那个空位，笔画与他自己写的字一模一样。他把笔放下，等门开，再没提过这件事。","果":{"悟性":3,"因果":4,"道心":-1,"寿元":-5}}]},{"id":"zhongzhou_038","题":"斩运刀法","类":"争斗","重":2,"域":["zhongzhou"],"境界":[3,11],"段":["{功法}只有七式，每一式斩的不是人，是气运。这门刀法藏在{地点}一户破落人家的祠堂里，墙上的刀痕比字还多。{人物}寻到时，刀痕上还凝着一层灰白的气。","传刀的老妇人说，这刀法斩人一世运数，用一次便折自己一分寿。她丈夫当年用第三式斩了一个国舅，国舅败了，她丈夫三年后也败了。祠堂梁上供着一枚干裂的{灵材}，她把它摘下来，把刀横在膝上，问他要哪一式。","{天象}从祠堂的破窗照进来，落在刀上有如水。他这些年在{地名}处处受制，就是因为那位在九门说了算的{人物}断了他的路。第一式斩不了那人的运，第三式可以。"],"择":[{"名":"学第三式","文":"他练了三年，第三式出手那天，那位人物在朝堂上忽然跌了一跤，从此事事不顺。他的运数一夜之间通了，寿元却像被人连根拔走一截，鬓发在半月内全白。","果":{"修为":300,"寿元":-20,"灵石":300,"魔念":2}},{"名":"只学守式","文":"他求那门刀法里唯一不斩人的第七式，一式只为护己。老妇人怔了很久，才把刀递给他。他此后每一步都走得很慢，也从未被人断过路。","果":{"道心":3,"悟性":2,"修为":80,"因果":-2}},{"名":"烧祠绝传","文":"他把祠堂连同墙上的刀痕一并烧了。老妇人坐在火光里没动，说：这刀还有别人惦记着。三年后果然有人寻上门来问刀，他答不出，只得把自己赔进去。","果":{"因果":-2,"寿元":6,"声望":-4,"气血":-30}}]},{"id":"zhongzhou_039","题":"金殿廷议","类":"人情","重":3,"域":["zhongzhou"],"境界":[1,8],"段":["金殿之上，三块蒲团隔着三尺摆开：左是{宗门}的座，右是{宗门}的座，中间是{宗门}的座。这三年三方议的都是同一桩事——{地名}以北的灵脉该归谁收。{人物}只是替人捧册的末吏。","议到第二日，两位老大人终于翻了脸，一个说国法在，一个说天道在。皇帝坐在上头没有出声，只把手里那枚{器物}在案上敲了一下。满殿的人都跪了，他捧着的册子掉了半页。","那半页上正好记着一份旧账：北边灵脉这三年所出，六成进了私库，一分未入国用。他跪在阶下，手指压着那半页纸。{天象}从殿门的缝里漏进来，照在那页纸上，白得刺眼。"],"择":[{"名":"呈上半页","文":"他把那半页举过了头顶。殿上静了很久，随后是一场抄家。三家的账都翻了底，北边的灵脉收归国用。他升了职，也从此再没人敢在他面前说一句实话。","果":{"声望":14,"灵石":200,"因果":3,"道心":-2}},{"名":"塞回袖中","文":"他把那半页塞回怀里，跪到议毕。三年后三方各分了两成，剩四成不知去向。他活着，也没多拿一文，只是夜里常想起那半页纸上的账目，越算越清。","果":{"道心":-2,"寿元":8,"因果":1}},{"名":"私递一家","文":"他把那半页悄悄递给了一位大人。那一家在廷议上占尽上风，事后许他一个实缺。他接了，也从此身上系了一根绳，绳头在别人手里。","果":{"灵石":350,"声望":5,"魔念":1,"因果":2}}]},{"id":"zhongzhou_040","题":"机关兽行","类":"奇闻","重":2,"域":["zhongzhou"],"境界":[1,7],"段":["{宗门}的器师造出一头机关兽，铜筋木骨，腹内藏了一枚{器物}作心。造好的第七日，它自己从{地点}走了出来，一路走过东市，所过之处，匠人手中的活计都在发烫。","器师追出来时已经晚了，那东西停在了{宗门}的库门前，抬起前爪，一下一下地叩门。围观的人不敢上前，库里的管事隔着门缝喊：这东西认得库里的货，它是来讨东西的。","{天象}照着这一人一兽。器师满头是汗，说这兽是他照着旧卷造的，旧卷上有一句话他没看懂：成器之日，须还一物。他手里并没有可还的东西，而兽已经叩了三百下。"],"择":[{"名":"助其叩门","文":"他上前替那兽叩门，叩到第四百下，库门从里头开了。管事捧出一块锈铁，兽吞下之后便伏地不动。器师跪下谢他，说那是三十年前造兽所用的旧料。","果":{"悟性":3,"灵石":120,"因果":-1,"声望":4}},{"名":"拆其心核","文":"他趁器师不备，一把掏出兽腹里的{器物}。兽当即塌成一堆木头，心核在他手里还在跳。他把它卖了，卖价够他十年修行，只是那之后他造什么坏什么。","果":{"灵石":500,"魔念":2,"因果":2,"修为":100}},{"名":"劝还旧料","文":"他劝器师散尽家财去买那块旧料。器师照办了，兽吞料后自己走进库房归位。器师此后不再造兽，只教人如何拆。他得了一卷拆器的图谱，也结了这一段缘。","果":{"道心":2,"悟性":2,"灵石":-60,"声望":3}}]},{"id":"zhongzhou_041","题":"御供道场","类":"修行","重":3,"域":["zhongzhou"],"境界":[0,7],"段":["{地点}每年开一次御供道场，三日之内灵气胀到平日三倍，京中修士都往那里挤。{人物}托人弄到一枚外场的木牌，天没亮便到了，只占了最外一圈的位置。","内场的蒲团只有三十六个，坐着的是官身与宗门子弟。灵气自内场溢出，外场的便只能捡剩下的。他闭目吐纳，运转{功法}，到第二日发觉自己的气总是被一缕一缕地往外牵。","第三日清晨，内场有人开始收气，那是一种极不讲理的收法，把整座道场的灵气都往一处抽。外场的人接连睁眼，敢怒不敢言。{天象}正从头顶压过，一时尘都静了。"],"择":[{"名":"强行夺气","文":"他倒转经脉，硬生生把一缕气夺了回来。内场有人闷哼一声，睁眼看向外圈。他吞下那缕气，三日之内修为涨了一截，也从此被那位记住了相貌。","果":{"修为":260,"因果":2,"声望":-4,"气血":-30}},{"名":"退场自修","文":"他起身走了，回到城外租的破院里用{功法}慢慢炼。这一夜他炼得极慢，却意外打通了一处从前总也过不去的关窍。道场开完，他反倒比去了的人踏实。","果":{"悟性":3,"道心":2,"修为":
