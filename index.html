    reincarnate() { const old = state.player; if (old) { old.活 = false; old.状态 = '已陨'; reincarnate(old); } return state.player; },
    revive(id) {
      const b = this.being(id);
      if (!b) return null;
      b.活 = true; b.状态 = '复活'; b.年龄 = Math.min(b.年龄, b.寿元 - 1);
      if (b.是玩家) state.player = b;
      emit('player'); emit('beings');
      return b;
    },
    breakthrough(id, force) { const b = this.being(id); if (b) { b.修为 = expCap(b.境界, b.层); return doBreakthrough(b, force !== false); } return false; },
    setRealm(id, k, layer) {
      const b = this.being(id); if (!b) return null;
      b.境界 = clamp(k, 0, REALMS.length - 1);
      b.层 = clamp(layer || 0, 0, layersOf(b.境界) - 1);
      b.修为 = 0;
      b.寿元 = Math.max(b.年龄 + 10, Math.round(90 + b.灵根分 * 8 + realmAgeBonus(b.境界)));
      emit('player'); emit('beings');
      return b;
    },
    setRegion(id, patch) {
      const r = state.regions[id]; if (!r) return null;
      Object.keys(patch).forEach((k) => (r[k] = patch[k]));
      emit('regions');
      return r;
    },
    setSect(id, patch) {
      const s = state.sects[id]; if (!s) return null;
      Object.keys(patch).forEach((k) => (s[k] = patch[k]));
      emit('regions');
      return s;
    },
    setWorld(patch) { Object.keys(patch).forEach((k) => (state[k] = patch[k])); emit('tick'); return state; },
    setRule(patch) { Object.keys(patch).forEach((k) => (state.规则[k] = patch[k])); emit('rules'); return state.规则; },
    setTime(year, month) {
      if (year != null) state.year = year;
      if (month != null) state.month = clamp(month, 0, 11);
      emit('tick');
    },
    fireEvent(idOrEvent) {
      let ev = idOrEvent;
      if (typeof idOrEvent === 'string') ev = ALL_EVENTS.find((e) => e.id === idOrEvent) || ALL_EVENTS.find((e) => e.题 === idOrEvent);
      return fireEvent(ev || null);
    },
    randomEvent() { return fireEvent(pick(ALL_EVENTS)); },
    addChronicle(文, 类) { addChronicle(类 || '天机', 文, true); emit('chronicle'); },
    addLog(文, 类) { pushLog(类 || '天机', 文); },
    spawnAround(区域) {
      const b = newBeing({ 区域: 区域 || state.player.区域, 境界: ri(0, 2) });
      state.beings.push(b);
      emit('beings');
      return b;
    },
    massBreakthrough(scope) {
      const list = scope === 'all' ? state.beings.filter((b) => b.活) : state.beings.filter((b) => b.活 && b.宗门);
      list.forEach((b) => { b.修为 = expCap(b.境界, b.层); doBreakthrough(b, true); });
      emit('beings'); emit('player');
      return list.length;
    },
    wipe(what) {
      if (what === 'beings') state.beings = state.beings.filter((b) => b.是玩家);
      if (what === 'log') state.log = [];
      if (what === 'chronicle') state.chronicle = [];
      emit('beings'); emit('log'); emit('chronicle');
    },
    grantAll() {
      const p = state.player;
      p.灵石 += 100000;
      POOLS.功法.slice(0, 6).forEach((名) => p.功法.push({ 名, 品: '天阶', 效: rf(1.2, 1.8) }));
      p.法宝.push({ 名: '天机笔', 品: '仙器', 效: 5 });
      p.悟性 += 20; p.根骨 += 20; p.机缘 += 20; p.道心 = 100;
      emit('player');
    },
    exportJSON() { return JSON.stringify(state); },
    importJSON(txt) {
      const obj = JSON.parse(txt);
      if (!obj || !obj.player || !obj.beings) throw new Error('存档结构不合法');
      state = obj;
      if (!state.规则) state.规则 = { 事件间隔: 9, 修为倍率: 1, 突破倍率: 1, 争斗频率: 1, 寿命倍率: 1, 上帝模式: false, 无限灵石: false, 自动转世: true, 天罚: true };
      beingSeq = Math.max(1, state.beings.length + 1);
      emit('newgame');
      return state;
    }
  };

  const SAVE_KEY = 'chixiaozhou.save.v2';
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); return true; } catch (e) { return false; } }
  function load() {
    try {
      const txt = localStorage.getItem(SAVE_KEY);
      if (!txt) return false;
      const obj = JSON.parse(txt);
      if (!obj || !obj.player || !obj.beings) return false;
      state = obj;
      if (!state.规则) state.规则 = { 事件间隔: 9, 修为倍率: 1, 突破倍率: 1, 争斗频率: 1, 寿命倍率: 1, 上帝模式: false, 无限灵石: false, 自动转世: true, 天罚: true };
      beingSeq = Math.max(1, state.beings.length + 1);
      return true;
    } catch (e) { return false; }
  }
  function reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} newGame(); }

  const Engine = {
    MAP_W, MAP_H, POS, EDGES, ADJ, REGIONS, SECTS, REALMS, PATHS, ALL_EVENTS, REGION_EVENTS,
    POOLS, REGION_VOCAB, REGION_BY_ID, SECT_BY_ID, SECT_HOME, PATH_BY_ID,
    newGame, tick, subscribe, save, load, reset, cheat,
    travel, advanceMotion, isMoving,
    expand, realmName, layersOf, expCap, globalLayer, powerOf, cultivateRate, breakChance,
    eraName, dateStr, dateShort, yearStr, cnNum, regionOf,
    get state() { return state; },
    get log() { return state ? state.log : []; },
    get chronicle() { return state ? state.chronicle : []; }
  };
  global.Engine = Engine;
})(window);

</script>
<script>
/* 赤霄洲 · 水墨俯视渲染 */
(function (global) {
  'use strict';
  const E = global.Engine;
  const W = E.MAP_W, H = E.MAP_H;

  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const terrain = document.getElementById('terrain');
  const tctx = terrain.getContext('2d');
  let dpr = 1, vw = 0, vh = 0;
  const cam = { x: W / 2, y: H / 2, z: 0.42, tx: W / 2, ty: H / 2, tz: 0.42 };
  let focusBias = 0;
  let follow = false;
  let followGlide = 0;
  let camInit = false;
  let t = 0;
  let hoverId = null;
  let selectedId = null;
  let staticLayer = null;
  let staticDirty = true;
  const STATIC_SCALE = 1.25;
  const TERRAIN_PAD = 260;

  const REGION_STYLE = {
    qinglan: { base: '#7f9b7a', ink: '#4f6b52', motif: 'bamboo', glyph: '竹' },
    yunmeng: { base: '#7d97a4', ink: '#456070', motif: 'water', glyph: '泽' },
    luoxia: { base: '#b1795e', ink: '#8a4a34', motif: 'ridge', glyph: '霞' },
    beiming: { base: '#9fb2bd', ink: '#5c7787', motif: 'snow', glyph: '雪' },
    nanjiang: { base: '#6f8f6a', ink: '#3f5d3c', motif: 'jungle', glyph: '蛊' },
    ximo: { base: '#c2a678', ink: '#94764a', motif: 'dune', glyph: '漠' },
    zhongzhou: { base: '#b8a06f', ink: '#7d6636', motif: 'city', glyph: '州' },
    tianjian: { base: '#8d93a8', ink: '#565d75', motif: 'sword', glyph: '剑' },
    penglai: { base: '#8fb0b5', ink: '#4f7c83', motif: 'sea', glyph: '海' },
    youming: { base: '#8b8497', ink: '#5a5268', motif: 'ghost', glyph: '冥' },
    taixu: { base: '#9aa4c4', ink: '#5b6490', motif: 'star', glyph: '虚' },
    guixu: { base: '#6d7482', ink: '#3c4350', motif: 'void', glyph: '墟' }
  };
  const RADIUS = {
    qinglan: 132, yunmeng: 138, luoxia: 128, beiming: 140, nanjiang: 130, ximo: 150,
    zhongzhou: 168, tianjian: 126, penglai: 122, youming: 112, taixu: 100, guixu: 92
  };

  const noise = (function () {
    let seed = 20261109;
    return function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  })();

  function resize() {
    dpr = Math.min(2, global.devicePixelRatio || 1);
    vw = global.innerWidth; vh = global.innerHeight;
    canvas.width = Math.floor(vw * dpr);
    canvas.height = Math.floor(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    clampCam();
    staticDirty = true;
    if (!camInit) {
      camInit = true;
      const z = Math.max(0.3, Math.min(0.8, Math.min(vw / 1100, vh / 1500)));
      cam.z = cam.tz = z;
    }
  }

  function bias() {
    const targetY = vh * 0.42;
    focusBias = (vh / 2 - targetY) / Math.max(0.28, cam.z);
    return focusBias;
  }

  function clampCam() {
    cam.z = Math.max(0.28, Math.min(1.5, cam.z));
    const halfW = vw / 2 / cam.z, halfH = vh / 2 / cam.z;
    const padX = Math.max(0, W / 2 - halfW + TERRAIN_PAD), padY = Math.max(0, H / 2 - halfH + TERRAIN_PAD);
    cam.x = Math.max(Math.min(W / 2 + padX, cam.x), W / 2 - padX);
    cam.y = Math.max(Math.min(H / 2 + padY, cam.y), H / 2 - padY);
  }

  /* ---------------- 静态层：纸、山、水、路 ---------------- */
  function buildStatic() {
    staticLayer = terrain;
    const scale = STATIC_SCALE;
    const P = TERRAIN_PAD;
    staticLayer.width = Math.floor((W + P * 2) * scale);
    staticLayer.height = Math.floor((H + P * 2) * scale);
    staticLayer.style.width = (W + P * 2) + 'px';
    staticLayer.style.height = (H + P * 2) + 'px';
    staticLayer.style.left = (-P) + 'px';
    staticLayer.style.top = (-P) + 'px';
    const c = tctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, staticLayer.width, staticLayer.height);
    c.scale(scale, scale);
    c.translate(P, P);
    c.fillStyle = '#efe6d4';
    c.fillRect(-P - 2, -P - 2, W + P * 2 + 4, H + P * 2 + 4);

    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#f3ecdc');
    g.addColorStop(0.5, '#eee5d3');
    g.addColorStop(1, '#e8dcc6');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    for (let i = 0; i < 1400; i++) {
      const x = noise() * W, y = noise() * H, r = noise() * 1.6 + 0.3;
      c.fillStyle = `rgba(120,105,80,${0.02 + noise() * 0.05})`;
      c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
    }
    for (let i = 0; i < 90; i++) {
      const x = noise() * W, y = noise() * H;
      c.strokeStyle = `rgba(140,120,90,${0.02 + noise() * 0.03})`;
      c.lineWidth = 0.6 + noise();
      c.beginPath();
      c.moveTo(x, y);
      c.bezierCurveTo(x + noise() * 120 - 60, y + noise() * 40, x + noise() * 160 - 80, y + noise() * 60 - 30, x + noise() * 200 - 100, y + noise() * 80 - 40);
      c.stroke();
    }

    drawDistantPeaks(c);
    drawCloudBands(c);
    drawRoads(c);
    E.REGIONS.forEach((r) => drawRegionBase(c, r));
    drawRegionMotifs(c);
    drawCompass(c);
  }

  function drawDistantPeaks(c) {
    c.save();
    const bands = [
      { y: 120, h: 74, a: 0.10, col: '#6b7466', n: 7, w: 260 },
      { y: 215, h: 54, a: 0.07, col: '#7a7f70', n: 9, w: 210 },
      { y: 1490, h: 64, a: 0.07, col: '#6f7364', n: 6, w: 280 }
    ];
    bands.forEach((b, bi) => {
      c.globalAlpha = b.a;
      c.fillStyle = b.col;
      c.beginPath();
      c.moveTo(-50, b.y + b.h);
      for (let i = 0; i <= b.n; i++) {
        const x = -50 + (W + 100) * (i / b.n);
        const peak = b.y - Math.sin(i * 1.7 + bi) * b.h * 0.55 - (i % 3) * 12;
        c.quadraticCurveTo(x - b.w * 0.3, peak + b.h * 0.35, x, peak);
        c.quadraticCurveTo(x + b.w * 0.3, peak + b.h * 0.4, x + b.w * 0.6, b.y + b.h * 0.7);
      }
      c.lineTo(W + 50, b.y + b.h + 40);
      c.lineTo(-50, b.y + b.h + 40);
      c.closePath();
      c.fill();
      c.globalAlpha = b.a * 1.9;
      c.strokeStyle = b.col;
      c.lineWidth = 0.9;
      c.stroke();
    });
    c.restore();
  }

  function drawCloudBands(c) {
    c.save();
    for (let i = 0; i < 7; i++) {
      const y = 90 + i * 235 + noise() * 60;
      const x = noise() * W;
      c.globalAlpha = 0.05 + noise() * 0.05;
      c.strokeStyle = '#8e9488';
      c.lineWidth = 8 + noise() * 12;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x - 200, y);
      c.bezierCurveTo(x - 100, y - 14, x + 60, y + 16, x + 210, y - 4);
      c.stroke();
    }
    c.restore();
  }

  function drawCompass(c) {
    const x = W - 150, y = 150;
    c.save();
    c.globalAlpha = 0.30;
    c.strokeStyle = '#7b6a4e';
    c.lineWidth = 1;
    c.beginPath(); c.arc(x, y, 34, 0, 6.2832); c.stroke();
    c.beginPath(); c.arc(x, y, 24, 0, 6.2832); c.stroke();
    c.fillStyle = '#7b6a4e';
    c.beginPath();
    c.moveTo(x, y - 30); c.lineTo(x + 5, y); c.lineTo(x, y + 12); c.lineTo(x - 5, y); c.closePath(); c.fill();
    c.globalAlpha = 0.5;
    c.font = '11px "Noto Serif SC",serif';
    c.textAlign = 'center';
    c.fillText('北', x, y - 40);
    c.fillText('南', x, y + 50);
    c.restore();
  }

  function drawRoads(c) {
    E.EDGES.forEach(([a, b]) => {
      const A = E.POS[a], B = E.POS[b];
      if (!A || !B) return;
      const mx = (A[0] + B[0]) / 2 + Math.sin(A[1] * 0.01 + B[0] * 0.01) * 60;
      const my = (A[1] + B[1]) / 2 + Math.cos(A[0] * 0.01 + B[1] * 0.01) * 50;
      c.strokeStyle = 'rgba(112,96,72,0.16)';
      c.lineWidth = 2.4;
      c.setLineDash([9, 7]);
      c.beginPath(); c.moveTo(A[0], A[1]); c.quadraticCurveTo(mx, my, B[0], B[1]); c.stroke();
      c.setLineDash([]);
      c.strokeStyle = 'rgba(112,96,72,0.09)';
      c.lineWidth = 6;
      c.beginPath(); c.moveTo(A[0], A[1]); c.quadraticCurveTo(mx, my, B[0], B[1]); c.stroke();
    });
  }

  function blobPath(c, x, y, r, seed) {
    c.beginPath();
    const n = 26;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const wob = 1 + Math.sin(a * 3 + seed) * 0.07 + Math.sin(a * 5 + seed * 1.7) * 0.05 + Math.cos(a * 7 + seed) * 0.03;
      const px = x + Math.cos(a) * r * wob;
      const py = y + Math.sin(a) * r * wob * 0.82;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
  }

  function drawRegionBase(c, r) {
    const st = REGION_STYLE[r.id] || REGION_STYLE.zhongzhou;
    const [x, y] = E.POS[r.id];
    const rad = RADIUS[r.id] || 120;
    const seed = (r.id.charCodeAt(0) % 7) + 1.3;

    c.save();
    c.globalAlpha = 0.14;
    c.fillStyle = st.ink;
    blobPath(c, x + 10, y + 14, rad * 1.02, seed);
    c.fill();
    c.restore();

    c.save();
    c.globalAlpha = 0.52;
    const g = c.createRadialGradient(x, y, rad * 0.1, x, y, rad);
    g.addColorStop(0, st.base);
    g.addColorStop(1, st.base + '00');
    c.fillStyle = g;
    blobPath(c, x, y, rad, seed);
    c.fill();
    c.restore();

    c.save();
    c.globalAlpha = 0.72;
    c.strokeStyle = st.ink;
    c.lineWidth = 1.5;
    blobPath(c, x, y, rad, seed);
    c.stroke();
    c.restore();

    c.save();
    c.globalAlpha = 0.10;
    c.strokeStyle = st.ink;
    c.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      blobPath(c, x, y, rad * (0.78 - k * 0.16), seed + k);
      c.stroke();
    }
    c.restore();
  }

  function drawRegionMotifs(c) {
    E.REGIONS.forEach((r) => {
      const st = REGION_STYLE[r.id] || REGION_STYLE.zhongzhou;
      const [x, y] = E.POS[r.id];
      const rad = RADIUS[r.id] || 120;
      c.save();
      c.translate(x, y);
      c.globalAlpha = 0.62;
      c.strokeStyle = st.ink;
      c.fillStyle = st.ink;
      const m = st.motif;
      if (m === 'bamboo') {
        for (let i = 0; i < 9; i++) {
          const px = (noise() - 0.5) * rad * 1.5, py = (noise() - 0.5) * rad * 1.2;
          c.lineWidth = 1.2;
          c.beginPath(); c.moveTo(px, py + 14); c.lineTo(px, py - 16); c.stroke();
          for (let k = 0; k < 3; k++) {
            c.beginPath();
            c.moveTo(px, py - 6 + k * 6);
            c.lineTo(px + 9, py - 12 + k * 6);
            c.moveTo(px, py - 3 + k * 6);
            c.lineTo(px - 8, py - 10 + k * 6);
            c.stroke();
          }
        }
      } else if (m === 'water') {
        for (let i = 0; i < 8; i++) {
          const py = (noise() - 0.5) * rad * 1.3;
          c.lineWidth = 0.9;
          c.beginPath();
          c.moveTo(-rad * 0.6, py);
          c.bezierCurveTo(-rad * 0.2, py - 7, rad * 0.2, py + 7, rad * 0.6, py);
          c.stroke();
        }
      } else if (m === 'ridge' || m === 'sword') {
        for (let i = 0; i < 6; i++) {
          const px = (noise() - 0.5) * rad * 1.4, py = (noise() - 0.5) * rad;
          const h = m === 'sword' ? 30 : 22;
          c.lineWidth = 1.1;
          c.beginPath(); c.moveTo(px - 22, py); c.lineTo(px, py - h); c.lineTo(px + 20, py); c.stroke();
          if (m === 'sword') { c.beginPath(); c.moveTo(px, py - h); c.lineTo(px, py - h - 10); c.stroke(); }
        }
      } else if (m === 'snow') {
        for (let i = 0; i < 26; i++) {
          const px = (noise() - 0.5) * rad * 1.6, py = (noise() - 0.5) * rad * 1.3;
          c.beginPath(); c.arc(px, py, 0.9 + noise(), 0, 6.2832); c.fill();
        }
      } else if (m === 'jungle') {
        for (let i = 0; i < 16; i++) {
          const px = (noise() - 0.5) * rad * 1.5, py = (noise() - 0.5) * rad * 1.2;
          c.lineWidth = 1;
          c.beginPath(); c.moveTo(px, py + 6); c.lineTo(px, py - 8); c.stroke();
          c.beginPath(); c.arc(px, py - 10, 5 + noise() * 3, 0, 6.2832); c.fill();
        }
      } else if (m === 'dune') {
        for (let i = 0; i < 7; i++) {
          const py = (noise() - 0.5) * rad * 1.3;
          c.lineWidth = 1;
          c.beginPath(); c.moveTo(-rad * 0.55, py);
          c.quadraticCurveTo(0, py - 16, rad * 0.55, py + 2);
          c.stroke();
        }
      } else if (m === 'city') {
        c.lineWidth = 1.1;
        for (let i = 0; i < 7; i++) {
          const px = (noise() - 0.5) * rad * 1.1, py = (noise() - 0.5) * rad * 0.9;
          const w = 12 + noise() * 12, h = 9 + noise() * 10;
          c.strokeRect(px, py, w, h);
          c.beginPath(); c.moveTo(px - 3, py); c.lineTo(px + w / 2, py - 7); c.lineTo(px + w + 3, py); c.stroke();
        }
      } else if (m === 'sea') {
        for (let i = 0; i < 9; i++) {
          const py = (noise() - 0.5) * rad * 1.3;
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(-rad * 0.6, py);
          c.quadraticCurveTo(-rad * 0.3, py - 6, 0, py);
          c.quadraticCurveTo(rad * 0.3, py + 6, rad * 0.6, py);
          c.stroke();
        }
      } else if (m === 'ghost') {
        for (let i = 0; i < 7; i++) {
          const px = (noise() - 0.5) * rad * 1.3, py = (noise() - 0.5) * rad;
          c.globalAlpha = 0.18 + noise() * 0.2;
          c.beginPath(); c.arc(px, py, 8 + noise() * 12, 0, 6.2832); c.fill();
          c.globalAlpha = 0.5;
        }
      } else if (m === 'star') {
        for (let i = 0; i < 18; i++) {
          const px = (noise() - 0.5) * rad * 1.6, py = (noise() - 0.5) * rad * 1.4;
          c.beginPath(); c.arc(px, py, 0.8 + noise() * 1.2, 0, 6.2832); c.fill();
        }
        c.lineWidth = 0.8;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * 6.2832;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * rad * 0.55, Math.sin(a) * rad * 0.45); c.stroke();
        }
      } else if (m === 'void') {
        const g = c.createRadialGradient(0, 0, 2, 0, 0, rad * 0.7);
        g.addColorStop(0, 'rgba(30,30,40,0.55)');
        g.addColorStop(1, 'rgba(30,30,40,0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(0, 0, rad * 0.7, 0, 6.2832); c.fill();
      }
      c.restore();
    });
  }

  function drawRegionLabels(c) {
    E.REGIONS.forEach((r) => {
      const st = REGION_STYLE[r.id] || REGION_STYLE.zhongzhou;
      const [x, y] = E.POS[r.id];
      const rad = RADIUS[r.id] || 120;
      c.save();
      c.textAlign = 'center';
      c.fillStyle = st.ink;
      c.globalAlpha = 0.9;
      c.font = '600 21px "Noto Serif SC","Songti SC",serif';
      c.fillText(r.名, x, y - rad * 0.52);
      c.globalAlpha = 0.6;
      c.font = '11px "Noto Sans SC",sans-serif';
      c.fillText(r.方位 + ' · ' + r.地貌, x, y - rad * 0.52 + 17);
      c.restore();
    });
  }

  /* ---------------- 每帧绘制 ---------------- */
  function draw(dt) {
    t += dt;
    if (staticDirty) { buildStatic(); staticDirty = false; }

    if (follow && E.state && E.state.player && E.state.player.位置) {
      const p = E.state.player;
      const pp = interpPos(p);
      cam.tx = pp.x;
      cam.ty = pp.y + bias();
      if (Math.hypot(cam.x - cam.tx, cam.y - cam.ty) > 620) {
        cam.x = cam.tx;
        cam.y = cam.ty;
      }
    }
    if (follow && followGlide > 0) {
      followGlide = Math.max(0, followGlide - dt);
      const kg = 1 - Math.pow(0.004, Math.min(0.1, dt));
      cam.x = lerp(cam.x, cam.tx, kg);
      cam.y = lerp(cam.y, cam.ty, kg);
    } else if (follow) {
      cam.x = cam.tx;
      cam.y = cam.ty;
      const halfW = vw / 2 / cam.z, halfH = vh / 2 / cam.z;
      const padX = Math.max(0, W / 2 - halfW + TERRAIN_PAD), padY = Math.max(0, H / 2 - halfH + TERRAIN_PAD);
      cam.x = Math.max(Math.min(W / 2 + padX, cam.x), W / 2 - padX);
      cam.y = Math.max(Math.min(H / 2 + padY, cam.y), H / 2 - padY);
    } else {
      const k = 1 - Math.pow(0.00002, Math.min(0.1, dt));
      cam.x = lerp(cam.x, cam.tx, k);
      cam.y = lerp(cam.y, cam.ty, k);
    }
    cam.z = lerp(cam.z, cam.tz, 1 - Math.pow(0.004, Math.min(0.1, dt)));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, vw, vh);

    const off = TERRAIN_PAD * (1 - cam.z);
    terrain.style.transform = 'translate(' + (vw / 2 - cam.x * cam.z + off) + 'px,' + (vh / 2 - cam.y * cam.z + off) + 'px) scale(' + cam.z + ')';

    ctx.save();
    ctx.translate(vw / 2, vh / 2);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);


    if (E.state) {
      drawRegionAura();
      drawSectMarks();
      drawBeings();
      drawPlayer();
      drawSelection();
      drawWeather();
    }
    drawRegionLabelsDynamic();
    ctx.restore();

    drawVignette();
  }

  function lerp(a, b, k) { return a + (b - a) * k; }

  const labelWidth = {};
  function drawRegionLabelsDynamic() {
    const z = Math.max(0.28, cam.z);
    const fs = Math.min(40, 13 / z);
    ctx.font = '600 ' + fs + 'px "Noto Serif SC",serif';
    E.REGIONS.forEach((r) => {
      if (!labelWidth[r.id]) {
        ctx.font = '600 40px "Noto Serif SC",serif';
        labelWidth[r.id] = ctx.measureText(r.名).width / 40;
      }
      ctx.font = '600 ' + fs + 'px "Noto Serif SC",serif';
      const st = REGION_STYLE[r.id] || REGION_STYLE.zhongzhou;
      const [x, y] = E.POS[r.id];
      const rad = RADIUS[r.id] || 120;
      const ly = y - rad * 0.52;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '600 ' + fs + 'px "Noto Serif SC",serif';
      const tw = (labelWidth[r.id] || r.名.length) * fs;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(247,241,229,0.95)';
      roundRect(ctx, x - tw / 2 - 7, ly - fs * 0.92, tw + 14, fs * 1.2, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = st.ink;
      ctx.fillText(r.名, x, ly);
      if (cam.z > 0.42) {
        ctx.globalAlpha = 0.62;
        ctx.font = Math.max(8, fs * 0.48) + 'px "Noto Sans SC",sans-serif';
        ctx.fillText(r.方位 + ' · ' + r.地貌, x, ly + fs * 0.78);
      }
      ctx.restore();
    });
  }

  const auraCache = {};
  function auraGradient(r, rad, style, a) {
    const q = Math.round(a * 200);
    const key = r.id + '|' + q;
    if (auraCache[key]) return auraCache[key];
    const [x, y] = E.POS[r.id];
    const g = ctx.createRadialGradient(x, y, rad * 0.25, x, y, rad * 1.15);
    g.addColorStop(0, hexA(style.base, q / 200));
    g.addColorStop(1, hexA(style.base, 0));
    auraCache[key] = g;
    return g;
  }

  function drawRegionAura() {
    const st = E.state;
    E.REGIONS.forEach((r) => {
      const rs = st.regions[r.id];
      if (!rs) return;
      const style = REGION_STYLE[r.id] || REGION_STYLE.zhongzhou;
      const [x, y] = E.POS[r.id];
      const rad = (RADIUS[r.id] || 120) * 1.02;
      const k = Math.min(1.6, rs.灵机 / 1.6);
      const pulse = 0.5 + Math.sin(t * 0.9 + x * 0.01) * 0.5;
      const a = 0.05 + k * 0.05 + pulse * 0.03;
      ctx.fillStyle = auraGradient(r, rad, style, a);
      ctx.beginPath(); ctx.arc(x, y, rad * 1.15, 0, 6.2832); ctx.fill();
      if (rs.状态 === '妖祸' || rs.状态 === '大劫') {
        ctx.globalAlpha = 0.10 + pulse * 0.10;
        ctx.strokeStyle = '#8e3b57';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, rad * (1.02 + pulse * 0.05), 0, 6.2832); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });
  }

  function drawSectMarks() {
    const st = E.state;
    Object.keys(st.sects).forEach((sid) => {
      const s = st.sects[sid];
      const rid = E.SECT_HOME[sid];
      if (!rid) return;
      const [bx, by] = E.POS[rid];
      const seed = (sid.charCodeAt(0) * 37 + sid.charCodeAt(sid.length - 1) * 11) % 100;
      const a = seed / 100 * 6.2832;
      const rr = 40 + (seed % 46);
      const x = bx + Math.cos(a) * rr, y = by + Math.sin(a) * rr * 0.72;
      const strong = s.势力 >= 6;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = s.类型 === '魔道' ? '#7c3b45' : s.类型 === '正道' ? '#4a5f6e' : '#6a6250';
      ctx.beginPath();
      ctx.moveTo(x, y - 6);
      ctx.lineTo(x + 5, y);
      ctx.lineTo(x, y + 6);
      ctx.lineTo(x - 5, y);
      ctx.closePath();
      ctx.fill();
      if (strong) {
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.35;
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.2832); ctx.stroke();
      }
      if (cam.z > 0.62) {
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#4c4436';
        ctx.font = '10px "Noto Sans SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.名, x, y + 19);
      }
      ctx.restore();
    });
  }

  const PATH_COLOR = {};
  E.PATHS.forEach((p) => (PATH_COLOR[p.id] = p.色));

  function hashId(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function drawFigure(c, x, y, s, robe, opts) {
    opts = opts || {};
    const walking = opts.walking;
    const bob = walking ? Math.abs(Math.sin(t * 9 + (opts.phase || 0))) * 1.6 : Math.sin(t * 1.6 + (opts.phase || 0)) * 0.4;
    const yy = y - bob;

    c.save();
    c.globalAlpha = (opts.alpha == null ? 1 : opts.alpha);
    if (opts.glow) {
      const g = c.createRadialGradient(x, yy - s * 0.5, s * 0.2, x, yy - s * 0.5, s * 2.1);
      g.addColorStop(0, hexA(opts.glow, 0.30));
      g.addColorStop(1, hexA(opts.glow, 0));
      c.fillStyle = g;
      c.beginPath(); c.arc(x, yy - s * 0.5, s * 2.1, 0, 6.2832); c.fill();
    }

    c.fillStyle = 'rgba(70,60,45,0.20)';
    c.beginPath();
    c.ellipse(x, y + s * 0.28, s * 0.62, s * 0.26, 0, 0, 6.2832);
    c.fill();

    const shoulderY = yy - s * 0.42;
    const hemY = yy + s * 0.30;
    const halfS = s * 0.34;
    const halfH = s * 0.46;
    c.beginPath();
    c.moveTo(x - halfS, shoulderY);
    c.quadraticCurveTo(x - halfH * 0.92, shoulderY + s * 0.30, x - halfH, hemY);
    c.quadraticCurveTo(x, hemY + s * 0.14, x + halfH, hemY);
    c.quadraticCurveTo(x + halfH * 0.92, shoulderY + s * 0.30, x + halfS, shoulderY);
    c.quadraticCurveTo(x, shoulderY - s * 0.16, x - halfS, shoulderY);
    c.closePath();
    c.fillStyle = robe;
    c.fill();
    c.lineWidth = Math.max(0.5, s * 0.055);
    c.strokeStyle = 'rgba(255,250,240,0.55)';
    c.stroke();

    if (opts.sash) {
      c.strokeStyle = 'rgba(255,250,240,0.75)';
      c.lineWidth = Math.max(0.5, s * 0.09);
      c.beginPath();
      c.moveTo(x - halfH * 0.62, yy - s * 0.02);
      c.quadraticCurveTo(x, yy + s * 0.10, x + halfH * 0.62, yy - s * 0.02);
      c.stroke();
    }

    const headY = shoulderY - s * 0.24;
    const headR = s * 0.29;
    c.beginPath();
    c.arc(x, headY, headR, 0, 6.2832);
    c.fillStyle = opts.skin || '#e9d6bd';
    c.fill();
    c.beginPath();
    c.arc(x, headY - headR * 0.18, headR * 1.02, Math.PI * 0.98, Math.PI * 2.02);
    c.fillStyle = opts.hair || '#2f2b26';
    c.fill();
    if (opts.hairBun) {
      c.beginPath();
      c.arc(x, headY - headR * 0.95, headR * 0.42, 0, 6.2832);
      c.fillStyle = opts.hair || '#2f2b26';
      c.fill();
    }

    if (opts.weapon) {
      c.strokeStyle = 'rgba(90,95,105,0.85)';
      c.lineWidth = Math.max(0.6, s * 0.075);
      c.beginPath();
      c.moveTo(x + halfH * 0.92, yy + s * 0.02);
      c.lineTo(x + halfH * 1.28, yy - s * 0.62);
      c.stroke();
    }
    c.restore();
  }

  function drawBeings() {
    const st = E.state;
    const list = st.beings;
    const simple = cam.z < 0.5;
    const halfW = vw / 2 / cam.z + 90, halfH = vh / 2 / cam.z + 90;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (!b.活 || b.是玩家 || !b.位置) continue;
      const pos = interpPos(b);
      if (Math.abs(pos.x - cam.x) > halfW || Math.abs(pos.y - cam.y) > halfH) continue;
      const s = 7.5 + Math.min(5.5, b.境界 * 0.9);
      const col = PATH_COLOR[b.路径] || '#6b7a86';
      const h = hashId(b.id);
      if (simple) {
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3.4, 0, 6.2832);
        ctx.fillStyle = col;
        ctx.fill();
        continue;
      }
      drawFigure(ctx, pos.x, pos.y, s, col, {
        phase: h % 100,
        walking: b.位置 && b.位置.t < 1,
        glow: b.境界 >= 4 ? col : null,
        sash: b.境界 >= 2,
        weapon: (E.PATH_BY_ID[b.路径] || {}).id === 'jian' || b.境界 >= 3,
        hairBun: b.性别 === '女',
        alpha: b.id === hoverId ? 1 : 0.92
      });
      if (b.id === hoverId || (cam.z > 1.15 && b.境界 >= 4)) {
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#3f3a30';
        ctx.font = '10px "Noto Sans SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.道号, pos.x, pos.y - s * 1.55);
      }
    }
    ctx.globalAlpha = 1;
  }

  function interpPos(b) {
    const p = b.位置;
    if (!p) return { x: W / 2, y: H / 2 };
    if (p.from && p.to && p.t < 1) {
      const k = easeInOut(Math.max(0, Math.min(1, p.t)));
      return { x: lerp(p.from.x, p.to.x, k), y: lerp(p.from.y, p.to.y, k) };
    }
    return { x: p.to ? p.to.x : p.x, y: p.to ? p.to.y : p.y };
  }
  function easeInOut(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

  function drawPlayer() {
    const st = E.state;
    const p = st.player;
    if (!p || !p.位置 || !p.活) return;
    const pos = interpPos(p);
    const pulse = 1 + Math.sin(t * 2.2) * 0.06;
    ctx.save();
    const g = ctx.createRadialGradient(pos.x, pos.y, 3, pos.x, pos.y, 40 * pulse);
    g.addColorStop(0, 'rgba(176,69,60,0.26)');
    g.addColorStop(0.5, 'rgba(176,69,60,0.10)');
    g.addColorStop(1, 'rgba(176,69,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 40 * pulse, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = 'rgba(176,69,60,0.42)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pos.x, pos.y + 2, 17 + Math.sin(t * 1.6) * 2, 0, 6.2832); ctx.stroke();

    drawFigure(ctx, pos.x, pos.y, 12.5, '#b0453c', {
      phase: 0, walking: p.位置.t < 1, sash: true, weapon: true, hairBun: p.性别 === '女', skin: '#f0dcc4'
    });

    const label = p.道号;
    ctx.font = '600 12px "Noto Serif SC",serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(247,241,229,0.82)';
    roundRect(ctx, pos.x - tw / 2 - 5, pos.y - 40, tw + 10, 17, 3);
    ctx.fill();
    ctx.fillStyle = '#8a3229';
    ctx.fillText(label, pos.x, pos.y - 27);
    ctx.font = '10px "Noto Sans SC",sans-serif';
    ctx.fillStyle = 'rgba(90,70,50,0.82)';
    ctx.fillText(E.realmName(p.境界, p.层), pos.x, pos.y - 15);
    ctx.restore();
  }

  function drawSelection() {
    const b = E.state.beings.find((x) => x.id === selectedId);
    if (!b || !b.位置) return;
    const pos = interpPos(b);
    ctx.save();
    ctx.strokeStyle = 'rgba(60,55,45,0.65)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 18 + Math.sin(t * 3) * 2, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  function drawWeather() {
    const wx = E.state.天象;
    if (!wx) return;
    ctx.save();
    if (wx.includes('雨') || wx.includes('雾')) {
      ctx.strokeStyle = 'rgba(120,130,140,0.16)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 90; i++) {
        const x = cam.x + ((i * 137 + t * 160) % (vw / cam.z)) - vw / cam.z / 2;
        const y = cam.y + ((i * 219 + t * 420) % (vh / cam.z)) - vh / cam.z / 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14); ctx.stroke();
      }
    } else if (wx.includes('雪')) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let i = 0; i < 70; i++) {
        const x = cam.x + ((i * 173 + t * 30) % (vw / cam.z)) - vw / cam.z / 2;
        const y = cam.y + ((i * 241 + t * 60) % (vh / cam.z)) - vh / cam.z / 2;
        ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 6.2832); ctx.fill();
      }
    } else if (wx.includes('血月') || wx.includes('黑云')) {
      ctx.fillStyle = 'rgba(80,40,50,0.06)';
      ctx.fillRect(cam.x - vw / cam.z, cam.y - vh / cam.z, vw / cam.z * 2, vh / cam.z * 2);
    }
    ctx.restore();
  }

  let vignetteCache = null, vignetteKey = '';
  function drawVignette() {
    const key = vw + 'x' + vh;
    if (vignetteKey !== key) {
      vignetteKey = key;
      vignetteCache = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.35, vw / 2, vh / 2, Math.max(vw, vh) * 0.75);
      vignetteCache.addColorStop(0, 'rgba(60,50,35,0)');
      vignetteCache.addColorStop(1, 'rgba(60,50,35,0.20)');
    }
    ctx.fillStyle = vignetteCache;
    ctx.fillRect(0, 0, vw, vh);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  /* ---------------- 交互 ---------------- */
  function screenToWorld(sx, sy) {
    return { x: (sx - vw / 2) / cam.z + cam.x, y: (sy - vh / 2) / cam.z + cam.y };
  }

  function pickAt(sx, sy) {
    if (!E.state) return null;
    const w = screenToWorld(sx, sy);
    let best = null, bestD = 1e9;
    const p = E.state.player;
    if (p && p.活 && p.位置) {
      const pos = interpPos(p);
      const d = Math.hypot(pos.x - w.x, pos.y - w.y);
      if (d < 22 / cam.z + 8) { best = p; bestD = d; }
    }
    E.state.beings.forEach((b) => {
      if (!b.活 || b.是玩家 || !b.位置) return;
      const pos = interpPos(b);
      const d = Math.hypot(pos.x - w.x, pos.y - w.y);
      if (d < 16 / cam.z + 6 && d < bestD) { best = b; bestD = d; }
    });
    return best;
  }

  function pickRegion(sx, sy) {
    const w = screenToWorld(sx, sy);
    let best = null, bestD = 1e9;
    E.REGIONS.forEach((r) => {
      const [x, y] = E.POS[r.id];
      const rad = (RADIUS[r.id] || 120) * 0.9;
      const d = Math.hypot(w.x - x, (w.y - y) / 0.82);
      if (d < rad && d < bestD) { best = r; bestD = d; }
    });
    return best;
  }

  let drag = null;
  let pointers = new Map();
  let pinch = null;

  function bindInput(onSelect, onRegion) {
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.tz };
        drag = null;
      } else {
        drag = { x: e.clientX, y: e.clientY, cx: cam.tx, cy: cam.ty, moved: 0 };
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        cam.tz = Math.max(0.28, Math.min(1.6, pinch.z * (d / pinch.d)));
        clampCam();
        return;
      }
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
        if (drag.moved > 11) {
          if (follow) {
            follow = false;
            document.getElementById('btn-follow').classList.remove('on');
            if (global.Settings) { global.Settings.cfg.follow = false; global.Settings.saveCfg(); }
          }
          cam.tx = drag.cx - dx / cam.z;
          cam.ty = drag.cy - dy / cam.z;
          cam.x = cam.tx; cam.y = cam.ty;
          clampCam();
        }
      } else if (e.pointerType === 'mouse') {
        const hit = pickAt(e.clientX, e.clientY);
        hoverId = hit ? hit.id : null;
        canvas.style.cursor = hit ? 'pointer' : 'grab';
      }
    });
    const up = (e) => {
      const wasDrag = drag && drag.moved > 11;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (drag && !wasDrag) {
        const hit = pickAt(e.clientX, e.clientY);
        if (hit) { selectedId = hit.id; onSelect(hit); }
        else {
          selectedId = null;
          const r = pickRegion(e.clientX, e.clientY);
          if (r) onRegion(r);
        }
      }
      drag = null;
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const before = screenToWorld(e.clientX, e.clientY);
      cam.tz = Math.max(0.28, Math.min(1.6, cam.tz * (e.deltaY > 0 ? 0.9 : 1.11)));
      cam.z = cam.tz;
      const after = screenToWorld(e.clientX, e.clientY);
      cam.tx += before.x - after.x;
      cam.ty += before.y - after.y;
      cam.x = cam.tx; cam.y = cam.ty;
      clampCam();
    }, { passive: false });
  }

  const Renderer = {
    resize, draw, bindInput, cam,
    pickAt, pickRegion, interpPos,
    focus(x, y, z) { cam.tx = x; cam.ty = y + bias(); if (z) cam.tz = z; },
    snapTo(x, y, z) { cam.tz = cam.z = z || cam.z; clampCam(); cam.tx = cam.x = x; cam.ty = cam.y = y + bias(); clampCam(); cam.x = cam.tx; cam.y = cam.ty; },
    setFollow(v) {
      follow = !!v;
      if (follow) {
        cam.tz = Math.max(cam.tz, 0.9);
        followGlide = Math.hypot(cam.x - cam.tx, cam.y - cam.ty) > 120 ? 0.55 : 0;
      }
    },
    get follow() { return follow; },
    setSelected(id) { selectedId = id; },
    get selected() { return selectedId; },
    markStatic() { staticDirty = true; }
  };
  global.Renderer = Renderer;
})(window);

</script>
<script>
/* 赤霄洲 · 界面层 */
(function (global) {
  'use strict';
  const E = global.Engine;
  const R = global.Renderer;
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let tab = 'log';
  let toastTimer = null;
  let sparkData = [];

  function syncDockVar() {
    const dock = $('#dock');
    if (dock) document.documentElement.style.setProperty('--dockh', Math.round(dock.getBoundingClientRect().height) + 'px');
  }

  function toast(msg) {
    const t = $('#toast');
    syncDockVar();
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
  }

  /* ---------------- 模态 ---------------- */
  function openSheet(opts) {
    closeSheet();
    const root = $('#modal-root');
    const mask = el('div', 'mask');
    const sheet = el('div', 'sheet' + (opts.cls ? ' ' + opts.cls : ''));
    const hd = el('div', 'hd');
    hd.appendChild(el('h2', null, opts.title || ''));
    if (opts.headExtra) hd.appendChild(opts.headExtra);
    const x = el('button', 'x', '×');
    x.onclick = closeSheet;
    hd.appendChild(x);
    const bd = el('div', 'bd');
    if (typeof opts.body === 'string') bd.innerHTML = opts.body;
    else if (opts.body) bd.appendChild(opts.body);
    sheet.appendChild(hd); sheet.appendChild(bd);
    if (opts.footer) {
      const ft = el('div', 'sheet-footer');
      if (typeof opts.footer === 'string') ft.innerHTML = opts.footer;
      else ft.appendChild(opts.footer);
      sheet.appendChild(ft);
    }
    mask.onclick = (e) => { if (e.target === mask) closeSheet(); };
    root.appendChild(mask); root.appendChild(sheet);
    root.style.pointerEvents = 'auto';
    return bd;
  }
  function closeSheet() {
    const root = $('#modal-root');
    root.innerHTML = '';
    root.style.pointerEvents = 'none';
  }

  /* ---------------- 顶栏 ---------------- */
  function renderTop() {
    const st = E.state;
    if (!st) return;
    $('#date').textContent = E.dateShort(st);
    syncDockVar();
    const bar = $('#speedbar');
    if (!bar.dataset.built) {
      bar.dataset.built = '1';
      const speeds = [[0, '停'], [1, '一'], [3, '二'], [6, '三'], [12, '四'], [30, '五']];
      speeds.forEach(([v, label]) => {
        const b = el('button', null, label);
        b.dataset.spd = v;
        b.onclick = () => {
          st.paused = v === 0;
          st.speed = v || 1;
          renderTop();
        };
        bar.appendChild(b);
      });
    }
    [...bar.children].forEach((b) => {
      const v = Number(b.dataset.spd);
      const on = st.paused ? v === 0 : v === st.speed;
      b.classList.toggle('on', on);
    });
  }

  /* ---------------- 角色卡 ---------------- */
  function renderPlayerCard() {
    const card = $('#pcard');
    if (!E.state || !E.state.player) { card.innerHTML = ''; return; }
    const p = E.state.player;
    const cap = E.expCap(p.境界, p.层);
    const pct = Math.min(100, (p.修为 / cap) * 100);
    const need = Math.max(0, cap - p.修为);
    const alive = p.活;
    card.innerHTML = `
      <div class="nm"><b>${esc(p.道号)}</b><span>${alive ? (p.宗门 && E.SECT_BY_ID[p.宗门] ? esc(E.SECT_BY_ID[p.宗门].名) : '散修') : '已陨'}</span></div>
      <div class="sub">${esc(E.realmName(p.境界, p.层))} · ${esc((E.PATH_BY_ID[p.路径] || {}).名 || '')} · ${Math.floor(p.年龄)}岁</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><span>修为 ${fmtNum(p.修为)}</span><span>${p.境界 >= E.REALMS.length - 1 && p.层 >= E.REALMS[p.境界].层名.length - 1 ? '已至绝巅' : need > 0 ? '距破境 ' + fmtNum(need) : '可破境'}</span></div>
      <div class="row"><span>灵石 ${fmtNum(p.灵石)}</span><span>道心 ${Math.round(p.道心)}</span></div>
      <canvas class="spark" width="320" height="40"></canvas>`;
    card.onclick = () => showBeing(p.id);
    drawSpark(card.querySelector('.spark'));
  }

  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    if (n >= 100) return Math.round(n).toString();
    return n.toFixed(0);
  }

  function drawSpark(cv) {
    const p = E.state.player;
    sparkData.push(Math.min(1, p.修为 / E.expCap(p.境界, p.层)));
    if (sparkData.length > 40) sparkData.shift();
    if (!cv) return;
    const c = cv.getContext('2d');
    const w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    c.strokeStyle = 'rgba(93,125,108,.75)';
    c.lineWidth = 2;
    c.beginPath();
    sparkData.forEach((v, i) => {
      const x = (i / Math.max(1, sparkData.length - 1)) * w;
      const y = h - 3 - v * (h - 6);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(93,125,108,.22)');
    g.addColorStop(1, 'rgba(93,125,108,0)');
    c.lineTo(w, h); c.lineTo(0, h); c.closePath();
    c.fillStyle = g; c.fill();
  }

  /* ---------------- 底部 ---------------- */
  function setTab(t) {
    tab = t;
    logStamp = -1; chronStamp = -1;
    [...document.querySelectorAll('.tab')].forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
    $('#dock').classList.remove('folded');
    $('#tab-fold').textContent = '▾';
    const body = $('#dockbody');
    if (body) body.innerHTML = '';
    renderDock(true);
  }

  function renderDock(force) {
    if (!E.state) return;
    const body = $('#dockbody');
    if (tab === 'log') { renderLog(body, force); return; }
    if (tab === 'chron') { renderChron(body, force); return; }
    const scroll = body.scrollTop;
    body.innerHTML = '';
    renderWorld(body);
    body.scrollTop = scroll;
  }

  const TAG_CLS = { 突破: 'g', 轮回: 'r', 生死: 'r', 天命: 'r', 成就: 'g', 机缘: 'g' };
  let logStamp = -1, chronStamp = -1;

  function entryNode(l) {
    const d = el('div', 'entry');
    d.innerHTML = `<div class="hd"><span class="tag ${TAG_CLS[l.类] || 'k'}">${esc(l.类)}</span><span class="tm">${esc(l.t)}</span></div><div class="tx">${esc(l.文)}</div>`;
    return d;
  }

  function renderLog(box, force) {
    const log = E.log;
    if (!log.length) { box.appendChild(el('div', 'entry', '尚无见闻。')); logStamp = 0; return; }
    if (force || logStamp < 0 || logStamp > log.length) {
      box.innerHTML = '';
      const start = Math.max(0, log.length - 60);
      for (let i = log.length - 1; i >= start; i--) box.appendChild(entryNode(log[i]));
      logStamp = log.length;
      return;
    }
    const fresh = log.length - logStamp;
    if (fresh <= 0) return;
    const atTop = box.scrollTop < 8;
    for (let i = logStamp; i < log.length; i++) box.insertBefore(entryNode(log[i]), box.firstChild);
    logStamp = log.length;
    while (box.children.length > 70) box.removeChild(box.lastChild);
    if (atTop) box.scrollTop = 0;
  }

  function renderChron(box, force) {
    const chr = E.chronicle;
    if (!chr.length) { box.appendChild(el('div', 'chr', '史册尚空。')); chronStamp = 0; return; }
    if (force || chronStamp < 0 || chronStamp > chr.length) {
      box.innerHTML = '';
      const start = Math.max(0, chr.length - 90);
      for (let i = chr.length - 1; i >= start; i--) box.appendChild(chrNode(chr[i]));
      chronStamp = chr.length;
      return;
    }
    const fresh = chr.length - chronStamp;
    if (fresh <= 0) return;
    const atTop = box.scrollTop < 8;
    for (let i = chronStamp; i < chr.length; i++) box.insertBefore(chrNode(chr[i]), box.firstChild);
    chronStamp = chr.length;
    while (box.children.length > 100) box.removeChild(box.lastChild);
    if (atTop) box.scrollTop = 0;
  }

  function chrNode(c) {
    const d = el('div', 'chr' + (c.重要 ? ' imp' : ''));
    d.innerHTML = `<div class="yr">${esc(c.短 || c.t)}</div><div class="bd"><div class="cl">${esc(c.类)}</div><div class="tx">${esc(c.文)}</div></div>`;
    return d;
  }

  function renderWorld(box) {
    const st = E.state;
    const s = st.统计;
    const line = el('div', 'statline');
    line.innerHTML = `<span>在册修士 <b>${st.beings.filter((b) => b.活).length}</b></span>
      <span>破境 <b>${s.破境}</b></span><span>陨落 <b>${s.陨落}</b></span>
      <span>争斗 <b>${s.争斗}</b></span><span>天象 <b>${esc(st.天象)}</b></span>`;
    box.appendChild(line);
    const grid = el('div', 'wgrid');
    E.REGIONS.forEach((r) => {
      const rs = st.regions[r.id];
      const d = el('div', 'wcard');
      d.innerHTML = `<div class="rn">${esc(rs.名)}<em>${esc(rs.方位)}</em></div>
        <div class="mt"><span>灵机 ${rs.灵机.toFixed(2)}</span><span>凶险 ${rs.凶险}</span><span>${esc(rs.状态)}</span></div>
        <div class="mini"><i style="width:${Math.min(100, rs.灵机 / 2.6 * 100)}%"></i></div>`;
      d.onclick = () => showRegion(r.id);
      grid.appendChild(d);
    });
    box.appendChild(grid);
  }

  /* ---------------- 详情：人物 ---------------- */
  function statBars(p) {
    const items = [
      ['修为进度', Math.min(100, (p.修为 / E.expCap(p.境界, p.层)) * 100), Math.min(100, (p.修为 / E.expCap(p.境界, p.层)) * 100), '#5d7d6c', '%'],
      ['道心', p.道心, p.道心, '#7d8fa3', ''],
      ['魔念', p.魔念, p.魔念, '#8e3b57', ''],
      ['悟性', p.悟性, Math.min(100, p.悟性 * 2.4), '#a8823f', ''],
      ['根骨', p.根骨, Math.min(100, p.根骨 * 3.2), '#a35d3f', '']
    ];
    return `<div class="bars">${items.map(([n, shown, pct, c, unit]) => `<div class="b"><div class="lb"><span>${n}</span><span>${Math.round(shown)}${unit}</span></div><div class="tr"><i style="width:${Math.max(0, Math.min(100, pct))}%;background:${c}"></i></div></div>`).join('')}</div>`;
  }

  function beingHTML(p) {
    const sect = p.宗门 && E.SECT_BY_ID[p.宗门] ? E.SECT_BY_ID[p.宗门].名 : '散修';
    const path = E.PATH_BY_ID[p.路径] || {};
    const region = E.REGION_BY_ID[p.区域] || {};
    const rel = p.关系 || {};
    const relTxt = Object.keys(rel).length ? Object.keys(rel).map((k) => `${esc(k)}(${rel[k]})`).join('、') : '无';
    return `
      <div class="dt-title">${esc(p.道号)}<em>${esc(p.名)}${p.是玩家 ? ' · 本尊' : ''}</em></div>
      <div class="dt-meta">
        <span class="chip r">${esc(E.realmName(p.境界, p.层))}</span>
        <span class="chip">${esc(path.名 || '')}</span>
        <span class="chip">${esc(sect)}</span>
        <span class="chip">${esc(region.名 || '')}</span>
        <span class="chip ${p.活 ? 'g' : 'r'}">${p.活 ? esc(p.状态 || '在野') : '已陨'}</span>
      </div>
      ${statBars(p)}
      <div class="kv">
        <div><span>年龄</span><b>${Math.floor(p.年龄)}</b></div>
        <div><span>寿元</span><b>${Math.floor(p.寿元)}</b></div>
        <div><span>战力</span><b>${fmtNum(E.powerOf(p))}</b></div>
        <div><span>灵石</span><b>${fmtNum(p.灵石)}</b></div>
        <div><span>声望</span><b>${Math.round(p.声望)}</b></div>
        <div><span>因果</span><b>${Math.round(p.因果)}</b></div>
        <div><span>灵根</span><b>${p.灵根分}品</b></div>
        <div><span>属性</span><b>${(p.元素 || []).join('')}</b></div>
        <div><span>命数</span><b>${p.命数 != null ? p.命数 : 1}</b></div>
        <div><span>志向</span><b style="font-size:11px">${esc(p.志向)}</b></div>
      </div>
      <div class="dt-p" style="font-size:11.5px;color:var(--ink-3)">标签：${esc(p.标签)} · 关系：${relTxt}</div>
      <div class="dt-p" style="font-size:11.5px;color:var(--ink-3)">功法：${(p.功法 || []).map((g) => esc(g.名) + '(' + esc(g.品) + ')').join('、') || '无'}</div>
      <div class="dt-p" style="font-size:11.5px;color:var(--ink-3)">法宝：${(p.法宝 || []).map((g) => esc(g.名) + '(' + esc(g.品) + ')').join('、') || '无'}</div>
      <div class="cg-divider"></div>
      <div style="font-family:var(--serif);font-size:12px;color:var(--ink-2);margin-bottom:6px">生平</div>
      <div class="dt-p" style="font-size:12px">${(p.传记 || []).slice(-8).reverse().map((x) => `【${esc(x.t)}】${esc(x.题)} · 择「${esc(x.择)}」`).join('\n') || '尚无记载。'}</div>`;
  }

  function showBeing(id) {
    const p = E.state.beings.find((b) => b.id === id);
    if (!p) return;
    R.setSelected(id);
    const wrap = el('div');
    wrap.innerHTML = beingHTML(p);
    const btns = el('div', 'btnrow');
    const b1 = el('button', 'btn d', '天机笔改此人');
    b1.onclick = () => { closeSheet(); global.Cheat.open('being', id); };
    const b2 = el('button', 'btn', '镜头移至此人');
    b2.onclick = () => {
      const pos = R.interpPos(p);
      R.setFollow(false); $('#btn-follow').classList.remove('on');
      R.focus(pos.x, pos.y, 1.05);
      closeSheet();
    };
    btns.appendChild(b1); btns.appendChild(b2);
    if (!p.是玩家) {
      const b3 = el('button', 'btn', p.活 ? '令其坐化' : '令其还阳');
      b3.onclick = () => {
        if (p.活) E.cheat.kill(p.id, '被天机笔勾去姓名');
        else E.cheat.revive(p.id);
        closeSheet(); toast('已改其命数');
      };
      btns.appendChild(b3);
    }
    wrap.appendChild(btns);
    openSheet({ title: '修士簿', body: wrap });
  }

  /* ---------------- 详情：区域 ---------------- */
  function showRegion(id) {
    const rs = E.state.regions[id];
    const r = E.REGION_BY_ID[id];
    if (!rs || !r) return;
    const sectList = Object.keys(E.state.sects).filter((sid) => E.SECT_HOME[sid] === id);
    const wrap = el('div');
    wrap.innerHTML = `
      <div class="dt-title">${esc(r.名)}<em>${esc(r.方位)}</em></div>
      <div class="dt-meta">
        <span class="chip">灵机 ${rs.灵机.toFixed(2)}</span>
        <span class="chip">凶险 ${rs.凶险}</span>
        <span class="chip g">${esc(rs.状态)}</span>
      </div>
      <div class="dt-p">${esc(r.描述)}</div>
      <div class="kv">
        <div><span>地貌</span><b style="font-size:12px">${esc(r.地貌)}</b></div>
        <div><span>气运</span><b>${Math.round(rs.气运)}</b></div>
        <div><span>特产</span><b style="font-size:11px">${esc(r.特产.join('、'))}</b></div>
        <div><span>异象</span><b style="font-size:11px">${esc(r.异象.join('、'))}</b></div>
      </div>
      <div style="font-family:var(--serif);font-size:12px;color:var(--ink-2);margin:8px 0 4px">此地宗门</div>
      ${sectList.map((sid) => {
        const s = E.state.sects[sid];
        return `<div class="sect-line clickable" data-sid="${sid}"><b>${esc(s.名)}</b><span class="chip">${esc(s.类型)}</span><span>${esc(s.道统)}</span><em>势力 ${s.势力} · ${esc(s.状态)}</em></div>`;
      }).join('') || '<div class="dt-p" style="font-size:11.5px">无宗门驻此。</div>'}`;
    wrap.querySelectorAll('.sect-line[data-sid]').forEach((row) => {
      row.onclick = () => { const sid = row.dataset.sid; closeSheet(); global.Cheat.open('sect', sid); };
    });
    const btns = el('div', 'btnrow');
    const b1 = el('button', 'btn d', '天机笔改此地');
    b1.onclick = () => { closeSheet(); global.Cheat.open('region', id); };
    const b2 = el('button', 'btn', '迁本尊至此');
    b2.onclick = () => {
      const p = E.state.player;
      p.区域 = id;
      const [x, y] = E.POS[id];
      p.位置 = { x, y, from: null, to: null, t: 1 };
      closeSheet(); toast('已至' + r.名);
      renderAll();
    };
    const b3 = el('button', 'btn', '镜头移至此地');
    b3.onclick = () => { const [x, y] = E.POS[id]; R.setFollow(false); $('#btn-follow').classList.remove('on'); R.focus(x, y, 0.85); closeSheet(); };
    btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3);
    wrap.appendChild(btns);
    openSheet({ title: '域志', body: wrap });
  }

  /* ---------------- 图鉴 ---------------- */
  const CODEX = [];
  (function buildCodex() {
    const seen = new Set();
    Object.keys(E.REGION_EVENTS).forEach((rid) => {});
    const push = (c) => {
      if (!c || !c.名 || seen.has(c.名 + '|' + c.文)) return;
      seen.add(c.名 + '|' + c.文);
      CODEX.push(c);
    };
    Object.keys(global.GAME_DATA.regions).forEach((rid) => {
      const d = global.GAME_DATA.regions[rid];
      (d.图鉴 || []).forEach(push);
    });
    (global.GAME_DATA.codex || []).forEach(push);
  })();

  let codexCat = '全部';
  function showCodex() {
    const cats = ['全部', '地理', '宗门', '人物', '法宝', '功法', '丹药', '异兽', '秘闻', '风俗'];
    const wrap = el('div');
    const catRow = el('div', 'cx-cats');
    cats.forEach((c) => {
      const b = el('button', 'cx-cat' + (c === codexCat ? ' on' : ''), c);
      b.onclick = () => { codexCat = c; closeSheet(); showCodex(); };
      catRow.appendChild(b);
    });
    wrap.appendChild(catRow);
    const list = el('div');
    const items = CODEX.filter((c) => codexCat === '全部' || c.类 === codexCat);
    list.innerHTML = items.map((c, i) => `<div class="cx-item" data-i="${CODEX.indexOf(c)}"><div class="t"><em>${esc(c.类)}</em>${esc(c.名)}</div><div class="s">${esc(c.文)}</div></div>`).join('') || '<div class="dt-p">此类尚无词条。</div>';
    list.onclick = (e) => {
      const it = e.target.closest('.cx-item');
      if (!it) return;
      const c = CODEX[Number(it.dataset.i)];
      if (!c) return;
      closeSheet();
      openSheet({
        title: c.类 + ' · ' + c.名,
        body: `<div class="dt-title">${esc(c.名)}<em>${esc(c.类)}</em></div>
          <div class="dt-p">${esc(c.文)}</div>
          <div class="dt-p" style="font-size:11.5px;color:var(--gold)">${esc(c.引 || '')}</div>`
      });
    };
    wrap.appendChild(list);
    openSheet({ title: '赤霄洲图鉴', body: wrap });
  }

  /* ---------------- 众生 ---------------- */
  function showBeings() {
    const st = E.state;
    const list = st.beings.slice().sort((a, b) => (b.活 - a.活) || (b.境界 - a.境界) || (b.声望 - a.声望)).slice(0, 120);
    const wrap = el('div');
    const top = el('div', 'statline');
    top.innerHTML = `<span>在册 <b>${st.beings.filter((b) => b.活).length}</b></span><span>已陨 <b>${st.beings.filter((b) => !b.活).length}</b></span>`;
    wrap.appendChild(top);
    list.forEach((b) => {
      const d = el('div', 'being-row' + (b.活 ? '' : ' dead'));
      d.innerHTML = `<span class="dot" style="background:${(E.PATH_BY_ID[b.路径] || {}).色 || '#888'}"></span>
        <span class="nm">${esc(b.道号)}${b.是玩家 ? ' <em style="font-style:normal;color:var(--cinnabar)">本尊</em>' : ''}</span>
        <span class="rl">${esc(E.realmName(b.境界, b.层))}</span>`;
      d.onclick = () => { closeSheet(); showBeing(b.id); };
      wrap.appendChild(d);
    });
    openSheet({ title: '众生簿', body: wrap });
  }

  /* ---------------- 绑定 ---------------- */
  function bind() {
    [...document.querySelectorAll('.tab')].forEach((b) => {
      if (b.id === 'tab-fold') return;
      b.onclick = () => setTab(b.dataset.tab);
    });
    $('#tab-fold').onclick = () => {
      const d = $('#dock');
      d.classList.toggle('folded');
      $('#tab-fold').textContent = d.classList.contains('folded') ? '▴' : '▾';
    };
    document.querySelectorAll('.sbtn').forEach((b) => {
      if (b.id === 'btn-follow') return;
      b.onclick = () => {
        document.querySelectorAll('.sbtn').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        const p = b.dataset.panel;
        if (p === 'chronicle') { setTab('chron'); }
        else if (p === 'codex') showCodex();
        else if (p === 'beings') showBeings();
        setTimeout(() => b.classList.remove('on'), 200);
      };
    });
    $('#btn-follow').onclick = () => {
      const on = !R.follow;
      R.setFollow(on);
      $('#btn-follow').classList.toggle('on', on);
      if (global.Settings) { global.Settings.cfg.follow = on; global.Settings.saveCfg(); }
      toast(on ? '镜头已随本尊' : '已取消跟随，可自由拖动');
    };
    $('#btn-cheat').onclick = () => global.Cheat.open();
    $('#btn-set').onclick = () => global.Settings.open();
    R.bindInput((b) => showBeing(b.id), (r) => showRegion(r.id));
  }

  function renderAll() {
    renderTop();
    renderPlayerCard();
    renderDock();
  }

  function currentTab() { return tab; }

  function showDeath(info) {
    const wrap = el('div');
    wrap.innerHTML = `<div class="dt-title" style="color:var(--cinnabar)">道消</div>
      <div class="dt-p">「${esc(info.道号)}」${esc(info.原因)}，享年 ${info.寿}，止步 ${esc(info.境)}。</div>
      <div class="dt-p" style="font-size:11.5px;color:var(--ink-3)">九州不会因为少一个人而停转——但它记下了你的名字。</div>`;
    const row = el('div', 'btnrow');
    const b1 = el('button', 'btn p', '转世重修');
    b1.onclick = () => { E.cheat.reincarnate(); closeSheet(); renderAll(); toast('二世为人'); };
    const b2 = el('button', 'btn', '另开一世');
    b2.onclick = () => { E.reset(); closeSheet(); renderAll(); toast('新的一世'); };
    row.appendChild(b1); row.appendChild(b2);
    wrap.appendChild(row);
    openSheet({ title: '生死簿', body: wrap });
  }

  function bindEvents() {
    E.subscribe((kind, payload) => {
      if (kind === 'death') setTimeout(() => showDeath(payload), 400);
    });
  }

  const UI = { toast, showDeath, bindEvents, openSheet, closeSheet, showBeing, showRegion, showCodex, showBeings, renderAll, renderTop, renderPlayerCard, renderDock, drawSpark, fmtNum, bind, setTab, currentTab };
  global.UI = UI;
})(window);

</script>
<script>
/* 赤霄洲 · 金手指「天机笔」—— 可改游戏内一切 */
(function (global) {
  'use strict';
  const E = global.Engine;
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let curTab = 'player';
  let selBeing = 'player';
  let selRegion = 'qinglan';
  let selSect = 'qingyun';
  let unlocked = true;
  let bodyRef = null;

  function open(tab, id) {
    if (tab) curTab = tab;
    if (curTab === 'being' && id) selBeing = id;
    if (curTab === 'region' && id) selRegion = id;
    if (curTab === 'sect' && id) selSect = id;
    $('#btn-cheat').classList.add('on');
    const wrap = el('div');
    wrap.innerHTML = `<div class="cg-note">天机笔一落，因果皆可改。此处可直接改写境界、寿元、宗门、地域、天时与规则——改完立即生效，无需重开。</div>
      <div class="cg-tabs">
        <button class="cg-tab" data-t="player">本尊</button>
        <button class="cg-tab" data-t="being">众生</button>
        <button class="cg-tab" data-t="region">地域</button>
        <button class="cg-tab" data-t="sect">宗门</button>
        <button class="cg-tab" data-t="world">天下</button>
        <button class="cg-tab" data-t="event">事件</button>
        <button class="cg-tab" data-t="rule">规则</button>
        <button class="cg-tab" data-t="data">存档</button>
      </div>
      <div id="cgbody"></div>`;
    bodyRef = global.UI.openSheet({ title: '天机笔 · 金手指', body: wrap, cls: 'cheat' });
    wrap.querySelectorAll('.cg-tab').forEach((b) => {
      b.onclick = () => { curTab = b.dataset.t; render(); };
    });
    render();
  }

  function render() {
    const box = $('#cgbody');
    if (!box) return;
    box.parentElement.parentElement.querySelectorAll('.cg-tab').forEach((b) => b.classList.toggle('on', b.dataset.t === curTab));
    box.innerHTML = '';
    const fn = { player: secPlayer, being: secBeing, region: secRegion, sect: secSect, world: secWorld, event: secEvent, rule: secRule, data: secData }[curTab];
    if (fn) box.appendChild(fn());
    box.parentElement.scrollTop = 0;
  }

  /* ---------- 通用控件 ---------- */
  function group(title) {
    const g = el('div', 'cg-group');
    if (title) g.appendChild(el('h3', null, title));
    return g;
  }
  function field(label, input) {
    const f = el('div', 'fld');
    f.appendChild(el('label', null, label));
    const w = el('div', 'inp');
    if (Array.isArray(input)) input.forEach((x) => w.appendChild(x));
    else w.appendChild(input);
    f.appendChild(w);
    return f;
  }
  function numInput(val, min, max, step, onchange) {
    const i = el('input');
    i.type = 'number';
    if (min != null) i.min = min;
    if (max != null) i.max = max;
    i.step = step || 1;
    i.value = val;
    i.onchange = () => onchange(Number(i.value));
    return i;
  }
  function textInput(val, onchange, placeholder) {
    const i = el('input');
    i.type = 'text';
    i.value = val == null ? '' : val;
    if (placeholder) i.placeholder = placeholder;
    i.onchange = () => onchange(i.value);
    return i;
  }
  function selectInput(val, options, onchange) {
    const s = el('select');
    options.forEach(([v, label]) => {
      const o = el('option', null, label);
      o.value = v;
      if (String(v) === String(val)) o.selected = true;
      s.appendChild(o);
    });
    s.onchange = () => onchange(s.value);
    return s;
  }
  function rangeInput(val, min, max, step, oninput, fmt) {
    const r = el('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = step || 1; r.value = val;
    const v = el('span', 'val', fmt ? fmt(val) : val);
    r.oninput = () => { v.textContent = fmt ? fmt(r.value) : r.value; oninput(Number(r.value)); };
    return [r, v];
  }
  function toggle(val, onchange) {
    const w = el('label', 'sw');
    const i = el('input');
    i.type = 'checkbox';
    i.checked = !!val;
    i.onchange = () => onchange(i.checked);
    w.appendChild(i); w.appendChild(el('i'));
    return w;
  }
  function btn(label, cls, onclick) {
    const b = el('button', 'btn ' + (cls || ''), label);
    b.onclick = onclick;
    return b;
  }
  function btnrow(list) {
    const r = el('div', 'btnrow');
    list.forEach((b) => b && r.appendChild(b));
    return r;
  }
  function hint(txt) { return el('div', 'cg-hint', txt); }

  function after(msg, rerender) {
    global.UI.toast(msg || '天机已改');
    global.UI.renderAll();
    if (global.Renderer) global.Renderer.markStatic();
    if (rerender) render();
  }

  /* ---------- 本尊 ---------- */
  function secPlayer() {
    const p = E.state.player;
    const f = el('div');

    const g0 = group('名号');
    g0.appendChild(field('道号', textInput(p.道号, (v) => { p.道号 = v; after('道号已改'); })));
    g0.appendChild(field('姓名', [textInput(p.姓, (v) => { p.姓 = v; after(); }, '姓'), textInput(p.名, (v) => { p.名 = v; after(); }, '名')]));
    g0.appendChild(field('性别', selectInput(p.性别, [['男', '男'], ['女', '女']], (v) => { p.性别 = v; after(); })));
    g0.appendChild(field('志向', selectInput(p.志向, E.POOLS.志向.map((x) => [x, x]), (v) => { p.志向 = v; after(); })));
    f.appendChild(g0);

    const g1 = group('境界与修为');
    const realmOpts = E.REALMS.map((r, i) => [i, r.名]);
    g1.appendChild(field('境界', selectInput(p.境界, realmOpts, (v) => { E.cheat.setRealm('player', Number(v), 0); after('已改境界', true); })));
    g1.appendChild(field('层数', selectInput(p.层, E.REALMS[p.境界].层名.map((n, i) => [i, n]), (v) => { p.层 = Number(v); after(); })));
    g1.appendChild(field('修为', [numInput(Math.round(p.修为), 0, null, 1, (v) => { p.修为 = v; after(); }),
      btn('满', 'sm', () => { p.修为 = E.expCap(p.境界, p.层); after('修为已满，静待破境'); })]));
    g1.appendChild(field('强制破境', btnrow([
      btn('立刻破境', 'p', () => { E.cheat.breakthrough('player', true); after('破境成功'); }),
      btn('满修不破', '', () => { p.修为 = E.expCap(p.境界, p.层) * 0.999; after(); }),
      btn('直接飞升', 'k', () => { E.cheat.setRealm('player', E.REALMS.length - 1, 3); after('已至大罗圆满'); })
    ])));
    f.appendChild(g1);

    const g2 = group('寿元与命数');
    g2.appendChild(field('年龄', numInput(Math.floor(p.年龄), 0, null, 1, (v) => { p.年龄 = v; after(); })));
    g2.appendChild(field('寿元', [numInput(Math.floor(p.寿元), 1, null, 1, (v) => { p.寿元 = v; after(); }),
      btn('+100年', 'sm', () => { p.寿元 += 100; after('添寿百年'); })]));
    g2.appendChild(field('命数', numInput(p.命数 == null ? 1 : p.命数, 0, 999, 1, (v) => { p.命数 = v; after(); })));
    f.appendChild(g2);

    const g3 = group('属性');
    const attrs = [['悟性', '悟性', 1, 999], ['根骨', '根骨', 1, 999], ['机缘', '机缘', 1, 999], ['声望', '声望', 0, 99999], ['因果', '因果', -9999, 9999], ['灵石', '灵石', 0, null]];
    attrs.forEach(([label, key, min, max]) => {
      g3.appendChild(field(label, numInput(Math.round(p[key]), min, max, 1, (v) => { p[key] = v; after(); })));
    });
    g3.appendChild(field('道心', rangeInput(Math.round(p.道心), 0, 100, 1, (v) => { p.道心 = v; }, (v) => Math.round(v))));
    g3.appendChild(field('魔念', rangeInput(Math.round(p.魔念), 0, 100, 1, (v) => { p.魔念 = v; }, (v) => Math.round(v))));
    g3.appendChild(field('灵根', selectInput(p.灵根分, [[1, '伪灵根'], [2, '三灵根'], [3, '双灵根'], [4, '天灵根']], (v) => { p.灵根分 = Number(v); after(); })));
    f.appendChild(g3);

    const g4 = group('道途与出身');
    g4.appendChild(field('修行路径', selectInput(p.路径, E.PATHS.map((x) => [x.id, x.名 + ' · ' + x.别名]), (v) => { p.路径 = v; after(); })));
    g4.appendChild(field('所属宗门', selectInput(p.宗门, [['', '散修']].concat(E.SECTS.map((s) => [s.id, s.名])), (v) => { p.宗门 = v; after(); })));
    g4.appendChild(field('所在区域', selectInput(p.区域, E.REGIONS.map((r) => [r.id, r.名]), (v) => { E.cheat.setBeing('player', { 区域: v }); after('', true); })));
    g4.appendChild(field('身份', textInput(p.身份 || '', (v) => { p.身份 = v; after(); }, '外门弟子')));
    g4.appendChild(field('标签', textInput(p.标签, (v) => { p.标签 = v; after(); })));
    f.appendChild(g4);

    const g5 = group('一键');
    g5.appendChild(btnrow([
      btn('天道宠爱', 'p', () => {
        E.cheat.grantAll();
        p.修为 = E.expCap(p.境界, p.层);
        after('灵石十万、天阶功法六卷、仙器天机笔、全属性拉满');
      }),
      btn('无限灵石', 'g', () => { E.cheat.setRule({ 无限灵石: !E.state.规则.无限灵石 }); after('无限灵石：' + (E.state.规则.无限灵石 ? '开' : '关')); }),
      btn('原地复活', '', () => { E.cheat.revive('player'); after('已还阳'); })
    ]));
    f.appendChild(g5);
    return f;
  }

  /* ---------- 众生 ---------- */
  function secBeing() {
    const f = el('div');
    const listWrap = group('选择修士');
    const list = el('div', 'cg-list');
    const beings = E.state.beings.slice().sort((a, b) => (b.活 - a.活) || (b.境界 - a.境界)).slice(0, 80);
    beings.forEach((b) => {
      const d = el('div', 'cg-li' + (b.id === selBeing ? ' on' : ''));
      d.innerHTML = `<b>${esc(b.道号)}</b><em>${esc(E.realmName(b.境界, b.层))}${b.活 ? '' : ' · 已陨'}</em>`;
      d.onclick = () => { selBeing = b.id; render(); };
      list.appendChild(d);
    });
    listWrap.appendChild(list);
    listWrap.appendChild(btnrow([btn('新造一人', 'p', () => {
      const b = E.cheat.addBeing({ 区域: selRegion, 境界: Math.min(3, E.state.player.境界) });
      selBeing = b.id; after('已造「' + b.道号 + '」');
    })]));
    f.appendChild(listWrap);

    const b = E.cheat.being(selBeing);
    if (!b) return f;
    const g = group('改写「' + b.道号 + '」');
    g.appendChild(field('道号', textInput(b.道号, (v) => { b.道号 = v; after(); })));
    g.appendChild(field('境界', selectInput(b.境界, E.REALMS.map((r, i) => [i, r.名]), (v) => { E.cheat.setRealm(b.id, Number(v), 0); after('', true); })));
    g.appendChild(field('层数', selectInput(b.层, E.REALMS[b.境界].层名.map((n, i) => [i, n]), (v) => { b.层 = Number(v); after(); })));
    g.appendChild(field('年龄', numInput(Math.floor(b.年龄), 0, null, 1, (v) => { b.年龄 = v; after(); })));
    g.appendChild(field('寿元', numInput(Math.floor(b.寿元), 1, null, 1, (v) => { b.寿元 = v; after(); })));
    g.appendChild(field('道心', rangeInput(Math.round(b.道心), 0, 100, 1, (v) => { b.道心 = v; }, (v) => Math.round(v))));
    g.appendChild(field('魔念', rangeInput(Math.round(b.魔念), 0, 100, 1, (v) => { b.魔念 = v; }, (v) => Math.round(v))));
    g.appendChild(field('声望', numInput(Math.round(b.声望), 0, null, 1, (v) => { b.声望 = v; after(); })));
    g.appendChild(field('宗门', selectInput(b.宗门, [['', '散修']].concat(E.SECTS.map((s) => [s.id, s.名])), (v) => { b.宗门 = v; after(); })));
    g.appendChild(field('路径', selectInput(b.路径, E.PATHS.map((x) => [x.id, x.名]), (v) => { b.路径 = v; after(); })));
    g.appendChild(field('区域', selectInput(b.区域, E.REGIONS.map((r) => [r.id, r.名]), (v) => { E.cheat.setBeing(b.id, { 区域: v }); after('', true); })));
    g.appendChild(field('状态', textInput(b.状态 || '', (v) => { b.状态 = v; after(); })));
    f.appendChild(g);

    const g2 = group('生杀予夺');
    g2.appendChild(btnrow([
      btn(b.活 ? '令其陨落' : '令其还阳', b.活 ? 'd' : 'g', () => { b.活 ? E.cheat.kill(b.id, '被天机笔勾去姓名') : E.cheat.revive(b.id); after('', true); }),
      btn('强行破境', 'p', () => { E.cheat.breakthrough(b.id, true); after(); }),
      btn('设为本尊', 'k', () => { E.state.player = b; b.是玩家 = true; selBeing = b.id; after('已夺舍'); }),
      btn('赐仙器', '', () => { b.法宝.push({ 名: '天机笔', 品: '仙器', 效: 5 }); after(); })
    ]));
    f.appendChild(g2);
    return f;
  }

  /* ---------- 地域 ---------- */
  function secRegion() {
    const f = el('div');
    const g0 = group('选择地域');
    g0.appendChild(field('地域', selectInput(selRegion, E.REGIONS.map((r) => [r.id, r.名]), (v) => { selRegion = v; render(); })));
    f.appendChild(g0);
    const rs = E.state.regions[selRegion];
    const base = E.REGION_BY_ID[selRegion];
    if (!rs) return f;
    const g = group('改写「' + rs.名 + '」');
    g.appendChild(field('灵机', rangeInput(rs.灵机.toFixed(2), 0, 5, 0.01, (v) => { rs.灵机 = v; after(); }, (v) => Number(v).toFixed(2))));
    g.appendChild(field('凶险', rangeInput(rs.凶险, 0, 10, 1, (v) => { rs.凶险 = v; }, (v) => v)));
    g.appendChild(field('气运', rangeInput(Math.round(rs.气运), 0, 100, 1, (v) => { rs.气运 = v; }, (v) => Math.round(v))));
    g.appendChild(field('状态', selectInput(rs.状态, ['平静', '动荡', '灵气充盈', '妖祸', '大劫', '洞天福地'].map((x) => [x, x]), (v) => { rs.状态 = v; after(); })));
    g.appendChild(field('特产', textInput(rs.特产.join('、'), (v) => { rs.特产 = v.split(/[、,，]/).filter(Boolean); after(); })));
    g.appendChild(field('异象', textInput(rs.异象.join('、'), (v) => { rs.异象 = v.split(/[、,，]/).filter(Boolean); after(); })));
    f.appendChild(g);

    const g2 = group('此地宗门');
    Object.keys(E.state.sects).filter((sid) => E.SECT_HOME[sid] === selRegion).forEach((sid) => {
      const s = E.state.sects[sid];
      const row = el('div', 'fld');
      row.appendChild(el('label', null, s.名));
      row.appendChild(el('div', 'inp', '势力 ' + s.势力));
      row.appendChild(btn('改', 'sm', () => { selSect = sid; curTab = 'sect'; render(); }));
      g2.appendChild(row);
    });
    f.appendChild(g2);

    const g3 = group('一键');
    g3.appendChild(btnrow([
      btn('本尊迁至此', 'p', () => {
        const p = E.state.player; p.区域 = selRegion;
        const [x, y] = E.POS[selRegion];
        p.位置 = { x, y, from: null, to: null, t: 1 };
        global.Renderer.focus(x, y, 0.95); after('已迁至' + rs.名);
      }),
      btn('灵机拉满', 'g', () => { rs.灵机 = 5; after(); }),
      btn('降下大劫', 'd', () => { rs.状态 = '大劫'; rs.凶险 = 10; E.cheat.addChronicle(`${rs.名}天降大劫，山河变色，修士十不存一。`, '天罚'); after(); })
    ]));
    f.appendChild(g3);
    return f;
  }

  /* ---------- 宗门 ---------- */
  function secSect() {
    const f = el('div');
    const g0 = group('选择宗门');
    g0.appendChild(field('宗门', selectInput(selSect, E.SECTS.map((s) => [s.id, s.名]), (v) => { selSect = v; render(); })));
    f.appendChild(g0);
    const s = E.state.sects[selSect];
    const base = E.SECT_BY_ID[selSect];
    if (!s) return f;
    const g = group('改写「' + s.名 + '」');
    g.appendChild(field('名称', textInput(s.名, (v) => { s.名 = v; after(); })));
