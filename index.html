口遇见{人物}，他刚从第二层上来，眉毛烧得只剩一半。","他说第二层里有块{灵材}，赤得像一块凝住的血，可它长在地火上头，取一块，整层就会下陷。前些年有个金丹修士硬取了一块，洞塌了半个月，出来时人是活的，可经脉被火气烧成了焦炭。","{地点}的石壁被地火烤得发白，一层层剥落。下头传来低沉的响动，像有心跳。你闻到一股说不清的焦味，不似柴火，更像什么东西在慢慢熔化着自己。","{人物}指着洞口说：我下到一半就退了。你要去，我把路说给你听；你要选第三层，我只能送到第二层。"],"择":[{"名":"下二层","文":"你按他说的路走到第二层，在那块赤红的东西旁边蹲了整整一日，只敲下一小块边角。洞壁在你身后裂开一道细缝，你抱着那一小块滚上第一层，浑身都被烤得蜕了皮。那东西后来成了你炼器的底子，火候比谁都稳。他看了之后只说一句：你没贪整块，这洞就放你走。","果":{"灵材":1,"修为":150,"气血":-18,"悟性":2}},{"名":"下三层","文":"你不听劝，一路下到第三层。底下的火不是火，是一整片流动的光，光里浮着无数细小的骨，像极了那年山火里没退成的人。你在那里站了一炷香，出来时修为暴涨，可自此手上再暖和不过来。别人问你第三层有什么，你说不清楚，因为你自己也不太敢回想。","果":{"修为":320,"气血":-35,"寿元":-20,"悟性":3,"魔念":1}},{"名":"封了洞口","文":"你和他一起搬石头把洞口堵了，堵到一半他说这样不行，地火得有地方喘气，全堵死反倒要炸。于是你们留了一线，用{器物}压住缝隙，把气流引向山谷。那年之后这段山道再没塌过，也没人再来取那块东西。有人在关下骂你们多事，你们都没理。","果":{"声望":5,"因果":-2,"修为":50,"道心":2}}]},{"id":"luoxia_029","题":"老丹师的炉","类":"人情","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}有间半塌的丹房，房里的{器物}还在烧，火苗小得像一盏灯。守炉的{人物}已经不能起身，靠在一堆药渣上，见你进来，眼睛才动了动。","{人物}说这炉丹炼了四十年，中间断了三次火，每次断都是有事的年份：一次丹霞观内斗，一次山火烧到门口，一次他亲手把自己徒弟逐出门墙。如今只差最后的收丹，他起不来了。","{天象}把丹房的窗子映得通红，炉火在风里晃了晃，他咳了两声，说你不要多想，这炉丹谁收都行，收成了是你的，收坏了也是你的。他又说，只是别卖给第一个来问价的人。","那口{器物}里的丹香已经浓得发甜，火候正走到最要紧的一刻。他的手指无力地指了指炉门。"],"择":[{"名":"替他收丹","文":"你按他说的收丹，火候一分不差。三枚丹出来的那一刻，他长出一口气，像是把这些年梗在胸口的东西都吐了出去。他说这丹给你两枚，剩下一枚替我送到西岭关外一个姓陈的人家。你问是什么人家，他闭上眼不说了。你把丹送过去，才知道那户人是他逐出门墙的徒弟的家。","果":{"修为":100,"器物":1,"因果":-3,"道心":2,"灵材":1}},{"名":"先卖丹","文":"你把丹收好，下山就找到先前那个来问价的药商，把三枚丹卖了。价高得离谱。老丹师问起，你只说收坏了一枚。他看了你很久，什么也没说。半月后他死了，死时炉里的火自己熄了。你那笔钱花得很快，只是往后每次闻到甜的丹香，都会想起他说过的那句“别卖给第一个来问价的人”。","果":{"灵石":300,"因果":3,"道心":-3}},{"名":"守着火","文":"你没动炉，只是每天来替他添柴、扇火、擦药。火候到了的那天，他自己爬起来收了丹，塞给你一枚，说不是谢你，是谢你还肯把他当个人看。他后来又活了两年，最后死在丹房里，炉火未熄。你替他立了块碑，碑上照他的意思，只刻了四个字：火还在。","果":{"修为":60,"道心":3,"因果":-2,"悟性":2,"寿元":8}}]},{"id":"luoxia_030","题":"火枣熟了","类":"机缘","重":4,"域":["luoxia"],"境界":[0,3],"段":["{地点}的火枣三年一熟，熟时满树赤红，远远望去像烧着。你到得早，树上还挂着未落的露，露水被枣皮映成赤色，顺着叶尖滴进土里。","{人物}已经守在树下三日了。他说火枣熟了会招{妖异}，那东西专吃枣核，吃完了就把整棵树啃倒。他一个人守不过来，问你要不要搭伙——枣子对半分，妖物谁打的算谁的。","{天象}从树冠的缝隙里漏下来，把地上的枣影打得斑驳。你抬头时看见枝桠深处有一双眼睛，很圆，也在看你。那东西没有动，只是把身子往叶子里缩了缩，像在等你先动。","{人物}握紧了手里的东西，看向你，等你点头。"],"择":[{"名":"合力打","文":"你们一个引一个打，把那东西从树上逼下来。它跑得极快，临走时撞断了一根粗枝，枣子落了一地。你们分完枣，他把最大的一颗塞给你，说这树往后归两家看。此后每年秋天你都能在树下见着他，他也从没数过错，只是有一年他没来，枝上落了整整一层枣没人捡。","果":{"灵材":2,"修为":70,"声望":3,"气血":-8,"因果":-1}},{"名":"先动手","文":"你没应他的话，抢先蹿上树去。那东西被惊得跳下来，正撞在他身上，把他撞得翻了个跟头。你摘了半筐枣就走，他在后头喊你也没回头。后来你在西岭的集市上听见有人讲这事，讲的人不知道你就在旁边，说这山里有个不讲规矩的散修，见枣不要人。","果":{"灵材":2,"灵石":90,"声望":-5,"因果":2}},{"名":"分他一半","文":"你说要分就不要分树，只分眼下这一筐。他说好，你们把枣分成两份，谁也没多看谁的一眼。那东西始终没下来，等你们走了才从枝上落下来啃枣核。你回头看了一眼，忽然觉得这山里的东西，往往比人更懂得等。","果":{"灵材":1,"声望":4,"悟性":2,"因果":-1}}]},{"id":"luoxia_031","题":"剑断之时","类":"修行","重":3,"域":["luoxia"],"境界":[1,6],"段":["{地点}的风口最利，剑修常来这里试剑。你到的时候，{人物}正站在风口上，一动不动，剑横在身前。他说这一关叫断剑，宗门里人人都要过：把跟随自己多年的剑折了，再以剑意凝出一柄新的。","他递过来一柄{器物}，说这是你今日要折的那柄。你不解，他指着风口下面的石堆：那些都是折过的剑，一柄一柄，堆了三十年。折的时候疼，折完了更疼，因为你会发现剑意凝出来的那柄，比原来的短一寸。","{天象}从岭上压过来，风里带着赤尘，打在剑身上沙沙响。你握剑的手心开始出汗。他说这一关没有对错，过不过都在你自己，只是有人过了金丹，有人一辈子停在剑上。","{人物}把手按在你的剑脊上，示意你可以开始了。"],"择":[{"名":"折剑","文":"你抬起剑，对着风口那根铁桩劈下去。剑断了，断口崩得参差。你站在原地，闭眼想了很久，再睁眼时剑意已在手，只是短了一寸。他看了看，说短的那一寸，就是你舍不得的那一寸。你从此出剑再没有多余的花，一击不中便退，退得极快。","果":{"修为":200,"悟性":3,"道心":2,"器物":-1}},{"名":"留剑","文":"你收回手，说这剑我不折。他没有责怪，只是叹了口气，把剑收起来，说那你就再等。你在风口又站了两年，每年都握剑，每年都不折。第三年宗门里有个年轻人折了剑，一夜之间入了金丹，而你还在原处。可你也发现，你的剑比他的长一寸，也比他的重三分。","果":{"修为":80,"道心":3,"悟性":2,"寿元":10}},{"名":"折别人的","文":"你没折自己的，趁他转身，把他搁在石上的剑拿起来折了。他的手在半空停住。剑意散开时，整段崖风都乱了。他看了你很久，最后什么也没说，只是蹲下去把断片一块一块捡起来。此后他再没提过这一关，而你的剑意越来越利，也越来越孤，像是靠吞了别人一寸才长出来的。","果":{"修为":260,"魔念":2,"因果":3,"声望":-4}}]},{"id":"luoxia_032","题":"关口押镖","类":"市井","重":4,"域":["luoxia"],"境界":[0,3],"段":["{地点}的镖行今日接了桩怪活：一车黑布蒙死的箱子，要从落霞山脉送到西岭外，不问里头是什么，只问谁肯接。{人物}蹲在车辕上数灵石，数到第三遍才抬头，说酬劳比寻常高五成，出事自己担。","{地点}押镖的老手都不接。有人小声说，前头三趟这样的活，人货都没回来。也有人说，昨晚看见丹霞观的车队从关外过，车辙深得反常。","{天象}把车辙照得发亮，车上的黑布被风吹起一角，露出里面的木箱与一道极细的封漆。封漆是丹霞观的火漆，可箱子比观里常用的要小一圈，像专门为藏东西打的。","{人物}把一袋定金推到你面前，说走不走一句话。"],"择":[{"名":"接活","文":"你押着车出了关，一路平安。快到地头那夜，果然有人来劫，被你和镖行的伙计打退。卸货时车主人揭开黑布，箱子里是一批没报税的赤髓砂。他分了你三成，说干这行的都懂，货越见不得光，越值钱。你拿着钱走出驮马店，听见后头有人在低声骂，骂的不是你，是这行当。","果":{"灵石":280,"因果":2,"声望":2}},{"名":"揭布","文":"你伸手揭了黑布，看清箱子上的封漆与印记，当场把人扣下，送去西岭关报官。镖行老板脸都绿了，说你坏了一场生意。货是丹霞观偷运出去的禁丹，案子查下来牵扯不小。官府赏了你一笔，可镖行从此不再用你，山里的活路一下窄了大半。","果":{"灵石":120,"声望":6,"因果":-1}},{"名":"不接","文":"你摇手说这活太烫，转身走了。走出半条街，听见后头有人接了，接下的人姓什么你不知道。半月后你听说那车货翻在赤烟崖下，人死了三个。你在关下的酒肆里喝了一夜，掌柜的问你怎么了，你说没什么，就是这酒太苦。","果":{"修为":20,"悟性":1,"因果":1,"道心":1}}]},{"id":"luoxia_033","题":"剑宗问罪","类":"宗门","重":2,"域":["luoxia"],"境界":[3,10],"段":["{宗门}问罪从不带兵，只来一个人。这一日来的是{人物}，一身赤衣，腰上悬剑，剑未出鞘，站在{地点}的丹房外。他说贵方有位客卿半月前在关外杀了赤霄弟子，剑伤在喉，一击断气，是剑宗的路数。","{宗门}的观主迎出来，笑得客气，说此事与观里无关，那位客卿早已离开落霞山脉。两人在丹房外站了很久，谁也没动。屋里十几个道士都不敢出声，炉上的丹药烧糊了也无人敢揭盖。","{天象}压在两人之间，风一过，赤衣的衣角与观主的道袍同时掀起，又同时落下。你站在廊下，看见那位剑修的手一直搭在剑柄上，指节很松，那是随时能拔的姿势。","{人物}终于开口：把人交出来，我今日就走；不交，我明日再来，带着剑堂的人来。"],"择":[{"名":"劝交人","文":"你走上前，对观主说了一句：藏一个人，赔一座洞天，不值。观主笑着看你，眼睛里没有笑。他最终交出了那位客卿，人被带到丹房外的空地上，一剑削了执剑的手，废了修为，逐出山门。剑修收剑走了，临走前把一瓶伤药放在地上。那瓶药后来被观主扔进了炉里。","果":{"声望":5,"因果":-2,"灵石":60,"道心":1}},{"名":"替观主挡","文":"你挡在门口，说这事我担保与观里无关。剑修看了你一眼，问你是谁。你报了名，他沉默片刻，说那就查。三日查清，凶手果然早跑了。他临走时把剑鞘在你肩上碰了一下，说你这人有点意思，可惜站错了边。丹霞观记了你一份情，这份情后来换的钱，比你想的多。","果":{"灵石":200,"声望":3,"因果":1,"魔念":1}},{"名":"旁观","文":"你退到廊柱后，什么也没说。观主最后交了一个替死的人，剑修看都没细看，一剑落下就带走了。你站在廊下，看着丹房外那一滩血被雨水冲淡。那天夜里你听见观里的道士在笑，笑得很轻，怕被人听见。你忽然明白，这山里的人不是不知道谁该死，是知道也没人敢说。","果":{"悟性":2,"道心":-1,"因果":2,"灵石":40}}]},{"id":"luoxia_034","题":"借炉一夜","类":"人情","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}的夜里，一个女修拦住你，问能不能借你的炉用一夜。她怀里抱着一只小小的{器物}，说话时手一直在抖。她说她的师弟中了丹毒，要连夜炼一味解药，可她自己那口炉炸了。","你问她为什么不找{宗门}。她苦笑，说观里的炉要收钱，一夜的炉租够她师弟半年的药钱；况且观里查验药方，她的方子是禁的，用了要被抓。她说话很快，像是怕自己说着说着就不敢开口了。","{天象}照在她脸上，你才看清她年纪不大，眼角却已经有了细纹。怀里的炉是她自己打的，边角粗糙，炉身上刻着两个歪歪扭扭的字，是名字。她说这炉打了三年，还是炸了。","{人物}把炉往你面前递了递：借不借？不借我另找。"],"择":[{"名":"借她","文":"你把自己的炉让出来，替她守了一夜的火。药成时天已微亮，她抱着药罐就跑，跑出几步又折回来，深深行了一礼，说欠你一条命。后来她师弟活了，姐弟俩把你的名字刻在了自己那口新炉上。你再没见他们，可你听说山南有个女修，救人不问对方出不出得起钱。","果":{"修为":60,"声望":6,"因果":-2,"悟性":2,"道心":1}},{"名":"收租","文":"你说炉可以借，一夜的租照市价。她愣了一下，把身上所有灵石都数出来，还不够，最后把腕上的镯子取了。药炼成了，人也救活了。半年后她带着钱来赎镯子，你才发现那镯子是她母亲的遗物。你把镯子还给她，钱没收。她走的时候没看你，你不知道她心里怎么想。","果":{"灵石":90,"因果":1,"道心":-1}},{"名":"报官","文":"你婉拒了，转身去了西岭关，把这事报给守卒。你想着禁方该由官府处置，可你没想到那夜官差去的时候，她师弟已经断气了，药没炼成，人被带走审了三日，放出来时一句话也不会说。你后来在山道上遇见过她一次，她看了你一眼，绕开了。","果":{"声望":2,"因果":4,"道心":-2}}]},{"id":"luoxia_035","题":"刑剑台","类":"宗门","重":3,"域":["luoxia"],"境界":[1,7],"段":["{地点}的青石台上有三道深槽，据说是历年刑剑时血流出来冲的。今日台上跪着一个赤衣弟子，年不过二十，罪名是同门相残。台下站着几十个剑堂弟子，没人说话。","{人物}念完罪状，问他还有什么说的。那弟子抬起头，说了一句：他先动了我的剑。声音不大，可台下人人都听见了。长老叹了口气，说剑宗不问你为什么动剑，只问你动了没有。","{天象}压在崖顶，风把旗帜吹得猎猎作响。你看见他跪着的手一直在抖，抖得青石上落了细细一层灰。他不是怕死，是怕剑从此不认他。","长老转身，把{器物}递给你——今日负责行刑的，是你。"],"择":[{"名":"行刑","文":"你走上去，一剑落下，血溅在青石的三道槽里，顺着旧痕流下去。他倒下前看了你一眼，眼里没有恨，只有一种认了的东西。长老拍了拍你的肩，说这就是剑宗的规矩。之后你每次握剑，都觉得剑柄比从前重了一点，像多了一个人的分量。","果":{"声望":6,"修为":100,"道心":-2,"因果":2,"魔念":1}},{"名":"抗命","文":"你把剑放在青石上，说这一剑我不落。台下哗然。长老盯着你很久，最后自己拾起剑，行了刑。事后你被罚在剑冢守碑三年。三年里你抄了七百块碑文，抄到最后一个字，忽然懂了那位弟子说的“他先动了我的剑”——在这山上，先动手和后动手，本就是同一件事。","果":{"声望":-6,"悟性":4,"道心":3,"寿元":-10,"因果":-2}},{"名":"问一句","文":"你没有接剑，只问了一句：若错在他，剑宗可曾赔过一句？长老沉默许久，说没有。台下忽然骚动起来，几个年轻弟子的脸色变了。那日刑没行成，案子发回重审，半月后查清是那位弟子先夺了同门的剑谱。他被废了修为，逐出宗门，活着下了山。你成了剑堂里最不受欢迎的人，也成了剑冢碑上唯一被写进去的活人名字。","果":{"声望":4,"因果":-3,"道心":3,"悟性":2,"气血":-5}}]},{"id":"luoxia_036","题":"赤雨三日","类":"天象","重":2,"域":["luoxia"],"境界":[0,5],"段":["{天象}，落霞山脉下起了红色的雨。雨不大，落在石上却留下浅浅的印，晒干之后洗不掉。本地老人说这雨叫赤雨，是山在哭，每次下完都要死些人。","{人物}在{地点}的棚下收着盆罐，一罐一罐接雨水。他说这水里带着金乌的火气，稀释百倍之后是极好的炼器引子，只是不能直接沾皮肤，沾了会起赤斑，起过斑的人熬不过三年。","雨下到第三日，{地点}下的溪沟全变成赤色，鱼翻着肚皮浮上来。棚外有人家在烧纸，哭声断断续续，被雨声压得几乎听不见。你看着罐里的水，红得很干净，像谁的血兑了清水。","{人物}把最大的一罐推到你脚边：这罐够你炼三炉器。要就拿走，不要我就倒回山里。"],"择":[{"名":"取一罐","文":"你抱着那罐水回去，用它淬过两件器，火纹比寻常细密。第三炉时你手滑，溅了一点在腕上，那里当即起了一小片赤斑。你熬了两年，斑才慢慢淡下去，留下浅浅的痕。此后你炼器出奇地稳，只是每到下雨天，那处皮肤就要发烫，像是还留着当年那一滴雨的温度。","果":{"器物":1,"修为":120,"气血":-12,"悟性":2}},{"名":"倒回去","文":"你把罐子推回去，说这水不祥。他笑了，说你说得对，这山里不祥的东西太多，可用的人也太多。他把水倒进溪里，红色顺流下去，很快就看不见了。那年山下的村子死了七个人，你的名字没在其中。你不知道该庆幸还是该难受。","果":{"道心":2,"寿元":6,"悟性":1}},{"名":"替人挡雨","文":"你把棚子让给几个赶路的散修，自己在雨里跑了半座山，把他们一个个送到山洞。回头时衣裳已经湿透，背上起了大片赤斑，火辣辣地疼。其中一个老修士醒来后替你把斑拔了，手法极快，说这斑不能等。他走时留了一瓶药，瓶底刻着一个你后来才知道的名字。","果":{"声望":6,"因果":-2,"气血":-14,"灵材":1,"道心":1}}]},{"id":"luoxia_037","题":"抢矿之争","类":"争斗","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}新露出一条{灵材}矿脉，赤得发亮，从山腰一直裂到谷底。消息传开三日，谷口就挤了上百号人。赤霄剑宗的人先到，围了半边；百炼山的人随后赶到，围了另半边；丹霞观的人来得最晚，却带着账册与秤。","{天象}下，三边都不肯先动手。剑宗说这山归剑宗护，百炼山说矿归山里的，丹霞观说谁出的价高归谁。吵到最后，一个剑修拔了剑，插在矿口中央，说谁越这条线，剑不认人。","{天象}把矿脉照成一道赤线，线上有细碎的光在流。你站在人群外头，看见一个百炼山的年轻匠人悄悄往矿口挪了两步，又停住了。他的手在抖，不是怕，是忍。","三方的人都在看你，{天象}也在看——你在这山里算是个不偏不倚的人，谁都想让你先说一句。"],"择":[{"名":"定份","文":"你提议三边各开一段，谁挖到算谁的，界限由山势定，不按人的脚走。剑宗先不乐意，最后是你把那柄插在矿口的剑拔起来，顺着岩缝划了一道线。三方骂了半天，到底认了。那年矿脉挖出不少好东西，也死了四个人，都是夜里偷偷越线的。","果":{"声望":7,"灵石":120,"因果":-1,"悟性":2}},{"名":"独吞","文":"你什么也没说，当夜带了工具摸进矿口，挖了整整一夜。天亮前你背着一袋矿石退出来，正好撞上百炼山巡夜的匠人。他没喊人，只是看着你，看了很久，最后让开了路。你带着矿石走了，从此再没去过那段谷，也从没敢问他那天为什么放你走。","果":{"灵材":2,"灵石":150,"因果":2,"道心":-2}},{"名":"封矿","文":"你说这条脉不能挖。众人哄笑，问凭什么。你指着矿脉尽头的一处裂缝，说那里渗水，挖穿了要塌半座山。没人信你，可你当夜自己动手把矿口堵了。半月后裂缝处的山体滑下来，埋了三个人，也埋了那段矿脉。有人说你早知如此，也有人说你堵得太早。","果":{"因果":-2,"声望":3,"道心":2,"灵材":-1}}]},{"id":"luoxia_038","题":"电蛇化形","类":"奇闻","重":2,"域":["luoxia"],"境界":[2,7],"段":["雷雨夜过{地点}的人都知道，石壁上盘着一道电光，天亮前不散。有人说是山里的雷气，有人说是{妖异}化形未成。你这一夜亲眼看见了：那道光从壁上游下来，落到地上，慢慢立起一个人形。","人形极淡，通体泛青，五官看不分明。它站在雨里，像在找什么，走两步停一步，走到崖边就停住了。{人物}伏在你旁边，低声道：它每年这时候都会下来，从不下崖，也不伤人，就是站一会儿。","{天象}把整面崖壁照得发白，那道淡青的人形在雨里站了很久，忽然抬起手，朝着崖下伸出。崖下是空的，只有翻涌的云。它伸了很久，手一直没收回去。","雷声一响，人形开始散。{人物}抓住你的手腕，说要么现在走，要么等它散尽——它散的时候，会带走活人的一点东西。"],"择":[{"名":"走近","文":"你走上前，站在它侧后三步。它没有回头，只是那只伸出的手慢慢垂了下来。雷声再响时，它散成一片青色的碎光，其中一点落在你手背上，凉的。此后你的神念比从前清明，夜里能觉出十里外的雷气。只是每逢雷雨，你都会梦见一只伸向崖下的手，伸得极久，一直没人去握。","果":{"修为":150,"悟性":3,"气血":-10,"道心":1}},{"名":"退走","文":"你退进岩缝，等到雷声停了才出来。崖边只剩一摊水，水里有极淡的青。{人物}说它散完了，今年不会再来了。你问他它到底在找什么，他说不知道，三十年前有个剑修在崖下坠了，也许找的是那个人。你抬头看崖，天上已经没有云了。","果":{"悟性":2,"寿元":5,"道心":1}},{"名":"击散它","文":"你抬手一掌打过去，青色的人形被震得散开，散得比雷声还快。{人物}脸都白了，说你疯了。当夜山里落了整宿的雷，把崖壁劈出一道新裂。你在裂口下站了很久，觉得有什么东西再也不会来了。此后你出手越来越果断，也越来越不小心——有些该等的东西，你等不住了。","果":{"修为":100,"因果":2,"道心":-2,"魔念":1}}]},{"id":"luoxia_039","题":"火枣养元","类":"修行","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}边上有片老枣林，树龄最长的据说有三百年。{人物}教人用{灵材}配枣肉炼一味养元的丹，法子不难，难在火候：早一分则燥，晚一分则滞，非要用赤岩下引出的地火才成。","{人物}说这丹的方子本是{宗门}的，观里卖三百灵石一枚，从来不肯教人。他这套是从一个死在观外的老丹师遗物里翻出来的，方子边上还写着两行字：丹贵在不伤人，价贵在能救人。","{天象}从枣叶间漏下来，落在石臼里，枣肉被捣成赤色的泥。他一边捣一边讲，讲得很慢，每讲一句就要停一停，像是怕漏了什么。你注意到他右手少了两根手指，断口很旧。","泥捣好了，火也生起来了。{人物}忽然问你：你是想学炼丹，还是想学怎么卖丹？"],"择":[{"名":"学炼","文":"你说想学炼。他笑了，把手搭在石臼边上，一句一句教你怎么看火色、怎么听丹响。这味丹你炼了半年才成第一炉，成色平平。他尝了一枚，说不错，不伤人的丹就是好丹。后来你把这方子教给了七个人，一分钱没收。丹霞观的人来找过你一次，你只说：这方子不是你们的。","果":{"修为":140,"悟性":3,"功法":1,"声望":5}},{"名":"学卖","文":"你说想学卖。他愣了很久，最后长长叹了一口气，把手上那点丹泥全刮进盆里，说学卖不用我教，你下山走一趟就会了。你下山，果然三天就学会了：先说药好，再说价高，最后说人情。半年后你赚了不少，可你再回枣林时，那间小屋已经空了，石臼里积着雨水。","果":{"灵石":240,"因果":1,"道心":-2,"悟性":1}},{"名":"问他手","文":"你问他那两根手指是怎么没的。他把手翻过来看了看，说是炼丹炸的，那年他贪快，火候走岔，炉炸了，半边屋子都塌了。他说这话时很平静，像在说别人的事。那炉丹他一枚也没卖出去，全给了一个素不相识的人。你说那你亏了，他摇头：亏的是手，赚的是那条命。","果":{"悟性":3,"道心":2,"修为":80,"灵材":1}}]},{"id":"luoxia_040","题":"关下老卒","类":"人情","重":3,"域":["luoxia"],"境界":[0,3],"段":["{地点}的守卒里有个老人，守了三十年，从没升过职。他认得每一个常过关的人，也记得每一具被抬过关的尸体叫什么名字，写在城砖背面，写满了半堵墙。","这一日{人物}拦住你，说要托你一件事。他的儿子在三年前进了落霞山脉，再没出来。他说这话时手很稳，声音也稳，只有说到“再没出来”时停了一下，像在咽什么东西。","{天象}把城墙照成砖红色，那些刻在砖背上的名字一道道露出来。他说他数过，一共四百七十六个。他在最底下新刻了一个，是他自己的。他说人总得有人记得，不然死在这儿就跟死在山里没差。","他从怀里摸出一块磨得发亮的{器物}，说这是他儿子的东西，能不能替他带进山，看看到底死在哪一段。"],"择":[{"名":"带进去","文":"你带着那件东西进山，问了七个村子，翻了二十几块碑，最后在赤烟崖下找到一截焦骨和半截腰带。腰带上有一样的纹路。你回去时他把东西接过去，看了很久，一句话没说，只转身在墙上又刻了一个名字，刻得极深。那年冬天他死了，墙上的名字没人接着刻下去，你路过时替他刻了。","果":{"因果":-3,"道心":3,"声望":5,"修为":30}},{"名":"劝他别问","文":"你说问了也是那样，不如下山去，找个有太阳的地方养两年。他看着远处的赤霞，说我这辈子看的最多的就是这山。他没有接回那件东西，也没有再说话。你走的时候看见他还在城门口站着，背影笔直，像一根插得太久的桩子。","果":{"悟性":2,"道心":1,"因果":1,"寿元":6}},{"名":"替他刻名","文":"你在那堵墙前后站了很久，最后问他儿子叫什么。他报了名字，声音一下哑了。你替他刻上去，刻在第四百七十七道的位置。刻完他从怀里摸出一点酒，倒在墙根，说这山里的规矩，刻上名的人就不算失踪了。你走出关口，后头传来他很轻的一声，像是道谢，又像是别的什么。","果":{"声望":6,"因果":-2,"悟性":2,"灵石":20}}]},{"id":"luoxia_041","题":"掺假的丹","类":"灾祸","重":3,"域":["luoxia"],"境界":[0,3],"段":["{地点}的市上近来多了一种丹，颜色极好，价只有丹霞观的一半。{人物}买了两枚，服下三日，修为确实涨了，第四日却开始掉头发，一缕一缕，抓一把就下来。","他把剩下的丹拿给你看，掰开后内里发黑，有一股说不清的铁腥气。他说这丹里掺了{灵材}磨的粉，能骗过药气，短时涨修为，久则伤根本。卖丹的是个生面孔，收摊就走，问他从哪儿来的，只说西岭北边。","{天象}照在摊位的空地上，地上还落着几粒丹渣，被风一吹聚成一小撮。你忽然想起自己前几日也买了一枚，还没服。那枚丹此刻在袖子里，硬硬的，隔着布都能摸出形状。","{人物}问你：这事要不要查？查下去，得罪的恐怕不止一个卖丹的。"],"择":[{"名":"查到底","文":"你顺着丹渣的痕迹一路查到山北一处窑口，那里有十几口土炉，炉边堆着上千枚半成品。货是从丹霞观外门流出来的，观里有人偷丹方的废料私炼。你把证据送去西岭关，案子拖了半年才结，处理结果是外门一个管事自尽了事。你知道那不是一个人做的，可你也知道，再查下去，山里的路就全断了。","果":{"声望":8,"因果":-2,"气血":-8,"灵石":100}},{"名":"自服解药","文":"你把手里的丹扔了，又替他把脉，配了一味解毒的方。他掉了半年的头发，命倒是保住了。此后他到处讲这件事，讲得越多，买假丹的人越少，你也就越被那伙人记恨。有一夜你住处门外被人放了一包东西，打开是十枚假丹，下面压着一张纸，画着一柄剑。","果":{"灵材":-1,"声望":5,"因果":2,"道心":1}},{"名":"收了假丹","文":"你说这丹也不算全无用处，短时涨修为，在保命的时候能换一条命。他愣了半天，最后把丹都给了你。你把假丹收进匣里，后来果然在一次恶斗前服了一枚，赢了那一场，代价是此后三年头发长不齐。人有时候不是不知道代价，只是当时觉得值。","果":{"灵石":60,"修为":60,"气血":-12,"悟性":1,"魔念":1}}]},{"id":"luoxia_042","题":"铸剑庐遗器","类":"机缘","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}是旧时剑宗铸剑的地方，如今只剩半间塌屋，屋顶漏着天光。你在墙角找到一只{器物}，匣子没锁，打开时一股陈年的火气扑出来，把眼睛熏得发酸。","{器物}里躺着一柄未开锋的剑坯，剑脊上凿着一行极浅的小字，是铸剑人的落款。你在剑坯旁边还发现一块试器石，石面上有几十道刻痕，深浅不一，最浅的一道几乎看不见。","{天象}从破顶漏下来，照在剑坯上，那行小字一条一条亮起来。你忽然明白这屋里为什么塌得这么干净：不是没人来，是来过的人都只带走了值钱的，把最要紧的东西留下了。","剑坯握着沉手，{天象}的光落在剑脊上，像有什么没做完的活留在里面。墙角还有一只旧风箱，风箱的木柄磨得发亮。"],"择":[{"名":"开锋","文":"你在庐里生了火，借那只旧风箱打了三天，把剑坯开出一条极细的锋。剑成之日，落款处的字忽然自己亮了一下。此剑无鞘，出鞘时无声，正合剑宗一句老话：最好的剑出鞘，是让人听见自己的心跳。你带着它下山，走到半路回头，庐子的屋顶塌了，像有人终于放下了什么。","果":{"器物":1,"修为":160,"悟性":2,"声望":2}},{"名":"留给百炼山","文":"你把剑坯送回百炼山，说这东西该归打器的人。{人物}接过去，看了很久，把落款读了三遍，忽然说这是他师祖的东西。他没说谢，只让你在炉边坐了半夜，一句话也没多讲。半年后山上出了一批新器，火纹里都带着一点旧庐的影子。你去买器时，他们从未收过你的钱。","果":{"声望":5,"因果":-2,"器物":1,"灵材":1}},{"名":"拿去卖","文":"你把剑坯与试器石一起卖给了西岭的旧货商，价不算高，胜在省事。那商转手卖给了一个剑修，剑修拿回去请人开锋，开出来是把好剑。三日后剑修死在关外，剑不知去向。你后来在别人的剑上见过同样的落款，才知道有些东西一旦流出去，就再也追不回来了。","果":{"灵石":200,"因果":2,"悟性":1}}]},{"id":"luoxia_043","题":"百炼炉重开","类":"宗门","重":2,"域":["luoxia"],"境界":[2,8],"段":["{宗门}的百炼炉三百年没熄，也三百年没重砌过。这一日炉膛裂了一道缝，火气从缝里泄出来，山上的匠人连夜开炉抢修。{人物}站在炉前，说这炉得推倒重砌，砌了才能再烧三百年。","可推倒炉子容易，重砌难。砌炉要用{灵材}调泥，一味料差，整炉火就要走邪。更麻烦的是，炉里还压着一批没取出来的器——三十年来的订件，全在里头，推倒就全废了。订件的主人已经来了七个，堵在山门口。","{天象}照进炉房，把每个人的脸都镀上一层赤。一个丹霞观的执事混在人群里，说愿意出高价买下那批废器，理由说得漂亮：重炼一番，还能用。你看见{人物}的拳头在袖子里握了一下又松开。","{人物}转过身来问你：你说这炉，推还是不推？"],"择":[{"名":"推倒重砌","文":"你替他把泥和的方子重新配了一遍，又陪他守了三夜。炉推倒那天，那几个订件的主人当场翻脸，赔了灵石才算完。新炉砌成，火重新点起来时，整座铁砧峰都在响。他站在炉前，眼里映着火光，说这一炉火能烧三百年，够我们这些人死上两回了。","果":{"声望":7,"灵石":-180,"悟性":3,"修为":90}},{"名":"修补了事","文":"你劝他先补了裂缝，撑过这几年再说。他犹豫了很久，最后点头。炉补好了，火也稳了，可从那以后每炼一炉，总有一两件器会莫名其妙地裂。订件的人渐渐不来了。二十年后这炉终于塌了，塌时没有人在旁边。你想，他也许早就知道会塌，只是舍不得。","果":{"灵石":60,"悟性":2,"道心":-1,"因果":1}},{"名":"接下废器","文":"你把那批废器全买了下来，价给得不低。丹霞观的执事脸色很难看。你把废器一件件拆开，能救的救，不能救的磨成料，足足忙了半年。救回来的几件后来都以主家的名字送还，一分钱没收。百炼山记下这笔情，从此你的器，他们打一次，修十次。","果":{"灵石":-200,"声望":6,"器物":1,"因果":-3}}]},{"id":"luoxia_044","题":"山道劫丹车","类":"争斗","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}的窄道上，一队丹车被截了。截道的是十几个蒙面人，为首的用{器物}劈开第一辆车的车盖，赤红色的丹囊滚了一地，药香立刻漫满整条山道。","押车的是{人物}，还剩四个人站着，护着最末一辆车不肯退。他说这车上的东西是送往北边的急药，耽误一日就要死人。蒙面人笑起来，说死的是别人，不是我们。","{天象}把山道染成红色，散落的丹囊被人踩碎，药气混着血味。你看见路边的岩缝里还趴着一个断了腿的押车人，正在往车底爬，手里攥着一柄短刃。","{天象}照着山道，你站在道旁的坡上，离车三十步。要动手，就得先挑一边。"],"择":[{"名":"助押车","文":"你冲下去，先把断腿那人拖到车后，再回身打散了两个蒙面的。{人物}趁势护车后退，最终只有一车保住。他问你想要什么，你说想看看车上是什么。他掀开布，里头是几十枚疗伤的丹，寻常货色，可真能救命。他把最上面一层全给了你，说这趟值了。","果":{"修为":130,"声望":5,"气血":-18,"灵石":60}},{"名":"趁乱取丹","文":"你摸下去捡那些散落的丹囊，装了满满一怀。有人在你背后砍了一刀，你回身把他打退，趁着混乱钻进岩缝走了。那批丹成色不错，卖了不少钱。可你后来听说那队车全军覆没，山下的村子断药七日，死了几个孩子。你把剩下的丹收进箱子最底下，再没拿出来过。","果":{"灵石":200,"灵材":1,"因果":3,"道心":-2,"气血":-10}},{"名":"断桥拦路","文":"你把坡上那堆碎石推下去，堵住了窄道的两头，谁也别想走。混乱中两边都停了手，蒙面人骂了几句，退走了。押车的人趁这段时间把车推回了岔道。{人物}走过来，看着你推石头推破的手，说了一句：这法子不英雄，倒管用。","果":{"悟性":3,"声望":4,"因果":-1,"气血":-6}}]},{"id":"luoxia_045","题":"霞尽之时","类":"奇闻","重":2,"域":["luoxia"],"境界":[0,6],"段":["{天象}。落霞山脉的霞光一年只有三日能落尽，落尽的那一刻，整座山会暗下来，像火被谁按住了。{人物}说这个时候不能站在高处，因为霞落之时，山里的东西会往上走。","你不信，还是上了{地点}。天光一寸寸退，赤色从岩壁上剥下去，露出底下真正的颜色：灰的，冷的，被烧了三千年之后剩下的那种石头。山忽然安静得厉害，连风都停了。","{天象}的最后一线在崖顶停了一瞬，随即断了。那一刻你看见山下的谷里有千百点赤光在动，一排排往上浮，浮到半山腰就停住。它们不叫，也不上来，像在等什么。","崖顶只有一条退路，而赤光离你不到百丈。{人物}在下方喊，声音被山吞了一半。"],"择":[{"名":"站到霞灭","文":"你站着没动，一直看到最后一点光灭尽。那些赤光也同时沉了下去，像被谁叫回了家。你在崖顶站到天光大亮，浑身凉透，可就在那一夜里，你把《落霞剑歌》里最难的一节想通了——原来那歌不是唱给霞听的，是唱给霞底下那些东西听的。","果":{"悟性":4,"修为":160,"功法":1,"气血":-15,"道心":1}},{"名":"退下去","文":"你顺着他喊的方向退下崖，退到半山腰时赤光刚好浮上来，贴着你脚边往上走。它们没有碰你，只是贴着，凉丝丝的。你在山腰的岩洞里躲到天亮，听见外头有细碎的声音，像是很多人同时在低声说话。第二日你下山，逢人就说这山里有东西，没人信。","果":{"修为":60,"悟性":2,"寿元":4,"道心":1}},{"名":"以剑意喝斥","文":"你拔剑朝崖下劈出一线剑意。赤光一顿，齐齐停住，随即像被人拨散的灰一样散开。山风重新起了，可你听见崖下传来一声极长的叹息，那声叹息里有不甘，也有认命。此后你再到落霞坡，霞光总比别处晚落一刻——像是有什么东西记得你那一剑。","果":{"修为":200,"魔念":1,"因果":2,"声望":3}}]},{"id":"luoxia_046","题":"炉火问剑","类":"修行","重":2,"域":["luoxia"],"境界":[3,9],"段":["{地点}的炉房里，剑修与器修同案而坐。这在这山里是件稀罕事：赤霄剑宗的人不碰炉，百炼山的人不摸剑，两边三百年来只在崖上见过面。今日来的这位{人物}却带了一柄断剑，请{人物}重铸。","剑是{宗门}传下来的，断在六寸处。匠人说铸可以，但铸出来的剑会失掉一截剑意，因为断口处的火气已散。剑修说不要紧，剑意还在我手里。两人就在炉前对坐了三日，一个说火，一个说意，说到第三日，炉里的铁开始自己发红。","{天象}从窗缝灌进来，把炉火压得极低。你忽然看出这两人的争论不是门派之争，是同一件事的两种说法：剑是打出来的，也是想出来的。谁都没错，谁也不肯认。","{天象}照着炉门，两人同时看向你，问你觉得这剑该怎么落这一锤。"],"择":[{"名":"按火候","文":"你说火候到此为止，再烧一分，铁就软了。匠人点头，落锤，剑成。断口处接得极好，可剑意确实短了一截。剑修提剑试了一式，沉默很久，最后说：短一寸也好，短了就不会再想一步跨到天上。他把剑佩回腰间，与匠人对饮了一夜。","果":{"修为":220,"悟性":3,"器物":1,"声望":3}},{"名":"留断口","文":"你说别铸了，把断口磨平，就用这一柄。两人都愣住。剑修先笑，说自己用惯了完整的剑，不习惯。匠人却把磨石递了过来。剑最后磨成了短刃，剑修带着它下山，半年后在关外一战成名，江湖上都说赤霄出了个使短剑的疯子。","果":{"修为":180,"道心":2,"悟性":4,"器物":-1,"声望":5}},{"名":"重打一柄","文":"你说既断了就重打，旧的埋了，新的自己长。匠人眼睛一亮，剑修却摇头。两人争了一夜，最后折中：断剑留着，另打一柄新的，两柄同炉，剑意见证。新剑出炉那日，炉房里所有器都跟着响了一声，像在应和。你得了其中一柄，此后再与人交手，总觉得背后有人替你压着阵。","果":{"修为":240,"器物":1,"因果":1,"悟性":2,"声望":2}}]},{"id":"luoxia_047","题":"炉中火鬼","类":"奇闻","重":2,"域":["luoxia"],"境界":[0,4],"段":["{地点}的炉房夜里不能空着，空了就会出事。你守夜那一晚，炉膛里的火自己涨起来，火舌不往上窜，反而贴着炉壁打转，转出一个模糊的人形。{人物}说这是火鬼，旧炉里烧坏了东西才会生出来。","{人物}说这东西不伤人，只爱偷吃火。看见它，说明这炉的火候一直是虚的，实际热量早被它吞了三成。你这才明白为什么最近出的器都不对劲。他还说，从前有个匠人舍不得熄炉，硬撑了两年，最后死在炉前，脸被火烤成了一样东西，看不出是人。","{天象}从窗纸外透进来，火鬼在炉里慢慢地转，像在看你们说话。你注意到它转过一圈，炉壁上的裂纹就深一分，像是它在一点点把炉吃掉。","{人物}递给你一柄长钳，说熄炉要两个人，一个压火，一个开炉门。熄了火鬼就散，但这一炉的料也就废了。"],"择":[{"名":"熄炉","文":"你把炉门拉到最大，冷风灌进去，火鬼挣扎了三下就散了。炉中的料废成一块死铁，敲开以后里头竟是一小团灰白的东西，像骨头。{人物}把它埋在炉房后面，说这样它就回不来了。此后他教你辨火的方式变了一整套：不是看火有多旺，而是看火有没有心虚的地方。","果":{"修为":80,"悟性":3,"器物":-1,"灵材":1}},{"名":"捉它","文":"你伸钳进炉口，想把它夹出来。那东西顺着钳子攀上来，从你的手腕钻进经脉，凉得骨头都发麻。你当场倒地，醒来时已是第二日，右手的火气比左手旺得多，炼器时火候要减三分才勉强顺手。{人物}说你这辈子都赶不走它了，不过它也算给了你一点东西：你从此能看见别人看不到的火色。","果":{"修为":120,"气血":-15,"悟性":3,"魔念":1}},{"名":"封炉不熄","文":"你提议不熄，只封炉三日，让它自己把火吃干净。他半信半疑地照做了。第三日清晨开炉，火鬼果然没了，炉底留着一层细白的灰。这一炉的料全废，可炉子的裂纹也没再深。他请你喝了一碗汤，说他打了四十年器，头一回有人告诉他炉还能这么养。","果":{"悟性":2,"声望":4,"修为":50,"因果":-1}}]},{"id":"luoxia_048","题":"崖下借宿","类":"人情","重":4,"域":["luoxia"],"境界":[0,3],"段":["{天象}，你在{地点}的崖下找到一户人家，土墙上挂着晾干的{灵材}，屋里有个老妇在缝补一张破网。你讨水喝，她让你进屋，把炭盆挪到你脚边，说这山里夜里冷，风比刀还利。","{人物}问你从哪儿来，往哪儿去，问得很慢，问完就不再说话，只是往灶里添柴。你注意到灶上那口锅只剩半锅稀粥，锅边放着一只空碗，摆得整整齐齐，像是留给什么人的。","半夜{天象}起来，屋外的赤岩被吹得呜呜响。她忽然开口，说三年前她儿子也想上山学剑，走时说三个月必回来，如今人都没个信。她说她不怨宗门，也不怨这山，只是每天多摆一只碗，摆惯了。","{人物}从柜里取出一件用布裹着的东西，一层层翻开送到你面前，问你：外头的人，是不是都这样拿剑的？"],"择":[{"名":"说真话","文":"你看了那件东西，是一柄自己打的剑坯，铁质极差，刃口不平，可它被打得很认真。你说这样拿剑的手，多半已经死在山上了。她听了没有哭，只是把布重新裹好，说早知道也好。临走她硬塞给你一包干粮，你走到崖口回头，看见她正在收拾那只多余的碗。","果":{"因果":-2,"道心":3,"灵石":20,"悟性":1}},{"名":"说好话","文":"你说这山里学剑的人多半在外头行走，三年五年不着家是常事。她眼睛亮了一下，说她就知道。你在她家又住了一夜，替她把院墙补了。走出很远你才想起，她儿子若真活着，这山里不会一点消息都没有。你说了一个谎，换她安稳睡了一觉，这买卖算不算亏，你自己也说不清。","果":{"道心":-1,"悟性":2,"因果":1,"寿元":3}},{"名":"带剑下山","文":"你说这剑坯给我吧，我替你带下山去，交给会打器的人看看。她愣了很久，把布包递过来时手抖得厉害。你把剑坯送到百炼山，匠人看了说铁不行，但打的人下了心。他替她重新炼了一柄，剑柄上刻了个极小的字，是她的姓。你把剑送回崖下时，她抱着剑哭了半宿。","果":{"器物":1,"声望":5,"因果":-3,"道心":2,"灵石":-40}}]},{"id":"luoxia_049","题":"剑修借火","类":"机缘","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}的路口有个火堆，是来往的人自己添柴维持的。你到的时候火快灭了，旁边坐着一个{人物}，衣服上全是血，剑横在膝上，剑鞘早丢了。他见你过来，先说了一句：借个火，行不行。","你添了柴，火重新起来。{人物}把手伸到火边烤，手背上有一道新伤，皮肉翻开，深可见骨。他说自己被同门追了三天，从赤霄峰一路逃到这里，追他的人今晚就会到。他说这话的时候语气很平，像在说别人的事。","{天象}把火堆照得忽明忽暗，他的影子在岩壁上一会儿长一会儿短。你注意到他膝上的剑没有剑格，断口处磨得发亮，像是被人反复摩过。他忽然问你：你觉得一个剑修，丢了剑鞘算不算丢了一半的命？","火堆噼啪响了一声，{人物}抬眼看向来路，手已经按在剑上。"],"择":[{"名":"助他挡","文":"追兵到了，三个，都是赤衣。你站在火堆另一侧，把话说清楚：人在这儿，可今夜谁也别想带他走。那一场打得很短，你挨了一剑，他也挨了一剑，三人退了。天亮时他把断剑上的剑穗解下来给你，说这东西不值钱，可它跟了他十年。此后你每逢遇险，总能在最后关头多撑半口气。","果":{"修为":150,"气血":-20,"声望":3,"器物":1,"因果":-1}},{"名":"劝他自首","文":"你说逃不是路，回宗门认了，最多废去修为，命还在。他听完笑了很久，笑得伤口都裂开。他说你大概不知道赤霄剑宗的规矩，认了就是死，不认才有活路。天亮前他走了，走时把火堆添得满满的，说这火留给你。三日后你听说赤霄峰上处决了一名叛徒，尸首挂在崖口三日。","果":{"悟性":2,"因果":1,"道心":-1,"灵石":30}},{"名":"换他的剑","文":"你提出用一柄完好的剑换他那柄断剑。他盯着你看了很久，问你图什么。你说图这柄剑上的东西。他把剑推过来，接过你的剑掂了掂，说这剑太轻，配不上他的手。可他到底换了。后来你在断剑的断口里发现一道极细的刻痕，是一段剑式的口诀，只有三句，却把前面三十六式全串起来了。","果":{"器物":1,"修为":90,"悟性":4,"因果":1}}]},{"id":"luoxia_050","题":"爆炉之日","类":"灾祸","重":2,"域":["luoxia"],"境界":[0,4],"段":["{地点}的丹房炸了。你赶到时墙塌了半边，烟从瓦砾里往上冒，{人物}被人从火里拖出来，半边脸烧得认不出。他说炉子炸之前火色不对，红里泛青，那是丹气走岔的兆头，可惜他当时贪了一刻。","{地点}塌下来的梁压住两个丹童，一个还在动。围观的人不少，没几个敢进去，因为里头还有三只炉没熄，谁也说不准第二声什么时候炸。空气里那股药味浓得刺鼻，闻久了头晕。","{天象}把烟照成赤色，火从瓦砾的缝里一跳一跳。你听见里面有人在敲东西，闷闷的，一下一下，是活的。{人物}抓住你的衣角，说里头还有他的{器物}，那东西不能落在别人手里。","第二声炸响还没有来，{天象}压着屋顶。你只有一次进去的机会。"],"择":[{"名":"先救人","文":"你冲进去，把压着的两个人拖出来，来回两趟，第三趟时炉炸了，热浪把你掀到墙外。你背上的皮被烤掉一层，可两个人都活着。{人物}的东西留在里头，他没怪你，只看着那片废烟坐了很久。后来他把话说得很轻：东西没了可以再造，人没了就没了。","果":{"声望":8,"气血":-28,"因果":-3,"道心":2}},{"名":"先取器","文":"你冲进去抱着那件东西出来，出来时炉炸了，房梁砸下来，把还没救出的人埋在里面。你抱着东西站在烟里，听着底下的敲击声一点一点弱下去。{人物}看着你，什么也没说。那件东西后来救过你一次命，可你从此不敢在夜里听敲击声。","果":{"器物":1,"灵石":80,"因果":4,"道心":-3,"气血":-15}},{"名":"泼水压炉","文":"你提来几桶煮丹泉的温水，绕到丹房后头，从裂口往炉膛里灌。水一进去，火就闷了，第二声炸响始终没来。塌下来的梁也没再动。你进去把人一个一个抬出来，一个活，一个死。{人物}后来说，那天若不是你灌水，整条街都要跟着烧。","果":{"悟性":3,"声望":5,"修为":60,"因果":-1}}]},{"id":"luoxia_051","题":"上门收账","类":"市井","重":2,"域":["luoxia"],"境界":[0,4],"段":["{地点}的巷子里，{人物}带着两个帮手堵在一户人家门口，手里翻着{器物}，一页一页念：某年某月，赊丹三枚；某年某月，赊药一副。念到第七笔时，屋里的人终于开了门，是个瘦得脱形的中年修士。","丹霞观的账从不赖，可也从不留情。老账房说得很清楚：账上的数是死的，人是活的，但活人得先还死账。那修士说自己伤还没好，实在拿不出钱。{人物}笑了笑，说没事，可以拿别的抵。","{天象}把巷子照得昏红，那修士的手在袖子里攥着，攥得很紧。你站在巷口看着，看见他身后屋里坐着一个孩子，正趴在桌边写什么，桌上摆着一只空药碗。","{人物}转过头，看见你，问了一句：这位道友，是来替他还的，还是来看的？"],"择":[{"名":"替他还","文":"你数出灵石搁在门框上。老账房愣了一下，随即笑开，在账册上划了一道，客气地带着人走了。那修士半晌说不出话，最后从屋里取出一块旧铁塞给你，说这是他能拿出的最值钱的东西。你走出巷子时听见那孩子在屋里念书，声音很清楚。这块铁后来在你最缺钱的时候救了你一命。","果":{"灵石":-180,"声望":5,"因果":-3,"器物":1,"道心":2}},{"名":"看","文":"你退到巷口，什么也没做。那天他们搬走了屋里所有值钱的东西，连那只药碗也拿走了。孩子哭到夜里才停。半年后你在关下遇见那个修士，他成了丹霞观外门的一个跑腿的，见你便点头哈腰。你想起那天他攥在袖子里的手，忽然明白了那是什么姿势——是忍。","果":{"灵石":20,"因果":2,"道心":-2,"悟性":1}},{"名":"打账册主意","文":"你说替他还，但要把那本账册给自己看一页。老账房犹豫了一下，还是掀开给他看了一眼。就这一眼，你记住了十几个欠账人的名字。后来你拿这些名字换了钱，也用它救了几个人。账册上的数是死的，可死数也能杀人——你只是在它还活着的时候，先动了一次手。","果":{"灵石":120,"悟性":3,"因果":2,"声望":-3}}]}]},"nanjiang":{"词汇":{"人物":["万蛊门的蛊师","养蛊童子","斗蛊客","草鬼婆","本命蛊主","祖庭巫祝","跳神巫女","祖灵守墓人","青木谷药童","采药人","渡口摆渡佬","蛊贩子","蛊医","用毒的老猎户","蛊皿死士","弃蛊人","赶尸客","瘴林猎户","外来寻宝的散修","披银线法衣的祭司","雨林镖师","替人种蛊的老农"],"地点":["万蛊窟","祖灵谷","青木涧","毒瘴沼泽","荧光菌毯","千足藤林","尸香魔芋坡","蛊瓮洞","雨林渡口","白骨水潭","血藤桥","断头树","百花瘴谷","蛊神祭坛","无人寨","木鼓坪","青木药圃","蛇蜕峡"],"天象":["林间夜歌不知出自何人","雨季之后遍地生出荧光菌毯","瘴气如白练贴地垂落","血月照进林隙","毒雾随潮气一层层升起","万蛊齐鸣之夜","祖灵低语的一阵急雨","萤虫成云压低了树梢","林雨如帘三日不歇","闷雷压林不散","日晕三重如叠环","菌丝连成的光海一直漫到天边","无风而林自摇","虫声齐绝的一刻","祖灵谷升起青色烟柱","黑潮从林缘涌来"],"妖异":["金线蛊虫","尸香魔芋","千足藤","血蛭王","食人花冠","双头蛊蜥","瘴林鬼面蛛","祖灵虚影","白骨蝇","赤足蛊奴","木僵尸","化形蜈蚣精","青鳞雨蛇","蛊虫母体","食梦蛾","腐叶童"],"器物":["封了三年的蛊瓮","巫祝骨铃","千足蛊笼","血玉饲蛊皿","祖灵面具","斗蛊铜盘","药师青囊","藤甲","蛊针匣","油布火折","解蛊汤盏","蛇骨杖","蛊虫玉牌","蛮巫木鼓","蛊神残像","银线法衣","毒囊陶瓶","祖庭祭刀"],"灵材":["金线蛊虫","尸香魔芋","千足藤","血灵芝","瘴林龙涎","荧光菌母","青木还魂草","断肠花","骨蛊石","蛊神木芯","雨林血藤","巫祝祭灰","百草蜜","毒蟒胆","腐木灵芝","引虫香"],"功法":["《万蛊归巢诀》","《本命同生咒》","《以身为皿篇》","《祖灵祭歌》","《巫祝招魂辞》","《斗蛊十八手》","《青木解蛊经》","《草木为阵诀》","《瘴行术》","《蛊毒双修录》","《千足缠身法》","《血饲蛊经》","《雨林医毒篇》","《万虫噬心咒》"],"际遇":["于毒沼深处拾得一枚无人认领的蛊瓮","在荧光菌毯下救起一个垂死的蛊师","被祖庭巫女以血为引领进祭坛","于断头树下挖出前朝蛊师的尸骸","在雨林渡口替老蛊医撑了一程船","撞见青木谷药童替蛊奴解蛊","在万蛊窟外偷听了半场斗蛊","于百花瘴谷误饮一口毒泉","拾得半卷浸烂的《血饲蛊经》","替祖灵守墓人挡下一夜瘴虫","于菌毯光海中见祖灵显形","在蛊贩子手里救下一瓮幼虫","误入无人寨听了三日巫歌","于蛇蜕峡捡到一张完整的雨蛇皮","替斗蛊客试了一只不敢认主的蛊","在青木涧药圃替药童除了三日草","于雨夜听林中夜歌而忘了归路","拾得蛊神木芯一截"],"祸患":["被自己的本命蛊反噬","遭万蛊门以蛊印追债","被巫祝骂作亵渎祖灵之人","蛊毒发作七窍渗血","在斗蛊场上输掉一身精血","被青木谷逐出药圃","遭瘴气侵体三月不愈","被蛊贩子贩去当蛊皿","擅入祖灵谷中了万蛊噬心","被同门以蛊虫暗中换血","在雨林里迷途七日断粮","被白骨蝇围咬了三夜","遭蛊虫入脑夜夜呓语","替人试蛊中了双生毒","被寨中巫女下了一道情蛊","背着蛊瓮逃出万蛊窟"],"宗门":["万蛊门","巫祝祖庭","青木谷","蛊贩行会","南荒采药盟","祖灵守墓人","白骨渡","黑苗九寨","雨林镖行","九州商会南疆分号"],"地名":["南疆蛊林","南荒","万蛊窟","祖灵谷","青木涧","毒瘴沼泽","百花瘴谷","蛊神祭坛","木鼓坪","无人寨"]},"图鉴":[{"类":"地理","文":"南疆蛊林腹地有一处地陷，深逾百丈，四面石壁被虫蛀成千疮。万蛊门据此为山门，取「万蛊归窟」之意。窟中分九层，愈下愈湿，第三层以下终年不见天日，石上积着一层会动的黑——那是历代养蛊人弃下的虫。门规：入窟者须携一只本命蛊，无蛊者下到第二层便被窟中虫群认作活食。窟口立一块无字碑，碑下埋着三十七具门中先辈的蛊皿肉身，每逢雨夜碑面渗出黏液，据说是下面还有活的。","引":"「窟无字碑，虫有主。」——《南荒虫谱》","名":"万蛊窟","卷":1},{"类":"地理","文":"巫祝祖庭所在，谷口两崖夹一线天，终年白雾封谷。谷中无水声，只闻低语。祖庭以血脉祭祀山川祖灵，凡入谷者先在谷口割指滴血于石，血入石不散者方可入。谷内石壁上刻满巫歌，字迹被苔藓吃掉一半，剩下一半每到雨季自行渗红。传闻祖灵并非木石偶像，而是历代巫祝的念与血，养在谷心一口无底井里；谁若在谷中高声唱错了巫歌，井里便会爬出他自己的影子。","引":"「谷中不闻人语，只闻祖灵记账。」——祖庭祭辞","名":"祖灵谷","卷":1},{"类":"地理","文":"青木谷据青木涧而立，涧水从林心涌出，色如碧玉，饮之可缓瘴。谷中弟子以草木为药，以灵植为阵，涧边三十里皆是药圃，圃间钉着木牌，牌上写着治什么毒、忌什么人。此地是九州少有的能解蛊毒之处，故常有蛊师改了名字、蒙了面来求医。谷规奇特：凡蛊师求医，须先交出一只自己养的蛊作押，医毕归还；若医不好，谷中当众将蛊碾碎，赔一副药资，从不与人结仇。","引":"「草木无心，故能活人。」——青木谷门规首句","名":"青木涧","卷":2},{"类":"地理","文":"南疆腹地的一片烂泥海，水面浮着腐叶与绿沫，脚踏下去能陷到腰。沼泽每隔七日吐一次瘴，瘴气白中带青，形如垂练，贴着地面走，人畜沾之即倒。本地猎户识瘴如识天气：晨雾直上无风则瘴起，林鸟齐飞不鸣则瘴至。沼泽深处有沉船与死树，据说是一支外来的采药队连人带船陷进去的，船头还挂着没解完的绳。瘴退三日之内，泥面上会浮出一层细骨，那是被瘴吃净的活物。","引":"「宁走蛇腹，不踏瘴泥。」——南荒猎户旧谚","名":"毒瘴沼泽","卷":2},{"类":"地理","文":"雨季之后，南疆林下的腐叶上会生出一层荧光菌毯，青白微光，绵延数里，夜行不必举火。菌毯最密处可没膝，踩上去无声，只觉脚底温热。采药人说菌毯是地底下有人在喘气，因为菌毯之下往往埋着死去的蛊师或蛊虫，菌丝把尸身吃净，再把光吐出来。禁忌有三：不可在菌毯上睡，不可用刀割菌母，不可对着光海叫死人的名字。违者次日身上会起一圈青色的环，环上生细毛，那是菌丝在认路。","引":"「走到光里别回头，光认得你的脚。」——采药人夜话","名":"荧光菌毯","卷":3},{"类":"地理","文":"在百花瘴谷的最深处，一圈黑石垒成的圆坛，坛心是一口倒扣的石瓮，瓮上无纹。巫祝祖庭每年雨季末在此行大祭，杀牲不用刀，用蛊。祭时坛周插满火把，火不摇，因为不许有风。坛上供奉的并非神像，而是一具被虫蛀空的巨兽骨架，据说是上古蛊神的坐骑。祭坛三里之内，虫蚁不入，鸟兽不鸣；擅入者往往走着走着便跪下，膝下土壤里有东西顶着他的骨头。","引":"「祭坛无神，只有债主。」——祖庭守墓人语","名":"蛊神祭坛","卷":3},{"类":"宗门","文":"南疆最大的魔道宗门，山门在万蛊窟。门中以身为蛊皿，养千虫于血肉，入门第一课是选一只本命蛊，从此生死与共。门中不论辈分只论蛊：谁的本命蛊压得住别人的，谁便说话算数。万蛊门有三不：不养无主之蛊、不与同门换蛊、不弃本命蛊。违第三戒者逐出山门，江湖上称弃蛊人，无人敢与之同席——因为弃蛊之人身上的蛊多半还在，只是不再听他的话了。","引":"「入我门者，先把命交一只虫。」——万蛊门入门誓","名":"万蛊门","卷":4},{"类":"宗门","文":"南疆最古老的传承，比万蛊门早出至少八百年。祖庭不问外界纷争，不争灵脉，不设外门，弟子皆出自谷中九寨，血脉可溯至上古。祖庭所修是巫道与祭祀：以血喂祖灵，以歌役山川，一唱巫歌，林间虫兽皆伏。祖庭有两样东西最叫人忌惮：一是祖灵谷的万蛊噬心，二是祭辞——据说巫祝念出某人名字三次，那人便会在梦里听见自己小时候的声音。","引":"「我们不请神，我们告诉山该怎么做。」——祖庭大巫祝","名":"巫祝祖庭","卷":4},{"类":"宗门","文":"南疆唯一的正道门派，驻地青木涧，势力不及万蛊门三成，却没人敢动。谷中弟子以草木为药，以灵植为阵，能解九州大半蛊毒。谷主是个瘸腿老人，据说年轻时被万蛊门囚了七年做蛊皿，逃出来时身上还养着三只没死的虫，他一只只逼出来，埋在药圃下当肥料。青木谷救人从不问出身，只问一句：你身上的蛊，是别人下的，还是你自己养的？前者白救，后者收双倍药资。","引":"「医得了蛊，医不了贪。」——青木谷谷主","名":"青木谷","卷":5},{"类":"宗门","文":"不是门派，是一伙行商。蛊贩行会把蛊分三等叫卖：下等叫肉蛊，几十只装一瓮，买去做苦力；中等叫器蛊，能附在人身上代为驱策虫蚁；上等叫命蛊，只卖给识货的，价格开得含糊，因为卖的多半是偷来的。行会规矩最重一条：不卖本命蛊。可谁都知道，最贵的货正是从死掉的蛊师尸体里剖出来的本命蛊。行会不收灵石，只收活物与消息。","引":"「蛊认价，不认人。」——蛊贩行会行话","名":"蛊贩行会","卷":5},{"类":"宗门","文":"九座寨子沿南荒山势散落，寨寨养蛊，寨寨唱巫歌。九寨不属万蛊门也不听祖庭号令，只认一条祖训：寨中死人，尸身须留三日，让蛊把最后的念吃净，才可下葬。九寨的蛊不外传，外人也学不来——因为养蛊的法子写在巫歌里，巫歌只在寨中女子口里传。外人若偷听巫歌，寨老会请他喝一碗酒；喝过的人次日便不再记得自己姓什么。","引":"「歌在人在，歌断寨空。」——黑苗寨老","名":"黑苗九寨","卷":6},{"类":"人物","文":"南荒最不好惹的一种人：独居林缘，屋里只摆一口蛊瓮和一张矮凳，专替人下蛊、解蛊、咒人。草鬼婆不养本命蛊，她养的是「替蛊」——同一只蛊分成子母，母蛊留在瓮里，子蛊下到别人身上；她要人疼，只需捏一捏母蛊。所以求她的人从不敢还价。草鬼婆的规矩也怪：一个月只接一桩，且要先听你讲完为什么要下这道蛊；讲得她摇头，她便把门关上，银子原封退回。","引":"「我不问你有没有理，我问你夜里睡不睡得着。」——草鬼婆","名":"草鬼婆","卷":6},{"类":"人物","文":"万蛊门下走出来的旁支，专以斗蛊为业。斗蛊客身上不带刀剑，只带三只蛊笼：一只斗、一只备、一只喂着不斗。斗蛊场的规矩：两蛊入铜盘，盘心划一道线，先越过线的算输。输家要割腕饲蛊，让对方的蛊吃饱，这叫「养血」；养血养得狠，一场下来整条手臂都白。真正的斗蛊客不算蛊多凶，算的是盘上那半步——什么时候退，什么时候让蛊咬自己一口。","引":"「盘上无师徒，只有活的和饱的。」——斗蛊场旧规","名":"斗蛊客","卷":7},{"类":"人物","文":"南疆巫医的一支，不属青木谷，也不入万蛊门，四处行医换宿。蛊医看病不用望闻问切，先取一碗清水，让病人对着水吐一口气，再看水面上有没有细纹；有纹是虫在，无纹是毒在。蛊医最怕两种病人：一种是被下了三年的老蛊，虫与肉长成一块；一种是自愿养蛊养到浑身是虫的，医他等于杀他。蛊医的报酬从不收灵石，只收病人身上掉下来的一枚指骨或一颗牙。","引":"「虫有虫的理，人有人的债。」——蛊医行话","名":"蛊医","卷":7},{"类":"人物","文":"祖庭中专司唱祭的女子，不嫁人，不入俗世，一生只学一支巫歌。跳神时赤足披发，脚踝系一串虫壳铃，踏地三尺，铃不响而虫自鸣。巫女唱到第三折会失声三日，这三日里她所见所闻都算祖灵的旨意，寨中大事全凭这三日的梦。巫女到了四十岁便要「归谷」——进祖灵谷深处不再出来。谷口的石壁上有一排浅坑，那是历代巫女归谷前留下的额印。","引":"「我唱的不是歌，是替山里记账。」——跳神巫女","名":"跳神巫女","卷":8},{"类":"法宝","文":"养蛊之器，形制粗陋，多为陶瓮，瓮口蒙一层生牛皮，牛皮上画血符封口。蛊瓮讲究「一瓮一窝」：瓮底铺腐叶与骨粉，中间垫一层活泥，最上一层才是虫。封瓮后不可开，只可在瓮壁敲三下听声——声闷则虫活，声脆则虫尽。养蛊人搬家必背瓮而行，瓮不离身；若瓮破，虫四散，养蛊人须在原地坐满七日，等虫自己回来，回不来便只能剖肉把剩下的虫掏出来。","引":"「瓮在人在，瓮破人散。」——养蛊旧谚","名":"蛊瓮","卷":8},{"类":"法宝","文":"巫祝祖庭的信物之一，以历代巫祝的指骨串成，铃心是一粒虫玉。摇铃有法度：一摇唤虫，二摇镇魂，三摇送人。祖庭弟子出谷办差必带骨铃，遇瘴摇一，遇蛊摇二，遇死不瞑目者摇三。骨铃最忌在祖灵谷内响起——谷中不认铃，只认血。传闻骨铃摇错次序，摇者当夜便会听见自己骨头里有东西在跟着摇，摇到第七夜，人便不摇铃了，铃自己响。","引":"「一唤虫，二镇魂，三送人，四就轮到你了。」——祖庭戒条","名":"巫祝骨铃","卷":9},{"类":"法宝","文":"斗蛊场上的裁器，铜铸圆盘，径一尺二寸，盘面刻着三圈刻痕与一道中线，盘底有细孔，能渗血。两蛊入盘，胜负以越过中线为准，若两蛊缠死不分，则以盘底渗血的颜色断：血鲜者胜，血黑者败。铜盘用过百场便要重铸，因为盘底的孔会被血垢堵死。铸盘的匠人只做一件事——每铸一盘，先在盘心刻一个「让」字，再刻一只虫把它吃掉。","引":"「盘有三圈，人只有半步。」——斗蛊场裁语","名":"斗蛊铜盘","卷":9},{"类":"法宝","文":"祖庭祭刀短而厚，无锋，刀背刻满巫歌，刀身常年裹着一层暗红。此刀不杀人，只割血：祭山川、祭祖灵、祭入谷者，皆用这一刀。刀上血迹从不清洗，祭一次添一层，久而久之刀比原来厚了一指。祖庭有言：刀上的血是账，账不能擦，只能添。使者出谷若携祭刀，万蛊门的人见了会退三步——不是因为怕刀，是怕刀上那些血里有自己门中先辈的。","引":"「刀不利，才割得深。」——祖庭器物志","名":"祖庭祭刀","卷":9},{"类":"法宝","文":"以千足藤的老藤编成的虫笼，笼身不用一钉，全靠藤丝自缠，编成后浸在血里七日，晾干再用。笼分九格，格与格之间只隔一层藤膜，虫在格中能闻见彼此的气味却咬不到，日久便互相认主。万蛊门用它驯「合蛊」：把九格的虫一同倒入蛊瓮，活下来的那一只就成了气候。蛊笼用久了藤膜会破，破一次便要重编，编笼的人多半活不过四十，因为藤丝上有虫卵。","引":"「九格养一虫，一虫吃九格。」——万蛊门器物录","名":"千足蛊笼","卷":8},{"类":"法宝","文":"血玉凿成的浅皿，只有巴掌大，皿底刻一圈极细的沟槽，可容血半盏。此物专饲「认血」的蛊——蛊师每日子时割指滴血入皿，让本命蛊在皿中饮血认味，久而久之蛊只认这一人的血，别人喂它便咬。血玉用久了会由红转黑，皿底沟槽里析出一层晶，那是蛊师本人的精血所结。门中老人说，血玉越黑，人越薄，到某一天皿中血已不必割指，自己会满。","引":"「皿里的血先干，人的血后干。」——血玉旧主遗言","名":"血玉饲蛊皿","卷":7},{"类":"功法","文":"万蛊门镇门之法，共九篇，传内不传外。此诀不修气，只修「唤」：以本命蛊为中军，以自身血气为号令，一声低啸可召回散在林中的虫群。练到第三篇，蛊师能同时驱使三百虫而不乱；练到第七篇，虫群可自行结阵，蛊师闭目亦知虫在何处；练到第九篇便没人再练了——因为第九篇的第一句是「以身代巢」，练成之后虫不再回瓮，全数宿在人的血肉里，人活着，只是虫的窝。","引":"「万蛊归巢，巢是谁？」——《万蛊归巢诀》末页小字","名":"《万蛊归巢诀》","卷":6},{"类":"功法","文":"万蛊门入门第一课，也是终身之课。选一只幼虫，以中指血喂七日，第八日虫自会钻入掌心，从此与人心脉相通。此后人疼虫疼，人死虫死；反过来说，虫若死，人心脉亦断一截——这便是本命蛊反噬的由来。此咒最狠的一处不在养，在「同生」二字：虫的寿数往往比人长，人老死之时，虫还活着，会从尸身里爬出来，钻进最近的一个活人体内，重新认主。","引":"「同生是同它的生，不是同你的生。」——弃蛊人之语","名":"《本命同生咒》","卷":6},{"类":"功法","文":"青木谷不传之医经，共四卷，分「辨蛊」「逼蛊」「引蛊」「养残」四篇。最精妙处是「引」：不用刀剜，不使药攻，只在病人掌心涂一层蜜，再用一味引虫香把蛊从血肉里诱出来，诱到掌心，以竹片轻轻挑起。此法慢，一日只引一只，却极少伤及经脉。第四篇「养残」写的却是最沉痛的事——蛊去之后人已成残，如何以草木替他补回半条命。","引":"「蛊可去，人难全，故医者要慢。」——《青木解蛊经》序","名":"《青木解蛊经》","卷":5},{"类":"功法","文":"祖庭巫歌共十二折，非功法而胜功法。唱时以丹田送气，以脚跟踏节，声不必高，须沉。第一折唤雨，第二折唤虫，第三折唤祖灵；四折以后所唱何事，只有巫女自知。此歌不能学，只能「接」：老巫女唱一句，新巫女跟一句，跟错一个字便要重来，重来三次则此生不许再唱。谷中石壁刻的歌与口传的歌有一处不同，那一处从无人敢问。","引":"「唱对了山应你，唱错了山记你。」——跳神巫女授歌语","名":"《祖灵祭歌》","卷":4},{"类":"丹药","文":"青木谷最寻常也最要紧的一味，取还魂草、百草蜜与涧底青石煎成，汤色浑绿，入口先苦后甘。此汤不能杀蛊，只能「按住」蛊，让人有一口气撑到医师动手。凡中蛊者先灌一盏，三日之内蛊虫昏睡，医师便可从容引蛊。汤有三忌：忌与酒同服，忌连服七日以上，忌给养蛊人自己喝——养蛊人的血里全是虫气，汤一入喉便成了虫的食料，反而催它们醒。","引":"「先按住，再说话。」——青木谷药童口头禅","名":"解蛊汤","卷":5},{"类":"丹药","文":"以腐木灵芝、断肠花蕊与蛊神木屑合制，燃之无烟，气味甜得发腻。此香专诱蛊：点香之后，方圆十丈内的蛊会离体而出，循香而来，聚在香灰上打转。诱蛊者须在香旁守候，一手持竹片，一手持汤盏，虫来一只挑一只，慢了虫会互相咬死，快了虫会钻回人身上。行内有句话：引虫香不怕虫多，怕的是香灭了虫还没挑完。","引":"「香是钩子，人是饵。」——蛊医行话","名":"引虫香","卷":4},{"类":"丹药","文":"取蛊神木的内芯，色作暗金，刀砍不入，须以虫蛀三年方得一截。此木不入药，是「饵」：佩之则虫不近身，磨粉则虫蜂拥而至。南疆人佩一截木芯行林，视为护身之物；可木芯最怕遇水，浸过雨的木芯会反转，把附近所有的虫引到自己身上。故老人教后辈：木芯只佩在内襟，宁可热着，也别叫雨淋了它。木芯燃成灰，掺入祖庭的祭灰，便是上等的引路之资。","引":"「木芯护人三日，人护木芯一生。」——南荒习俗语","名":"蛊神木芯","卷":3},{"类":"丹药","文":"南荒雨林中野蜂所酿，蜜色琥珀，遇冷成膏。百花瘴谷的蜂采的是瘴花，蜜中自带三分毒，凡人食之立毙，修士食之则能压住体内虫气。青木谷用它作解蛊汤的药引，蛊医则用它封蛊瓮的瓮口——蜜一裹，虫就不出，也不死。采蜜是极凶险的营生，须在林雾未散时攀上三十丈的断头树，摇下蜜巢便跑；被蜂追上的人，尸身三日内会被蜜泡成一团琥珀。","引":"「甜的东西，往往堵得住祸。」——采蜜人遗训","名":"百草蜜","卷":5},{"类":"异兽","文":"南疆最要紧的一种蛊虫，长约三寸，通体乌黑，背上有三道金线，故名。此虫不咬人，只吃血，吃过的血会在腹中炼成一线金浆，蛊师取浆炼蛊，事半功倍，故有「一线金换一斗灵石」之说。金线蛊极难养：须养在活物身上，不能养在瓮里；十日不进食则互相吞食，最后只剩一只，那一只背上会有第四道线。四线者已成气候，寻常蛊师不敢再碰。","引":"「三线可养，四线当杀。」——养蛊人的分野","名":"金线蛊虫","卷":2},{"类":"异兽","文":"生于尸骨堆积之处，全株漆黑，花冠大如斗口，香气浓得发腐，故名尸香。此花以蝇为媒，以腐肉为土，花开时方圆十丈内的虫蚁自行爬进花冠，被消化成一层黏液。南疆人说它「会叫人」——不是叫虫，是叫那些心里有旧念的人；人在林里闻到那股甜腐香，往往想起某个死去的名字，然后不由自主地循香走去。走到花下，花便合了。","引":"「闻见熟人的味道，就快停下。」——蛊医戒烟语","名":"尸香魔芋","卷":2},{"类":"异兽","文":"一种蔓生的藤，藤上有细足千对，会走不会爬。千足藤昼伏夜行，白日装作枯藤垂在树上，夜里整条藤从树上「走」下来，绕住睡着的兽或人，足上细刺注入麻液，被缠者毫无知觉。藤缠满三匝便开始吸髓，七日之后只剩一张皮挂在树上。青木谷以它入药——藤的麻液是上好的镇痛之资；采藤人须趁正午阳光最烈时动手，那时藤足尽缩，藤身如同一根真枯枝。","引":"「日头正热时才能碰藤，夜里它比你醒得早。」——采藤旧训","名":"千足藤","卷":1},{"类":"异兽","文":"毒瘴沼泽里最大的水蛭，长逾二尺，通体紫黑，口器如三瓣铜钩。此物不吸血，吸的是「活气」——贴上人身便不动，一刻钟内能把人看得见的血吸成看不见的灰。血蛭王独居，一沼只容一只，争斗极凶，败者被吸成一张薄皮浮在泥面。猎户说辨它不难：沼面上若有一片水面终年不起波纹，那底下就是它，因为它连水都不敢动。","引":"「沼里有静处，就是死处。」——瘴林猎户语","名":"血蛭王","卷":2},{"类":"秘闻","文":"万蛊门中流传的一种禁法：瓮中不放蛊，只放一层极薄的卵壳与腐叶，封三年。三年后开瓮，若瓮中有声，便是成了——那声音不是虫，是「空」，是瓮中养出的一团无所依附的念。空瓮蛊不咬人，只往人心里钻，钻进之后便替人补上他最想补的那一块：孝子听见亡母唤他，怨偶看见对方低头认错。补得越满，人空得越快。门中记载，开过空瓮的人，最后都是自己走进瓮里的。","引":"「最凶的蛊，从来不咬人。」——《南荒虫谱》残页","名":"空瓮养蛊","卷":1},{"类":"秘闻","文":"蛊道最恶的一着，非药非术，是把人做成蛊皿。取活人，先灌麻汤，再于四肢皮下割出数十条浅道，把幼虫一一埋入，缝好。此后这人便是一只行走的瓮：虫在血肉里长大、相斗、互食，剩下的那一只便是上品。做皿之人多半活不过三月，也很少有神智——但万蛊门中传着一桩旧事：曾有一只蛊皿养到第九个月仍能开口，他求人杀他，并说出了做他的人的名字。","引":"「我身上还养着，你们听。」——蛊皿遗言，录于祖庭石壁","名":"以身为蛊皿","卷":3},{"类":"风俗","文":"每逢雨季第三个满月，万蛊窟外的木鼓坪便开斗蛊会。坪上搭三座竹台，台上置斗蛊铜盘，鼓一响，各家蛊师把蛊笼往台上一放，从此各凭本事。斗蛊节不禁旁观，也不禁下注，甚至不禁死人——但有一条铁律：台上不许用本命蛊。用了的，全场蛊师会同时放手，让他自己的蛊先咬他。节末由祖庭巫祝唱一支收场的歌，唱完众人散去，无人回头看台上剩的虫。","引":"「节上有死，节后无仇。」——木鼓坪旧碑","名":"斗蛊节","卷":7},{"类":"风俗","文":"雨季之后菌毯生光，南疆各寨便在夜里入林行祭，称菌毯夜祭。祭时不点灯、不举火、不敲鼓，全凭菌毯青白之光认路。入林者每人捧一撮祖庭祭灰，走三步撒一撮，口中念自家三代以内的亡者名讳。撒到菌毯最亮处便跪下，把剩下的灰一把撒完，然后闭眼等——等什么，各寨说法不一。有人说等祖灵显形，有人说等听见亡者的脚步声。天亮前必须走出林子，走出来的人不许讲夜里看见了什么。","引":"「夜里的事夜里了，天亮只当没走过。」——黑苗寨俗谚","名":"菌毯夜祭","卷":6},{"类":"人物","文":"万蛊门中最不祥的一类人：主动弃了本命蛊，被逐出门墙，从此不许再养任何一只虫。弃蛊的人身上多半还留着散虫——虫没死，只是不再听他的话，夜里从皮肉里钻出来，天亮再钻回去。江湖上无人敢与他们同席，因为散虫会认最近的养蛊人。弃蛊人自己也明白这一点，所以走夜路必独行，落宿必选无人的破屋。南疆人说，遇弃蛊人不打不骂，给他一碗水，他便不记你的门。","引":"「弃得了虫，弃不了身上的门。」——万蛊门戒语","名":"弃蛊人","卷":7},{"类":"地理","文":"南疆最深的一潭水，水面终年不起波纹，水色黑得像墨。潭边白骨成堆，不全是人的，也有兽的，骨头都被啃得极干净，一根筋都不剩。猎户说这潭通着地下的暗河，暗河里游着不知年岁的东西；也有人说潭底是万蛊门早年弃蛊的地方，虫沉下去，年深日久，成了一团活的泥。潭边不能久留，站久了会觉得脚底发软——不是地在软，是脚下那层泥在数你的分量。","引":"「潭水不动，是因为下面满了。」——瘴林猎户","名":"白骨水潭","卷":3}],"事件":[{"题":"蛊瓮夜啼","类":"奇闻","重":3,"域":["nanjiang"],"境界":[0,5],"段":["夜里借宿在{地点}的棚屋，{人物}从床底拖出一只{器物}，说这是三年前从林里捡回来的，一直不敢开。瓮口的封泥干裂如枯皮，裂痕里嵌着半道血符，那是{天象}的那一夜，有人用指头蘸血画上去的。他用火折子照了照，瓮壁内侧似乎有东西在缓缓地动，可一凑近，又静得连风都听不见。","{人物}说这瓮沉得古怪，倒过来晃，里头没有虫撞壁的声响，只有一团沉闷的坠感，像塞着一块湿棉。他犹豫半晌，还是把封泥一点点剜开。瓮口透出一股陈腐的甜气，扑面而来，我掌心的旧疤忽然一麻——那是我自己养过虫的地方，早该死了的疤。","揭开牛皮的一瞬，瓮里没有虫，只有一层细白的卵壳铺在底部，薄得能看见瓮底的花纹。我指尖刚触到壳面，壳下便响起极细的振翅声，密得像一场落不完的雨。{人物}脸色瞬间白了，往后退了两步，说这是空瓮养出来的东西，瓮里养的不是虫，是一个空。"],"择":[{"名":"探瓮","文":"我伸手进去，卵壳在指下碎成粉，一股凉气顺着指骨上行，直窜到肩。当夜梦里，我看见一个背对着我的人坐在瓮里，慢慢回过头来，那张脸是我自己十岁时的模样。醒来后修为竟涨了一截，可照水时总觉得水里的影子比我慢半拍。","果":{"修为":90,"悟性":2,"魔念":2,"因果":1}},{"名":"封回","文":"我把牛皮重新蒙上，用随身带的引虫香灰和了水，把裂缝一道一道抹平，又请{人物}取来三枚铜钱压在瓮口。做完这些，掌心的麻意才退下去。当夜睡得极沉，天亮时{人物}说我在梦里笑，笑得很轻。他塞给我一小袋灵石，说多谢我肯把瓮封回去。","果":{"灵石":70,"道心":2,"寿元":2}},{"名":"焚瓮","文":"我把火折子点着，塞进瓮口。瓮里先是一声闷响，随即腾起青白的火，火里全是细碎的爆裂声，像千万只虫同时在烧。烧到天亮，瓮裂成三片，灰里只剩一枚指甲大的白壳。{人物}蹲在灰边看了许久，说这下它回不去了，往后夜里听见雨声，别应。","果":{"灵石":-20,"因果":-1,"道心":3,"魔念":-1}}],"id":"nanjiang_001"},{"题":"本命反噬","类":"灾祸","重":4,"域":["nanjiang"],"境界":[1,7],"段":["掌心那道旧疤又开始发烫，从子时烫到寅时，一夜比一夜重。那是{妖异}认主时留下的门，当年{人物}替我划开皮肉，把虫放进去，说此后生死与共。可这三日我唤它，它不应；我以血喂它，它不动。疤下的皮肉却一日日鼓起来，按下去能摸到一条细长的硬物在里头缓缓翻身。","今夜的{天象}来得比往常更重，林子里虫声齐齐断了。我盘坐在{地点}的断木上，依着《本命同生咒》里记的次第催血，血行到掌心，那条硬物忽然掉头，逆着血脉往上钻，钻到腕上便停住，像在试我的骨头有多硬。我咬破舌尖，硬把那口血咽回去，才把它逼回掌心，一双手抖得连衣带都系不上。","天亮时{人物}从林里过来，看了一眼我的手，说这是蛊要换主了——它嫌我的血薄了。他说反噬一旦起了头，就只有三条路：剖开手掌把它取出来，从此断一截心脉；或者拿更厚的血喂它，把它的胃口再撑大些；再不然，去{地点}求青木谷的人，用引虫香慢慢诱出来，只是那要熬上几个月。"],"择":[{"名":"剖掌取蛊","文":"我让{人物}按住我的腕，一刀划开掌心，血涌出来的那一刻，一条三寸长的东西顺着血窜到碗里，落地便蜷成一团。取出来了，可整条右臂从此凉得像浸在井里，握剑时总有半寸够不着。{人物}替我把伤口缝好，说这条路最疼，也最干净。","果":{"气血":-30,"修为":-80,"道心":4,"寿元":5}},{"名":"以血续喂","文":"我割开手腕，把血一寸寸喂下去，喂到第四碗，掌心那道疤终于安分了，软软地伏着，像吃饱的兽。当夜我梦游似的走进林子，杀了三只野兽，把它们的血全灌进掌心。醒来时浑身是自己的血腥味，修为涨得飞快，可镜里的眼睛已经不太像人的眼睛了。","果":{"气血":-20,"修为":260,"魔念":3,"因果":2,"道心":-2}},{"名":"青木求医","文":"我背着半袋灵石，一路走到{地点}，在药圃外跪了半日。{人物}把我扶进去，只问一句：这蛊是别人下的，还是你自己养的。我答自己养的，他便收了双倍药资，用引虫香一日引一只，慢慢往外诱。三个月后掌心空了，人也瘦得脱了形，可夜里终于能睡整觉。","果":{"灵石":-150,"气血":-10,"修为":-40,"道心":3,"寿元":3}}],"id":"nanjiang_002"},{"题":"木鼓坪斗蛊","类":"争斗","重":4,"域":["nanjiang"],"境界":[0,6],"段":["{天象}，木鼓坪上三座竹台已经搭好，鼓声一起，各家蛊师把蛊笼往台上一放，谁也不再多话。{人物}把我推到台前，说替我押了三十块灵石，输了要还。对面是个瘦得像竹节的中年人，腕上挂着一只{器物}，揭开时里头黑压压一片，虫挤着虫，挤得笼壁发响。","铜盘摆在台中，盘心那道刻线在火光下发白。中年人先手，指尖一弹，三只虫窜过中线，直扑我这边。我放出去的两只还没过线便被咬断了尾，翻在盘沿抽搐。台下一片哄笑。我方知他养的不是斗蛊，是「合蛊」——九格养一虫，那一只吃掉了另外八格，早不是寻常货色。","{人物}在台后低声说，还有半步，退半步让盘，把蛊收回来。可我看见中年人袖口里还藏着第三只笼，笼口虚掩，虫已经探出半个头。这一场若按规矩打下去，我必输；若不按规矩打，台下几十双眼睛都盯着，谁坏了铁律，全场的人会一起放手，让他自己的蛊先咬他。"],"择":[{"名":"认输养血","文":"我收蛊退步，按规矩割开腕子让他的蛊吃饱。血走了小半碗，人被抽得眼前发黑，站都站不住。{人物}把我扶下台，说输得干净，往后还有人敢跟我上盘。输掉的灵石他替我垫了一半，说剩下的慢慢还，别拿命抵。","果":{"气血":-25,"灵石":-30,"声望":4,"道心":2}},{"名":"使诈","文":"我把引虫香的粉末偷偷撒在盘底，香一热，他的合蛊忽然掉头咬自家主人，一口咬穿了腕子。台上乱成一团，我趁势收了盘，押注赢得干干净净。可台下没一个人道贺，都拿那种看死人的眼神看我。{人物}当天就走了，临走只说一句：木鼓坪的账，记三年。","果":{"灵石":320,"声望":-8,"因果":3,"魔念":2}},{"名":"以命相搏","文":"我把掌心那道疤割开，放出了自己的本命蛊。铁律破了，台下几十人同时撒手，放出的虫齐齐扑向我的掌心——可我的蛊先一步咬断了对方的合蛊。赢了这场，赢不回名声；我背着那人惊惧的目光走出木鼓坪，一路听见有人在背后念我的名字，念了三遍。","果":{"修为":180,"气血":-30,"声望":-5,"因果":4,"魔念":2}}],"id":"nanjiang_003"},{"题":"青木解蛊","类":"人情","重":4,"域":["nanjiang"],"境界":[0,7],"段":["{地点}的药圃里，{人物}正替一个人解蛊。那人趴在一块青石上，脊背割开七道浅口，每道口子里都探出半截白生生的虫尾，被竹片一根根挑出来，丢进旁边的汤盏。盏里是解蛊汤，虫一落进去便蜷成一点，慢慢化开。药圃四周插着引虫香，甜腻的烟气绕着人不散。","我蹲在一旁看，才知这人不是寻常中蛊——他是万蛊门送来的蛊皿，身上养着的是别人要的东西。{人物}一边挑虫一边说，这种蛊最难解，因为虫在血肉里已经做了窝，硬挑会把人的经络一并带出来。他挑了半个时辰，额上的汗滴在青石上，很快被虫血染红了一小片。","挑到第七道口子，那人忽然睁眼，喉咙里发出不属于他的声音，说了三个字：别挑了。{人物}手一停，抬头看我。药圃外的林子里传来细碎的爬动声，越来越多的虫正往这边聚。祖庭的骨铃在远处响了一声——不是我们摇的，是有人在唤虫。"],"择":[{"名":"交蛊作押","文":"我按青木谷的规矩，把自己养的那只蛊交出去作押，请他们先把人医完再说旁的。{人物}愣了一下，随即点头，收了蛊继续挑虫。虫群聚到药圃边缘便停住，像被什么挡住。医完时天已大亮，那人能开口说话了，他把蛊还给我，说这蛊养得不错，别糟蹋了。","果":{"器物":1,"声望":6,"道心":3,"灵石":-40}},{"名":"放火驱虫","文":"我点了火把绕着药圃烧了一圈，虫群被火逼退，可火也烧了半圃药苗。{人物}没有骂我，只是蹲在被烧焦的药苗边看了很久，说这些苗养了三年，救过六个人。他把蛊皿的伤口匆匆缝好，让我带着人走，从此药圃不再接我的单。","果":{"因果":2,"声望":-4,"道心":-1,"灵石":-60}},{"名":"循声追敌","文":"我循着骨铃的方向追进林子，追到{地点}，看见一个披银线法衣的祭司正摇铃聚虫。他见我便笑，说这蛊皿是门中的货，谁动谁担。我与他斗了半夜，虫群噬得我遍体血口，最后他退走了，我把骨铃抢下来。回药圃时人已救活，{人物}只说我带的这只铃，最好埋在土里。","果":{"气血":-35,"器物":1,"修为":120,"因果":2,"声望":3}}],"id":"nanjiang_004"},{"题":"祖灵谷口","类":"宗门","重":3,"域":["nanjiang"],"境界":[1,8],"段":["受人所托，要把一封信送到{地点}。谷口两崖夹着一线天，白雾终年不散，雾里立着一块青石，石面上满是干涸的血痕，一层压一层。{人物}守在石边，不说话，只递来一柄短刀，刀锋上沾着上一个人的血，还没干。他说：割指，滴血，血入石不散者方可入谷。","我依言割破指腹，把血滴在石上。血珠子在石面停了片刻，竟慢慢渗进去，石面浮出一线暗红，随即隐没。{人物}点头，{天象}，雾却忽然退开一条路。他领我走进去，一边走一边说：谷里不要高声，不要念别人的名字，也不要回头看雾。这三条犯了任意一条，井里的东西会自己爬出来。","走到谷心，我看见那口无底井，井沿上摆着一排小陶罐，每个罐里插着一根干枯的手指。{人物}说那是历代巫祝归谷时留下的，一个人一根。我把信递过去，他接信时忽然问：你身上有别人的蛊印，是谁给你盖的？我说不知道。他笑了笑，把信收进袖里，说进谷容易，出谷要看祖灵记不记你的账。"],"择":[{"名":"坦然受印","文":"我伸手让他看掌心。{人物}取来一撮祭灰，掺了我的血，在掌心那道印上抹了一圈，说这印是万蛊门的追债印，盖了三年，再不抹会烂到骨。祭灰入肉的疼像火烧，可印真的淡了。他没收灵石，只让我把这首巫歌记住，往后遇见摇铃的人，先唱这一句。","果":{"因果":-2,"寿元":3,"悟性":2,"声望":3}},{"名":"遮印出谷","文":"我把手掌藏进袖里，装作没听见，匆匆告辞。出谷时雾一直跟着我，走到崖口才发现袖子里全是细白的虫卵。我一路抖，抖到{地点}还剩小半。此后每夜子时，掌心那道印便发烫一次，像有人在远处记账，一笔一笔点着我的名字。","果":{"因果":3,"气血":-15,"寿元":-3,"魔念":1}},{"名":"留谷听歌","文":"我没有走，跪在井边听他唱了一夜巫歌。歌声沉得压着地，唱到第三折，井里浮出一个模糊的影子，那影子的轮廓与我极像。{人物}说这是祖灵在认人，认下了便是半个祖庭的人。天亮时我的嗓子里多了一种很奇怪的回响，开口说话，林间的虫会静下来听。","果":{"悟性":4,"修为":60,"声望":5,"因果":1,"寿元":-2}}],"id":"nanjiang_005"},{"题":"尸香引路","类":"灾祸","重":3,"域":["nanjiang"],"境界":[0,6],"段":["穿过{地点}时，风里飘来一股甜腐的香气，浓得像化开的蜜，底下却压着尸骨的腥。同行的{人物}忽然停住脚，说这不是花，是{妖异}在叫人。我还没答话，他已经往前走了，走得很稳，一步一步，嘴里低声念着一个女子的名字，念得又轻又熟。","我拽他袖子，他甩开；我喊他，他像听不见。{天象}，林子暗得只剩树影，他走在前面，绕过一株又一株长满苔的树，最后停在坡下。坡上一朵黑得发亮的花冠正缓缓张开，花心里的黏液泛着光，十几只蝇在花上打转，落下去便不见了。他抬手要去摸那花瓣。","这时我才看清，花冠根部的腐叶间散着几件旧物：一只断了的木簪，一块褪色的布，还有半截指骨。那指骨上套着一枚极细的银环——与{人物}左手无名指上那枚是一对。他还在往前走，花冠已经张开到能容下一个人。"],"择":[{"名":"强拖回来","文":"我一掌拍在他后颈，把他整个人扛起来往回拖。他挣扎得很凶，指甲在我胳膊上抓出五道血痕，一边挣一边喊那女子的名字，喊到嗓子破了音。拖出半里地他才软下来，醒来后什么也不记得，只是从此再不肯走{地点}这条路。他后来把那枚银环摘了，埋在林边。","果":{"气血":-15,"因果":1,"道心":2,"声望":2}},{"名":"割臂醒神","文":"我割开自己的手臂，把血抹在他鼻下。血腥压过甜香，他猛地一呛，眼神回来了，可那朵花冠也同时合了，把花心里的东西吞了进去。他跪在坡下哭了半夜，说那里面是他死在这里的妻子。天亮时他挖开腐叶，只挖出半截指骨，揣进怀里带走。","果":{"气血":-20,"因果":2,"悟性":1,"道心":2}},{"名":"循香探花","文":"我让他留在原地，自己循香上坡，用蛊针挑开那层黏液，把花冠连根挖了。根下是一具蜷着的骸骨，骨上还挂着布片。我把骸骨收进麻袋背回去，{人物}见了跪下来磕头，磕得额头见血。而我的掌心从此多了一股散不去的甜气，夜里总有花开的声响。","果":{"灵材":1,"因果":3,"魔念":1,"修为":80,"声望":4}}],"id":"nanjiang_006"},{"题":"血饲初课","类":"修行","重":3,"域":["nanjiang"],"境界":[0,7],"段":["{天象}，{人物}在{地点}的老树下替我上了第一课。他不用书，也不用图，只把一只拇指大的虫放在我掌心，说：从今日起，你割腕喂它，一日一次，喂足九日，它便认你。虫在他掌心里一动不动，像一粒会呼吸的黑豆。他叮嘱我，血不能隔夜，喂的时候心要静，心一乱，血里就带了杂气。","我依言割腕，第一日它不喝；第二日它动了动；第三日它开始吸，吸得很慢，腕上的口子要一直敞着，血顺着掌纹流进虫口。到第五日，我头晕眼花，站着都觉得脚下的地在斜。{人物}只在一旁看着，说这是《血饲蛊经》的头一关，熬过去，虫就是你的第二条命；熬不过去，虫就换个人认。","第九日清晨，虫忽然爬上我的腕，钻进那道还没合的口子里。一阵刺骨的凉从腕上直冲到心口，我几乎叫出声。{人物}按住我，说别动，认主只有这一刻，它在你血里认路，走错了便一辈子出不来。我咬着牙撑住，可就在它快要伏定的当口，林子深处传来一声摇铃，那只虫忽然在我腕里挣扎起来。"],"择":[{"名":"以己血镇","文":"我把舌尖咬破，一口血咽下去，硬压着腕里的乱。虫在血脉里转了半夜，终于伏住，认了这道主。此后我唤它，它便应，只是每唤一次，腕上的疤就会淡一分——{人物}说那是它在替我耗寿。我摸了摸越来越白的腕子，没再说话。","果":{"寿元":-6,"修为":200,"悟性":2,"道心":2}},{"名":"顺铃而出","文":"我没有压，任由它循着铃声走。虫从腕里退出来，落在地上，爬向林深处去了。{人物}看了我很久，最后说：你不肯喂它，倒也干净。他把剩下半卷《血饲蛊经》收回袖里，说这一课算我没学会。腕上的口子结了疤，凉了三年。","果":{"道心":3,"修为":-30,"因果":-1,"寿元":3}},{"名":"换血强留","文":"我抓起{人物}的刀，割开自己的掌，又抓过一只活野物，把它的血一并灌进腕口。虫被两股血冲得乱撞，最后硬生生伏了下来。它认了我，但认得不情不愿——往后的日子里，它总在月圆之夜咬我一口，像在提醒我，它的命不是白给的。","果":{"修为":240,"气血":-25,"魔念":2,"因果":2}}],"id":"nanjiang_007"},{"题":"渡口蛊笼","类":"市井","重":3,"域":["nanjiang"],"境界":[0,5],"段":["{地点}的渡口没有正经集市，只有几艘乌篷船靠岸，{人物}蹲在跳板上，把笼子一只只揭开叫卖。笼里分三等：下等肉蛊黑压压一片，论斤称；中等器蛊单只关着，笼上挂一枚小木牌，写着能驱什么虫；上等货他不摆出来，只把笼子揣在怀里，凑到识货的人耳边低声报价。","我凑近看时，他掀开一角让我瞧。笼里是一只{妖异}，虫身蜷着，背上有三道金线，是极好的种。可我一眼看见笼扣上挂着一枚{器物}——那是万蛊门养蛊人的东西，牌上刻的字被人用刀刮过，刮痕很新。虫是好虫，牌是死人的牌。","他见我盯着玉牌，笑了一下，说这行当不问货从哪来，只问买不买。他说这虫他不敢久留，三日之内不脱手，就得自己吞下去——他腕子上已经有两道旧疤，是上两次吞蛊留下的。{天象}，河面上雾起了半尺，他把笼子往我面前又推了推，说价钱可以商量，灵石、活物、消息，都收。"],"择":[{"名":"买下此蛊","文":"我付了六十块灵石，把笼子接过来。他收了钱，顺手把那枚玉牌也塞给我，说牌上的名字他早就忘了。回程路上，虫在笼里一直很安静，直到我把它放进自己的蛊瓮，它才第一次发出声音——那声音不像虫，像有个很累的人在瓮底叹了口气。","果":{"灵石":-60,"修为":140,"因果":1,"器物":1}},{"名":"揭他旧账","文":"我把玉牌拍在跳板上，问他这是从哪具尸身上剖的。他脸色一变，围过来的船家也都停了手。渡口有渡口的规矩：货可以是死的，人不能是死的。众人逼他退了这一笼，还要他当场把腕上那两道旧疤剖开给众人看。他照做了，血滴在跳板上，一句话没再说。","果":{"声望":6,"因果":-1,"道心":3,"灵石":30}},{"名":"替他说项","文":"我按住众人的手，说货我全要了，价钱照给，让他把笼子里剩下的虫一只只倒进河里。他照做，倒得很慢，倒完低头谢我。船家散了，他却拉住我袖子，从怀里摸出一块油布，说这是剖蛊时从虫腹里取出来的东西，不值钱，算个谢。油布里是一片薄如蝉翼的虫翅。","果":{"灵石":-40,"声望":3,"器物":1,"因果":1,"悟性":1}}],"id":"nanjiang_008"},{"题":"无人寨夜歌","类":"奇闻","重":2,"域":["nanjiang"],"境界":[1,7],"段":["雨下了三日，我在{地点}外撞见一座寨子，寨门开着，屋舍齐整，灶上还有余温，却一个人也没有。每家的门槛上都摆着一碗清水，水上浮着一片叶。{人物}后来告诉我，那是黑苗九寨的规矩：人走了，水留着，等蛊回来喝。这寨子空了至少三年，因为碗里的叶已经烂透了。","第一夜，林子里起了歌。歌声从四面八方来，女人的嗓子，一句一顿，唱的是什么听不懂，可每一句落下去，寨中的屋梁都会轻轻震一下。我躲在屋里，背上起了一层细密的凉，忽然明白这歌不是唱给我听的——它是在点名。歌里唱到一个字，屋里某处便响一声，像有人在应。","{天象}，第二夜歌又起，这次近了，已经唱到寨门。我数着，每一句里都有一个名字，唱过名字的门槛上，那碗水便少一分。我这间屋的门槛上也有一碗。第三夜还没到，碗里的水已经只剩半指。窗外，一个披着长发的影子正慢慢走过，脚上没有声音。"],"择":[{"名":"跟着唱","文":"我咬着牙跟了一句，声音一出口，歌便停了。四下静得可怕，屋檐上开始落虫，落得密密层层，落在我肩上、颈上、手背上，却都不咬。天亮时歌没有再起，碗里的水满了回来。我出寨时，身后的屋梁齐齐震了一下——像有一寨子的人，在送我。","果":{"悟性":4,"修为":100,"因果":2,"声望":2}},{"名":"堵耳硬熬","文":"我撕了布条塞住耳朵，闭眼坐到天亮。可歌不是从耳朵进来的，是从后颈的骨头里进来的。第三夜我听见自己在唱，唱得很准，一个字都没错。等歌散时，我发现自己站在寨门口，脚下的泥里有一串我的脚印，绕着寨子走了整整一圈。从此每逢雨夜，我都会梦见那碗水。","果":{"气血":-20,"道心":-1,"悟性":2,"魔念":1}},{"名":"泼水破祭","文":"我把门槛上那碗水泼在院子里，碗底朝天扣下。歌当场断了，可断得极难听，像有人被掐住了喉咙。屋子里的虫从梁上成片落下，落成一层黑。我在黑里站了很久，直到天亮。寨子从此再没有歌声，也没有虫声。而我背上多了三粒极小的白点，洗不掉。","果":{"因果":3,"魔念":2,"修为":60,"道心":-2}}],"id":"nanjiang_009"},{"题":"祖灵显形","类":"天象","重":2,"域":["nanjiang"],"境界":[2,9],"段":["{天象}，{地点}的菌毯亮得刺眼，青白的光从脚下一直铺到林边，像有一层水漫在地上。我本是循着一头受伤的妖兽来的，追到光海中央，妖兽不见了，脚下只剩一层层温热的光。四周极静，静到能听见菌丝在土里生长的细响。","然后光动了。光海上立起一个影子，高约三丈，人身而兽首，通体由无数细小的光点组成，那些光点在不断地散开又聚回。它没有脸，可我知道它在看我。我的膝盖先软了，那不是威压，是一种极古老的、被人从骨头里认出来的东西——《祖灵祭歌》里唱的第一折，说的就是这个。","影子抬起手，指向我腰上的{器物}，又指向林外的方向。它没有声音，可我脑中有个字落了下来，重重砸在识海里。与此同时，我感觉到身上某个地方在发烫——那是巫祝在我手上留下的印，此刻正一点点化开。它要我做一件事，我知道，可我还不明白是什么。"],"择":[{"名":"跪而受命","文":"我伏在光海里，把额头贴下去。光从额头渗进识海，我看见一寨子的人被虫啃成骨头，看见一个摇着骨铃的人站在火光里——画面碎得很凶，可那个人的脸我记住了。醒来时日头已高，我掌心多了一片青白的鳞。此后我说的话，林中的鸟兽会伏下来听。","果":{"悟性":5,"声望":8,"修为":200,"因果":2,"寿元":-3}},{"名":"割血相问","文":"我割开手掌，把血洒在光上。光点一沾血便剧烈地翻涌，影子低下来，凑到离我一尺的地方。那一刻我听清了，是一句极慢的话：谷里的账，总有人来还。说完它散了，光海褪成普通的菌毯，我的血渗在土里，菌毯从此再没长过那一小块。","果":{"气血":-25,"悟性":3,"因果":3,"修为":150,"道心":2}},{"名":"举剑相向","文":"我拔剑斩向那道影子。剑锋穿过光点，什么也没斩到，可我的虎口当场裂开。影子散了一次，立刻又聚起来，比先前更亮。它没有再指什么，只是慢慢转过来，用那张没有脸的脸对着我，站了很久，直到光一点点退去。我的剑从此每日夜里都会在鞘中轻响，像有什么东西没走。","果":{"气血":-35,"修为":260,"魔念":3,"因果":4,"声望":-3}}],"id":"nanjiang_010"},{"题":"以身为皿","类":"宗门","重":3,"域":["nanjiang"],"境界":[2,10],"段":["{人物}领我下到{地点}第三层，石壁上的虫已经厚到看不出纹路。他停在一间石室前，室中摆着一口巨大的{器物}，瓮壁内侧钉满了细铜环，环上连着一根根空心的线。他说门中有意抬我，给我一个机会：做一只皿，替门里养一窝合蛊，养成了，我从此便是内门的人。","我问他做皿要养多久。他说九个月，九个月后虫成熟，剖肉取出，人若还活着，门里再给一副灵药。他又说这不是逼我——做皿的人门里排着队，多半是自愿的，因为成了皿，门中管饭、管药、管护法。他指着瓮底一层暗褐色的垢，说上一个皿在这儿养了七个月，最后自己咬断了腕子。","石室里那股味道让我想起{天象}。我伸手摸瓮壁上的铜环，环是温的。{人物}把一只小陶瓶递到我面前，瓶里是麻汤，喝了便不觉得疼。他说：想清楚，这等机缘外人求都求不来。可我在他袖口看见一枚极小的骨牌，牌上的名字不是我的——那口瓮，原本是给另一个人留的。"],"择":[{"名":"受皿入瓮","文":"我喝了麻汤，躺进瓮里。铜环扣上四肢，虫一线线埋进来，起初只是痒，后来是整条筋骨在被人从里往外拆。九个月后我活着出来了，修为暴涨，掌上能同时驱使百虫，可体重轻了一半，冬天总觉得骨头在响。门中果然抬我为内门执事。","果":{"修为":420,"气血":-40,"魔念":2,"声望":10,"寿元":-8}},{"名":"以木芯相抵","文":"我从怀里取出{灵材}，捏碎在瓮口。木芯的粉一撒，满室虫声骤停，瓮壁上那些铜环竟一根根裂开。{人物}脸都青了。我说这窝虫既已认了木芯，就别再拿人当窝。他退了两步，终究没敢拦。我走出石室时，身后的瓮里开始有东西自己相咬。","果":{"灵材":-1,"修为":180,"因果":2,"声望":6,"道心":3}},{"名":"掀瓮出走","文":"我一脚踹翻铜环，把瓮推倒。瓮里没有虫，只有一层湿泥和几件旧衣。{人物}没有追，只在背后冷冷说了一句：出了这道石室，你就是门里的账。我背着那只刻着别人名字的骨牌爬出万蛊窟，一路听见窟里的虫在跟着我走，一直跟到洞口才停。","果":{"因果":4,"声望":-6,"修为":60,"器物":1,"寿元":-2}}],"id":"nanjiang_011"},{"题":"断头树下","类":"机缘","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}那棵断头树据说被雷劈过，树冠没了，只剩半截焦黑的干，树皮里嵌着无数细白的卵。树根处的土翻得很新，像被什么刨过。我蹲下扒了两把，指头碰到硬物，是骨头。再往下，是一具盘坐的骸骨，脊背靠着树根，手里还攥着一卷东西。","骸骨的胸骨是被从里面撑裂的，裂口边缘有一圈细齿痕——这人不是被杀的，是养的东西从他胸腔里长了出来。他手心里那卷东西用油布裹了三层，剥开是半卷经，纸已发脆，字是朱砂写的，题目只剩三个字：血饲蛊。剩下的被人撕了。","{天象}，风把树上的卵吹得簌簌落下来，落在骸骨上，竟一个个裂开，爬出细如发丝的幼虫，齐齐朝那卷经爬。我把经卷往怀里一塞，虫子便都停住，抬头对着我。那一刻我明白，这经不是捡来的，是这人临死前留给下一个人的——只是他也没想到，虫比人来得早。"],"择":[{"名":"受经而去","文":"我抱着经卷退出断头树的范围，虫子没有追。回住处就着油灯看，半卷经写的是以血饲蛊、以蛊换命的法子，笔迹到后面越来越抖，最后一行的字几乎连不成句：莫养第二只。我依着这半卷经练了三个月，修为长得飞快，可每到深夜，胸口总会隐隐作痛。","果":{"修为":220,"悟性":3,"魔念":2,"寿元":-4}},{"名":"厚葬此人","文":"我把经卷放回他手里，用蛊针挑开周围的土，一点点把他埋进树根下，又搬了三块石头压住。做完这些，树上的卵全数干瘪落地，像一场小雪。当夜我梦见一个枯瘦的人对我拱手，什么也没说。醒来后掌心那道疤平了，胸口却多了一点温热的东西，像有人在里头替我撑着。","果":{"道心":5,"因果":-2,"寿元":5,"悟性":1}},{"名":"招魂问经","文":"我按祖庭的规矩摆了三碗水，割指点血，念了半段招魂辞。骸骨的指节动了一下，一个极哑的声音从树根里透出来，只说了两句：经是钩子，虫是饵。我追问下文，卵壳忽然同时爆开，虫群扑上来咬穿了我的手背。我逃出半里地才甩脱，经卷已在乱中丢了大半。","果":{"气血":-25,"悟性":2,"修为":120,"因果":2,"魔念":1}}],"id":"nanjiang_012"},{"题":"瘴中七日","类":"灾祸","重":4,"域":["nanjiang"],"境界":[0,6],"段":["追一只{妖异}进了{地点}深处，回头时路已经没了。瘴气贴着地面涌，白里透青，形如垂练，走得比人快。我用湿布蒙住口鼻，只撑了半日，布上便析出一层白霜。{人物}说过，瘴气不杀人，它只是让人忘了往哪走——真正杀人的是走错的那一步。","第三日，我认出了同一棵被雷劈开的树，第三次。干粮吃尽，水囊见底，齿根开始渗血。第五日，我在沼泽边看见一处清水，水色极清，清得不像这林子该有的东西——边上还躺着一头鹿，鹿的尸身完好，眼睛睁着。第六日，我听见有人在林里叫我的名字，一声比一声近。","{天象}，我靠在一截腐木上，掌心的蛊忽然自己动了一下，它从我腕上爬出来，停在泥面上，触须朝一个方向竖着。我这才想起{人物}教过的话：虫认地气，虫不走死路。可它指的方向要穿过那片瘴最浓的洼地，洼地上已经浮着三具兽骨。"],"择":[{"名":"随蛊而行","文":"我把蛊放回腕里，跟着它的触须走。它在泥上停停走走，绕过洼地，穿一片齐腰的蕨，最后停在一处石缝前。石缝里有风，是活风。我从缝里挤出去，走了半夜才见星光。自那以后，我这只蛊每逢大雨前都会自己爬出来，对着风口的方向立着。","果":{"修为":100,"悟性":3,"寿元":2,"气血":-15}},{"名":"饮那清水","文":"我扑到水边喝了个饱。水甘得像蜜，喝下去浑身发暖，力气也回来了。我拖着身子走了两日出了林子，才发现自己背上多了一圈青色的环。{人物}一看便叫我坐下，说那不是水，是瘴凝出来的假水，喝一口，瘴就在血里扎了根。他用解蛊汤替我压了三个月才压住。","果":{"气血":-30,"灵石":-80,"寿元":-4,"修为":60}},{"名":"杀鹿取血","文":"我割开那头鹿的喉，接了一囊血，血是温的。够我撑出去了。第七日傍晚我摸到林缘，一头栽进{地点}的泥里。醒来时有人替我包了伤口，说我身上有股鹿腥味，问我在林里杀了什么。我说了，他默默把火堆挪远了些——那鹿是守林人的引路兽。","果":{"气血":20,"因果":3,"道心":-2,"修为":80,"声望":-3}}],"id":"nanjiang_013"},{"题":"解蛊汤方","类":"人情","重":3,"域":["nanjiang"],"境界":[0,7],"段":["{地点}的药童守着一口砂锅，锅里是解蛊汤，绿得发黑。他一边搅一边打瞌睡，我问他这汤的方子，他摇头说谷里不许外传，说了要挨打。可他嘴上说着，手上却把三味药一一点给我看：还魂草、百草蜜、涧底青石。他说最难找的不是后两味，是还魂草——只生在{地点}背阴的石缝里，一株要长十年。","我说我见过还魂草，而且知道一片。他眼睛一下亮了，可随即又暗下去，说就算有草，谷里也不允他私自配药。前些日子他替一个没钱的人抓了两副，被执事拿竹板打了二十下，竹板印子还在腿上。他把袖子拉起来给我看，青紫的痕确实很深。","{天象}，砂锅里的汤快要起沫，他忽然压低声音，说他知道我是要解蛊的人，也知道我身上有印。他说他可以把方子抄给我，只要我答应一件事——可他还没说完，药圃外的竹篱被人推开了，一个穿青布衣的执事站在那里，手里提着一盏灯，灯照在我们三个人身上。"],"择":[{"名":"以功法换","文":"我取出《草木为阵诀》的抄本，摊在药圃的石桌上。执事走过来看了一眼，忽然收起了那副凶相——原来青木谷缺的正是这卷。三人坐下谈了一夜，最后我拿半部口诀换了一副汤方与一把还魂草，药童没有被罚。走时他追出来，塞给我一小罐百草蜜，说配药时用得上。","果":{"悟性":3,"灵材":1,"声望":4,"道心":2}},{"名":"夜半偷方","文":"我趁执事转身的当口，把药渣撮了一把塞进袖里，转身便走。药童在后面喊了一声，没敢追。我回去照着药渣试配，配出一锅勉强能用的汤，只是少了还魂草那一味，汤性偏急，喝过之后总要吐一阵。三日后听说那药童被逐出药圃，我再也找不到他。","果":{"灵材":1,"因果":3,"道心":-2,"修为":40,"声望":-2}},{"名":"替他担责","文":"我上前一步，说这两副药是我逼他抓的。执事把灯凑到我脸上，看了很久，最后罚我替药圃采还魂草三十株。我在背阴石缝里爬了十来天，腿被石棱划得全是口子，却也因此认全了这片山的药。药童偷偷给我送饭，把方子一点一点说给我听。","果":{"气血":-20,"悟性":4,"灵材":1,"声望":3,"因果":-1}}],"id":"nanjiang_014"},{"题":"蛊瓮洞","类":"秘境","重":3,"域":["nanjiang"],"境界":[1,8],"段":["雨冲塌了一面坡，露出一个洞口，洞里堆着瓮，一层一层码到看不见顶。{人物}说这是蛊瓮洞，凡养蛊的人死绝了，寨子里就把他的瓮抬到这儿来，封上洞，任它烂。洞中不见天日，瓮上的封泥却都完好，说明里头的虫一只也没跑。地上有细细的爬痕，密密麻麻，从每只瓮下延伸出去，又绕回来。","我举着火折子往里走，脚下的瓮碰一下就响，闷闷的。走到第三层深，火光照见一只瓮裂了，裂口里探出半截金线的虫身，一动不动。我用{器物}的尖头碰了碰，虫身一缩，缩得极快，紧接着整只瓮内部响起一阵沙沙声，像有千百只脚在一起爬。","{天象}，洞外的雨忽然大了，水从洞口灌进来。这一灌，洞里所有瓮的封泥同时开始冒泡，从裂缝里渗出白色的浆。我听见背后有瓮盖被顶开的声响，一响接一响，从深到浅，像有人在洞里一层层往上敲门。火折子的光晃了一下，我看见洞里那些爬痕全部亮了起来——是虫，成片的虫，正沿着一路的旧痕往洞口涌。"],"择":[{"名":"开瓮取种","文":"我不退反进，挑了一只封泥最老的瓮，用蛊针撬开。瓮里只有一只虫，极大，通体暗金，伏在瓮底看着我。我把它收进虫笼，转身就往洞口跑，虫群从我脚边成片掠过，却没有咬我。出了洞我才明白：它们不是追我，是在送它。这只虫后来成了我养过最好的一只。","果":{"修为":180,"魔念":1,"灵材":1,"因果":2}},{"名":"放火烧洞","文":"我退到洞口，把火折子扔进油囊，连囊带火一起踢进去。火起来的时候，洞里像千万张纸在同时烧，白浆遇火炸开，溅得洞口一片焦黑。烧了半日，虫声才断。我在洞口坐到天黑，耳朵里一直是那种沙沙声。{人物}听说后只叹了一声，说这洞本该再封二十年。","果":{"因果":3,"道心":2,"魔念":-2,"声望":-2,"修为":40}},{"名":"封洞立碑","文":"我搬来石块，和着泥把裂开的瓮一只只堵上，再把洞口封死，用刀在石上刻了四个字：蛊归其瓮。刻到第三笔时，脚边的爬痕自己退了回去。做完这些，雨也停了。{人物}带人来看了，说这碑不必刻字，刻了字就有人来撬。他还是在碑脚埋了三枚铜钱，说算替我记一笔。","果":{"道心":4,"声望":5,"因果":-2,"灵石":20}}],"id":"nanjiang_015"},{"题":"祭坛执蛊","类":"宗门","重":2,"域":["nanjiang"],"境界":[2,9],"段":["雨季末的大祭，{地点}上插满火把，火一丝不摇。{人物}说今年的持祭缺一人，问我肯不肯。持祭不用刀，用蛊——把一只活蛊捧在掌心，走到坛心，让它在石瓮上自己爬一圈，爬满了，这一年的祭便算成。他说这话时，眼睛没有看我，看的是坛外那片黑影。","我接过那只蛊，虫在掌心里很沉，比寻常的沉得多。走近石瓮时，我才发觉坛心的石面是软的，踩下去会陷半寸，像踩在什么活着的东西上。坛周站着的巫祝们已经开始唱，唱的是《祖灵祭歌》的第四折——那一折从来不外传。歌声一起，掌心的虫忽然拼命往我腕上钻。","它钻到一半，停住了，像被什么拉住。我听见身后的火把同时一暗，又亮起来。{人物}的声音从很远的地方传来，说：它不肯爬，是因为坛上已经有东西在爬。我低头看那倒扣的石瓮，瓮面上慢慢浮出一圈湿痕，一圈，又一圈，像有无数细足在瓮里一同走过。"],"择":[{"名":"以血引蛊","文":"我割开掌心，让血顺着指缝滴在瓮面。虫闻到血，猛地窜出去，顺着石瓮爬了一圈，爬得极慢。爬完最后一寸时，它在我指下僵住，死了。坛周的歌声同时收了尾，火也稳了。{人物}过来收虫尸，说这一祭成了，祖庭记我一笔。我看见坛外的黑影往林里退去。","果":{"气血":-25,"声望":10,"因果":1,"修为":160,"寿元":-2}},{"名":"换己蛊上","文":"我把掌心的虫按死，从腕里唤出自己养的那只，放在瓮上。它爬得极顺，一圈下来不歇。可等它爬完，我腕上那道疤也裂了，血一直流到坛心。{人物}脸色变了，说本命蛊上坛，是要拿命抵一年的。此后我的蛊再不肯回瓮，只肯睡在我胸口。","果":{"修为":300,"气血":-35,"寿元":-8,"魔念":2,"声望":6}},{"名":"掀瓮破祭","文":"我一脚踹在石瓮上。瓮没动，坛心那片软石却裂开一道口子，黑水涌出来，臭得叫人睁不开眼。歌声全断了，巫祝们四散。{人物}冲过来拽我，一路把我拖出祭坛。当夜祖灵谷的方向升起一道青色烟柱，直到天亮才散。而我的名字，被从祖庭的名册上划了下来。","果":{"因果":4,"声望":-8,"道心":3,"修为":80,"魔念":2}}],"id":"nanjiang_016"},{"题":"蛊毒双修","类":"修行","重":3,"域":["nanjiang"],"境界":[1,7],"段":["{人物}在{地点}设了个小摊，摊上摆着十几个陶瓶，瓶里是各色毒液。他说蛊道有两条路：一条养虫，一条服毒。养虫的人要花十年喂一只虫，服毒的人只要敢喝，一日便能抵十日功。他掀开一只瓶塞，瓶里液色碧绿，闻着有一丝甜。他说这是《蛊毒双修录》里的第一味，喝了不死，就算入了门。","我问他喝死了多少人。他说十一个，尸体都埋在摊子后头，因为没人认领。他说得平淡，像在说今日卖了几瓶。旁边一个瘦得脱形的人伸手要去拿瓶，被他一巴掌打开，说你这身子喝了就是第十二个。那人缩回手，蹲在地上哭，哭得很小声。","{天象}，摊前的火把被风吹得歪了。{人物}把瓶子推到我面前，说我看你身上的蛊养得稳，血里能容毒，是块料。他又从怀里摸出一只小瓶，说这是解药，喝完毒再喝它，一进一出，修为能留下三成，其余七成算喂给自己身上的虫。他伸手按住瓶口，等我点头。"],"择":[{"名":"一饮而尽","文":"我仰头把碧绿的液体灌下去，喉咙像被砂纸从里往外磨，胃里烧成一团。我撑了半个时辰，毒气在经脉里来回冲，把那道旧伤也冲开了。毒退之后，修为果然涨了一大截，可我的血从此带了一丝甜味——林子里的虫开始往我身上落。","果":{"修为":320,"气血":-30,"魔念":2,"寿元":-5}},{"名":"讨解药先服","文":"我先要了解药，含在舌下，才敢饮毒。毒一入口便被解药压住，只留下薄薄一层在血里。虽然只得三成之功，可身子没伤着。{人物}看了我一眼，笑说这法子是他自己留的，从不告诉别人。他收了一半的价钱，又多送我一瓶，说留着日后急用。","果":{"修为":110,"悟性":3,"灵石":-60,"寿元":-1}},{"名":"夺瓶埋摊","文":"我一把夺过毒瓶，反手砸在他摊上，十几个瓶子碎成一地。毒液渗进土里，摊子后头的土当场鼓起三个包，像有东西要从下面出来。{人物}没有拦我，只蹲下去一个一个捡碎片，边捡边说：你不喝，自有人喝。我把他的解药扔给他，转身走了，身后那个瘦人正悄悄舔地上的毒。","果":{"道心":4,"因果":2,"声望":3,"魔念":-2,"修为":30}}],"id":"nanjiang_017"},{"题":"同门换血","类":"争斗","重":3,"域":["nanjiang"],"境界":[1,7],"段":["{地点}的宿处，我半夜醒来，腕上有一处新的针孔，血还没干透。我掀开被子，看见床脚落着一只极小的虫，已经死了，腹里有一点红。有人在我睡着时放虫进来，吸我的血，再带回给别人——这是万蛊门里最阴的一手，叫换血。被换了三个月的人，会在某一天忽然听别人的号令。","我去找{人物}，他捏着那只死虫看了半晌，说虫是养过的，腹里还有第二道血，说明那人已经换过不止一次。他问我最近得罪了谁，我想起同宿的{人物}，他这几日脸色好得反常，走路都带着股精神。{人物}点头说：血在他身上，虫在你身上，这时候揭他，他一死，虫便归你，你也要受反噬。","{天象}，我回到宿处，同宿那人已经坐在灯下等我，面前摆着两只碗。他说不瞒你了，血是我换的，可我也救过你——你在瘴里迷路那七日，是我放虫替你认的路。他把其中一只碗推过来，说：要么你现在杀我，虫归你，你背这道反噬；要么你喝这碗，咱们把血换回去，两清。"],"择":[{"名":"喝碗两清","文":"我端起碗一口喝干，血里有一股他的腥气，苦得舌根发麻。他也喝了另一碗。当夜两人都发起高热，我在榻上抖了半宿，天亮时身上的虫自己爬出来了，落在碗底，蜷成一团死灰。他替我倒了那碗水，从此我们各自搬开住，见面点点头，再没多说过一句。","果":{"气血":-25,"道心":3,"因果":-2,"寿元":3}},{"名":"下手杀之","文":"我一针扎进他颈侧，蛊针上的麻液让他连话都说不出来。他人一软，我身上那道虫便断了线，从他血里牵出来，被我一把攥住。虫归了我，修为凭空涨了一大截，可那夜我梦见他在灯下推碗的样子，梦了很多年。门中没人追问，因为换血本就是死罪。","果":{"修为":260,"魔念":3,"因果":4,"道心":-3,"器物":1}},{"名":"告到执事","文":"我把死虫与针孔一并呈给执事。门中审了三日，最后把同宿那人押到窟口，当着众人剖开腕子，把换来的血一滴一滴放回去。他放血时一直看着我，没有恨，只有一种很累的明白。执事说我做得对，赏了我一瓶药。可我从此在门里再没人肯与我同宿。","果":{"声望":5,"灵石":80,"因果":2,"道心":1}}],"id":"nanjiang_018"},{"题":"蛊印追债","类":"灾祸","重":4,"域":["nanjiang"],"境界":[1,8],"段":["掌心的印又烫起来了，这次烫得能看见皮下一圈暗红，像有虫在里头绕着走。三天后{人物}找上门，他是万蛊门的收债人，一身黑衣，腰间挂三只小笼。他说我欠门中一笔账：当年领的虫、吃的药、住的石室，一笔一笔都记着，折成灵石四百二十块。他说这话时没有威吓，只是把账念完。","我说我没有那么多灵石。他从袖中取出一只陶瓶，倒出一粒黑色的丸，说那便按门里的规矩办：吃下这颗债蛊，往后每替门中办一桩事，虫便吐一线，吐完了账清，虫自死。他又说这虫不会伤命，只是若我中途跑了，虫会循着血爬回来，从我眼睛里出来。","{天象}，他把丸递到我面前，手很稳。我摸到怀里那块{器物}，想起{地点}里还有一位巫祝曾说过，万蛊门的追债印在祖庭眼里算不得什么。可祖庭只认血，不认人；我若去求，得先舍一样东西。收债人还在等，林子里已经有细碎的爬动声在往这边聚。"],"择":[{"名":"吞下债蛊","文":"我把丸吞了下去。虫入喉时很凉，落到丹田便不再动。从那一日起，我替万蛊门跑了七桩差事：送过蛊、埋过人、在斗蛊场上替人挡过三刀。第七桩差事办完，虫在腹中吐尽最后一线，自己爬出来死了。我把虫尸收进瓶里，账清了，可我再没敢看过万蛊门的山门。","果":{"灵石":-420,"因果":3,"修为":150,"魔念":2,"寿元":-4}},{"名":"以蛊相斗","文":"我放开掌心的蛊，任它扑向那三只小笼。三笼同开，虫在半空咬成一团，咬得甲壳碎裂，浆水四溅。收债人退了一步，看着自己的虫被咬断，脸色终于变了。他的债账落在地上，被虫血泡烂。他说这笔账门中记着，转身走了。我蹲下去把烂账一片片收起来。","果":{"气血":-30,"因果":4,"声望":-4,"修为":200,"魔念":2}},{"名":"投祖庭抵债","文":"我扯了身上的衣带，连夜赶往{地点}。谷口那块青石上，我割指滴血，血入石不散。{人物}听了缘由，说祖庭可以替我抹这道印，但要我在谷中守墓三年，三年内不许出谷。我说好。三年后印真的没了，我出谷时掌心的皮很白，像从没被画过东西。","果":{"声望":6,"因果":-3,"寿元":-3,"道心":4,"修为":60}}],"id":"nanjiang_019"},{"题":"青木涧水","类":"机缘","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的水从林心涌出来，色如碧玉，捧在手里是凉的。{人物}说这水能缓瘴，喝一口顶三日，可也只顶三日——涧水治的是瘴，不是蛊。他蹲在涧边洗药，洗下来的泥水一流进涧里，水色便深一分。他说这条涧从青木谷建谷那年起就是这个样子，没人知道水底下是什么。","我学着捧水喝了一口，凉气顺着喉管往下走，走到胸口便散开，把这几日积的闷气一并冲淡。喝完再看水里，倒影很清楚，清楚得过了头——水里那张脸比我瘦，眼窝也更陷，像是我三日后的样子。我抬头看{人物}，他正低头洗药，像没看见。","{天象}，涧水忽然涨了半尺，水面浮起一层极细的白丝，顺着水流往谷里游。{人物}脸色一变，把药篓一收，说这是「水底翻」，谷里每逢此象，涧里的东西会上来换气。他说别碰水，也别站在水边——然后他看见我的鞋已经湿了，鞋帮上那圈白丝正慢慢往皮肉里钻。"],"择":[{"名":"刮丝上岸","文":"我拔出蛊针，把鞋帮连着白丝一起挑开，割掉一层皮。血一流出来，白丝便缩了回去。{人物}拉着我退到坡上，用解蛊汤浇在伤口上，浇了三盏才把那股往骨头里钻的意头压住。此后我脚跟留了一块疤，每逢阴雨便发凉，倒也能提早半日知道瘴要来了。","果":{"气血":-15,"悟性":2,"寿元":2,"道心":2}},{"名":"下水探源","文":"我脱了鞋，一步步走进涧里。水只到腰，底下却极深，脚下不是石，是密密麻麻的软物。我潜下去摸了一把，摸到一层厚厚的东西，像茧，会动。我没敢再摸，浮上来时天已全黑，{人物}在岸上叫我，叫得嗓子都哑了。我后来再没喝过涧水，但每次吞毒前都想到那层茧。","果":{"悟性":3,"魔念":1,"修为":140,"因果":2,"寿元":-2}},{"名":"装囊换药","文":"我灌了三只皮囊，背着走了。到{地点}的渡口，有人拿一株血灵芝来换，我换了。后来才知道这水在谷外是禁卖之物，被青木谷的人认出来，罚了我一笔。血灵芝倒是好东西，吃下去筋骨有力，可它长在尸骨上，吃了之后梦里总有人在敲瓮。","果":{"灵石":120,"灵材":1,"因果":2,"气血":10,"声望":-2}}],"id":"nanjiang_020"},{"题":"木僵夜行","类":"争斗","重":3,"域":["nanjiang"],"境界":[0,6],"段":["夜里穿过{地点}，脚下的腐叶忽然不再响了。回头看，身后的路已经被三具「树」挡住——不是树，是{妖异}，浑身长满苔藓与菌丝，关节处缠着千足藤，走起来一卡一卡地响。{人物}说过，木僵不是鬼，是被蛊虫蛀空了的人，虫在里头撑着骨架走。","我拔剑砍过去，剑锋陷进它的肩，像砍进一垛湿棉，只砍下几块腐木。它反手一抓，指甲带着菌丝划开我的袖子，皮肉立刻起了一圈青。第二具已经绕到侧面。我数着它们的步子：三响一动，动得极慢，可挡在退路上，且越聚越多，林子深处还有更多的「卡卡」声靠近。","{天象}，我忽然想起{人物}教的一句话：木僵是虫撑的，虫怕火，也怕更凶的虫。我怀里的{器物}还剩半匣蛊针，针上的麻液能让它迟一迟；我腕里的虫在发烫，它闻到了同类的味道，正急得乱撞。三条路摆在眼前，可我等不了太久，因为第一具木僵的脚已经抬起来了。"],"择":[{"名":"放蛊蛀木","文":"我把腕里的蛊放进木僵的肩洞。虫一进去，那具木僵先是一僵，随即从里面开始塌，苔藓一块块掉，掉到最后只剩一件烂衣与一地虫。另外两具同时停住，慢慢往后退。我的蛊出来时胖了一圈，回我腕里时重得像块石头，次日它三日不肯进食。","果":{"修为":180,"气血":-10,"魔念":1,"寿元":-2}},{"名":"点火焚林","文":"我把油囊点着，扔进腐叶堆。火一下烧起来，顺着千足藤直窜上树，三具木僵困在火里，卡卡地叫，叫得不像木头。天亮时这一片林子烧成了黑地，我也被烟熏得半瞎，跌跌撞撞走出去。后来听说那场火烧死了林中一半的兽，包括几窝还没睁眼的幼兽。","果":{"气血":-20,"因果":3,"道心":-2,"修为":60,"声望":-3}},{"名":"绕道让行","文":"我把蛊针全撒在脚下，趁它们迟滞的当口，从侧面的坡坎翻了过去。爬坡时一具木僵的手碰到了我的脚踝，冰得像铁，我没有挣，慢慢把脚抽出来。走了一夜才见村火。我回头看了看那片林，它们还站在那里，没有追，只是把路挡着——像是只不许人过去，不一定要杀人。","果":{"气血":-8,"道心":2,"悟性":2,"寿元":1}}],"id":"nanjiang_021"},{"题":"弃蛊之人","类":"人情","重":2,"域":["nanjiang"],"境界":[1,7],"段":["{地点}的雨夜里来了个人，披着蓑衣，站在檐下不肯进屋。{人物}说他姓什么已经没人记得了，只知道他曾是万蛊门的内门弟子，后来弃了本命蛊，被逐出门墙。江湖上的人见了他都绕着走，因为弃蛊的人身上，蛊多半还在，只是不再听他话了。","他隔着雨帘开口，说想借个火烤干衣裳，又问能不能在灶边坐一夜。他解开衣襟的时候，我才看见他胸口有一片暗紫色的斑，斑上密布着极细的孔，像被人从里面扎穿了。他说这是弃蛊之后留下的，虫没死，只是散了，夜里会从孔里爬出来，天亮再爬回去。","{天象}，屋外的雨一时大了。他伸手在火上烤，火苗居然缩了一下，像是被什么吸走。同屋的人开始往墙边挪。他看见了，把袖子拉下来遮住手，说不用为难，他在屋外的树下坐也可以。他说这句话的时候，胸口那片孔里有东西在慢慢地动，一动一动，像在数着什么。"],"择":[{"名":"留他过夜","文":"我把灶边的位置让给他，又添了两把柴。他坐了一夜，没再多说一句。天亮时他走了，走前把一件东西压在碗下——是半张蛊方，边缘被虫蛀得坑坑洼洼。同屋的人骂我不该留他，可那半张方子后来救了两个人。我把碗洗干净，留在原处，像欠了什么。","果":{"灵石":40,"悟性":2,"声望":-2,"道心":3,"灵材":1}},{"名":"请他解蛊","文":"我问他能不能把我的蛊也去了。他看了我很久，说去了蛊，人就不再是养蛊的人了，一辈子不能再养。我说无妨。他伸手按在我腕上，指尖凉得像水，按了约一顿饭的工夫。腕上那道疤从此平了，掌心却多了一个孔。他说这孔会一直在，提醒我离虫远些。","果":{"寿元":5,"修为":-120,"道心":4,"气血":-10,"因果":-2}},{"名":"逐他出门","文":"我按住门框，说这里不留弃蛊的人。他没有争，披上蓑衣走进雨里。走出十几步，他回头说：我若死了，虫会去找最近的一个养蛊的人。三个月后，我在{地点}听见消息，说林里发现一具尸首，胸口被蛀空了。同月，我腕上的蛊第一次在我没有唤它的时候动了。","果":{"因果":3,"魔念":1,"寿元":-3,"气血":-5}}],"id":"nanjiang_022"},{"题":"百花瘴谷","类":"秘境","重":2,"域":["nanjiang"],"境界":[1,8],"段":["{地点}的谷口开满了花，红的、白的、紫的，开得不像瘴气横生的地方。{人物}说这谷里的花都是毒花，一朵比一朵毒，可也一朵比一朵贵——谷外的药师按朵收，一朵能换十日口粮。他把湿布蒙上口鼻，说进谷只能待一个时辰，久了会眼花，眼花之后就会觉得那些花很好看。","谷中花下全是白骨，有的还套着采药人的藤甲。我蹲下看，发现每一具尸骨的手都伸向同一丛花——那是谷心的一片白花，花开得极小，密得像雪。{人物}说那是断肠花，最毒，也最值钱。他从怀里摸出一只瓷瓶，说采的时候不能用手，只能用瓶口去接落下的花蕊。","{天象}，谷里的花忽然一起转向，齐刷刷对着谷口。{人物}脸色一变，说这是「花认人」，谷中来了它们认得的活气。他一把拽我往石缝里躲，可我看见他另一只手正悄悄把瓷瓶往袖里塞——那瓶里已经装了大半瓶花蕊，是他进来的这半个时辰采的。石缝外，花丛在无风的情况下自己摇了起来。"],"择":[{"名":"分花同归","文":"我从他袖里抽出瓷瓶，说采了多少，咱们对半分。他愣了一下，随即笑了，从怀里又摸出一只瓶，倒了一半给我。两人贴着石壁退出去，退出谷口时花已经不摇了。回程路上他说，他在这谷里丢过两个同伴，都是为了一瓶花。这一次，他愿意分。","果":{"灵材":2,"灵石":80,"声望":3,"因果":-1}},{"名":"独吞深采","文":"我撇下他，独自往谷心去。断肠花的花蕊落在掌心，凉丝丝的，甜得叫人想笑。我采满了三只瓶，回头时已经找不到来路，谷里的花全在对我摇。等我清醒过来，天已黑了，我躺在白骨堆上，三只瓶空了一只。{人物}没等我，自己出谷了。","果":{"灵材":3,"因果":3,"气血":-25,"道心":-2,"悟性":1}},{"名":"带他同退","文":"我拽着他的领子往回走，走到一半他忽然软下去，蒙面的布松了。我扯下自己的布分他一半，两个人挤在一起吸那点湿气，一路挪到谷口。他没采到花，我也没采到，可两个人都活着出来。他坐在谷口喘了很久，说下回他请我喝酒。客栈里那顿酒，他喝了三碗。","果":{"道心":4,"声望":4,"因果":-2,"气血":-15}}],"id":"nanjiang_023"},{"题":"蛊医收骨","类":"市井","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的市集边上，{人物}支了一张矮桌，桌上一碗清水，桌后挂一面旧幡。他把清水推到我面前，让我对着水吐一口气。我吐了，水面上浮起三道细纹，纹路还在慢慢地转。他没说话，取出一支竹片，在我腕上轻轻一刮，刮下一点皮屑丢进碗里，那三道纹立刻散成一片雾。","他说这是三年的老蛊，虫已经和肉长在一块了。要医，得慢慢引，一日一只，引足四十九日。我问他诊金多少，他说不收灵石，只收病人身上掉下来的一件东西：一枚指骨，或一颗牙。他说这话时指了指桌下那只布袋，袋里哗啦响，我不用猜也知道里头是什么。","{天象}，另一头有人跑来喊他，说寨里有个孩子吞了蛊，快断气了。他把竹片一收，站起来就走，走了两步又回头看我，说：你要是等得住，就在这儿坐着，我回来接着替你引。那布袋还敞着口，里面的指骨在灯下泛着黄。我身上的蛊又动了一下，比往时更急。"],"择":[{"名":"交指为酬","文":"我等到他回来，把手伸出去，让他取了一枚小指的骨头。他动手很利落，麻汤一含，竹刀一挑，那块骨头就下来了，裹进布里收好。此后四十九日，他每日替我引一只虫，最后一只出来时我吐了一地黑水。小指短了一截，握东西不太稳，可夜里终于不再听见虫响。","果":{"气血":-20,"寿元":4,"因果":-1,"修为":-40}},{"名":"以蛊相抵","文":"我从腕里逼出一只蛊，放在桌上。他看了一眼，说这只虫养得不错，值三颗牙。他把虫收进笼里，说这样的虫他能拿去换药，替那些拿不出诊金的穷人医。此后他替我引了四十九日，最后一日照例收了我的腕血一小盏。走时他塞给我一包药，说这是虫的谢礼。","果":{"灵材":1,"修为":-20,"道心":3,"声望":3,"气血":-10}},{"名":"先去救孩子","文":"我让他先去救孩子，我的事不急。他跑出去了，我在矮桌边等了大半夜。天亮时他回来，说孩子救下了，可寨里没有药了，问我能不能先借他些灵石。我把身上大半灵石给了他，他没推，只把那布袋推到我面前，说里头的骨头，我挑一枚带走，算他欠我的第一笔。","果":{"灵石":-120,"声望":6,"因果":-3,"悟性":1,"道心":2}}],"id":"nanjiang_024"},{"题":"祭灰撒路","类":"天象","重":2,"域":["nanjiang"],"境界":[0,6],"段":["{人物}给了我一把{灵材}，用油纸包着，沉甸甸的。他说这是祖庭祭坛上烧剩的灰，掺了历代巫祝的血，能安林里的东西。撒的时候要走三步撒一撮，念自家三代以内亡者的名字，不许念活人的。他把油纸包塞进我手里就转身走了，走得很快，像不愿多留一刻。","入林时{天象}，四下里静得没有一丝虫鸣。我按他说的走三步撒一撮，念了祖父的名，念了伯父的名。撒到第三把时，脚下忽然变得很软，那软意从鞋底一直透上来。我低头一看，撒下去的灰在地上不散，反而一点一点聚成一小堆，堆成一个小小的坟包形状，又慢慢塌平。","第四把还没撒完，林里有声音应我了。起先像风吹叶，后来听清了，是念名字的声音，念的正是我刚才念的那个。声音有我祖父的口音，叫我的乳名，叫得很熟。我掌心的灰只剩最后一撮，油纸包里还有一点，可那声音已经开始往前走，走到我背后来，停在那儿，就那么停着。"],"择":[{"名":"撒完不回头","文":"我把最后一撮灰撒尽，念完最后一个名字，转身就走，没有回头。那声音在背后跟着我走了很远，最后慢慢淡了。出林时天已亮，油纸包空了，包底粘着一层细白的东西，像盐。{人物}接过油纸看了看，说这一夜祖灵认了我，往后我在林中走，虫不会先咬我。","果":{"道心":3,"声望":4,"因果":-2,"寿元":2}},{"名":"回头应声","文":"我回头了，也应了一声。林子里什么都没有，可就在那一瞬，我整个人像被抽空了半截，脑子嗡了一下。等我再清醒，手里的灰已经撒在地上，撒成一条往林深处的线。我顺着那条线走了半宿，走到{地点}才停下。此后我梦里常有个老人在我背后喊我，喊得很轻。","果":{"气血":-20,"悟性":3,"魔念":2,"因果":2,"修为":80}},{"名":"收灰自用","文":"我留了一半灰，包好藏进怀里。剩下那一半撒完，念了名，尽快出林。那半包灰我后来用在别处：撒在宿处四周，虫便不进；掺在解蛊汤里，药性更沉。可每次用它，我都要念一个亡者的名字，念的次数多了，有些名字我已经想不起是谁，却还是会念出来。","果":{"灵材":1,"道心":-1,"悟性":2,"因果":2,"修为":60}}],"id":"nanjiang_025"},{"题":"赶尸过境","类":"奇闻","重":2,"域":["nanjiang"],"境界":[0,6],"段":["半夜有人在{地点}的渡口敲锣，一长两短。{人物}说那是赶尸的号子，让人避开。我躲在船棚后看，来的是一行「人」，一个在前的赶尸客摇着铃，后面的都直着腿走，头上盖着黑布。一共七具，走得整整齐齐，脚落地却听不见声音。","走到跳板前，赶尸客停了，说了句话，七具尸便齐齐一停。我这才看清，每具尸的颈后都爬着一只暗红的虫，虫身埋在皮肉里，只露半截尾巴。赶尸客让尸身走上船，船板被压得吱呀响。他说这是蛊引尸，虫在颈后牵着，尸就不散，也走不歪。","{天象}，河面上起了雾。第七具尸上岸时，颈后的虫忽然脱了，掉在跳板上滚了两滚。那具尸当场就歪了，黑布滑下来一半，露出一张青灰的脸。赶尸客没有回头，只把手里的铃摇得更急，说了一句：别停，谁都别停。可那具尸已经跪了下去。"],"择":[{"名":"上前托尸","文":"我冲上去扶住那具尸的肩，把它架起来。入手极凉，也极硬，像抱着一根湿木。赶尸客回头看了一眼，飞快地补上一只新虫，铃一摇，尸又直了起来。事后他没道谢，只从袋里摸出一小块东西丢给我——是虫蜕，能解些许尸毒。他牵着剩下的六具走了，没有再说一个字。","果":{"气血":-15,"灵材":1,"因果":1,"寿元":-2}},{"名":"摇铃引虫","文":"我抢过渡口的铜锣敲了两下。锣声一响，那具尸颈上剩下的半截虫尾竟蠕动起来，虫自己爬回了尸身里。赶尸客停住脚，看了我很久，说这法子他自己都不敢用。他把整行尸都带走了，走前留下一句话：你若来日被虫咬了，来白骨渡找我，报我的号子。","果":{"悟性":3,"声望":4,"修为":80,"因果":-1}},{"名":"退而远观","文":"我没有动，看着赶尸客把尸身一具一具拖上船，用帆布盖住。船开走时，那具散了虫的尸被留在岸上，没人管。天亮后官差来收，见尸颈后有个洞，便说是歹人所害。我什么也没说。往后三日，我一闭眼就看见那张青灰的脸，它没有表情，只是看着渡口。","果":{"道心":-2,"因果":2,"悟性":1,"气血":-5}}],"id":"nanjiang_026"},{"题":"蛊母归巢","类":"争斗","重":3,"域":["nanjiang"],"境界":[2,9],"段":["{地点}的第四层，虫已经厚到踩上去会陷。{人物}带我到一处石缝前，指着缝里那一团半尺大的东西说：那是蛊母。{妖异}不是一只虫，是一窝虫挤成的团，团里有虫在产、有虫在吃、有虫在死，永远不死，也永远不长大。谁掌握蛊母，谁就掌握了这一带的虫。","石缝里传来极低的嗡声，那声音不在耳朵里，在牙根上。我靠近一步，身上的蛊便开始乱撞，撞得我腕骨发疼。{人物}说蛊母不认人，只认「巢」——谁给它巢，它就跟谁。他说门中有三种用法：一是把蛊母取出来带走，用蛊笼养；二是把它烧了，让这一带的虫散掉；三是把自己的蛊喂给它，换它一次「归巢」号令。","{天象}，石缝里的团忽然松散了一下，无数小虫从团里涌出，顺着石壁往我这边爬。{人物}退了一步，说它闻到我了。我腕里的蛊撞得更凶，几乎要自己破皮出来。我只有一瞬可以做决定——蛊母的团已经张开，中间露出一块泛着油光的核，那核上有一道旧疤，和我腕上那道，一模一样。"],"择":[{"名":"取母入笼","文":"我把{器物}扣上去，连石屑一起铲进笼里。蛊母入笼的一瞬，满壁的虫同时停住。我提着笼子退出第四层，虫群让开一条道，让得整整齐齐。从此我掌虫如掌臂指，可也从此再睡不着整觉——笼里的嗡声一整夜都在牙根上响，响到我分不清是它在叫，还是我在叫。","果":{"修为":400,"魔念":3,"器物":1,"寿元":-8,"声望":8}},{"名":"举火烧母","文":"我把火折子连着油囊一块塞进石缝。那团东西烧起来时不叫，只是迅速地干、迅速地裂，裂到最后爆出一声极轻的响。满壁的虫像被抽了魂，成片往下掉，掉在地上抽搐。这一带的蛊绝了三个月的迹，{人物}说我烧掉的是门中养了四十年的根，可那三个月里，林里死了的人比往年还少。","果":{"因果":4,"声望":-5,"道心":4,"修为":120,"灵材":1}},{"名":"以蛊换令","文":"我放开腕里的蛊，让它爬进石缝。它爬到核前，停了片刻，然后被那团虫吞了进去。嗡声猛地一响，随即便安静了。我扶着石壁坐下，腕上的疤平了，胸口却空了一块。从那一日起，这一带的虫都听我一言——可每用一次，我都要咳出一口带虫壳的血。","果":{"修为":300,"气血":-30,"悟性":4,"因果":3,"寿元":-6}}],"id":"nanjiang_027"},{"题":"血藤桥","类":"灾祸","重":3,"域":["nanjiang"],"境界":[0,6],"段":["要过{地点}，只有一条路：血藤桥。那是几根老血藤横在溪上，缠得密实，踩上去像踩着活物的背。{人物}说这桥吃人，专吃走得慢的——藤上有细孔，贴上皮肉便吸，吸得人不知不觉。他说过桥要快，脚步不能停，也不能在桥中间回头看。","我踩上第一根藤，脚下果然一软，那软意顺着鞋底往上爬了一段，被我用气震开。走到桥心，藤忽然绷紧，桥身轻轻一抖，抖得我脚下一滑，膝头磕在藤上。膝头破了皮，血一渗出来，底下的藤立刻收紧，那些细孔像被什么唤醒了，一起贴上来。","{天象}，对岸的{人物}在喊，喊的什么被水声盖住了。我膝下那片藤已经变得温热，温得发红。我想起他先前说的话，可桥心离两头都远。这时候我看见藤上有一道旧刀痕，很深，像是当年有人在这里割过——割的是藤，还是自己的腿，我看不出来。"],"择":[{"名":"疾走不停","文":"我咬着牙把膝头硬提起来，一步压一步往前冲，冲到最后三丈时整个人是滚下桥的。落地时腿上的皮被撕掉一片，血糊了半条裤腿。{人物}把我拖上岸，用解蛊汤浇伤口，说再过一息，藤就会把我从桥心拖下去。我回头看那座桥，桥身已经恢复了原样，静静地横在那里。","果":{"气血":-30,"寿元":2,"道心":2,"修为":40}},{"名":"割藤断桥","文":"我抽出刀，照那道旧刀痕的位置狠狠割下去。藤一断，桥身立刻塌了半边，我抱着断藤摔进溪里，被水冲到下游才爬上岸。溪水把血冲淡，膝上的孔也不再吸。可这座桥断了，往后过{地点}的人得绕三日山路，我听见对岸有人在骂，骂得很长。","果":{"气血":-20,"因果":2,"声望":-3,"灵材":1,"道心":1}},{"名":"以血喂桥","文":"我停下脚步，把腕子割开，让血淋在藤上。藤一沾血便松了，松得极快，像吃饱的兽。我趁这一瞬走过去，走到对岸时数了数，这一趟喂了将近一盏。{人物}看着我的腕子，说这桥记血，喂过一次，往后每次过都要喂，不然它会认得你却不放你。","果":{"气血":-35,"因果":3,"魔念":1,"修为":60,"寿元":-3}}],"id":"nanjiang_028"},{"题":"暗市换蛊","类":"市井","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}背后的竹林里，逢单日夜里开暗市。没有灯火，全靠{天象}，人影在竹间一晃一晃。这里不收灵石，只收消息——{人物}说蛊贩行会的老规矩：蛊可以用钱买，好蛊只能拿命换，而消息比命便宜，比灵石贵。我把身上知道的几件事在心里排了排，才敢往里走。","暗市中央铺着一块旧席，席上摆着七只竹笼，笼前没有标价，只放着一枚小石子。{人物}说石子的颜色就是价：白的是寻常货，青的要一桩旧闻，黑的是非卖品——摆出来只是让人看，看的人若伸手，后果自负。我看中了一只黑石笼，笼里的虫通体透亮，像一滴凝住的水。","我在席前蹲了很久。卖主是个始终低着头的人，声音很轻，问我拿什么换。我说了三件事：青木谷药圃换防的时辰、祖灵谷谷口的血石何时更换、还有万蛊窟第三层的一处暗门。前两件他都没抬眼，听到第三件，他抬起头来——那双眼睛里没有瞳，只有两片青白。"],"择":[{"名":"全盘相告","文":"我把暗门的位置说得清清楚楚。他听完，把黑石笼推到我面前，又添了一只白石的，说多的算添头。我提着两只笼走出暗市，走了半里才想起来——那处暗门，是我唯一能进出万蛊窟的路。此后我再没走过那条路，每次下窟都只能走正门，受那些虫的打量。","果":{"修为":240,"灵材":1,"因果":3,"声望":-2}},{"名":"以蛊换蛊","文":"我把自己养了三年的那只蛊从腕里逼出来，放进他手里。他捏着虫看了一息，点头，把黑石笼递过来。换来的虫养在瓮里，三日不进食，第四日忽然吐出满瓮的丝，丝上全是细字，写着一部残缺的养蛊法。我原有那只蛊，我至今还偶尔梦见它在我腕里翻身。","果":{"修为":180,"悟性":4,"寿元":-3,"魔念":1}},{"名":"缩手退走","文":"我把手收回来，站起身退出去。卖主没有说话，也没有拦。走出竹林时，我听见席上有人在低声笑。那夜我什么也没换到，可回去的路上忽然明白了一件事：暗市里最贵的从来不是虫，是让人伸手的那个念头。此后我在{地点}再没进过竹林。","果":{"道心":4,"悟性":2,"寿元":1,"声望":1}}],"id":"nanjiang_029"},{"题":"谷主断蛊","类":"人情","重":2,"域":["nanjiang"],"境界":[2,8],"段":["{地点}的茅屋里，{人物}坐在一张矮凳上，右腿从膝下空空荡荡。他正在剥一株还魂草的根，剥得很仔细，指甲缝里全是绿。我把来意说了，他也没抬头，只说：你要解的是蛊，还是解的是你自己。我说我不明白。他说蛊道到后来，人就不是被虫困住的，是被自己养虫的那只手困住的。","他让我把手伸出来。他的手指按在我腕上，按得很轻，我却觉得整条手臂被人从里面看了一遍。他说：你这只蛊吃过人血，不是你的。我愣了一下，才想起当年入门时那只虫是门里发的。他点头说，门里发的虫都是别人的蛊生的，认了主也还是会认旧主——你养了这么多年，养的是别人的东西。","{天象}，他放开我的腕，从床下拖出一只旧瓮，瓮上有一道很深的裂，被人用铜丝一道道缠住。他说这是他当年身上那三只虫里最后一只的瓮，他把它剥出来埋了，却留着瓮。他问我敢不敢把手伸进去。屋里只有一盏灯，灯芯烧得只剩一小截，火光照见他半张脸上的旧疤。"],"择":[{"名":"拜师学医","文":"我跪下来磕了三个头。他没有马上答应，只让我先去药圃采三个月还魂草，采完再谈。三个月后我晒得脱了一层皮，他才让我进屋，把《青木解蛊经》的第一卷推到我面前。他说蛊道救人比杀人难，你若学得下去，就在这谷里住十年。","果":{"悟性":4,"道心":4,"声望":5,"灵石":-60,"寿元":3}},{"名":"求他剥蛊","文":"我把手伸进旧瓮。瓮里有东西极轻地碰了我的手指，随即缠上来，顺着腕骨往上爬。我吓得要缩，被他一把按住。那只虫在我腕里绕了三圈，咬断了旧主留下的那一线，然后自己爬出来，落在瓮底死了。我的蛊从此真是我的了，代价是腕上多一道绕三圈的疤。","果":{"修为":260,"气血":-25,"因果":-2,"寿元":-3,"悟性":2}},{"名":"替他做事","文":"我没有跪，也没有伸手，只说我欠你一桩事，你开口。他笑了，说万蛊门有个叫{人物}的人，二十年前做的孽，如今还在做。他要我去把那人这些年养的蛊逐个数清，写在纸上带回来。这事我做了七个月，做的过程中见过一些不该见的东西，也终于懂了谷主的腿是怎么断的。","果":{"因果":2,"声望":6,"修为":120,"悟性":3,"气血":-10}}],"id":"nanjiang_030"},{"题":"双生毒","类":"灾祸","重":3,"域":["nanjiang"],"境界":[1,7],"段":["{人物}捧着一只陶碗来找我，说这一碗里下了两种毒，一阴一阳，单解一种，另一种便发；两种一起解，人当场七窍出血。他请我替他试一次——他说这话的时候没有避我的眼睛，反而把手腕伸出来，腕上有三道旧疤，是前三次试毒留下的。","我问他为什么不自己试。他说他的血已经吃过三种毒，试不出来了，只有没吃过毒的血才能看出两种毒在里头怎么走。他把碗放在桌上，说试完给我一瓶蛊神木芯泡的酒，能压住三成毒。屋外的雨下得不大，落在瓦上的声音很匀，一下一下，像有人在替我数。","{天象}，我把碗端起来。碗里的液色很怪，一半深褐，一半灰白，交界处像有两条线互相咬着。我想起解蛊汤的方子，心里忽然冒出一个念头：青木谷的汤能按住蛊，也许按得住这两种毒——可那方子我只有半张，还魂草也已经用尽。{人物}在对面坐下，等着。"],"择":[{"名":"一口饮尽","文":"我把碗一口喝干。两种毒在腹里走了半刻便撞成一团，撞得我在地上翻滚，指甲抠进泥里。{人物}按住我的手，只在我耳边说：别咽血，吐出来。我吐了三回，吐出的东西一半是黑的一半是白的，呕到最后只剩清水。他守了我一夜，天亮时把木芯酒放在我手边，说这一碗，我记你一辈子。","果":{"气血":-40,"修为":260,"悟性":3,"因果":-2,"寿元":-5}},{"名":"只解一半","文":"我先把碗里灰白那一半饮下，用解蛊汤压住，隔了半个时辰才喝深褐那一半。毒走得慢，可两毒到底还是撞了，我昏了三天，醒来时嘴里的牙掉了两颗。{人物}说这法子虽然险，却是他自己一直不敢试的那条。他把整套蛊毒双修的残页给了我，说这算他的赔礼。","果":{"气血":-25,"修为":190,"悟性":4,"魔念":1,"寿元":-2}},{"名":"以蛊吃毒","文":"我把碗端到腕边，唤出蛊，让它替我喝。虫在碗里滚了一圈，把两股毒都吸进腹内，腹当场胀成了原来的三倍，随即在我掌心爆开，浆水有毒，烫穿了半层皮。我这条命保住了，可那只养了七年的蛊没了。{人物}看着我的掌心，说：你这人，比毒还狠。","果":{"修为":120,"气血":-20,"魔念":2,"因果":2,"寿元":2}}],"id":"nanjiang_031"},{"题":"萤虫成云","类":"天象","重":2,"域":["nanjiang"],"境界":[0,6],"段":["{天象}，林边的萤虫成云，压得树梢低下去。那不是寻常萤火，一只只大如指节，腹下带光，聚在一起像一团会呼吸的月亮。{人物}说这云里有蛊，是{地点}飞出来的浮蛊，随萤虫走，落在哪里，哪里便生出一窝新虫。他说：遇云要避，避不开就站着别动。","虫云压过来的时候，整片林子都亮了，亮得能看清每片叶上的纹。我站着不动，虫云从我身侧掠过，掠到一半却停了，慢慢转回来，绕着我打圈。我低头看，才发现自己腰上那块{器物}正发着极淡的光，和虫云的光一个色。虫云被它引住了。","圈越绕越紧，我听见虫翅扇动的声音从四面八方压来，压得耳朵里全是嗡响。旁边的{人物}已经退到十丈外，冲我比手势，比得很急，我却看不懂。这时虫云里分出细细一条，像一根绳子，慢慢地向我腰上那块东西垂下来。我知道只要它碰到，这一云虫就都归我了——也知道归我的时候，不会白归。"],"择":[{"名":"任虫落牌","文":"我站着没动。那根细线落在玉牌上，随即整片虫云像水一样涌过来，灌进牌里。牌从中间裂了一道，裂口里全是光。我的修为当场涨了一截，掌虫的本事也翻倍，可那块牌从此再摘不下来——它已经长进我的皮肉，成了我身上的一部分。","果":{"修为":300,"魔念":2,"器物":-1,"寿元":-4,"声望":6}},{"名":"举火驱云","文":"我把火折子点着，举过头顶摇晃。虫云怕火，退开了半丈，可退开的一瞬，成千上万只萤虫撞在一起，撞出细碎的火星，像下了一场断线的雨。虫云散成几股，往林深处飘走。我腰上的玉牌暗了下去。{人物}过来看，说这牌子是引虫的东西，让我最好埋了。","果":{"悟性":2,"道心":2,"因果":-1,"声望":2}},{"名":"借云赶路","文":"我扯下外衣，包住玉牌，让光透出来一线，举着往{地点}走。虫云跟着光走，替我照亮了半条路，也替我把林里的野物逼开。走到天快亮时，虫云自己散了，散的时候落了一地萤虫尸体，踩上去啪啪作响。我脚下是一条从未有人走过的近路。","果":{"修为":100,"悟性":3,"寿元":-2,"灵材":1,"因果":1}}],"id":"nanjiang_032"},{"题":"割肉还愿","类":"修行","重":2,"域":["nanjiang"],"境界":[1,8],"段":["{人物}说，养蛊的人在祖庭许过愿的，愿成之日要来还。还愿不用灵石，不用香火，只要割自己一寸血肉，投进{地点}的井里。他说这不是仪式，是账——祖灵替你压了一件事，你就得还一块能压得住的东西。他把刀递给我，刀很短，刃上有一层洗不掉的黑。","井边已经跪着两个人。一个割了左臂，一个割了小腿，血顺着石缝往下走，走成两条细线。轮到我的时候，我按住自己的手臂，忽然想起那个愿：三年前在瘴里迷路，我许的是「若能活出去，此生不害无辜」。那之后我做过的事，有几件算是害了无辜，我自己心里有数。","{天象}，井里传出极低的水声，像有人在下面翻身。{人物}在旁边等着，没有催。我把刀按在臂上，刀口贴着皮，只要一压便下来。可我也看见井沿上那两根手指——前一个还愿的人留的，他割的时候手抖得厉害。这刀下去，割的是肉，还的是那桩愿；不割，愿就挂着，人也会一直记着。"],"择":[{"名":"割肉还愿","文":"我一刀下去，割下二寸见方的皮肉，投进井里。井水翻了一下便静了，静得像什么都没发生。{人物}替我把伤口包好，说愿清了。我的手臂从此少了一片，力气也弱了些，可当夜我睡得很沉，三年来第一次没有梦见那片瘴。醒来时井边的青石上多了一道浅痕。","果":{"气血":-30,"寿元":4,"道心":4,"因果":-3,"声望":3}},{"名":"以米代血","文":"我没有割，从囊里取了一把米投进井里，说愿我记着，账我慢慢还。井里没有反应，{人物}也没有说话，只是把我那把刀收回鞘里。此后我的修为照样长，只是每逢祖庭的人经过，我都会被多看一眼。这把米在井里泡三日就烂了，我知道，可我还得这么说。","果":{"道心":-1,"因果":2,"寿元":1,"修为":60}},{"名":"割他人之肉","文":"我把刀转向旁边那个还未还愿的人，说不如我替你割。他还没反应，刀已经落下去了。血溅在井沿上，井里立刻响了一声，响得很沉。{人物}一把夺过刀，看我的眼神变了。愿是还了，还的是别人的肉；这一笔账，祖灵记在我名下。此后我每次下井边，那两个人的脸都在水面上晃。","果":{"因果":5,"魔念":3,"道心":-4,"寿元":-2,"修为":140}}],"id":"nanjiang_033"},{"题":"祖庭使者","类":"宗门","重":3,"域":["nanjiang"],"境界":[1,8],"段":["{人物}是祖庭派出来的使者，披银线法衣，腰上挂一只{器物}，走到哪个寨子，寨老都要出迎。她此来是收供：每寨交三瓮活蛊、两斤祭灰、一名自愿入谷的童子。她说得平静，像在念一张单子，念完之后把一卷皮纸放在桌上，皮纸上的字是用血调的墨。","寨老看了皮纸，脸色很难看。今年的虫少，交三瓮等于断了半年的生计，童子更是没人肯给。可祖庭的供从来不能欠——欠了供的寨子，雨季一来，林里的虫会自己进寨。寨老转头看我，屋里的人也都看我，像是要我拿个主意。","{天象}，使者一直没催，只是慢慢转动腰上那只骨铃，铃不响，转得很有节。她说她知道今年虫少，可她带回去的东西若短了，祖庭就要派人下来自己取。那时候取的就不止三瓮了。她说到这里停了一下，抬眼看我，说：你是外人，说话没人怪你。"],"择":[{"名":"劝寨交供","文":"我说服寨老照数交齐，又自己添了一瓮补上缺。使者收了供，临走时把骨铃上的一粒虫玉摘下来给我，说祖庭记这一笔。寨子这一冬过得很苦，可雨季来时没有虫进寨。我离开的时候，那些交不出虫的人家送我到寨口，送了很远，一句话也没说。","果":{"灵石":-100,"声望":6,"因果":-2,"器物":1,"道心":2}},{"名":"代寨抗供","文":"我把皮纸推回去，说这寨子今年交不出。屋里静了一瞬，使者的手指停在骨铃上。她看了我很久，最后收起皮纸，说：那我记下你的名字。她便走了。当夜寨外的林子里有虫声绕着寨墙走了一整夜，寨老带着人守到天亮。此后我路过祖灵谷，谷口的暗哨都会跟着我。","果":{"因果":3,"声望":4,"魔念":1,"气血":-15,"寿元":-3}},{"名":"替她送信","文":"我说供的事我可以替寨子想办法，条件是让我替她送下一趟信——我想看看祖灵谷里到底记着什么账。她想了很久，点头。那一趟信我送了半个月，走过三个寨子，也第一次看见了祖庭的账册：一册记供，一册记名，还有一册，记的是所有欠账的人。第三册上有我的名字。","果":{"悟性":4,"因果":2,"声望":5,"修为":120,"寿元":-2}}],"id":"nanjiang_034"},{"题":"血玉旧皿","类":"机缘","重":3,"域":["nanjiang"],"境界":[1,7],"段":["在{地点}的一间空屋里，我翻出一只巴掌大的{器物}。皿是血玉的，已经黑透了，皿底的沟槽里析着一层细晶，摸上去像盐。屋里的灶还是干净的，床上叠着一件衣裳，人却不在——这种空屋在南疆很多，多半是养蛊养到某一天，自己走进林里没再回来。","我把血玉皿在灯下转了一圈。皿底刻着一行极小的字，被血垢填满了，我用蛊针一点点挑，挑出半句：血满皿自鸣。再看自己掌心那道旧疤，疤口竟在微微发亮，像被什么东西认了出来。我忽然想起{人物}说过的话：血玉越黑，人越薄，到某一天皿里的血不必割指，自己会满。","{天象}，皿底真的开始渗出一线暗红。不是我的血，我的手腕还是干的。那线红慢慢聚在沟槽里，聚到一半，皿中响起极轻的一声——像有人在很远的地方敲了一下瓮。同时，屋后林子里传来脚步声，很慢，一步一步，走得很稳，像有人回家了。"],"择":[{"名":"以皿饲蛊","文":"我把旧皿洗净，收进蛊囊，从此用它饲蛊。血玉比我自己割腕省事得多，皿里的血总是满的，虫也养得比从前肥。可我的脸色一日比一日薄，照水时能看见颧骨下的青。到第九个月，我在梦里听见皿自己鸣了一声，醒来时发现皿里那层晶已经长到外面。","果":{"修为":320,"气血":-30,"魔念":2,"器物":1,"寿元":-8}},{"名":"洗手埋皿","文":"我用引虫香灰把皿底的沟槽一一填死，再用油布裹了三层，埋进屋后的土里。埋的时候，屋后那阵脚步声停住了，停得很突然。我起身走开，走出十几步，听见土下有很轻的一声响，像叹气。那之后我在{地点}再没进过空屋，也再没养过第二只蛊。","果":{"道心":5,"因果":-3,"寿元":5,"声望":2}},{"名":"坐等来人","文":"我没有走，坐在灶边等。脚步声到门口停住，门推开，进来的是个瘦得脱形的老人——就是这屋子的主人。他看见我手里的皿，眼睛亮了一下，说这皿是他养的，血是他自己的。他伸手要接，我把皿递过去。他捧着皿在床边坐下，慢慢地倒了下去，倒下去时皿里满了。","果":{"悟性":3,"因果":2,"魔念":1,"修为":100,"灵材":1}}],"id":"nanjiang_035"},{"题":"以蛊代眼","类":"修行","重":2,"域":["nanjiang"],"境界":[1,8],"段":["{人物}的眼睛瞎了七年，可他走{地点}的夜路，比谁都稳。我问他怎么认路，他从袖里取出一只小陶罐，掀开盖，里头爬出一只极小的虫，黑背白腹。他说这虫替我看，我把它放在肩上，它看见什么，我脑子里便有什么，只是黑白颠倒，远近也差一点。","他说这法子叫「借目」，是《万蛊归巢诀》里旁出来的一支，不算正道。借目借得久了，人眼会慢慢废掉——不是虫吃你的眼，是你的眼自己懒得看了。他瞎的时候只借了三个月，如今已经离不得。他把罐子推过来，说你可以试一夜，试完不想，就把虫还我。","{天象}，我把虫放在肩上，脑子嗡了一下，世界在眼前翻了个面：暗的成了亮的，树影成了实心的白，脚下的路反倒黑成一条沟。我能看见十丈外一只虫在叶背翻身，却看不见近在手边的水囊。这种错位叫人心里发慌，可走得久了，竟有种说不出的痛快。"],"择":[{"名":"借目一夜","文":"我借了一夜，走完{地点}的十里夜路，没摔一跤。天亮时把虫还他，眼睛酸得直流泪，闭上却还能看见一些残影。此后我偶尔会在赶路时找他借，一次三日，还的时候总要多花半日才看得清人。他从不催我，只是每次都提醒：别借到第七日。","果":{"悟性":4,"修为":120,"气血":-10,"寿元":-2}},{"名":"以物换虫","文":"我用一株还魂草换了那只虫，从此自己养。虫养在耳后，饿了会轻轻咬我，我割一点血喂它。三年后我能在完全的黑里看路，可白天看东西开始发花，字要凑到鼻尖才认得出。{人物}听说后只叹了一声，说这虫原本就是他瞎之后才养的。","果":{"器物":1,"修为":200,"悟性":3,"气血":-15,"寿元":-4}},{"名":"劝他弃借","文":"我把罐子扣上，说这虫你该埋了。他愣了很久，笑了，说自己瞎了七年，早就不知道不借目该怎么走路。他试了三日，第三日在林里摔断了锁骨，我去扶他，他躺在地上笑得眼泪都出来。此后他不再借目，改用手杖，走得慢，可走得很正。","果":{"道心":4,"声望":4,"因果":-2,"寿元":2}}],"id":"nanjiang_036"},{"题":"镖行过瘴","类":"市井","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{人物}的镖行要往{地点}送一批药材，走的是穿瘴的近道。镖头说这条路三日能到，绕山道要十二日，药材坏了赔不起。镖行一共七个人，五辆车，车前挂一串驱虫的骨头。他问我搭不搭伙，搭伙就得分一份险，也分一份钱。","进林第二日，天起了雾，瘴气一层层往上漫。镖头让人把车围成一圈，人在中间点火，说瘴最怕火气。火点上后，我听见车底有细碎的声音，低头一看，车轮的木辐里已经爬满了虫——不是瘴带来的，是药材的气引来的。车上的药包开始一包一包地鼓起来。","{天象}，镖头拔刀，被我一把握住。车上的药不能动刀，一动药气散得更快。我腕里的蛊已经在撞，它闻到了那些虫的味道。七个镖师都看着我，等我说一句。雾越来越厚，火已经照不出三尺，车底的声响密成了一片。"],"择":[{"名":"放蛊夺药","文":"我把蛊放到车上，让它替我把那些虫一只只咬死。它咬了半夜，咬得腹大如鼓，最后伏在药包上不动了。药材保住了，可被我蛊咬过的那三包药渗了虫浆，卖不出价。镖头扣了我一半的份子，却说下次还找我搭伙——因为七个镖师一个没少。","果":{"灵石":60,"修为":120,"气血":-10,"声望":3}},{"名":"弃货保人","文":"我说药不要了，人先出去。镖头不肯，被我一掌打晕了扛在肩上。七个人牵着空车往外走，走了六个时辰才出雾。那批药在雾里烂成了一堆黑灰，镖行赔了一大笔，镖头回来跟我打了一架，打完请我喝酒，说那晚若不是我，七条命都留在林里。","果":{"灵石":-80,"声望":5,"道心":3,"因果":-2}},{"名":"以火破瘴","文":"我把五辆车的药包全点了。药一烧，浓烟冲天，瘴气被烟逼退了两丈，火里烧出一股极冲的香气，把车底的虫全熏了出来，成片地往外爬。天亮时雾散了，药没了，人还在。镖头蹲在灰里拨了半天，拨出一小包没烧透的籽，说这个能卖。我们靠那包籽回了本。","果":{"灵石":20,"因果":2,"悟性":2,"声望":3,"气血":-5}}],"id":"nanjiang_037"},{"题":"青木虫疫","类":"灾祸","重":3,"域":["nanjiang"],"境界":[0,7],"段":["{地点}的药圃出了事。先是药苗一夜之间枯了三成，随后几名药童开始咳，咳出来的痰里有细白的东西在动。{人物}把我拦在圃外，说这不是病，是虫疫——不知哪个蛊师把虫卵埋进了药土，虫在土里孵出来，吃苗，也吃人。他说谷里的解蛊汤压不住，因为虫太多，人太少。","我隔着篱笆看进去，药田的土面上密密麻麻都是细小的孔，每个孔里探出一截白虫尾，随人走动的声音一起一落。一个药童蹲在田边，一边咳一边徒手去按那些孔，按一个，另一个又冒出来。{人物}说他们已经按了三天三夜，按得手指都烂了。","{天象}，圃里的枯苗忽然一齐倒下，倒得很整齐。倒下的地方，土面开始起伏，像有东西在下面游。{人物}从怀里掏出一只瓷瓶，说这是最后一瓶解蛊汤，够救三个人。他说谷主还在谷里没出来，问我肯不肯进田——进田的人，多半出不来。"],"择":[{"名":"入田按孔","文":"我踏进药田，按着那些孔一个一个堵，堵了半日，掌心被虫咬得没有一块好肉。到天黑时我才摸清：虫是从圃外一棵老树下爬进来的。我把那棵树砍了，虫势立止。出田时我吐了两口血，{人物}用那三瓶汤救了三个人，其中一个是那位徒手按了三天的药童。","果":{"气血":-35,"声望":8,"道心":4,"因果":-2,"寿元":-4}},{"名":"封圃烧田","文":"我提议封圃。{人物}不同意，说这圃是谷里三十年的家底。我没有等他同意，把圃口的柴堆点了。火一起，田里的虫成片往外涌，涌到火边便被烧得爆响。烧完两日，田成了黑地，虫疫断了，可青木谷这一年救不了任何人。谷主出来看了很久，最后只说了一句：烧得对。","果":{"因果":3,"声望":3,"道心":2,"灵石":-100,"魔念":1}},{"名":"抢药出谷","文":"我趁乱进了药圃的库房，把能装的药全装了三大囊，背着往外走。路上遇见一个咳得直不起腰的药童，我绕开了他。出了谷我把药卖给了蛊贩行会，换了一大笔灵石。三个月后我听说青木谷那年死了十一个人，其中最小的九岁。那笔灵石我一块也没花，埋在了土里。","果":{"灵石":300,"灵材":2,"因果":5,"道心":-5,"声望":-6}}],"id":"nanjiang_038"},{"题":"窟底暗门","类":"秘境","重":2,"域":["nanjiang"],"境界":[1,8],"段":["{地点}第三层的石壁，有一处颜色比周围深半分的方口。我用蛊针刺了三下，方口自己开了，门后是一条向下的窄道，道壁上没有虫，干净得反常。{人物}说过，万蛊窟里最可怕的地方不是虫多的地方，是虫不进的地方——因为那里有更凶的东西。我把火折子探进去，火苗往里倒。","窄道走了约百步，尽头是一间石室，室内只有一口石井与一张石床。床上躺着一个人形的东西，长约七尺，浑身被一层灰白的膜裹着，膜下的轮廓起伏得极慢，像在睡觉。井口垂着几根铜线，线头没入膜的胸口。石室的四壁刻满了字，字很小，刻得很密，我认出了几个：以身为皿。","我靠近了一些，膜下的东西忽然停了起伏。石室里那点火光跟着一缩。我听见一个声音，不是从耳朵进来的，是从后颈的骨头里——那声音很老，很慢，说了四个字：你也是皿。同时，石壁上有一处字迹忽然亮了一下，亮起的位置，正好刻着一行我没见过的名字。"],"择":[{"名":"抄字退出","文":"我没有碰那口井，也没有靠近石床，只把墙上的字一段一段抄在衣襟内侧。抄到最后一篇时，膜下的东西开始轻轻挣扎，铜线被绷出细响。我抄完便退，退出去时那扇方口自己合上了。衣襟上的字后来救了我两次，也把我拖进了两桩不该管的事里。","果":{"悟性":5,"修为":140,"因果":2,"寿元":-2}},{"名":"斩铜线","文":"我把铜线一根根切断。膜下的东西猛地弓起来，随即又软下去，软得像泄了气。石室里那股压在骨头上的意头散了。我退出暗门时，整层窟的虫同时叫了一声，叫得人头皮发麻。此后万蛊窟的第三层再没人生还过——门中说是那东西醒了，我却觉得它是终于死了。","果":{"因果":4,"修为":260,"声望":-4,"魔念":2,"气血":-20}},{"名":"封死方口","文":"我把随身带的碎石与泥全塞进方口，用蛊针一道道撬紧，最后抹上引虫香灰。做完这些，石壁的颜色与周围连成了一片，再也看不出门。我爬回第三层时，腿软得站不住。那夜我梦见石室，梦见床上那东西翻了个身，翻过来时，脸是我的。","果":{"道心":3,"因果":-2,"寿元":3,"悟性":2}}],"id":"nanjiang_039"},{"题":"巫祝招魂","类":"宗门","重":2,"域":["nanjiang"],"境界":[2,9],"段":["{人物}在{地点}摆了三碗水、一根干枯的手指和一盏灯。她说今晚招一魂，问我肯不肯做护法。招的是二十年前死在这片林里的一个人，魂一直没走，寨里每有孩子出世，那魂便要哭一夜。她说招魂不难，难的是招完之后，魂若不肯回去，就得有人替它留下。","入夜后她开始唱《巫祝招魂辞》，唱得极慢，一句要拖很久。三碗水的水面开始微微发亮，灯焰转了向，向着林深处偏。约到第四折，灯下多了一个影子，很淡，形状是个矮小的人。影子不说话，只在水面上写字，写得很慢，写出来的字我一笔都不认得。","{天象}，{人物}忽然停了唱。她说这魂不是不肯走，是走不了——它的骨还压在某处，压着它的东西不肯松。她抬眼看我，说要在天亮之前找到那根骨头，不然这一魂就要散在这里。可林里的方向她已经指不清了，灯焰抖得厉害，那影子开始一点点淡下去。"],"择":[{"名":"循影寻骨","文":"我跟着影子的方向走进林子，走了半夜，最后在一株老树的根下挖出一节细小的指骨。指骨压在一条虫尸上，虫尸早已干硬。我把骨头带回灯下，影子在水面上停了很久，然后散了。第二天寨里的孩子不再夜哭。{人物}给了我一根干枯的手指，说这是她自己的，先寄我处。","果":{"悟性":3,"修为":180,"因果":-3,"声望":6,"寿元":-2}},{"名":"以魂相替","文":"我坐下来，让{人物}把我的魂与那影子换一换。她犹豫了很久，最后还是唱了。那一夜我看见的不是林子，是一座寨子，一寨子的人在雨里走，都没有脸。天亮时我回来了，可我的记忆里多了二十年的雨。此后我认识这条林子的每一块石头，却记不清自己七岁那年住在哪。","果":{"悟性":5,"修为":260,"寿元":-8,"因果":3,"道心":2}},{"名":"唤灯收魂","文":"我把灯芯挑亮，用蛊针把影子压进碗里，扣上盖。影子在碗里撞了很久，撞到天亮才安静。{人物}看着我手里的碗，脸色第一次变了。她说这一魂被我收了，它便不能再走，只能跟着我。此后我在夜里说话，声音会多出一点，那点声音总是先说两个字：放我。","果":{"器物":1,"修为":200,"魔念":3,"因果":3,"道心":-2}}],"id":"nanjiang_040"},{"题":"腐叶小儿","类":"灾祸","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的林道上，有个孩子蹲着玩叶子。六七岁模样，衣裳整齐，脸很干净，干净得不像林子里的东西。我走近了两步，才发现他玩的不是叶子，是虫——他把虫一只只摆成一条线，摆得很直。他抬头看我，说：叔叔，我走不动了，你背我一段好不好。","{人物}在身后拉了我一把，拉得很急。他低声说那是{妖异}，腐叶堆成的，专在林道上等赶路的人。孩子听见了，也不恼，慢慢站起来，站起来时身上的关节发出极细的沙沙声，脚踝处露出半截枯叶。他说：我背过好多人了，他们都不肯背我。","{天象}，他开始往前走，走一步，身上的叶就掉一片，掉一片就露出底下的一层虫。我退，他也退；我停，他也停。{人物}说这东西不能碰，碰了就会粘在手上，一夜之间把你蛀成叶子。可我看见他脖子上挂着一块小木牌，牌上刻着三个字，是寨里孩子的名字。"],"择":[{"名":"背他一程","文":"我蹲下来，让他爬上来。他轻得几乎没有分量，背上只有一层叶子的沙响。走到林道尽头，他忽然说：到了。我从背上放下他，他已经散了，散成一地腐叶，叶子中间有一块小木牌。我把牌子收起来，送去寨里，寨里有个妇人接了牌子，跪下来磕了一个头。","果":{"气血":-25,"因果":-2,"道心":4,"声望":6,"寿元":-3}},{"名":"抬脚踢散","文":"我一脚踢过去，那孩子散成一地叶子，叶子底下涌出成片的虫，顺着我的鞋面往上爬。我一边跳一边拍，拍了半里地才拍干净，鞋底已经被蛀穿。{人物}说这一脚踢散的是他的「身」，他的「念」还在，往后我这条路，他还会来等。那一夜我听见有人在我窗下说：叔叔，我走不动了。","果":{"气血":-20,"因果":3,"魔念":1,"寿元":-2}},{"名":"放蛊相斗","文":"我把腕里的蛊放出去。两团东西在路中间撞上，腐叶与虫缠成一团，滚成一坨，滚到最后一动不动。我的蛊爬回来时瘦了一圈，身上带着腐叶的味道，三日后吐出一块小木牌。我拿起来一看，牌上的名字已经模糊。这一段的林道上，从此再没有孩子蹲着玩了。","果":{"修为":180,"气血":-15,"因果":2,"魔念":2,"灵材":1}}],"id":"nanjiang_041"},{"题":"盘外押注","类":"市井","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的斗蛊场上还没开斗，盘外已经先热了。{人物}蹲在竹台下收注，手里一叠竹牌，牌上刻着各家蛊师的记号。他抽出一块递给我，说押三块灵石，赢了翻五倍。竹台上正在放蛊，我看了一眼台上那两只笼，一只的虫我认得，是合蛊；另一只笼里黑得看不见东西。","我问黑笼是谁的。他说是个外乡来的少年，没名号，昨日刚赢了两场，赢得很干净。他说着，把注往少年那边挪了挪。我看那少年站得离台很远，脸色发白，手一直在抖——不是怕，是血被抽得太多的抖。我忽然明白他的虫不是养的，是喂出来的，用他自己的血。","{天象}，锣响了。合蛊先扑出去，撞在笼壁上，笼壁一层薄藤膜被撞得鼓起来。少年那边一动不动。押注的人都往合蛊那边看。{人物}却把嘴凑到我耳边，说：他这一场若赢，我赔到底；若输，他今晚就得死在这台上，因为押他的注，是我替人收的。"],"择":[{"名":"押那少年","文":"我把身上所有灵石押在少年那边。锣响三声，黑笼的藤膜忽然从里面被咬穿，一只虫窜出来，快得像一道影，一口咬断了合蛊的头。场上静了很久才炸开。{人物}赔得脸色难看，把那叠竹牌全揉了。少年拿了钱，当天就走了，走前对我抱了一下拳。","果":{"灵石":400,"声望":4,"因果":1,"修为":60}},{"名":"买他蛊方","文":"我拦住少年，说我不押注，我买他喂虫的方子。他犹豫了很久，最后要了一百块灵石，还逼我发了个誓：不许用这法子喂到第九个月。他把方子写在一张湿透的纸上，字都糊了，可我看得懂。我照方试了三次，前两次差点死在榻上。","果":{"灵石":-100,"悟性":4,"修为":200,"气血":-25,"寿元":-4}},{"名":"掀了赌局","文":"我把{人物}手里的竹牌全打落在地，喊了一声：这盘是假的，黑笼里的虫早死了，活的是笼底下的。场上炸了锅，几个押注的人冲上台去翻笼，果然翻出一具干壳。{人物}当天被人打断了腿，竹台也拆了。我拿回了自己的押注，却从此在这一带没人肯跟我同桌喝酒。","果":{"灵石":60,"声望":-5,"因果":2,"道心":3,"魔念":-1}}],"id":"nanjiang_042"},{"题":"蛊神残像","类":"秘境","重":2,"域":["nanjiang"],"境界":[2,9],"段":["{地点}的一处偏洞里立着一尊石像，约两人高，人身而虫首，八臂各持一物：瓮、铃、刀、盘、针、笼、藤、骨。石像的脚边堆着几十只小陶罐，罐口都朝着像，罐里的东西早已干成黑渣。{人物}说这是蛊神残像，门中不许拜，也不许砸，就这么搁着。","我绕到像后，看见石背上有字，刻得比正面深：神不食蛊，食皿。字下还有一行较小的，像是后来添上去的：某某年，弟子以身为皿，求一愿。我数了数，这样的落款有十九处。石像的八条手臂都断过又接上，接得很粗糙，用的是铜丝与虫胶。","{天象}，洞里本来没有风，石像的八臂却慢慢转了一分。我退了一步，脚下的陶罐被我碰倒一只，罐口滚到像前，罐里滚出一枚黑色的东西，落在地上打了个圈，正对着我的方向。{人物}在洞外喊了一声，声音发紧：出来，别站在像前。"],"择":[{"名":"献蛊求愿","文":"我把腕里的蛊逼出来，放在像前。石像的八臂停了，洞里的风声也停了，我识海里忽然多出一段极短的话：你要的东西，在你自己的骨里。我带着空空的腕走出洞，蛊没回来。三年后我确实得了想要的东西，可我再也没养过第二只蛊。","果":{"修为":300,"魔念":2,"因果":3,"寿元":-4,"声望":6}},{"名":"斫断八臂","文":"我拔剑，把石像的八条手臂一条条斫下来。每斫一条，洞里就响一声，响得极沉，像有人在另一个地方同时断了一根骨。斫到第八条时，石像的面孔裂开一道缝，缝里透出一点暗红。{人物}冲进来把我拖出去，说这门中的旧账，如今记到我头上了。","果":{"气血":-25,"修为":340,"因果":4,"声望":-6,"魔念":3}},{"名":"读字退出","文":"我把石背后那十九处落款一一读过去，记住每一个名字，然后躬身退出去。{人物}说我是头一个站在像前没求愿也没动手的人。他给了我一块极旧的蛊虫玉牌，说是从前某个落款人的遗物，留在洞里也是烂。玉牌背面刻着一句话：求愿者，皆成皿。","果":{"悟性":4,"器物":1,"道心":3,"因果":-2,"声望":3}}],"id":"nanjiang_043"},{"题":"雨林渡口","类":"人情","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}只有一个摆渡佬，一条船，撑了三十年。{人物}坐在船头，戴着斗笠，看不清脸。他说过河要收钱，可他不收灵石——收的是你身上的一样东西：一片指甲、一缕头发、或者一句真话。他说灵石在河上没用，河只认人身上的东西。","我说我不明白。他把船篙往水里一插，说这条河底下是一条大虫，睡了不知多少年。船从它背上过，它要闻一闻。你给的东西它挑，挑中了便放你过去；挑不中，船到河心就会沉。他说着，把船头的一只旧木箱掀开，箱里全是这些东西：指甲、头发、牙齿、还有一叠写了字的纸，字都糊了。","{天象}，河面上起了白雾。他把手伸出来，手心朝上，等。我摸遍全身，指甲可以给，头发可以割，真话也可以说一句。可我看见木箱最底层压着一块布，布上绣着一个小小的记号——那是青木谷的药袋，谷里的东西从来不出谷。"],"择":[{"名":"说一句真话","文":"我说：我杀过一个不该杀的人。他把手收回去，篙一点，船就动了。过河时船底确实有东西轻轻碰了三下，碰完便不再碰。上岸时他说：这句真话你留着，比灵石值钱。我没有回头。此后每逢夜里听见水声，我都要把那句话在心里再说一遍。","果":{"道心":3,"因果":-2,"悟性":2,"寿元":1}},{"名":"给一枚指甲","文":"我咬下一片指甲放在他手心。他捏着看了看，扔进箱里，说这片太薄，河大概不挑。船到河心果然晃了一下，晃得我伏在船舷上吐了半宿。等船靠岸，我把湿衣服拧干，发现十指里少的那一片，长回来的是黑色的。","果":{"气血":-15,"寿元":-2,"修为":80,"因果":1}},{"名":"审那块布","文":"我把木箱底层那块布抽出来，问他这是谁的东西。他沉默了很久，说三年前有个青木谷的药童过河，拿不出东西，就把这袋药押在船上，说回来就赎，一直没回来。他让我带走那些药，说药在箱里烂了不如救人。药是解蛊汤的材料，只是已经霉了一半。","果":{"灵材":1,"声望":4,"因果":-2,"道心":3,"灵石":20}}],"id":"nanjiang_044"},{"题":"换骨之术","类":"修行","重":2,"域":["nanjiang"],"境界":[1,8],"段":["{人物}说蛊道里有一门偏术，叫做换骨：让虫在骨头里住三年，把人的骨头一寸寸啃成虫质，啃完之后再长出来的骨，比金石硬三分。他说这话时，把袖子拉起来给我看他的小臂——皮下面的骨头在灯下是半透明的，能看见里面有细小的东西在游动。","他说换骨的人不怕刀砍，不怕坠崖，可也从此离不开蛊。虫养骨，骨养人，人养虫；三者断一环，人就成一具软袋。他说这术他传过四个人，两个死在换到一半，一个成了万蛊门的蛊皿，剩一个至今还活着，在{地点}做守墓人，已经不会说话。","{天象}，他从囊里取出一只罐子，罐里是黑色的浆。他说这是换骨的引，涂在骨上，虫才会进去。他把罐子放在我面前，说这术一旦做了，就再也回不去；做与不做，都是我自己的事，他不劝也不拦。灯芯烧得很短，屋外的雨打在竹叶上，一下一下。"],"择":[{"名":"受此换骨","文":"我把黑浆涂在左腿骨上，第三日虫便入了骨。那半年里，我几乎每夜都在痛醒，痛得咬烂过三条布巾。换完之后，我从三丈高的崖上跳下去，落地只震了一下。可我也从此只能吃带血的东西——普通的饭食，我的骨头不认了。","果":{"修为":320,"气血":-30,"寿元":-6,"魔念":2,"道心":1}},{"名":"力拒此术","文":"我把罐子推回去，说骨头还是自己的好。他笑了，说这话他四个弟子都说过，其中三个后来自己回来求他。他把罐子收回囊里，又问我愿不愿意学另一门——不换骨，只以虫气养骨，慢是慢些，十年才见一点成效，但人还是人。我点了头。","果":{"道心":4,"悟性":3,"修为":100,"寿元":3}},{"名":"夺浆自用","文":"我趁他转身，把罐子塞进怀里走了。回去之后我自己配了引，把黑浆涂满了两条腿，图的是快。虫入骨的日子比他说得更凶，我昏了七日，醒来时能站着走路，可膝弯里总有沙沙的响。后来听说{人物}那天没有追，只对着门口坐了一夜，说这术果然害人。","果":{"修为":400,"气血":-40,"因果":3,"魔念":3,"寿元":-10}}],"id":"nanjiang_045"},{"题":"寨老托孤","类":"人情","重":2,"域":["nanjiang"],"境界":[0,7],"段":["{地点}的寨老把我请进屋，屋里的火塘烧得很旺，旺得不像将死的屋子。他把一个七八岁的孩子推到我跟前，说这孩子是他的孙，寨子要搬了，搬去山那边，路上不一定过得去。他说：你是外人，外人带他走，寨里的东西就不跟着他。","我问为什么。他说这孩子生在菌毯夜祭那一夜，身上带着祖灵的记号，寨民都当他是祖灵的孙。可寨子这一搬，祖灵就要断供，断供的记号会自己找路——找一个还敢养它的活人。他说这话时，孩子的眼睛一直看着我，看不出怕，也看不出懂。","{天象}，屋外有脚步声围了上来，踩在泥地上很整齐。寨老把火塘边的木匣推给我，匣里是半袋灵石和一只小陶罐。他说：带走他，别回头；不带走，也别说出去。脚步声停在了门口。孩子伸手拉了拉我的衣角，拉得很轻。"],"择":[{"名":"携子出寨","文":"我抱起孩子，从屋后的竹篱翻出去，一路没回头。孩子在我怀里一声没吭，走到天亮才问：爷爷呢。我说爷爷要守着寨子。他点点头，就不再问了。此后这孩子跟着我走了大半年，学认药、学辨瘴、学看虫。他背上的记号，我一直没敢问他疼不疼。","果":{"因果":2,"声望":5,"道心":3,"灵石":60,"寿元":-2}},{"名":"留寨教他","文":"我把木匣推回去，说我不带他走，我留下来教他。寨老看了我很久，最后点了头。此后半年我住在寨里，教那孩子认药、辨瘴，也教他怎么在菌毯上走不回头。寨子终究还是搬了，我没有走，留在了空寨里。孩子的名字我一直记着，他每隔几年会回来看我一次。","果":{"道心":5,"悟性":3,"声望":4,"因果":-2}},{"名":"独取木匣","文":"我把木匣收进怀里，说这孩子我带不动。寨老没有骂，只把孩子拉到身后，说那就当我没说过。我出门时，围在门外的人自动让开一条道。走出十几步，我听见身后有人在念一个名字，念了三遍，念得很轻——那是我的名字。","果":{"灵石":200,"因果":4,"道心":-3,"魔念":1,"寿元":-3}}],"id":"nanjiang_046"},{"题":"合瓮之争","类":"宗门","重":3,"域":["nanjiang"],"境界":[1,7],"段":["万蛊门里有条不成文的规矩：两个蛊师若争一样东西，不斗蛊，不赌命，只合瓮。取一口空瓮，两人各把自己的一只蛊放进去，封上瓮口，三日不开。三日之后开瓮，还活着的蛊算两人的，谁的蛊被吃了，谁就认输。{人物}把空瓮推到我面前，说这一局争的是{地点}的采虫之权。","我在瓮壁上敲了三下，听声辨位。对方的蛊我见过，是他养了五年的合蛊，九格养一虫，凶得很。我自己的那只只是寻常货，唯一的依仗是它吃过{灵材}的粉，胆气比寻常虫大。{人物}说合瓮不讲手段，只讲结果，放进去之前，谁都可以做最后一件事。","{天象}，{人物}亲口念了封瓮的辞，把生牛皮蒙上去。瓮里立刻响起沙沙声，密得像雨落在干草上。我蹲在瓮边听了半个时辰，忽然听出一样不对：瓮里的声响不是两只虫在打，是三只——对方在封瓮之前，偷偷多放了一只进去。封泥上有一处新指印，还很湿。"],"择":[{"名":"当众揭破","文":"我把封泥上的指印指给众人看。{人物}凑近看了半晌，脸色沉下来，当场把瓮剖开。瓮里果然有三只虫，我那只已经被咬断了半截。门中按规矩废了对方的采虫之权，还罚他三日跪在窟口。我拿回了本该属于我的东西，从此在门里也多了个不肯跟我碰杯的人。","果":{"声望":8,"因果":2,"灵石":120,"道心":2}},{"名":"暗中添虫","文":"我没有声张，趁人不注意，又从袖里放了一只进去。三日后开瓮，瓮里只剩一只，胖得像枚鸽卵——那是第四只。众人都以为是对方的合蛊杀了两只，夸他厉害；他愣着，没敢应声。这一局我赢了，赢得不干净，可我也记住了瓮里那种沙沙声的味道。","果":{"修为":200,"声望":4,"魔念":2,"因果":3,"道心":-2}},{"名":"破瓮认输","文":"我抬手把瓮推倒，封泥在石上磕开，三只虫滚出来，在光下四散。我说不必争了，这一片采虫之权归他。{人物}愣了很久，最后把瓮片一片片捡起来。此后我在门中的位置低了一等，可那年{地点}出了一桩大事，是他半夜跑来叫醒的我。","果":{"声望":-5,"道心":4,"因果":-3,"修为":60,"寿元":2}}],"id":"nanjiang_047"},{"题":"血芝坡","类":"机缘","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的坡上长着血灵芝，长在埋过人的地方，一株要吸尽一具尸骨才成形。{人物}指给我看：坡上有七处土色发黑，像被火烙过，那底下都是尸。血芝就在黑土上探头，红得发暗，边缘卷着一圈白。他说采血芝有讲究，不能用刀砍，得用血引。","他把手割开，血滴在黑土上，血一渗下去，那株芝便微微一颤，从土里又拔出一寸。他说这东西只认血，血给够了，它自己会出来；血给不够，它会缩回土里，缩个三五年不出来。他把伤口按在土上，脸上已经没了血色，说这一株再拔不出，他就得在这儿躺一晚。","{天象}，坡下传来细碎的响动，不是虫，是别的东西在土里挪。{人物}的脸忽然白了，说糟了，血芝的味把坡下的东西引来了。他伸手抓住芝柄，想硬拔，可芝纹一颤又缩了回去。我把腕子伸出去的当口，看见黑土上浮起一层指印，一个接一个，从坡底往坡上按。"],"择":[{"名":"割腕引芝","文":"我把腕子割开，血一股股淋在黑土上。芝身一颤一颤往外拔，拔到第三寸，整株连着须根从土里出来了，红得像一块新肉。我一把攥住，塞进{人物}怀里，扶他往下走。走出坡口时我回头看了一眼，那些指印停在坡腰。这一株后来换了一大笔灵石，我们平分。","果":{"气血":-35,"灵材":1,"灵石":150,"声望":3,"寿元":-2}},{"名":"弃芝救人","文":"我拉起{人物}就走，芝留在土里，血还在往下渗。跑到坡底时他回头看了一眼，什么也没说，只是把手上的血在衣襟上抹了。那株芝我们没有采到，可他那条命保住了。半年后他自己回坡上，带着三名弟子，把七处黑土全起了出来，一株也没剩。","果":{"道心":4,"声望":4,"因果":-2,"气血":-5}},{"名":"以佣血喂芝","文":"我把他按在土上，用刀在他另一条臂上又开了一道口子，让血一直往土里流。芝拔出来了，很大，红得发黑。他伏在土上喘，喘得像风箱。我把芝收进囊里，给了他一半灵石。他接了灵石，什么也没说，从那以后再没跟我一起进过山。","果":{"灵材":2,"灵石":200,"因果":3,"道心":-3,"魔念":1}}],"id":"nanjiang_048"},{"题":"卖药人的秤","类":"市井","重":3,"域":["nanjiang"],"境界":[0,6],"段":["{地点}的市口摆着七八副药摊，{人物}的摊子最小，只摆三样：解蛊汤的干料、引虫香、还有一小罐百草蜜。他的秤很旧，秤杆上刻着密密麻麻的记号，每一个记号都是一味药的份量。他说这秤是他师父传的，师父又是从青木谷里带出来的，称的不是轻重，是分寸。","我蹲下问他解蛊汤怎么卖。他抬头看了看我，说你要解的不是蛊。我愣了。他指了指我腕上那道疤，说这疤是自己割的，蛊在里头顶着疤往外拱，是饿的。他说他这秤能称药，称不了人心——你要么多喂血，要么趁早剥了。他说得平淡，说着替旁边一个人包了药。","{天象}，一个披蓑衣的人走到摊前，把一袋灵石放在秤盘上。药摊的秤盘很小，那袋灵石一放上去，秤杆便直直地沉到底。{人物}脸色一变，说这秤沉底，是毒的分量。那人把兜帽掀起来，露出一张浮肿的脸，说他知道，他是来买一味能让人死得慢一点的药。"],"择":[{"名":"替他寻药","文":"我拉那人到一旁，问他中的是什么毒。他说是万蛊门的债蛊，虫在腹中，一日吃一线。我回头找{人物}，他从摊底摸出一小包东西，说是缓虫的粉，只能缓，不能解。我把粉给了那人，又给了些灵石让他去青木谷。他跪下磕了个头，磕完就走了，走得很慢。","果":{"灵石":-80,"声望":5,"因果":-2,"道心":3}},{"名":"买空他的秤","文":"我把摊上三样药全买了，连那杆旧秤也要。他不肯卖秤，我就把价加到他自己都不好意思。最后秤归了我，药也归了我。我用那杆秤称了许多次药，也用它称过自己的心——每一回秤杆沉底，都不是好事。后来我才知道，他卖秤那日，是他师父的忌日。","果":{"灵石":-200,"器物":1,"悟性":2,"灵材":2,"因果":1}},{"名":"揭他秤底","文":"我把秤翻过来，发现秤杆里塞着一小块虫玉——难怪这秤称什么都沉底。他不是在称毒，是在引人上钩：谁信了这秤，谁就得把整副家当拿出来买他的药。我当着市口的人把虫玉抠出来，摊子当场被砸了。他蹲在碎瓦里，一直没有说话，也没有走。","果":{"声望":4,"因果":2,"灵石":60,"道心":1,"魔念":-1}}],"id":"nanjiang_049"},{"题":"弃蛊求生","类":"人情","重":2,"域":["nanjiang"],"境界":[0,6],"段":["在{地点}的破屋里，我撞见一个弃蛊人正在给自己开膛。他用一把短刀在胸口划了一道，手指伸进去，慢慢往外抠，抠出一块指甲大的东西，落在地上还在动。屋里的血腥味压过了{天象}。他抬头看见我，没有惊，只说了两个字：坐吧。","我坐下，他用布把伤口缠紧，一边缠一边说，他弃蛊弃了九年，散虫一直在皮肉里走，每年要走一遍。走的时候不疼，只是痒，痒得人想把自己翻开。他说这话时手很稳。我看着地上那块东西慢慢爬，爬到一个角落，伏住不动了。","{天象}，他忽然咳起来，咳得胸口那道新伤裂开。他说他不怕死，怕的是死得慢了——人一咽气，散虫就从里头涌出来，涌到最近的一个养蛊人身上。他抬眼看我，眼睛很清。他问我能不能在他死后放一把火，把整间屋子连他一起烧干净，别让虫跑出去。"],"择":[{"名":"应他火葬","文":"我答应了。三日后他死在屋里，死时一直睁着眼。我按他说的把屋门闩死，从屋顶浇了油，点了火。火里爆响了一整夜，像有千百只虫在同时炸开。天亮后我把灰收进一只陶罐，埋在林缘。我掌心那道旧疤在火灭的一刻凉了一下，凉得很舒服。","果":{"道心":5,"因果":-3,"声望":4,"寿元":3}},{"名":"劝他再养","文":"我说与其等死，不如重新养一只虫，把散虫压回去。他听完笑了很久，说这话他也对自己说过。他到底没有养，只把最后一点力气用来教我辨散虫的走法：皮下一热一凉，就是虫在换骨。他说完这些，就把刀推到我面前，说该动手的，总要有一个人。","果":{"悟性":4,"修为":80,"道心":2,"因果":1}},{"名":"收拾其蛊","文":"我趁他咳得厉害，把地上那块东西用蛊针挑进笼里。散虫归笼后安静下来，可整间屋子的凉意跟着散了——虫在他身上留了九年，走了，人也就空了。他当夜死的，死时很轻。我把虫带走，养在自己瓮里，从此每到月圆，瓮里会有一声很像人的叹气。","果":{"修为":200,"魔念":2,"因果":3,"道心":-2,"灵材":1}}],"id":"nanjiang_050"},{"题":"千足藤林","类":"秘境","重":3,"域":["nanjiang"],"境界":[1,7],"段":["{地点}的树都是空的，树心被藤吃尽了，只剩一层皮撑在原来的位置。走进林中能听见细响，那不是风，是藤在树上走。{人物}说千足藤白日装作枯枝，夜里整条从树上下来，绕住睡着的活物；缠满三匝便吸髓，七日只剩一张皮挂在树上。他说话时压得极低，说藤认声，不认人。","我们专挑正午进林，那时日头最烈，藤足尽缩，藤身如同一根真枯枝。走到林中段，我看见一棵树上挂着一张兽皮，皮还完整，四肢垂着，像随时会动。{人物}伸手点了点那皮，说这是去年的，藤吃完之后会
