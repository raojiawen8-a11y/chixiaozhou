,{"id":"ximo_004","题":"验沙镜下的赝","类":"市井","重":5,"域":["ximo"],"境界":[0,6],"段":["{地点}的黑市开在正午，因为白日里没人肯点灯，点了灯便要多交一份油钱。{人物}摊前摆着一小堆{灵材}，说是从{地点}底下刚起的货，价钱低得让人心跳。他左手拿着{器物}，对着日头一晃一晃。","你接过那面镜子照了照，镜底的纹路是旧的，可纹路里嵌的沙却是新沙——新沙潮，旧沙燥。这一手叫洗镜，把旧镜子泡进新沙里养三天，能骗过九成买主。{祸患}的事你听过不止一回，此刻却正是自己撞上了。","{人物}笑着催你，说后头还有人等着看货。旁边{妖异}的皮子挂了半排，血还没干透。你手里那面镜子，忽然比货更沉。"],"择":[{"名":"当众揭破","文":"你把镜子举起来对着日头，让周围人都看见老纹里的新沙。摊子当场砸了半边，{人物}被黑市行会的人拖到后巷，出来时脸肿了一半。行会当晚免了你三个月的过路抽头，可你也从此上了他的名单。","果":{"声望":10,"灵石":20,"因果":-1,"魔念":1}},{"名":"压价买下","文":"你不揭破，只把价压到三成，说这镜当个摆设也值。他咬着牙卖了，收钱时骂了一句极难听的话。你把镜子拆开，取走里面的铜母，剩下的壳转手卖给了一个不识货的行商，倒还赚了些。","果":{"灵石":90,"悟性":1,"声望":-3,"因果":1}},{"名":"静退不买","文":"你把镜子还回去，只说了一句沙不配镜。他脸色变了变，没敢拦。你走出市口时，后头有个穿麻衣的人跟上来说，肯说实话的人不多，往后在绿洲，货可以赊给你三日。","果":{"声望":5,"悟性":2,"灵石":0}}]},{"id":"ximo_005","题":"沙下的铜锁","类":"秘境","重":3,"域":["ximo"],"境界":[1,8],"段":["{天象}。沙暴过后，{地点}的地面塌出一口井也似的大洞，洞底露出一角石墙和一具{器物}。洞沿上的沙还在往下淌，像有人在上头慢慢筛面。{人物}说这是沙下古城的老门，二十年露一次面，露一次死几个人。","你俯身看那把锁。锁是青铜的，锈得只剩骨，可锁孔是好的，孔里塞着一小片{灵材}，能压住锈气。旧话本子里写过这里头的东西：一城人的账、一城人的债，还有半部能让人一步登天的{功法}。","洞底吹上来的风是凉的，带着水味。这沙海底下怎么会有水，没人答得出。{人物}已经把绳子结好了，绳子另一头，就要系在你的腰上。"],"择":[{"名":"下洞探锁","文":"你吊着绳子下去，脚一沾地就听见底下传来钟一样的回响。锁开得很轻，门后是一间空堂，堂中坐着一具还保持着算账姿势的枯骨，手边是一本翻开的{器物}。你只拿了书上压着的三样东西，返身时绳子被洞沿的沙磨断了一半。","果":{"修为":120,"悟性":3,"灵材":2,"寿元":-4,"因果":1}},{"名":"封洞守秘","文":"你把洞沿的沙推回去，又搬了三块石头压住，只从锁孔里取出那片{灵材}。{人物}骂你败家，第二日却带着一队人回来，洞已重新塌死。他一言不发地看了你很久，最后说，你这种人活不长，但死得干净。","果":{"悟性":2,"声望":8,"灵材":1,"灵石":-30}},{"名":"招人共掘","文":"你把洞卖给了{宗门}的采办，换了三十块灵石和一张不认人的字据。三天后洞被挖成一个大坑，挖出的东西装了十七辆驼车，也抬出了十一具尸首。你分到的那份，正好够买一只好水囊。","果":{"灵石":60,"声望":-5,"因果":3,"魔念":1}}]},{"id":"ximo_006","题":"账房先生的笔","类":"宗门","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的柜上，{人物}把一本{器物}推到你面前。他说你的驼队上个月在这一柜赊了水、赊了草料、赊了两副掌，连利息一并算，共是二百七十块灵石。数目他报得比你自己记得还清。","你说这账不对，他便把每一笔念给你听，连你赊水那日刮的是什么风都记得。金沙楼认灵石不认人，这一条在西漠比沙还硬。柜后的墙上挂着一块匾，四个字：欠者必还。{天象}，街上驼铃稀落。","他把笔搁在那本{器物}上，等你说话。屋里另有两个伙计站着，不算凶，也不算和气，只是站在那儿。"],"择":[{"名":"如数清账","文":"你倾其所有付了二百七十块，柜上多收了你三块的火耗，说是规矩。走出金沙楼时你身上只剩一把沙，可账房先生亲自送你到门口，说往后你在西漠任何一处金沙楼的柜上，都可以先赊三十块。","果":{"灵石":-270,"声望":14,"因果":-2,"悟性":2}},{"名":"翻账对质","文":"你逐条翻那本簿子，终于翻出一笔重复记的水钱和一笔根本不是你的草料。账房先生看了半晌，把笔一搁，划掉两行，说这三年来你是头一个真去翻的，其余的只哭。这一翻，替你省了一百一十块。","果":{"灵石":-160,"悟性":4,"声望":6,"因果":1}},{"名":"赖账走人","文":"你趁夜带驼队绕出了绿洲，账没还，人也走脱了。三个月后你在{地点}的泉边打水，发现水里有股极淡的苦味，回头看见三个穿麻衣的人蹲在坡上，正慢条斯理地磨刀，谁也没抬头看你。","果":{"灵石":250,"声望":-18,"魔念":2,"因果":3,"寿元":-5}}]},{"id":"ximo_007","题":"龙涎坑的守兽","类":"机缘","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}往西六十里，有一处塌了半边的土坑，坑里渗着一层琥珀色的黏涎，这就是沙海龙涎。{人物}说这坑三年才出一次涎，出涎的夜里必有{妖异}盘在坑底，谁伸手谁掉指头。","{天象}。你们在坑沿蹲到后半夜，果然听见底下有鳞片刮沙的声响，一声长，一声短，像是在数数。龙涎在月光下微微发亮，一勺能换三块灵石，可那东西的头已经探出了沙面，眼睛是两粒黄沙。","{人物}把绳子往你手里塞，自己退了三步。他说他家里还有两个孩子，说得坦坦荡荡，一点不脸红。坑底的声音停了，仿佛也在等你拿主意。"],"择":[{"名":"抢涎先手","文":"你借着风沙遮眼，一勺铲进坑底，转身便滚。背后一声闷响，沙蟒撞在你方才跪的地方，掀起的沙打在背上像鞭子。你带出的涎只够装半个水囊，卖出后换了八十块灵石，可脊背上的伤养了两个月。","果":{"灵石":80,"灵材":1,"气血":-18,"寿元":-2,"修为":25}},{"名":"先斩守兽","文":"你与{人物}合力把沙蟒引出坑，缠斗半夜，斩下它的头。蛇身里翻出一枚早年吞下的{灵材}，比龙涎值钱得多。可那夜之后坑塌了，三年之内再不出涎，附近的走沙客骂了你一整个冬天的祖宗。","果":{"修为":90,"灵材":3,"声望":-8,"气血":-25,"因果":2}},{"名":"抽身退走","文":"你把绳子还给他，说这钱他不该拿孩子的命去换。他怔了很久，最后也蹲下不干了。后来那坑被流沙盗用火油烧了一夜，沙蟒死在坑里，涎也糊成了黑渣，谁也没落着好。","果":{"声望":7,"悟性":2,"道心":1,"灵石":-5}}]},{"id":"ximo_008","题":"沙暴里的木桩","类":"天象","重":5,"域":["ximo"],"境界":[0,6],"段":["{天象}刚起的时候，天还是白的，等到黄沙糊住眼睛，你已经找不着驮队的影子了。你在沙里摸索，抱住了半截拴着{器物}的木桩——这是老驿道留下的路标，桩上刻着三个方向，两个已被沙填平。","驼铃在风里响，可响得不对，一会儿在左，一会儿在右，像是有人抱着铃在跑。你想起{祸患}的旧话，走沙的人最怕的不是没水，是听见救命的声。手心里的木桩渐渐被沙磨得发烫。","风里有个声音在念你的名字，念得很慢，像是熟人。{人物}曾说过，沙暴里应你的，多半不是人。你要不要应，就在这一口气里。"],"择":[{"名":"闭口不应","文":"你咬住袖子，一声不应，只死死抱着木桩，任那声音从耳边绕到脚边。天亮时风停了，你的耳朵里流出一线血，木桩被你抱得凹进去一块。驼队的人都说你命硬，可你再没听清过左边的人说话。","果":{"气血":-15,"悟性":3,"修为":30,"寿元":-1}},{"名":"应声而寻","文":"你循声走了半里，果然摸到一头跪在沙里的骆驼，驼背上还绑着{灵材}和一具冻僵的人。你把货卸了，把尸首留在原地。回营后没人问那货的来路，只问那死人叫什么，你说不知道。","果":{"灵石":110,"灵材":1,"因果":2,"声望":-4}},{"名":"刻桩留记","文":"你抽出刀在木桩上刻下自己的名字和今日的时辰，再把三条岔道一一辨清。天亮后有三支驼队循着这根桩找到了道，其中一支的首领后来在金沙渡替你说过一句话，抵得上一百块灵石。","果":{"声望":11,"灵石":30,"悟性":2,"气血":-8}}]},{"id":"ximo_009","题":"驼铃摄魂","类":"奇闻","重":3,"域":["ximo"],"境界":[0,7],"段":["{地点}的夜里，有人在你帐外摇{器物}。铃声不急不缓，一声一声，恰好落在心跳的缝里。你起初以为是谁家的驼脱了缰，掀帘出去，只见沙地上有一行赤脚印，一直走到帐门口就没有了。","{人物}听说后脸色发白，说这是《驼铃摄魂咒》，沙盗里有人会使，专挑落单的护卫下手，铃声摇够九十九下，人就会自己走出营地，走到沙里躺下。你数了数，昨夜那铃声，摇了六十七下。","{天象}，帐外的沙面上又有细响。这次你听清了，铃声是从沙底下传上来的。身旁的人都睡着，只有你醒着。"],"择":[{"名":"循声下沙","文":"你刨开沙，挖出一只埋在沙下三尺的铃铛，铃舌是用人的指骨做的。你把铃埋到更深的沙里，压上三块石头。此后营里再没响过，可你每夜都会自然醒在同一个时辰，再也睡不沉。","果":{"悟性":3,"修为":40,"气血":-10,"道心":1}},{"名":"循迹追人","文":"你顺着赤脚印记追出七里，在一处背风的沙窝里逮住一个瘦得像少年的沙盗。他不挣扎，只把铃铛递给你，笑着说这铃是他师父的，师父死了，铃就归他。你没杀他，带他回了营，他给你干了三年活。","果":{"声望":6,"修为":50,"灵石":-20,"因果":-2}},{"名":"堵耳熬夜","文":"你撕了半幅衣角塞住耳朵，抱着刀坐了一夜，铃声摇到第九十八下停了，第九十九下始终没来。天亮时营里少了一头骆驼和一个脚夫，沙上有一行走得很整齐的脚印，一直通往{地点}。","果":{"气血":-12,"悟性":2,"灵石":-30,"因果":1}}]},{"id":"ximo_010","题":"一笔死账","类":"灾祸","重":4,"域":["ximo"],"境界":[0,6],"段":["{人物}死在{地点}的沙窝里，死时手里还攥着一块{器物}。他是你驼队里赊账最多的一个，欠金沙楼一百八十块，欠驼帮两副掌，欠你半囊水。人一死，账就转到活人头上，这是西漠的规矩。","金沙楼的人当天就到了，账房先生翻开簿子，平静地说：他无亲无故，按例由同行的人分摊。驼帮的人也来了，站在另一边，都不催，只是站得很稳。{天象}，八月的沙烫得能煎蛋。","{际遇}——他死前把这块牌子塞给了你。牌子上没有名字，只有一个火漆印的半边。你若把牌子交出去，账有人认；若不交，这百来块的债就压在你背上。"],"择":[{"名":"认账还债","文":"你把身上能卖的都卖了，又替金沙楼白跑了三趟远道，才算把这笔死账平掉。账房先生收账时多看了你一眼，说西漠欠账的人多了，肯替死人还的，三年见不着一个。那年冬天你没饿死，靠的是他赊的一袋黍。","果":{"灵石":-180,"声望":16,"因果":-3,"寿元":-3}},{"名":"交牌脱身","文":"你把牌子交给账房，说这是死人留下的唯一凭据。他验了火漆，当场把账划了，说这印是流沙谷的，债归贼。你脱了身，可那天夜里，有个独臂的人在帐外站了很久，最后什么也没说就走了。","果":{"灵石":0,"因果":2,"魔念":1,"声望":-4}},{"名":"持牌查底","文":"你留着牌子，自己顺着火漆的纹路摸到了黑石城，查出这死人原是替流沙盗洗货的账房，账本上还记着七条暗道的分润。你把这事卖给了金沙楼，得了一笔不小的赏，也从此被人惦记。","果":{"灵石":140,"悟性":3,"因果":3,"魔念":1,"声望":-6}}]},{"id":"ximo_011","题":"守碑人的杖","类":"修行","重":3,"域":["ximo"],"境界":[0,5],"段":["枯骨寺外有一片碑林，碑上刻的不是名号，是债。{人物}赤着脚在碑间走，一手拄{器物}，见你要进寺，横杖拦下。他说凡入门者，先得念一块碑，念完了，才准踏那三级石阶。","{天象}。你随手挑了一块，碑上写着某年某月，一名走沙客为活命舍了同伴，后来富甲一方，晚年把家财全捐了寺里，只求碑上添一句“他也怕过”。字很浅，像是刻的人手一直在抖。","守碑人等你念完，也不催，只把{器物}横在石阶前。风把碑缝里的沙吹出来，簌簌地落在他脚背上。"],"择":[{"名":"照碑自省","文":"你把那块碑从头念到尾，念到“他也怕过”时喉咙发紧。守碑人点点头，让开半步。寺里没有传你什么神通，只教了一套《埋骨禅定》，说夜里睡不着就坐一坐，把怕过的事一件件数清。","果":{"道心":3,"悟性":3,"修为":45,"寿元":2}},{"名":"另择功碑","文":"你绕到碑林深处，挑了块刻着大功德主的碑，字金灿灿的，念得也顺口。守碑人看了你一眼，没拦，也没让。你在寺里住了七日，什么也没学到，走时他把杖往地上一顿，说：你念的是别人的脸。","果":{"修为":10,"声望":3,"道心":-2,"悟性":1}},{"名":"直闯石阶","文":"你不念碑，抬脚就迈石阶。杖子落在你肩胛上，只一下，人就跪了。守碑人没再打第二下，只说寺门不拦人，拦的是不肯认账的心。你养了半个月的伤，倒把那段《赤足行沙法》的起手式看会了。","果":{"气血":-20,"修为":55,"悟性":2,"因果":1,"声望":-3}}]},{"id":"ximo_012","题":"日曜峡的热石","类":"机缘","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的谷底终年不见水，石头却被晒得会自己发热。你在峡底歇脚，坐着的石头忽然烫了一下，翻过来一看，石面上结着一层细密的{灵材}，像霜。{际遇}，说的正是这种石头。","{人物}远远喊你放手，说那是日曜晶养出来的胎石，热是活的，摸久了会把人的血也烧起来。他说这话时，自己却蹲在另一块石头上，袖子底下藏着一把小凿。{天象}，谷里没有一丝风。","你手心已经出汗，掌下的{灵材}还在升温。凿是不难凿的，难的是凿完之后，人还站得起来。"],"择":[{"名":"趁热凿石","文":"你一凿下去，石皮迸开，里面是一窝指头大的日曜晶，热得像刚出炉的铁。你捧了七颗，手心的皮烫掉一层，三个月握不住筷子。可这七颗晶换来的灵石，够你在绿洲住上一年，还置了一副好驮架。","果":{"灵石":160,"灵材":2,"气血":-22,"修为":30}},{"名":"以石炼体","文":"你不凿，反而把手掌贴在石上，按《日曜煅体诀》的吐纳硬受了三个时辰。皮焦了，骨却没伤，起来时浑身像被重铸了一遍。{人物}看得直摇头，说这种练法，十个人里九个烧死。你恰好是那一个。","果":{"修为":110,"气血":-30,"寿元":5,"悟性":2}},{"名":"引水淬石","文":"你把半囊水全浇在石上，热气腾起，石皮自己裂成两半，里头晶石完好，只是失了热。{人物}骂你糟蹋水，等他看见那两半石壳里竟各藏一颗晶，骂声就变成了念叨。水比晶贵，可他没再说什么。","果":{"灵石":120,"灵材":2,"悟性":2,"声望":3}}]},{"id":"ximo_013","题":"蜃楼里的席","类":"奇闻","重":3,"域":["ximo"],"境界":[1,9],"段":["{天象}，你在{地点}的沙脊上看见一座城。城有城门，门里有人摆席，席上坐着十几个看不清脸的人，正举杯朝你这边让。风一过，城影便薄一分，可那杯里的酒色始终没淡。","{妖异}的说法是，蜃景里请客的从不付账，去的人多半回不来。可在{地点}传的老话里，蜃景席上摆的器皿都是真的，只是得在城散之前走出来。你脚下这道沙脊，正对着城门。","{人物}拽住你的袖子，说他见过三个人朝蜃楼走，两个没回来，一个回来了，回来时满嘴是沙，说自己吃了三十年的席。他手很凉，捏得很紧。"],"择":[{"名":"入席取器","文":"你在城影散尽前抢进城门，只来得及抓一只杯。杯是真玉的，凉得刺骨，走出三步，回头已是一片平沙。杯里的酒你没敢喝，倒出来是一小撮沙。这只杯子后来换了二百块灵石，你却总梦见那席上有人问你为何不坐。","果":{"灵石":200,"悟性":2,"因果":3,"魔念":1,"气血":-10}},{"名":"射影破幻","文":"你张弓朝席上射了一箭，箭穿过人影，钉进沙里。蜃景散得比往常快，沙脊上留下一支箭和一小片焦痕。{人物}说你胆子太大，可那天之后，他走路时总走在你半步之后。","果":{"修为":40,"声望":5,"悟性":1}},{"名":"背身不看","文":"你转过身，蹲在沙脊背面数自己的手指，一直数到天光转白。{人物}说你是他见过第一个不肯进城的。回程时你捡到一枚沙里半埋的铜钱，铜钱上的字眼熟，是那席上某人的酒盏底款。","果":{"道心":2,"悟性":3,"灵石":20,"因果":-1}}]},{"id":"ximo_014","题":"三箱货的暗号","类":"市井","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的驿棚里堆着三只一模一样的{器物}，箱角都用麻绳打了同一个结。{人物}说这是白驼商会的换货规矩：收货的人不许开箱，只认结，一箱是盐，一箱是药，还有一箱，连他也不知道是什么。","你接的活是把这三箱送到{地点}，路上不许停，不许看，不许问。定金给得爽快，可你数了数，箱子比来时说好的多了一只。{天象}，棚外的驼卧着，谁也没抬头。","{人物}低声说，多出来那只，是给他的私货，到了地头自然有人来领。他说得很轻，眼睛却一直盯着你的手。你手上正握着一把割绳的刀。"],"择":[{"名":"开箱验货","文":"你割开那只多余箱子的绳结，里头是十二把裹着油布的新刀，刀身没有记号。商人的脸当场白了。你把刀重新捆好，说这趟活我接，但多要三十块。他给了，只是从此再没找过你。","果":{"灵石":90,"悟性":2,"因果":1,"声望":-2}},{"名":"原样送到","文":"你一句不问，三只箱子原样送到{地点}，收货的人验了结，付清尾款，还多给了一个封着蜡的纸包。回程路上你才拆开，里面是三块日曜晶和一句口信：不问的人，以后好共事。","果":{"灵石":130,"声望":6,"灵材":1,"因果":-2}},{"名":"多箱卸货","文":"半路上你借口骆驼失蹄，把那只多余的箱子埋进{地点}的沙里。到了地头，收货的人点了两遍箱数，什么也没说，只把价压了三成。三个月后有人在白骨滩挖出一箱刀，杀过七个人。","果":{"灵石":-40,"魔念":1,"因果":3,"悟性":1}}]},{"id":"ximo_015","题":"收尸人的话","类":"人情","重":3,"域":["ximo"],"境界":[0,6],"段":["{地点}的死人是不许埋的，埋了会被沙掀出来，所以要请收尸人。{人物}背着一卷麻布，在尸首边蹲了半个时辰，先把人脸擦净，再把手里的{器物}掰出来，最后才卷人。他做得很慢，像在做一件要紧的活。","这回死的是个走沙客，怀里揣着{灵材}，还有一张写着地址的纸条。收尸人把纸条念了一遍，忽然停了，说这地址是他老家的。他抬头看你，眼里的东西不是难过，是一种算不清的账。","{天象}，沙已经漫过死人的膝盖。收尸人问你，这东西是该随人埋了，还是该送到纸上写的去处。他没说哪样对，他只是手一直在抖。"],"择":[{"名":"送物还乡","文":"你替他把东西送到纸条上的地址，那是一座塌了半边的土屋，屋里只有一个瞎眼老妇。她把{灵材}贴在脸上闻了半晌，说这是我儿子的手味。你没要谢礼，走出七里才发觉眼睛发涩。","果":{"声望":10,"道心":2,"因果":-2,"灵石":-30}},{"名":"随尸同埋","文":"你帮收尸人把东西和人一起卷进麻布，埋进沙里，又在上面压了三块石头。收尸人说这样好，人走的时候手里有东西，就不会在半道回头。那年冬天这条道没出怪事，也没人再提起那个人。","果":{"因果":-1,"悟性":2,"声望":4,"灵石":10}},{"名":"折价抵账","文":"你把{灵材}折了价，抵了死人欠驿站的三十块水钱，剩下的自己收了。收尸人看着你把东西揣进怀里，什么也没说，卷人的时候手比方才快了些。他后来不再替你收尸。","果":{"灵石":70,"魔念":2,"因果":2,"声望":-7}}]},{"id":"ximo_016","题":"盐霜水","类":"灾祸","重":4,"域":["ximo"],"境界":[0,5],"段":["驼队断水第三日，你们在{地点}找到一片结着白霜的洼地。{人物}跪下去舔了一口，说甜。你看着那层霜，想起老辈的话：盐霜水喝下去，人会在半日之内渴得更凶，然后躺着不动，眼睛睁着。","{天象}。有人已经开始用{器物}刮霜，刮下来的白末装了小半袋。驮队里最年轻的那个脚夫先喝了，喝完还笑，说比绿洲的井水还清。你喉咙里像塞了一把沙，说不出拦他的话。","沙脊那边还有一线绿，是不知多少里外的{地点}。往那边走，也可能走不到。留在这里，至少眼前有水。"],"择":[{"名":"强令弃水","文":"你把那袋白霜全倒在沙里，用脚踩实。三个脚夫扑上来打你，你被打掉了两颗牙，也没松脚。第二日有两个偷喝的人生死不知，剩下的六个人跟着你走了十一里，找到了绿洲。","果":{"气血":-15,"声望":9,"寿元":3,"灵石":-20,"修为":30}},{"名":"煮霜取盐","文":"你让人把白霜加水煮开，撇去浮沫，熬出小半碗粗盐。盐能换钱，也能兑水。你们靠这半碗盐在沙脊上跟一支商队换了三囊水，代价是丢了两头骆驼和一整天脚程。","果":{"灵石":45,"灵材":1,"悟性":2,"声望":3}},{"名":"分道各走","文":"你把水分成两份，说不愿走的自便。五个人留下来刮霜，你带三个人往绿洲。三日后你回头望，那处洼地静得像一块白布。你没再回头看第二次，只是从此不肯喝别人递来的水。","果":{"因果":3,"魔念":1,"气血":-10,"道心":-2,"寿元":2}}]},{"id":"ximo_017","题":"关下的抽头","类":"争斗","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}是进出西漠唯一有墙的地方。{人物}穿着官差的皮甲，把你的驮架一一翻过，最后指着那捆{灵材}，说这货没有引票，按例要抽三成，抽完还得留一夜，等上头验。","你身上是有引票的，只是被雨浸过一次，字迹淡了。官差把票拿在手里，对着日头看了很久，然后慢慢折起来塞进自己怀里。{天象}，关下的队伍排了半里，没人吭声。","{地点}的沙墙上贴着新告示，他说要留一夜。夜里关后的仓房起过火，烧掉的货从来查不出账。你把缰绳攥紧，缰绳另一头是七头骆驼和这一趟全部的本钱。"],"择":[{"名":"递上私钱","文":"你塞了二十块灵石，他当场把票还你，还在上头补了个鲜红的印。过关时他拍着你的驮架说快走。你走出半里，听见后面有人被扣了货。这二十块花得值，只是你从此不太愿意看那双补印的手。","果":{"灵石":-20,"因果":2,"魔念":1,"声望":-2}},{"名":"当众讨票","文":"你抬高声音把引票的编号念了出来，念给后头排队的人听。官差的脸涨红，把票摔回你脸上，货也放行了。三个月后你再来，关上的守军换了人，新来的官差认得你的名字。","果":{"声望":12,"因果":-1,"灵石":0,"气血":-5}},{"名":"绕道夜行","文":"你把驮队拆成三股，趁夜从关侧的干河床绕过去，多走了两天，骆驼掉了膘，一头小驼陷进沙窝，只能宰了。到了绿洲，货是齐的，人也是齐的，只是你在关的名册上从此是空白的。","果":{"灵石":-60,"气血":-12,"悟性":2,"因果":-2,"魔念":1}}]},{"id":"ximo_018","题":"千窟的画","类":"秘境","重":3,"域":["ximo"],"境界":[1,9],"段":["{地点}有一千个窟，真正能进的只有十一个。你跟着{人物}爬上去，窟口的壁画被风啃得只剩半边，画的是一个人站在沙丘上，沙丘下伸出一千只手。画工在每只手上都点了红，红是用朱砂调的{灵材}。","{天象}。窟里越走越深，壁画也越来越新，最后一幅竟像是昨天才画上的，画中的人穿着和你一样的衣，站在同一个窟口，正回头看你。{际遇}的事，原来不是故事。","{人物}说这窟里供的是“回头者”，凡是看懂了画的人，都得出一个愿，出愿之前，画是不会让你下山的。他已经在窟里坐了三天，还没想好许什么。"],"择":[{"名":"许愿留名","文":"你在壁画空白处刻上自己的名字，愿的是“走得出去，也回得来”。刻完那一笔，窟里忽然通了一道风，吹得人睁不开眼。{人物}说你许得太贪，可你下山那日，沙暴确实让开了半里。","果":{"声望":8,"修为":70,"悟性":3,"因果":1,"寿元":-2}},{"名":"毁了壁画","文":"你用刀把那张回头的人脸刮去，朱砂见风即黑。{人物}扑上来拦，晚了。窟在半个时辰后塌了半边，你们从碎石里爬出来，各带了一身的伤。那之后这条道上的窟，剩了九个。","果":{"修为":60,"气血":-25,"因果":3,"魔念":2,"声望":-8}},{"名":"只抄其画","文":"你不许愿，只把壁画上那一千只手的排布抄在布上，抄了整整一夜。下山后你把抄本卖给了金沙楼，他们转手卖出三十份。你自己留的那份，后来被一个老阵师看中，教了你《压沙诀》的半篇。","果":{"灵石":70,"悟性":4,"修为":40}}]},{"id":"ximo_019","题":"哑童的水","类":"人情","重":5,"域":["ximo"],"境界":[0,4],"段":["{地点}的市口，一个哑童举着两皮袋水叫卖，一袋一升，价钱是市价的两倍。他不能说话，只用指头比价，比得很硬，一分不让。{人物}说他爹是走沙客，去年折在{地点}，这水是他自己一桶一桶从泉里背来的。","{天象}，市口上的水价还在涨。你看见有个行商把水袋抢过去掂了掂，又摔回地上，说这水有腥味。哑童扑过去把袋子搂进怀里，摔了的那个人抬脚就要踹。","围观的人都往后让了半步，让出一小块空地。{天象}，你站在最前面，手里还捏着刚买的干粮。"],"择":[{"名":"买下全部","文":"你把两袋水全买下，按他的价，还多给了一块。他愣了很久，然后把水又倒回你手里半袋，指着自己的肚子，意思是他也得喝。那天晚上你分他吃了半块干粮，他没吃，收进怀里说留着明天。","果":{"灵石":-40,"声望":8,"道心":2,"因果":-1}},{"名":"出手拦人","文":"你伸手挡了那一脚，被行商的随从记下了脸。市口当场闹起来，黑市行会的人把两边都拉开，罚了行商五块灵石。哑童把水袋递给你一袋，你没收，他就一路跟到你出市口，指自己的脚，又指你。","果":{"声望":10,"气血":-10,"因果":-1,"魔念":1}},{"名":"袖手走开","文":"你转身走了。走沙的人管不了太多事，管多了，自己也活不成。后来你听说那孩子被人带进了流沙谷，当了引水的小厮。再后来有一支驼队在白骨滩被人用水下了药，据说下药的就是个哑子。","果":{"灵石":5,"道心":-2,"因果":3,"声望":-3}}]},{"id":"ximo_020","题":"半枚火漆","类":"争斗","重":3,"域":["ximo"],"境界":[0,7],"段":["{际遇}。这半枚火漆印你带在身上已有半月，一直不敢拿去对。火漆是好火漆，压出来的是金沙楼的老印，可楼里的老印三年前就换了。{人物}见了那半枚印，脸色变了一回，很快又收住了。","{天象}，他说这东西是流沙谷的货，谁拿着谁就是替贼洗过货的人。他又说，正好，他认识一个肯收这种货的掌柜，价钱可以给到三百。他的手指在桌上敲了三下，敲得很轻。","你想起那晚的独臂人，想起他被吊在枯树上的同伙。三百块灵石，够买一支驼队，可{地点}的规矩是：手上有印的人，得替印上的名字赔命。"],"择":[{"名":"查印再卖","文":"你没有卖，先拿着印去金沙楼的老柜上验。老账房只看了半眼就笑了，说这印是真的，还是当年他亲手刻的，但刻它的人已经死了十年。他给了你六十块，要你把印留下，也留下一个不许多问的规矩。","果":{"灵石":60,"悟性":3,"因果":-1,"声望":4}},{"名":"当场卖出","文":"三百块成交。钱是现的，火漆印当场被丢进火盆。回程时你在沙脊上看见四个骑骆驼的人跟着，跟了两天，没动手。你到家那夜才发现，水囊的绳子被人换过了，是新的，系法很讲究。","果":{"灵石":300,"因果":3,"魔念":2,"寿元":-4}},{"名":"转送官府","文":"你把印交给了{地点}的官差，换了一张赏单和一张不痛不痒的状纸。官差在状纸上写了个“待查”，就压在下头再没动过。三个月后流沙盗劫了一支官盐队，你的名字被写进了他们的黑册。","果":{"声望":7,"灵石":30,"因果":2,"魔念":1,"气血":-5}}]},{"id":"ximo_021","题":"埋驼坡的刀","类":"争斗","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}的坡下埋过一百多峰骆驼，所以叫这个名。你在坡后发现一具新尸，背上插着一把{器物}，刀口很薄，是流沙盗的手艺。尸首手里攥着半截缰绳，缰绳另一头连着一峰还活着的驼。","{人物}说这条道上有规矩：看见死人不许动，动了就当是你杀的。可他说话时眼睛一直瞟那把刀。刀是好刀，能卖四十块灵石，也可能值一条命。{天象}，坡上的沙在往下淌。","驼在旁边打响鼻，脖子上的铃还挂着。{地点}的沙子一直在往坡下淌，淌过那把刀，又淌开。你要么把刀拔出来，要么把驼牵走，要么什么都不动，绕过去。"],"择":[{"名":"拔刀牵驼","文":"你拔刀，牵驼，一路没停。当晚有两个人追上来，隔着火堆问你见过一把刀没有。你说见过，插在死人背上，我没碰。他们看了你很久，最后笑了，说这条道上肯说实话的人少，刀送你。","果":{"灵石":50,"器物":1,"声望":4,"因果":1}},{"名":"就地埋人","文":"你花了大半夜把人和刀一起埋进沙里，堆了个不起眼的沙包。驼牵走了，刀留下了。第二日流沙盗的人来查，翻遍坡地也没找着尸首，最后骂了一句，走了。你骑着那峰驼，走得很慢。","果":{"声望":6,"灵石":20,"因果":-2,"悟性":1}},{"名":"报给金沙楼","文":"你去绿洲的柜上报了信，金沙楼的人当天带走了驼，赏了你十五块灵石和一句“眼力不错”。三天后流沙盗在{地点}劫了一支驼队，据说是因为有人嘴不严。你听见这话时，正在数那十五块。","果":{"灵石":15,"因果":3,"魔念":1,"声望":-5}}]},{"id":"ximo_022","题":"沙门的一餐","类":"宗门","重":4,"域":["ximo"],"境界":[0,6],"段":["枯骨寺每年开一次斋，就在{地点}的沙场上，摆三十口大锅，谁来都能吃一碗。{人物}赤足立在锅边分粥，一勺不多，一勺不少。他说这一餐不白吃，吃的人得留下一句实话。","{天象}。排队的人里有脚夫、有马匪、有做亏心事的掌柜，也有你。前头一个满脸胡子的汉子吃完了，想了很久，说自己去年在{地点}丢下过一个受伤的同伴。沙门的人点点头，让他走了。","轮到你，{人物}的勺子停在锅上，他等你开口。你身后还有几十个人，都在听。"],"择":[{"名":"说一件亏心","文":"你说了一件连自己都不愿意想的事，说完浑身发抖。分粥的僧人什么也没评，只把碗添满了些。那碗粥你吃得很慢。走出沙场时，你觉得自己背上卸下了一块石头，尽管那石头还在。","果":{"道心":3,"修为":50,"因果":-2,"声望":3}},{"名":"编一句实话","文":"你说自己曾偷过别人的水，说得声情并茂。僧人听完，把勺子放回锅里，说这一碗不给你了，因为你把实话当成了换粥的钱。你空着手走出沙场，那天的粥味你记了很多年。","果":{"气血":-10,"道心":-1,"悟性":2,"因果":1}},{"名":"舍粥不食","文":"你把碗推回去，说这碗留给后头那个孩子，自己的话改日再说。僧人看了你一眼，把碗递给了孩子，又另外盛了一碗放在你脚边。你走的时候那碗还在。后来你在沙门的名册上多了一个字。","果":{"声望":9,"道心":2,"因果":-1,"灵石":-10}}]},{"id":"ximo_023","题":"沙下的钟","类":"天象","重":3,"域":["ximo"],"境界":[1,9],"段":["{天象}。这声响在西漠传了几百年：夜半时分，沙底下会有金石相击之声，一声一声，像有人在极深的地方敲钟。老辈人说那是古城的钟楼还活着，也有人说那是地脉在换气。","你今夜听得格外清楚。声音从{地点}的方向来，每响一下，脚下的沙就微微跳一下。{人物}把耳朵贴在沙上听了半晌，抬头时脸是白的，说他听见钟声里夹着人唱名，念的都是已死之人的名字。","{器物}在你怀里开始发烫的时候，{人物}忽然说，念到你了。风停了，沙面上一层细纹正在往一处聚。"],"择":[{"名":"伏地听钟","文":"你把耳朵贴上去，听见的不只是钟，还有无数人的呼吸。你听出其中一个是自己的。钟声到第五十下断了，你抬头，脸上全是沙，耳朵里嗡嗡响了三日。这三日里，你忽然记起了一些不属于自己的旧事。","果":{"悟性":4,"修为":80,"气血":-15,"因果":2}},{"名":"掘沙探源","文":"你顺着声音挖了三丈深，挖到一块刻着符文的青石，石下是空的，凉气直往上冒。{人物}死死拽你不让再挖。你们把沙填回去的时候，钟声停了，之后再没响过。有人说你把西漠的一件东西弄死了。","果":{"修为":100,"灵材":1,"因果":3,"声望":-6,"气血":-20}},{"名":"避入窑洞","文":"你拉着他钻进一处背风的旧窑，塞住耳朵坐到天亮。钟声过后，沙面上多了一行极浅的脚印，绕着窑洞走了三圈才断。脚印是赤脚的，脚趾印比常人多一个。你们谁也没提这事。","果":{"道心":1,"气血":-5,"悟性":2,"因果":-1}}]},{"id":"ximo_024","题":"白毛骆驼","类":"奇闻","重":3,"域":["ximo"],"境界":[0,6],"段":["{地点}的夜里，驼队里最老的那峰骆驼忽然不肯走了，跪在地上打响鼻，怎么抽都不起。你举着火把往前照，看见沙脊上站着一峰白毛骆驼，毛色白得不像活物，背上搭着一副空驮架。","{妖异}的传闻是这样：白毛驼是死在沙里的人变的，专在夜里找驼队，跟上一夜，第二日队里必有人走失。可那峰白驼并不靠近，只在你前头慢慢走，走一段，停一段，像在等。","{人物}说，跟着它走的人，有的找到了水，有的再没回来。他一边说，一边已经收起了刀。"],"择":[{"名":"随驼而行","文":"你解开自家骆驼，独自跟着白驼走了半夜。它带你到一处从未见过的浅洼，洼底渗出一点水，只够三囊。它在你打水时消失了，沙上没有蹄印。第二日驼队靠这三囊水走出了盐霜原。","果":{"灵石":20,"气血":15,"悟性":3,"寿元":3,"因果":-1}},{"名":"开弓射之","文":"你一箭射穿它的脖子，白驼没有流血，只散成一团白毛落在沙上。白毛里裹着一枚铜铃和半张写着名字的旧契。驼队里的人当夜都睡不着，第二天有两个脚夫不告而别，再没回来。","果":{"修为":50,"器物":1,"因果":3,"声望":-7,"魔念":1}},{"名":"闭帐不理","文":"你让众人把驼围成圈，帐门朝内，谁也不许出去看。天亮时白驼已不在，沙上留下一圈蹄印，把营地围在正中。老驼这才肯站起来。那年之后，你的驼队夜里再没走过那条道。","果":{"道心":1,"声望":4,"悟性":1,"灵石":10}}]},{"id":"ximo_025","题":"泉边的卦","类":"奇闻","重":4,"域":["ximo"],"境界":[0,5],"段":["{地点}边有个摆卦摊的老妇，不收灵石，只收水：一卦一囊，囊要满的。{人物}说她算得准，准到有人从关外专程来问一卦，问完回去就把家业散了。","你坐下，她也不问你要问什么，只把三枚{器物}抛在沙上，看了很久，说：你身上有一笔账，不是你的，你却要还。{天象}，泉边风大，她的头发一丝不乱。","{人物}把卦钱推回你面前，说这一卦不收水，收别的——要你把随身一件东西留下，什么都行，但必须是你不舍得给的。"],"择":[{"名":"留下水囊","文":"你把水囊留下，那是你最好的一只。她接过，倒空，埋在泉边的沙里，说这样账就不跟着你了。回程你渴了两日，却真的再没梦见那个死人。三个月后你回来，泉边只有一堆沙。","果":{"因果":-3,"道心":2,"气血":-10,"悟性":2}},{"名":"留下名字","文":"你不肯给东西，只说了一个名字——不是自己的。老妇抬眼看了你一下，把卦收了，说：名字留下，人也留下了一半。此后你在西漠报名字时，总觉得有人先替你应了一声。","果":{"灵石":40,"魔念":2,"因果":2,"声望":-3}},{"名":"收回卦钱","文":"你把水囊揣回怀里，说这卦不算了。她也不恼，只把三枚铜钱一枚一枚捡起来，说：不算也好，算了的人，都得走一趟。你走出十几步，回头看，摊子已经收了。","果":{"道心":-1,"悟性":1,"灵石":10,"因果":1}}]},{"id":"ximo_026","题":"押驼的赌","类":"市井","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}的棚子里，一伙人围着沙地赌骆驼。规矩简单：两峰驼从两头放出去，谁的先到对面那根木桩，谁赢。{人物}是庄家，抽一成，笑得很和气，手里转着一枚{器物}。","你押的那峰是好驼，脚力在绿洲数得上。可临放驼前，你看见有人在另一峰的鼻孔里抹了一把东西——是{灵材}磨的粉，闻了能让人和牲口都发狂。庄家的眼睛正看着你。{天象}，围观的人越来越多。","你身上压着这一趟的全部本钱，还有那枚从{地点}带来的铜牌。此刻开口，就是坏了规矩；不开口，就是白送。"],"择":[{"名":"当众揭破","文":"你抓住那人的手，把指缝里的粉刮下来给众人看。棚子里炸了锅，庄家把赌注退了，还倒赔你三十块，说图个名声。可当晚有人在你帐外撒了一把沙，沙里混着碎骨，是西漠最轻的一种威胁。","果":{"灵石":40,"声望":9,"因果":1,"气血":-5}},{"名":"暗换两驼","文":"你不作声，趁乱把两峰的缰绳调了个头。开赛之后，被抹了粉的那峰跑错了道，一头撞进人群。你赢了三倍的钱，庄家脸都绿了，可他抓不着凭据。这钱你花得很小心。","果":{"灵石":120,"悟性":2,"魔念":1,"声望":-3}},{"名":"押注反手","文":"你把身上的钱全押到对面那峰上。众人笑你疯了。开赛不过半里，你那峰好驼忽然折返，被抹了粉的却直冲终点。你赢了七十块，庄家递钱时手指冰凉，说：你早就看出来了。","果":{"灵石":70,"悟性":3,"因果":1,"道心":-1}}]},{"id":"ximo_027","题":"盐帮的火","类":"争斗","重":3,"域":["ximo"],"境界":[1,8],"段":["{地点}的盐场上，盐帮和驼帮为一条运盐道打了起来。起因是驼帮的驮队走了盐帮私开的小道，压死了两峰驮盐的驴。{人物}站在盐堆上喊话，喊的是“按老规矩赔”，声音哑得像破锣。","老规矩是赔盐不赔命，可这回盐帮死了人。盐帮的头目把一袋{灵材}摔在地上，说要么把那条道让出来，要么今夜就烧了驼帮的草料场。{天象}，两帮人隔着一道盐沟对峙，谁也没动。","你手里有一支驼队，两边都要你表个态。{宗门}的人许你以后不收过路钱，盐帮许你三车盐。沟里的盐霜被日头照得刺眼。"],"择":[{"名":"居中调停","文":"你把两边头目拉到盐沟中间，用自己驼队的名誉作保：驼帮让道三个月，盐帮赔两车盐。两边都骂你多事，可也都点了头。此后你的驼队过这两家的地界，只收半价，代价是你在两边都成了“那个爱管闲事的”。","果":{"声望":12,"灵石":-30,"因果":-2,"悟性":2}},{"名":"助驼帮","文":"你把驮队横在盐沟上，替驼帮挡了半夜。盐帮的火把扔过来，烧了你两副驮架，一头好驼当场炸了群。天亮时驼帮赢了，过路钱免你一年，可盐帮的账，从此记在你名下。","果":{"灵石":-60,"声望":8,"因果":3,"气血":-15,"魔念":1}},{"名":"坐收渔利","文":"你把驼队撤到三里外，等两边打到后半夜，才慢慢把盐帮散落的三车盐收走。没人看见。这笔货在关外卖了个好价。半年后盐帮查出了那三车盐的落处，派人来问时，你正在数钱。","果":{"灵石":200,"魔念":3,"因果":3,"声望":-10}}]},{"id":"ximo_028","题":"罗盘指北不指路","类":"机缘","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的旧货摊上摆着一只{器物}，铜面磨得发亮。摊主说这是前朝走沙人留下的，指的不是北，是“归”。他说完自己先笑了，笑得很不自然。你要价，他只要了二十块。","你把罗盘带回帐里，指针不指北，只缓慢地转，最后停在东南。那里是{地点}的方向，一片什么都没有的死沙。{天象}。你按住指针，它在你手心里跳，像一只被捉住的虫。","{人物}说这类罗盘找的是“还没还的愿”，跟着走，走到的多半是坟。他把罗盘合上，等你决定要不要再打开。"],"择":[{"名":"循针独行","文":"你独自往东南走了两天，指针把你带到一处塌了顶的土屋。屋里的炕上有一具白骨，手里攥着半块饼。你替他埋了，回程时罗盘不再转，针尖笔直朝天。你把它卖了，买家说这是废了，只给五块。","果":{"修为":60,"悟性":3,"因果":-2,"灵石":-20}},{"名":"拆盘取芯","文":"你把罗盘拆开，里面是一小片星尘沙压的磁心，还刻着一行极小的字：往南三百里，有井。你按这行字走了一趟，果然挖出一口被沙封死的旧井。井水苦，但救过四支驼队，也替你换来不少人情。","果":{"灵石":80,"灵材":1,"声望":8,"悟性":2}},{"名":"封盘不启","文":"你把罗盘用麻布裹了，压进驮箱最底下。你不想知道它指着谁。三年后翻箱时罗盘还在，针尖一动不动，麻布上却透出一个浅浅的印子，是一个人手的形状，五指张开。","果":{"道心":2,"悟性":1,"因果":1,"灵石":-20}}]},{"id":"ximo_029","题":"沙画师","类":"奇闻","重":3,"域":["ximo"],"境界":[0,5],"段":["{地点}的墙根下，{人物}用漏斗在沙上作画，画的是沙海，沙海里有一支驼队，驼队前头走着一个人。他说画一幅收一块灵石，画完风一吹就没了，所以这钱花得干净。","你看他画到一半，忽然发现那个走在驼队前头的人，背影和你一模一样。他头也不抬，说：我画的是明日从这条道过的人。{天象}，围看的人多了起来，有人笑，有人脸色变了。","画师画完最后一笔，把{器物}倒过来。画就在你脚边，风已经起了。他说：要留，得用血拌沙。"],"择":[{"名":"割指留画","文":"你割破指头，把血滴进沙里。画定住了，像烙在地上。围观的人哗然，画师收了你的血，只说了一句：明日别走这条路。你听了。第二日那条道上被流沙吞了一支驼队，是别人的。","果":{"气血":-10,"寿元":4,"因果":-2,"悟性":2,"灵石":-5}},{"名":"买画不画","文":"你付了两块灵石，让他画别人。他笑着把漏斗里的沙倒回袋中，说：不画你，也画得出别人。那日他画的是一支正要出关的商队。三个月后那支商队在沙脊关外被劫，一个活口也没剩。","果":{"灵石":-2,"因果":2,"魔念":1,"悟性":1}},{"名":"踏平沙画","文":"你一脚把画踩散，说这种把戏也就骗骗怕死的人。画师不恼，慢慢把漏斗收进袖子，说：怕死的人才活得长。围观的人散了，你的名字却从那天起在绿洲传开，说你不信邪。","果":{"声望":6,"道心":-1,"因果":1}}]},{"id":"ximo_030","题":"盗首的旧账","类":"宗门","重":3,"域":["ximo"],"境界":[2,9],"段":["{地点}的沙壁后头坐着一个人，脚上锁着一条断了的铁链，链子另一头埋在沙里。{人物}说，这就是流沙盗的盗首，十年前带着金沙楼的一本暗账逃进沙里，如今连自己人都不认他了。","他抬眼看你，眼睛很清，不像在这沙里熬了十年的人。他说他能背出七条商道的分润、十三家柜上的死账，也背得出哪一个掌柜在何时说过谎。他说完，问你有没有纸。{天象}，沙壁的影子正好压在他膝上。","他嘴里那本账，是{地点}很多人的命。你带着它走出去，有人要买，也有人要杀你。"],"择":[{"名":"替他记下","文":"你在他面前铺开纸，一笔一笔替他记，记了两天两夜。记完他让你把纸烧了，说他要的只是有人听过。灰烬里你顺手留了一页。就这一页，后来在金沙渡抵了三次杀身之祸。","果":{"悟性":4,"灵石":60,"因果":1,"寿元":-2,"声望":4}},{"名":"卖与金沙楼","文":"你把账背下来，交给了金沙楼。楼里清了三个掌柜，封了两条道，赏了你一笔够买半支驼队的钱。交割那晚，老账房说：这本账我们找了十年，你是第一个把它送回来的外人。","果":{"灵石":260,"声望":10,"因果":3,"魔念":2}},{"名":"带他出沙","文":"你解开那条断链，把他扶上骆驼。他走了半天就死了，死前只说了句“原来沙外头也这么热”。你把他埋在白骨滩尽头，坟头压了一块刻着数字的石头。流沙盗后来派人找过，没找着。","果":{"因果":-2,"道心":2,"声望":6,"气血":-15,"灵石":-40}}]},{"id":"ximo_031","题":"赤沙渡的船钱","类":"市井","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}是沙海上唯一要“坐船”的地方——船是木排，底下垫着充气的驼胃，专渡流沙河。{人物}撑着篙，收钱不认人，一渡五块灵石，驮货另算。他说这河每季吞两个人，价钱不能便宜。","{天象}。排子行到河心，篙忽然撑不动了，木排开始往下沉。船夫脸色一变，说底下有东西咬住了驼胃。他让你把最重的那捆货扔下去，那捆是你这趟的本钱。河面上一串气泡冒出来，散得很慢。","{天象}，木排还在沉。船夫一手撑篙一手按着腰间的刀，他也在算：扔货，还是扔人。"],"择":[{"名":"弃货保排","文":"你把最重的那捆货推下河，木排立刻浮起半尺。货沉下去时，河底的影子翻了一下，很粗。到了岸上，船夫少收你两块，说：你懂规矩。你站在岸上看了很久，那片河面已经平了。","果":{"灵石":-80,"气血":5,"声望":4,"悟性":1}},{"名":"斩物下河","文":"你不扔货，抽刀往水里连刺。第三刀扎到实证，河底翻上来一条沙下巨鳝的头，半截露在水面。船夫趁势撑篙冲上岸，货一样没少。这条鳝的头，后来挂在赤沙渡的棚子上，挂了半年。","果":{"修为":60,"气血":-12,"灵石":10,"声望":8}},{"名":"掀船夫下河","文":"你抬脚把船夫踹下木排，自己撑篙上岸。他没死，从下游三里处爬了上来，浑身是泥。你没回头。此后赤沙渡换了新船夫，第一句话就是：那个人的钱，我不渡。这话传了很久。","果":{"灵石":5,"魔念":3,"因果":4,"声望":-12}}]},{"id":"ximo_032","题":"双生沙棘","类":"机缘","重":3,"域":["ximo"],"境界":[0,7],"段":["{地点}的背风处生着一丛沙棘，枝上结了两颗果，一红一白，长在同一根枝上，这就是{灵材}。老辈说这果子一颗治伤，一颗送命，红的救，白的杀，可从外头看，谁也分不清哪颗是哪颗。","{人物}说他有法子试：把果子泡进盐水，浮起来的是活的，沉下去的是死的。可这法子得用掉半囊水，而生这果子的地方，从没人肯白给水。{天象}，沙棘的刺上挂着干了的血。","{人物}伸出手，等你把水囊递过去。他说得轻描淡写，眼睛却在瞄你的手。"],"择":[{"名":"取水试果","文":"你倒了半囊水，红的浮起，白的沉底。他不吭声地把红果递给你，自己盯着白果看了很久，最后用布包起来收进怀里。你问他留着做什么，他说：总有人要用它。这话你后来才懂。","果":{"灵材":1,"气血":20,"寿元":2,"灵石":-20}},{"名":"两果同食","文":"你不试，把两颗一起嚼了。半个时辰后你吐了一地血，眼前一片白，像进了蜃楼。醒来时{人物}蹲在旁边，说你命大。你摸着胸口，伤是好了，可从此吃什么都尝出一点沙子味。","果":{"气血":-30,"寿元":5,"修为":80,"道心":-1}},{"名":"整枝拔走","文":"你把整丛沙棘连根拔了，栽进驮箱的湿沙里。路上它枯了一半，到了绿洲，只剩一颗白果。你把它卖给一个药商，得了七十块。那药商第二个月就死了，死时嘴里含着一颗红果。","果":{"灵石":70,"灵材":1,"因果":3,"魔念":1}}]},{"id":"ximo_033","题":"名字上了碑","类":"奇闻","重":3,"域":["ximo"],"境界":[1,8],"段":["{地点}有一块无字碑，是苦行沙门立的，说凡在西漠走死的人，名字都会自己浮上来。你不信，可那天夜里路过，碑上浮出了三个字，正是你的名字，笔画是干的，像被刻进去很久了。","{天象}。你伸手去摸，指尖沾了一点朱砂。{人物}劝你今夜不要独处，说名字上了碑的人，三日内必有一劫，躲得过就擦得掉，躲不过，名字就留下了。","碑上那三个字在月光下很清晰，风从{地点}那边过来，把沙吹上字，又吹开。你手边有刀，有一囊水，还有一块可以用来磨字的石头。"],"择":[{"名":"磨去名字","文":"你跪在碑前，用石头一点一点把名字磨平，磨了半夜，指尖全是血。天亮时碑上只剩一道浅痕。三日后你在沙暴里翻了驼，断了两根肋骨，人是活的。那道浅痕至今还在。","果":{"气血":-20,"寿元":4,"道心":2,"因果":-1}},{"名":"留着不磨","文":"你不磨，说名字留在碑上也好，好歹是个见证。三日后你没遇上劫，倒救了一个被沙埋了半截的走沙客。他说他在碑上也见过你的名字，说这话时声音发抖。碑上如今多了他的名字。","果":{"声望":8,"因果":-2,"悟性":2,"气血":-5}},{"名":"刻上别人","文":"你在自己的名字旁边刻了另一个人的名字——那人在关外做过一桩极脏的买卖。刻完之后，碑上你的名字淡了。半年后你听说那人在赌场里被人砍了手。你什么也没说，只是不再走夜路。","果":{"魔念":3,"因果":4,"道心":-2,"声望":-5,"灵石":20}}]},{"id":"ximo_034","题":"石胎人","类":"妖异","重":3,"域":["ximo"],"境界":[2,10],"段":["{地点}的深处有一排石像，都作盘坐状，脸上没有五官。{人物}说这些不是像，是胎——沙下的石脉遇灵机而孕，孕到百年成形，形到千年开裂，裂了就能走。他指着最右边那尊，石面上已有三道细缝。","{天象}。那一夜你听见石像里传出心跳，慢而沉，与你的呼吸合在一处。走到近前，缝里渗出一点温热的水，是{灵材}。传说石胎的水能洗去一身旧伤，也能把人的魂洗进石头里。","{人物}已经把凿子拿出来了。他说等它裂开就迟了，得趁未成形的时候取了它的心。他问你要不要一起，语气很平常。"],"择":[{"名":"破石取胎","文":"你与他一凿一凿凿了半夜，石胎裂开，里头的心像一块温玉，取了不到半炷香就凉成灰。你分了三分之一的晶水，旧伤确实去了大半。可你此后每逢阴天，能听见石头底下有人轻轻喘气。","果":{"修为":160,"气血":25,"灵材":2,"因果":4,"魔念":2}},{"名":"封石镇之","文":"你按住他的凿子，用《压沙诀》把周围的沙压实在石像脚下，又把沙门给的封符贴了三张。石胎的心跳渐渐沉下去。他骂你误事，把凿子一扔走了。三个月后再来，那一排石像的缝全合上了。","果":{"修为":100,"道心":3,"因果":-3,"声望":6,"灵石":-40}},{"名":"择一而养","文":"你不凿，也不封，只把自己半囊水一滴一滴喂进最左边的石像缝里，喂了七日。第八日它裂了，走出来的是一具没有脸的石偶，跟着你走了三个月，替你挡了一记流沙盗的刀，就碎了。","果":{"修为":130,"气血":-10,"因果":-2,"器物":1,"声望":4}}]},{"id":"ximo_035","题":"黑石城的擂台","类":"争斗","重":4,"域":["ximo"],"境界":[1,8],"段":["{地点}的城中心有一座青石擂台，规矩是：上台不认人，认钱。赢一场十块灵石，赢三场加一只{器物}，赢五场就能进金沙楼做护院。{人物}在台下收注，收得很起劲。","第一场你对上一个瘦得像柴的沙盗，刀法却快得离谱，走的是《流沙刀诀》的路子。你硬接了三刀，虎口裂了，才摸清他的刀是往沙里走的，不是往人身上走。{天象}，台下已经押了两百多块。","{天象}，第五场前有一个空档。庄家递过来一小包药，说吃了不疼，只是会慢一点。他的手很稳，眼睛却不敢看你。"],"择":[{"名":"堂堂打完","文":"你连打五场，肋骨断了一根，最后一刀把对手挑下台。金沙楼给你十块灵石、一只铜牌和一句赞，说你这身手配得上做护院。你没去，因为你知道那药包若吃了，第五场的对手就是你自己。","果":{"灵石":50,"声望":14,"气血":-30,"修为":60,"寿元":-2}},{"名":"服药速胜","文":"你吞了那把药，五场不到半炷香就打完，台下欢声一片。你自己后来才知道，那药里掺了火蚁卵的粉，短期不疼，长期烧的是经脉。此后每逢用力，你的手会自己抖，怎么练都压不住。","果":{"灵石":120,"修为":40,"气血":-40,"寿元":-8,"道心":-1}},{"名":"押注对手","文":"你在第五场前把自己的钱全押在对面那个柴瘦沙盗身上，然后上台故意露破绽。台下骂声一片，你摔下台时听见庄家在数钱。这一夜你赢了一百四十块，也从此不能进黑石城的擂台。","果":{"灵石":140,"声望":-14,"魔念":2,"悟性":2}}]},{"id":"ximo_036","题":"驿里的旧账","类":"人情","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}的墙上钉着一排木牌，每块牌子上刻一个人名和一个数。守驿的老汉说，这是几十年来欠水欠草欠宿钱又没还的人，人走了，账留着。他说他记得每一个名字，也记得每一个人的脸。","他指了其中一块，上面是个你熟的名字——一个曾救过你命的走沙客。数不大，八块灵石。老汉说那个人三年前死在白骨滩，账挂到今天，他每年都替他把牌子擦一遍。{天象}，屋里的水缸照旧见底。","{天象}。你的水囊里有水，袖子里有钱。老汉什么也没要，只是把那块牌子摘下来摆在桌上，让你看一眼。"],"择":[{"名":"替他还账","文":"你放下八块灵石，说这账我替他清了。老汉把牌子摘下来，用指甲把人名刮掉，刮得很慢。他说：刮掉一个，墙上就少一个。他给你添了一碗水，是缸底最后那点，水里有沙。","果":{"灵石":-8,"声望":10,"因果":-2,"道心":2}},{"名":"问他的事","文":"你没还账，只问老汉那个人欠账那年做了什么。老汉说了半个时辰，说那人为了给另一个走沙客换一囊水，把最后的驼卖了。你听完，把那八块灵石留下了，没说是还账，说是换故事。","果":{"灵石":-8,"悟性":3,"声望":6,"道心":1}},{"名":"摘牌私藏","文":"你趁老汉转身，把那块牌子摘下来收进袖子。你想让它提醒自己什么，可它只让你睡不着。半年后你把牌子挂回了墙上，位置错了一格，老汉没说什么，只是从那以后不再让你看那面墙。","果":{"悟性":1,"因果":1,"道心":-1,"声望":-6}}]},{"id":"ximo_037","题":"关外的道人","类":"修行","重":3,"域":["ximo"],"境界":[1,9],"段":["{地点}外三里有一间土房，住着个被流放的道人。他原是{宗门}里的人物，据说因一句“天机不可测”得罪了人，被扔到西漠八年。土房里没有书，只有满地刻的字，刻在墙上、地上、碗底。","他见你来了，不问来意，只把一只{器物}推过来，说里头是酒，喝不喝随你。他说他在算一件事：沙每年往东南移三尺，照这走法，四十年后{地点}会被埋掉。{天象}，他一边说一边用指头在地上划。","{人物}忽然停了，问你信不信天机。屋里静下来，风从墙缝里过，吹得那些刻字像在动。"],"择":[{"名":"陪他算沙","文":"你陪他算了三天沙。他没教你什么神通，只教你如何从沙纹的走向读风，如何从风读出三日后会不会起沙暴。这本事在往后的商道上救过你无数次。临走他送你一句话：别信算出来的，信你看见的。","果":{"悟性":4,"修为":70,"灵石":-10,"道心":1}},{"名":"告发邀功","文":"你把他的话说给了{地点}的官差，换了一张赏单和三十块灵石。官差连夜把那间土房封了，人不知押去了哪里。三个月后你在沙脊上看见一间空土房，墙上刻着一行字，是留给你的：你算得比沙快。","果":{"灵石":30,"声望":5,"因果":4,"魔念":2,"道心":-2}},{"名":"替他送信","文":"他托你带一句话给{宗门}的人：西漠要变。你送到了，宗门的人只回了一句“知道了”，什么也没给。回程时你把话原样转述，他听了很久，笑了，说：这就够了。半年后他死在土房里，脸上带笑。","果":{"声望":7,"因果":-2,"悟性":2,"寿元":-1}}]},{"id":"ximo_038","题":"龙涎云","类":"天象","重":3,"域":["ximo"],"境界":[2,9],"段":["{天象}。那天云是从地上升起来的，一缕一缕，琥珀色，带着腥甜，一直升到极高，又慢慢压下来。老走沙的人一看就跪，说这是龙涎云，云落之处必有一具上千年的沙蟒尸，尸身化的涎比坑里挖的贵十倍。","云落的方向在{地点}。{人物}看了一炷香，说：那地方从来没人活着回来过。他又说，这次不一样，云压得低，尸还新。他说话时，手指在刀柄上敲，敲得很有节奏。","{人物}的手在刀柄上停了。队伍里的人开始吵，有人说该去，有人说该走。云影在地上慢慢移动，像一只手，正从你脚边掠过。"],"择":[{"名":"追云而入","文":"你们跟着云影走了两天，找到一具三丈长的沙蟒尸，涎凝成琥珀色的块，一筐一筐地装。回程时死了两个人，一个陷进流沙，一个被赤砂蜈蚣咬了脚踝。你分到的那份，够你在绿洲过上三年。","果":{"灵石":300,"灵材":3,"气血":-20,"寿元":-4,"因果":2}},{"名":"截云取露","文":"你不进腹地，只在云影最薄的边缘支起麻布接露。接了半夜，布上凝出一层薄薄的涎霜，收起来不过两指厚。这点东西卖了九十块，人是齐的。{人物}说你胆子小，可第二年他也学着接露。","果":{"灵石":90,"灵材":1,"悟性":2,"声望":3}},{"名":"抢先报信","文":"你连夜派人把云的事报给金沙楼，换了一张三百块的悬赏和一支接应队。等你们赶到，地方已被挖空，尸身只剩半截。金沙楼照样付了钱，只是那半截尸的皮，他们没让你看。","果":{"灵石":300,"声望":6,"因果":3,"魔念":1}}]},{"id":"ximo_039","题":"星尘雨","类":"天象","重":4,"域":["ximo"],"境界":[0,7],"段":["{天象}。沙面上落下一层极细的亮尘，落在袖子上像撒了一把碎星，这就是星尘沙。老辈说星尘雨十年一落，落的时候沙海会“醒”一夜，连埋了百年的东西都会往上翻。","你趴在一块大石后头看，果然见沙面上有三处慢慢鼓起，像有什么在往上顶。{人物}死死按住你，说不许动，星尘雨里翻上来的东西，十件里有八件是祸。可那三处鼓起的地方，正泛着{灵材}的光。","{天象}未歇，雨越下越密，落在石头上的沙尘开始发烫。三处沙包已有半臂高，其中一个裂开一道口，露出一角青铜。"],"择":[{"名":"抢在雨歇","文":"你扑出去先挖最近的那个，挖出一只青铜匣和两块成形的沙下青玉。沙包塌下去时，你闻到一股极浓的腥味，像有东西在底下呼吸。匣子后来卖了二百块，青玉你自己留着，压得住沙暴。","果":{"灵石":200,"灵材":2,"器物":1,"气血":-10,"因果":1}},{"名":"守到雨停","文":"你按住他，一动没动，看着三处沙包在雨歇之后自己沉回去。天亮时沙面平得像没发生过事，只留下三枚极浅的印子。第二日有人在别处挖沙尘翻出的东西，挖出了两只手。","果":{"道心":2,"悟性":2,"因果":-2,"声望":3}},{"名":"引雨聚尘","文":"你脱下外袍铺在沙上，把落下来的星尘沙一并收拢。一夜收了小半袋，成色极好。这袋沙后来成了你炼器的本钱，也成了别人眼里的肥肉，害得你一整个冬天不敢在同处过夜。","果":{"灵材":3,"灵石":60,"因果":2,"魔念":1}}]},{"id":"ximo_040","题":"蝎尾针","类":"妖异","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的商道上，有人在沙里挖了个坑，坑里堆着七具骆驼骨，骨缝间爬满了赤红的蝎子。{妖异}的说法是这样：沙蝎王以驼骨为巢，一只王带三千只，走沙的人误踩一脚，半个时辰连骨头都找不着。","{天象}。你的驮队正好要过这段路，绕行要多走两天，不绕就得从蝎窝边上过。{人物}说他有个法子：把一头病驼宰了，扔在下风处，蝎群去抢食的时候，人从另一头过去。","{人物}说这话时已经把手按在刀上，那头病驼就在队尾，正低着头喘气。它跟了你四年。"],"择":[{"名":"舍驼引蝎","文":"你亲手割了缰绳，把病驼牵到下风处。蝎群果然全扑过去，你们趁着空档一口气跑了三里。跑出去之后没人说话，队里最老的那个脚夫回头看了一眼，说：它跟了你四年。你听见了，没接。","果":{"气血":-5,"灵石":40,"道心":-1,"因果":2,"悟性":1}},{"名":"绕道两日","文":"你带着驮队绕了两天，多耗了四囊水，一头小驼没撑住。到绿洲时你说的第一句话是：驼还在。队里几个老人都笑了，那一笑之后，这支驼队又跟你走了七年，一次没散过。","果":{"灵石":-60,"声望":10,"道心":2,"因果":-1}},{"名":"取针炼药","文":"你不走，反而在夜里用火把把蝎群逼进一处洼地，用沙压死大半，从蝎王身上拔了三根尾针。尾针是上好的药引，能解百毒，也见过血。可这一夜之后，那洼地周围的沙上，再没长出过一株草。","果":{"灵材":3,"修为":70,"因果":3,"魔念":1,"气血":-15}}]},{"id":"ximo_041","题":"水里的药","类":"灾祸","重":4,"域":["ximo"],"境界":[0,6],"段":["宿在{地点}的井边，你发觉驼队里三个人睡得不对，呼吸又深又慢，叫也叫不醒。井台上有半只破碗，碗底沉着一层白末，是{灵材}磨的粉，掺在水里能让人睡足一夜。","{人物}是这口井的守水人。他说昨夜有六个人来打水，都是商队的，各打各的，谁也没多话。可你数了数井边的脚印，只有三双，而且都是往一个方向去的。{天象}，井绳还湿着，井口的木盖歪了半寸。","你袖子里有刀，怀里有这一趟的货钱，{地点}的井绳还在晃。井底黑得像一张嘴，什么也照不出来。"],"择":[{"名":"守井待凶","文":"你把三人挪进帐里，自己抱着刀在井台蹲到天亮。第三夜果然来了两个下药的，你截住一个，问出是流沙盗的哨子收买了守水人。守水人当晚就跑了，从此这口井归你管，你收水钱收了很多年。","果":{"声望":9,"灵石":80,"气血":-15,"因果":-1}},{"名":"下井探底","文":"你吊着绳子下井，井壁上凿着一个暗洞，洞里堆着六个水囊和一堆割断的驼缰。原来这井是流沙盗的顺手活：药倒人，牵走驼，货沉井底。你把水囊全提上来，分给了驼队，自己的那份没要。","果":{"灵石":60,"悟性":3,"因果":-2,"声望":6,"气血":-12}},{"名":"弃井启程","文":"你叫醒能醒的人，连夜拔营，宁可多走三十里也不在这口井边多留一刻。等到下一个泉眼时，已经渴倒了两头驼。你没有回头去追那伙人，只在账本上记了一笔：某年某月，欠着。","果":{"灵石":-40,"气血":-10,"寿元":-2,"悟性":1,"因果":1}}]},{"id":"ximo_042","题":"代写一纸","类":"市井","重":3,"域":["ximo"],"境界":[0,5],"段":["{地点}的市口有个替人写契的摊子，摊主是个落第的书生，笔画极工整。这日他不在，摊前围了一圈人，都等着写文书：有写买卖的，有写休书的，也有写信给远方的亲人，写完付两块灵石。","你坐下，有人递来一张纸，说请你代写一封家书，寄到{地点}去。他说得很客气，可他袖口露出的刀柄是流沙盗的样式。{天象}，摊前的沙子被风推着，一次次盖住字。","{人物}说，要写的内容很简单：人在西漠，尚好，勿念。他又补了一句：末尾要加一句“驼队的货已经换了买主”。他等你落笔。"],"择":[{"名":"照他写","文":"你一字不改地写完，收了钱。三日后一支从白骨滩出来的驼队被人截了，收货的人一个没活。你后来才明白那封家书是封暗信。此后你再替人写字，总要多问一句寄给谁。","果":{"灵石":30,"因果":4,"魔念":2,"道心":-1}},{"名":"写漏一句","文":"你写完了家书，唯独把那句暗话漏了。他似乎没看出来，收纸走人。半日后他又回来，把刀往你摊上一放，说：你故意的。你说是笔误，他看了你很久，最后收刀走了，说下不为例。","果":{"悟性":3,"声望":4,"因果":-1,"气血":-5}},{"名":"另写一封","文":"你写了两种：明的一封给他，暗的另抄一封，托人送到{地点}的官差手里。三天后那伙人在白骨滩北口被截，官差升了官，你得了三十块赏钱，也从此不敢再在那条道上摆摊。","果":{"灵石":40,"声望":8,"因果":-3,"魔念":1}}]},{"id":"ximo_043","题":"第二个人","类":"人情","重":5,"域":["ximo"],"境界":[0,6],"段":["西漠只有一条规矩：不要相信沙漠里遇见的第二个人。你在{地点}走了大半日，太阳最毒的时候，沙脊上出现了第一个人——一个半死的走沙客，喉咙干得说不出话，只把一只{器物}往你这边推。","你给了他半囊水。他喝完之后，眼神忽然清了，说话也利索了。他说前头三十里有一处临时营地，有井，有水，还有一支等着拼队的商队。{天象}，他说得越顺，你心里越凉：这是今天遇见的第二个人。","{人物}站起来，往前头走，回头招手，笑得很自然。三十里外确实有一处营地的影子，炊烟很淡，淡得不像有人煮饭。"],"择":[{"名":"跟着走","文":"你跟到那处营地，三个沙盗已经等在那里。他们没杀你，只牵走了你两头驼和半箱货。为首的那个说：你给我们留了半囊水，我们给你留一条命，这才公道。你走出营地时，黄昏的风一吹，营地就不见了。","果":{"灵石":-120,"气血":-10,"悟性":3,"因果":1}},{"名":"反手制之","文":"你装醉，等他靠过来才动手，一刀架在他脖子上。他立刻招了：前头营地是流沙盗的哨，三五十里内有六处这样的营。你没杀他，只把他捆了，自己改走了另一条道，绕出了这片沙。","果":{"修为":40,"悟性":2,"声望":4,"因果":-1}},{"名":"分道而治","文":"你把水囊分成两份，说你走东，他走西，两不相干。他愣了一下，把囊里的水还你一半，说：这条规矩我懂。后来你听说有人在那片沙里死了三个，也有人活着走出来，谁也说不清是哪个。","果":{"道心":2,"悟性":1,"灵石":-15,"因果":-2}}]},{"id":"ximo_044","题":"寺下的菩萨","类":"秘闻","重":2,"域":["ximo"],"境界":[2,9],"段":["枯骨寺后院有一口枯井，{人物}说井底下埋着一位即将圆满的菩萨，寺里三百年不吃肉、不杀生、不点灯，都是为了不惊动他。他说的“菩萨”两个字，用得极轻，像怕被谁听见。","{天象}。他领你到井边，井里没有水，只有一层极细的沙，风一吹，沙面上会浮出极浅的字，像有人在底下写字。你等了半个时辰，沙面上浮出四个字：还有几年。","沙门的人从不解释这四个字，{人物}也不解释。守碑人只问你一句：愿不愿意下去，替寺里问一句准数。他说下去的人，多半会被那四个字留着。"],"择":[{"名":"下井问数","文":"你顺着旧绳下井，沙没到膝。你在沙里坐了一夜，什么也没看见，只听见极轻的呼吸。天亮时沙面上多了两字：不必。你爬上来时恍然大悟：他不是在等圆满，是在等人来问。","果":{"悟性":4,"修为":120,"道心":2,"寿元":-3,"因果":1}},{"名":"填井封事","文":"你把井口的沙推下去填了一半，说这种事问不得。守碑人没有拦，只在你填完之后跪下磕了一个头，磕得很重。那一夜寺里的钟自己响了一声。你此后每走西漠的夜路，都觉得后头有人在数步数。","果":{"因果":3,"道心":1,"声望":-3,"气血":-10}},{"名":"报知宗门","文":"你把井的事透给了{宗门}，想换个靠山。三日后来了两个执事，把井刨成一个大坑，什么也没挖到，只挖出一具盘膝的枯骨，指骨上还挂着一串断珠。他们带走枯骨，井封了，寺里死了一个守碑人。","果":{"灵石":60,"因果":4,"魔念":2,"声望":-8}}]},{"id":"ximo_045","题":"城门的灯","类":"秘境","重":2,"域":["ximo"],"境界":[3,11],"段":["{地点}的城门每二十年露一次，露时会有灯。灯不是火，是城里还没散的灵机凝成的光。你到的时候，门已经开了一半，光从门缝里溢出来，照在沙上像一条路。","{天象}。据{功法}的残卷，这座城当年是在一夜之间沉下去的，城里的人还没来得及跑，所以城里的东西都还摆着：案上有饭，柜上有钱，库里有货。可进去的人，十个里有九个忘了自己是怎么出来的。","{地点}的门外沙上有几行新脚印，往里，不往外。你腰间的罗盘已经不动了，指针死死朝前。"],"择":[{"名":"入城取宝","文":"你进了城，走过三条街，在一间铺子里收了三匣旧钱和一柄没有锈的剑。第四匣你没敢拿——匣盖上刻着一个还在动的名字。出城时门已经窄了一半，你几乎是滚出来的，回头再看，沙地上只剩一条浅浅的凹痕。","果":{"灵石":380,"器物":2,"寿元":-8,"因果":3,"修为":90}},{"名":"只录其貌","文":"你不进门，在门外蹲了三天，把城门的形制、街巷的走向、灯火的明灭一一画在布上。城沉下去之后，这张图成了西漠最贵的一张图，也让你成了唯一一个没进过城却知道城长什么样的人。","果":{"悟性":5,"灵石":140,"声望":10,"修为":40}},{"名":"堵门填沙","文":"你把驼队所有的货箱拆开，用木板和沙石把半开的城门堵死。城里的光在门后慢慢暗下去。做完这事你身上没剩什么值钱的东西，只听见门后有人轻轻叹了口气。那口气你记了一辈子。","果":{"道心":3,"因果":-4,"声望":8,"灵石":-150}}]},{"id":"ximo_046","题":"卖水的秤","类":"市井","重":4,"域":["ximo"],"境界":[0,5],"段":["{地点}的井边排着长队，{人物}守着一杆秤卖水，一升一称，差一钱都不给。他的秤砣是铁的，铆得死死的，据说是上面发的，谁也不能动。可你看见他在称完之后，总要用手在秤杆上抹一把。","你买了一升，倒进自己囊里，觉得分量不对。你把水又倒回秤上，只有八两。他不慌，说秤是公家的，你要是不服，去找官差。{天象}，队伍后头有人开始骂，骂得很小声。","你身后是个抱着孩子的女人，{天象}，她的囊已经空了两天。你手里有一把刀，也有一杆自己的秤。"],"择":[{"名":"当众校秤","文":"你把自己的秤搬来，当着所有人的面把他那杆秤校了一遍：秤杆里灌了铅。人群炸了，他的摊子被推倒，水洒了一地。官差来的时候，他把责任全推给了上头，说是上面发的秤。那口井后来换了守水人。","果":{"声望":12,"因果":-1,"气血":-8,"灵石":10}},{"名":"私买暗秤","文":"你把他拉到一边，用二十块灵石换他那杆灌了铅的秤，说往后我按这个称卖给别人。他愣了很久，把秤给了你，还教你怎么抹秤杆才不留痕。你靠这杆秤赚了不少，也从此不太爱喝井水。","果":{"灵石":90,"魔念":2,"因果":2,"声望":-6}},{"名":"替女人付账","文":"你没吵，多买了一升，塞给身后那个女人。她抱着孩子，没道谢，只把你看了两眼。三个月后你的驼队在白骨滩断了水，一队过路的商队匀了你两囊，领队的就是那个女人，她说：我记得你的眼睛。","果":{"灵石":-10,"声望":8,"因果":-2,"道心":1}}]},{"id":"ximo_047","题":"白驼的请帖","类":"宗门","重":3,"域":["ximo"],"境界":[2,10],"段":["{人物}送来一张请帖，纸是上好的皮纸，火漆是{宗门}的印。帖上只写了一句：三月之后，绿洲论货。落款没有名字，只有一个骆驼的图记。他说这是白驼商会三年一次的暗会，去的都是有货的人。","论货不是卖货，是排座次。谁能坐上前三张桌子，往后三年的商道就归谁先挑。{天象}，你的驼队在道上刚起来，本钱不够，名声也不够。可你手里有一样东西，是别人没有的：一条没人走过的道。","请帖压在桌上，火漆上那枚{器物}在灯下泛红。赴会要带一份“压桌的货”，压不住，就得当场认输。"],"择":[{"名":"以道为货","文":"你没带灵石，只带了一张自己画的路图：从{地点}直插赤沙渡，比老道近两日，水点三处。会上没人信，一位老掌柜按图走了一趟，回来时一句话没说，把自己的桌子让给了你。此后三年，那条道归你先走。","果":{"声望":18,"灵石":120,"悟性":4,"因果":1}},{"名":"重金买座","文":"你借遍了西漠的柜上，凑了一千二百块，压了一张桌子。座上有人对你笑，笑得客气，可那笑里有一种“买来的”意思。三年里你确实挑了最好的道，也三年没睡过一个安稳觉。","果":{"灵石":-1200,"声望":12,"寿元":-4,"因果":2}},{"名":"借刀压桌","文":"你把流沙盗盗首的旧账抄了一份，摆在桌上当压桌货。满堂失色。会长当场给了你第二张桌子，也当场让两个掌柜收拾了行李。你坐上了那张桌子，可从那天起，你的名字进了更多人的册子。","果":{"声望":14,"灵石":200,"魔念":3,"因果":4,"道心":-2}}]},{"id":"ximo_048","题":"沙印","类":"秘闻","重":2,"域":["ximo"],"境界":[4,12],"段":["{地点}的地面上有一枚极深的掌印，五道指痕各有一丈长，印底的沙是琉璃。{人物}说那是化神修士当年一掌按下去的，为的是把沙下的一件东西镇住，镇了七百年，掌印到今天还没被风磨平。","{天象}。你在掌印边站了半个时辰，忽然觉得脚下有东西在往上浮，一种极缓的、按压不住的上浮。{功法}里说，这种镇印若是被人坐进去，坐的人要么接了这份镇压，要么把镇的东西放出来。","{地点}的掌印中央，沙正在微微拱起，一股说不清名的腥气从底下渗上来。你只须坐进去，什么也不必做。"],"择":[{"名":"入印续镇","文":"你盘膝坐进掌印，第一天只觉得冷，第三天开始听见底下有无数声音在争。你坐了七日，起身时掌印又深了一寸，你鬓角白了半截。此后西漠的沙暴少了许多，没人知道为什么。","果":{"修为":420,"寿元":-30,"道心":4,"因果":-4,"声望":16}},{"名":"拔印放物","文":"你用尽全力把掌印里的沙挖开，底下露出一角漆黑的棺盖，棺盖下有什么在笑。你只听了半声就退了。棺盖合上了，掌印却裂了，从此{地点}每夜都有低低的呼吸声，路过的驼队都绕行。","果":{"修为":300,"因果":6,"魔念":4,"寿元":-10,"声望":-12}},{"名":"刻字留证","文":"你在掌印边刻了一行字：某年某月，此地有印，印下有物，后来的人莫坐。刻完之后，你把整件事写成一卷，交给了{宗门}。宗门把这一卷收进藏书，也把你的名字写进了守印人的名册。","果":{"悟性":5,"声望":12,"修为":120,"灵石":60,"因果":1}}]},{"id":"ximo_049","题":"金丹的聘","类":"宗门","重":3,"域":["ximo"],"境界":[3,10],"段":["{人物}是{宗门}里的金丹修士，一身黄袍，走沙不带水。他找你谈的是一桩买卖：替他押一趟货去{地点}，货不值钱，值钱的是路上不许有第二个人知道。聘金是三百块灵石，另加一件法器。","{天象}。他说得太坦然，坦然到不像在撒谎，也不像在说真话。可他给的法器你认得，是沙门的东西，苦行僧从不外传。一个金丹修士手里拿着沙门的法器，这本身就是一句话。","货是一只{器物}，锁着，不重。他说路上若有人拦，报他的名字即可；若有人不认他的名字，那就别报了。"],"择":[{"名":"接货押运","文":"你押着货走了九天，路上遇见两拨人，报了名字都退了。到了地头，接货的是个瞎眼老头，摸了一把箱子的锁，说：还是那把。给了钱，又加了一句：箱子里的东西，你不想知道，很好。","果":{"灵石":300,"器物":1,"因果":2,"悟性":2}},{"名":"开箱验货","文":"你在半路撬开锁，里头是一小坛沙，坛上封着沙门的封条。你把封条按原样贴回去，一路手心出汗。到了地头，瞎眼老头摸锁的时候笑了一下，说：封条动过。他没扣钱，只把你的名字记下了。","果":{"灵石":180,"悟性":4,"因果":3,"魔念":1}},{"名":"转告沙门","文":"你绕道去了枯骨寺，把事情说给守碑人听。他听完只说了两个字：拿去。你回去把货交给了金丹修士，什么也没问。半年后那位修士死在沙脊关外，死得极安静，坛子不见了，封条留在原地。","果":{"灵石":200,"因果":-3,"道心":2,"声望":6,"气血":-10}}]},{"id":"ximo_050","题":"沙尽头的门","类":"奇闻","重":1,"域":["ximo"],"境界":[5,13],"段":["{地点}再往西，沙就没有了，只剩一层黑石。黑石上立着一道门，门框是整块石头凿的，门里没有门板，只有风。{人物}说这道门每百年开一次，开的不是路，是选择：进去的人，能看见自己这一生所有的岔口。","{天象}。你在门前站了一夜，门里吹出来的风是暖的，带着一点绿洲的水味。据{功法}残卷，进门者会重走一遍旧路，走过的每一处都能改，只是改一处，后头的全变。","{天象}，天亮时门里的风停了，门框上的沙落尽，露出一行刻字：进去容易，出来要认。你身后的驼队还在等，有人在低声问要不要走。"],"择":[{"名":"入门重走","文":"你走进去，看见十七岁的自己站在绿洲的市口，手里攥着第一笔本钱。你没有改那一处，只跟着走了很久，看见每一个岔口，看见每一次没说出口的话。出来时你在黑石上坐了一整天，什么也没说。","果":{"悟性":8,"道心":5,"修为":300,"寿元":-20,"因果":-2}},{"名":"改一处旧事","文":"你改了。你回到白骨滩那一夜，把那个被你丢下的人扶上了骆驼。出来时他活着，站在门口等你，鬓角也白了。驼队里没人认得他。你这一生的账，从此多了一个要还的人。","果":{"因果":6,"修为":260,"道心":3,"寿元":10,"魔念":-2}},{"名":"封门不认","文":"你把驼队往后撤了半里，又叫人搬来黑石堵住门框。门里那阵暖风被压下去，慢慢凉了。你回头看见队伍里有个人在哭，问他为什么，他说不出。此后百年，那道门再没开过。","果":{"道心":4,"因果":2,"声望":10,"修为":100,"寿元":-5}}]},{"id":"ximo_051","题":"死了两回的人","类":"奇闻","重":3,"域":["ximo"],"境界":[0,7],"段":["{地点}的驿棚里坐着一个人，你说他眼熟，他也说你眼熟。后来你们同时想起来：三年前在白骨滩，你们替同一个人收过尸，还一起把尸首压在三块石头下。可那人现在正坐在你们对面，捧着一碗水喝。","{天象}。他说他确实死过一回，被沙埋了三天，醒来时身上的水囊是满的，旁边蹲着一头不认人的老驼。他讲得很平静，讲完把碗放下，说：我知道你们压过我的尸。这话让棚里所有人都不自在。","{人物}问你，当年压石的时候，有没有替他说过一句话。他说这话时不看你，只看碗底。棚外的风声像有人在磨刀。"],"择":[{"名":"如实相告","文":"你说当时什么也没说，只是把石头压紧了，怕有野物。他听了很久，忽然笑了，说这就够了，压石头的人比说话的人实在。后来他把自己那条道上的三个水点告诉了你们，一分钱没要。","果":{"声望":8,"悟性":3,"因果":-2,"灵石":20}},{"名":"编句好话","文":"你说当年替他念了一句经，愿他来世走好。他点点头，什么也没说，喝完水就走了。三个月后你在{地点}又听见他的名字，是别人在说：那人到处讲，西漠的骗子比沙还多，连给死人念经都是假的。","果":{"道心":-1,"因果":2,"魔念":1,"声望":-5}},{"名":"问他死法","文":"你追问他被沙埋的那三天是什么滋味。他沉默了很久，说：像有人在你耳边一直数，数到你忘了自己叫什么。他说完，你发现棚里没人再敢接话。他后来把一个水点的位置给了你，却再也不肯与你同席。","果":{"悟性":4,"修为":30,"因果":1,"气血":-5}}]},{"id":"ximo_052","题":"沙枣树下","类":"人情","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}的背风处有一棵沙枣树，据说是西漠唯一一棵还结果的树。{人物}守着它，一年只摘一次，摘下来分给过路的人，一人三颗，多一颗也不给。他说这树是他爹埋的，埋的时候只有一根指头粗。","{天象}。今年结果少，只剩半筐。排队的人却有三十几个，排到一半筐就见了底。后头有人开始嚷，说守树的自己留了半筐。他没辩解，只把空筐翻过来给大家看，筐底上有三个洞。","你排在最后，前面还剩五个人。{人物}抬头看了你一眼，那眼神像是在算要不要给你留。"],"择":[{"名":"让给后来","文":"你往后退了两步，说给后头带孩子的那户。他愣了一下，把筐底最后三颗倒进那孩子手里，又转身进屋，拿出一小袋沙枣干塞给你，说明年再来，我给你留一枝。第二年你去，树上真的系了一根红绳。","果":{"声望":10,"道心":2,"悟性":2,"因果":-1}},{"名":"出价买树","文":"你出三十块灵石，想把整棵树买下搬到绿洲去。他把钱推回来，说这树挪了就不结果了。你不信，半夜带人来挖，挖到三尺深就见根须像血管一样扎进沙里，怎么也断不开。天亮时你自己走了。","果":{"灵石":-30,"因果":2,"魔念":1,"悟性":1}},{"名":"替他分枣","文":"你帮他分，一人三颗，数得极准，嚷的人也不再嚷。分完他请你进屋喝了一碗枣茶，茶里没放糖，甜味是从枣皮里出来的。他说这树再活十年就该死了，到时候记得来，树死了要有人送。","果":{"声望":6,"气血":10,"因果":-2,"灵石":10}}]},{"id":"ximo_053","题":"白衣过沙","类":"争斗","重":2,"域":["ximo"],"境界":[3,11],"段":["一个穿白衣的人从{地点}的方向走来，走沙不带水，衣角上没有一点沙。他走得很慢，可你骑马追了半个时辰也没追上。{人物}说他不是走沙，是“行域”——金丹以上的修士以神念丈地，一步就是一里。","{天象}。白衣人在你们的驼队旁停了一停，问了一句：这条道上的水，是谁管的。他问得很客气，可每个人都知道这句话的分量。驼帮的老人已经跪下去了，跪得很熟练。","他没说要做什么，只把手抬起来，掌心朝下。这一手若是落下来，{地点}方圆三里都要塌下去一层。你站在最前面，脚下是这一趟全部的货。"],"择":[{"名":"如实答话","文":"你说水是驼帮管的，井是老井，规矩是老规矩。他听完了，把手放下，说了一句“知道了”，转身就走。走远之后你才发现后背全湿了。驼帮的老人说，你这条命是拿实在话换回来的。","果":{"声望":12,"悟性":2,"气血":-5,"因果":-1}},{"名":"献货求安","文":"你把驮架上最值钱的一箱推到他脚边，说这条道上下次不敢再挡前辈的路。他看了一眼箱子，没接，也没拒，只问：这是你自己想的，还是别人教的。你答不上来，他就走了，箱子留在沙里。","果":{"灵石":-200,"道心":-1,"声望":3,"魔念":1}},{"名":"拔刀相向","文":"你抽刀。刀刚出鞘一半，人已经跪在沙里，膝盖下面是一个尺许深的坑。他没有看你，只说了一句：沙子软，跪着不疼。这话你说不出是慈悲还是羞辱。此后三年，你在人前抬不起头。","果":{"气血":-30,"修为":60,"声望":-10,"道心":2,"寿元":-2}}]},{"id":"ximo_054","题":"货不过三","类":"市井","重":4,"域":["ximo"],"境界":[0,6],"段":["{地点}的市口有条不成文的规矩：一个人的货，同一日不许卖过三趟。过了三趟，行会就当你是在替别人洗货。{人物}是行会里管这条的人，手里拿着一本{器物}，谁卖了几趟都记得清清楚楚。","你今天已经卖了两趟，第三趟刚开价，他走过来了。他说得和气：再卖一趟，明天你就不用来了。你身后还有半驮的货，压着本钱。{天象}，市口上的人都在看你。","{人物}把簿子翻开，笔尖在纸上停住，等你说话。他其实也不想记这一笔，记一笔他就少一个熟人。"],"择":[{"名":"收摊罢手","文":"你把货重新盖上，说不卖了。他松了口气，在簿子上划了一道，说这才对。那天你在绿洲多住了三日，货压在手里，赔了一笔。可三年后你自己开了柜，行会里第一个替你做保的就是他。","果":{"灵石":-80,"声望":10,"因果":-2,"悟性":1}},{"名":"换人代卖","文":"你找了三个脚夫，一人分一小堆，让他们各卖一趟。这一手不算破规矩，可也不体面。他看出来了，什么也没说，只在你名字后头画了一个圈。这个圈的用处，你半年之后才明白：圈里的人，赊不到水。","果":{"灵石":60,"魔念":2,"因果":2,"声望":-6}},{"名":"当场认罚","文":"你说这一趟照规矩罚，罚多少我认。他愣了愣，罚了你二十块，又把第三趟的货按三成价收走。走出市口时他在后头喊：明天还来。你回头看见他簿子上的那一道，画得比旁人都轻。","果":{"灵石":-50,"声望":7,"因果":1,"道心":1}}]},{"id":"ximo_055","题":"盐湖底下","类":"秘境","重":2,"域":["ximo"],"境界":[2,9],"段":["{地点}在旱季会干成一块白板，盐壳最厚的地方有半尺。盐帮的老人说，湖底压着一座旧盐仓，仓里存的不是盐，是当年盐帮与人打官司时埋下的“凭据”。他说话时一直在看你的手，像是在掂你有没有那个胆。","{天象}。你们在湖心凿开盐壳，底下果然是空的，有一股咸得发苦的风往上冒。绳梯放下去三丈，壁上凿着几行字，是几十年前的人名与数目。{际遇}这回事，到这时才显出后手。","{人物}说，凭据拿出来，盐帮就能把白盐湖的账重算一遍，可重算的账要有人担。他把灯递给你，灯很轻，火苗一动不动。"],"择":[{"名":"下仓取凭","文":"你下去，在仓底找到三只封着蜡的木匣，匣里是旧契、旧账和一枚官印。爬上来时盐壁塌了一角，砸掉了你半片指甲。凭据交出去之后，白盐湖的账重算了，盐帮里死了两个人，你分到的是一年免盐税。","果":{"灵石":120,"悟性":3,"因果":3,"气血":-15,"声望":5}},{"名":"封仓不启","文":"你把绳梯拉上来，让人把盐壳重新填实、浇卤水、晾三日。老人骂你胆小，可他也没再叫人下去。三年后湖底自己塌了一角，露出半个仓口，没人敢靠近。老人临死前拉着你的手说：你没拿，是对的。","果":{"道心":3,"因果":-3,"声望":6,"灵石":-40}},{"名":"抄录卖出","文":"你不拿凭据，只把壁上的名字和数目一一抄下，抄了整整两夜。抄本卖给了金沙楼，价不低。半年后盐帮换了三个头目，其中一个在换任那日被人按在盐堆里。你听说时正在数钱，数到一半停了。","果":{"灵石":90,"因果":4,"魔念":2,"悟性":2,"声望":-6}}]},{"id":"ximo_056","题":"老驼的最后一天","类":"人情","重":4,"域":["ximo"],"境界":[0,5],"段":["跟了你十一年的老驼，今日早晨起不来了。它卧在{地点}的沙上，眼睛还睁着，嘴里反刍的力气都没有。{人物}说走沙的人都懂这个规矩：驼若起不来，得由它的主人亲手了断，不能留给沙和狼。","{天象}。你蹲下去，摸了摸它的耳朵，耳朵是凉的。它年轻的时候替你驮过盐、驮过命，也替你挨过一刀。队里的人都站得远远的，谁也不看这边。割驼的病刀已经在手里了，握得手心出汗。","远处有一队{器物}正过来。你可以等他们过来做个见证，也可以现在就办。"],"择":[{"名":"亲自动手","文":"你按住它的脖子，一刀下去，很快就完了。血没有溅出来，沙吸得干干净净。你在它旁边坐了很久，起来时把它的铃解下来系在自己腰上。此后那串铃你一直带着，走路时会响，响得像谁在后面跟着。","果":{"气血":-10,"道心":2,"声望":6,"因果":-1,"寿元":2}},{"名":"留水待死","文":"你没动刀，只给它留了一囊水和一堆草，然后带着队伍走了。三天后你绕回来，它已经硬了，沙里有狼的脚印，但肉没被吃。你把它的骨埋了，压了三块石头，什么也没说。队里没人问你为什么绕回来。","果":{"灵石":-20,"道心":-1,"因果":2,"悟性":1,"声望":-3}},{"名":"转卖他人","文":"你把老驼卖给了收尸人，换了五块灵石，说驼还没死，肉还新鲜。收尸人看了你一眼，没多问。三个月后你在{地点}看见那副驼骨被做成架子，挂在一家铺子的门口，铃还挂在骨上。","果":{"灵石":5,"魔念":1,"因果":2,"声望":-8,"道心":-2}}]},{"id":"ximo_057","题":"沙门的路引","类":"宗门","重":4,"域":["ximo"],"境界":[0,6],"段":["{人物}在{地点}给过路的人发路引，一片粗麻布，上头用炭画一条线，标出三处水点，不写名字，只按一个指印。他说这不是慈悲，是算账：走死的人少了，寺里就少收几具尸。","{天象}。他发到你面前，忽然收回了手，说你的指印按得太用力，像是要把布按穿。他说按得重的人，多半不信这条线，只信自己的脚。他把布翻过来，背面还有一行小字：不信者，勿行此道。","驼队已经在{地点}拔了营，前头三十里就是没有水点的死沙。他把布捏在手里，等你伸手。"],"择":[{"名":"接布循线","文":"你接了布，按了轻得几乎看不见的一个指印。三天里你严格照那条线走，一处没错，一处没省。到了{地点}，你数了数水囊，还剩半囊——往常走这条道，从来不会剩下。","果":{"声望":8,"气血":8,"悟性":2,"灵石":10}},{"名":"弃布自走","文":"你说我的脚比你的线准，转身带队进了死沙。第三天你们找到一处不在图上、却是真水的洼地，众人欢天喜地。第四天死了两个脚夫，是喝得太急呛进肺里的。你从此不再说自己的脚准。","果":{"气血":-18,"灵石":30,"道心":-1,"因果":2}},{"名":"讨要十张","文":"你要十张，说这布能卖钱。他看了很久，真给了十张，一张没多要。后来你在绿洲卖布，一张五块，卖得极快。第二年沙门改了路引的样式，你手里剩的七张，一张也卖不动了。","果":{"灵石":35,"因果":2,"魔念":1,"声望":-5}}]},{"id":"ximo_058","题":"蜃楼里的账","类":"奇闻","重":2,"域":["ximo"],"境界":[1,8],"段":["{天象}，你在{地点}的沙脊上又看见了那座城。这回城门口站着一个账房打扮的人，手里捧着一本簿子，正朝你翻页。风一过，页子哗哗地响，响得像真有纸。","{妖异}的说法是蜃景不会说话，可那人开口了，声音很闷，像从沙底下传上来。他说：你欠的三十七块，记在某年某月的某一条道上，你自己都忘了。你算了算，那年你确实借过钱，也确实没还。","{人物}把簿子往前递了递，说签个名，账就清了。沙脊上的风忽然停了，停下来的一瞬，连你自己的呼吸都听得见。"],"择":[{"名":"签下名字","文":"你在簿子上签了名，笔迹是别人替你写好的，你只按了个手印。城影散了，你身上一阵轻，像卸了什么。三天后你在一处旧驿的墙缝里摸出三十七块灵石，封得整整齐齐，木匣上刻着你的名字。","果":{"灵石":60,"因果":-3,"悟性":2,"道心":1}},{"名":"撕那本簿","文":"你伸手把簿子扯过来撕了。纸是沙做的，一撕就散，散成一片灰。那账房的脸忽然变得很清楚——是你自己的脸。城影散尽时，沙脊上只剩你一个人，和一脚印，只有半只。","果":{"因果":3,"魔念":2,"悟性":3,"气血":-12}},{"名":"转身不认","文":"你背过身下山，一路没回头，嘴里反复念着{地点}的名字，怕自己忘。走到天亮，城早散了，可你摸出怀里多了一本簿子，翻开是空的，只有最后一页写着：已阅，未签。","果":{"道心":2,"悟性":2,"因果":1,"灵石":-20}}]},{"id":"ximo_059","题":"守窟人","类":"人物","重":3,"域":["ximo"],"境界":[0,7],"段":["{地点}第十一窟的窟口坐着一个守窟人，看不出年纪，脸被风磨得像一块石头。他不许人进窟，也不许人走，只说一句：等。{人物}说他在这儿坐了三十年，等的是窟里那幅画自己画完。","{天象}。你问他要等多久，他说不知道，画到哪一笔停，都得等它自己走。他指着窟口一道极浅的刻痕说，三十年前画到这里，去年才又进了一寸。{器物}在他手边，落了厚厚一层沙。","{人物}忽然问你，要不要替他坐一日。他说这话时眼睛很亮，亮得像早就想好了。"],"择":[{"名":"替他坐一日","文":"你坐了一日一夜，什么也没发生，只看见日头在窟口的沙上走出一个弧。他回来时对你行了个礼，说三十年了，头一次有人肯替他坐。他把窟里那幅画的来历说了一半，剩下的一半，说等你再来。","果":{"悟性":3,"因果":-2,"声望":5,"气血":-8}},{"名":"趁夜入窟","文":"你等他睡熟，摸进窟里，看见了那幅画：画的是窟口，窟口坐着一个人，正在往里看。你伸手一摸，颜料是湿的。背后有人叹了口气，说：画完了。第二天窟塌了半边，守窟人不见了。","果":{"修为":150,"悟性":4,"因果":3,"气血":-15,"魔念":1}},{"名":"问他等什么","文":"你问他等这幅画做什么。他想了很久，说：我年轻的时候，画里那个人是我；后来画里的人换了，我就不知道该不该走了。你说那就走。他摇摇头，说：走不了，画还没画完。","果":{"悟性":5,"道心":2,"因果":1,"灵石":0}}]},{"id":"ximo_060","题":"夜半车队","类":"灾祸","重":3,"域":["ximo"],"境界":[0,7],"段":["半夜里，{地点}的沙脊上过来一支车队，十几峰驼，铃都摘了，走得极静。你们在背风的沙窝里数，数到第七峰时，{人物}按住了你的手：那车队没有影子。月光这么亮，沙上却一道影子也没有。","{天象}。车队走到你们正对面停下了，停得很整齐，像有人喊了一声。为首的那峰驼转过头，驮架上的{器物}晃了一下，铃没响。你听见有人在低声说话，说的是你们队里三个人的名字。","沙窝里没人敢动。那车队等了一炷香，又慢慢往前走，走向{地点}的方向。你们可以让开，也可以跟上去看个究竟。"],"择":[{"名":"让道不惊","文":"你们把火埋了，趴在沙窝里一动不动，直到那队影子走远。天亮后你们在白骨滩上看见十几副驼骨，摆得整整齐齐，像一列车队。骨堆中间有一个新压的沙包，沙包上放着你们队里丢的那只水囊。","果":{"道心":1,"气血":-8,"悟性":2,"因果":1}},{"名":"尾随查探","文":"你跟了半里，越跟越冷，那车队走过的沙面上没有痕，只有一层薄薄的白霜。走到第三里时，前头一峰驼回过头来，脸上没有眼睛。你转身就跑，跑回沙窝时天已亮，队里少了个人，谁也说不出他什么时候走的。","果":{"悟性":3,"因果":3,"气血":-20,"修为":40}},{"名":"点铃相送","文":"老驼工说这是“回收队”，得点铃相送。你们把铃铛一串串挂起来，摇了一夜，摇到车队走远。那年这条道上没再出过事，老驼工说，是你们送了它一程。他第二年就死了，死前还在摇铃。","果":{"声望":9,"因果":-2,"道心":2,"灵石":-20}}]},{"id":"ximo_061","题":"沙脊上的旧枪","类":"争斗","重":3,"域":["ximo"],"境界":[0,6],"段":["{地点}的沙脊上插着一杆旧枪，枪缨烂成灰色，枪杆下半截被沙磨得发亮，看得出有人常年握着。{人物}说这枪插在此地三十年，换过七个主人，每个主人插上去的第二年就死了。","{天象}。他说这枪其实是个赌：谁能拔出来，谁就能拿走枪里封着的那点东西；拔不出来的人，往后走这条路会出事。他说话的工夫，已经有三个脚夫上去试过，都没动。","你走到枪前，沙面上的脚印乱七八糟，只有你这一行是新的。枪杆入手很凉，凉得不像晒了三十年的铁。"],"择":[{"名":"拔枪验货","文":"你一使劲，枪真的起来了，底下带出一只锈成块的小铁盒。盒里是半卷《沙暴指》和一枚旧铜牌。众人看你的眼神变了。你带着枪走了三里，忽然觉得后颈发凉，像有人在数你的脚步，就一直数到今天。","果":{"器物":1,"修为":60,"悟性":2,"因果":2,"气血":-10}},{"名":"按枪封沙","文":"你不拔，只把袖口的沙撒在枪杆上，按了三按，说这东西不归我。三个脚夫笑你胆小。三年后这条道上出过一桩大案，死了十几个人，只有当年没碰那杆枪的几个人，一个都没事。","果":{"道心":2,"悟性":3,"因果":-1,"声望":3}},{"名":"卖与商队","文":"你拔不动，就把这枪的位置卖给了白驼商会的一支商队，换了二十块灵石，说那底下有货。他们来了七个人，挖了三天，把整段沙脊翻了个底朝天。枪还在，人走了两具，剩下五个不认账。","果":{"灵石":20,"因果":3,"魔念":2,"声望":-6}}]},{"id":"ximo_062","题":"井边的哑谜","类":"奇闻","重":3,"域":["ximo"],"境界":[0,5],"段":["{地点}的井边蹲着个哑子，见人来了就伸手指井，再指自己的嘴，然后摇头。{人物}说他在此守了六年，从不取水，只在有人打水时这样比划，比划完就蹲回去。","{天象}。你今天渴得厉害，把桶放下去，提上来时水是浑的，底下沉着一些白色的碎末。哑子看着你，又比划了一遍，这次比得急，手一直在抖。井台上还有别人留下的桶，桶底都有白末。","队伍在后头催。这口井是方圆三十里唯一的水，绕开它，要多走两日。"],"择":[{"名":"弃井另寻","文":"你把水泼了，招呼队伍绕道。有人在背后骂你败家，你也认了。两天后你们在{地点}找到一处浅洼，水不多，够用。回程时你听说那口井里捞出过三具尸首，都是喝了水的。哑子还在井边蹲着。","果":{"气血":-5,"声望":8,"悟性":3,"灵石":-30}},{"名":"下井查底","文":"你吊着绳子下井，井壁半腰有个洞，洞里堆着十几只水囊和一堆白骨，白末是从洞顶的石缝里漏下来的。你把洞填死，又在井口立了块石头写了两个字。哑子对你磕了个头，从此不再比划。","果":{"悟性":4,"修为":40,"因果":-3,"气血":-12,"声望":6}},{"名":"照常取水","文":"你把水沉淀了半个时辰，撇去浮末，自己先喝了一碗，没事。队伍跟着喝了。三天后队里两个脚夫开始腹泻，其中一个没撑到绿洲。你把他们埋了，谁也没提那口井。","果":{"气血":-15,"灵石":10,"因果":3,"道心":-1,"声望":-4}}]},{"id":"ximo_063","题":"走在前头的人","类":"人情","重":4,"域":["ximo"],"境界":[0,6],"段":["商队里有个不成文的规矩：走在前头的第一个人，分货时多分半成。{人物}是这趟的前锋，走了三天，眼睛被风沙磨得通红。他说这半成不是白拿的，是拿眼睛换的。","{天象}。第四天他忽然勒住缰绳，说前头不对，沙面上有一道极浅的横痕。押队的人不信，说那是风刮的。两个人僵在原地，后头的驮队已经跟上来，骆驼挤成一团。","绕路要多走半天，直走可能撞上流沙盗的绊索。谁去探，谁就得走在最前头。"],"择":[{"名":"替他探路","文":"你下驼步行，走出半里，脚下果然绷起一根细索。你伏在沙里，用刀割断它，回头招了招手。整队人绕了过去，前锋把他的半成让给了你。你没收，他就把这事记了一辈子。","果":{"声望":12,"气血":-8,"悟性":2,"因果":-1}},{"名":"依他绕行","文":"你说绕。押队的人骂骂咧咧，可还是绕了。多走半天，多耗两囊水，到绿洲时天都黑了。后来有队人从那条直道过去，第二天在白骨滩上被人抬回来三具。押队的人没再提那半成。","果":{"灵石":-20,"声望":7,"气血":-5,"悟性":1}},{"名":"逼他先行","文":"你说规矩里写着前锋先走，你若怕就换人。他看了你很久，一个人往前走了。走了不到百步，沙里窜起一根绊索，人摔下驼背。你们把人抬回来，他的腿断了，你说这半成还是你的。","果":{"灵石":30,"魔念":3,"因果":4,"声望":-14,"道心":-2}}]},{"id":"ximo_064","题":"白驼的死账","类":"宗门","重":2,"域":["ximo"],"境界":[2,9],"段":["{人物}是白驼商会的二掌柜，管着十几条商道的分润。他找你，是为了一笔“死账”：三年前有一支商队在{地点}整队失踪，货没了，人也没了，账上却还挂着三千七百块。","{天象}。他说这账再挂下去，商会的会首就要换人。他要你去那处地方走一趟，找一样凭据，什么都行，只要能证明那批货是被人劫的，不是他自己吞的。他开的价，是一成。","他把一张{器物}摊在桌上，图上标着那支商队最后的落脚点。他等你说话，手指一直在图的边角上来回蹭。"],"择":[{"名":"受命查账","文":"你去了那处地方，在沙下三尺挖出一堆烧焦的驮架和七副骨。骨上都有刀痕，是流沙盗的路子。你带回一截烧黑的铜牌，二掌柜凭它保住了位子，也真给了你一成。此后白驼的货，你能先挑。","果":{"灵石":370,"声望":10,"因果":1,"气血":-15}},{"名":"反查二掌柜","文":"你没去沙里，先去查了账。三千七百块里有八百块是二掌柜自己划走的，划得极干净。你把这一页抄了下来，没有交出去，只让他知道你有。他给了你双倍的钱，从此见你绕道走。","果":{"灵石":700,"魔念":3,"因果":3,"声望":-5}},{"名":"劝他认账","文":"你说这账查不清，不如认了，把货赔上，人还能留。他沉默了很久，最后真赔了，把自己的宅子也抵了。商会没换人，他改做最苦的押货。三年后他病死在道上，死前托人给你带了一句：谢谢。","果":{"声望":14,"道心":3,"因果":-3,"灵石":-40}}]},{"id":"ximo_065","题":"沙下的手","类":"妖异","重":3,"域":["ximo"],"境界":[1,8],"段":["{地点}的沙面上露出一只手，五指张开，指甲缝里塞满沙。{人物}说这只手露出来已有半月，谁也不敢碰：碰过的人，第二天会在自己手上看见同样的沙。","{天象}。你蹲下去看，那手不是干的，指节还有弹性，像底下的人只是埋着，没死。风一起，沙面上又拱起一小片，像底下有人翻了个身。{妖异}的说法是，这是沙在“记人”，记到谁，谁就得留下。","队伍里已经有人在念经，也有人在收拾东西准备走。你可以把这只手埋回去，也可以挖开看。"],"择":[{"名":"覆沙掩之","文":"你把沙推回去，压了三块石头，又把自己的水囊倒了一点在上头。第二天沙面上什么都没了，连石头也沉下去。队里没人再提。你后来洗了很多次手，指甲缝里总有那么一点沙。","果":{"道心":2,"因果":-2,"声望":5,"气血":-5}},{"名":"掘沙见人","文":"你挖到三尺，见一具保存得极完整的尸首，穿着几十年前的商队短打，怀里揣着一封没写完的信。你把信读了，才知道他是替人顶罪的账房。你把人和信一起埋了，只把那封信的末尾一句记住。","果":{"悟性":4,"修为":60,"因果":-3,"寿元":-2}},{"名":"断手取骨","文":"你一刀切下那只手，想卖给黑市——据说沙下露出的手骨可炼药。断口没有血，只有沙流出来。回程时你的左手开始不听使唤，先是发抖，后来连刀都握不稳。那只手，你到死也不知扔去了哪里。","果":{"灵石":90,"气血":-30,"因果":4,"魔念":3,"寿元":-6}}]},{"id":"ximo_066","题":"埋沙铁","类":"机缘","重":4,"域":["ximo"],"境界":[0,7],"段":["{地点}的沙下有铁，这是走沙人都知道的事。铁是几百年前一场大战留下的，埋得深，锈得只剩一层壳，可壳里的铁芯极纯，锻出的刀能斩断寻常法器。{人物}说这一带的铁，得看沙色——沙面泛青的地方，底下才有。","{天象}。你们在泛青的沙地上挖了一天，挖出三块铁胚和一堆碎骨。碎骨里有人的，也有不算人的。{际遇}这回事，在铁胚里也藏着：第二块铁胚的断面里，嵌着半枚符纹。","押队的说天要黑了，得走。可沙色最青的那一片，还没动过一铲。"],"择":[{"名":"连夜再挖","文":"你们点了火把挖到半夜，挖出七块铁胚，最大的一块有半人高。回程时骆驼累死了一头，铁分两次才运出去。这批铁后来打成了四把刀，其中一把跟了你很多年，刀名就叫“青沙”。","果":{"灵材":3,"灵石":150,"气血":-20,"修为":40}},{"名":"只取三块","文":"你说三块够了，再多带不动，路上要出事。押队的不服，可也认了。果然出关那日遇上盘查，货少，罚得也少。你后来听说另一队人挖了十几块，走到半路被流沙盗截了，一个没剩。","果":{"灵材":2,"灵石":80,"悟性":2,"声望":4}},{"名":"卖地与人","文":"你把那片沙的位置卖给了{宗门}的器修，换了七十块灵石和一句“以后打刀打折”。他们雇了三十个人挖了半个月，把整片沙翻成一锅粥。那之后，这一带再没出过一块好铁。","果":{"灵石":70,"因果":2,"魔念":1,"声望":-3}}]},{"id":"ximo_067","题":"风口的名字","类":"天象","重":3,"域":["ximo"],"境界":[0,6],"段":["过{地点}要摘铃，这是规矩。你们摘了铃，一声不吭地往口子里走。走到一半，风里忽然有人喊了一个名字，喊得很清楚，是队里一个脚夫的名字。那脚夫下意识应了一声。","{天象}。应完之后他自己也怔住了，回头看你，脸是白的。老驼工什么都没说，只把自己的外袍脱下来披在他身上，让他走在队伍中间。风还在喊，一个名字接一个名字，喊到第三个时，队伍停了。","那个名字是你。声音很轻，轻得像在耳边说的。"],"择":[{"名":"闭口不应","文":"你咬住牙，一声不出，只在心里数数，数到一百，风就过了。出风口时你的耳朵里流了一点血，可人还是齐全的。那个先应了的脚夫在第二日就走了，走时一句话没留。","果":{"气血":-10,"悟性":3,"修为":30,"道心":1}},{"名":"朗声应之","文":"你应了。风忽然停了，静得能听见沙落。老驼工脸色大变，把你按在沙里，用外袍裹住你的头。你闷得几乎断气，出来后什么也没发生，只是从那天起，你再想不起自己母亲的名字。","果":{"悟性":5,"因果":3,"气血":-15,"道心":-2,"寿元":3}},{"名":"以名换名","文":"你把一个死人的名字念了出来——那是个该死的人。风里的声音停了半晌，忽然转向，朝风口深处去了。老驼工看着你，什么也没说，只在走出十里之后才开口：这一手，不是好人所为。","果":{"魔念":3,"因果":3,"悟性":2,"声望":-5,"气血":5}}]}]},"luoxia":{"词汇":{"人物":["赤霄剑宗的外门弟子","丹霞观提药篓的丹童","百炼山掌钳的器师","背剑独行的游方剑客","上山采药的散修","在赤岩上烧炭的老翁","替丹霞观跑腿的伙计","赤霄峰执剑长老","丹霞观守炉的知客","百炼山淬火的匠人","断剑崖守碑的哑仆","雷雨夜赶路的行商","赤岩栈道上的驿卒","西岭一带的猎户","山脚的药农","挑担叫卖的行脚货郎","剑冢前守了三十年的老卒","赤霄执法堂的刑剑使","丹霞观外门的药商","百炼山试器的少年","云游到此的鉴宝人","被逐出师门的落魄剑修"],"地点":["断剑崖","金乌岭","赤髓谷","电蛇脊","炉烟坳","丹香坪","碎剑滩","煮丹泉","晒药台","赤岩栈道","雷公坳","铁砧峰","落霞坡","血染原","西岭关","赤云坪","火枣林","赤烟崖","乱石渡","铸剑庐"],"天象":["赤霞如血","电蛇盘脊","雷云压顶","金乌残影掠过天际","赤雨打石","晚照烧云","山火过岭","雾裹断崖","赤虹贯日","焦雷落谷","赤云倒卷","火流星坠地","日晕三重","风裹赤尘","夜霞不散","雷音滚地","地气上蒸","赤光映着半边天"],"妖异":["三眼赤狼","火髓蟒","断翅的金乌后裔","赤鳞蜥王","雷纹电豹","丹毒傀儡","炉中火鬼","剑冢怨灵","赤鸦群","熔岩蟾","赭面山魈","血翅鹫","赤甲蜈蚣","吞火鼠","剑魂残影","丹成妖胎","赤岩石人","披赤毛的野彘"],"器物":["断锋残剑","赤铜剑匣","三足丹炉","九转药鼎","百炼铁锤","火纹护腕","赤玉剑穗","焦黑的剑鞘","鎏金药葫芦","淬火铁砧","玄铁针囊","赤髓灯","雷纹铜镜","血玉算盘","旧剑谱残页","火漆丹封","赤霄令剑","试器石","丹霞账册","锈蚀的剑格"],"灵材":["赤髓砂","千年火枣","落霞石","赤心草","火髓乳","雷击赤木","丹霞紫芝","地火精","赤铜矿","血纹铁矿","火枣核","赤岩苔","金乌羽屑","赤砂髓晶","煮丹泉水","赤焰花","焦土参","火纹石胆"],"功法":["《赤霄断剑诀》","《丹霞九炼经》","《百炼淬锋录》","《焚天剑意》","《赤髓炼体法》","《金乌坠日诀》","《丹火焚心篇》","《铁砧九锤》","《落霞剑歌》","《煮丹守一法》","《赤鳞锻骨术》","《电蛇引雷诀》","《断锋问心剑》","《火枣养元功》"],"际遇":["于断崖下拾得半截断剑","在晒药台外偷学了一味丹方","替百炼山匠人拉了三个时辰风箱","在雷雨夜被电蛇追进山洞","于煮丹泉边遇见一位闭关的老丹师","拾到一枚烧焦的赤玉剑穗","在火枣林里救下一只赤羽雏鸟","于碎剑滩挖出一柄锈死的剑","替丹霞观押送一车丹药","在赤岩栈道与一名剑修对饮一夜","于金乌岭看见坠日的残影","在炉烟坳讨得一碗热汤","替西岭关的守卒修补断刀","在剑冢碑前抄了一夜碑文","于赤髓谷采得一块血纹铁","被丹霞观伙计塞了一枚试药丹","在雷公坳躲雨时听人论剑","于百炼炉旁捡到一枚裂纹剑格","在落霞坡看赤霞落尽","替行脚货郎背了一程药箱"],"祸患":["被同门诬陷盗取丹方","被丹霞观追讨欠下的药钱","在断剑崖被赤霄剑修指为魔修","遭百炼山匠人当众毁去法器","被火髓蟒咬穿肩胛","背上私炼禁丹的嫌疑","被雷雨夜的电蛇缠住脚踝","被丹霞观列入催债名册","于剑冢前触怒怨灵","被赤霄执法堂通缉","在集市上被人换走了真丹","被山火困在赤烟崖","被赭面山魈夺去行囊","欠下百炼山一笔重债","被同行指认偷师","在雷公坳遭人伏击","被丹毒傀儡误认作炉主","遭赤鸦群啄伤双目"],"宗门":["赤霄剑宗","丹霞观","百炼山","赤霄执法堂","丹霞观外门","百炼山试器堂","断剑崖剑冢","赤霄峰剑堂","丹霞洞天","百炼炉","西岭商会","天涯阁"],"地名":["落霞山脉","赤霄峰","丹霞洞天","百炼炉","断剑崖","金乌岭","赤髓谷","西岭关","雷公坳","铁砧峰","落霞坡","煮丹泉"]},"图鉴":[{"类":"地理","名":"落霞山脉","卷":1,"文":"西岭之脊，绵延七百里，土石皆赤。相传上古有金乌负日而行，力尽坠于此地，翼骨裂山，血渗入土，故此山三千年不改其色。山中有灵脉三条，皆从地火上来，故灵机虽只一点三，火气却冠绝九州。山势极险，赤岩如刀，断崖如劈，山道多在半壁之上，宽处可并行三人，窄处只容一脚。当地人说这山不养人，只炼人：能在这山里住满三年的，出去都是一把好手；住不满的，多半埋在了赤岩底下。每逢申时，满山赤霞如血，山民谓之霞落，此时不宜登高。","引":"《西岭志》云：赤岩七百里，寸土皆带火气。"},{"类":"秘闻","名":"金乌坠地","卷":1,"文":"落霞山脉最古的传说，说天上有十日，其一为金乌所负。金乌战败，折翼西坠，撞入此山，翼骨断处化为赤髓谷，血洒之处长为火枣林，余烬三千年不冷，故山中有地火，有赤霞，有雷雨夜盘在脊上的电蛇。山民至今不敢在申时之后高声言语，怕惊了那具埋在地下的骨。传闻金乌未死，只是沉睡，每三百年显一次影，影过之处山石烙上火纹。取火纹者可得天火，然承其火者亦承其坠——这是骨上残字，认得全的人不多，认得全还敢取的更少。","引":"取其火者，承其坠。"},{"类":"地理","名":"断剑崖","卷":1,"文":"赤霄峰西三十里，一崖孤悬，崖顶有一道两尺宽的石缝，深不见底。此崖只办两件事：立誓，了断。赤霄剑宗三百年来的私斗、问罪、试剑，多在此处了结。崖下是剑冢，埋着折在剑下的弟子，一人一碑，碑上不刻名，只刻剑名。碑林无人看守，只有一个哑仆每日扫叶。崖风极利，常年裹着赤尘，站在崖顶说话，声音会被风吹散一半，故此地立誓最实——话说不全，反倒没人赖。","引":"崖上无第三人，故崖上无假话。"},{"类":"宗门","名":"赤霄剑宗","卷":1,"文":"天下剑修三大宗之一，驻赤霄峰，道统剑道兼火法，脾性刚烈。宗中规矩只有一条：剑出必见血。弟子入门先折一柄自己的剑，再以剑意凝出新剑，谓之断剑关；过得去的是剑修，过不去的终身只是持剑的人。宗门最盛时弟子逾千，如今虽只余三百，仍是西岭第一等势力。宗主为一柄断剑所困三百年，据说那剑是宗门老祖自刎之物，剑意不散，压着整座赤霄峰。宗中执法极严，问罪不问缘由，只问动没动剑——这一条救了宗门，也害了不少人。","引":"剑堂有训：剑不问对错，只问出鞘与否。"},{"类":"宗门","名":"丹霞观","卷":1,"文":"驻丹霞洞天，观中丹炉三百座，终年烟火不断。丹霞观以丹道立身，丹药销往九州，是西岭最富的一门。观主有句名言：丹可救人，亦可杀人，全看买主出多少灵石。观中规矩极细，赊账有账册，试药有丹童，验方有丹房，事事讲价，件件记账。外门弟子多兼药商，行走各域，一面卖丹，一面收账。观中真正的好丹从不外卖，全在洞天深处，给那些出得起价、也等得起年头的人留着。世人多鄙其市侩，可西岭方圆千里，伤重将死时第一个想到的，还是丹霞观的招牌。","引":"《丹霞账册》首行：概不赊欠，赊者记账。"},{"类":"宗门","名":"百炼山","卷":1,"文":"驻百炼炉，山中炉火三百年不熄，器修一锤一凿皆是道。百炼山不重境界而重手艺，山峰之上人人以「匠」自称，不以「修」自称。山规三条：器成必试，试断必究，究明必改。故百炼山出品，九州修士争抢，一柄百炼剑可换三年口粮。此山脾性固执，宁可不接活，也不肯在火候上让半分。与赤霄剑宗三百年来分分合合，一柄剑断了要争到崖上去，可山火一起，两边又会并肩救火。山中有试器堂，三年一开试器会，断了的器碎片堆成小山，无人清理。","引":"百炼山门联：一锤落定，不问前程。"},{"类":"法宝","名":"赤霄断剑","卷":2,"文":"断于六寸处，断口平滑如镜，非折非碾。相传为赤霄剑宗老祖自刎之剑，剑断人亡，剑意却不散，反把整座赤霄峰压在剑下三百年。宗主得此剑后闭关不出，宗门却在其剑意庇护下日益鼎盛。此剑无鞘，也无锋，触之如触寒铁，然以神念探之，会看见一片火海与一个站着不退的人。宗中有说：此剑不可拔，拔则一域震动；亦不可弃，弃则剑意散而宗门衰。凡在断剑崖上见过剑影的弟子，日后出剑都少一分花巧，多一分不回头的狠。","引":"剑断而意不折，此之谓赤霄。"},{"类":"丹药","名":"火枣养元丹","卷":2,"文":"以千年火枣为主，佐赤心草、煮丹泉水，用赤岩下引出的地火慢炼七日。成丹赤红，气甜而不腻，服之温养经脉，久服可壮气血、耐寒暑。此丹本为丹霞观密方，观中售价极昂，一枚索三百灵石。后有老丹师将方子流出，方边注两行小字：丹贵在不伤人，价贵在能救人。此丹最难在火候，早一分则燥，晚一分则滞，非地火不可成。另有一忌：服丹后三日不可动怒，怒则火走岔路，轻则经脉作痛，重则三日不能言语。","引":"丹有价，人不一定有。"},{"类":"异兽","名":"火髓蟒","卷":2,"文":"居落霞山脉赤髓谷一带的石缝中，粗如水缸，鳞下透火，性凶而多疑。此蟒以赤石为食，三五年蜕一次皮，蜕时最弱，也最凶。其蜕皮为上好火炼之材，市价极高，故每年都有人冒死在它蜕皮时来取。蟒目覆白膜时不能视物，全凭热息辨人，故取皮者多先以冷水浇身。传闻此蟒是金乌血滴入石缝所化，故其胆可解百火之毒，然取胆必杀蟒，杀蟒者十有七八死在当场。山中猎人有一句话：蟒不怕人，怕的是人等它蜕皮。","引":"猎者语：逢蜕勿近，逢冬勿追。"},{"类":"风俗","名":"试器会","卷":2,"文":"百炼山每三年于铁砧峰下开一次试器会，凡持未成之器者皆可上台，不问出身，不问境界。比试不以胜负论，而以器能否撑到最后为准——器断即败，人伤不论。台上常堆满碎片，主事者在册上记数，碎一件点一笔。会中另设一册，专记能收手的人，谓之「知止册」。据说知止册上的名字后来多活过了金丹，而台边碑上的名字，多半死在结丹那几年。试器会结束时，凡断器者可由百炼炉重铸一次，重铸之器火纹不匀，然最耐磨。","引":"山谚：断过的器，才记得自己断在哪儿。"},{"类":"人物","名":"赤霄老祖","卷":2,"文":"名讳已不可考，宗中只称老祖。三百年前赤霄剑宗几乎灭门，老祖一人一剑守在赤霄峰上，与来犯者力战三日，最后把剑横在自己颈上。史书说他是力竭自刎，剑宗弟子说他是以命封剑，用一身剑意把宗门护了三百年。此后那柄断剑便插在峰顶，无人能拔。宗中流传一句：老祖不是死了，是把自己留在了剑里。凡在断剑崖见过剑影的弟子，多半会在梦里见到一个背对着的火中身影，站得笔直，从不回头。","引":"《赤霄剑谱》残页：一人一剑，退无可退。"},{"类":"功法","名":"赤霄断剑诀","卷":2,"文":"赤霄剑宗镇宗剑式，共九式，前三式只求快，后六式专求「断」——不是断敌之剑，是断己之退路。习者需以神念入剑，将剑意凝成一线，出手时不留后招。宗门弟子入门先折一柄自己的剑，再以剑意凝出新剑，就是为了练这一线。此诀最耗心神，练到第七式者往往性情大变，言语渐少，出手渐狠。剑堂有禁：修此诀者不得与人结亲，恐剑意牵连。三百年来学全的人只有两位，一位是老祖，一位据说死于金丹劫。","引":"剑出无悔，是诀，也是病。"},{"类":"秘闻","名":"赤髓砂","卷":2,"文":"赤髓谷特产的赤色砂粒，实为金乌血渗入赤岩后凝成的碎晶，色如丹砂，握在手里有极轻的灼感。此砂不入药，只作炼器引子：掺入铁料可增火性，淬火时能保器不脆。丹霞观也曾试以它入丹，十炉九炸，遂罢。市上有假货，多以赤石磨粉充之，辨法极简单——真砂入水不沉，浮在水面缓缓转圈，像有人在底下吹气。采砂者须在谷中深处作业，深过三丈便有塌方之险，故谷口常见新坟，坟前无人烧纸。","引":"采砂者歌：三丈之内有命，三丈之外有砂。"},{"类":"地理","名":"煮丹泉","卷":2,"文":"在赤烟崖下，一口泉眼终年冒白气，水温近沸，据说底下直通地火。泉水入口先甘后热，可通淤塞经脉，然心浮者饮之只觉烫，心静者饮之才补身。泉边常有老修士支炉煮水，一煮数月，说这泉水能教人明白火候——火不急，水才肯把话说完。此泉最忌贪多，传闻有年轻人连饮三碗，第三日便坐在泉边石上坐化，骨头至今无人收。近泉处有三块烧白的石头，山中人都绕行，说那是泉水自己挑的碑。","引":"泉边石上刻：水不催人，人自催。"},{"类":"法宝","名":"百炼锤","卷":2,"文":"百炼山匠人的本命之器，多由本人自打，锤头一侧略平、一侧带棱，平者定形，棱者修边。此锤不炼锋刃，只重分量，讲究「一锤落定，不问前程」。匠人以自身气血养锤，锤随人性，人急躁则锤声乱，人沉静则锤声如叩钟。百炼山的规矩是锤不离山：客卿可用山的铁砧与炉火，却不可带走他人之锤。据说当年一位匠人把锤借给剑宗弟子防身，锤在江湖上流了三年，回来后匠人三日不说话，只把锤重新养了半年。","引":"锤无锋，故能久。"},{"类":"丹药","名":"试药丹","卷":3,"文":"丹霞观新方既成而未验者，皆以试药丹称。此丹无定方，成色参差，凡称「试」者，皆不知其后果，故观中不用弟子试，而用买不起丹的人试。观外门有个不成文的规矩：赊账者以试药抵账，试一次抵若干灵石，试死了一次清。丹童多是从小买进来的，试药的活多半落在他们身上。试成的丹卖往九州，试不成的人守炉，守到炉冷为止。观主对此从无讳言：这山里的丹药，一半是药，一半是命，价钱早算进命里了。","引":"《外门杂记》：一丹之成，先试三人。"},{"类":"秘闻","名":"剑冢夜哭","卷":3,"文":"断剑崖下的剑冢埋着三百年折在剑下的弟子，一人一碑，碑不刻名，只刻剑名。近十年来，每逢新月之夜的子时，冢中有人哭，哭声细而长，起于地底，止于崖壁。有胆大的弟子探过，回来只说一句：哭声不是一个人在哭。宗门查了三年，查到一块新碑便不再查了——那碑下压着一名替师门顶罪的弟子，罪认了，剑也断了。老执事说这种事每代都有一桩，桩桩都埋在这片土里，土里埋得多了，自然要哭。","引":"碑上无名，土中有人。"},{"类":"风俗","名":"霞尽三日","卷":3,"文":"落霞山脉一年只有三日霞光能落尽。落尽之时，山会暗下来，赤色从岩壁上一寸寸剥掉，露出底下灰冷的石。当地有个老规矩：霞落之时不上高处，因为山里的东西会往上走。据说不守规矩的人，大多看见了不该看的东西，回来之后不是病就是哑。山民在霞尽前一日要煮赤豆，第二天不许高声，不许走夜路，不许在山道上点火把。这三日里若有人死了，葬礼也要延后，怕与山里的东西照面。","引":"山规第一条：霞落不上崖。"},{"类":"人物","名":"哑仆","卷":3,"文":"本名不详，在剑冢扫叶已三十年。此人不识几个字，却能按碑石的纹路认人，每日早晚各扫一次墓前落叶。三十年前他曾是某位剑修的书童，主家获罪，他替主家顶了罪名，被割喉以证清白——割得不深，命留下来，声音再没回来。他住碑林外一间土屋，屋内除了一床干草，只有一摞用油布包着的布片，据说都是主家留下的遗物。凡在碑林借宿过的修士，多半记着他的干草铺与那一礼。","引":"无名之碑，有守之人。"},{"类":"异兽","名":"赤鸦","卷":3,"文":"形如常鸦而大一圈，羽墨黑，眼赤如炭火，居落霞山脉赤岩高处，成群而栖。此鸦不啄活人，只近将死者：人死前气先散，赤鸦看得见。故山中若见鸦群落在屋上不走，众人都知那家要办后事。赤鸦记仇，打落一只，便成群报复，啄人眼睛，故山民不敢招惹。另有一说：赤鸦是剑冢怨气所化，认得每一个生前怀恨的人。见过赤鸦围顶三圈而不死者，山里称之为「气硬」，多半是能活很久的人。","引":"鸦不啄生人，只啄将死之气。"},{"类":"地理","名":"电蛇脊","卷":3,"文":"落霞山脉最险的一段山脊，宽不过三尺，两侧皆是断崖，脊石赤黑相间，像是被反复烧过。雷雨天，雷会顺着脊线滚，电光在石上盘成细蛇，久久不散，山民说那是山在喘气。此脊有个怪处：站得直的人容易遭雷，贴着石头的人反倒能过去，故过脊者多伏地而行，远远望去像一排等着挨打的鱼。脊上每隔十步有一处凹坑，坑底积着黑灰，是历年雷击留下的。老手过脊必看云色，云压到头顶便不退不进，只等。","引":"过脊者言：此山不认勇，只认低。"},{"类":"功法","名":"丹霞九炼经","卷":3,"文":"丹霞观根本功法，共九炼，一炼一重火候，炼到第九重者，可徒手引地火。此经不以修为论高下，而以成丹数为凭：炼废一炉记一过，成丹百炉方能升一炼。观中弟子一面修经一面卖丹，卖出去了才算数，故丹霞观的人多半账算得清、话也说得好听。经中有诫：九炼之前，不得以丹害人。然此诫只说「之前」，故观中人都知道，第九炼之上，有些事就不必再问了。","引":"九炼之后，无诫。"},{"类":"法宝","名":"赤铜剑匣","卷":3,"文":"赤铜所铸，长四尺，宽六寸，匣内分三格，可纳三剑。此匣本为赤霄剑宗弟子出门所用，后因太重太显眼，宗中渐少人带，反成了丹霞观药商的抢手货——匣中空处可藏丹囊，关外查验时只当是剑匣。铸匣的手艺出自百炼山，铜中掺赤髓砂，能镇剑意，故久置匣中之剑，出鞘时更静。匣盖内侧常刻主人的名与年号，刻得极浅，须对着光才看得见。山中有句话：匣比剑长命。","引":"剑换了几柄，匣还是那个匣。"},{"类":"异兽","名":"丹毒傀儡","卷":3,"文":"非妖非鬼，乃试药而死之人所化。丹霞观试新方，成者活，不成者死；死者若被丹气浸透尸身，七日之内会自己站起来，守在炉边，认炉不认人。此物皮泛丹砂红，眼窝里只有两点白气，行动迟钝而力大，动了炉便扑人，杀之亦不易死。观中旧例，凡有新傀儡，皆封在废丹房里，等炉冷了自己倒下去。传闻傀儡在夜里会发出极轻的咳声，像人临死前那一下。见过的人说，那不是鬼，是药不肯放过他。","引":"《丹房旧录》：炉未冷者，勿启其门。"},{"类":"秘闻","名":"岭下金乌骨","卷":4,"文":"金乌岭深处有一道被赤岩封死的裂隙，裂隙之下埋着半具金乌遗骨：翼骨长逾数丈，另有一枚焦黑的头骨，骨中火气三千年未散，靠近者眉毛自卷。骨上刻有上古文字，一半已烧没，可辨者唯「取其火者，承其坠」一句。本地人视之为祖山禁地，不许动骨，说动了整山的火脉都要乱。可世上从没有守得住的秘密：三百年来从骨上取走的东西不少，取走的人后来大多不得善终，山民便说，这是金乌记着。","引":"取火者众，承坠者稀。"},{"类":"风俗","名":"崖上了断","卷":4,"文":"落霞山脉的修士有私怨，一般不上官府，也不找宗门，而是约到断剑崖上了断。规矩只有四条：一，只论剑，不论理；二，只许两人上台，旁人不助；三，输了的人自己走下崖，不得再提；四，死者的剑留给活着的人，活着的人要把剑挂回剑冢。这四条没有字据，全凭崖风作证，三百年无人破过。山里人信这个，理由很实在：官府收钱，宗门护短，只有崖上的风不认人。故这山里的恩怨，往往断得快，也埋得快。","引":"崖上四条，风中无证。"},{"类":"人物","名":"无名老丹师","卷":4,"文":"无人知其名，只见他在赤烟崖下有间半塌丹房，炉火烧了四十年。此人不出门，不卖丹，也不收徒，偶尔有人路过讨一碗水，他会顺手抓一把药渣给你。据说他年轻时是丹霞观最出色的丹师，后来因为一炉丹与观里翻了脸，自断两指，搬出洞天，再不肯踏进观门一步。他那一炉丹炼了四十年，中间断过三次火，每次断都赶上事：内斗、山火、逐徒。有人问他这丹炼成了给谁，他说给该给的人。","引":"炉火四十年，只为一炉。"},{"类":"秘闻","名":"千年火枣","卷":4,"文":"落霞山脉火枣林中最老的一批树，树龄逾三百年，人称之为千年火枣。枣大如鸡子，皮赤肉厚，生食可壮气血，入丹则为养元之主药。此枣三年一熟，熟时满树赤红如烧，最忌早摘——未熟的枣掰开是白的，吃下去反伤经脉。枣林有主，多归山民共有，分枣按人头，规矩是「树不分，枣分」。枣熟之夜常有妖物来啃枣核，故守枣的人要轮夜，火把不能熄。老枣树砍一棵少一棵，山民说这树是金乌的血养的。","引":"树不分，枣分；火不熄，人守。"},{"类":"地理","名":"西岭关","卷":4,"文":"落霞山脉东南门户，两山夹一道，城墙依岩而筑，砖色赤黑，年久剥落。此关是进出西岭的唯一大道，商队、镖师、散修、丹贩皆由此过，关下常年有市，卖药的、卖器的、卖消息的挤在一条街上。守卒多为世袭，父子相继，有人守了三十年未升一职。城门内侧有一堵墙，砖背上刻满名字，都是历年死在关外的人，据说刻到第四百七十六个时，刻字的人自己把名字也刻了上去。","引":"关下无善人，关上有名字。"},{"类":"秘闻","名":"赤雨","卷":4,"文":"落霞山脉偶尔会下红色的雨，雨点不大，落在石上留下浅印，晒干后洗不掉。山民说这雨是山在哭，每次下完都要死人。此雨实为金乌余火随云气上升、遇冷凝成的雨，水中带火气，稀释百倍后是极好的炼器引子，然不可直触皮肤——沾之起赤斑，斑过三年不退，重者丧命。接雨要用陶罐，铁器会被蚀出细孔。下赤雨的日子有讲究：若雨落三日不停，山中火脉必有异动，此时不宜入谷，不宜炼丹，也不宜与人动武。","引":"雨赤三日，山有异动。"}],"事件":[{"id":"luoxia_001","题":"断崖问剑","类":"机缘","重":3,"域":["luoxia"],"境界":[0,3],"段":["申时一到，满山赤霞如血，{地点}的石壁被烧得发烫。你循着一线细弱的剑鸣爬上半塌的崖道，看见{人物}正对着一柄插在石缝里的{器物}，一言不发地站着，肩头落满赤尘。","{人物}抬手要拔，剑身嗡然震出一圈赤光，将他整条右臂弹得发麻。他甩了甩手，回头看你，眼里没有求助的意思，只淡淡地说：这剑认主，认的是不怕断的人。你要试，先想清楚拿什么来换。","{天象}之下，崖风卷着砂石打在人脸上生疼。断剑半截入石，剑柄上那枚裂纹剑格还留着炉火的余温，仿佛有人前一刻才把它从火里捞出来，又随手插在这里等一个后来人。","{天象}压着崖道，你把手按上剑柄，掌心一阵灼痛。山道尽头的霞光正在一寸一寸退去，退到最后只剩细细一线，那一线正好落在你脚边，像是有人在等你自己把它踩断。"],"择":[{"名":"拔剑","文":"你咬牙一拔，剑格应声裂开细缝，半截剑身抽出来，赤光顺着腕骨钻进经脉，烫得你几乎跪在崖上。{人物}在旁边冷冷看着，直到你稳住呼吸才开口：剑认你了，往后它要喝的血，你得自己去取。他把剩下的焦黑剑鞘丢在你脚边，转身走下崖道，脚步声一下一下，像在替你数着以后的债。","果":{"修为":180,"悟性":1,"因果":2,"道心":1,"声望":3}},{"名":"拾鞘","文":"你收回手，只把那只焦黑剑鞘拾起来，拍净尘土。剑鞘内壁刻着半句残诀，你记下一半便觉经脉发胀。{人物}看了你一眼，说你这人倒是知道进退。断剑仍旧留在石缝里，赤光慢慢熄下去，你抱着剑鞘下了崖，背后那道剑鸣跟了你三里，才终于散在山风里。","果":{"灵石":60,"修为":40,"悟性":2,"器物":1}},{"名":"劝止","文":"你拦住他的手，说断剑认主多半也要认命，此崖三百年埋了多少剑修，不差他一个。他愣了半晌，忽然笑了一声，收手坐下，与你分了一壶山泉。临别他把随身的一小袋{灵材}塞给你，说这点东西不值钱，只当谢你多这一句嘴。","果":{"灵石":40,"悟性":1,"声望":2,"道心":1}}]},{"id":"luoxia_002","题":"炉火三百年","类":"修行","重":2,"域":["luoxia"],"境界":[0,4],"段":["{地点}的炉火据说三百年没熄过。你走进去时，热浪扑面，把眉毛都燎得卷起。{人物}赤着上身站在铁砧前，一锤一锤砸着通红的坯子，汗落到地上立刻蒸成白雾，谁进来他都不抬眼。","你说明来意，想借{地点}的炉火淬一件旧器。他停锤，用钳子夹起那块坯子在你面前晃了晃：这炉认火不认人，你要借，先替我拉三个时辰风箱。拉不完，就请你出去，别耽误我打这一炉。","{天象}压在屋外，风箱每推一次，炉膛里的火就矮一寸又窜高二寸。你看见墙角堆着几十件废器，全是被火吃坏的，上头还留着主人刻的名字，一道一道，像某种无人认领的碑。","第三个时辰快到时，{天象}已在屋外转了两回，你的手已经抖得抓不住木柄。他忽然停下锤子，把钳子递到你面前，炉火把你的影子钉在墙上，动也不动。"],"择":[{"名":"拉满三时","文":"你硬撑到风箱拉满，掌心磨出的血泡破了又结。{人物}接过锤子，一言不发地替你把那件旧器夹进炉心，火候拿捏得分毫不差。出炉时器物泛着淡淡的火纹，他把它扔给你，说百炼山不欠人情，只认手艺，你既然撑住了，这炉火就借得。","果":{"修为":90,"器物":1,"气血":-8,"声望":3}},{"名":"半途而废","文":"两个时辰后你实在撑不住，松开木柄倒在地上。他看你一眼，没骂，也没赶，只把炉门掩了半边，火色立刻暗下去。他说火气断一断，器就废了，你要的东西也一样。你走时带走炉边一小堆炉渣，回去敲开，里头竟裹着一小块未熔的{灵材}。","果":{"灵石":30,"修为":20,"灵材":1,"气血":-12}},{"名":"以物换火","文":"你解下腰间那件值些灵石的物件，放在砧上，说愿以物换火。他掂了掂，嫌轻，又看了看你的脸色，最后收下，替你把旧器塞进炉里。器成了，可纹路糙得厉害，他冷冷道：火候是买不来的，你只买了半个时辰的心。","果":{"灵石":-120,"修为":150,"器物":1}}]},{"id":"luoxia_003","题":"丹香里的秤","类":"市井","重":4,"域":["luoxia"],"境界":[0,2],"段":["{地点}的早晨是从药香开始的。三百座丹炉同时开火，烟气顺着山坳流下来，把半座山泡成一锅温热的汤。你在{人物}的摊前停下，摊上摆着七八个火漆丹封，每个封口都盖着丹霞观的印。","他称丹的手法极快，铜秤一挑，秤星还没稳住，价就报出来了。见你盯着看，他把一枚丹推到面前：这枚养元的，三百年份的药材，货真价实。旁边立刻有人冷笑，说三百年份的{灵材}，整个落霞山脉一年也出不了几斤。","{天象}从檐角漏进来，把丹封上的火漆照得发亮。你注意到摊脚下压着一本{器物}，边角磨得起了毛，翻开的那页写着三个字：欠、赊、抵。数字密密麻麻，一页比一页旧。","{人物}把手按在账册上，笑得很客气：买与不买，都是客。可你若是想赊，就得先告诉我，你拿什么来押。"],"择":[{"名":"买丹","文":"你数出灵石推过去，他收得干脆，还多塞给你半枚碎的，说是添头。回程路上你把丹放在鼻下闻，药气是正的，只是火候虚浮，服下去修为涨了一截，经脉却隐隐发涨。你这才明白他为何肯送半枚——那半枚才是真话。","果":{"灵石":-80,"修为":120,"气血":6}},{"名":"翻账","文":"你借着问价，一页页翻那本账册，把赊欠的名字和数目默记了七八个。他察觉时你已经合上账本，笑着道谢离开。半月后你在西岭关把这些名字卖了个好价，代价是丹霞观从此记住了一张脸，往后你在他门前买什么，都要多付三成。","果":{"灵石":200,"声望":-4,"因果":1}},{"名":"揭破","文":"你当众把那枚丹掰开，指给围观的人看里头的药渣。人群一静，他脸上的笑慢慢收了，最后竟也笑出来，把整摊丹都收了回去，说今日不卖了。他临走时低声告诉你一句话：在这山里，说真话的人，通常活不到丹成的那年。你听出这不是威胁，是提醒。","果":{"灵石":20,"声望":6,"因果":-1,"道心":1}}]},{"id":"luoxia_004","题":"剑冢夜哭","类":"奇闻","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}埋着赤霄剑宗三百年来折在剑下的弟子，一人一碑，碑上不刻名，只刻剑名。你在碑林间走，脚下碎石硌得生疼，忽然听见哭声，细细的，像是从地底透上来的。","{人物}提着{器物}守在碑林口，见你进来也不拦，只说了一句：听见了吧，这三夜都在哭。他指了指最里头一块新碑，说那是上月才立的，人是自己把剑插进胸口的，没人知道他为什么。","{天象}把碑影拉得极长，哭声忽远忽近，最后停在那块新碑后面。你看见碑脚下压着一片残页，纸色焦黄，上面墨迹未干，像是有人刚刚写完就放下了笔。","{人物}背过身去，把灯挑得只剩一线：要听，就往里走。要是不想听，现在退出去还来得及。"],"择":[{"名":"听到底","文":"你一直坐到天将亮，哭声终于化成人语，断断续续讲完一段旧事：那名弟子替师门顶了一桩杀人的罪，罪认了，剑也就断了。你听完把残页揭下来带走，纸背上有一行小字：剑断了，理还在。你带着这句话下山，走出碑林时，日头正好翻过赤霄峰。","果":{"修为":60,"悟性":3,"因果":1,"道心":1}},{"名":"焚页","文":"你把残页点着，火头一起，哭声像被掐住喉咙，尖了一声便散尽。{人物}回头看你，脸上没什么表情，半晌才说：你这一烧，他算是走了。碑上的剑名慢慢淡下去。你走出碑林时觉得肩头轻了，可心里空了一块，说不清是自己做了好事，还是替人抹了什么。","果":{"修为":30,"因果":-2,"道心":-1,"寿元":5}},{"名":"叩碑","文":"你在碑前行了三礼，把身上仅剩的一点祭品摆在碑脚。哭声停了片刻，随即更响，像是有人不肯受这份礼。夜里你梦见一柄断剑横在雪地里，醒来时掌心多了一道浅浅的剑痕。此后你出剑时总觉得有人替你多推了一寸，可每次收剑，也总要多流一点血。","果":{"修为":100,"气血":-10,"因果":1,"道心":2}}]},{"id":"luoxia_005","题":"雷夜伏击","类":"灾祸","重":4,"域":["luoxia"],"境界":[0,3],"段":["{天象}，你在{地点}寻了半日，才找到一处能避雨的岩龛。火刚生起来，外头就有人踏水而来，脚步不疾不徐，像早知道你会在这里。","{天象}下，来的是三个人，脸上都蒙着赤布。为首的人一开口就报了你的名字，说你身上有他们要的东西，交出来，今晚就当没见过。你才想起白日里那桩旧事——你确实拿了不该拿的，只是当时并不知道那东西的主人竟有这样的帮手。","雨越下越大，岩龛外的地气被雷一激，一道电蛇贴着{地点}的脊线窜过去，把半边天照得惨白。三人的影子在洞口叠成一团，谁也没先动手，都在等那一声最响的雷。","为首的人往前踏了一步，靴底碾碎了一块{灵材}，他低头看了一眼，忽然笑了：这山里连石头都是红的，你说你死在哪儿，别人分得清吗。"],"择":[{"名":"先动手","文":"你趁雷声最响的那一瞬出手，把最近的那人打退三丈。混战里你背上挨了一记，血混着雨水往脚下淌。三人最终退了，为首的临走留下一句话，说他还会有第二次。你靠在岩壁上喘了半宿，摸出怀里的东西看了看，忽然觉得它比血还沉。","果":{"修为":140,"气血":-25,"声望":4,"因果":1}},{"名":"交物","文":"你把东西扔过去。为首的人接住，掂了掂，满意地挥手带人走了。雨停后你翻遍岩龛，在墙缝里找到一枚他们落下的牌子。牌上刻着西岭商会的小印，你捏着那枚牌子，忽然明白这趟浑水比自己想的深，而这件东西，他们还会来找第二次。","果":{"灵石":-100,"修为":20,"悟性":2,"因果":2}},{"名":"引雷","文":"你把那件东西举过头顶，站到洞口最低处。{天象}之下，一道电光顺着它劈下来，你被震得半身发麻，三人却全被掀翻在地。醒来时雨已经停了，山壁焦黑一片，东西还在你手里，只是多了几道裂纹，再也用不久了。","果":{"修为":90,"气血":-30,"器物":-1,"悟性":2}}]},{"id":"luoxia_006","题":"煮丹泉畔","类":"机缘","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}的水是温的，终年冒着白气，据说底下通着地火。你取水时看见一位老者在泉边支着{器物}，一手摇扇一手添柴，神情比守着丹炉还要专注。","{人物}见你望得久，招手让你过去，说这一炉煮的不是丹，是水。你不解，他便让你尝一口。水入口先是甘，随即一股热意直冲丹田，把几处淤塞的经脉烫得发痛，痛过之后竟是说不出的通畅。","{人物}说这泉水认人心，心浮的人喝了只觉烫，心静的人喝了才补身。又指了指不远处几块被烧得发白的石头，说前些年有个年轻人贪多，连喝三碗，第三天就在那里坐化了，骨头到现在还没人收。","{天象}在泉面上一层一层沉下去，老者的扇子停了一停：你要喝，我这儿还有一碗。要学，得替我看三个月的火。"],"择":[{"名":"饮一碗","文":"你把那碗温汤饮尽，热意从喉头一路熨到脚底，淤塞处像被谁用细针通了通。老者满意地点头，又叮嘱一句：三月之内不可动怒，一怒则热走岔路。你谢过他，走出半里忽然记起自己连他名姓都没问，回头再看，泉边只剩一副支架和半炉冷灰。","果":{"修为":130,"气血":12,"悟性":1}},{"名":"守三月","文":"你在泉边守了三个月，添柴、扇火、滤水，日复一日。老者从不教你别的，只在最后一天把一册薄薄的手抄本给了你，说这是煮水的法子，你以后自然会懂它为什么能煮丹。手抄本无题无款，只有开篇一句：火不急，水才肯把话说完。","果":{"修为":70,"悟性":3,"功法":1,"声望":2}},{"名":"取水换钱","文":"你灌了满满两囊泉水下山，在西岭关外卖给丹霞观的采买。钱是不少，可你回来时泉边已经空了，连支架都被收走。后来听说有人在别处冒了这泉的名字卖水，喝坏了两个筑基修士。你知道那不是你干的，却总在深夜里想，那一句名字是谁先说出口的。","果":{"灵石":180,"因果":2,"道心":-1}}]},{"id":"luoxia_007","题":"赤髓谷赌局","类":"市井","重":3,"域":["luoxia"],"境界":[0,3],"段":["{地点}出{灵材}，越往深处血色越浓。谷口常有零散修士支张破席赌石，赌的是未开的赤髓原石里有没有髓晶。你路过时正有人开出满掌红光，围观的人一阵哄闹，{人物}在旁边冷笑，说这一块够买下半个丹霞观外门。","{天象}下，庄家把剩下的原石全摊在地上，说今日到此为止，谁想接手，价照旧。有人推你上前，说看你面相是个有运的。你蹲下去细看，石皮上一道极淡的水线，像是被谁用指甲划过。","{天象}把整条谷照得发暗，赌局上的人脸都看不出神色。庄家催了三遍，最后一次把{器物}往桌上一放：押什么都可以，押命也行，就是别押这么久。","你的手悬在那块{灵材}上方，谷风从背后灌下来，吹得席角啪啪作响。"],"择":[{"名":"押灵石","文":"你把身上大半灵石押上去，石头当场剖开，里头是空的，只中间裹着一小团赤色的砂。庄家笑着把砂推给你，说这也不算全输。你揣着那团砂走出谷口，心里空落落的，可回去后才发现砂里混着极细的髓晶粉，磨成粉掺进丹里，药性翻了一倍。","果":{"灵石":-150,"灵材":1,"修为":40,"悟性":1}},{"名":"看水线","文":"你指着那道水线说这石不值钱，水线是泡过水的旧痕，庄家脸色变了一瞬。你不押，只把这话说给旁边几个年轻人听，他们跟着散了。庄家把石头收回袖里，临走低声道：你这眼力，在这谷里是要吃亏的。你笑了笑，往后半月果然有人跟着你，只是没敢下手。","果":{"声望":4,"悟性":2,"因果":1}},{"名":"押命","文":"你说没什么可押，就押这条命。庄家愣了，围观的人也静了。他最终没接，把原石劈开扔给你，说这种赌法他不敢。石里还真有一块髓晶，指头大小，赤得发亮。你拿着它走了很远，才发觉后背全是冷汗——赢的不是眼力，是他不敢。","果":{"灵石":260,"灵材":1,"声望":3,"因果":1,"道心":1}}]},{"id":"luoxia_008","题":"赤霄令下","类":"宗门","重":4,"域":["luoxia"],"境界":[1,6],"段":["{宗门}的令剑到得极突然。你在{地点}的茶棚里刚坐下，一柄{器物}便钉在桌上，剑身上缚着一条赤绳，绳结打得又快又紧，是执法堂的手法。周围几个修士看了一眼，纷纷挪开了凳子。","送剑的{人物}说，三日前山南死了个丹霞观的药商，尸体上留着剑伤，伤口在背后。查到最后查到你头上，因为那夜有人看见你从西岭关进来，衣上有血。你说不清那血是别人的还是自己的，他只淡淡道：说不清，就随我走一趟。","{天象}把茶棚照得发红，令剑上的赤绳被风一吹，轻轻晃。你注意到剑柄缠着的一圈旧布，布上有个烧焦的洞，那是赤霄剑宗替人立誓时才会系的记认——接下这柄剑，就等于把命押在这桩案子上。","{人物}起身让开路，却并不催你：走之前，你可以说一句话。"],"择":[{"名":"随剑走","文":"你随他上了赤霄峰，在剑堂里跪了七日。查到第九日，真正的凶手指认了自己，是那药商欠了丹霞观一笔烂账，灭口的是同门。你被放出来时瘦了一圈，执法堂却给了你一枚小小的赤牌，说这些年冤枉过不少人，你是头一个没喊冤的，这牌子，往后进山不必通报。","果":{"修为":60,"声望":5,"气血":-15,"道心":1}},{"名":"举证","文":"你从怀里取出一片碎布，说那夜你在西岭关救了个被追杀的伙计，血是替他挡刀沾上的，那人还在关下的破庙里养伤。{人物}盯着你看了很久，最终把令剑拔起来，说去带路。案子三日就结了，丹霞观的脸丢得不轻，而那位伙计日后成了你在山里的第一条人情。","果":{"声望":4,"灵石":80,"因果":-1,"悟性":1}},{"名":"抗剑","文":"你把令剑推回去，说赤霄剑宗杀人从不问对错，如今查案也不问，这剑我不接。满棚的人都屏住气。他没有动怒，只是收起剑走了，临走留下一句：你今日说的这话，会有人记住。当夜你就离了落霞山脉，三年后回来，赤霄峰换了一任执法长老，新任的那位在关口认出了你，什么也没问，放你过去了。","果":{"修为":40,"声望":-6,"因果":2,"道心":2,"寿元":-8}}]},{"id":"luoxia_009","题":"金乌残影","类":"天象","重":2,"域":["luoxia"],"境界":[2,8],"段":["{地点}是传说中金乌坠地之处。这一日{天象}，山岭上空的云被烧出一个空洞，洞里掠过一道极长的黑影，翼展遮了半边天，尾羽散成无数火星落向山谷。","{人物}在山坡上摆了一地{器物}，仰头看得目不转睛。他说金乌每三百年显一次影，影过之处，山石会被烙上火纹，那火纹便是天底下最烈的火种。只是凡去看的人都想捞一把，没几个想清楚该怎么退。","{天象}未歇，火星落地的声音很轻，落到石上却嗤的一声陷进去。你眼前的赤岩开始发烫，整片坡地像一块被烧红的铁板，站在上面的人不知不觉就往下陷。远处有人惨叫，接着是第二声、第三声。","那道影子还在{天象}里，地势却已经变了。你身上带着一只能盛火的旧器，退路还有二十丈，脚下的岩石发出细微的裂响。"],"择":[{"名":"取火种","文":"你冲到最近的一处火纹前，把旧器按上去，赤焰顺着器口吸进去，器身当场裂了两道。你抱着它退出坡地时，半边衣袖已经烧没了，可器里那一点火确实是活的，隔着铜壁还在跳。此后你以它炼器、炼丹，火候比旁人稳得多，只是每到雷雨夜，那点火就要闹一次。","果":{"修为":160,"器物":1,"气血":-20,"悟性":2}},{"名":"救人","文":"你回头去拖一个陷在石里的小修士，扯断了自己的腰带才把他拽出来。坡地在你身后塌下半边，火星追着人的脚跟烧。那少年醒来后一句话也说不清，只死死抓着你的手不放。多年后你在西岭关外落难，一个年轻剑修从人群里走出来替你解了围，他说：你背过我。","果":{"声望":6,"因果":-2,"气血":-15,"道心":2}},{"名":"退走","文":"你退了。二十丈退完，坡地整个塌下去，火纹被埋进赤岩底下，再没人挖得出来。你在岭下坐了一夜，看那道黑影缓缓沉进云里。有人说你胆小，也有人说你命长。你自己知道，那一夜你记住的不是火，是那些没退成的人最后一声喊。","果":{"修为":30,"悟性":1,"道心":1,"寿元":8}}]},{"id":"luoxia_010","题":"百炼试器","类":"修行","重":3,"域":["luoxia"],"境界":[0,5],"段":["{宗门}每三年在{地点}开一次试器会，凡持未成之器者皆可上台。你手里那件东西是半路得的，纹路歪斜，连自己都不知算什么品。台上的{人物}只看一眼，就让人把你排进第七场。","第七场的对手是个使重剑的年轻人，剑上缠着赤布，出手极重。三个回合后你才明白，这试器会不是比谁的器好，是比谁的器能撑到最后不断。台边已堆了一地的碎片，{人物}坐在上头记数，碎一件便在册上点一笔。","{天象}照得台面发白，你手里的器已经烫得握不住。年轻人忽然收剑，说了一句奇怪的话：你这器不是打出来的，是养出来的。台下有人笑，也有人不笑了。","{人物}终于抬眼，问你要不要接着打第八场。规矩是，赢到最后的器可以入百炼炉重铸一次。"],"择":[{"名":"打到底","文":"你一路打进第九场，器断在最后一击上，碎成七片。{人物}把碎片收起来，居然真的投进了百炼炉，重铸成一柄短刃，刃口泛着不匀的火纹。他递给你时说：器断过，才知道断在哪儿。这柄刃不比你原先那件强，可它以后的每一道火，都会记得自己断过一次。","果":{"修为":170,"器物":-1,"悟性":3,"声望":4}},{"名":"止于第七","文":"你收手，把器收回鞘里。台下有人嘘，{人物}却把你的名字记在了另一册上——那是给能忍住的人的册子。他说这山上多的是打到断的，少的是知道什么时候该收的。数年后你才明白，那一册上的人后来大多活过了金丹，而当年打到断的那些，名字都刻在碑上了。","果":{"修为":60,"悟性":2,"道心":2,"寿元":10}},{"名":"卖器","文":"你没上台，直接把器卖给台下收旧器的贩子。价不低，够你安稳过两年。贩子转手卖给了一个丹霞观的药商，那药商半月后死在自家丹房里，凶器正是这柄器。官府查到贩子，贩子供出你，你花了些灵石把事压下去，可那柄器的火纹从此总在你梦里烧。","果":{"灵石":150,"因果":2,"道心":-2,"声望":-3}}]},{"id":"luoxia_011","题":"丹毒傀儡","类":"争斗","重":3,"域":["luoxia"],"境界":[1,6],"段":["{地点}废弃的丹房外，你听见有人在里面走动，脚步迟钝而均匀。推门进去，看见一具{妖异}正守着三只熄了的丹炉，皮肤泛着丹砂的红，眼窝里没有眼珠，只有两点药气凝成的白。","{地点}的炉边散落着十几枚开裂的丹，你拾起一枚，药气腥得刺鼻。这是试药试坏的人——丹霞观每年都要拿活人试新方，试成了是丹，试不成就是守炉的东西。它们认炉不认人，你若动了炉，它便动你。","它忽然停了脚步，转向你。屋里没有风，丹灰却从地上浮起来，绕成一圈缓缓转动。你腰间那件{器物}碰在门框上，发出一声轻响，它的头立刻歪了一下。","{天象}照进屋里，三只丹炉里，只有最里面那一只还留着一点余温。你要绕过去看，就得从它身边过。"],"择":[{"名":"绕行","文":"你贴着墙挪过去，屏住呼吸。它随你的方向转了半圈，最终停住，又回去守着那两只冷的炉。最里面那只炉底刻着一行小字，是一味丹方的残方，缺了最后一味药。你抄下来退出丹房，它始终没有回头。你在门外站了很久，忽然觉得那东西守的不是炉，是它还活着的那一段。","果":{"修为":50,"悟性":2,"因果":-1}},{"名":"毁炉","文":"你一脚踹翻炉门，火光泻出。它扑上来，指甲划开你的肋下，血一下子浸透了衣裳。你把它按在炉上，炉膛里的余火顺着它的皮烧起来，它没有叫，只是一直看着你，直到化成一小堆赤色的灰。灰里筛出半枚完好的丹，你带着它走了，此后每逢炼丹，火候一到那个温度，你肋下那道疤就发痒。","果":{"灵石":90,"修为":120,"气血":-22,"因果":2}},{"名":"超度","文":"你取下随身法器，替它念了一段没人教过的度文。它听了一半忽然跪下，喉咙里发出很轻的声音，像被药气堵了多年的人终于咳出一口气。炉中余火自灭，它也随之散成灰。你把它收进一只陶罐，埋在丹房后的赤岩下。后来丹霞观又有丹童失踪，你回去看过一次，那座新坟没人动过。","果":{"修为":80,"道心":3,"因果":-3,"声望":2}}]},{"id":"luoxia_012","题":"货郎的药箱","类":"人情","重":4,"域":["luoxia"],"境界":[0,2],"段":["{人物}在{地点}的岔口歇脚，担子上的药箱磕破了一个角，散出淡淡的{灵材}气味。他见你路过，忙招手说帮着扶一下担子，腰闪了。你搭手时看见他箱底压着一张纸条，写着某某欠药钱若干，记了十几行。","{人物}说这山里的规矩，药可以先拿，钱可以后付，可后付的从来没有后头。说着他自己先笑了，笑得很干。他又说前头还有个老主顾，欠了两年，去年死在丹房外头，他连棺材钱都是自己垫的。","{天象}把路口照得昏黄，远处有挑担的、赶车的、牵着牲口的，都往西岭关去。他忽然压低声音：前头有伙人专门截药担子，专挑像我这样的下手。我一个走不动路的，撞上就完了。","{人物}把药箱往你脚边推了推：你若是往关上去，能不能替我挡一程？工钱不多，就当我欠你一笔。"],"择":[{"名":"护他一程","文":"你陪他走完那三十里，果然在山口遇上两个持刀的。你把刀逼退，自己手臂上留了一道口子。他到了关口，翻遍全身只凑出几枚灵石，硬塞给你，说这点钱拿不出手，可你不收他心里更难受。三年后你在西岭落难，一个挑担的中年人从人群里挤出来替你说话，脸上的皱纹深了许多，你还是一眼认出他来。","果":{"灵石":40,"声望":5,"因果":-2,"气血":-10,"道心":1}},{"名":"索价","文":"你报了个数，比市价高出一倍。他愣了愣，还是点头应了。一路平安无事，到了关口他数钱的手抖得厉害。你接过钱转身就走，没回头。半年后你在一处药摊上认出他，他见了你，把价报得比谁都高。你们互相都清楚这是什么道理，可这就是这山里的道理。","果":{"灵石":130,"因果":1,"道心":-1}},{"名":"揭名单","文":"你问他箱底那张纸条上都是谁欠的，他说了七八个名字。你记下来，替他跑了一趟，把能收的收回来四成。他把其中一半分给你，说这辈子头一回有人替他讨回钱。从此你在西岭一带的散修里有了些名声，说你这人认账。只是那几户人家看你的眼神，从此都变了。","果":{"灵石":90,"声望":6,"因果":1,"悟性":1}}]},{"id":"luoxia_013","题":"赤烟崖山火","类":"灾祸","重":2,"域":["luoxia"],"境界":[0,4],"段":["{天象}，火从{地点}西侧的枯林起，一路烧上来。你在半山腰听见风里有噼啪的响声，抬头时整面崖已经红透，赤烟翻滚着往山脊上爬，像有活物在底下推。","廊道上有十几个人，全堵在一处塌方前。{人物}在人群里喊，说下头还有一队采药的没上来。有人骂他多事，说火头一炷香就到，回头就是送命。他也没争，只把腰上的{器物}解下来扔在石头上，说要去就有人去。","火头压过来时，整条栈道的石头都在响。你看见崖壁上的赤岩被烧出一层亮壳，壳下渗出的{灵材}顺着缝往下淌，淌到一半就被烤干，在石上留下一道深红的痕。","{天象}压下来，塌方前的空隙只够一个人挤过去。要回头救人，就得丢下背囊；要随大流走，就眼看着那几个还在山下的影子被烟吞掉。"],"择":[{"名":"回头救人","文":"你扔了背囊钻过空隙，顺着烧焦的坡往下跑，在第三道弯处找到三个被烟熏倒的人。你把他们一个一个背上来时，衣裳已经烧得只剩骨架。回到安全处你几乎站不住，{人物}把水囊塞进你手里，什么也没说。那一队人后来逢人便提你的名字，讲得比你自己记得的还多。","果":{"声望":8,"因果":-3,"气血":-25,"修为":60,"道心":2}},{"名":"抢灵材","文":"你趁乱扑向崖壁，把渗出来的{灵材}刮进袋里。火头到得比想象中快，你被热浪掀翻，眉毛烧掉一半，才拖着袋子退出来。那东西成色极好，卖了个好价钱。只是后来再走那段栈道，你总下意识去摸眉毛，摸到光滑的一片，就想起那几个被烟吞掉的影子。","果":{"灵石":220,"灵材":1,"气血":-20,"因果":2,"道心":-1}},{"名":"断道阻火","文":"你提议把那截快要塌的栈道提前砸断，火头断了路就上不来。有人不肯，说那是唯一的退路。你把最窄的那块石头撬了下去，声音在山谷里滚了很久。火果然停在断口处烧了三个时辰，山下的人也借着这段时间退了出去。事后有人说你毁路是疯，也有人悄悄记住你这张脸。","果":{"悟性":3,"声望":3,"修为":50,"因果":-1}}]},{"id":"luoxia_014","题":"赊账的丹","类":"宗门","重":3,"域":["luoxia"],"境界":[0,4],"段":["{宗门}外门的柜台上摆着一本比砖还厚的{器物}，每一页都是欠账。你替人送药，柜台后的老账房翻了三遍，抬头说这名字不在这本上，那这药就不能给。","你把来龙去脉讲了一遍，说那人是筑基初期的散修，伤在肺脉，耽误不得。{人物}听着，手里笔没停，慢条斯理地写：规矩是规矩。观主说过，丹能救人也能杀人，救人看的是谁出得起。","{天象}落在窗纸上，把算盘珠子照得发亮。他忽然把笔搁下，往你身上扫了一眼：不过你这个人，可以记在这本上。你替他签，药我照给，出了事找你。","{人物}把笔递到面前，纸上的名字栏空着，墨已在碟里干了半圈。"],"择":[{"名":"替他签","文":"你签了名。药当天就送到了，那人服下三日，肺脉通了，见你便跪。他后来在关外替人押货，攒了两年才把这笔钱还上，还钱那日他非要请你喝酒，说自己这条命是记在别人账上的，得记一辈子。而你这几年每次进丹霞观，老账房都要翻出那一页看看，确认你还在。","果":{"灵石":-120,"声望":6,"因果":-2,"道心":2}},{"名":"自掏腰包","文":"你替他把药钱垫了，却在账上写了那人的名字。药送到了，人活了。半年后你路过他家，他正在院子里晒药，抬头看见你，脸就白了，以为你是来催账的。你什么也没说，转身走了。有些账记在纸上，有些账记在心里，后者往往还得更慢，也还得更重。","果":{"灵石":-80,"因果":1,"悟性":2,"道心":1}},{"名":"不签","文":"你把笔放回去，说这账不该记在谁头上。老账房也不恼，把药收回柜里，说那就等他攒够了钱再来。你走出丹霞洞天时听见柜上算盘又响起来。三日后你听说那散修死了，死在赤岩栈道上，肺脉没通，血从口里涌出来，一路滴到石缝里。你想再说点什么，却找不到人说。","果":{"因果":3,"道心":-3,"悟性":1}}]},{"id":"luoxia_015","题":"断剑崖之约","类":"争斗","重":3,"域":["luoxia"],"境界":[1,6],"段":["{地点}的崖顶一向只办两件事：立誓，和了断。这一日{天象}，崖上站了两拨人，一拨穿赤衣，一拨穿褐衣，各站一边，中间只留一条两尺宽的石缝。","赤衣的是{宗门}的人，褐衣的是百炼山的匠人。事由说不清，只知前些日子某柄新铸的剑在试器时断了，断口处淬火不均，剑宗说百炼山偷工，百炼山说剑宗拿剑的手不干净。两边都不肯让一步，按老规矩，崖上见。","{人物}站在石缝边上，手里捧着两件的断片，谁赢就把断片交给谁。他嗓子哑得厉害，说今日只论剑，不论理——这话说完，两边的人都笑了，笑得都不像在笑。","{天象}压着崖顶，风从崖下往上灌，把两边的旗子吹得笔直。你的名字被喊到，是要你出面做个见证。"],"择":[{"名":"判剑宗","文":"你把断片翻过来，指出淬火处三道深浅不一的痕，说这是火候没拿稳，与拿剑的人无关。百炼山的人当场变了脸色，领头那位一句话没辩，只把断剑捡起来，转身就走。此后百炼山三年不接剑宗的活，山中炉火却烧得更旺。你得罪了一山的人，也换来剑宗一句实在话：这山里的公道，有时就是这样判的。","果":{"声望":4,"因果":2,"灵石":60,"道心":1}},{"名":"判器宗","文":"你说断口处有一道旧裂，说明剑在出手前就已伤过，责任不在炉火。赤霄剑宗的人盯着你看了半刻，最后哼了一声，把剑收了。百炼山的那位匠人走过来，往你手里按了一块还带着余温的铁料，什么也没说。器物不会道谢，它只会记住。此后你托他打器，他从不问你出多少灵石。","果":{"器物":1,"声望":2,"因果":-1,"灵材":1}},{"名":"各打一板","文":"你说两边都有错，都不肯先认，这桩事只能越结越深。你把两件断片各掷一半进崖下，说断了的就都断了，重新打过一柄。两边都没料到这结局，沉默了很久。那年冬天百炼山和赤霄剑宗在一场山火里并肩救过火，谁也没提这桩旧事。","果":{"声望":6,"因果":-2,"悟性":2,"道心":2}}]},{"id":"luoxia_016","题":"岭下金乌骨","类":"秘境","重":2,"域":["luoxia"],"境界":[2,8],"段":["{地点}深处有一道被赤岩封死的裂隙，本地人说底下埋着金乌的骨头。你花了三天撬开石缝，钻进去时才发现里头极空，脚步声能在壁上撞出七八次回响。","{地点}深处的骨确实在。不是整具，只剩小半截翼骨与一枚焦黑的头骨，长逾数丈，横在洞底，骨头里的火气还没散尽，靠近时眉毛就自己卷起来。骨上刻着极细的字，是上古的笔法，一半已经烧没了。","{人物}跟在你后头进来，见着骨便跪下，嘴里念念有词。他说这骨头不能动，动了整座山的火脉都要乱。你回头看洞口的赤霞，忽然觉得整座山都在这骨头的余温里活着，那一层红，是它烧了三千年还没烧完的血。","{人物}跪着抬头看你，等人先开口。你脚下那块骨片上刻着一行能认全的字：取其火者，承其坠。"],"择":[{"名":"取骨","文":"你撬下一块巴掌大的骨片，骨落手时整条手臂像被火舌舔过，皮肉焦了一层。洞里顿时暗下去，四壁响成一片。你抱着骨片往外跑，身后塌了半面岩。此后你炼器从不缺火，只是每到黄昏，那股火就从骨缝里往回烧，烧得你指尖发红，像一直在替谁记着坠落的痛。","果":{"灵石":300,"器物":1,"气血":-30,"修为":120,"因果":2}},{"名":"封洞","文":"你把撬开的石缝重新垒上，一块一块砌得严实。{人物}在旁边帮你，砌完最后一块才说：你是这百年来第一个不动的。你走出洞口，赤霞正压在山脊上，红得像要滴下来。那年冬天山里没起火，第二年也没起。你在别处听到过有人拿骨片换了大钱，可你并不后悔。","果":{"道心":3,"声望":3,"修为":40,"因果":-2}},{"名":"拓字","文":"你不碰骨头，只把骨上残字一片片拓下来。拓到第九片时你头晕得厉害，眼前浮起一头赤鸟撞向大地的影子，翼下的火一路铺开，铺成整片山脉。你在洞里坐了不知多久，醒来时火把已经灭了。拓本带出去后被人重金求购，你只卖了一半，另一半锁在箱底，从不给人看。","果":{"悟性":4,"修为":90,"灵石":120,"功法":1}}]},{"id":"luoxia_017","题":"赤髓淬体","类":"修行","重":3,"域":["luoxia"],"境界":[0,4],"段":["{地点}的夜里，山风能把人骨头缝里的凉气都吹出来。{人物}教人淬体，法子极简单：把{灵材}磨成汁，涂遍全身，再去赤岩上滚一炷香。涂的时候火辣，滚的时候更甚，滚完人像从灶膛里爬出来。","{人物}说这法子是{宗门}传下来的，师祖原话是：人是器，先得知道自己的火候在哪。你要炼，就得自己寻那条线——过了，皮肉焦烂；差一点，什么也得不到。","{天象}之下，赤岩泛着一层油光。你看见岩上有许多深浅不一的焦痕，形状像人，一个挨着一个，越往后越浅。他顺着你的目光看过去，淡淡道：浅的那些，是没撑住的。","{人物}把药汁推到你面前。药汁在碗里微微颤，映出你自己的脸，被赤光泡得认不出来。"],"择":[{"名":"滚一炷香","文":"你在赤岩上滚完一整炷香，皮肉疼得没了知觉，指甲里全是血。起身时身上刷下一层焦皮，底下那道新生的肤色白得刺眼。此后你受的伤好得比旁人快，刀剑入肉三寸也不至于要命。只是每逢阴雨天，那道新皮底下像有火在慢慢地烧，提醒你这条命是烫出来的。","果":{"气血":30,"修为":140,"寿元":-6,"悟性":2}},{"名":"浅尝","文":"你只滚了半炷香就翻下岩，皮肉红了一片，倒也不疼。他在旁边看着，也不催，只说了句：你今日省下的，往后要加倍还。你当时不服，后来在一次围猎里被妖物咬穿小腿，才明白那句的意思——骨头里缺的那一分硬，是补不回来的。","果":{"气血":10,"修为":50,"悟性":1}},{"名":"改方","文":"你把药汁里那味最烈的减半，又添了点自己带来的药。他先是不许，后来见你真的没被烧坏，便蹲下来问你添了什么。你说了，他沉默半晌，忽然把那碗药泼在岩上，说这法子三十年没人敢改。此后他教你东西不再藏私。你的皮肉没那层硬壳，可经脉比同门稳得多。","果":{"修为":100,"悟性":3,"声望":3,"功法":1}}]},{"id":"luoxia_018","题":"丹市拍场","类":"市井","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}的拍场设在半塌的石殿里，底下是火脉，坐久了脚跟发烫。今日拍的是三枚同炉出的丹，据说是丹霞观一位老丹师临死前炼的最后一炉，成色极好，起价却低得反常。","{地点}的拍场里，喊价的一路往上走，喊到第七轮只剩两个人。一个是丹霞观外门的药商，脸上红光满面；一个是穿着旧衣的女修，手里攥着个布袋，指节白得厉害。药商每加一次价，就朝那边抬一下下巴，像在看什么有趣的东西。","{人物}在台下敲着{器物}打拍子，节奏很慢。你注意到那女修的布袋角上有个补丁，补丁的针脚是西岭一带的土法——她不是本地人，也不像出得起更多的样子。","{人物}又叫了一次价，转头看你，笑着说：这位道友若也想要，不如一起加？"],"择":[{"名":"抬价","文":"你跟着叫了一轮。药商眉毛都没动，直接翻倍。你再加，他终于收手，把丹让给了你。散场后那女修在殿外等着，眼睛红着，说她要的是那炉丹里的第二枚，不是第一枚。你把第二枚分给她，她愣了很久，从布袋里取出一样东西硬塞给你，说是她家乡的灵材，不值钱，但她只有这个。","果":{"灵石":-260,"声望":4,"因果":-2,"灵材":1}},{"名":"让价","文":"你笑着摇头，退到人群后头。药商顺利拍下三枚丹，转手就在殿外拆开零卖，价翻了两番。那女修一句话没说，转身走了。你跟着她走到岔口，才听见她低低说了一句：我师父就死在那炉丹边上。你没敢上前，也没敢问是哪一炉。多年后你还记得那个补丁。","果":{"悟性":2,"因果":2,"道心":-1}},{"名":"揭底","文":"你忽然开口，说这三枚丹里有伤，是丹成时火气没退，服之必损经脉。满殿哗然，药商脸色一沉。{人物}停了拍子，让人当场验丹，果然验出丹心焦黑。拍场散了，药商被观里的人带走。你走出石殿时，有人在背后低声说了句多谢，你没有回头。","果":{"声望":6,"因果":-2,"悟性":2,"灵石":20}}]},{"id":"luoxia_019","题":"哑仆守碑","类":"人情","重":3,"域":["luoxia"],"境界":[0,3],"段":["{地点}碑林外有间土屋，住着{人物}。他不说话，也不识字，只在每日早晚各扫一次碑前的落叶，扫完就坐在门槛上，看山下的霞。你借宿那夜，他把唯一的干草铺让给你，自己去门口坐着。","半夜你听见{人物}咳嗽，咳得整个人弓成一只虾。你在灯下看清他的脸，才发现他喉咙那处有一道旧疤，像是被人拿刀割过的。碑林里有一块碑与此有关——碑脚刻着一行小字，说此人替主家顶了罪名，割喉以证清白。","{天象}从窗缝漏进来，落在他的手上。那双手极稳，指甲修得干净，不像做粗活的人。你忽然想起山下人说过，三十年前这碑林里死过一个剑修，死时身上少了一柄剑，也少了一个书童。","第二天你要走，{人物}拦住你，从怀里掏出一样用布包了又包的东西，放在你手心，然后退开两步，深深行了一礼。"],"择":[{"名":"收下","文":"布包里是一枚旧剑穗，颜色早褪了。你收下时他眼睛里像是有什么东西动了一下，随即又静了。你走出很远回头，他还站在碑林口，赤霞把他的影子拉得很长，长到脚边就断了。那枚剑穗你一直带在身上，后来在一场恶斗里被剑锋扫断，断口处露出一行极小的字，是某个人留给某个人最后的话。","果":{"器物":1,"因果":-2,"道心":2,"悟性":1}},{"名":"还给他","文":"你把布包推回去，说这东西该留在这山里。他愣了很久，忽然跪下磕了一个头，磕得很重，额头都破了。你扶他起来，发现他在哭，却没有声音。那一年冬天碑林没人扫了，第二年开春又扫起来了，扫的人换了个年轻的。你听人说老的那个走了，走的时候手里还攥着什么东西。","果":{"道心":3,"因果":-3,"悟性":1}},{"名":"问旧事","文":"你在土屋又留了一日，把碑上能认的字一个个抄下来给他看。看到第七块碑时他忽然抓住你的手腕，指节抖得厉害。那一日你才知道他并非天生哑——割喉那年他才十四岁。你没有再问下去，把抄本留给他，替他把碑前的落叶扫了一遍才走。此后你每逢路过，都会在那间空屋门口坐一坐。","果":{"悟性":3,"因果":-2,"修为":30,"道心":2}}]},{"id":"luoxia_020","题":"火髓蟒蜕","类":"争斗","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}的岩缝里常见一种赤色的鳞，本地人叫它火髓蟒蜕。你循着新鲜的蜕壳往里走，越走越热，直到在一处石室前看见那东西——{妖异}，粗如水缸，盘在半塌的丹炉上，鳞下透出火光。","它正在蜕皮，浑身绷得极紧，眼睛上覆着一层白膜，什么也看不清。蜕到一半的蟒最凶，也最弱。地上那层旧皮还在微微颤抖，皮下的{灵材}被烤得半融，赤红得近乎透明。","{天象}从洞顶的裂缝漏下来，把整个石室照得忽明忽暗。你退后一步，脚底踩断了一根枯骨，声音不大，蟒头却慢慢转了过来。它没有动，只是把那副蜕到一半的身子绷得更紧。","{地点}的石室另一头有一道窄缝，勉强能挤过一个人。旧皮离你只有三步，蟒离你有七步。"],"择":[{"名":"抢蜕皮","文":"你三步并作两步，抱起旧皮就往缝里钻。身后石室轰地一震，蟒尾扫过你刚才站的地方，把半面岩壁砸成碎块。你挤过窄缝时肩胛被划开一道长口子，血一路滴到谷口。那张蜕皮后来卖了极好的价钱，只是每到夜深，那伤口就会发烫，像是还留着它一尾的余温。","果":{"灵石":240,"灵材":1,"气血":-22,"悟性":1}},{"名":"退走","文":"你慢慢退出去，退到洞口才转身，一路跑出谷口。回头望时，石室里透出的光已经暗了。你在谷外等了半日，见它蜕完皮游向山阴，身子比原先长了一截，鳞色也更浅。你没得着什么，却记住了它在蜕皮时那副又凶又无助的样子，像极了山里所有咬着牙往上爬的人。","果":{"修为":30,"悟性":2,"道心":2,"寿元":5}},{"名":"斩首","文":"你趁它还看不清楚，一剑斩向七寸。剑入鳞时被卡住，它反身一绞，把你整个甩到岩壁上。你吐了一口血，重新压上去，直到它不动了才松手。蟒皮、蟒骨、蟒胆，全是好材料。你拿着这些东西下山，路上遇见一个同样来猎蟒的散修，他看了看你身上的伤，什么也没说，让开了路。","果":{"灵石":200,"修为":160,"气血":-35,"声望":4,"灵材":2}}]},{"id":"luoxia_021","题":"百炼山收徒","类":"宗门","重":3,"域":["luoxia"],"境界":[0,4],"段":["{宗门}十年开一次山门。这一年报名的有三百余人，最后只留三个。{人物}坐在炉边，不看脸，不看境界，只让每个人打一枚铁钉，打完了把钉子扔进火里重烧，再看第二枚。","轮到你时，{人物}盯着你的手看了很久，说你的手不稳，不稳的人打不出好器。你说稳是练出来的。他没接话，把一块粗铁推过来，说那你就练给我看，天亮之前，打一百枚。","{天象}在窗外转到第三回，炉膛的火从赤红变成暗黄，你打到第六十七枚时虎口裂了，血滴在铁上滋滋地冒烟。他始终坐在原处，一锤一锤敲着自己的活，好像根本不在意你打到第几枚。","天亮前{天象}退尽，你面前摆着九十四枚钉子，其中有十一枚歪的。他把歪的挑出来，一枚一枚看过，最后指着其中一枚问：这枚为什么歪？"],"择":[{"名":"说手抖","文":"你说那枚是第五十枚之后打的，手抖了。他点点头，说至少你记得。然后他把那枚歪钉子扔进炉里，说器道第一关不是手稳，是知道自己在哪一锤上松了。他收你进了百炼山，头三个月不让你碰火，只让你在砧边站着看，站到你能听见每一锤该落多重。","果":{"声望":4,"修为":80,"悟性":3,"灵材":1}},{"名":"说铁坏","文":"你说那块铁本来就有砂眼，怨不得手。他盯着你看了半晌，忽然把整盘钉子扫到地上：铁是山给的，手是你自己的，你连自己的手都认不了，还认什么铁。你被赶出山门，走到半路回头看，他正蹲在地上一枚一枚捡那些钉子，捡得很慢。那情景你记了很多年。","果":{"修为":40,"悟性":1,"因果":2,"道心":-1}},{"名":"重新打","文":"你什么也没说，把歪的十一枚全扔回炉里，从头再打。打到中午，十一枚补足，手已经抬不起来。他走过来看了一遍，把其中一枚收进袖里，说这枚留着，等你以后打得好了，再拿出来比一比。你后来成了百炼山的客卿，他始终没告诉你那枚钉子到底歪没歪。","果":{"修为":120,"器物":1,"悟性":2,"声望":3}}]},{"id":"luoxia_022","题":"电蛇盘脊","类":"天象","重":3,"域":["luoxia"],"境界":[1,7],"段":["{地点}是整条山脉最险的一段，山脊窄得只容一人，两侧都是断崖。{天象}时，雷会顺着脊背滚，电光在石上盘成一条一条细蛇，久久不散，本地人说那是山在喘气。","你爬到半途，雷云压到头顶，一道电蛇擦着脊背窜过去，把脚下的赤岩烧出一圈白痕。{人物}在下方喊，让你趴下别动。他说这山脊有个怪处：谁站得直，雷就找谁；谁贴着石头，反倒能过去。","{天象}的云层深处有东西在翻。你抬头时看见电蛇聚成一条粗大的光柱，正沿着脊线游过来，游过之处岩石炸开，碎石顺着崖壁往下滚，砸出连串的回声。你的头发全都竖起来了。","{地点}前头三十丈有一处凹坑，能避雷；身后二十丈有个石洞。可光柱不偏不倚，正走在两者之间。"],"择":[{"名":"伏地等","文":"你整个人贴在山脊上，把脸埋进石缝里，雷从头顶三尺处滚过去，震得牙齿都在响。等云散了你才敢抬头，脊线上一片焦黑，而你还活着。下山后你把这法子讲给别人听，讲的人多了，后来这段山脊上常能看到一排趴着的人，像一排等着挨打的鱼。","果":{"修为":70,"悟性":2,"道心":1,"寿元":5}},{"名":"迎雷","文":"你反而站起来，把随身的铁器举过头顶。电光劈下来的那一瞬，你整个人被烧得失去知觉，醒来时躺在凹坑里，衣裳尽毁，掌心多了一道雷纹。此后你剑上的力道带了一点麻意，出手时对方往往先愣一下，那一愣的功夫就够你取命。只是每逢雷雨，骨头缝里像有蛇在爬。","果":{"修为":220,"气血":-40,"悟性":2,"魔念":1}},{"名":"拽人","文":"你看见脊线另一头还趴着一个人，一动不动。你连滚带爬地过去，把他拖进凹坑，两人挤在坑里，雷就在头顶三尺外炸开。云散后那人缓过来，第一句话是问你的手怎么样。你才发现自己的掌心全被岩石磨烂了。他后来送你一件器，说不是谢你，是他自己看着那双手过意不去。","果":{"声望":6,"因果":-2,"气血":-18,"器物":1}}]},{"id":"luoxia_023","题":"满山赤鸦","类":"奇闻","重":2,"域":["luoxia"],"境界":[0,4],"段":["{天象}那日，{地点}的树上落满了{妖异}，黑压压一片，把半边山的赤色都盖住了。它们不叫，只是盯着来往的人，眼珠子红得发亮，像山石上点了几百点火星。","本地人说{妖异}不啄活人，只啄将死的人。前些年有个商队在这里歇脚，鸦群落在车顶上不肯走，第二天整队人都死在关下的破庙里，尸首上全是眼睛大的洞。这话说得平静，好像死人是件迟早的事。","你走过树下时，鸦群齐齐偏过头来。{人物}从后面赶上来，压低声音说：别抬头，别跟它们对眼。它们认的不是人，是气。你快死的时候，气会先散，它们看得见。","{人物}话没说完，鸦群忽然腾起一片，绕着你头顶转了三圈，又落回原处。他的脸一下白了。"],"择":[{"名":"强走","文":"你硬着头皮往前赶，一路没回头。走出二十里，鸦声才断。当夜你在关下客栈里听见隔壁有人咳血，天亮时人已经凉了，窗户上落着两只赤鸦。你摸了摸自己的气脉，什么也没摸出来，只摸到满手的冷汗。多年后你还记得那三圈——它们究竟看见了什么。","果":{"悟性":2,"道心":1,"寿元":-4,"修为":40}},{"名":"问它","文":"你偏过头去，与最近的那只对了一眼。那一眼极短，你却看见了一片焦黑的山、一柄插在土里的剑，还有一个背对着你的人。鸦群忽然散了，散得干干净净。{人物}松了口气，说你命硬。你没说话，那画面里的背影你认得，是他。你什么也没问，他也什么也没提。","果":{"悟性":4,"因果":2,"道心":1}},{"名":"驱鸦","文":"你抬手一挥，把最近那只打落在地。鸦群轰然炸起，天上黑成一片，随即像雨一样扑下来。你被啄得满头是血，连滚带爬地冲进山坳，{人物}提剑替你断后。那一夜他伤了眼睛。你替他上药时，他一句怨言也没有，只说：它们记仇，你跟它们计较什么。","果":{"气血":-20,"因果":3,"声望":-2,"修为":30}}]},{"id":"luoxia_024","题":"丹毒入水","类":"灾祸","重":2,"域":["luoxia"],"境界":[0,5],"段":["{地点}的水脉下游有几个村子，这几日村里人身上起赤斑，一个个像被火燎过。你下到村里时，{人物}正蹲在井边取样，抬头说了一句：不是瘟，是丹毒。","{人物}说前几天有人在{地点}上游倒了废丹渣，整整十七车。丹霞观炼丹的废渣本就该焚埋，可焚埋要钱，埋一处要花三份灵石，倒进水里一文不花。他指着井口：你看看水，还是清的，可毒早化在里头了。","{天象}照在村口，几个孩子的脸上爬满赤斑，却还在笑。老人的手背上皮肤干裂，裂口边缘泛着不自然的红。你忽然想起前些日子在丹霞观看到的那些封了火漆的空药囊，堆在墙角，没人管。","村里人围上来，问有没有救。{人物}看着你，不说话——他知道你有法子，可法子要花钱，也要得罪人。"],"择":[{"名":"断上游水源","文":"你连夜上山，把泉眼上游的溪道改开，引水绕过丹霞观的排水口，又用赤岩堵了那段暗渠。三日后村里的赤斑开始退，你却被丹霞观告到了西岭商会，说你毁其水权，赔了一大笔。你拿着赔款的字据站在村口，孩子们围着你笑，老人往你怀里塞了一篮火枣。这笔账，你算得清，也不后悔。","果":{"灵石":-200,"声望":8,"因果":-3,"道心":2}},{"名":"报官","文":"你把井水样封好，送去西岭关报官。官府收了样，说三日后查，三日后又推七日，七日后不了了之。你再去问，人家只翻着眼皮说查无实据。那一年冬天村里死了十几个孩子，春天水脉自己清了。你在关下看见丹霞观的车队经过，车上装满新药，一路撒着香。","果":{"因果":3,"道心":-1,"悟性":1,"寿元":-3}},{"名":"自己解毒","文":"你花了两夜配了一味解毒的方子，用{灵材}熬成汤，一户一户送。毒是压下去了，可药钱是你自己垫的，人也累得脱了形。村里人凑钱还你，都是些零碎的铜子与灵谷，你收了。{人物}在旁边看着，最后说了一句：你能解这一村，解不了这一山。你听懂了，可你还是想先把这一村解完。","果":{"灵石":-120,"灵材":-1,"声望":7,"修为":60,"道心":2,"气血":-10}}]},{"id":"luoxia_025","题":"碑下残谱","类":"机缘","重":3,"域":["luoxia"],"境界":[0,5],"段":["{地点}的碑下常埋着东西，这是本地人都知道的秘密。你替{人物}修碑，锄头磕到一块硬物，挖出来是个油布包，包了三层，里头是一叠残页，页角被血浸成褐色。","{器物}里那叠残页上画的是一套剑式，起手极慢，收势极快，中间缺了两页。你试着比划了一下，第一式还没走完，胸口的旧伤就隐隐发疼。他凑过来看，脸色变了变，说这是当年那个死人的东西，这人死在崖下，剑却不在身边，三十年了没人找着。","{天象}开始泛红，碑影越来越长。你把残页收进怀里，指尖能感觉到纸上的血痕微微发烫。这种烫不似火，倒像是有人隔着三十年，把手按在了你手背上。","{人物}忽然说：这东西你带走，我当没看见。可你要是练了，就得替他把那柄剑找回来。"],"择":[{"名":"带走练","文":"你带走残页，在无人处照着练。缺的两页怎么也练不通，每练到那处，胸口便疼得像被剑穿。半年后你在一处旧货摊上看见一柄没有剑格的剑，剑柄缠着旧布，布上一道褐痕，与残页上的血是同一种颜色。你把它买下来，剑一到手，残页上缺的那两页，你竟自己补了出来。","果":{"修为":200,"悟性":3,"功法":1,"因果":2,"器物":1}},{"名":"焚了","文":"你把残页点着，看着它在碑前烧成灰。火苗窜起时带着一点极淡的青色，不像是寻常的火。{人物}在旁念了一句没人听懂的话，把灰扫进碑脚的土里。那年冬天你在梦里见到一个背对着你的人影，一直站着，不说话，也不走。醒来后你觉得胸口松了，只是从此再不碰剑招。","果":{"道心":3,"因果":-2,"悟性":2,"寿元":6}},{"名":"交给剑宗","文":"你把残页送上赤霄峰。剑堂的长老看了不到一炷香，忽然站起身来，问你在哪儿挖的。你说了一遍，他沉默很久，最后让人给你记了一笔功，说这套剑式原是宗里失传的东西，当年那个弟子偷了下山，死在崖下，剑也不见了。你带着一笔赏赐下山，心里却比来时更空。","果":{"灵石":180,"声望":5,"修为":40,"因果":-1}}]},{"id":"luoxia_026","题":"断剑问心","类":"修行","重":2,"域":["luoxia"],"境界":[3,9],"段":["你在{地点}坐了七日，只为想明白一件事：剑断了，剑意还在不在。{人物}说赤霄剑宗三十年前有位老祖，被一柄断剑困了三百年，宗里没人敢动那柄剑，一动，整座赤霄峰都要跟着震。","第八日，{天象}，崖下的赤岩开始发声，像是有人在极深的地方磨刀。你睁眼时，一柄断锋插在三步之外，剑身断在六寸处，断口平滑，不像被折，倒像被人一口咬断的。剑意扑面而来，不是杀意，是一股长久的不甘。","你试着以神念去触，触到的一瞬，眼前浮起一片火海，火里有{妖异}的影子掠过：一个穿赤衣的人站在火里，手里拿着这柄剑，对面是成千上万的人。他站着没退，最后把剑横在自己颈上，剑断了，人也倒了。","断剑的意还在往外涌，{天象}也压了下来，像要问你什么。你神念已裂了一道缝，若答错，恐怕回不去。"],"择":[{"名":"答以不退","文":"你在神念里答了两个字：不退。剑意陡然一静，随即轰然散开，崖下磨刀的声音停了。你吐出一口血，血落在断剑上，断口处慢慢合起一寸。三日后你出关，境界未涨，可剑心通明，出手再无半分犹豫。赤霄峰那边当夜传出一声剑鸣，守山弟子都说是老祖醒了。","果":{"修为":400,"悟性":4,"道心":3,"气血":-30,"声望":6}},{"名":"答以不悔","文":"你说他不悔，只是不想再看见火。剑意久久不散，最后化成一缕极细的青烟，绕着断剑转了三圈便没了。你睁眼时剑身已经锈了，断口处落了一层赤灰。此后再没有人被这柄剑困住，而你也再练不成那种一往无前的剑，只会收、会让、会在最后一寸留手。这样的剑慢，却也长。","果":{"修为":200,"道心":4,"悟性":3,"寿元":15}},{"名":"夺意","文":"你贪那剑意，硬生生以神念去吞。剑意反噬，眼前火海扑面而来，你在火里站了不知多久，等爬起来时，掌心里多了一道断口的形状，像被人握过。修为暴涨，可你开始怕火，怕红，怕黄昏。你能感觉到那柄断剑的意在你的经脉里游走，像一条认了主又不忘旧主的蛇。","果":{"修为":500,"魔念":3,"气血":-40,"道心":-3,"因果":2}}]},{"id":"luoxia_027","题":"观主的请托","类":"宗门","重":3,"域":["luoxia"],"境界":[1,6],"段":["{宗门}的知客把你请进丹房时，炉上正温着一壶茶。{人物}亲自替你斟了一盏，说听闻你近来在西岭一带走动，路子广。茶是好茶，香气里掺着一丝极淡的药味，你没喝。","{人物}说观里有一批丹要送去北边，路不好走，想请你押一趟。酬劳开得极厚，厚到你心里先起了疑。你问他为什么不找赤霄剑宗，他笑得很和气：剑宗的人太直，遇事只会动手，不如你这样的人，遇事想得多。","{天象}从丹房的窗格漏进来，把墙上那一排药囊照得半明半暗。你注意到角落里有只空药囊，封口的火漆是新揭的，囊底还残留一点赤色的药粉，气味与茶里那一丝极像。","{人物}放下茶盏，看着你：这趟活，接不接？"],"择":[{"名":"接","文":"你押着那车丹走了七天，路上果然遇了两拨人，都退得快。到了地方验货时，你才发现在最底层压着三只封得极严的木匣，匣上的印记和别的不一样。你把这事记在心里，回去交了差。他给的酬劳一分不少，还多添了一份。从那天起你成了丹霞观的常客，只是每次喝茶，都要等他先喝一口。","果":{"灵石":320,"声望":4,"因果":2,"悟性":1}},{"名":"推了","文":"你说这茶太香，香得不敢喝。他脸上的笑没变，只是把盏搁下，说可惜。你走出丹霞洞天时，守门的道士看你的眼神已经不同。此后你在山里处处受阻：药买不到好的，路被“封”了，连住处都被退了租。你熬了半年才明白，这山上最狠的一刀从来不用剑。","果":{"因果":-1,"道心":2,"声望":-5,"灵石":-60}},{"名":"换条件","文":"你说活可以接，但路上若有差池，观里要担一半。他饶有兴致地看你半晌，最后竟真的写了字据。那趟货在半路遇袭，你按字据把损失推了一半回去，丹霞观的脸面上不好看，却也没赖账。你不算赢了，只是从此在这山里，你被当成一个可以谈的人，而不是一个可以用的。","果":{"灵石":260,"声望":6,"悟性":3,"因果":1}}]},{"id":"luoxia_028","题":"地火窟三层","类":"秘境","重":2,"域":["luoxia"],"境界":[2,8],"段":["{地点}底下有个洞窟，一共三层，越往下越热。第一层能站人，第二层只能蹲着走，第三层据说连赤岩都能熔成汁。你在洞
